# hemisync-web's declaration to the platform (SEB schema/app.schema.json): what it runs, where its
# manifests are, which secrets it reads. SEB's secret seeding and health checks are driven by it.
schema: seb.app/v1
key: hemisync-web
name: hemisync-web
displayName: Hemi-Sync
namespace: hemisync-web
note: >-
  The Hemi-Sync România site (Hono + server-rendered TSX). Staging host hemisync.psizone.ro; hemi-sync.ro is not
  claimed (it is outside the estate's one zone: SEB extra zones or the edge bridge, per the plan).
  The guide's knowledge base is a per-pod libSQL file seeded by the seed-knowledge initContainer.
components:
  - name: hemisync-web
    path: apps/hemisync-web
    namespace: hemisync-web
    gitops: gitops/services/hemisync-web
    image: psi/hemisync-web
    build:
      workflow: apps.yml
      dockerfile: apps/hemisync-web/Dockerfile
      context: .
    port: 8080
    services:
      - name: hemisync-web
        ports:
          - 80
    hosts:
      - prefix: hemisync
        exposure: public
        ingress: hemisync-web
        gate: "off"
    overlayImages:
      - psi/hemisync-web
    workloads:
      - name: hemisync-web
        kind: Deployment
        images:
          - psi/hemisync-web
        restartOnSecretChange: true
        envFrom:
          - hemisync-web-env
        requiredEnv:
          - OPENROUTER_API_KEY
        initContainers:
          - assert-secrets
          - seed-knowledge
        probes:
          startup:
            path: /healthz
            port: 8080
          readiness:
            path: /healthz
            port: 8080
          liveness:
            path: /healthz
            port: 8080
        resources:
          requests:
            cpu: 50m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 768Mi
externalSecrets:
  - name: harbor-pull
    namespace: hemisync-web
    target: harbor-pull
    manifest: gitops/services/hemisync-web/base/harbor-pull-externalsecret.yaml
    template:
      - .dockerconfigjson
  - name: hemisync-web-env
    namespace: hemisync-web
    target: hemisync-web-env
    manifest: gitops/services/hemisync-web/base/externalsecret.yaml
    extract:
      - apps/hemisync-web/env
secrets:
  - path: apps/hemisync-web/env
    owner: hemisync-web
    onChange:
      restart:
        - hemisync-web/hemisync-web
    keys:
      - name: OPENROUTER_API_KEY
        source:
          kind: env-file
          file: apps/hemisync-web/.env
          key: OPENROUTER_API_KEY
        readers:
          - kind: external-secret
            secret: hemisync-web/hemisync-web-env
            env: OPENROUTER_API_KEY
  - path: platform/harbor/pull
    owner: shared
    keys:
      - name: username
        readers:
          - kind: external-secret
            secret: hemisync-web/harbor-pull
            env: username
      - name: password
        readers:
          - kind: external-secret
            secret: hemisync-web/harbor-pull
            env: password
groups: []
ci:
  workflows:
    - file: apps.yml
      images:
        - psi/hemisync-web
      buildArgs:
        - REGISTRY_HOST
        - REGISTRY_PROJECT_MIRROR
      bumps:
        - gitops/services/hemisync-web
health:
  secretChecks:
    - label: hemisync-web
      externalSecret: hemisync-web/hemisync-web-env
      secret: hemisync-web-env
      keys:
        - OPENROUTER_API_KEY
  buildVarChecks: []
  convexEnvChecks: []
docs:
  appSecretsRows:
    - "`hemisync-web`"
  paths:
    - apps/hemisync-web/env
    - platform/harbor/pull
  keys:
    - OPENROUTER_API_KEY
findings: []
