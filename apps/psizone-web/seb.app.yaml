# psizone-web's declaration to the platform (SEB schema/app.schema.json): what it runs, where its
# manifests are, which secrets it reads. SEB's secret seeding and health checks are driven by it.
schema: seb.app/v1
key: psizone-web
name: psizone-web
displayName: Psizone
namespace: psizone-web
note: >-
  The Psizone site (Hono + server-rendered TSX). Staging host nou.psizone.ro until the owner
  repoints the apex (DNS_APEX foreign: the estate never writes psizone.ro or www). The guide's
  knowledge base is a per-pod libSQL file seeded by the seed-knowledge initContainer.
components:
  - name: psizone-web
    path: apps/psizone-web
    namespace: psizone-web
    gitops: gitops/services/psizone-web
    image: psi/psizone-web
    build:
      workflow: apps.yml
      dockerfile: apps/psizone-web/Dockerfile
      context: .
    port: 8080
    services:
      - name: psizone-web
        ports:
          - 80
    hosts:
      - prefix: nou
        exposure: public
        ingress: psizone-web
        gate: "off"
    overlayImages:
      - psi/psizone-web
    workloads:
      - name: psizone-web
        kind: Deployment
        images:
          - psi/psizone-web
        restartOnSecretChange: true
        envFrom:
          - psizone-web-env
        requiredEnv:
          - OPENROUTER_API_KEY
        initContainers:
          - assert-secrets
          - seed-knowledge
        probes:
          startup:
            path: /healthz
            port: 8080
          readiness:
            path: /healthz
            port: 8080
          liveness:
            path: /healthz
            port: 8080
        resources:
          requests:
            cpu: 50m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 768Mi
externalSecrets:
  - name: harbor-pull
    namespace: psizone-web
    target: harbor-pull
    manifest: gitops/services/psizone-web/base/harbor-pull-externalsecret.yaml
    template:
      - .dockerconfigjson
  - name: psizone-web-env
    namespace: psizone-web
    target: psizone-web-env
    manifest: gitops/services/psizone-web/base/externalsecret.yaml
    extract:
      - apps/psizone-web/env
secrets:
  - path: apps/psizone-web/env
    owner: psizone-web
    onChange:
      restart:
        - psizone-web/psizone-web
    keys:
      - name: OPENROUTER_API_KEY
        source:
          kind: env-file
          file: apps/psizone-web/.env
          key: OPENROUTER_API_KEY
        readers:
          - kind: external-secret
            secret: psizone-web/psizone-web-env
            env: OPENROUTER_API_KEY
  - path: platform/harbor/pull
    owner: shared
    keys:
      - name: username
        readers:
          - kind: external-secret
            secret: psizone-web/harbor-pull
            env: username
      - name: password
        readers:
          - kind: external-secret
            secret: psizone-web/harbor-pull
            env: password
groups: []
ci:
  workflows:
    - file: apps.yml
      images:
        - psi/psizone-web
      buildArgs:
        - REGISTRY_HOST
        - REGISTRY_PROJECT_MIRROR
      bumps:
        - gitops/services/psizone-web
health:
  secretChecks:
    - label: psizone-web
      externalSecret: psizone-web/psizone-web-env
      secret: psizone-web-env
      keys:
        - OPENROUTER_API_KEY
  buildVarChecks: []
  convexEnvChecks: []
docs:
  appSecretsRows:
    - "`psizone-web`"
  paths:
    - apps/psizone-web/env
    - platform/harbor/pull
  keys:
    - OPENROUTER_API_KEY
findings: []
