# psizone-web's declaration to the platform (SEB schema/app.schema.json): what it runs, where its
# manifests are, which secrets it reads. SEB's secret seeding (seb.seed.sh beside this file, run by
# seed-secrets.sh) and doctor's health checks (doctor/plan.mjs) are derived from it. A public site:
# no sign-in, no groups.
schema: seb.app/v1
key: psizone-web
name: psizone-web
displayName: Psizone
namespace: psizone-web
note: "Psizone's public site (landing.psizone.ro): the clinic's pages, the guide, the callback and booking forms."
components:
  - name: psizone-web
    path: apps/psizone-web
    namespace: psizone-web
    gitops: gitops/services/psizone-web
    image: psi/psizone-web
    build:
      workflow: .github/workflows/apps.yml
      dockerfile: apps/psizone-web/Dockerfile
      context: .
    port: 3000
    hosts:
      - prefix: landing
        exposure: public
        ingress: psizone-web
    overlayImages:
      - psi/psizone-web
    workloads:
      - name: psizone-web
        kind: Deployment
        images:
          - psi/psizone-web
        restartOnSecretChange: true
        envFrom: [psizone-web-env, psizone-web-scheduling, psizone-web-mail]
        requiredEnv:
          - CHROMA_API_KEY
          - OPENROUTER_API_KEY
          - SCHEDULING_SERVICE_KEY
        initContainers: [assert-secrets]
        probes:
          readiness: { path: /, port: 3000 }
          liveness: { path: /, port: 3000 }
externalSecrets:
  - name: psizone-web-env
    namespace: psizone-web
    target: psizone-web-env
    manifest: gitops/services/psizone-web/base/externalsecret.yaml
  - name: psizone-web-scheduling
    namespace: psizone-web
    target: psizone-web-scheduling
    manifest: gitops/services/psizone-web/base/scheduling-externalsecret.yaml
  - name: psizone-web-mail
    namespace: psizone-web
    target: psizone-web-mail
    manifest: gitops/services/psizone-web/base/mail-externalsecret.yaml
  - name: harbor-pull
    namespace: psizone-web
    target: harbor-pull
    manifest: gitops/services/psizone-web/base/harbor-pull-externalsecret.yaml
secrets:
  - path: apps/psizone-web/env
    owner: psizone-web
    keys:
      - name: OPENROUTER_API_KEY
        source: { kind: literal }
        readers: [{ kind: external-secret, secret: psizone-web/psizone-web-env, env: OPENROUTER_API_KEY }]
      - name: CMS_API_KEY
        source: { kind: literal }
        readers: [{ kind: external-secret, secret: psizone-web/psizone-web-env, env: CMS_API_KEY }]
      - name: SCHEDULING_SERVICE_KEY
        source: { kind: literal }
        readers: [{ kind: external-secret, secret: psizone-web/psizone-web-env, env: SCHEDULING_SERVICE_KEY }]
  # The team's mail for callback requests: OPTIONAL, an EMPTY SLOT until the owner fills it
  # (estate/APP-SECRETS.md). seb.seed.sh creates the five keys empty, and only where absent.
  - path: apps/psizone-web/mail
    owner: psizone-web
    keys:
      - name: SMTP_HOST
        source: { kind: slot }
        readers: [{ kind: external-secret, secret: psizone-web/psizone-web-mail, env: SMTP_HOST }]
      - name: SMTP_USER
        source: { kind: slot }
        readers: [{ kind: external-secret, secret: psizone-web/psizone-web-mail, env: SMTP_USER }]
      - name: SMTP_PASSWORD
        source: { kind: slot }
        readers: [{ kind: external-secret, secret: psizone-web/psizone-web-mail, env: SMTP_PASSWORD }]
      - name: MAIL_FROM
        source: { kind: slot }
        readers: [{ kind: external-secret, secret: psizone-web/psizone-web-mail, env: MAIL_FROM }]
      - name: BOOKING_NOTIFY_TO
        source: { kind: slot }
        readers: [{ kind: external-secret, secret: psizone-web/psizone-web-mail, env: BOOKING_NOTIFY_TO }]
groups: []
consumes:
  - service: chroma
    env: [CHROMA_URL, CHROMA_API_KEY]
  - service: scheduling-api
    env: [SCHEDULING_API_URL, SCHEDULING_SERVICE_KEY]
  # The account's "my bookings" pages only (src/account.ts); every booking goes through scheduling-api.
  - service: scheduling-backend
    env: [CONVEX_URL, PSI_SCHEDULING_KEY]
ci:
  workflows:
    - file: .github/workflows/apps.yml
      images: [psi/psizone-web]
      buildArgs: [REGISTRY_HOST, REGISTRY_PROJECT_MIRROR]
      bumps: [gitops/services/psizone-web/overlays/dev/kustomization.yaml]
health:
  secretChecks:
    - label: psizone-web environment
      externalSecret: psizone-web/psizone-web-env
      secret: psizone-web-env
      keys: [CHROMA_API_KEY, OPENROUTER_API_KEY, SCHEDULING_SERVICE_KEY]
    # The mail: synced and its Secret present, every key a SLOT (empty until the owner configures
    # the team's mail), so the healthy unconfigured state is not refused. That the path EXISTS is
    # what keeps it synced; doctor's generic check refuses an absent one (SEB lib-es-paths.sh).
    - label: psizone-web team mail (optional)
      externalSecret: psizone-web/psizone-web-mail
      secret: psizone-web-mail
      keys: []
      slots: [BOOKING_NOTIFY_TO, MAIL_FROM, SMTP_HOST, SMTP_PASSWORD, SMTP_USER]
  buildVarChecks: []
  convexEnvChecks: []
docs:
  appSecretsRows: []
  paths: [apps/psizone-web/env, apps/psizone-web/mail]
  keys: []
findings: []
