# blog-web's declaration to the platform (SEB schema/app.schema.json): what it runs, where its
# manifests are, which secrets it reads. SEB's secret seeding and health checks are driven by it.
schema: seb.app/v1
key: blog-web
name: blog-web
displayName: Blog
namespace: blog-web
note: >-
  The shared blog of Psizone, EQ-SYNC and Hemi-Sync (Hono + server-rendered TSX). Staging host
  blog.psizone.ro until the brand sites proxy their pathBase to it in-cluster
  (docs/plans/blog-and-content.md: no public host in the end state). Requires no secret yet:
  OPENROUTER_API_KEY at apps/blog-web/env is optional and turns its guide on.
components:
  - name: blog-web
    path: apps/blog-web
    namespace: blog-web
    gitops: gitops/services/blog-web
    image: psi/blog-web
    build:
      workflow: apps.yml
      dockerfile: apps/blog-web/Dockerfile
      context: .
    port: 8080
    services:
      - name: blog-web
        ports:
          - 80
    hosts:
      - prefix: blog
        exposure: public
        ingress: blog-web
        gate: "off"
    overlayImages:
      - psi/blog-web
    workloads:
      - name: blog-web
        kind: Deployment
        images:
          - psi/blog-web
        restartOnSecretChange: true
        envFrom:
          - blog-web-env
        initContainers:
          - seed-knowledge
        probes:
          startup:
            path: /healthz
            port: 8080
          readiness:
            path: /healthz
            port: 8080
          liveness:
            path: /healthz
            port: 8080
        resources:
          requests:
            cpu: 50m
            memory: 384Mi
          limits:
            cpu: "1"
            memory: 768Mi
externalSecrets:
  - name: harbor-pull
    namespace: blog-web
    target: harbor-pull
    manifest: gitops/services/blog-web/base/harbor-pull-externalsecret.yaml
    template:
      - .dockerconfigjson
  - name: blog-web-env
    namespace: blog-web
    target: blog-web-env
    manifest: gitops/services/blog-web/base/externalsecret.yaml
    extract:
      - apps/blog-web/env
secrets:
  - path: apps/blog-web/env
    owner: blog-web
    onChange:
      restart:
        - blog-web/blog-web
    keys:
      # Optional: no external-secret reader, so no data[] entry and no assert. Read through the
      # Secret's dataFrom.extract when present.
      - name: OPENROUTER_API_KEY
  - path: platform/harbor/pull
    owner: shared
    keys:
      - name: username
        readers:
          - kind: external-secret
            secret: blog-web/harbor-pull
            env: username
      - name: password
        readers:
          - kind: external-secret
            secret: blog-web/harbor-pull
            env: password
groups: []
ci:
  workflows:
    - file: apps.yml
      images:
        - psi/blog-web
      buildArgs:
        - REGISTRY_HOST
        - REGISTRY_PROJECT_MIRROR
      bumps:
        - gitops/services/blog-web
health:
  secretChecks: []
  buildVarChecks: []
  convexEnvChecks: []
docs:
  appSecretsRows:
    - "`blog-web`"
  paths:
    - apps/blog-web/env
    - platform/harbor/pull
  keys: []
findings:
  - "blog-web has a public staging host (blog) although docs/plans/blog-and-content.md gives it none: no brand site proxies its pathBase yet"
  - "secret/apps/blog-web/env may not exist yet: until it does, the blog-web-env ExternalSecret reports SecretSyncedError (the pod reads it optionally and starts)"
