apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# PSI's additions to SEB's plane piece, passed to the renderer as the estate's layer
# (tools/estate-pieces.mjs --estate-components estate/seb-components).
patches:
  # psi 2026-11-12: request = measured peak 216Mi ×1.3; limit unchanged
  - target: { kind: Deployment, name: plane-api-wl }
    patch: |-
      - { op: test, path: /spec/template/spec/containers/0/name, value: plane-api }
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 320Mi }
