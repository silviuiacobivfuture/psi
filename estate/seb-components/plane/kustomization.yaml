apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# PSI's additions to SEB's plane piece, passed to the renderer as the estate's layer
# (tools/estate-pieces.mjs --estate-components estate/seb-components).
patches:
  # psi 2026-11-12: request = measured peak 216Mi ×1.3; limit unchanged
  - target: { kind: Deployment, name: plane-api-wl }
    patch: |-
      - { op: test, path: /spec/template/spec/containers/0/name, value: plane-api }
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 320Mi }
  # psi 2026-11-16: Celery's worker starts one fork per CPU when nothing says otherwise: 16 forks
  # of the whole Django app on this 16-core node, 1,167-1,177 Mi idle (the node's second-biggest
  # tenant, at 98% of its memory). psi's Plane serves a handful of people; two forks carry its
  # notifications, webhooks and imports. Celery 5's CLI reads CELERY_WORKER_CONCURRENCY
  # (auto_envvar_prefix "CELERY", checked in the running image: celery 5.5.3). Request = the two
  # forks' measured use plus a margin; the 2Gi limit is unchanged.
  - target: { kind: Deployment, name: plane-worker-wl }
    patch: |-
      - { op: test, path: /spec/template/spec/containers/0/name, value: plane-worker }
      # The chart's worker container has no env list (its settings come by envFrom), so the list is
      # added whole.
      - op: add
        path: /spec/template/spec/containers/0/env
        value: [{ name: CELERY_WORKER_CONCURRENCY, value: "2" }]
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 384Mi }
# Plane's backend: the piece's own pin, SEB's estate-neutral signed build of apps/plane-sso
# (plane-backend-sso/f3b7e20bfec6, the build that writes page versions again), copied into
# registry.psizone.ro/psi with its signature before the take. psi's override to 892a3ca6f441 went
# with SEB 0.1.219: it named an image the piece no longer pins and changed nothing. psi's mapping,
# brand and admin address reach it from plane-platform (PLANE_SSO_MAPPING_YAML, PLANE_SSO_BRAND,
# PLANE_SSO_ADMIN_EMAIL).
