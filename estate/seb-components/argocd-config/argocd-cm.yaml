apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  url: https://argocd.psizone.ro
  oidc.config: |
    name: Authentik
    issuer: https://auth.psizone.ro/application/o/argocd/
    clientID: $authentikClientID
    clientSecret: $authentikClientSecret
    requestedScopes:
      - openid
      - profile
      - email
      - groups
    requestedIDTokenClaims:
      groups:
        essential: true
