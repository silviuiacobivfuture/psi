apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# psi's own additions to the SEB piece argocd-config (installed by the bundle builder's / estate-pieces'
# --estate-components): Argo CD's public address and its sign-in through psi's Authentik.
# psi has no mesh (MESH: none), so Argo CD is served publicly at argocd.psizone.ro behind sign-in
# (gitops/services/doors), not on a tailnet name.
patches:
  - path: argocd-cm.yaml
  - path: ingress.yaml
