apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
metadata:
  name: psi-authentik-platform
# psi's layer for the SEB piece `authentik-platform`, its ONE copy: SEB's bundle builder composes it
# into the piece (estate/seb-upgrade.sh passes estate/seb-components to it as --estate-components).
#
# Read by the builder itself, before kustomize renders the piece (schema/slots/authentik-platform.yaml):
#   slots/people.yaml                    psi's people on its directory (blueprints-people.yaml)
#   rosters.yaml                         who of them is in which of SEB's groups (each group's `users`
#                                        REPLACES its membership: a name missing there is taken out)
#   slots/groups.yaml                    psi's own groups beside SEB's
#   slots/admin-groups.yaml              none: the rosters own every membership (psi 2026-11-12)
#   slots/mfa-validate.yaml, mfa-final.yaml   TOTP optional (fe0e0b5f)
#   slots/broker-name.yaml, broker-launch.yaml  the hub broker named WLBRAND and kept off the tiles
#   slots/forward-auth-name.yaml, hub-name.yaml the names psi shows
#   slots/mesh-absent.yaml               no mesh: Headscale's and Headplane's clients deleted
#   slots/browseruse*.yaml               no Browser-Use, no private-network twins: deleted
#   slots/convex-outposts.yaml           GENERATED (SEB tools/convex/tenant-gate.mjs)
#
# Rendered: clients/ (slots estate-blueprints and estate-clients: psi's cms and clinic sign-ins), look/
# (slot look: psi's sign-in stylesheet and its light ground), and
# the Convex data browsers' gate (slot convex-instances, GENERATED by tools/convex/tenant-gate.mjs).
#
# Out of slot (estate/seb-exceptions.yaml psi-old-safari-sfe): old-safari-sfe.yaml, Safari before 18
# sent to Authentik's simplified sign-in page, until psi takes the SEB release that carries it.
resources:
  - old-safari-sfe.yaml
components:
  - clients
  - look
patches:
  - path: blueprints-convex-instances.generated.yaml
