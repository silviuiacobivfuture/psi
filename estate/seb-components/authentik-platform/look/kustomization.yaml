apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# psi's own look on the sign-in where SEB's painter does not draw it (slot `look`, merged into the
# piece's authentik-estate ConfigMap), ONE copy: composed by ../kustomization.yaml.
#   psi.css           (file psi.generated.css: GENERATED from brand/signin-theme.json by SEB's
#                     authentik-assets painter, see that file's $comment) psi's sign-in stylesheet (106faaff): Psizone Night and Gold tokens, Fraunces and
#                     Manrope, pill buttons, psi's ambient field in place of the starfield. Served as
#                     <ESTATE_SLUG>.css; the theme blueprint reads it.
#   fundal-light.svg  the ambient field's light ground, which psi.css draws.
#   fundal.svg        the dark ground, in place of the painter's (2026-11-17): both are drawn with
#                     radial gradients, NOT an SVG blur filter, which older Safari could not carry
#                     behind the sign-in (about 250 MB more per page). Generated from
#                     brand/signin-theme.json by SEB's groundSvg as of SEB dev 2026-11-17; the painter
#                     of the SEB release after 0.1.148 draws the same, and this copy goes then.
#   app-cms.svg       the tile icon of psi's CMS (clients/blueprints-cms.yaml meta_icon): the CMS's
#                     own mark, the gradient orb apps/cms/src/components/brand/PsiMark.tsx draws.
#   app-clinic.svg    the tile icon of psi's clinic console, dev and production (clients/
#                     blueprints-clinic*.yaml meta_icon): the console's own favicon, byte for byte
#                     (apps/clinic/public/favicon.svg).
# Served at /static/dist/assets/psi/<file>, beside SEB's tile icons.
configMapGenerator:
  - name: authentik-estate
    behavior: merge
    options:
      disableNameSuffixHash: true
    files:
      - psi.css=psi.generated.css
      - fundal-light.svg
      - fundal.svg
      - app-cms.svg
      - app-clinic.svg
