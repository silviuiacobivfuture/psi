# psi's own groups in SEB's groups blueprint (slot `groups`, schema/slots/authentik-platform.yaml).
# The entry below is ANOTHER estate's console tenant group (the first estate on SEB): psi's blueprints
# carried it until f1158a2e ("no other estate's names or people"), and a blueprint never deletes what it
# stops declaring, so the group stayed in psi's Authentik with the operator in it. Polaris's console-access
# reads it as entitling the operator to a tenant psi does not have (2026-11-15). Declared absent here;
# once the group is gone from the live Authentik, the entry itself can be removed.
- model: authentik_core.group
  state: absent
  identifiers:
    name: autorizare-tenant-recomex
# Rho (the shared flows application): its one entitlement group, as the generated
# estate/authz/blueprints/blueprints-groups-flow.yaml declares it (@rule ORG-15) — members hold
# flow:super_admin on platform:psi. Declared here because psi mounts no generated blueprint.
- model: authentik_core.group
  identifiers:
    name: app-flow-super-admin
  attrs:
    is_superuser: false
    # its members are rosters.yaml's (the roster fills this list)
    users: []
