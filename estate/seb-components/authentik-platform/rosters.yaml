# psi's people in SEB's groups: SEB's tools/bundle/authentik-tree.mjs splices each list into the
# group's `users` (after SEB's people, before its first robot). A group's `users` REPLACES its
# membership, so a name missing here is a person taken out at the next apply.
# ESTATE ADMINS (owner, 2026-11-11 and 2026-11-12, Lucian Sergiu Trifan): full privileges, the same
# rosters as the operator. Removing a right removes that person's line under the group.
