apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# PSI's additions to SEB's plane-platform piece, passed to the renderer as the estate's layer
# (tools/estate-pieces.mjs --estate-components estate/seb-components).
#
#   email.generated.yaml  Plane's e-mail sender (EMAIL_*), from gitops/services/plunk/senders/plane.json.
#                         GENERATED by apps/plunk-sso/bin/email-sync.mjs --estate estate/seb-components/plunk.
#   sso-mapping.yaml      Plane's SSO mapping for PSI's workspaces (PLANE_SSO_MAPPING_YAML), a patch
#                         on SEB's plane-app-secrets.
resources:
  - email.generated.yaml
patches:
  - path: sso-mapping.yaml
  # psi 2026-11-12: request = measured peak 212Mi ×1.5 (database), kept ≥ shared_buffers 256MB + 128Mi; limit unchanged
  - target: { kind: Cluster, name: plane-db }
    patch: |-
      - { op: replace, path: /spec/resources/requests/memory, value: 384Mi }
