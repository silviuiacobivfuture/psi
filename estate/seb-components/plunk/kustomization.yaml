apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# PSI's additions to SEB's plunk piece, passed to the renderer as the estate's layer
# (tools/estate-pieces.mjs --estate-components estate/seb-components). SEB's default layer is
# empty, which leaves plunk-sso and plunk-reconcile without the ConfigMap they mount.
#
#   senders.generated.json  psi's senders (ConfigMap plunk-senders, mounted by plunk-sso and
#                           plunk-reconcile at /app/plunk-sso/config)
#   email.generated.yaml    Plunk's own sender (email-sender)
#                           both GENERATED by apps/plunk-sso/bin/email-sync.mjs
#                           --estate estate/seb-components/plunk from gitops/services/plunk/senders.
#   mapping.json            psi's group → role mapping (its service account is svc-plunk@psizone.ro,
#                           not the first estate's), read through PLUNK_SSO_MAPPING.
resources:
  - email.generated.yaml
configMapGenerator:
  - name: plunk-senders
    files:
      - senders.json=senders.generated.json
      - mapping.json=mapping.json
patches:
  - target: { kind: Deployment, name: plunk-sso }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: PLUNK_SSO_MAPPING, value: /app/plunk-sso/config/mapping.json }
  - target: { kind: CronJob, name: plunk-reconcile }
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
        value: { name: PLUNK_SSO_MAPPING, value: /app/plunk-sso/config/mapping.json }
  # psi 2026-11-12: request = measured peak 416Mi ×1.3; limit unchanged
  - target: { kind: Deployment, name: plunk }
    patch: |-
      - { op: test, path: /spec/template/spec/containers/1/name, value: plunk }
      - { op: replace, path: /spec/template/spec/containers/1/resources/requests/memory, value: 576Mi }
  # psi 2026-11-12: request = measured peak 35Mi ×1.3 (floor 64Mi); limit unchanged
  - target: { kind: Deployment, name: plunk-sso }
    patch: |-
      - { op: test, path: /spec/template/spec/containers/0/name, value: plunk-sso }
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 64Mi }
