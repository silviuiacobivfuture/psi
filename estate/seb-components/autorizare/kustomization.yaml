apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# PSI's additions to SEB's autorizare piece (Polaris and the sign-in hub), passed to the
# renderer as the estate's layer: tools/estate-pieces.mjs --estate-components estate/seb-components.
#
#   hub/clients.json      the hub's client registry — every application that signs in through
#                         sso.psizone.ro. PSI runs one today: Polaris's console. An application
#                         added to the estate adds its client here (and its secret path to
#                         seed-hub-clients.sh). Mounted at /estate/hub in the hub AND in Polaris,
#                         which reads the same file for the changelog, the bell and the search.
#   ../../../brand        the console's brand: the `estate-brand` ConfigMap Polaris refuses to start without.
#   email.generated.yaml  Polaris's sender (EMAIL_*), from gitops/services/plunk/senders/polaris.json.
#
# The estate's name on the hub's pages is its BRAND_TITLE, Psi. The hub's host label (sso) is
# the identity's HUB_HOST_PREFIX, which the piece reads from the whitelabel component.
resources:
  - email.generated.yaml

# psi's console brand (declaration, theme, icons), mounted at /estate-brand (brand/kustomization.yaml).
components:
  - ../../../brand

configMapGenerator:
  - name: estate-hub-registry
    files:
      - clients.json=hub/clients.json

patches:
  - target: { kind: ConfigMap, name: autorizare-hub-config }
    patch: |-
      - op: add
        path: /data/ESTATE_NAME
        value: "Psi"
      - op: add
        path: /data/HUB_CLIENTS_FILE
        value: "/estate/hub/clients.json"
      # PSI SETTING: TOTP OPTIONAL — TOTP disabled by owner 2026-11-12, temporary. Authentik asks
      # for a code only from people who added an authenticator themselves
      # (gitops/platform/authentik/blueprints-mfa.yaml, "PSI SETTING: TOTP OPTIONAL"), so a
      # password-only sign-in is a normal one and the hub must not refuse it for lacking "mfa".
      # Turn back on with "true" here (and in the hub's annotation below) AND `configure` there.
      - op: replace
        path: /data/HUB_REQUIRE_MFA
        value: "false"
  - target: { kind: ConfigMap, name: autorizare-config }
    patch: |-
      - op: add
        path: /data/HUB_CLIENTS_FILE
        value: "/estate/hub/clients.json"
      # The estate's own organisation (docs/autorizare/07 "An application's program"): „Psi”
      # (slug psi), founded on 2026-11-12 through Polaris's own CreateOrg, with an administrator
      # invitation for the operator (silviu.iacob@ivfuture.ro). An organisation is created through
      # Polaris, so it could not exist before Polaris first ran.
      - op: replace
        path: /data/ESTATE_ORG_ID
        value: "o-01a1ce922e3d71f990932be31d8d07fb"
  - target: { kind: Deployment, name: autorizare-hub }
    patch: |-
      # The hub reads its ConfigMap at start only; this restarts it when the TOTP setting above changes.
      - op: add
        path: /spec/template/metadata/annotations
        value: { psi.estate/hub-require-mfa: "false" }
      - op: add
        path: /spec/template/spec/volumes
        value:
          - { name: estate-hub-registry, configMap: { name: estate-hub-registry } }
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - { name: estate-hub-registry, mountPath: /estate/hub, readOnly: true }
  - target: { kind: Deployment, name: autorizare-svc }
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value: { name: estate-hub-registry, configMap: { name: estate-hub-registry } }
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: { name: estate-hub-registry, mountPath: /estate/hub, readOnly: true }
  # psi runs one server with ~70% of its memory reserved: one hub and one control plane, not SEB's
  # three each. Their disruption budgets follow, or a budget of two would block every node drain
  # (system-upgrade's k3s upgrades drain the only node).
  - target: { kind: Deployment, name: "autorizare-(hub|svc)" }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: { kind: PodDisruptionBudget, name: "autorizare-(hub|svc)" }
    patch: |-
      - op: remove
        path: /spec/minAvailable
      - op: add
        path: /spec/maxUnavailable
        value: 1
