# Rho's Convex instance (the shared flows application, FLOWS_APP psi-flows), in namespace
# convex-psi-flows.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: convex-psi-flows
resources:
  - instance.yaml
components:
  - ../../instance
# psi 2026-11-16: requests to measured use plus a margin (the node sat at 98% requested); limits
# unchanged. Backend 768Mi -> 576Mi (408-430 Mi measured). Database 512Mi -> 384Mi (128-148 Mi
# measured), kept at shared_buffers 256MB + 128Mi as nextcloud-db is.
patches:
  - target: { kind: Deployment, name: convex-backend }
    patch: |-
      - { op: test, path: /spec/template/spec/containers/0/name, value: backend }
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 576Mi }
  - target: { kind: Cluster, name: convex-db }
    patch: |-
      - { op: replace, path: /spec/resources/requests/memory, value: 384Mi }
