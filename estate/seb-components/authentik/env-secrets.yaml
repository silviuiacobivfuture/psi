# psi's own sign-in clients (estate/seb-components/authentik-platform/clients/), read as env by their
# blueprints. OPTIONAL so a missing client never holds the directory down; the doctor grades each
# (apps/cms/seb.app.yaml, apps/clinic/seb.app.yaml) and its provider shows an empty client id meanwhile.
- secretRef:
    name: authentik-cms-oidc
    optional: true
- secretRef:
    name: authentik-clinic-oidc
    optional: true
# The production console's own client, OPTIONAL likewise.
- secretRef:
    name: authentik-clinic-prod-oidc
    optional: true
