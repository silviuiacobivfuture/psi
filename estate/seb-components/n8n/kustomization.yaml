apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# PSI's additions to SEB's n8n piece, passed to the renderer as the estate's layer
# (tools/estate-pieces.mjs --estate-components estate/seb-components).
#
#   email.generated.yaml  n8n's e-mail sender (EMAIL_*), from gitops/services/plunk/senders/n8n.json.
#                         GENERATED by apps/plunk-sso/bin/email-sync.mjs --estate estate/seb-components/plunk.
resources:
  - email.generated.yaml
patches:
  # psi 2026-11-12: request = measured peak 6Mi ×1.3 (floor 64Mi); limit unchanged
  - target: { kind: Deployment, name: n8n-runner }
    patch: |-
      - { op: test, path: /spec/template/spec/containers/0/name, value: runner }
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 64Mi }
