apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# PSI's additions to SEB's novu piece, passed to the renderer as the estate's layer
# (tools/estate-pieces.mjs --estate-components estate/seb-components).
#
#   mapping.json  psi's Authentik group → Novu role mapping (version 2: groups and roles; the
#                 organisation and account come from psi's identity since SEB 0.1.61). Older images
#                 baked the first estate's organisation, so every sign-in was refused; "Psi" (MAIL_SENDER_NAME, the
#                 one novu-bootstrap.sh creates), service account ops@psizone.ro (secret/apps/novu/admin).
#                 Mounted into novu-sso and read through NOVU_SSO_MAPPING (apps/novu-sso/lib/config.mjs).
#   the tailnet doors (Ingresses novu-dashboard and novu-api-tailnet, class tailscale) are removed:
#                 psi has no mesh (MESH: none, no tailscale operator), so they never get an address
#                 and held the Application Progressing forever. Novu's break-glass on psi is a
#                 port-forward to svc/novu-api, as novu-bootstrap.sh already does.
configMapGenerator:
  - name: novu-sso-mapping
    files:
      - mapping.json=mapping.json
patches:
  - target: { kind: Deployment, name: novu-sso }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: NOVU_SSO_MAPPING, value: /estate/novu-sso/mapping.json }
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: { name: estate-mapping, mountPath: /estate/novu-sso, readOnly: true }
      - op: add
        path: /spec/template/spec/volumes/-
        value: { name: estate-mapping, configMap: { name: novu-sso-mapping } }
  - target: { kind: Ingress, name: novu-dashboard }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata: { name: novu-dashboard }
  - target: { kind: Ingress, name: novu-api-tailnet }
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata: { name: novu-api-tailnet }
  # psi 2026-11-12: request = measured peak 69Mi ×1.3; limit unchanged
  - target: { kind: Deployment, name: novu-sso }
    patch: |-
      - { op: test, path: /spec/template/spec/containers/0/name, value: novu-sso }
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 96Mi }
  # psi 2026-11-12: request = measured peak 38Mi ×1.3 (floor 64Mi); limit unchanged
  - target: { kind: Deployment, name: novu-bridge }
    patch: |-
      - { op: test, path: /spec/template/spec/containers/0/name, value: novu-bridge }
      - { op: replace, path: /spec/template/spec/containers/0/resources/requests/memory, value: 64Mi }
# Slot `image` (schema/slots/novu.yaml): the tag of the novu-bridge image psi built
# (scripts/estate-images.sh, psi's estate declaration painted in), sha256:345f2985… (built from SEB 0.1.80; its sources are unchanged in 0.1.82) in
# registry.psizone.ro/psi. The generated Application sets it (estate/seb-image-tags.mjs).
images:
  - name: WLREGISTRY/WLAPPS/novu-bridge
    newTag: ac4e74fd0
