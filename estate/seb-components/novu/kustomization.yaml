apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# PSI's additions to SEB's novu piece, passed to the renderer as the estate's layer
# (tools/estate-pieces.mjs --estate-components estate/seb-components).
#
#   mapping.json  psi's Authentik group → Novu role mapping. The image bakes the first estate's
#                 (organisation "RecomExpert"), which psi's Novu does not have, so every sign-in
#                 was refused with no-organization. Here: organisation "Psi" (MAIL_SENDER_NAME, the
#                 one novu-bootstrap.sh creates), service account ops@psizone.ro (secret/apps/novu/admin).
#                 Mounted into novu-sso and read through NOVU_SSO_MAPPING (apps/novu-sso/lib/config.mjs).
configMapGenerator:
  - name: novu-sso-mapping
    files:
      - mapping.json=mapping.json
patches:
  - target: { kind: Deployment, name: novu-sso }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: NOVU_SSO_MAPPING, value: /estate/novu-sso/mapping.json }
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: { name: estate-mapping, mountPath: /estate/novu-sso, readOnly: true }
      - op: add
        path: /spec/template/spec/volumes/-
        value: { name: estate-mapping, configMap: { name: novu-sso-mapping } }
