# Every Tehnic tile WITHOUT a screen, gathered last (owner, 2026-11-12: "there
# isn't really a distinction between what is a UI service and a back service").
# The sections above hold only what a person opens; each tile here names its
# section first. custom.css marks these cards "doar stare" and never as links.
- Rulează în fundal:
    # No UI and no link, and it must stay that way: the Nx remote cache speaks
    # a four-verb HTTP protocol to `nx` behind a bearer token shared by every CI
    # job. When it is down nothing BREAKS, builds just get slow — hence the status.
    - Cache-ul de build:
        icon: si-nx
        description: "Livrare: Cache Nx la distanță — fără interfață, citit de fiecare job CI"
        namespace: nx-cache
        app: nx-cache
        podSelector: app=nx-cache
    # The arc-runners namespace: its runner pods exist only while a job runs, so the
    # status follows the scale set's listener (arc-systems), which is what starts them.
    - Runner-ele CI:
        icon: si-githubactions
        description: "Livrare: Pornesc runner-ele pentru fiecare job CI, la cerere — fără interfață · ARC runner scale set"
        namespace: arc-systems
        app: arc-runners
        podSelector: app.kubernetes.io/component=runner-scale-set-listener,actions.github.com/scale-set-namespace=arc-runners
    # No Ingress by design: its API auth is an unscoped preshared key. Every
    # application asks it whether an action is permitted, so its status going
    # dark is the first sign authorization has stopped everywhere.
    - Motorul de autorizare:
        icon: mdi-key-chain-variant
        description: "Acces și securitate: Răspunde fiecărei aplicații dacă o acțiune e permisă — fără interfață · OpenFGA"
        namespace: openfga
        app: openfga
        podSelector: app=openfga
    - Sincronizarea secretelor:
        icon: mdi-key-arrow-right
        description: "Acces și securitate: Aduce secretele din OpenBao în cluster · External Secrets"
        namespace: external-secrets
        app: external-secrets
        podSelector: app.kubernetes.io/name=external-secrets
    - Alerte în Talk:
        icon: mdi-bell-badge-outline
        description: "Comunicare și automatizări: Transformă alertele platformei în mesaje Talk — fără interfață"
        namespace: nextcloud
        app: nextcloud
        podSelector: app.kubernetes.io/name=talk-webhook
    - Apeluri video:
        icon: mdi-video-outline
        description: "Comunicare și automatizări: Serverul de semnalizare pentru apelurile Talk — fără interfață · Talk HPB"
        namespace: talk-hpb
        app: talk-hpb
        podSelector: app.kubernetes.io/name=talk-hpb
    - Editarea documentelor:
        icon: si-collaboraonline
        description: "Comunicare și automatizări: Deschide documentele Office din Fișiere — fără interfață · Collabora"
        namespace: nextcloud
        app: nextcloud
        podSelector: app.kubernetes.io/name=collabora
    # Its API answers only with a token; a browser has nothing to open there.
    - Memoria ghidului AI:
        icon: mdi-vector-polyline
        description: "Comunicare și automatizări: Baza de date vectorială a site-urilor — doar prin API, cu token · Chroma"
        namespace: chroma
        app: chroma
        podSelector: app=chroma
    - Jurnale și urme:
        icon: si-opentelemetry
        description: "Monitorizare: Colectarea jurnalelor și a urmelor (agent și colector) · OpenTelemetry"
        namespace: observability
        app: observability
        podSelector: app in (otel-agent,otel-cluster)
    # A CronJob: no pod lives between runs, so no status.
    - Raportul zilnic:
