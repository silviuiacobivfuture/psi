apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# PSI's additions to SEB's nextcloud-platform piece, passed to the renderer as the estate's layer
# (tools/estate-pieces.mjs --estate-components estate/seb-components).
#
#   email.generated.yaml  Nextcloud's e-mail sender (EMAIL_*), from gitops/services/plunk/senders/cloud.json.
#                         GENERATED by apps/plunk-sso/bin/email-sync.mjs --estate estate/seb-components/plunk.
#   the patch below       psi's own Nextcloud apps (NC_APPS) and the External sites links
#                         (NC_EXTERNAL_SITES), set on SEB's occ reconcile, which installs, enables
#                         and re-asserts them every 15 minutes. Both checked against the app store
#                         for Nextcloud 34 (2026-11-12). Removing an app here does not disable it.
resources:
  - email.generated.yaml
patches:
  # By position, guarded: the `test` refuses the render if SEB moves the variable.
  - target: { kind: CronJob, name: nextcloud-occ-reconcile }
    patch: |-
      - { op: test, path: /spec/jobTemplate/spec/template/spec/containers/0/env/22/name, value: NC_APPS }
      - { op: replace, path: /spec/jobTemplate/spec/template/spec/containers/0/env/22/value, value: "dicomviewer forms external integration_giphy announcementcenter notes" }
      - { op: test, path: /spec/jobTemplate/spec/template/spec/containers/0/env/23/name, value: NC_EXTERNAL_SITES }
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/23/value
        value: '{"1":{"id":1,"name":"PSIZONE","url":"https://psizone.ro","lang":"","type":"link","device":"","icon":"external.svg","groups":[],"redirect":true},"2":{"id":2,"name":"EQ-SYNC","url":"https://eqsync.psizone.ro","lang":"","type":"link","device":"","icon":"external.svg","groups":[],"redirect":true},"3":{"id":3,"name":"Hemi-Sync","url":"https://hemisync.psizone.ro","lang":"","type":"link","device":"","icon":"external.svg","groups":[],"redirect":true},"4":{"id":4,"name":"Blog","url":"https://blog.psizone.ro","lang":"","type":"link","device":"","icon":"external.svg","groups":[],"redirect":true}}'
  # psi 2026-11-12: request = measured peak 204Mi ×1.5 (database), kept ≥ shared_buffers 256MB + 128Mi; limit unchanged
  - target: { kind: Cluster, name: nextcloud-db }
    patch: |-
      - { op: replace, path: /spec/resources/requests/memory, value: 384Mi }
