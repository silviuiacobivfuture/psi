# PSI — the second estate (psizone.ro). The zone already holds the owner's own records
# (a site at the apex and www, mail, tunnels): the estate never writes the apex.
#   infrastructure/hetzner/scripts/genesis.sh dev --identity estate/identity.yaml --dry-run

# ── identity ────────────────────────────────────────────────────────────────
BASE_DOMAIN: psizone.ro
ESTATE_SLUG: psi
ESTATE_NAME: PSI
BRAND_TITLE: Psi
ESTATE_LOCALE: en
OPS_EMAIL: ops@psizone.ro
ACME_EMAIL: certificates@psizone.ro
MAIL_DOMAIN: psizone.ro
MAIL_SENDER_NAME: Psi
ESTATE_LABEL_DOMAIN: psizone.ro
BRAND_ASSETS_DIR: brand
OPERATOR_USERNAME: silviu
OPERATOR_NAME: Silviu Iacob
OPERATOR_EMAIL: silviu.iacob@ivfuture.ro

# ── cloud ───────────────────────────────────────────────────────────────────
HCLOUD_LOCATION: nbg1
CONTROL_PLANE_SERVER_TYPE: dev=cpx62
AGENT_SERVER_TYPE: dev=cpx62
AGENT_COUNT: dev=0
# The control plane runs 114 pods, above the kubelet's default 110 (SEB KUBELET_MAX_PODS).
KUBELET_MAX_PODS: 250
OBJECT_STORAGE_REGION: nbg1
OBJECT_STORAGE_ENDPOINT: https://nbg1.your-objectstorage.com
BUCKET_PREFIX: psi
DNS_PROVIDER: cloudflare
DNS_ZONE: psizone.ro
DNS_APEX: foreign
SES_REGION: eu-central-1
REGISTRY_HOST: registry.psizone.ro
REGISTRY_PROJECT_APPS: psi
REGISTRY_PROJECT_MIRROR: mirror
GIT_HOST: github.com
GIT_OWNER: silviuiacobivfuture
GIT_REPO: psi
# The runner scale set registers at the repository: a personal account takes repository runners
# only (SEB CI_RUNNER_CONFIG_URL; the owner, the default, refuses them).
CI_RUNNER_CONFIG_URL: https://github.com/silviuiacobivfuture/psi
# No mesh at all (owner, 2026-11-11): no Headscale or Tailscale, no mesh DNS records.
MESH: none
ENVIRONMENTS: dev

# ── platform apps: the first estate's full platform set ─────────────────────
PLATFORM_APPS: authentik,autorizare,harbor,plane,novu,n8n,plunk,test-reports,pdfcraft,affine,stalwart,invoicing,flows,register,notifier
AUTHENTIK_HOST_PREFIX: auth
AUTORIZARE_HOST_PREFIX: access
HARBOR_HOST_PREFIX: registry
PLANE_HOST_PREFIX: plane
NOVU_HOST_PREFIX: notify
# The estate notifier (SEB pieces/notifier), every alert source's one address; psi runs no chat, so its
# routes are e-mail to ops@ (estate/seb-components/notifier/routes.json). Not `notify`: Novu holds it.
NOTIFIER_HOST_PREFIX: notifier
# psi's own Novu bridge (apps/notify-bridge: the workflows of @psi/notify, holding the estate key apps/novu/estate)
# in place of SEB's: Novu syncs and calls it, and its in-cluster address is what Novu's SSRF allow list admits.
NOVU_BRIDGE_URL: http://notify-bridge.notify-bridge.svc.cluster.local:8080/api/novu
N8N_HOST_PREFIX: flows
PLUNK_HOST_PREFIX: plunk
REPORTPORTAL_HOST_PREFIX: reports
TEST_REPORTS_HOST_PREFIX: tests
PDFCRAFT_HOST_PREFIX: pdf
AFFINE_HOST_PREFIX: docs
MAIL_HOST_PREFIX: mx
# The people's mailboxes are <first name>@psizone.ro (owner, 2026-11-24: nothing under post.*, Zoho
# unused). The mail SERVER's host is mx.psizone.ro (MX target, SMTP/IMAP name, certificate); the
# address's domain is the apex.
MAILBOX_DOMAIN: psizone.ro
FRONT_HOST_PREFIX: portal

# ── hub ─────────────────────────────────────────────────────────────────────
HUB_HOST_PREFIX: sso
HUB_NAME: Psi Sign-in
HUB_TILE_TITLE: PSI
# The applications holding an authorization-model pin (secret/apps/<app>/autorizare), which the
# model-pin alarm watches. psi's only one is the platform's sign-in tile policy; none of psi's
# own applications pins a model yet.
MODEL_PIN_HOLDERS: authentik-tiles
# The organisations psi's organisation robots stand in (lib-journeys-tenant.sh): each made by a robot
# through the hub, never a real one. e2e-o-firma, e2e-admin-org and e2e-inregistrare in the first,
# e2e-coleg (the two-person suites' colleague) in the second.
E2E_ORG_SLUG: e2e-hub-robot
E2E_COLLEAGUE_ORG_SLUG: e2e-coleg-robot

# ── secret references (paths and field names only) ──────────────────────────
REF_DNS_TOKEN_PATH: secret/platform/dns/token
REF_DNS_TOKEN_FIELD: api_token
REF_SES_ADMIN_PATH: secret/platform/ses/admin
REF_REGISTRY_PULL_PATH: secret/platform/registry/pull
REF_REGISTRY_ADMIN_PATH: secret/platform/registry/admin
REF_GIT_TOKEN_PATH: secret/platform/git/token
REF_GIT_TOKEN_FIELD: token
REF_OBJECT_STORAGE_PATH: secret/platform/object-storage/{env}
REF_APP_ENV_PATH: secret/apps/{app}/env
BULWARK_HOST_PREFIX: inbox
# The shared business applications under psi's names (plan row 7.6, Greek letters): Mu is invoicing
# (interface mu., API api.mu.), Rho is flows — not `flows.`, which is n8n's —, Sigma is the register
# (interface sigma., API api.sigma.; its hub client and estate key are `sigma` too).
INVOICING_HOST_PREFIX: mu
FLOWS_HOST_PREFIX: rho
REGISTER_HOST_PREFIX: sigma
# The lockdown's clean week (SEB docs/lockdown.md): both start at psi's first full doctor run that was
# green on the Kyverno reports layer after the changelog violation was fixed (bundle 0.1.141-psi.2) and its
# rollback drill ended (14:05:18Z): that run finished 2026-11-15 14:19Z. Moved forward when a violation is fixed.
LOCKDOWN_SIGNATURES_SINCE: 2026-11-15T14:19:00Z
LOCKDOWN_OBJECT_CHANGES_SINCE: 2026-11-15T14:19:00Z
# Two-factor sign-in: OFF for everyone, administrators included (the owner, 2026-11-16: two-factor
# disabled completely on both estates). Without this key SEB's default is `required`, and the take
# would bind the code prompt again. SEB tools/identity/lib/mfa.mjs `off`; the hub stops demanding the
# mfa amr with it.
SIGNIN_MFA: off
