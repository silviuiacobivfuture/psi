# PSI — the second estate (psizone.ro). The zone already holds the owner's own records
# (a site at the apex and www, mail, tunnels): the estate never writes the apex.
#   infrastructure/hetzner/scripts/genesis.sh dev --identity estate/identity.yaml --dry-run

# ── identity ────────────────────────────────────────────────────────────────
BASE_DOMAIN: psizone.ro
ESTATE_SLUG: psi
ESTATE_NAME: PSI
BRAND_TITLE: Psi
ESTATE_LOCALE: en
OPS_EMAIL: ops@psizone.ro
ACME_EMAIL: certificates@psizone.ro
MAIL_DOMAIN: psizone.ro
MAIL_SENDER_NAME: Psi
ESTATE_LABEL_DOMAIN: psizone.ro
BRAND_ASSETS_DIR: brand
OPERATOR_USERNAME: silviu
OPERATOR_NAME: Silviu Iacob
OPERATOR_EMAIL: silviu.iacob@ivfuture.ro

# ── cloud ───────────────────────────────────────────────────────────────────
HCLOUD_LOCATION: nbg1
CONTROL_PLANE_SERVER_TYPE: dev=cx53
AGENT_SERVER_TYPE: dev=cx53
OBJECT_STORAGE_REGION: nbg1
OBJECT_STORAGE_ENDPOINT: https://nbg1.your-objectstorage.com
BUCKET_PREFIX: psi
DNS_PROVIDER: cloudflare
DNS_ZONE: psizone.ro
DNS_APEX: foreign
SES_REGION: eu-west-1
REGISTRY_HOST: registry.psizone.ro
REGISTRY_PROJECT_APPS: psi
REGISTRY_PROJECT_MIRROR: mirror
GIT_HOST: github.com
GIT_OWNER: silviuiacobivfuture
GIT_REPO: psi
MESH_BASE_DOMAIN: mesh.psizone.ro
ENVIRONMENTS: dev

# ── platform apps: the first estate's full platform set ─────────────────────
PLATFORM_APPS: authentik,autorizare,harbor,headscale,headplane,plane,novu,n8n,plunk,nextcloud,reportportal,test-reports,pdfcraft
AUTHENTIK_HOST_PREFIX: sso
AUTORIZARE_HOST_PREFIX: access
HARBOR_HOST_PREFIX: registry
HEADSCALE_HOST_PREFIX: mesh-control
HEADPLANE_HOST_PREFIX: mesh-console
PLANE_HOST_PREFIX: work
NOVU_HOST_PREFIX: notify
N8N_HOST_PREFIX: flows
PLUNK_HOST_PREFIX: plunk
NEXTCLOUD_HOST_PREFIX: drive
REPORTPORTAL_HOST_PREFIX: reports
TEST_REPORTS_HOST_PREFIX: tests
PDFCRAFT_HOST_PREFIX: pdf
FRONT_HOST_PREFIX: portal

# ── hub ─────────────────────────────────────────────────────────────────────
HUB_HOST_PREFIX: login
HUB_NAME: Psi Sign-in

# ── secret references (paths and field names only) ──────────────────────────
REF_DNS_TOKEN_PATH: secret/platform/dns/token
REF_DNS_TOKEN_FIELD: api_token
REF_SES_ADMIN_PATH: secret/platform/ses/admin
REF_REGISTRY_PULL_PATH: secret/platform/registry/pull
REF_REGISTRY_ADMIN_PATH: secret/platform/registry/admin
REF_GIT_TOKEN_PATH: secret/platform/git/token
REF_GIT_TOKEN_FIELD: token
REF_OBJECT_STORAGE_PATH: secret/platform/object-storage/{env}
REF_APP_ENV_PATH: secret/apps/{app}/env
