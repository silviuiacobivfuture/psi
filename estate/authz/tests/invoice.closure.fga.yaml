tests:
  - name: invoice_company#profile_manager is conferred by exactly ['perm_invoice_company_manage', 'role_invoice_admin', 'role_invoice_owner']
    check:
      - user: user:c_org_administrator
        object: invoice_company:closure
        assertions:
          profile_manager: false
      - user: user:c_org_auditor
        object: invoice_company:closure
        assertions:
          profile_manager: false
      - user: user:c_org_member
        object: invoice_company:closure
        assertions:
          profile_manager: false
      - user: user:c_org_perm_invoice_company_manage
        object: invoice_company:closure
        assertions:
          profile_manager: true
      - user: user:c_org_perm_invoice_data_read
        object: invoice_company:closure
        assertions:
          profile_manager: false
      - user: user:c_org_perm_invoice_data_write
        object: invoice_company:closure
        assertions:
          profile_manager: false
      - user: user:c_org_perm_invoice_efactura_transmit
        object: invoice_company:closure
        assertions:
          profile_manager: false
      - user: user:c_org_perm_invoice_integration_sync
        object: invoice_company:closure
        assertions:
          profile_manager: false
      - user: user:c_org_perm_invoice_invoice_cancel
        object: invoice_company:closure
        assertions:
          profile_manager: false
      - user: user:c_org_perm_invoice_invoice_issue
        object: invoice_company:closure
        assertions:
          profile_manager: false
      - user: user:c_org_perm_invoice_invoice_storno
        object: invoice_company:closure
        assertions:
