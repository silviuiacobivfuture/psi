# The owner path, staff roles and strangers for module `blog`. Hand-written; the generated
# blog.closure.fga.yaml proves the permission closure. Run: fga model test --tests '<this file>'
name: blog-owner
model_file: ../fga.mod

tuples:
  - user: user:staff_role_blog_privacy_officer
    relation: role_blog_privacy_officer
    object: platform:psi
  - user: platform:psi
    relation: parent_platform
    object: blog_saved_article:r1

tests:
  - name: blog_saved_article — the row's owner (its per-record grant, supplied at Check time) holds it; a stranger does not
    tuples:
      - user: user:owner
        relation: viewer
        object: blog_saved_article:r1
      - user: user:owner
        relation: editor
        object: blog_saved_article:r1
    check:
      - user: user:owner
        object: blog_saved_article:r1
        context:
          now: "2026-11-12T10:00:00Z"
        assertions:
          viewer: true
          editor: true
      - user: user:stranger
        object: blog_saved_article:r1
        context:
          now: "2026-11-12T10:00:00Z"
        assertions:
          viewer: false
          editor: false
  - name: blog_saved_article — without the row's tuple nothing persisted grants the owner anything; staff only by role
    check:
      - user: user:owner
        object: blog_saved_article:r1
        context:
          now: "2026-11-12T10:00:00Z"
        assertions:
          viewer: false
          editor: false
      - user: user:staff_role_blog_privacy_officer
        object: blog_saved_article:r1
        context:
          now: "2026-11-12T10:00:00Z"
        assertions:
          viewer: true
          editor: false
