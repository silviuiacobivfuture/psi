# estate/seb-upgrade.conf — where this estate's upgrade step (estate/seb-upgrade.sh) reads and
# writes. One `key = value` per line; estate/seb-upgrade.sh's header says what each key means. No key
# has a default: the upgrade refuses, by name, a required one that is missing.
#
# SEB's git repository: where the release tags v<x.y.z> live.
release-repo = git@github.com:silviuiacobivfuture/seb.git
# The by-digest Applications, one directory per environment, beside the hand-written
# repo-seb-bundle.yaml (Argo CD's read credential for oci://<REGISTRY_HOST>/seb/bundle).
apps-dir = gitops/apps/overlays/{env}/seb-bundle
# The git-sourced Applications genesis rendered (tools/estate-pieces.mjs): what each piece's
# generated Application replaces, keeping its name, sync options and wave.
predecessors = gitops/apps/overlays/{env}/seb-pieces
