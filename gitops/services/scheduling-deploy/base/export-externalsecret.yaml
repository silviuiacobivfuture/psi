# The nightly export's credentials, into the Secret `scheduling-export-env` (per-key data[], no
# dataFrom.extract: a missing key makes this ExternalSecret SecretSyncedError):
#
#   secret/apps/scheduling/admin          CONVEX_SELF_HOSTED_ADMIN_KEY   the deployment's admin key
#   secret/apps/scheduling/export         AGE_RECIPIENT                  the age PUBLIC key (age1...)
#                                         the export is encrypted to; the identity stays offline
#   secret/platform/object-storage/dev    access_key_id, secret_access_key   the estate's object storage
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scheduling-export-env
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: scheduling-export-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CONVEX_SELF_HOSTED_ADMIN_KEY
      remoteRef: { key: apps/scheduling/admin, property: CONVEX_SELF_HOSTED_ADMIN_KEY }
    - secretKey: AGE_RECIPIENT
      remoteRef: { key: apps/scheduling/export, property: AGE_RECIPIENT }
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
