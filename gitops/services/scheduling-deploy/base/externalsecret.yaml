# The two credentials the deploy Job needs, into the Secret `scheduling-deploy-env`:
#
#   secret/apps/scheduling/admin  CONVEX_SELF_HOSTED_ADMIN_KEY  the deployment's admin key. It DERIVES
#                                 from INSTANCE_NAME + INSTANCE_SECRET (it cannot be chosen): generated
#                                 once from the running backend, never printed (packages/scheduling/README.md, Deploying).
#   secret/apps/scheduling/env    PSI_SCHEDULING_KEY            the server key, the SAME property
#                                 psizone-web reads, so one rotation in OpenBao reaches both.
#
# FAIL LOUD: per-key data[], no dataFrom.extract. Until the admin key exists the Secret is not created
# (SecretSyncedError), the Job's pod waits (CreateContainerConfigError), and it starts by itself within
# a minute of the key being written.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scheduling-deploy-env
spec:
  refreshInterval: 1m
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: scheduling-deploy-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CONVEX_SELF_HOSTED_ADMIN_KEY
      remoteRef: { key: apps/scheduling/admin, property: CONVEX_SELF_HOSTED_ADMIN_KEY }
    - secretKey: PSI_SCHEDULING_KEY
      remoteRef: { key: apps/scheduling/env, property: PSI_SCHEDULING_KEY }
