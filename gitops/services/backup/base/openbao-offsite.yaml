# The newest OpenBao snapshot, copied off-site and locked 30 days, every 6 h, 20 minutes after SEB takes it
# (scripts/offsite-openbao.sh).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-offsite
  labels: { app: openbao-offsite }
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
spec:
  schedule: "50 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels: { app: openbao-offsite }
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: copy
              image: registry.psizone.ro/mirror/docker.io/amazon/aws-cli:2.17.0@sha256:7b7edf789765c22d75e61ad6f307c06950e15357b79ea1749104641ce3a11fec
              command: ["bash", "/scripts/offsite-openbao.sh"]
              envFrom:
                - secretRef: { name: backup-s3 }
              env:
                - { name: HOME, value: /tmp }
                - { name: AWS_REGION, value: nbg1 }
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: tmp, mountPath: /tmp }
                - { name: work, mountPath: /work }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                readOnlyRootFilesystem: true
          volumes:
            - name: scripts
              configMap: { name: backup-scripts }
            - name: tmp
              emptyDir: { sizeLimit: 64Mi }
            - name: work
              emptyDir: { sizeLimit: 1Gi }
