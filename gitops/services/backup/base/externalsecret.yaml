# The estate's object-storage key (one Hetzner project, every location), as the AWS CLI reads it. Per key, so a missing
# one is SecretSyncedError and every Job here refuses to start (assert-secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: backup-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
