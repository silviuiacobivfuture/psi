# The Novu environment's secret key the bridge checks every request against (Novu signs with it). The same key the
# estate's Novu environment holds (secret/apps/novu/estate.secret_key); declared per key, so a missing one is
# SecretSyncedError and the assert-secrets initContainer stops the pod by name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notify-bridge-env
spec:
  refreshInterval: 1m
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: notify-bridge-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: NOVU_SECRET_KEY
      remoteRef: { key: apps/novu/estate, property: secret_key }
