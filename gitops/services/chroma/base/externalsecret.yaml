# The token that opens Chroma, synced from OpenBao secret/apps/chroma/env into the Secret
# `chroma-auth`, which the auth sidecar and the assert-secrets initContainer read.
#
# FAIL LOUD: one per-key `data[]` entry, so a missing CHROMA_SERVER_TOKEN makes this
# ExternalSecret go SecretSyncedError instead of rendering an empty Secret. No
# dataFrom.extract: the sidecar reads exactly this one variable.
#
# An app that talks to Chroma reads the SAME property with its own ExternalSecret in its own
# namespace (estate/APP-SECRETS.md); one rotation in OpenBao reaches every reader.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chroma-auth
spec:
  refreshInterval: 1m
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: chroma-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CHROMA_SERVER_TOKEN
      remoteRef: { key: apps/chroma/env, property: CHROMA_SERVER_TOKEN }
