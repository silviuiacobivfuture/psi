# The estate hub (the homepage piece) on the PUBLIC network. psi has no mesh
# (MESH none), so the hub's private names (hub.<mesh>) resolve nowhere; it is
# published here instead, behind the estate's domain sign-in (the same
# forward-auth that gates tests.psizone.ro). Nothing is reachable signed out.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hub
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls: [{ hosts: [hub.psizone.ro], secretName: hub-tls }]
  rules:
    - host: hub.psizone.ro
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: homepage, port: { number: 3000 } } } }]
