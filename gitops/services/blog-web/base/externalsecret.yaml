# blog-web's environment, synced from OpenBao secret/apps/blog-web/env (REF_APP_ENV_PATH) into the
# Secret `blog-web-env`. The blog REQUIRES no secret yet: no data[] entry, and the Deployment reads
# the Secret with `optional: true`. OPENROUTER_API_KEY, when written there, turns its guide on
# (without it the guide answers "unavailable"). Until secret/apps/blog-web/env exists this
# ExternalSecret reports SecretSyncedError; the pod starts regardless.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blog-web-env
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: blog-web-env
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract: { key: apps/blog-web/env }
