# The blog's staging host: blog.psizone.ro. docs/plans/blog-and-content.md (A) gives blog-web NO
# public host in the end state (each brand site proxies its pathBase to this Service in-cluster);
# no site proxies yet, so this host is how the blog is reviewed until they do. external-dns writes
# the record from this Ingress; cert-manager issues the certificate (DNS-01).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blog-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [blog.psizone.ro]
      secretName: blog-web-tls
  rules:
    - host: blog.psizone.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blog-web
                port: { number: 80 }
