# scheduling-db's pods (label cnpg.io/cluster: scheduling-db: the instance AND the initdb / recovery /
# backup Job pods). Selecting them flips them to default-deny both ways, so every rule below is
# load-bearing; SEB's openfga policy declines to select CNPG pods because the failure mode is a database
# that stops backing up silently. The guard against that here is the runbook's check of
# `ContinuousArchiving` and the last successful backup (docs/runbooks/scheduling-restore.md), and
# the weekly ScheduledBackup. Kubelet probes and the API-server egress are node addresses: the dev
# overlay adds them (as the backend's policy does).
#
#   INGRESS  5432 from the backend only (the export and deploy Jobs go through the backend's API,
#            never to Postgres); 5432 and 8000 (the instance manager's status port) from the CNPG
#            operator in cnpg-system.
#   EGRESS   DNS; 443 to anywhere (the object storage's S3 endpoint for WAL and base backups, and
#            the Kubernetes API through its Service). The dev overlay adds the API server's node port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scheduling-db
spec:
  podSelector:
    matchLabels: { cnpg.io/cluster: scheduling-db }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: scheduling-backend }
      ports:
        - { protocol: TCP, port: 5432 }
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cnpg-system }
          podSelector:
            matchLabels: { app.kubernetes.io/name: cloudnative-pg }
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 8000 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 443 }
