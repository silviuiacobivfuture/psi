# Convex self-hosted backend (docs/plans/scheduling.md section 7), one replica, SQLite on a
# ReadWriteOnce volume. A StatefulSet terminates the old pod before it creates the new one, so the
# volume is never mounted twice.
#
# THE IMAGE: registry.psizone.ro/psi/scheduling-backend, built by .github/workflows/apps.yml from
# apps/scheduling-backend/Dockerfile: the upstream Convex backend (pinned there by its linux/amd64
# manifest digest) with its binary and scripts made executable and /convex/data owned by uid 1000, so
# it runs directly as a non-root user (the cluster's Kyverno requires one). CI moves the tag in the
# overlay (images: newTag); "unbuilt" until the first build, so the pod shows ImagePullBackOff until
# then. The `psi` Harbor project is private: harbor-pull (harbor-pull-externalsecret.yaml, shared by
# the scheduling-deploy Job in this namespace). The data directory stays /convex/data, on the volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scheduling-backend
  labels: { app: scheduling-backend }
  annotations:
    # INSTANCE_NAME / INSTANCE_SECRET are read at start: Reloader restarts the pod when OpenBao -> ESO
    # changes the Secret. (Do not rotate them in place: the admin key derives from both.)
    reloader.stakater.com/auto: "true"
    alerts.psizone.ro/owner: ops@psizone.ro
spec:
  replicas: 1
  serviceName: scheduling-backend
  selector:
    matchLabels: { app: scheduling-backend }
  template:
    metadata:
      labels: { app: scheduling-backend }
    spec:
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # FIRST: refuse to start without a usable identity. A blank INSTANCE_SECRET would make
        # the image generate a random one on the volume, silently diverging from OpenBao (and
        # from the admin key the deploy Job holds).
        - name: assert-secrets
          image: registry.psizone.ro/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
          envFrom:
            - secretRef: { name: scheduling-backend-env }
          command:
            - sh
            - -c
            # kubelet expands only $(VAR); ${VAR:-} and ${#VAR} reach sh untouched.
            - '[ -n "${INSTANCE_NAME:-}" ] || { echo "MISSING REQUIRED SECRET: INSTANCE_NAME" >&2; exit 1; }; [ -n "${INSTANCE_SECRET:-}" ] || { echo "MISSING REQUIRED SECRET: INSTANCE_SECRET" >&2; exit 1; }; case "$INSTANCE_SECRET" in *[!0-9a-f]*) echo "INVALID SECRET: INSTANCE_SECRET must be lowercase hex" >&2; exit 1;; esac; [ "${#INSTANCE_SECRET}" -ge 32 ] || { echo "INVALID SECRET: INSTANCE_SECRET shorter than 32" >&2; exit 1; }; echo secrets-ok'
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
            readOnlyRootFilesystem: true
      containers:
        - name: backend
          image: registry.psizone.ro/psi/scheduling-backend
          ports:
            - { name: api, containerPort: 3210 }
          envFrom:
            - secretRef: { name: scheduling-backend-env }
          env:
            # The origins are how callers reach the backend: the in-cluster Service. The
            # HTTP-actions origin is required by the image, but no psi function uses it.
            - { name: CONVEX_CLOUD_ORIGIN, value: "http://scheduling-backend.scheduling.svc:3210" }
            - { name: CONVEX_SITE_ORIGIN, value: "http://scheduling-backend.scheduling.svc:3211" }
            - { name: DISABLE_BEACON, value: "true" }
            # Function errors reach the client without their detail (a clinic's data stays out of logs).
            - { name: REDACT_LOGS_TO_CLIENT, value: "true" }
          volumeMounts:
            - { name: data, mountPath: /convex/data }
          resources:
            # measured ~180Mi idle locally (SQLite, no load); limit leaves room for the working set
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
            # verified locally: the backend writes only under /convex/data
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet: { path: /version, port: api }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /version, port: api }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /version, port: api }
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: scheduling-backend-data }
