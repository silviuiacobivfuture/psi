# The deployment's identity, synced from OpenBao secret/apps/scheduling/env into the Secret
# `scheduling-backend-env`, which the backend and its assert-secrets initContainer read.
#
# FAIL LOUD: one per-key data[] entry each, no dataFrom.extract, so a missing key makes this
# ExternalSecret SecretSyncedError instead of an empty value. PSI_SCHEDULING_KEY lives at the same
# path but is NOT read here: the backend never needs it as an environment variable (the
# scheduling-deploy Job sets it INSIDE the deployment; psizone-web reads it with its own
# ExternalSecret), so one rotation in OpenBao reaches both.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scheduling-backend-env
spec:
  refreshInterval: 1m
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: scheduling-backend-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: INSTANCE_NAME
      remoteRef: { key: apps/scheduling/env, property: INSTANCE_NAME }
    - secretKey: INSTANCE_SECRET
      remoteRef: { key: apps/scheduling/env, property: INSTANCE_SECRET }
