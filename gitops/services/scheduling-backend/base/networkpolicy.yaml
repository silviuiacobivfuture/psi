# Only psi's servers may call the store (the server key is the second lock).
#
#   INGRESS  :3210 from the pods of psizone-web, hemisync-web, the CMS and scheduling-api (each: namespace AND
#            pod label in ONE `from` element, an AND; two elements would be an OR) and from the
#            scheduling-deploy Job's pods (same namespace). When EQ-SYNC scheduling goes live (plan
#            S9), add its namespace/pod pair here, in this file.
#            Kubelet probes come from node addresses: the dev overlay adds them.
#   EGRESS   DNS, and the backend's own Service (its origin is the Service URL). Nothing else:
#            the beacon is off and no function calls out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scheduling-backend
spec:
  podSelector:
    matchLabels: { app: scheduling-backend }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: psizone-web }
          podSelector:
            matchLabels: { app: psizone-web }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: hemisync-web }
          podSelector:
            matchLabels: { app: hemisync-web }
        - podSelector:
            matchLabels: { app: scheduling-deploy }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: cms }
          podSelector:
            matchLabels: { app: cms }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: scheduling-api }
          podSelector:
            matchLabels: { app: scheduling-api }
      ports:
        - { protocol: TCP, port: 3210 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels: { app: scheduling-backend }
      ports:
        - { protocol: TCP, port: 3210 }
        - { protocol: TCP, port: 3211 }
