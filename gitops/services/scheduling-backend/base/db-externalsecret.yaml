# The database's two Secrets, both synced from OpenBao. Per-key data[], no dataFrom.extract: a
# missing key makes the ExternalSecret SecretSyncedError instead of rendering an empty value.
#
#   secret/apps/scheduling/db            username, password   the database owner (CNPG initdb and
#                                        Convex's POSTGRES_URL). username = scheduling; the password
#                                        must be URL-safe (it goes into a URL as is): openssl rand -hex 24
#   secret/platform/object-storage/dev   access_key_id, secret_access_key   the WAL archive
#
# The database owner's credential in the form CNPG's bootstrap requires.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scheduling-db-app
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: scheduling-db-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef: { key: apps/scheduling/db, property: username }
    - secretKey: password
      remoteRef: { key: apps/scheduling/db, property: password }
---
# CNPG's WAL-archive credentials, under the AWS_* names barman expects. Only the two keys it needs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scheduling-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: scheduling-backup-s3, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
