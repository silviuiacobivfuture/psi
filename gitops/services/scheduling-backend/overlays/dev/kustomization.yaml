# The scheduling backend on dev. CI moves newTag after each image it pushes (apps/scheduling-backend);
# never edit it by hand. "unbuilt" is the placeholder until the first apps.yml run replaces it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: scheduling
resources:
  - ../../base
images:
  - name: registry.psizone.ro/psi/scheduling-backend
    newTag: "5336c73"
patches:
  # Kubelet health probes through the NetworkPolicy: they arrive from the node the pod runs on, its
  # InternalIP, or its cni0 gateway when flannel SNATs a same-node connection. The same addresses
  # agent-studio admits (gitops/services/agent-studio/overlays/dev); re-read them from the live
  # nodes before the first sync.
  - target: { kind: NetworkPolicy, name: scheduling-backend }
    patch: |-
      - op: add
        path: /spec/ingress/-
        value:
          from:
            - ipBlock: { cidr: 10.0.1.10/32 }
            - ipBlock: { cidr: 10.0.1.1/32 }
            - ipBlock: { cidr: 10.42.0.1/32 }
            - ipBlock: { cidr: 10.42.1.1/32 }
          ports:
            - { protocol: TCP, port: 3210 }
  # scheduling-db: kubelet probes (the instance manager's :8000 status port, same node addresses as
  # above) and the API server (the instance manager and the backup/initdb pods read and patch their
  # Cluster through it: the Service is DNATed to the control-plane node's :6443).
  - target: { kind: NetworkPolicy, name: scheduling-db }
    patch: |-
      - op: add
        path: /spec/ingress/-
        value:
          from:
            - ipBlock: { cidr: 10.0.1.10/32 }
            - ipBlock: { cidr: 10.0.1.1/32 }
            - ipBlock: { cidr: 10.42.0.1/32 }
            - ipBlock: { cidr: 10.42.1.1/32 }
          ports:
            - { protocol: TCP, port: 8000 }
      - op: add
        path: /spec/egress/-
        value:
          to:
            - ipBlock: { cidr: 10.0.1.10/32 }
          ports:
            - { protocol: TCP, port: 6443 }
