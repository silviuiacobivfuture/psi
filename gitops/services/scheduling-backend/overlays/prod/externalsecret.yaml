# PRODUCTION's own Convex identity and its Postgres connection, from OpenBao. A JSON patch that REPLACES the whole
# `spec` of the base's ExternalSecret `scheduling-backend-env` (kustomization.yaml): nothing here reads dev's paths.
#
#   secret/apps/scheduling-prod/env  INSTANCE_NAME, INSTANCE_SECRET   this deployment's identity (own values, never dev's)
#   secret/apps/scheduling-prod/db   username, password                the CNPG owner (db.yaml's scheduling-db-app) AND the
#                                                                      login in POSTGRES_URL, so the two cannot drift
#
# POSTGRES_URL names no database: Convex derives it from INSTANCE_NAME (dashes become underscores), and db.yaml
# bootstraps that very database, so INSTANCE_NAME must be `psi-scheduling-prod` (-> database psi_scheduling_prod).
- op: replace
  path: /spec
  value:
    refreshInterval: 1m
    secretStoreRef: { name: openbao, kind: ClusterSecretStore }
    target:
      name: scheduling-backend-env
      creationPolicy: Owner
      deletionPolicy: Retain
      template:
        data:
          INSTANCE_NAME: "{{ .instance_name }}"
          INSTANCE_SECRET: "{{ .instance_secret }}"
          POSTGRES_URL: "postgresql://{{ .db_username }}:{{ .db_password }}@scheduling-db-rw:5432"
    data:
      - secretKey: instance_name
        remoteRef: { key: apps/scheduling-prod/env, property: INSTANCE_NAME }
      - secretKey: instance_secret
        remoteRef: { key: apps/scheduling-prod/env, property: INSTANCE_SECRET }
      - secretKey: db_username
        remoteRef: { key: apps/scheduling-prod/db, property: username }
      - secretKey: db_password
        remoteRef: { key: apps/scheduling-prod/db, property: password }
