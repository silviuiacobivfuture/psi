# The staging host: eqsync.psizone.ro (docs/plans/eqsync-web.md §6; no `.dev` in any address).
# eq-sync.ro is not claimed here: it lies outside the estate's one zone (SEB extra zones or the
# edge bridge, per the plan). external-dns writes the record from this Ingress; cert-manager
# issues the certificate (DNS-01).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eqsync-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [eqsync.psizone.ro]
      secretName: eqsync-web-tls
  rules:
    - host: eqsync.psizone.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eqsync-web
                port: { number: 80 }
