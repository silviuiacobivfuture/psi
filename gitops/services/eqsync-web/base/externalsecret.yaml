# eqsync-web's environment, synced from OpenBao into the Secret `eqsync-web-env` the Deployment and its
# assert-secrets initContainer read. Values live ONLY in OpenBao; this holds the mapping.
#
#   secret/apps/chroma/env   CHROMA_SERVER_TOKEN -> CHROMA_API_KEY, the token the knowledge store
#                            (packages/knowledge, CHROMA_URL + CHROMA_API_KEY) sends as Bearer to
#                            Chroma's auth sidecar. The SAME property Chroma reads, so one
#                            rotation reaches both (estate/APP-SECRETS.md).
#
# FAIL LOUD: per-key data[] with explicit properties, no dataFrom.extract — a missing key makes
# this ExternalSecret SecretSyncedError rather than render an empty value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eqsync-web-env
spec:
  refreshInterval: 1m
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: eqsync-web-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CHROMA_API_KEY
      remoteRef: { key: apps/chroma/env, property: CHROMA_SERVER_TOKEN }
