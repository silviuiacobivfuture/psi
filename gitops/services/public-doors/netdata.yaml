# Netdata: through Authentik's embedded outpost (its proxy provider for netdata.<tailnet>), as the private gate is.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netdata-public
  namespace: authentik
  annotations:
    # The hub tile its mesh door carries (the same name, group, icon and status pod), which the
    # bundle leaves out with the mesh. No href: Homepage links the first rule's host.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Netdata"
    gethomepage.dev/description: "Real-time node and pod metrics"
    gethomepage.dev/group: "Observability"
    gethomepage.dev/icon: "netdata.png"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=authentik,app.kubernetes.io/component=server"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [netdata.WLTAILNET]
      secretName: netdata-public-tls
  rules:
    - host: netdata.WLTAILNET
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: authentik-server, port: { number: 80 } } }
