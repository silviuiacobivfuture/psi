# Argo CD: its own Authentik sign-in, and the estate's domain sign-in in front of it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-public
  namespace: argocd
  annotations:
    # The hub tile its mesh door carries (the same name, group, icon and status pod), which the
    # bundle leaves out with the mesh. No href: Homepage links the first rule's host.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Argo CD"
    gethomepage.dev/description: "GitOps — what is deployed, and syncing it"
    gethomepage.dev/group: "Delivery"
    gethomepage.dev/icon: "argo-cd.png"
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=argocd-server"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [argocd.WLTAILNET]
      secretName: argocd-public-tls
  rules:
    - host: argocd.WLTAILNET
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: argocd-server, port: { number: 80 } } }
