# design.psizone.ro — INTERNAL: behind the estate's domain sign-in (Authentik forward-auth at
# auth.psizone.ro), like tests. and the public tool doors. Nothing is served signed out.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: design-gallery
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls: [{ hosts: [design.psizone.ro], secretName: design-gallery-tls }]
  rules:
    - host: design.psizone.ro
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: design-gallery, port: { name: http } } } }]
