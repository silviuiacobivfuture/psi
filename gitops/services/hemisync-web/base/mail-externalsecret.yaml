# The site's outgoing mail (docs/plans/clinic.md slice 0: the team is told of every callback request),
# synced from OpenBao secret/apps/hemisync-web/mail into the Secret `hemisync-web-mail`:
#   SMTP_HOST, SMTP_USER, SMTP_PASSWORD  the relay (apps/hemisync-web/src/mail-config.ts); port 587 + STARTTLS by default
#   MAIL_FROM                            the sender address
#   BOOKING_NOTIFY_TO                    the team's inbox(es) for THIS site, comma separated
#
# Its own ExternalSecret, read as an OPTIONAL envFrom, because mail is optional for the site:
# without it a request is still STORED in the scheduling store (and logged as "not e-mailed"). Folded
# into hemisync-web-env, a missing key would put that whole Secret in SecretSyncedError and block the
# deploy. Here a missing key only shows as SecretSyncedError on THIS object (kubectl get externalsecret
# -n hemisync-web), until the operator writes it. Still per-key data[]: never an empty value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hemisync-web-mail
spec:
  refreshInterval: 1m
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: hemisync-web-mail
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SMTP_HOST
      remoteRef: { key: apps/hemisync-web/mail, property: SMTP_HOST }
    - secretKey: SMTP_USER
      remoteRef: { key: apps/hemisync-web/mail, property: SMTP_USER }
    - secretKey: SMTP_PASSWORD
      remoteRef: { key: apps/hemisync-web/mail, property: SMTP_PASSWORD }
    - secretKey: MAIL_FROM
      remoteRef: { key: apps/hemisync-web/mail, property: MAIL_FROM }
    - secretKey: BOOKING_NOTIFY_TO
      remoteRef: { key: apps/hemisync-web/mail, property: BOOKING_NOTIFY_TO }
