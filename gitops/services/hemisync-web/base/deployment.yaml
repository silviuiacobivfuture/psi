apiVersion: apps/v1
kind: Deployment
metadata:
  name: hemisync-web
  labels: { app: hemisync-web }
  annotations:
    # Reloader rolls this Deployment when its ESO-synced Secret changes (OpenBao -> ESO ->
    # Secret -> roll). A roll is a new pod: a fresh knowledge volume, seeded again.
    reloader.stakater.com/auto: "true"
    alerts.psizone.ro/owner: psi
spec:
  replicas: 1
  selector:
    matchLabels: { app: hemisync-web }
  template:
    metadata:
      labels: { app: hemisync-web }
    spec:
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # FIRST: fail LOUD when a required secret is missing or blank. One literal `[ -n ]` per
        # key: kubelet expands `$$`, so an `eval` loop would silently assert nothing.
        - name: assert-secrets
          image: registry.psizone.ro/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
          envFrom:
            - secretRef: { name: hemisync-web-env }
          command:
            - sh
            - -c
            - '[ -n "${OPENROUTER_API_KEY:-}" ] || { echo "MISSING REQUIRED SECRET: OPENROUTER_API_KEY" >&2; exit 1; }; echo secrets-ok'
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 65534
            capabilities: { drop: ["ALL"] }
        # The guide's knowledge base: the seed (every brand's reviewed, non-clinical entries)
        # ingested into this pod's volume before the site starts. With OPENROUTER_API_KEY it embeds
        # through OpenRouter, the vector space the site then queries. A failed seed (OpenRouter
        # unreachable, out of credits) is reported here and does NOT stop the pod: the pages do
        # not depend on it, and the guide then answers that it has no reviewed answer yet.
        - name: seed-knowledge
          image: registry.psizone.ro/psi/hemisync-web
          command:
            - sh
            - -c
            - 'node dist/knowledge-seed.js || echo "KNOWLEDGE SEED FAILED (above): the guide starts with an empty knowledge base" >&2'
          envFrom:
            - secretRef: { name: hemisync-web-env }
          env:
            - { name: PSI_KNOWLEDGE_DB_URL, value: "file:/app/.data/knowledge.db" }
          volumeMounts:
            - { name: knowledge, mountPath: /app/.data }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: hemisync-web
          image: registry.psizone.ro/psi/hemisync-web
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef: { name: hemisync-web-env }
          env:
            - { name: PORT, value: "8080" }
            - { name: PSI_KNOWLEDGE_DB_URL, value: "file:/app/.data/knowledge.db" }
          volumeMounts:
            - { name: knowledge, mountPath: /app/.data }
          # Measured: ~330 MiB resident after start and a guide answer (the bundle carries Mastra).
          resources:
            requests: { cpu: 50m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        # The knowledge database lives as long as the pod: re-seeded on every start. No PVC on
        # purpose (dev): the seed is the source and a few MB rebuild in seconds.
        - name: knowledge
          emptyDir: { sizeLimit: 256Mi }
