apiVersion: apps/v1
kind: Deployment
metadata:
  name: hemisync-web
  labels: { app: hemisync-web }
  annotations:
    # Rolls the pods when hemisync-web-env changes (OpenBao -> ESO -> Secret -> roll).
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector: { matchLabels: { app: hemisync-web } }
  template:
    metadata:
      labels: { app: hemisync-web }
    spec:
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # FIRST: fail LOUD on a missing or blank secret, before the site boots. `${VAR:-}`
        # survives kubelet expansion; assert each key literally. Adding a key = adding its line.
        - name: assert-secrets
          image: registry.psizone.ro/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
          envFrom:
            - secretRef: { name: hemisync-web-env }
          command:
            - sh
            - -c
            - >-
              m=0;
              [ -n "${CHROMA_API_KEY:-}" ] || { echo "MISSING REQUIRED SECRET: CHROMA_API_KEY" >&2; m=1; }; [ -n "${OPENROUTER_API_KEY:-}" ] || { echo "MISSING REQUIRED SECRET: OPENROUTER_API_KEY" >&2; m=1; }; [ -n "${SCHEDULING_SERVICE_KEY:-}" ] || { echo "MISSING REQUIRED SECRET: SCHEDULING_SERVICE_KEY" >&2; m=1; };
              [ "$m" = 0 ] && echo secrets-ok
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
            readOnlyRootFilesystem: true
      containers:
        - name: web
          image: registry.psizone.ro/psi/hemisync-web@sha256:c9f68f3e51d8b6098a87ae1bf73ec331b17f815e185e748006201853bff49895
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - secretRef: { name: hemisync-web-env }
            # On the SITE's container, as psizone-web's: until 2026-11-13 the mail was on the
            # assert-secrets initContainer, which does not read it.
            # OPTIONAL by design: the outgoing mail that tells the team of a callback request
            # (secret/apps/hemisync-web/mail). Absent, requests are still stored and the site logs
            # that nobody was e-mailed; this never blocks a deploy. Roll the pod after it first appears.
            - secretRef: { name: hemisync-web-mail, optional: true }
          env:
            - { name: PORT, value: "3000" }
            # The knowledge store (packages/knowledge): Chroma in the cluster, through its auth
            # sidecar; the token is CHROMA_API_KEY from hemisync-web-env.
            - { name: CHROMA_URL, value: "http://chroma.chroma.svc:8000" }
            # The scheduling service (apps/scheduling-api): every booking, hold, callback request and
            # the guide's times, with SCHEDULING_SERVICE_KEY from hemisync-web-env, a key that reaches
            # only the "hemisync" app. Its NetworkPolicy admits this namespace's app=hemisync-web pods.
            - { name: SCHEDULING_API_URL, value: "http://scheduling-api.scheduling-api.svc" }
            - { name: CMS_URL, value: "https://cms.psizone.ro" }
            - { name: NODE_ENV, value: production }
            - { name: PSIZONE_URL, value: "https://landing.psizone.ro" }
            - { name: HEMISYNC_URL, value: "https://hemisync.psizone.ro" }
            - { name: BLOG_URL, value: "https://blog.psizone.ro" }
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: http }, periodSeconds: 20, failureThreshold: 6 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /app/.data }
      volumes:
        - name: data
          emptyDir: {}
