# hemisync-web's environment, synced from OpenBao into the Secret `hemisync-web-env` the Deployment and its
# assert-secrets initContainer read. Values live ONLY in OpenBao; this holds the mapping.
#
#   secret/apps/chroma/env   CHROMA_SERVER_TOKEN -> CHROMA_API_KEY, the token the knowledge store
#                            (packages/knowledge, CHROMA_URL + CHROMA_API_KEY) sends as Bearer to
#                            Chroma's auth sidecar. The SAME property Chroma reads, so one
#                            rotation reaches both (estate/APP-SECRETS.md).
#
# FAIL LOUD: per-key data[] with explicit properties, no dataFrom.extract — a missing key makes
# this ExternalSecret SecretSyncedError rather than render an empty value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hemisync-web-env
spec:
  refreshInterval: 1m
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: hemisync-web-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CHROMA_API_KEY
      remoteRef: { key: apps/chroma/env, property: CHROMA_SERVER_TOKEN }
    # secret/apps/hemisync-web/env OPENROUTER_API_KEY: the psi estate's OpenRouter key (embeddings + the guide's
    # answers, data_collection deny). Absent -> SecretSyncedError, never an empty value.
    - secretKey: OPENROUTER_API_KEY
      remoteRef: { key: apps/hemisync-web/env, property: OPENROUTER_API_KEY }
    # secret/apps/hemisync-web/env SCHEDULING_SERVICE_KEY: `hemisync-web.<secret>`, this site's service key for the
    # scheduling service's visitor routes. The service holds only the secret's SHA-256, as
    # SERVICE_KEY_HASH_HEMISYNC_WEB in secret/apps/scheduling-api/env.
    - secretKey: SCHEDULING_SERVICE_KEY
      remoteRef: { key: apps/hemisync-web/env, property: SCHEDULING_SERVICE_KEY }
    - secretKey: CMS_API_KEY
      remoteRef: { key: apps/hemisync-web/env, property: CMS_API_KEY }
    - secretKey: PSI_CONTROL_SECRET
      remoteRef: { key: apps/control/env, property: PSI_CONTROL_SECRET }
    - secretKey: ANALYTICS_INGEST_TOKEN
      remoteRef: { key: apps/control/env, property: ANALYTICS_INGEST_TOKEN }
    - secretKey: CMS_REVALIDATE_SECRET
      remoteRef: { key: apps/control/env, property: CMS_REVALIDATE_SECRET }
