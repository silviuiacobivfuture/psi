# The scheduling server key, synced from OpenBao secret/apps/scheduling/env into the Secret
# `hemisync-web-scheduling` (PSI_SCHEDULING_KEY: what the Convex functions demand, packages/scheduling).
# The SAME property the scheduling-deploy Job sets inside the deployment, so one rotation reaches both.
#
# Its own ExternalSecret, and the Deployment reads it as an OPTIONAL envFrom, because scheduling is
# optional for the site (readSchedulingEnv: no key => scheduling off => callback form). Folded into
# hemisync-web-env, a missing key would put that whole Secret in SecretSyncedError and block the
# deploy. Here a missing key only shows as SecretSyncedError on THIS object (kubectl get externalsecret
# -n hemisync-web), until the operator writes it. Still per-key data[]: never an empty value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hemisync-web-scheduling
spec:
  refreshInterval: 1m
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: hemisync-web-scheduling
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PSI_SCHEDULING_KEY
      remoteRef: { key: apps/scheduling/env, property: PSI_SCHEDULING_KEY }
