# The staging host: hemisync.psizone.ro (docs/plans/hemisync-web.md §8; no `.dev` in any address).
# hemi-sync.ro is not claimed here: it lies outside the estate's one zone (SEB extra zones or the
# edge bridge, per the plan). external-dns writes the record from this Ingress; cert-manager
# issues the certificate (DNS-01).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hemisync-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [hemisync.psizone.ro]
      secretName: hemisync-web-tls
  rules:
    - host: hemisync.psizone.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hemisync-web
                port: { number: 80 }
