apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hemisync-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls: [{ hosts: [hemisync.psizone.ro], secretName: hemisync-web-tls }]
  rules:
    - host: hemisync.psizone.ro
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: hemisync-web, port: { name: http } } } }]
