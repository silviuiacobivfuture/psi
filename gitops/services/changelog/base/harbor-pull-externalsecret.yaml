# Harbor pull-secret, synced from OpenBao into THIS service's namespace so the
# private image can be pulled. Part of the service base (not out-of-band) so it
# lands in every namespace the service deploys to — including ephemeral
# preview-pr-<n> namespaces, which otherwise have no harbor-pull and ImagePull-fail.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: harbor-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"WLREGISTRY":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: platform/harbor/pull, property: username }
    - secretKey: password
      remoteRef: { key: platform/harbor/pull, property: password }
