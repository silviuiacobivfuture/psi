# The changelog DB connection, synced from OpenBao into the k8s Secret
# `changelog-db` that the Deployment, the assert-secrets and the migrate
# initContainers consume via envFrom. Values live ONLY in OpenBao; this manifest
# holds the mapping, never a value.
#
# BUILT, NOT STORED. Until 2026-10-22 both URLs were hand-copied Neon strings in
# secret/apps/changelog/env. They are now COMPOSED here from the one owner
# credential at secret/apps/changelog/db — the same credential CNPG's initdb reads
# through changelog-db-app below — so the password the role has and the password
# the service sends cannot disagree, and no password is stored twice.
#
# HOST: `changelog-db-rw`, the CNPG Service that always points at the primary,
# DELIBERATELY namespace-relative. This base also renders into every preview
# namespace (preview-pr-<n>), each with its own Cluster; a fully-qualified
# `changelog-db-rw.changelog.svc` would point every preview at the dev database
# with dev's credential. The app, the migrate initContainer and the database are
# always in one namespace, so the short name always resolves to the right one.
#
# DATABASE_URL and DATABASE_DIRECT_URL are the same string: there is no pooler in
# front of this database. Both stay, because schema.prisma (url + directUrl) and
# src/env.ts require both — the distinction mattered on Neon (PgBouncer vs direct)
# and costs nothing here.
#
# FAIL LOUD: per-key `data[]` with explicit properties, so a missing
# username/password makes this ExternalSecret go SecretSyncedError rather than
# rendering a URL with an empty password. NO dataFrom.extract: the service reads
# exactly these two variables (src/env.ts), and an additive extract would need a
# path seeded on every rebuild only so that it can be empty.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: changelog-db
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: changelog-db
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@changelog-db-rw:5432/changelog?sslmode=disable"
        DATABASE_DIRECT_URL: "postgresql://{{ .username }}:{{ .password }}@changelog-db-rw:5432/changelog?sslmode=disable"
  data:
    - secretKey: username
      remoteRef: { key: apps/changelog/db, property: username }
    - secretKey: password
      remoteRef: { key: apps/changelog/db, property: password }
---
# The database owner's credential in the form CNPG's bootstrap requires
# (`kubernetes.io/basic-auth`, exactly `username` + `password`). Also read by the
# 6-hourly dump in pieces/db-backup/changelog-db-dump.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: changelog-db-app
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: changelog-db-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef: { key: apps/changelog/db, property: username }
    - secretKey: password
      remoteRef: { key: apps/changelog/db, property: password }
---
# CNPG's WAL-archive credentials and the dump's upload credentials, the platform
# object-storage key under the AWS_* names barman expects. Separate from the app's
# Secret so a rotation of one never silently stops the other.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: changelog-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: changelog-backup-s3, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
