apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: changelog
resources:
  - ../../base
# CI (the GitHub Actions workflow) bumps newTag to the built image's git-SHA tag,
# commits it → Argo deploys. This is the push-to-deploy hand-off.
images:
  - name: WLREGISTRY/WLAPPS/changelog
    digest: sha256:bf2b44c9492e8b5dbf6e45c68949fa04a5fe7e342bd1df71b48d13360f531fb7
# The public host (changelog.psizone.ro, behind Authentik) is written in the base Ingress, as
# cms and the other psi services write theirs.
components:
  - ../../../../components/whitelabel
replacements:
  - path: whitelabel-replacements.yaml
