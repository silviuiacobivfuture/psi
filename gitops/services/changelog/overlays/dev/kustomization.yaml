apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: changelog
resources:
  - ../../base
# CI (the GitHub Actions workflow) bumps newTag to the built image's git-SHA tag,
# commits it → Argo deploys. This is the push-to-deploy hand-off.
images:
  - name: WLREGISTRY/WLAPPS/changelog
    # Built by estate-images.sh from SEB apps/changelog for psi; pinned by digest (estate/seb-images.json).
    digest: sha256:bf2b44c9492e8b5dbf6e45c68949fa04a5fe7e342bd1df71b48d13360f531fb7
# NOTE: no per-overlay Ingress host patch. changelog is TAILNET-ONLY — the base
# Ingress (ingressClassName: tailscale, defaultBackend, tls.hosts[0]=changelog →
# changelog.<tailnet>.ts.net) is complete. The old public-host patch
# (/spec/rules/0/host + /spec/tls/0/hosts/0 → changelog.dev.<apex>) was a stale
# leftover from when changelog was a public Traefik service; it targeted a
# non-existent /spec/rules path on the defaultBackend ingress → broke the kustomize
# build → the changelog Argo app could not render/sync. Removed 2026-06-22.
components:
  - ../../../../components/whitelabel
replacements:
  - path: whitelabel-replacements.yaml
