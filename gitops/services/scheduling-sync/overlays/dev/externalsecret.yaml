# The dev one-shot sync's environment, into the Secret `scheduling-sync-env` of namespace `scheduling`. Values live ONLY
# in OpenBao. Dev's own store and key; the OLD app's read-only account is the same one production's sync uses.
#
#   secret/apps/scheduling-sync/old-app   url, anon_key, email, password
#   secret/apps/scheduling/admin          CONVEX_SELF_HOSTED_ADMIN_KEY     dev's store
#   secret/apps/scheduling-api/env        CLINIC_MASTER_KEY                dev's master key (the one dev's API reads with)
#   secret/platform/object-storage/dev    access_key_id, secret_access_key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scheduling-sync-env
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: scheduling-sync-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OLD_APP_SUPABASE_URL
      remoteRef: { key: apps/scheduling-sync/old-app, property: url }
    - secretKey: OLD_APP_SUPABASE_ANON_KEY
      remoteRef: { key: apps/scheduling-sync/old-app, property: anon_key }
    - secretKey: OLD_APP_EMAIL
      remoteRef: { key: apps/scheduling-sync/old-app, property: email }
    - secretKey: OLD_APP_PASSWORD
      remoteRef: { key: apps/scheduling-sync/old-app, property: password }
    - secretKey: CONVEX_SELF_HOSTED_ADMIN_KEY
      remoteRef: { key: apps/scheduling/admin, property: CONVEX_SELF_HOSTED_ADMIN_KEY }
    - secretKey: CLINIC_MASTER_KEY
      remoteRef: { key: apps/scheduling-api/env, property: CLINIC_MASTER_KEY }
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
