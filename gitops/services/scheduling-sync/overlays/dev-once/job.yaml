# A ONE-SHOT sync into DEV, with every identity replaced by a dummy one (--anonymize): the same tool and the same old
# app as production's, so dev's data tracks the real data in shape without holding any of it. Real files are never
# even downloaded. NOT registered with Argo (it would re-run on every sync): create it by hand when a refresh is wanted,
#   tools/scheduling/sync-dev-once.sh | kubectl create -f -
# and read the result with `kubectl -n scheduling logs job/scheduling-sync-dev`.
apiVersion: batch/v1
kind: Job
metadata:
  name: scheduling-sync-dev
  labels: { app: scheduling-sync }
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: { app: scheduling-sync }
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: assert-secrets
          image: registry.psizone.ro/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
          envFrom:
            - secretRef: { name: scheduling-sync-env }
          command:
            - sh
            - -c
            - >-
              m=0;
              [ -n "${OLD_APP_SUPABASE_URL:-}" ] || { echo "MISSING REQUIRED SECRET: OLD_APP_SUPABASE_URL" >&2; m=1; };
              [ -n "${OLD_APP_SUPABASE_ANON_KEY:-}" ] || { echo "MISSING REQUIRED SECRET: OLD_APP_SUPABASE_ANON_KEY" >&2; m=1; };
              [ -n "${OLD_APP_EMAIL:-}" ] || { echo "MISSING REQUIRED SECRET: OLD_APP_EMAIL" >&2; m=1; };
              [ -n "${OLD_APP_PASSWORD:-}" ] || { echo "MISSING REQUIRED SECRET: OLD_APP_PASSWORD" >&2; m=1; };
              [ -n "${CONVEX_SELF_HOSTED_ADMIN_KEY:-}" ] || { echo "MISSING REQUIRED SECRET: CONVEX_SELF_HOSTED_ADMIN_KEY" >&2; m=1; };
              [ "${#CLINIC_MASTER_KEY}" = 64 ] || { echo "MISSING REQUIRED SECRET: CLINIC_MASTER_KEY (64 hex)" >&2; m=1; };
              [ -n "${S3_ACCESS_KEY_ID:-}" ] || { echo "MISSING REQUIRED SECRET: S3_ACCESS_KEY_ID" >&2; m=1; };
              [ -n "${S3_SECRET_ACCESS_KEY:-}" ] || { echo "MISSING REQUIRED SECRET: S3_SECRET_ACCESS_KEY" >&2; m=1; };
              [ "$m" = 0 ] && echo secrets-ok
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
            readOnlyRootFilesystem: true
      containers:
        - name: sync
          image: registry.psizone.ro/psi/scheduling-deploy
          command: ["node", "/app/sync-old.mjs", "--mapping", "/app/mapping.json", "--anonymize", "--allow-skips"]
          envFrom:
            - secretRef: { name: scheduling-sync-env }
          env:
            # No SYNC_ALLOW_REAL here: this Job refuses to write real data even if --anonymize were dropped.
            - { name: CONVEX_SELF_HOSTED_URL, value: "http://scheduling-backend.scheduling.svc:3210" }
            - { name: S3_ENDPOINT, value: "https://nbg1.your-objectstorage.com" }
            - { name: S3_REGION, value: nbg1 }
            - { name: S3_BUCKET, value: psi-scheduling-dev }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
            readOnlyRootFilesystem: true
      volumes:
        - name: tmp
          emptyDir: {}
