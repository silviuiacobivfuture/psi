# The production sync's environment, into the Secret `scheduling-sync-env`. Values live ONLY in OpenBao.
#
#   secret/apps/scheduling-sync/old-app   url, anon_key, email, password   the OLD app's Supabase and a READ-ONLY account
#                                         of it (shared with the dev one-shot Job; the tool only ever GETs from it)
#   secret/apps/scheduling-prod/admin     CONVEX_SELF_HOSTED_ADMIN_KEY     production's store (the scheduling-deploy-prod key)
#   secret/apps/scheduling-api-prod/env   CLINIC_MASTER_KEY                production's master key: the sync encrypts the
#                                                                          clinical fields with the SAME key the API reads them with
#   secret/platform/object-storage/dev    access_key_id, secret_access_key for the clinic's files
#
# FAIL LOUD: per-key data[], no dataFrom.extract: a missing key makes this ExternalSecret SecretSyncedError.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scheduling-sync-env
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: scheduling-sync-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OLD_APP_SUPABASE_URL
      remoteRef: { key: apps/scheduling-sync/old-app, property: url }
    - secretKey: OLD_APP_SUPABASE_ANON_KEY
      remoteRef: { key: apps/scheduling-sync/old-app, property: anon_key }
    - secretKey: OLD_APP_EMAIL
      remoteRef: { key: apps/scheduling-sync/old-app, property: email }
    - secretKey: OLD_APP_PASSWORD
      remoteRef: { key: apps/scheduling-sync/old-app, property: password }
    - secretKey: CONVEX_SELF_HOSTED_ADMIN_KEY
      remoteRef: { key: apps/scheduling-prod/admin, property: CONVEX_SELF_HOSTED_ADMIN_KEY }
    - secretKey: CLINIC_MASTER_KEY
      remoteRef: { key: apps/scheduling-api-prod/env, property: CLINIC_MASTER_KEY }
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
