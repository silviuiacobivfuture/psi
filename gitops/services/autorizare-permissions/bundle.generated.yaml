  catalog__eqsync.manifest.json: "{\n\t\"$schema\": \"../../../seb/authz/manifest.schema.json\",\n\t\"$comment\": \"EQ-SYNC's account resources (docs/plans/accounts.md). Every object is scoped to the estate's platform (platform:psi): psi's visitors belong to no organisation. The OWNER of a record is a per-record grant the application supplies at Check time as a contextual tuple, read from its own row (the system of record); nothing about a visitor is persisted in OpenFGA. Staff reach records only through the catalog roles below, granted in Polaris. No role reads guide memory or clinical data; none exists here.\",\n\t\"app\": \"eqsync-web\",\n\t\"module\": \"eqsync\",\n\t\"version\": 1,\n\t\"permission_model\": \"relational\",\n\t\"generated_dir\": \"src/authz\",\n\t\"features\": [\n\t\t{\n\t\t\t\"key\": \"programme\",\n\t\t\t\"name\": {\n\t\t\t\t\"ro\": \"Programul de 21 de zile\",\n\t\t\t\t\"en\": \"The 21-day programme\"\n\t\t\t},\n\t\t\t\"description\": {\n\t\t\t\t\"ro\": \"Înscrierea și progresul în program.\",\n\t\t\t\t\"en\": \"Enrolment and progress in the programme.\"\n\t\t\t},\n\t\t\t\"permissions\": [\n\t\t\t\t{\n\t\t\t\t\t\"key\": \"view\",\n\t\t\t\t\t\"name\": {\n\t\t\t\t\t\t\"ro\": \"Vizualizare progres\",\n\t\t\t\t\t\t\"en\": \"View progress\"\n\t\t\t\t\t},\n\t\t\t\t\t\"grants\": [\"eqsync_programme_enrollment#viewer\"],\n\t\t\t\t\t\"effect\": \"read\"\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"key\": \"manage\",\n\t\t\t\t\t\"name\": {\n\t\t\t\t\t\t\"ro\": \"Actualizare progres\",\n\t\t\t\t\t\t\"en\": \"Update progress\"\n\t\t\t\t\t},\n\t\t\t\t\t\"grants\": [\"eqsync_programme_enrollment#editor\"],\n\t\t\t\t\t\"effect\": \"write\",\n\t\t\t\t\t\"implies\": [\"programme:view\"]\n\t\t\t\t}\n\t\t\t]\n\t\t},\n\t\t{\n\t\t\t\"key\": \"protocols\",\n\t\t\t\"name\": {\n\t\t\t\t\"ro\": \"Protocoale\",\n\t\t\t\t\"en\": \"Protocols\"\n\t\t\t},\n\t\t\t\"description\": {\n\t\t\t\t\"ro\": \"Protocoalele deținute de o persoană.\",\n\t\t\t\t\"en\": \"The protocols a person owns.\"\n\t\t\t},\n\t\t\t\"permissions\": [\n\t\t\t\t{\n\t\t\t\t\t\"key\": \"listen\",\n\t\t\t\t\t\"name\": {\n\t\t\t\t\t\t\"ro\": \"Ascultare protocol\",\n\t\t\t\t\t\t\"en\": \"Listen to a protocol\"\n\t\t\t\t\t},\n\t\t\t\t\t\"grants\": [\"eqsync_protocol_licence#listener\"],\n\t\t\t\t\t\"effect\": \"read\"\n\t\t\t\t}\n\t\t\t]\n\t\t}\n\t],\n\t\"objects\": [\n\t\t{\n\t\t\t\"type\": \"eqsync_programme_enrollment\",\n\t\t\t\"scope\": {\n\t\t\t\t\"scope_type\": \"platform\",\n\t\t\t\t\"relation\": \"parent_platform\"\n\t\t\t},\n\t\t\t\"relations\": [\n\t\t\t\t{\n\t\t\t\t\t\"name\": \"parent_platform\",\n\t\t\t\t\t\"from\": [\"[platform]\"]\n\t\t\t\t}\n\t\t\t]\n\t\t},\n\t\t{\n\t\t\t\"type\": \"eqsync_protocol_licence\",\n\t\t\t\"scope\": {\n\t\t\t\t\"scope_type\": \"platform\",\n\t\t\t\t\"relation\": \"parent_platform\"\n\t\t\t},\n\t\t\t\"relations\": [\n\t\t\t\t{\n\t\t\t\t\t\"name\": \"parent_platform\",\n\t\t\t\t\t\"from\": [\"[platform]\"]\n\t\t\t\t}\n\t\t\t]\n\t\t}\n\t],\n\t\"roles\": [\n\t\t{\n\t\t\t\"key\": \"eqsync:programme_support\",\n\t\t\t\"name\": {\n\t\t\t\t\"ro\": \"Suport program\",\n\t\t\t\t\"en\": \"Programme support\"\n\t\t\t},\n\t\t\t\"scope_type\": \"platform\",\n\t\t\t\"permissions\": [\"programme:view\"],\n\t\t\t\"assignable\": true,\n\t\t\t\"max_duration\": null,\n\t\t\t\"description\": {\n\t\t\t\t\"ro\": \"Vede stadiul înscrierii pentru a ajuta o persoană care cere sprijin.\",\n\t\t\t\t\"en\": \"Sees enrolment status to help a person who asks for support.\"\n\t\t\t}\n\t\t}\n\t],\n\t\"group_bindings\": [],\n\t\"providers\": {\n\t\t\"identity\": {\n\t\t\t\"supported\": [\"authentik\"],\n\t\t\t\"selected\": \"authentik\"\n\t\t},\n\t\t\"authorization\": {\n\t\t\t\"supported\": [\"autorizare\"],\n\t\t\t\"selected\": \"autorizare\"\n\t\t}\n\t}\n}\n"
