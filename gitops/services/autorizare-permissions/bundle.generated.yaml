  catalog__agent.manifest.json: "{\n\t\"$comment\": \"Mastra Studio for staff (apps/agent-studio, studio.psizone.ro). Module `agent` (an .fga module name is an identifier, so not the app slug agent-studio; the object type agent_studio carries its prefix). One object, agent_studio:psi. Studio asks Check(user:<sub>, view|operate, agent_studio:psi) through @psi/account's OpenFGA client and stores no role. Until psi's OpenFGA has a store and model for it, src/auth/authorize.ts (groupAuthorizer) evaluates the same two relations from the directory groups app-agent-studio-viewer and app-agent-studio-operator, which Authentik vouches for (userinfo), never from a request header. AGENT_STUDIO_MODE=read-only (the default) refuses operate to everyone.\",\n\t\"app\": \"agent-studio\",\n\t\"module\": \"agent\",\n\t\"version\": 1,\n\t\"generated_dir\": \"src/authz\",\n\t\"features\": [\n\t\t{\n\t\t\t\"key\": \"studio\",\n\t\t\t\"name\": {\n\t\t\t\t\"ro\": \"Studio\",\n\t\t\t\t\"en\": \"Studio\"\n\t\t\t},\n\t\t\t\"permissions\": [\n\t\t\t\t{\n\t\t\t\t\t\"key\": \"view\",\n\t\t\t\t\t\"name\": {\n\t\t\t\t\t\t\"ro\": \"Deschide Studio: agenți, fluxuri, urme, conversații\",\n\t\t\t\t\t\t\"en\": \"Open Studio: agents, workflows, traces, threads\"\n\t\t\t\t\t},\n\t\t\t\t\t\"grants\": [\"agent_studio#view\"],\n\t\t\t\t\t\"effect\": \"read\"\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"key\": \"operate\",\n\t\t\t\t\t\"name\": {\n\t\t\t\t\t\t\"ro\": \"Rulează agenți, instrumente și fluxuri (cheltuie credit OpenRouter)\",\n\t\t\t\t\t\t\"en\": \"Run agents, tools and workflows (spends OpenRouter credit)\"\n\t\t\t\t\t},\n\t\t\t\t\t\"grants\": [\"agent_studio#operate\"],\n\t\t\t\t\t\"effect\": \"write\"\n\t\t\t\t}\n\t\t\t]\n\t\t}\n\t],\n\t\"objects\": [\n\t\t{\n\t\t\t\"type\": \"agent_studio\",\n\t\t\t\"scope\": {\n\t\t\t\t\"scope_type\": \"platform\",\n\t\t\t\t\"relation\": \"parent_platform\"\n\t\t\t},\n\t\t\t\"relations\": [\n\t\t\t\t{\n\t\t\t\t\t\"name\": \"parent_platform\",\n\t\t\t\t\t\"from\": [\"[platform]\"]\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"name\": \"view\",\n\t\t\t\t\t\"from\": [\"[user, group#member]\", \"operate\", \"administrator from parent_platform\"]\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"name\": \"operate\",\n\t\t\t\t\t\"from\": [\"[user, group#member]\", \"administrator from parent_platform\"]\n\t\t\t\t}\n\t\t\t]\n\t\t}\n\t],\n\t\"roles\": [\n\t\t{\n\t\t\t\"key\": \"agent:studio_viewer\",\n\t\t\t\"name\": {\n\t\t\t\t\"ro\": \"Observator Studio\",\n\t\t\t\t\"en\": \"Studio viewer\"\n\t\t\t},\n\t\t\t\"description\": {\n\t\t\t\t\"ro\": \"Vede agenții, urmele și conversațiile; nu rulează nimic.\",\n\t\t\t\t\"en\": \"Sees agents, traces and threads; runs nothing.\"\n\t\t\t},\n\t\t\t\"scope_type\": \"platform\",\n\t\t\t\"grants\": [\"agent_studio#view\"],\n\t\t\t\"assignable\": true,\n\t\t\t\"max_duration\": null\n\t\t},\n\t\t{\n\t\t\t\"key\": \"agent:studio_operator\",\n\t\t\t\"name\": {\n\t\t\t\t\"ro\": \"Operator Studio\",\n\t\t\t\t\"en\": \"Studio operator\"\n\t\t\t},\n\t\t\t\"description\": {\n\t\t\t\t\"ro\": \"Rulează agenți, instrumente și fluxuri când Studio e în modul operate.\",\n\t\t\t\t\"en\": \"Runs agents, tools and workflows when Studio is in operate mode.\"\n\t\t\t},\n\t\t\t\"scope_type\": \"platform\",\n\t\t\t\"grants\": [\"agent_studio#view\", \"agent_studio#operate\"],\n\t\t\t\"assignable\": true,\n\t\t\t\"max_duration\": null\n\t\t}\n\t],\n\t\"group_bindings\": [],\n\t\"providers\": {\n\t\t\"identity\": {\n\t\t\t\"supported\": [\"authentik\"],\n\t\t\t\"selected\": \"authentik\"\n\t\t},\n\t\t\"authorization\": {\n\t\t\t\"supported\": [\"autorizare\"],\n\t\t\t\"selected\": \"autorizare\"\n\t\t}\n\t},\n\t\"public_reasons\": [\n\t\t{\n\t\t\t\"key\": \"health_probe\",\n\t\t\t\"description\": {\n\t\t\t\t\"ro\": \"/health răspunde fără date, pentru sondele kubelet.\",\n\t\t\t\t\"en\": \"/health answers with no data, for the kubelet's probes.\"\n\t\t\t}\n\t\t},\n\t\t{\n\t\t\t\"key\": \"auth_capabilities\",\n\t\t\t\"description\": {\n\t\t\t\t\"ro\": \"/api/auth/capabilities spune paginii Studio dacă e nevoie de autentificare; nu întoarce date.\",\n\t\t\t\t\"en\": \"/api/auth/capabilities tells Studio's page whether sign-in is needed; it returns no data.\"\n\t\t\t}\n\t\t}\n\t]\n}\n"
  catalog__agent.roles.json: "{\n\t\"$schema\": \"./catalog.schema.json\",\n\t\"$generated\": \"from apps/agent-studio/authz.manifest.json — do not edit; run authz/tools/generate.py\",\n\t\"module\": \"agent\",\n\t\"version\": 1,\n\t\"scope_resolvers\": {\n\t\t\"agent_studio\": {\n\t\t\t\"scope_type\": \"platform\",\n\t\t\t\"relation\": \"parent_platform\"\n\t\t}\n\t},\n\t\"group_bindings\": [],\n\t\"mirror_relations\": [\n\t\t\"platform#administrator\",\n\t\t\"platform#role_agent_studio_operator\",\n\t\t\"platform#role_agent_studio_viewer\"\n\t],\n\t\"features\": [\n\t\t{\n\t\t\t\"key\": \"studio\",\n\t\t\t\"name\": {\n\t\t\t\t\"ro\": \"Studio\",\n\t\t\t\t\"en\": \"Studio\"\n\t\t\t}\n\t\t}\n\t],\n\t\"roles\": [\n\t\t{\n\t\t\t\"key\": \"agent:studio_viewer\",\n\t\t\t\"name\": {\n\t\t\t\t\"ro\": \"Observator Studio\",\n\t\t\t\t\"en\": \"Studio viewer\"\n\t\t\t},\n\t\t\t\"description\": {\n\t\t\t\t\"ro\": \"Vede agenții, urmele și conversațiile; nu rulează nimic.\",\n\t\t\t\t\"en\": \"Sees agents, traces and threads; runs nothing.\"\n\t\t\t},\n\t\t\t\"scope_type\": \"platform\",\n\t\t\t\"relation\": \"role_agent_studio_viewer\",\n\t\t\t\"grants\": [\"agent_studio#view\"],\n\t\t\t\"assignable\": true,\n\t\t\t\"max_duration\": null\n\t\t},\n\t\t{\n\t\t\t\"key\": \"agent:studio_operator\",\n\t\t\t\"name\": {\n\t\t\t\t\"ro\": \"Operator Studio\",\n\t\t\t\t\"en\": \"Studio operator\"\n\t\t\t},\n\t\t\t\"description\": {\n\t\t\t\t\"ro\": \"Rulează agenți, instrumente și fluxuri când Studio e în modul operate.\",\n\t\t\t\t\"en\": \"Runs agents, tools and workflows when Studio is in operate mode.\"\n\t\t\t},\n\t\t\t\"scope_type\": \"platform\",\n\t\t\t\"relation\": \"role_agent_studio_operator\",\n\t\t\t\"grants\": [\"agent_studio#view\", \"agent_studio#operate\"],\n\t\t\t\"assignable\": true,\n\t\t\t\"max_duration\": null\n\t\t}\n\t]\n}\n"
  catalog__blog.manifest.json: "{\n\t\"$schema\": \"../../../seb/authz/manifest.schema.json\",\n\t\"$comment\": \"The blog's account resources (docs/plans/accounts.md). Every object is scoped to the estate's platform (platform:psi): psi's visitors belong to no organisation. The OWNER of a record is a per-record grant the application supplies at Check time as a contextual tuple, read from its own row (the system of record); nothing about a visitor is persisted in OpenFGA. Staff reach records only through the catalog roles below, granted in Polaris. No role reads guide memory or clinical data; none exists here.\",\n\t\"app\": \"blog-web\",\n\t\"module\": \"blog\",\n\t\"version\": 1,\n\t\"permission_model\": \"relational\",\n\t\"generated_dir\": \"src/authz\",\n\t\"features\": [\n\t\t{\n\t\t\t\"key\": \"saved\",\n\t\t\t\"name\": {\n\t\t\t\t\"ro\": \"Articole salvate\",\n\t\t\t\t\"en\": \"Saved articles\"\n\t\t\t},\n\t\t\t\"description\": {\n\t\t\t\t\"ro\": \"Lista de lectură a unei persoane.\",\n\t\t\t\t\"en\": \"A person's reading list.\"\n\t\t\t},\n\t\t\t\"permissions\": [\n\t\t\t\t{\n\t\t\t\t\t\"key\": \"view\",\n\t\t\t\t\t\"name\": {\n\t\t\t\t\t\t\"ro\": \"Vizualizare listă\",\n\t\t\t\t\t\t\"en\": \"View the list\"\n\t\t\t\t\t},\n\t\t\t\t\t\"grants\": [\"blog_saved_article#viewer\"],\n\t\t\t\t\t\"effect\": \"read\"\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"key\": \"manage\",\n\t\t\t\t\t\"name\": {\n\t\t\t\t\t\t\"ro\": \"Gestionare listă\",\n\t\t\t\t\t\t\"en\": \"Manage the list\"\n\t\t\t\t\t},\n\t\t\t\t\t\"grants\": [\"blog_saved_article#editor\"],\n\t\t\t\t\t\"effect\": \"write\",\n\t\t\t\t\t\"implies\": [\"saved:view\"]\n\t\t\t\t}\n\t\t\t]\n\t\t}\n\t],\n\t\"objects\": [\n\t\t{\n\t\t\t\"type\": \"blog_saved_article\",\n\t\t\t\"scope\": {\n\t\t\t\t\"scope_type\": \"platform\",\n\t\t\t\t\"relation\": \"parent_platform\"\n\t\t\t},\n\t\t\t\"relations\": [\n\t\t\t\t{\n\t\t\t\t\t\"name\": \"parent_platform\",\n\t\t\t\t\t\"from\": [\"[platform]\"]\n\t\t\t\t}\n\t\t\t]\n\t\t}\n\t],\n\t\"roles\": [\n\t\t{\n\t\t\t\"key\": \"blog:privacy_officer\",\n\t\t\t\"name\": {\n\t\t\t\t\"ro\": \"Responsabil protecția datelor (blog)\",\n\t\t\t\t\"en\": \"Data protection officer (blog)\"\n\t\t\t},\n\t\t\t\"scope_type\": \"platform\",\n\t\t\t\"permissions\": [\"saved:view\"],\n\t\t\t\"assignable\": true,\n\t\t\t\"max_duration\": null,\n\t\t\t\"description\": {\n\t\t\t\t\"ro\": \"Exportă lista de lectură la cererea persoanei.\",\n\t\t\t\t\"en\": \"Exports the reading list at the person's request.\"\n\t\t\t}\n\t\t}\n\t],\n\t\"group_bindings\": [],\n\t\"providers\": {\n\t\t\"identity\": {\n\t\t\t\"supported\": [\"authentik\"],\n\t\t\t\"selected\": \"authentik\"\n\t\t},\n\t\t\"authorization\": {\n\t\t\t\"supported\": [\"autorizare\"],\n\t\t\t\"selected\": \"autorizare\"\n\t\t}\n\t}\n}\n"
  catalog__blog.roles.json: "{\n\t\"$schema\": \"./catalog.schema.json\",\n\t\"$generated\": \"from apps/blog-web/authz.manifest.json — do not edit; run authz/tools/generate.py\",\n\t\"module\": \"blog\",\n\t\"version\": 1,\n\t\"scope_resolvers\": {\n\t\t\"blog_saved_article\": {\n\t\t\t\"scope_type\": \"platform\",\n\t\t\t\"relation\": \"parent_platform\"\n\t\t},\n\t\t\"blog_permission_set\": {\n\t\t\t\"scope_type\": \"org\",\n\t\t\t\"relation\": \"parent_org\"\n\t\t}\n\t},\n\t\"group_bindings\": [],\n\t\"mirror_relations\": [\n\t\t\"platform#administrator\",\n\t\t\"platform#perm_blog_saved_manage\",\n\t\t\"platform#perm_blog_saved_view\",\n\t\t\"platform#role_blog_privacy_officer\"\n\t],\n\t\"features\": [\n\t\t{\n\t\t\t\"key\": \"saved\",\n\t\t\t\"name\": {\n\t\t\t\t\"ro\": \"Articole salvate\",\n\t\t\t\t\"en\": \"Saved articles\"\n\t\t\t}\n\t\t}\n\t],\n\t\"roles\": [\n\t\t{\n\t\t\t\"key\": \"blog:privacy_officer\",\n\t\t\t\"name\": {\n\t\t\t\t\"ro\": \"Responsabil protecția datelor (blog)\",\n\t\t\t\t\"en\": \"Data protection officer (blog)\"\n\t\t\t},\n\t\t\t\"description\": {\n\t\t\t\t\"ro\": \"Exportă lista de lectură la cererea persoanei.\",\n\t\t\t\t\"en\": \"Exports the reading list at the person's request.\"\n\t\t\t},\n\t\t\t\"scope_type\": \"platform\",\n\t\t\t\"relation\": \"role_blog_privacy_officer\",\n\t\t\t\"grants\": [\"blog_saved_article#viewer\"],\n\t\t\t\"assignable\": true,\n\t\t\t\"max_duration\": null\n\t\t}\n\t]\n}\n"
  catalog__cms.manifest.json: "{\n\t\"$comment\": \"The psi CMS (apps/cms). Permissions are decided per brand: object cms_brand:<psizone|eqsync|hemisync|blog> (one admin for the four sites). The CMS asks Check(user:<sub>, <relation>, cms_brand:<brand>) and ListObjects(cms_brand, <relation>) and stores no role. Until psi's OpenFGA is reachable from the CMS, src/authz/interim.ts evaluates these same roles from CMS_ROLE_ASSIGNMENTS (docs/plans/blog-platform.md).\",\n\t\"app\": \"cms\",\n\t\"module\": \"cms\",\n\t\"version\": 1,\n\t\"generated_dir\": \"src/authz\",\n\t\"features\": [\n\t\t{\n\t\t\t\"key\": \"content\",\n\t\t\t\"name\": {\n\t\t\t\t\"ro\": \"Conținut\",\n\t\t\t\t\"en\": \"Content\"\n\t\t\t},\n\t\t\t\"permissions\": [\n\t\t\t\t{\n\t\t\t\t\t\"key\": \"read\",\n\t\t\t\t\t\"name\": {\n\t\t\t\t\t\t\"ro\": \"Citește conținutul, inclusiv ciornele\",\n\t\t\t\t\t\t\"en\": \"Read content, drafts included\"\n\t\t\t\t\t},\n\t\t\t\t\t\"grants\": [\"cms_brand#read\"],\n\t\t\t\t\t\"effect\": \"read\"\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"key\": \"write\",\n\t\t\t\t\t\"name\": {\n\t\t\t\t\t\t\"ro\": \"Scrie și modifică ciorne\",\n\t\t\t\t\t\t\"en\": \"Write and edit drafts\"\n\t\t\t\t\t},\n\t\t\t\t\t\"grants\": [\"cms_brand#write\"],\n\t\t\t\t\t\"effect\": \"write\"\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"key\": \"publish\",\n\t\t\t\t\t\"name\": {\n\t\t\t\t\t\t\"ro\": \"Publică (doar conținut aprobat clinic)\",\n\t\t\t\t\t\t\"en\": \"Publish (clinically approved content only)\"\n\t\t\t\t\t},\n\t\t\t\t\t\"grants\": [\"cms_brand#publish\"],\n\t\t\t\t\t\"effect\": \"write\"\n\t\t\t\t}\n\t\t\t]\n\t\t},\n\t\t{\n\t\t\t\"key\": \"review\",\n\t\t\t\"name\": {\n\t\t\t\t\"ro\": \"Revizuire clinică\",\n\t\t\t\t\"en\": \"Clinical review\"\n\t\t\t},\n\t\t\t\"permissions\": [\n\t\t\t\t{\n\t\t\t\t\t\"key\": \"clinical_review\",\n\t\t\t\t\t\"name\": {\n\t\t\t\t\t\t\"ro\": \"Aprobă sau respinge textul altcuiva\",\n\t\t\t\t\t\t\"en\": \"Approve or reject someone else's text\"\n\t\t\t\t\t},\n\t\t\t\t\t\"grants\": [\"cms_brand#clinical_review\"],\n\t\t\t\t\t\"effect\": \"write\"\n\t\t\t\t}\n\t\t\t]\n\t\t},\n\t\t{\n\t\t\t\"key\": \"media\",\n\t\t\t\"name\": {\n\t\t\t\t\"ro\": \"Media\",\n\t\t\t\t\"en\": \"Media\"\n\t\t\t},\n\t\t\t\"permissions\": [\n\t\t\t\t{\n\t\t\t\t\t\"key\": \"manage_media\",\n\t\t\t\t\t\"name\": {\n\t\t\t\t\t\t\"ro\": \"Încarcă și gestionează imagini\",\n\t\t\t\t\t\t\"en\": \"Upload and manage images\"\n\t\t\t\t\t},\n\t\t\t\t\t\"grants\": [\"cms_brand#manage_media\"],\n\t\t\t\t\t\"effect\": \"write\"\n\t\t\t\t}\n\t\t\t]\n\t\t},\n\t\t{\n\t\t\t\"key\": \"admin\",\n\t\t\t\"name\": {\n\t\t\t\t\"ro\": \"Administrare\",\n\t\t\t\t\"en\": \"Administration\"\n\t\t\t},\n\t\t\t\"permissions\": [\n\t\t\t\t{\n\t\t\t\t\t\"key\": \"admin\",\n\t\t\t\t\t\"name\": {\n\t\t\t\t\t\t\"ro\": \"Șterge conținut, vede persoanele\",\n\t\t\t\t\t\t\"en\": \"Delete content, see people\"\n\t\t\t\t\t},\n\t\t\t\t\t\"grants\": [\"cms_brand#admin\"],\n\t\t\t\t\t\"effect\": \"write\"\n\t\t\t\t}\n\t\t\t]\n\t\t},\n\t\t{\n\t\t\t\"key\": \"ai\",\n\t\t\t\"name\": {\n\t\t\t\t\"ro\": \"Setări AI\",\n\t\t\t\t\"en\": \"AI settings\"\n\t\t\t},\n\t\t\t\"permissions\": [\n\t\t\t\t{\n\t\t\t\t\t\"key\": \"ai_admin\",\n\t\t\t\t\t\"name\": {\n\t\t\t\t\t\t\"ro\": \"Schimbă setările AI ale brandului (încorporări, căutare, ghid)\",\n\t\t\t\t\t\t\"en\": \"Change the brand's AI settings (embeddings, search, guide)\"\n\t\t\t\t\t},\n\t\t\t\t\t\"grants\": [\"cms_brand#ai_admin\"],\n\t\t\t\t\t\"effect\": \"write\"\n\t\t\t\t}\n\t\t\t]\n\t\t},\n\t\t{\n\t\t\t\"key\": \"platform\",\n\t\t\t\"name\": {\n\t\t\t\t\"ro\": \"Platformă\",\n\t\t\t\t\"en\": \"Platform\"\n\t\t\t},\n\t\t\t\"permissions\": [\n\t\t\t\t{\n\t\t\t\t\t\"key\": \"ai_operator\",\n\t\t\t\t\t\"name\": {\n\t\t\t\t\t\t\"ro\": \"Operează ghidul: reindexează cunoștințele, pune o întrebare de test\",\n\t\t\t\t\t\t\"en\": \"Operate the guide: rebuild the knowledge index, ask a test question\"\n\t\t\t\t\t},\n\t\t\t\t\t\"grants\": [\"cms_brand#a