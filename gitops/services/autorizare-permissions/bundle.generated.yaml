  catalog__psizone.manifest.json: "{\n\t\"$schema\": \"../../../seb/authz/manifest.schema.json\",\n\t\"$comment\": \"Psizone's account resources (docs/plans/accounts.md). Every object is scoped to the estate's platform (platform:psi): psi's visitors belong to no organisation. The OWNER of a record is a per-record grant the application supplies at Check time as a contextual tuple, read from its own row (the system of record); nothing about a visitor is persisted in OpenFGA. Staff reach records only through the catalog roles below, granted in Polaris. No role reads guide memory or clinical data; none exists here.\",\n\t\"app\": \"psizone-web\",\n\t\"module\": \"psizone\",\n\t\"version\": 1,\n\t\"permission_model\": \"relational\",\n\t\"generated_dir\": \"src/authz\",\n\t\"features\": [\n\t\t{\n\t\t\t\"key\": \"account\",\n\t\t\t\"name\": {\n\t\t\t\t\"ro\": \"Cont\",\n\t\t\t\t\"en\": \"Account\"\n\t\t\t},\n\t\t\t\"description\": {\n\t\t\t\t\"ro\": \"Contul estate al unei persoane: profil minim și consimțăminte.\",\n\t\t\t\t\"en\": \"A person's estate account: minimal profile and consents.\"\n\t\t\t},\n\t\t\t\"permissions\": [\n\t\t\t\t{\n\t\t\t\t\t\"key\": \"view\",\n\t\t\t\t\t\"name\": {\n\t\t\t\t\t\t\"ro\": \"Vizualizare cont\",\n\t\t\t\t\t\t\"en\": \"View an account\"\n\t\t\t\t\t},\n\t\t\t\t\t\"grants\": [\"psizone_account#viewer\"],\n\t\t\t\t\t\"effect\": \"read\",\n\t\t\t\t\t\"description\": {\n\t\t\t\t\t\t\"ro\": \"Citește profilul minim și consimțămintele (export GDPR).\",\n\t\t\t\t\t\t\"en\": \"Reads the minimal profile and consents (GDPR export).\"\n\t\t\t\t\t}\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"key\": \"manage\",\n\t\t\t\t\t\"name\": {\n\t\t\t\t\t\t\"ro\": \"Gestionare cont\",\n\t\t\t\t\t\t\"en\": \"Manage an account\"\n\t\t\t\t\t},\n\t\t\t\t\t\"grants\": [\"psizone_account#editor\"],\n\t\t\t\t\t\"effect\": \"write\",\n\t\t\t\t\t\"implies\": [\"account:view\"],\n\t\t\t\t\t\"description\": {\n\t\t\t\t\t\t\"ro\": \"Schimbă profilul și consimțămintele (persoana