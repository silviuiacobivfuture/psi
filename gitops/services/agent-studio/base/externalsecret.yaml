# agent-studio's environment, synced from OpenBao into the Secret `agent-studio-env` the Deployment
# and its assert-secrets initContainer read. Values live ONLY in OpenBao; this holds the mapping.
#
#   secret/apps/agent-studio/env   OPENROUTER_API_KEY   Studio's OWN OpenRouter key, so what staff
#                                  spend in Studio is apart from what the sites spend (and can be
#                                  capped and revoked on its own at OpenRouter)
#   secret/apps/chroma/env         CHROMA_SERVER_TOKEN -> CHROMA_API_KEY, the token the knowledge
#                                  store sends to Chroma's auth sidecar — the SAME property Chroma
#                                  reads, as the sites do (gitops/services/psizone-web)
#
# No Convex key: the scheduling tools create real appointment holds and stay unwired
# (AGENT_STUDIO_SCHEDULING=off). No OpenFGA token yet: the interim group bindings decide until
# psi's OpenFGA has a store and model for agent_studio (docs/plans/agent-studio.md).
#
# FAIL LOUD: per-key data[] with explicit properties, no dataFrom.extract — a missing key makes
# this ExternalSecret SecretSyncedError rather than render an empty value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-studio-env
spec:
  refreshInterval: 1m
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: agent-studio-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef: { key: apps/agent-studio/env, property: OPENROUTER_API_KEY }
    - secretKey: CHROMA_API_KEY
      remoteRef: { key: apps/chroma/env, property: CHROMA_SERVER_TOKEN }
