# Studio's forward-auth: the estate's gate (gitops/platform/authentik/middleware-forwardauth.yaml,
# the embedded outpost's Traefik endpoint), with ONE header more — X-authentik-jwt, the token the
# outpost minted for this person on THIS application (authentik 2026.5.3
# internal/outpost/proxyv2/application/mode_common.go). The pod confirms it with Authentik and
# authorises on the groups Authentik answers with (apps/agent-studio/src/auth). The estate's own
# Middleware does not forward it; until SEB adds it there (docs/plans/agent-studio.md,
# registration), this one does. Traefik REPLACES each listed header with the outpost's value, so
# a browser cannot send its own.
#
# Only the gated Ingress uses this. The callback Ingress keeps the estate's exact chain
# (sso-restart.sh refuses any other middleware on a callback route).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: agent-studio-forwardauth
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
