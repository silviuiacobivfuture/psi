# cms on dev. CI moves newTag after each image it pushes; never edit it by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cms
resources:
  - ../../base
images:
  - name: registry.psizone.ro/psi/cms
    newTag: "cfd17d0"
# How long a sign-in lasts: the estate's SESSION_LIFETIME, as the hub, the console and the
# shared applications follow it (apps/cms/src/auth/session-lifetime.ts reads it).
components:
  - ../../../../components/whitelabel
replacements:
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.SESSION_LIFETIME }
    targets:
      - select: { kind: Deployment, name: cms }
        fieldPaths: ["spec.template.spec.containers.[name=cms].env.[name=SESSION_LIFETIME].value"]
