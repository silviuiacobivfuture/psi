# cms's environment, synced from OpenBao into the Secret `cms-env` the Deployment and its
# assert-secrets initContainer read. Values live ONLY in OpenBao; this holds the mapping.
#
#   secret/apps/cms/db     username, password    the database owner (also CNPG's initdb, below)
#   secret/apps/cms/env    PAYLOAD_SECRET, BREAKGLASS_EMAIL, BREAKGLASS_PASSWORD
#   secret/apps/cms/oidc   client_id, client_secret   the SAME pair Authentik's cms provider
#                          reads (authentik-cms-oidc in gitops/platform/authentik), so they
#                          cannot drift
#   secret/platform/object-storage/dev   the estate's object-storage key (bucket psi-cms-dev)
#
# FAIL LOUD: per-key data[] with explicit properties, no dataFrom.extract — a missing key makes
# this ExternalSecret SecretSyncedError rather than render an empty value. The host is
# namespace-relative (cms-db-rw) on purpose: the app and its database share a namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cms-env
spec:
  refreshInterval: 1m
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: cms-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        DATABASE_URI: "postgresql://{{ .db_username }}:{{ .db_password }}@cms-db-rw:5432/cms?sslmode=disable"
        PAYLOAD_SECRET: "{{ .payload_secret }}"
        BREAKGLASS_EMAIL: "{{ .breakglass_email }}"
        BREAKGLASS_PASSWORD: "{{ .breakglass_password }}"
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        S3_ACCESS_KEY_ID: "{{ .s3_access_key_id }}"
        S3_SECRET_ACCESS_KEY: "{{ .s3_secret_access_key }}"
        CHROMA_API_KEY: "{{ .chroma_token }}"
        OPENROUTER_API_KEY: "{{ .openrouter_key }}"
        PSI_CONTROL_SECRET: "{{ .control_secret }}"
        ANALYTICS_INGEST_TOKEN: "{{ .analytics_token }}"
        CMS_REVALIDATE_SECRET: "{{ .revalidate_secret }}"
        PREVIEW_SECRET: "{{ .preview_secret }}"
  data:
    - secretKey: db_username
      remoteRef: { key: apps/cms/db, property: username }
    - secretKey: db_password
      remoteRef: { key: apps/cms/db, property: password }
    - secretKey: payload_secret
      remoteRef: { key: apps/cms/env, property: PAYLOAD_SECRET }
    - secretKey: breakglass_email
      remoteRef: { key: apps/cms/env, property: BREAKGLASS_EMAIL }
    - secretKey: breakglass_password
      remoteRef: { key: apps/cms/env, property: BREAKGLASS_PASSWORD }
    - secretKey: oidc_client_id
      remoteRef: { key: apps/cms/oidc, property: client_id }
    - secretKey: oidc_client_secret
      remoteRef: { key: apps/cms/oidc, property: client_secret }
    - secretKey: s3_access_key_id
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: s3_secret_access_key
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
    - secretKey: chroma_token
      remoteRef: { key: apps/chroma/env, property: CHROMA_SERVER_TOKEN }
    - secretKey: openrouter_key
      remoteRef: { key: apps/psizone-web/env, property: OPENROUTER_API_KEY }
    - secretKey: control_secret
      remoteRef: { key: apps/control/env, property: PSI_CONTROL_SECRET }
    - secretKey: analytics_token
      remoteRef: { key: apps/control/env, property: ANALYTICS_INGEST_TOKEN }
    - secretKey: revalidate_secret
      remoteRef: { key: apps/control/env, property: CMS_REVALIDATE_SECRET }
    - secretKey: preview_secret
      remoteRef: { key: apps/control/env, property: PREVIEW_SECRET }
---
# The database owner's credential in the form CNPG's bootstrap requires.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cms-db-app
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: cms-db-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef: { key: apps/cms/db, property: username }
    - secretKey: password
      remoteRef: { key: apps/cms/db, property: password }
---
# CNPG's WAL-archive credentials, under the AWS_* names barman expects. Separate from the app's
# Secret so a rotation of one never silently stops the other.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cms-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: cms-backup-s3, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
