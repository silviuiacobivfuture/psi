# The scheduling server key, synced from OpenBao secret/apps/scheduling/env into the Secret
# `cms-scheduling` (PSI_SCHEDULING_KEY: what the Convex functions demand, packages/scheduling).
# The SAME property the scheduling-deploy Job sets inside the deployment and psizone-web reads, so
# one rotation in OpenBao reaches all three.
#
# Its own ExternalSecret, read by the Deployment as an OPTIONAL envFrom, because scheduling is
# optional for the CMS (src/env.ts: CONVEX_URL and PSI_SCHEDULING_KEY are both optional; without the
# key /admin/platform/scheduling shows "not configured"). Folded into cms-env, a missing key would
# put that whole Secret in SecretSyncedError and block the CMS. Here it only shows on THIS object.
# Still per-key data[]: never an empty value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cms-scheduling
spec:
  refreshInterval: 1m
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: cms-scheduling
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: PSI_SCHEDULING_KEY
      remoteRef: { key: apps/scheduling/env, property: PSI_SCHEDULING_KEY }
