apiVersion: apps/v1
kind: Deployment
metadata:
  name: cms
  labels: { app: cms }
  annotations:
    # Rolls the pods when cms-env changes (OpenBao -> ESO -> Secret -> roll).
    reloader.stakater.com/auto: "true"
    alerts.psizone.ro/owner: ops@psizone.ro
spec:
  replicas: 1
  selector:
    matchLabels: { app: cms }
  template:
    metadata:
      labels: { app: cms }
    spec:
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        # FIRST: fail LOUD on a missing or blank secret, before the app boots (src/env.ts would
        # also refuse, naming the key). `${VAR:-}` survives kubelet expansion; `$$` would not —
        # assert each key literally. Adding a key = adding its line.
        - name: assert-secrets
          image: registry.psizone.ro/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
          envFrom:
            - secretRef: { name: cms-env }
          command:
            - sh
            - -c
            - >-
              m=0;
              [ -n "${DATABASE_URI:-}" ] || { echo "MISSING REQUIRED SECRET: DATABASE_URI" >&2; m=1; };
              [ -n "${PAYLOAD_SECRET:-}" ] || { echo "MISSING REQUIRED SECRET: PAYLOAD_SECRET" >&2; m=1; };
              [ -n "${BREAKGLASS_EMAIL:-}" ] || { echo "MISSING REQUIRED SECRET: BREAKGLASS_EMAIL" >&2; m=1; };
              [ -n "${BREAKGLASS_PASSWORD:-}" ] || { echo "MISSING REQUIRED SECRET: BREAKGLASS_PASSWORD" >&2; m=1; };
              [ -n "${OIDC_CLIENT_ID:-}" ] || { echo "MISSING REQUIRED SECRET: OIDC_CLIENT_ID" >&2; m=1; };
              [ -n "${OIDC_CLIENT_SECRET:-}" ] || { echo "MISSING REQUIRED SECRET: OIDC_CLIENT_SECRET" >&2; m=1; };
              [ -n "${S3_ACCESS_KEY_ID:-}" ] || { echo "MISSING REQUIRED SECRET: S3_ACCESS_KEY_ID" >&2; m=1; };
              [ -n "${S3_SECRET_ACCESS_KEY:-}" ] || { echo "MISSING REQUIRED SECRET: S3_SECRET_ACCESS_KEY" >&2; m=1; };
              [ "$m" = 0 ] && echo secrets-ok
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
            readOnlyRootFilesystem: true
        # SECOND: wait for the database to accept connections (CNPG creates it alongside this
        # Deployment). Payload keeps a failed first connection for the life of the process, so
        # starting before the database is up leaves a pod that answers 500 until restarted.
        # Bounded: after 5 minutes it fails loud instead of waiting forever.
        - name: wait-for-db
          image: registry.psizone.ro/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
          command:
            - sh
            - -c
            - 'i=0; until nc -z -w 2 cms-db-rw 5432; do i=$((i+1)); [ "$i" -ge 150 ] && { echo "DATABASE NOT REACHABLE: cms-db-rw:5432" >&2; exit 1; }; sleep 2; done; echo db-ok'
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
            readOnlyRootFilesystem: true
      containers:
        - name: cms
          image: registry.psizone.ro/psi/cms
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef: { name: cms-env }
            # OPTIONAL by design: the scheduling server key (secret/apps/scheduling/env). Absent, the
            # CMS scheduling page says "not configured" and nothing else changes; this never blocks a
            # deploy. envFrom is read at start: Reloader rolls the pod when the Secret CHANGES; after
            # the key first appears (Secret created) roll once by hand.
            - secretRef: { name: cms-scheduling, optional: true }
          env:
            - { name: SERVER_URL, value: "https://cms.psizone.ro" }
            - { name: OIDC_ISSUER, value: "https://auth.psizone.ro/application/o/cms/" }
            # Who holds which CMS role until psi's OpenFGA answers the CMS (src/authz/interim.ts).
            # Not a secret — a reviewed binding: the estate's admins (Authentik group platform-admins)
            # are CMS admins on every brand; each admin also by email until the cms provider sends groups. Add editors here: group:app-cms-editor=cms:editor[@brand].
            - { name: CMS_ROLE_ASSIGNMENTS, value: "group:platform-admins=cms:admin;silviu.iacob@ivfuture.ro=cms:admin;turcu_daniela@icloud.com=cms:admin;adi_rar@yahoo.com=cms:admin;nicholas.turcu@icloud.com=cms:admin;trifan.lucian.sergiu@gmail.com=cms:admin;psizone-reader@service.psizone.ro=cms:reader@psizone;eqsync-reader@service.psizone.ro=cms:reader@eqsync;hemisync-reader@service.psizone.ro=cms:reader@hemisync;blog-reader@service.psizone.ro=cms:reader@psizone+cms:reader@eqsync+cms:reader@hemisync+cms:reader@blog" }
            - { name: S3_BUCKET, value: psi-cms-dev }
            - { name: S3_REGION, value: nbg1 }
            - { name: S3_ENDPOINT, value: "https://nbg1.your-objectstorage.com" }
            - { name: CHROMA_URL, value: "http://chroma.chroma.svc:8000" }
            # The scheduling store (packages/scheduling): the Convex backend's in-cluster Service
            # (its NetworkPolicy admits this namespace and pod, gitops/services/scheduling-backend).
            - { name: CONVEX_URL, value: "http://scheduling-backend.scheduling.svc:3210" }
            - { name: SITE_WEBHOOK_URLS, value: "http://psizone-web.psizone-web.svc,http://hemisync-web.hemisync-web.svc,http://blog-web.blog-web.svc" }
            - { name: PSIZONE_CONTROL_URL, value: "http://psizone-web.psizone-web.svc" }
            - { name: HEMISYNC_CONTROL_URL, value: "http://hemisync-web.hemisync-web.svc" }
            - { name: BLOG_CONTROL_URL, value: "http://blog-web.blog-web.svc" }
            - { name: BLOG_PREVIEW_URL, value: "https://blog.psizone.ro" }
            # The repository's articles arrive as drafts after every deploy (never overwriting
            # what a person edited); src/import/run-import.ts.
            - { name: PSI_IMPORT_REPO_ARTICLES, value: "true" }
          resources:
            # psi 2026-11-12: request = measured peak 136Mi ×1.3; limit unchanged
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 1Gi }
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /admin/login, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 5
          # Liveness reads through Payload (and so the database): a process whose Payload
          # failed to start answers 500 here and is restarted, rather than sitting unready.
          livenessProbe:
            httpGet: { path: /admin/login, port: 8080 }
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
