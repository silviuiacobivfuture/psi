# clinic's environment, synced from OpenBao into the Secret `clinic-env` the Deployment and its
# assert-secrets initContainer read. Values live ONLY in OpenBao; this holds the mapping.
# The paths follow docs/plans/accounts.md §6 (the estate's single sign-on contract):
#
#   secret/apps/clinic/oidc      client_id, client_secret   the SAME pair Authentik's clinic provider reads
#                                (authentik-clinic-oidc in gitops/platform/authentik), so they cannot drift
#   secret/apps/clinic/env       SESSION_SECRET (generated, 64), OPENFGA_TOKEN (one of the keys in
#                                apps/openfga/env#OPENFGA_AUTHN_PRESHARED_KEYS)
#   secret/apps/account/db       username, password         the shared account database
#   secret/apps/autorizare/env   OPENFGA_STORE_ID           the same property Polaris reads
#   secret/apps/account/openfga  model_id                   the model id psi pins (never "latest")
#   secret/apps/scheduling/env   PSI_SCHEDULING_KEY         the scheduling service's key (when its adapter lands)
#
# FAIL LOUD: per-key data[] with explicit properties, no dataFrom.extract — a missing key makes this
# ExternalSecret SecretSyncedError rather than render an empty value. All eight account settings are
# required together (packages/account loadAccountConfig: some without the others stops the boot).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clinic-env
spec:
  refreshInterval: 1m
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: clinic-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      data:
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        SESSION_SECRET: "{{ .session_secret }}"
        OPENFGA_TOKEN: "{{ .openfga_token }}"
        OPENFGA_STORE_ID: "{{ .openfga_store_id }}"
        OPENFGA_MODEL_ID: "{{ .openfga_model_id }}"
        ACCOUNT_DATABASE_URL: "postgresql://{{ .db_username }}:{{ .db_password }}@account-db-rw.account:5432/account?sslmode=disable"
        PSI_SCHEDULING_KEY: "{{ .scheduling_key }}"
  data:
    - secretKey: oidc_client_id
      remoteRef: { key: apps/clinic/oidc, property: client_id }
    - secretKey: oidc_client_secret
      remoteRef: { key: apps/clinic/oidc, property: client_secret }
    - secretKey: session_secret
      remoteRef: { key: apps/clinic/env, property: SESSION_SECRET }
    - secretKey: openfga_token
      remoteRef: { key: apps/clinic/env, property: OPENFGA_TOKEN }
    - secretKey: openfga_store_id
      remoteRef: { key: apps/autorizare/env, property: OPENFGA_STORE_ID }
    - secretKey: openfga_model_id
      remoteRef: { key: apps/account/openfga, property: model_id }
    - secretKey: db_username
      remoteRef: { key: apps/account/db, property: username }
    - secretKey: db_password
      remoteRef: { key: apps/account/db, property: password }
    - secretKey: scheduling_key
      remoteRef: { key: apps/scheduling/env, property: PSI_SCHEDULING_KEY }
