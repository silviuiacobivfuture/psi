# clinic on dev. CI moves newTag after each image it pushes; never edit it by hand.
# "bootstrap" is the placeholder until the first apps.yml run replaces it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: registry.psizone.ro/psi/clinic
    newTag: "5489213"
