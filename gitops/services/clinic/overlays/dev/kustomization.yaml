# clinic on dev. CI moves newTag after each image it pushes; never edit it by hand.
# NOT YET DEPLOYED: the Argo Application (gitops/apps/overlays/dev/apps/clinic.yaml) is not listed in that
# directory's kustomization.yaml until the OpenBao keys, the Authentik client and the scheduling adapter exist.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: registry.psizone.ro/psi/clinic
    newTag: "bootstrap"
