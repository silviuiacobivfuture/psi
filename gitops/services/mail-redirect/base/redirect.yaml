# mail.psizone.ro is where people type to read their mail (owner, 2026-11-27): it answers with a
# permanent redirect to the webmail at inbox.psizone.ro. The host is served by the *.psizone.ro
# record (the old proxied A record to an outside server was removed); its certificate is the
# estate's own, issued by DNS-01 like every other host.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: mail-to-inbox
spec:
  redirectRegex:
    regex: ^https?://mail\.psizone\.ro/(.*)
    replacement: https://inbox.psizone.ro/${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mail-redirect
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: stalwart-mail-to-inbox@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [mail.psizone.ro]
      secretName: mail-redirect-tls
  rules:
    - host: mail.psizone.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bulwark
                port:
                  number: 3000
