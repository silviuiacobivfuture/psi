# psizone-web's environment, synced from OpenBao secret/apps/psizone-web/env (REF_APP_ENV_PATH)
# into the Secret `psizone-web-env` the Deployment reads. Values live only in OpenBao.
# FAIL LOUD: every required key is named in data[] (a missing property -> SecretSyncedError);
# dataFrom.extract adds the optional ones (PSI_GUIDE_MODEL, PSI_EMBED_MODEL) when present.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: psizone-web-env
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: psizone-web-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: apps/psizone-web/env
        property: OPENROUTER_API_KEY
  dataFrom:
    - extract: { key: apps/psizone-web/env }
