# The staging host, before any cutover: nou.psizone.ro (docs/plans/psizone-web.md §7; no `.dev`
# in any address). The apex and www stay the owner's (DNS_APEX: foreign). external-dns writes the
# record from this Ingress; cert-manager issues the certificate (DNS-01).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: psizone-web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [nou.psizone.ro]
      secretName: psizone-web-tls
  rules:
    - host: nou.psizone.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: psizone-web
                port: { number: 80 }
