apiVersion: apps/v1
kind: Deployment
metadata:
  name: psizone-web
  labels: { app: psizone-web }
  annotations:
    # Rolls the pods when psizone-web-env changes (OpenBao -> ESO -> Secret -> roll).
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector: { matchLabels: { app: psizone-web } }
  template:
    metadata:
      labels: { app: psizone-web }
    spec:
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # FIRST: fail LOUD on a missing or blank secret, before the site boots. `${VAR:-}`
        # survives kubelet expansion; assert each key literally. Adding a key = adding its line.
        - name: assert-secrets
          image: registry.psizone.ro/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
          envFrom:
            - secretRef: { name: psizone-web-env }
          command:
            - sh
            - -c
            - >-
              m=0;
              [ -n "${CHROMA_API_KEY:-}" ] || { echo "MISSING REQUIRED SECRET: CHROMA_API_KEY" >&2; m=1; }; [ -n "${OPENROUTER_API_KEY:-}" ] || { echo "MISSING REQUIRED SECRET: OPENROUTER_API_KEY" >&2; m=1; };
              [ "$m" = 0 ] && echo secrets-ok
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
            readOnlyRootFilesystem: true
      containers:
        - name: web
          image: registry.psizone.ro/psi/psizone-web@sha256:6fcb3d95ea73ccd6b2c2812b5dd1234b434a17e3ba635232dcd53a894dc1ab7c
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - secretRef: { name: psizone-web-env }
            # OPTIONAL by design: the scheduling server key (secret/apps/scheduling/env). Absent, the
            # app finds scheduling off (CONVEX_URL set, no key) and keeps its callback form; this
            # never blocks a deploy. After the key first appears, roll the pod (envFrom is read at start).
            - secretRef: { name: psizone-web-scheduling, optional: true }
            # OPTIONAL by design: the outgoing mail that tells the team of a callback request
            # (secret/apps/psizone-web/mail). Absent, requests are still stored and the site logs
            # that nobody was e-mailed; this never blocks a deploy. Roll the pod after it first appears.
            - secretRef: { name: psizone-web-mail, optional: true }
          env:
            - { name: PORT, value: "3000" }
            # The knowledge store (packages/knowledge): Chroma in the cluster, through its auth
            # sidecar; the token is CHROMA_API_KEY from psizone-web-env.
            - { name: CHROMA_URL, value: "http://chroma.chroma.svc:8000" }
            # The scheduling store (packages/scheduling): the Convex backend's in-cluster Service.
            - { name: CONVEX_URL, value: "http://scheduling-backend.scheduling.svc:3210" }
            - { name: CMS_URL, value: "https://cms.psizone.ro" }
            - { name: NODE_ENV, value: production }
            - { name: PSIZONE_URL, value: "https://landing.psizone.ro" }
            - { name: HEMISYNC_URL, value: "https://hemisync.psizone.ro" }
            - { name: BLOG_URL, value: "https://blog.psizone.ro" }
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /, port: http }, periodSeconds: 20, failureThreshold: 6 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /app/.data }
      volumes:
        - name: data
          emptyDir: {}
