# The site's outgoing mail (docs/plans/clinic.md slice 0: the team is told of every callback request),
# synced from OpenBao secret/apps/psizone-web/mail into the Secret `psizone-web-mail`:
#   SMTP_HOST, SMTP_USER, SMTP_PASSWORD  the relay (apps/psizone-web/src/mail-config.ts); port 587 + STARTTLS by default
#   MAIL_FROM                            the sender address
#   BOOKING_NOTIFY_TO                    the team's inbox(es) for THIS site, comma separated
#
# Its own ExternalSecret, read as an OPTIONAL envFrom, because mail is optional for the site:
# without it a request is still STORED in the scheduling store (and logged as "not e-mailed"). Folded
# into psizone-web-env, a missing key would put that whole Secret in SecretSyncedError and block the
# deploy. Still per-key data[], so a key MISSING from the path is SecretSyncedError on THIS object.
#
# Unconfigured is an EMPTY SLOT, not an absent path: secret/apps/psizone-web/mail holds all five keys
# with empty values (apps/psizone-web/seb.seed.sh creates them, only where absent), so this syncs, the pod sees empty
# values, mail-config.ts reads them as "not configured", and the application stays Healthy. An
# absent path left Argo's psizone-web Degraded for its whole life (SEB's convention for an optional
# owner credential, as platform/anthropic/api). Configuring = filling the slot (estate/APP-SECRETS.md),
# then rolling the pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: psizone-web-mail
spec:
  refreshInterval: 1m
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: psizone-web-mail
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SMTP_HOST
      remoteRef: { key: apps/psizone-web/mail, property: SMTP_HOST }
    - secretKey: SMTP_USER
      remoteRef: { key: apps/psizone-web/mail, property: SMTP_USER }
    - secretKey: SMTP_PASSWORD
      remoteRef: { key: apps/psizone-web/mail, property: SMTP_PASSWORD }
    - secretKey: MAIL_FROM
      remoteRef: { key: apps/psizone-web/mail, property: MAIL_FROM }
    - secretKey: BOOKING_NOTIFY_TO
      remoteRef: { key: apps/psizone-web/mail, property: BOOKING_NOTIFY_TO }
