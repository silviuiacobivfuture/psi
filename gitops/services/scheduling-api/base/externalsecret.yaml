# scheduling-api's environment, synced from OpenBao into the Secret `scheduling-api-env` the Deployment and its
# assert-secrets initContainer read. Values live ONLY in OpenBao; this holds the mapping.
#
#   secret/apps/scheduling-api/env   CLINIC_MASTER_KEY (64 hex: the envelope key of the clinical fields, never in
#                                    Convex), OIDC_ISSUERS (JSON: [{issuer, audiences[, jwksUrl]}] per Authentik
#                                    application), OPENFGA_MODEL_ID (the PIN, moved only by a re-pin),
#                                    SERVICE_KEY_HASH_<CALLER> (sha-256 hex of each caller's key secret)
#   secret/apps/scheduling-api/mail  MAIL_API_URL, MAIL_API_KEY, MAIL_FROM (the service's own sender)
#   secret/apps/scheduling/env       PSI_SCHEDULING_KEY: the SAME key the Convex deployment demands
#   secret/apps/openfga/env          OPENFGA_AUTHN_PRESHARED_KEYS -> OPENFGA_TOKEN
#   secret/apps/autorizare/env       OPENFGA_STORE_ID
#   secret/platform/object-storage/dev  access_key_id, secret_access_key -> S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY
#
# FAIL LOUD: per-key data[] with explicit properties, no dataFrom.extract: a missing key makes this ExternalSecret
# SecretSyncedError rather than render an empty value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scheduling-api-env
spec:
  refreshInterval: 1m
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: scheduling-api-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CLINIC_MASTER_KEY
      remoteRef: { key: apps/scheduling-api/env, property: CLINIC_MASTER_KEY }
    - secretKey: OIDC_ISSUERS
      remoteRef: { key: apps/scheduling-api/env, property: OIDC_ISSUERS }
    - secretKey: OPENFGA_MODEL_ID
      remoteRef: { key: apps/scheduling-api/env, property: OPENFGA_MODEL_ID }
    - secretKey: SERVICE_KEY_HASH_PSIZONE_WEB
      remoteRef: { key: apps/scheduling-api/env, property: SERVICE_KEY_HASH_PSIZONE_WEB }
    - secretKey: SERVICE_KEY_HASH_HEMISYNC_WEB
      remoteRef: { key: apps/scheduling-api/env, property: SERVICE_KEY_HASH_HEMISYNC_WEB }
    - secretKey: SERVICE_KEY_HASH_GUIDE_PSIZONE
      remoteRef: { key: apps/scheduling-api/env, property: SERVICE_KEY_HASH_GUIDE_PSIZONE }
    - secretKey: SERVICE_KEY_HASH_GUIDE_HEMISYNC
      remoteRef: { key: apps/scheduling-api/env, property: SERVICE_KEY_HASH_GUIDE_HEMISYNC }
    - secretKey: SERVICE_KEY_HASH_CMS
      remoteRef: { key: apps/scheduling-api/env, property: SERVICE_KEY_HASH_CMS }
    - secretKey: MAIL_API_URL
      remoteRef: { key: apps/scheduling-api/mail, property: MAIL_API_URL }
    - secretKey: MAIL_API_KEY
      remoteRef: { key: apps/scheduling-api/mail, property: MAIL_API_KEY }
    - secretKey: MAIL_FROM
      remoteRef: { key: apps/scheduling-api/mail, property: MAIL_FROM }
    - secretKey: PSI_SCHEDULING_KEY
      remoteRef: { key: apps/scheduling/env, property: PSI_SCHEDULING_KEY }
    - secretKey: OPENFGA_TOKEN
      remoteRef: { key: apps/openfga/env, property: OPENFGA_AUTHN_PRESHARED_KEYS }
    - secretKey: OPENFGA_STORE_ID
      remoteRef: { key: apps/autorizare/env, property: OPENFGA_STORE_ID }
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
