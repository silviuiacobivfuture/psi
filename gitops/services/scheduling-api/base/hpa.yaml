# scheduling-api runs 2 pods (at most 2 while the cluster is one node), scaled on CPU (k3s ships metrics-server). The Deployment names no replicas, so the
# count is this object's alone; the PodDisruptionBudget lets a drain take one pod at a time and never blocks it, the quota fits 4 + a surge.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scheduling-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: scheduling-api }
  minReplicas: 2
  maxReplicas: 2
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{ type: Pods, value: 1, periodSeconds: 60 }]
