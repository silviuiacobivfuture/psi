# Guard-rails for the scheduling-api namespace: the LimitRange backfills any container that names no resources, the
# quota caps the namespace (the HPA's 4 replicas + a rollout surge, each 250m/256Mi requested and 1/512Mi limited,
# + the init containers).
apiVersion: v1
kind: LimitRange
metadata:
  name: scheduling-api
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 25m, memory: 64Mi }
      default: { cpu: 250m, memory: 256Mi }
      max: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: scheduling-api
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "6"
    limits.memory: 4Gi
    pods: "8"
