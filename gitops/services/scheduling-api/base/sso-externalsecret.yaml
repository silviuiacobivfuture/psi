# The estate sign-in's admin API, as the invitation flow reaches it (docs/plans/clinic.md section 4: "Single sign-on";
# apps/scheduling-api/src/ports/sso-authentik.ts), synced from OpenBao secret/apps/scheduling-api/sso into the Secret
# `scheduling-api-sso`:
#   AUTHENTIK_URL        https://auth.psizone.ro (the estate's Authentik; the egress is already open)
#   AUTHENTIK_API_TOKEN  a token of a service user that may create users, read groups and create recovery links
#                        (Authentik: Directory > Tokens, intent "API"); scoped to the customers group's users
#
# Its own ExternalSecret, read as an OPTIONAL envFrom, because the invitation is optional for the service: without it the
# invitation routes answer 503 "not configured" and everything else runs as before. Folded into scheduling-api-env, a
# missing key would put that whole Secret in SecretSyncedError and block the deploy. The two keys come together or not at
# all (the service refuses to boot on one without the other). Still per-key data[]: never an empty value. Roll the pod
# after the keys first appear. The group the accounts live in (default `customers`) and the provider's subject mode
# (default `hashed_user_id`) are plain env in the Deployment only if they differ.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: scheduling-api-sso
spec:
  refreshInterval: 1m
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: scheduling-api-sso
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AUTHENTIK_URL
      remoteRef: { key: apps/scheduling-api/sso, property: AUTHENTIK_URL }
    - secretKey: AUTHENTIK_API_TOKEN
      remoteRef: { key: apps/scheduling-api/sso, property: AUTHENTIK_API_TOKEN }
