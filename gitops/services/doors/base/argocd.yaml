apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-public
  namespace: argocd
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls: [{ hosts: [argocd.psizone.ro], secretName: argocd-public-tls }]
  rules:
    - host: argocd.psizone.ro
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: argocd-server, port: { number: 80 } } } }]
