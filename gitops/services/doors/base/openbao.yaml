apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbao-public
  namespace: openbao
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls: [{ hosts: [openbao.psizone.ro], secretName: openbao-public-tls }]
  rules:
    - host: openbao.psizone.ro
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: openbao, port: { number: 8200 } } } }]
