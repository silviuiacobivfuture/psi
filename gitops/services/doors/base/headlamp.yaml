apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp-public
  namespace: headlamp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls: [{ hosts: [headlamp.psizone.ro], secretName: headlamp-public-tls }]
  rules:
    - host: headlamp.psizone.ro
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: headlamp, port: { number: 80 } } } }]
