apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hub-public
  namespace: authentik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls: [{ hosts: [hub.psizone.ro], secretName: hub-public-tls }]
  rules:
    - host: hub.psizone.ro
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: authentik-server, port: { number: 80 } } } }]
