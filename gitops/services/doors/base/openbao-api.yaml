# OpenBao's HTTP API for the owner's workstation, at bao-api.psizone.ro. psi has no private network,
# and the UI door (openbao.psizone.ro) sits behind the estate's sign-in, which a CLI cannot pass.
# This door serves the API only (/v1), only to the allow-listed address, and every call still needs
# an OpenBao token: the allow-list narrows who can even reach the token check. Remove the address
# (or this file) to close it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: openbao-api-allow
  namespace: openbao
spec:
  ipAllowList:
    sourceRange:
      - 5.2.205.19/32
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbao-api
  namespace: openbao
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: openbao-openbao-api-allow@kubernetescrd
spec:
  ingressClassName: traefik
  tls: [{ hosts: [bao-api.psizone.ro], secretName: openbao-api-tls }]
  rules:
    - host: bao-api.psizone.ro
      http:
        paths: [{ path: /v1, pathType: Prefix, backend: { service: { name: openbao, port: { number: 8200 } } } }]
