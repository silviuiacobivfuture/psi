# Preview environments for the PROD cluster: none today (the changelog's was retired on
# 2026-11-15 with its git copy; see the dev overlay's previews.yaml).
#
# Same `github-pr-creds` Secret contract as the dev overlay (ESO ← OpenBao
# secret/github key `token`).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-pr-creds
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: github-pr-creds
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: platform/github/token
        property: token
