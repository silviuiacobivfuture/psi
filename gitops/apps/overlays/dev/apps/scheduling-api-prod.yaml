# scheduling-api of PRODUCTION (api-programari.psizone.ro), namespace scheduling-api-prod. Its image tag moves only by
# `tools/scheduling/promote.sh`. Needs its OpenBao keys (estate/APP-SECRETS.md) and psi's openfga-access policy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scheduling-api-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:silviuiacobivfuture/psi.git
    targetRevision: dev
    path: gitops/services/scheduling-api/overlays/prod
  destination: { server: https://kubernetes.default.svc, namespace: scheduling-api-prod }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
