# The old-app sync of PRODUCTION: a CronJob that is SUSPENDED until the owner flips it (gitops/services/scheduling-sync).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scheduling-sync-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:silviuiacobivfuture/psi.git
    targetRevision: dev
    path: gitops/services/scheduling-sync/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: scheduling-backend-prod
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
