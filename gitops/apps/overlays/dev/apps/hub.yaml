apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:silviuiacobivfuture/psi.git
    targetRevision: dev
    path: gitops/services/hub/overlays/dev
  destination: { server: https://kubernetes.default.svc, namespace: homepage }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
