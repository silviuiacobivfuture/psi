# Deploys the scheduling functions to PRODUCTION's backend: a PostSync Job (gitops/services/scheduling-deploy/overlays/prod).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scheduling-deploy-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:silviuiacobivfuture/psi.git
    targetRevision: dev
    path: gitops/services/scheduling-deploy/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: scheduling-backend-prod
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
