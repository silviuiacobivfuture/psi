# scheduling-api on dev (api-programari-dev.psizone.ro). Needs its OpenBao keys (estate/APP-SECRETS.md) and SEB's
# OpenFGA NetworkPolicy admitting namespace scheduling-api on :8081 and :8080 before it can authorize.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scheduling-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:silviuiacobivfuture/psi.git
    targetRevision: dev
    path: gitops/services/scheduling-api/overlays/dev
  destination: { server: https://kubernetes.default.svc, namespace: scheduling-api }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
