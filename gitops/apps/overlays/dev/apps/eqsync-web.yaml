apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eqsync-web
  namespace: argocd
  # Deleting this Application removes what it deployed (the site is being retired, 2026-11-12).
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: git@github.com:silviuiacobivfuture/psi.git
    targetRevision: dev
    path: gitops/services/eqsync-web/overlays/dev
  destination: { server: https://kubernetes.default.svc, namespace: eqsync-web }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
