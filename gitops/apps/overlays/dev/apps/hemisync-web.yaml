apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hemisync-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:silviuiacobivfuture/psi.git
    targetRevision: dev
    path: gitops/services/hemisync-web/overlays/dev
  destination: { server: https://kubernetes.default.svc, namespace: hemisync-web }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
