# DEV profile = base + dev apps (lean; k3s built-in cloud controller, no CCM/LB).
#
# Two lists, read together by the `root` Application (gitops/bootstrap/root-dev.yaml):
#   this file  — the PLATFORM list (SEB): every Application the estate's platform runs;
#   rmx/       — the RMX list: the estate's own business applications, composed below.
# One root, one rendered set: splitting the list changed nothing Argo deploys.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # The estate's own applications (gitops/apps/overlays/dev/apps/): psi's sites.
  - apps
  - seb-pieces
  # SEB's bundle, by digest (estate/seb-upgrade.sh): Argo's read credential for it, the lock for
  # Harbor housekeeping, and the Applications of the pieces estate/seb-pieces.dev switches to it.
  - seb-bundle
  # The RMX list (business applications). Its own kustomization; see rmx/.
  - ../../base
  - harbor-route.yaml
  - changelog.yaml
  # The runner scale set is a SEB piece (pieces/arc-runners): the consumer generates its Application.
  - arc-runners-namespace.yaml
  - arc-runner-secret.yaml
  - openbao.yaml
  - secret-store.yaml
  - previews.yaml
  # Argo CD's own configuration is a SEB piece: the consumer generates its Application
  # (pieces/argocd-config), which keeps the name argocd-config.
  - authentik.yaml
  - authentik-platform.yaml
  # The cluster's RBAC (OIDC group bindings, tailnet break-glass, the developer role) and the
  # logical DB dumps are SEB pieces: the consumer generates their Applications
  # (pieces/platform-rbac, which keeps the name platform-rbac; pieces/db-backup).
  # Business-rule visibility (test-reports) is a SEB piece: pieces/test-reports.
  # The daily platform health digest and estate-watch (#infra) are a SEB piece: the consumer
  # generates its Application (pieces/health-digest, which keeps the name health-digest).
  # Collaboration suite (the Teams-shaped stack): Nextcloud's platform half
  # (DB/Redis/secrets/occ-reconcile, wave 1) is a SEB piece, its Application generated by the
  # consumer (pieces/nextcloud-platform) -> the chart (wave 2). The CNPG operator and the Talk
  # media plane are SEB pieces too.
  # Plane (project/issue tracking): same two-app split and wave order — its
  # platform half (CNPG DB / Redis / RabbitMQ / secrets / ingress / quota, wave 1)
  # then the upstream chart (wave 2). Shares the `cnpg` operator (a SEB piece).
  # ReportPortal (TEST-VISIBILITY-PLAN.md phase 3): the ENGINEER-facing half of
  # test visibility — permanent per-test history, trends, flakiness and ML
  # clustering of recurring failures. Same two-app split and wave order: its
  # platform half (CNPG DB / RabbitMQ / secrets / the two Ingresses / quota,
  # wave 1) then the upstream chart + the OpenSearch subchart (wave 2). It does
  # NOT replace `test-reports` above — that answers the BUSINESS question in
  # Romanian prose; this answers the engineer's. Shares the `cnpg` operator. Its platform half
  # is a SEB piece, its Application generated by the consumer (pieces/reportportal-platform).
  # Block storage (the Hetzner CSI driver, wave -2) is a SEB piece: rmx/seb-pieces.
  # Authorization (openfga, the DATA plane; autorizare, the CONTROL plane and the sign-in
  # hub), the estate's front door (estate-front), notifications (novu) and e-mail (plunk), the
  # system hub (homepage), the Nx cache (nx-cache) and PDF Studio (pdfcraft) are SEB pieces: the
  # consumer generates their Applications (pieces/openfga, pieces/autorizare,
  # pieces/estate-front, pieces/novu, pieces/plunk, pieces/homepage, pieces/nx-cache,
  # pieces/pdfcraft).
  # The tailnet's control plane is a SEB piece (pieces/headscale); its tools' Ingresses and
  # entrypoint are the estate's own (its headscale component's tools/), deployed by the estate.
  # Workflow automation: self-hosted n8n behind Authentik (docs/n8n/00-plan.md) is a SEB piece:
  # the consumer generates its Application (pieces/n8n).

# Estate values in the Applications' Helm `parameters` come from the identity
# (estate/identity.yaml → the whitelabel ConfigMap, which ../../base already brings in
# through its component; listing the component here too would register it twice).
# whitelabel-replacements.yaml is GENERATED:
#   python3 tools/whitelabel/replacements.py write gitops/apps/overlays/dev
replacements:
  - path: whitelabel-replacements.yaml

# Stamp the env branch onto every git-sourced Application (label source=git), so
# the dev cluster always reconciles OUR manifests from the `dev` branch. Helm
# apps (targetRevision = chart version) are deliberately untouched. This keeps the
# branch pointer in ONE place per overlay → promotion merges never conflict on it.
patches:
  - target:
      kind: Application
      labelSelector: platform.psizone.ro/source=git
    patch: |
      - op: add
        path: /spec/source/targetRevision
        value: dev
