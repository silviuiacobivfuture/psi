# Preview environments for the DEV cluster: none today.
# A business application of the estate adds its own ApplicationSet from the estate repository
# (an Argo `ApplicationSet` with a GitHub PullRequest generator on the PR's base branch, as
# gitops/BRANCHING.md "Preview environments" describes). The only one there was, changelog's,
# was retired on 2026-11-15 when changelog moved to the SEB bundle's piece: psi holds no changelog
# source, so a psi pull request has no changelog of its own to preview.
#
# The GitHub token stays: root manages it directly (gitops/bootstrap/root-dev.yaml), and a preview
# ApplicationSet reads it as `github-pr-creds`, synced from OpenBao by the ExternalSecret below, so
# no token ever lives in git.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-pr-creds
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: github-pr-creds
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: platform/github/token
        property: token
