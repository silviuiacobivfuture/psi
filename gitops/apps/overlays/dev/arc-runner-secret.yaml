# GitHub PAT for the ARC runner scale set (arc-runners). The gha-runner-scale-set
# chart authenticates to the estate's GitHub owner with a fine-grained PAT (org perm
# "Self-hosted runners: Read and write"). The chart's `githubConfigSecret:
# arc-github-pat` expects a Secret with key `github_token`.
#
# Synced from OpenBao (secret/platform/github/token key `token`) by this
# ExternalSecret — no token ever lives in git, same pattern as github-pr-creds.
# Store it once:  bao kv put secret/platform/github/token token=<PAT>
#
# FRESH-CLUSTER ARC BOOTSTRAP ORDER (do these in sequence — there are two races):
#   1. ./scripts/arc-crds.sh <env>   — apply the gha-runner-scale-set CRDs
#      server-side. The Argo chart sets helm.skipCrds (annotation > 256KB), so
#      the CRDs are NOT synced by Argo and MUST be applied out-of-band first,
#      else arc-controller/arc-runners fail to reconcile.
#   2. The `arc-runners` namespace must pre-exist before this ExternalSecret +
#      the chart's RBAC land in it (RBAC-before-ns race). It is codified as
#      arc-runners-namespace.yaml in this overlay (synced with these manifests),
#      so no manual `kubectl create ns` is needed.
#   3. bao kv put secret/platform/github/token token=<PAT>  — then this
#      ExternalSecret materialises arc-github-pat and the runner registers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-pat
  namespace: arc-runners
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: arc-github-pat
    creationPolicy: Owner
  data:
    - secretKey: github_token
      remoteRef:
        key: platform/github/token
        property: token
