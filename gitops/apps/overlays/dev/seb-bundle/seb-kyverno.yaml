# SEB piece `kyverno` — Kyverno, the Kubernetes-native policy engine (admission control +
# background audit): its controllers and its (large) CRDs. Stateless; the estate's ClusterPolicies
# are a separate Application (`kyverno-policies`), not part of this piece.
#
# SAFETY: the chart's default config.resourceFilters exclude kube-system, kube-public,
# kube-node-lease, Nodes and Kyverno's own resources from the webhook, so the admission webhook
# can NOT brick the control plane on a fresh install. CRDs install by default (crds.install).
#
# A HELM piece (contract seb/tools/bundle/helm-piece.mjs): this file is the Argo CD Application
# TEMPLATE; the chart comes from its upstream repository at the pinned version; values.yaml beside
# it carries the chart values (no estate value in them).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  # Early sync-wave: the Kyverno controllers + CRDs must exist before the ClusterPolicies
  # (Application `kyverno-policies`, wave 0) that depend on those CRDs can reconcile on a fresh
  # cluster.
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    platform.psizone.ro/source: seb-bundle
spec:
  project: default
  ignoreDifferences:
    # Kyverno re-injects conversion-webhook caBundle + reconciles its own CRD schema/labels.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions: [ '.spec.conversion.webhook.clientConfig.caBundle', '.spec.versions[]?.schema', '.metadata.labels', '.metadata.annotations' ]
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.8.1
    helm:
      values: |
        # Lean dev footprint: one replica per controller, EXCEPT admission. verify-seb-signatures fails
        # closed once an estate enforces it (failurePolicy Fail, docs/lockdown.md), and so does every policy
        # on the mutate.kyverno.svc-fail webhook: with one admission pod, its restart or eviction is a window
        # in which no pod outside kube-system and kyverno can be created. Two replicas, spread over nodes
        # by the chart's default preferred anti-affinity, with the PodDisruptionBudget (minAvailable 1) the
        # chart turns on whenever replicas > 1. Measured on a live estate 2026-11-17: one admission pod uses 125 Mi
        # (request 128 Mi, limit 384 Mi); both nodes had room for the request.
        admissionController:
          replicas: 2
        backgroundController:
          replicas: 1
        cleanupController:
          replicas: 1
        reportsController:
          replicas: 1
          # The background scan judges argoproj.io Applications for kyverno-policies' verify-seb-signatures
          # (the SEB bundle each one deploys must be signed). The chart's role does not read them, and
          # without this the scan skips every Application silently.
          rbac:
            clusterRole:
              extraResources:
                - apiGroups: [argoproj.io]
                  resources: [applications]
                  verbs: [get, list, watch]
        # Enforcement runs through the Kyverno admission webhook, not native
        # ValidatingAdmissionPolicies. Our pattern-based (non-CEL) policies cannot
        # be expressed as VAPs anyway ("skip generating VAP for non CEL rules"), and
        # leaving the generator on makes it churn the policy status on every reconcile.
        features:
          generateValidatingAdmissionPolicy:
            enabled: false
          generateMutatingAdmissionPolicy:
            enabled: false
        # The chart stamps `admissions.enforcer/disabled: "true"` on every Kyverno
        # webhook by default (to coexist with Rancher/RKE2's admission-webhook-enforcer).
        # On THIS k3s apiserver that annotation makes the webhooks be SKIPPED → Enforce
        # policies never block (admission_requests_total stays 0; cert-manager's webhook,
        # which lacks the annotation, fires fine). Clear it so the webhooks are honored
        # and enforcement actually rejects bad manifests.
        config:
          webhookAnnotations: {}
          # Never send kube-system (the control plane's add-ons and the CNI) to Kyverno's resource webhooks.
          # The chart's default says the same and adds Kyverno's own namespace by itself; written here so
          # that a fail-closed policy can never deadlock the cluster on a chart default changing.
          webhooks:
            namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: NotIn
                  values:
                    - kube-system
                    - kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Kyverno CRDs are large → must be server-side applied (client-side apply
      # blows the metadata.annotations size limit).
      - ServerSideApply=true
  info:
    - name: seb-bundle
      value: registry.psizone.ro/seb/bundle@sha256:25df6b6c9f959f836082d4d1493c28bbe3bce55ebb34a8f5e2dd8fb0bbb930e2
  revisionHistoryLimit: 2
