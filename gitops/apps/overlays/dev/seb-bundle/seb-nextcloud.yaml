# Nextcloud Hub — the Microsoft-Teams-shaped half of the platform: files (S3 primary
# storage), Office editing (Collabora, bundled subchart), Calendar/Contacts, and Talk
# (chat + calls). SSO is Authentik OIDC; the media plane for Talk calls is the
# separate `talk-hpb` Application (hostNetwork UDP — see seb/pieces/talk-hpb).
#
# SPLIT, mirroring authentik / authentik-platform:
#   - THIS app  = the upstream Helm chart only.
#   - `nextcloud-platform` (git) = everything the chart cannot express — the CNPG
#     Postgres Cluster, Redis, the ExternalSecrets, the namespace quota, and the
#     occ reconcile CronJob that writes the DB-stored config (OIDC/Talk) as code.
#
# STATE — three stores, deliberately:
#   1. Files  → Hetzner Object Storage bucket <BUCKET_PREFIX>-collab-dev (Tofu:
#      environments/dev/main.tf module.collab_storage). Its OWN bucket, though it
#      could technically share one (OBJECTSTORE_S3_OBJECT_PREFIX exists, exposed as
#      nextcloud.objectStore.s3.prefix), because versioning is a BUCKET-level
#      setting and these files are the only data here that needs it, and because
#      Hetzner has no path-level authorization — one credential sees a whole bucket,
#      so company documents get their own blast radius.
#   2. Database → CNPG cluster `nextcloud-db` (WAL-archived to S3 + 6-hourly pg_dump).
#   3. /var/www/html → an 8Gi local-path PVC holding installed apps + config.php.
#      NODE-PINNED and not resizable (the known local-path limitation, Track A of
#      DURABILITY-HA-PLAN.md). It is REBUILDABLE state — apps reinstall and the occ
#      reconcile CronJob rewrites the config — so a node loss costs a resync, not
#      data. Velero backs it up anyway.
#
# ROOT: the nextcloud image's entrypoint runs as root (it chowns /var/www/html and
# apache drops to www-data), so the namespace is listed in the
# require-run-as-non-root Kyverno exclusion — same documented escape hatch as
# browseruse-*. Everything else (requests+limits, no :latest, reloader) complies.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
  annotations:
    # After nextcloud-platform (wave 1): the chart's pod blocks on the CNPG
    # Cluster's -rw Service and the ESO-synced secrets existing.
    argocd.argoproj.io/sync-wave: "2"
  labels:
    platform.psizone.ro/source: seb-bundle
spec:
  project: default
  ignoreDifferences:
    # The chart mints a fresh `nextcloud-...` Secret on every render when values do
    # not pin one; the pod-template checksum annotations move with it. Same churn
    # Harbor has — ignore it or every sync is permanently OutOfSync.
    - kind: Deployment
      jqPathExpressions: [ '.spec.template.metadata.annotations' ]
  source:
    repoURL: https://nextcloud.github.io/helm/
    chart: nextcloud
    targetRevision: 9.2.6 # Nextcloud 34.0.3 (image tag derives from appVersion)
    helm:
      parameters:
        - name: image.registry
          value: registry.psizone.ro
          forceString: true
        - name: ingress.annotations.gethomepage\.dev/href
          value: https://cloud.psizone.ro
          forceString: true
        - name: nextcloud.host
          value: cloud.psizone.ro
          forceString: true
        - name: nextcloud.objectStore.s3.bucket
          value: psi-collab-dev
          forceString: true
        - name: nextcloud.extraInitContainers[0].image
          value: registry.psizone.ro/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
          forceString: true
        - name: nextcloud.extraEnv[0].value
          value: plunk-smtp.psizone.ro
          forceString: true
        - name: nextcloud.extraEnv[6].value
          value: cloud.psizone.ro
          forceString: true
        - name: collabora.image.repository
          value: registry.psizone.ro/mirror/docker.io/collabora/code
          forceString: true
        - name: collabora.collabora.server_name
          value: office.psizone.ro
          forceString: true
        - name: ingress.tls[0].secretName
          value: cloud-psi-tls
          forceString: true
        - name: ingress.tls[0].hosts[0]
          value: cloud.psizone.ro
          forceString: true
        - name: nextcloud.trustedDomains[0]
          value: cloud.psizone.ro
          forceString: true
        - name: collabora.ingress.hosts[0].host
          value: office.psizone.ro
          forceString: true
        - name: collabora.ingress.tls[0].hosts[0]
          value: office.psizone.ro
          forceString: true
      values: |
        image:
          # registry: set by `parameters` below (an estate value).
          repository: mirror/docker.io/library/nextcloud
          tag: "34.0.3-apache@sha256:6db41df8956dc1d48616484837f73b2a202d57e67e240b1abbed465bc79ac915"
        # Reloader auto-restarts this Deployment when any of its ESO-synced Secrets
        # change (OpenBao -> ESO -> Secret -> roll). REQUIRED: the DB password, the
        # S3 keys and the admin bootstrap creds all arrive as ENV VARS, and env is
        # read once at startup — without this, rotating the Postgres role's password
        # would leave the pod authenticating with the old one until someone noticed.
        # Chart key VERIFIED against nextcloud 9.2.6 templates/deployment.yaml:11 —
        # `deploymentAnnotations` lands on the Deployment's own metadata, which is
        # where Reloader reads it (podAnnotations would land on the pod template,
        # which Reloader ignores).
        deploymentAnnotations:
          reloader.stakater.com/auto: "true"
          alerts.psizone.ro/owner: ops@psizone.ro

        # --- Ingress (public, Traefik + Let's Encrypt) ---------------------------
        ingress:
          enabled: true
          className: traefik
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: "Nextcloud"
            gethomepage.dev/description: "Files, office documents, calendar and Talk"
            gethomepage.dev/group: "Everyday tools"
            gethomepage.dev/weight: "20"
            gethomepage.dev/icon: "nextcloud.png"
            # gethomepage.dev/href: set by `parameters` below (an estate value).
            gethomepage.dev/pod-selector: "app.kubernetes.io/name=nextcloud"
          # tls: set by `parameters` below (an estate value). The secret the
          # cutover's temporary Ingress already had issued for cloud.<apex>
          # (docs/estate/05-mutare-runbook.md): valid from the first request on
          # the new name.

        nextcloud:
          # host: set by `parameters` below (an estate value).
          # Admin bootstrap creds from OpenBao via ESO (apps/nextcloud/admin).
          # Used ONLY on first install; afterwards the admin lives in the DB.
          existingSecret:
            enabled: true
            secretName: nextcloud-admin
            usernameKey: admin-username
            passwordKey: admin-password
          # trustedDomains: set by `parameters` below (an estate value).
          # --- S3 primary storage (Hetzner Object Storage) ---
          objectStore:
            s3:
              enabled: true
              # host/bucket/region are ENV-SPECIFIC but not secret, so they stay in
              # git (this is the dev overlay's app, like harbor's externalURL).
              # Only the keys come from the secret — the chart falls back to these
              # literals per-field when secretKeys.<field> is unset (_helpers.tpl:313).
              host: nbg1.your-objectstorage.com
              port: "443"
              ssl: true
              region: nbg1
              # bucket: set by `parameters` below (an estate value).
              # Hetzner Object Storage is path-style; virtual-host style resolves
              # <bucket>.nbg1... which is NOT in their wildcard cert.
              usePathStyle: true
              autoCreate: false # the bucket is Tofu-managed, not app-managed
              existingSecret: nextcloud-s3
              secretKeys:
                accessKey: access-key
                secretKey: secret-key
          # Fail LOUD if a hard-required secret is missing/blank. Without this,
          # Nextcloud boots happily with an empty S3 key or DB password and only
          # fails per-request — an opaque 500 on upload, or an install that silently
          # lands on the wrong store. Required by the platform rule in CLAUDE.md
          # ("new app that needs secrets → MUST fail loud, never silent").
          # NOTE: kubelet expands command strings, so each key is asserted LITERALLY
          # with ${VAR:-} — an `eval v=\$$k` loop reaches sh as `v=$k` (the key NAME,
          # always non-empty) and the assertion would never fire.
          extraInitContainers:
            - name: assert-secrets
              # image: set by `parameters` below (an estate value).
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom: { secretKeyRef: { name: nextcloud-db-app, key: password } }
                - name: OBJECTSTORE_S3_KEY
                  valueFrom: { secretKeyRef: { name: nextcloud-s3, key: access-key } }
                - name: OBJECTSTORE_S3_SECRET
                  valueFrom: { secretKeyRef: { name: nextcloud-s3, key: secret-key } }
                - name: NEXTCLOUD_ADMIN_PASSWORD
                  valueFrom: { secretKeyRef: { name: nextcloud-admin, key: admin-password } }
                # The `cloud` sender's Plunk key = the relay's SMTP password, from the
                # GENERATED email-sender Secret (gitops/services/nextcloud/base/
                # email.generated.yaml). Asserted here so a blank one fails the pod
                # with a NAMED error at start, instead of leaving Nextcloud up and
                # silently dropping every share notification and password reset —
                # the exact silent death this initContainer exists for.
                # smtp.config.php only activates when SMTP_HOST, MAIL_FROM_ADDRESS
                # and MAIL_DOMAIN are ALL set, and those three are plain literals
                # below, so the password is the only value that can arrive empty.
                - name: SMTP_PASSWORD
                  valueFrom: { secretKeyRef: { name: email-sender, key: EMAIL_API_KEY } }
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { cpu: 100m, memory: 64Mi }
              command:
                - sh
                - -c
                - '[ -n "${POSTGRES_PASSWORD:-}" ] || { echo "MISSING REQUIRED SECRET: POSTGRES_PASSWORD" >&2; exit 1; }; [ -n "${OBJECTSTORE_S3_KEY:-}" ] || { echo "MISSING REQUIRED SECRET: OBJECTSTORE_S3_KEY" >&2; exit 1; }; [ -n "${OBJECTSTORE_S3_SECRET:-}" ] || { echo "MISSING REQUIRED SECRET: OBJECTSTORE_S3_SECRET" >&2; exit 1; }; [ -n "${NEXTCLOUD_ADMIN_PASSWORD:-}" ] || { echo "MISSING REQUIRED SECRET: NEXTCLOUD_ADMIN_PASSWORD" >&2; exit 1; }; [ -n "${SMTP_PASSWORD:-}" ] || { echo "MISSING REQUIRED SECRET: SMTP_PASSWORD" >&2; exit 1; }; echo secrets-ok'
          # --- outbound mail (Plunk's relay, the `cloud` sender), as env ----------
          # WHY ENV AND NOT `occ`, unlike the OIDC/Talk config below: mail is `mail_*`
          # SYSTEM config (config.php), NOT oc_appconfig, and the official image
          # already ships /var/www/html/config/smtp.config.php, which assembles the
          # entire mail_* block from these env vars at request time. Verified by
          # reading that file out of the running 34.0.3 container. config.php is
          # loaded FIRST and every *.config.php is merged OVER it
          # (lib/private/Config.php:200-209), so this wins over anything typed into
          # the admin UI — immediately, with no reconcile job and no 15-minute drift
          # window. It also keeps the sender's key OUT of config.php on the PVC (which
          # Velero backs up) and off any command line.
          #
          # The chart injects `nextcloud.extraEnv` through the shared `nextcloud.env`
          # helper (templates/_helpers.tpl:389), so BOTH the server container and the
          # background-cron container get it — the latter is load-bearing, because
          # most Nextcloud mail is sent from background jobs, not from a request.
          #
          # smtp.config.php only builds the block when SMTP_HOST, MAIL_FROM_ADDRESS
          # and MAIL_DOMAIN are ALL non-empty; leave any of them out and mail stays
          # silently unconfigured.
          extraEnv:
            # Plunk's in-cluster relay (docs/email/03-migration.md step 3): the host
            # is the name on the relay's certificate, resolved in-cluster to the
            # plunk-smtp Service by cluster-dns, so Symfony Mailer's peer check
            # (verify_peer, peer_name = host) passes by the certificate's own name.
            # The username is the LITERAL "plunk"; the password the sender's key.
            - name: SMTP_HOST
              # value: set by `parameters` below (an estate value).
            - name: SMTP_PORT
              value: "587"
            # MUST be `tls`, NOT `ssl`. Since Nextcloud 21 the transport is Symfony
            # Mailer and lib/private/Mail/Mailer.php:284 reduces this setting to a
            # single boolean: `('ssl' === mail_smtpsecure) ? true : null`. `true`
            # means IMPLICIT TLS, which only port 465 speaks — on 587 the handshake
            # never completes and every send fails. Any other value yields `null`,
            # which makes EsmtpTransport open a plain socket and then issue STARTTLS
            # automatically when the server advertises it
            # (3rdparty/symfony/mailer/.../EsmtpTransport.php:149). `tls` is the
            # documented spelling for that, and Plunk's relay advertises STARTTLS
            # (it requires it before AUTH).
            # Caveat, stated honestly: Symfony cannot ENFORCE STARTTLS (Nextcloud's
            # own docblock says so), so this is opportunistic encryption — the
            # relay refusing AUTH on a plain session is what makes it effective.
            - name: SMTP_SECURE
              value: tls
            - name: SMTP_NAME
              value: plunk
            - name: SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: email-sender, key: EMAIL_API_KEY } }
            # Nextcloud composes the sender as MAIL_FROM_ADDRESS@MAIL_DOMAIN, so this
            # is the LOCAL PART only. Together they must equal the `cloud`
            # declaration's address (gitops/services/plunk/senders/cloud.json:
            # noreply@cloud.<apex>) — Plunk refuses a From outside the project's
            # verified domain. Non-secret and env-specific, so they stay in git;
            # doctor.sh and scripts/tests/email-relay.test.sh compare them with the
            # declaration so the two cannot drift silently.
            - name: MAIL_FROM_ADDRESS
              value: noreply
            - name: MAIL_DOMAIN
              # value: set by `parameters` below (an estate value).
          # --- config.php fragments (file-level config, as code) ---
          # DB-stored config (OIDC provider, Talk signaling/TURN, richdocuments URL)
          # canNOT live here — it goes through `occ`, which is why the
          # nextcloud-platform app ships an idempotent reconcile CronJob.
          configs:
            proxy.config.php: |-
              <?php
              $CONFIG = array (
                // Traefik terminates TLS and forwards over the pod network; without
                // these Nextcloud builds http:// URLs and every OIDC redirect and
                // Collabora callback breaks.
                'overwriteprotocol' => 'https',
                'overwritehost'     => 'cloud.psizone.ro',
                'overwrite.cli.url' => 'https://cloud.psizone.ro',
                // k3s default pod CIDR — Traefik's pod is the only hop in front.
                'trusted_proxies'   => array('10.42.0.0/16'),
                'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
              );
            # The names Nextcloud answers to, as code: the chart's trustedDomains
            # reaches config.php only at first install, so a rename would never
            # arrive without this file (docs/estate/02-adrese.md T3).
            domains.config.php: |-
              <?php
              $CONFIG = array (
                'trusted_domains' => array (
                  0 => 'localhost',
                  1 => 'cloud.psizone.ro',
                ),
              );
            logging.config.php: |-
              <?php
              $CONFIG = array (
                // stdout/stderr → the otel-logging collector → Axiom, like every
                // other workload. A file log inside the container is invisible.
                'log_type'  => 'errorlog',
                'loglevel'  => 2,
                'logdateformat' => 'c',
              );
            defaults.config.php: |-
              <?php
              $CONFIG = array (
                'default_phone_region' => 'RO',
                'maintenance_window_start' => 1,
              );
          # disallow-privilege-escalation (ENFORCE) requires
          # allowPrivilegeEscalation:false on EVERY container — and unlike the
          # `privileged` rule, the securityContext itself is NOT optional in that
          # pattern, so a container with no securityContext at all is rejected. This
          # is what blocked the first sync ("resource Deployment/nextcloud/nextcloud
          # was blocked ... at path /spec/template/spec/containers/0/securityContext/").
          #
          # NOT runAsNonRoot (the entrypoint chowns /var/www/html as root — hence the
          # namespace's exclusion from require-run-as-non-root), and NOT a
          # capabilities drop: apache binds :80 and needs NET_BIND_SERVICE. Blocking
          # privilege ESCALATION is orthogonal to running as root — no_new_privs only
          # stops a setuid binary GAINING privileges; apache dropping to www-data is a
          # privilege drop, which is unaffected.
          securityContext:
            allowPrivilegeEscalation: false
        # The MAIN container's resources are the chart's TOP-LEVEL `resources`, not
        # `nextcloud.resources` (deployment.yaml:73 reads .Values.resources) — a
        # nested block renders nothing and require-requests-limits is ENFORCE, so the
        # pod would be rejected at admission with the values looking correct.
        resources:
          requests: { cpu: 200m, memory: 512Mi }
          limits: { cpu: "2", memory: 2Gi }
        # apache flavor serves directly — no nginx sidecar.
        nginx:
          enabled: false

        # --- /var/www/html (apps + config) -------------------------------------
        persistence:
          enabled: true
          storageClass: local-path
          accessMode: ReadWriteOnce
          size: 8Gi
          # Argo's prune/delete guard on the files PVC (gitops/components/prune-guard says
          # why); the chart's `helm.sh/resource-policy: keep` is Helm's and stops no Argo prune.
          annotations:
            argocd.argoproj.io/sync-options: Prune=false,Delete=false

        # --- Database: the CNPG cluster from nextcloud-platform ------------------
        # internalDatabase.enabled defaults to TRUE and WINS over externalDatabase in
        # the chart's env helper (_helpers.tpl:68) — leaving it on renders
        # SQLITE_DATABASE and no POSTGRES_* at all, so Nextcloud would install onto a
        # SQLite file on the PVC and never touch CNPG, with nothing in the sync
        # output to suggest anything was wrong. It must be explicitly disabled.
        internalDatabase:
          enabled: false
        # host is the operator-managed read/write Service; it always points at the
        # current primary, so a failover needs no config change.
        externalDatabase:
          enabled: true
          type: postgresql
          host: nextcloud-db-rw
          database: nextcloud
          existingSecret:
            enabled: true
            secretName: nextcloud-db-app
            usernameKey: username
            passwordKey: password
        postgresql:
          enabled: false
        mariadb:
          enabled: false

        # --- Redis (file locking + cache) --------------------------------------
        # The chart's bundled Redis pulls bitnamilegacy/redis (the deprecated
        # Bitnami registry). We run our own pinned instance in nextcloud-platform
        # instead — same choice already made for authentik's Redis.
        externalRedis:
          enabled: true
          host: nextcloud-redis
          port: "6379"
          existingSecret:
            enabled: true
            secretName: nextcloud-redis
            passwordKey: redis-password
        redis:
          enabled: false

        # --- Background jobs ----------------------------------------------------
        # Nextcloud REQUIRES cron; on AJAX-only, Talk sessions, file scans and
        # OIDC token cleanup silently stop running.
        cronjob:
          enabled: true
          # sidecar, not the CronJob variant: crond needs root, which this pod
          # already is, and the CronJob variant would mount the same RWO PVC from a
          # second pod every 5 minutes.
          type: sidecar
          sidecar:
            # Same admission requirement as the main container above — crond runs as
            # root but must still be barred from ESCALATING.
            securityContext:
              allowPrivilegeEscalation: false
            # Chart key VERIFIED: the resources live under cronjob.SIDECAR.resources
            # (values.yaml `cronjob.sidecar.resources`), not cronjob.resources — a
            # top-level `resources` here renders an EMPTY resources block on the
            # sidecar container, and require-requests-limits is ENFORCE, so the whole
            # Nextcloud pod would be rejected at admission.
            resources:
              requests: { cpu: 50m, memory: 128Mi }
              limits: { cpu: 500m, memory: 512Mi }

        # --- Collabora Online (Office editing) ----------------------------------
        collabora:
          enabled: true
          image:
            # Pinned — disallow-latest-tag is ENFORCE and the subchart defaults to
            # its own appVersion; an explicit tag makes the bump reviewable.
            # repository: set by `parameters` below (an estate value).
            tag: "26.04.3.1.1@sha256:b535b0f3c1cb8b5b43c8225172c8dac3cda55d07864360db7700e782d197c2a1"
          deployment:
            annotations:
              # Admin creds arrive as ENV from the ESO-synced collabora-admin
              # secret → must roll on rotation (require-reloader-annotation).
              reloader.stakater.com/auto: "true"
              alerts.psizone.ro/owner: ops@psizone.ro
          collabora:
            # Which Nextcloud origins may embed the editor. Wrong/missing value =
            # "This document is not available" with no other symptom.
            aliasgroups:
              - host: "https://cloud.psizone.ro:443"
            # server_name: set by `parameters` below (an estate value).
            # ssl.enable=false + ssl.termination=true: Traefik terminates TLS.
            # security.capabilities=false: without it Collabora wants CAP_SYS_CHROOT
            # + CAP_MKNOD, which disallow-privileged and the dropped-caps context
            # below deny — it would CrashLoop on start.
            # mount_jail_tree=false is REQUIRED alongside capabilities=false: the
            # coolmount helper bind-mounts each document jail and needs CAP_SYS_ADMIN
            # to do it. Without this flag coolwsd logs "Failed to exec coolmount ...
            # The helper needs CAP_SYS_ADMIN; ensure the runtime grants it, or set
            # mount_jail_tree config entry in coolwsd.xml to false" and then dies.
            # Granting the capability instead would violate disallow-privileged.
            extra_params: --o:ssl.enable=false --o:ssl.termination=true --o:security.capabilities=false --o:mount_jail_tree=false
            existingSecret:
              enabled: true
              secretName: collabora-admin
              usernameKey: username
              passwordKey: password
          # uid 1001 — VERIFIED from the image config blob (`User: "1001"`), not the
          # 100 assumed earlier. The wrong uid does not fail fast: coolwsd starts,
          # then dies with "filesystem error: cannot create directories: Permission
          # denied [/opt/cool/child-roots/...]" because that tree is owned by 1001.
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
            seccompProfile: { type: RuntimeDefault }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "2", memory: 2Gi }
          ingress:
            enabled: true
            className: traefik
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
            hosts:
              # host: set by `parameters` below (an estate value).
              - paths:
                  - path: /
                    pathType: Prefix
            tls:
              # hosts: set by `parameters` below (an estate value).
              - secretName: collabora-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: nextcloud
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  info:
    - name: seb-bundle
      value: registry.psizone.ro/seb/bundle@sha256:5cfc5cddb6d2fd39abccc840e126e0aa2e32d93b1be0a72d65459438c80a7f15
