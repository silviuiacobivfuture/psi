                - kube-node-lease
                - kube-public
                - argocd
                - arc-runners
                - restore-drill-cnpg
                - restore-drill-datastore
                - restore-drill-headscale
                - restore-drill-openbao
                - restore-drill-harbor-db
                - restore-drill-nextcloud-files
                - restore-drill-novu
                - restore-drill-reportportal-index
                - restore-drill-velero
