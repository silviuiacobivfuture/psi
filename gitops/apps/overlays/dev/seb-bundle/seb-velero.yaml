#
# Velero — cluster backup/restore (dev). Backs up k8s resources AND PersistentVolume
# data (node-agent / kopia file-level) to the EXISTING Hetzner Object Storage bucket
# (<BUCKET_PREFIX>-tfstate-dev) under a dedicated `velero/` prefix — separate from the tofu state
# at `dev/terraform.tfstate`. Same S3 endpoint/region as the tofu backend
# (the identity's OBJECT_STORAGE_ENDPOINT and OBJECT_STORAGE_REGION, path-style).
#
# S3 creds come from the velero-credentials secret (key `cloud`, AWS-credentials-file
# format), synced from OpenBao secret/platform/object-storage/dev by the ESO
# ExternalSecret in pieces/platform-secrets/velero-credentials.yaml — NOT inline.
#
# DEPENDS on OpenBao + ESO + the openbao ClusterSecretStore (its creds). Those sit at
# early sync-waves (-5/-4); this app is at wave 0 and self-heals once the
# velero-credentials secret exists. The BackupStorageLocation + daily Schedule are
# configured via Helm values (the idiomatic Velero way) so the whole backup config
# is one declarative unit.
#
# A HELM piece (contract tools/bundle/helm-piece.mjs): this file is the Argo CD Application
# TEMPLATE; the chart comes from its upstream repository at the pinned version; values.yaml beside
# it carries the chart values, with identity placeholders the estate's upgrade step fills in.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  # Explicit wave (matches the header): Velero needs OpenBao+ESO+store (waves -5/-4)
  # up first for its creds; it sits at wave 0.
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    platform.psizone.ro/source: seb-bundle
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 12.0.3 # appVersion velero 1.18.1
    helm:
      # Estate values: identity placeholders, filled by the estate's upgrade step.
      parameters:
        - name: configuration.backupStorageLocation[0].bucket
          value: psi-tfstate-dev
          forceString: true
      values: |
        # AWS object-storage plugin (S3-compatible: Hetzner Object Storage).
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.13.0
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - name: plugins
                mountPath: /target

        # Creds from the ESO-synced secret (key `cloud`), never inline.
        credentials:
          useSecret: true
          existingSecret: velero-credentials

        # Disable the chart's CRD-upgrade hook Job: it runs a bare `kubectl` pod with
        # no restricted securityContext/resources → Kyverno blocks it → Argo sync fails.
        # The CRDs are already installed at the chart version; on a chart bump, apply the
        # CRDs out-of-band (or temporarily re-enable). Keeps the sync green + policy intact.
        upgradeCRDs: false

        # RBAC: the chart binds Velero's SA to cluster-admin (rbac.clusterAdministrator,
        # default true) — Velero needs broad read across all namespaces + PVs to back
        # them up. Accepted for dev (single tailnet-gated operator); TODO(hardening):
        # replace with a scoped ClusterRole (read-all + manage velero.io CRs) before prod.

        # node-agent (kopia) → captures PersistentVolume *data*, not just k8s
        # resources. Required to actually protect PVC contents (openbao vault,
        # harbor registry, postgres, etc.).
        deployNodeAgent: true
        # QoS floor + ceiling so a large kopia upload can't spike a node unbounded.
        nodeAgent:
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          # Since Velero 1.17 every volume is copied by a pod of its own, made by the node-agent. Their
          # pace and size are velero-node-agent's (below); the node-agent reads it once, at start, so
          # Reloader restarts it when it changes.
          extraArgs:
            - --node-agent-configmap=velero-node-agent
          annotations:
            configmap.reloader.stakater.com/reload: velero-node-agent

        configuration:
          # Default volume backup path = file-system backup via kopia node-agent.
          # Hetzner Object Storage has no CSI VolumeSnapshot support, so FSB is the
          # only way to capture PV data here.
          defaultVolumesToFsBackup: true
          uploaderType: kopia
          # How long a run waits on its volumes before it ends without the ones still open
          # (PartiallyFailed) instead of waiting on. Velero's own default is 4h. A volume pod the node
          # refuses leaves its volume Canceled and the run InProgress until this: a single-node estate, 2026-11-15,
          # 06:00 and 08:19. The longest healthy run measured is 1h33m (a larger estate, 2026-11-05; a single-node estate's take
          # about 10m), and the next firing is 6h away. doctor's "past its limit" reads this value
          # from the server's arguments. An estate whose runs are longer sets its own.
          fsBackupTimeout: 3h
          # Repository maintenance jobs: the same small floor as the volume pods (velero-node-agent),
          # so a node short of memory still admits them (it refuses only pods that request nothing).
          repositoryMaintenanceJob:
            repositoryConfigData:
              name: velero-repo-maintenance
              global:
                keepLatestMaintenanceJobs: 3
                # Velero parses all four or none (an empty one discards the rest, with only a warning in
                # its log: a single-node estate, 2026-11-15); "0" is its word for no limit.
                podResources:
                  cpuRequest: 50m
                  cpuLimit: "0"
                  memoryRequest: 128Mi
                  memoryLimit: 1Gi

          backupStorageLocation:
            - name: default
              provider: aws
              # bucket: set by `parameters` below (an estate value).
              prefix: velero
              default: true
              credential:
                name: velero-credentials
                key: cloud
              config:
                region: nbg1
                s3ForcePathStyle: "true"
                s3Url: https://nbg1.your-objectstorage.com
                # Hetzner S3 rejects AWS-style checksums (same as the tofu backend's
                # skip_s3_checksum). Disable the request/response checksum the AWS
                # SDK v2 adds by default.
                checksumAlgorithm: ""

          # No CSI snapshotter on this cluster → no VolumeSnapshotLocation; PV data
          # is protected by the node-agent FSB above.
          volumeSnapshotLocation: []

        # 6-hourly schedule, 5-day retention. Velero has NO native count-based
        # retention — `ttl` is the idiomatic cap. 6h cadence × 5d ttl ≈ 20 live
        # backups retained (4 backups/day × 5 days = 20), each auto-expiring at
        # 120h. DENY-LIST not allow-list: back up every
        # namespace EXCEPT the ones trivially reconstructed from git/bootstrap — so a
        # new stateful namespace (e.g. a future postgres) is captured automatically
        # with no silent gap. Ephemeral preview-pr-* namespaces get backed up too but
        # their short TTL + isolated Neon branch make that harmless.
        schedules:
          daily-platform:
            disabled: false
            # Every 6h on the hour (00:00, 06:00, 12:00, 18:00). OpenBao's snapshot
            # CronJob is offset to 30 */6 so the two don't hit the bucket at once.
            schedule: "0 */6 * * *"
            useOwnerReferencesInBackup: false
            template:
              # 5-day ttl. With the 6h cadence above this caps live backups at
              # ~20 (4/day × 5d); Velero auto-deletes each backup at expiry since
              # it has no count-based retention knob. Spec path: Schedule CRD
              # .spec.template.ttl (the BACKUP template, not the Schedule itself).
              ttl: 120h0m0s
              storageLocation: default
              defaultVolumesToFsBackup: true
              # Skips emptyDir volumes: see velero-volume-policy below.
              resourcePolicy:
                kind: configmap
                name: velero-volume-policy
              # arc-runners holds only CI runner pods, which come and go mid-backup.
              # restore-drill-*: the drills' throwaway namespaces (lib-restore-drill-*.sh).
              # A drill overlapping a run lost its PVC and PV mid-run and ended the run
              # PartiallyFailed (11-03 at 06:00 and 12:00). Exact names: Velero 1.18 is not
              # relied on for globs here, and tests/backup-window.test.sh V2 fails on a
              # drill namespace missing from this list. `restore-drill` itself stays in:
              # it holds the record of every drill, and it is not thrown away.
              # The estate's own drills (lib-restore-drill-*.sh it holds beside SEB's) throw away
              # namespaces of their own: the estate slot drill-namespaces lists them, one `- <ns>` a line,
              # after SEB's (empty by default).
              excludedNamespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - argocd
                - arc-runners
                - restore-drill-cnpg
                - restore-drill-datastore
                - restore-drill-headscale
                - restore-drill-openbao
                - restore-drill-harbor-db
                - restore-drill-nextcloud-files
                - restore-drill-novu
                - restore-drill-reportportal-index
                - restore-drill-velero
                - restore-drill-velero-file

        # emptyDir dies with its pod, so there is nothing to restore, and a CronJob
        # pod that ends mid-backup failed the whole backup: measured on 2026-11-02,
        # no backup out of 21 reached Completed, because of these and of the server's
        # OOM kills below. Every PersistentVolume is still backed up.
        extraObjects:
          # The node-agent's own settings (--node-agent-configmap above; Velero 1.18 reads the one key
          # as JSON). Without them it creates a pod for EVERY volume of a run at once, each requesting
          # nothing: on a node short of memory the kubelet refuses them all (it admits only pods that
          # request something while MemoryPressure stands), each volume ends Canceled, and the run waits
          # until fsBackupTimeout. A single-node estate, 2026-11-15: 9 of them at 06:00, 36 at 08:19.
          #   loadConcurrency.globalConfig   volumes copied at once, per node (Velero's default, said)
          #   loadConcurrency.prepareQueueLength
          #                                  volume pods being prepared at once, per node (unbounded
          #                                  by default: that is the burst)
          #   podResources                   each volume pod's floor and ceiling: a request so the
          #                                  kubelet admits it under memory pressure, small enough to
          #                                  fit beside a node nearly fully requested, and a ceiling
          #                                  kopia's upload of one volume stays under. ALL FOUR are
          #                                  given: Velero 1.18 discards the whole set when one is empty
          #                                  ("Pod resource requirements are invalid, ignore", an estate
          #                                  2026-11-15, cpuLimit missing); "0" means no limit
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: velero-node-agent
              namespace: velero
            data:
              node-agent.json: |
                {
                  "loadConcurrency": {
                    "globalConfig": 1,
                    "prepareQueueLength": 1
                  },
                  "podResources": {
                    "cpuRequest": "50m",
                    "cpuLimit": "0",
                    "memoryRequest": "128Mi",
                    "memoryLimit": "1Gi"
                  }
                }
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: velero-volume-policy
              namespace: velero
            data:
              policy.yaml: |
                version: v1
                volumePolicies:
                  - conditions:
                      volumeTypes:
                        - emptyDir
                    action:
                      type: skip

        metrics:
          enabled: true
          serviceMonitor:
            enabled: false

        # 512Mi OOM-killed the server 19 times, each time failing the running backup.
        resources:
          requests: { cpu: 250m, memory: 256Mi }
          limits: { memory: 1Gi }
