          forceString: true
      values: |
        # AWS object-storage plugin (S3-compatible: Hetzner Object Storage).
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.13.0
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - name: plugins
