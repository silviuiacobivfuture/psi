        # RBAC: the chart binds Velero's SA to cluster-admin (rbac.clusterAdministrator,
        # default true) — Velero needs broad read across all namespaces + PVs to back
        # them up. Accepted for dev (single tailnet-gated operator); TODO(hardening):
        # replace with a scoped ClusterRole (read-all + manage velero.io CRs) before prod.

        # node-agent (kopia) → captures PersistentVolume *data*, not just k8s
        # resources. Required to actually protect PVC contents (openbao vault,
        # harbor registry, postgres, etc.).
        deployNodeAgent: true
        # QoS floor + ceiling so a large kopia upload can't spike a node unbounded.
        nodeAgent:
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }

        configuration:
          # Default volume backup path = file-system backup via kopia node-agent.
          # Hetzner Object Storage has no CSI VolumeSnapshot support, so FSB is the
          # only way to capture PV data here.
          defaultVolumesToFsBackup: true
          uploaderType: kopia

          backupStorageLocation:
            - name: default
              provider: aws
              # bucket: set by `parameters` below (an estate value).
              prefix: velero
              default: true
              credential:
                name: velero-credentials
                key: cloud
              config:
                region: nbg1
                s3ForcePathStyle: "true"
                s3Url: https://nbg1.your-objectstorage.com
                # Hetzner S3 rejects AWS-style checksums (same as the tofu backend's
                # skip_s3_checksum). Disable the request/response checksum the AWS
                # SDK v2 adds by default.
                checksumAlgorithm: ""

          # No CSI snapshotter on this cluster → no VolumeSnapshotLocation; PV data
          # is protected by the node-agent FSB above.
