# GENERATED by estate/seb-upgrade.sh from estate/platform.lock. Do not edit; re-run the upgrade.
# Read by the Harbor housekeeping CronJobs (harbor-housekeeping.yaml): the locked bundle is always kept.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-lock
  namespace: harbor
data:
  platform.lock: |
    # estate/platform.lock — the SEB platform release this estate runs.
    #   version  the SEB release (tag v<version> in SEB's repository)
    #   source   where the estate's own Harbor serves the bundle built from that release with this
    #            estate's identity
    #   digest   that bundle's manifest digest. Absent until the estate's Harbor holds the bundle
    #            (genesis's images step, then every estate upgrade writes it). While it is absent
    #            nothing is installed into .seb-bundle/ and no dependency may take a SEB library
    #            from it.
    version = 0.1.70
    digest = sha256:638a9be124ffd8b5cdc7da5c363c0bca5b13e2b808e35342ea10e70630f115a1
    source = oci://registry.psizone.ro/seb/bundle
