              # namespace, and inside the pod's own user namespace (hostUsers above), so that its
              # capabilities reach nothing outside the pod.
              - name: dind
                # image: set by `parameters` below (an estate value).
                restartPolicy: Always
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    set -eu
                    # Outside a private namespace dockerd's containers escape the pod.
                    # Refuse, rather than run the way that stalled a node.
                    [ "$(cat /proc/self/cgroup)" = "0::/" ] || { echo "DIND CGROUP NAMESPACE IS NOT PRIVATE: $(cat /proc/self/cgroup)" >&2; exit 1; }
                    # Root here must not be the node's root. A uid map that starts at 0 on the
                    # node is the host's user namespace: refuse, rather than run with every
                    # capability over the node.
                    set -- $(head -n 1 /proc/self/uid_map)
                    [ "${2:-0}" != 0 ] || { echo "DIND IS NOT IN A USER NAMESPACE: uid_map $*" >&2; exit 1; }
                    # The cgroup must be this pod's root's to write (the cgroup-delegated runtime
                    # class); without it no container can start, and that is said by name.
                    cg=/sys/fs/cgroup
                    [ -w "$cg/cgroup.subtree_control" ] || { echo "DIND CGROUP IS NOT DELEGATED: runtimeClassName cgroup-delegated missing, or its handler is not on this node" >&2; exit 1; }
                    # dockerd sets forwarding and bridge sysctls (procMount: Unmasked below).
                    [ -w /proc/sys/net/ipv4/ip_forward ] || { echo "DIND /proc/sys IS READ-ONLY" >&2; exit 1; }
                    # What the image's dind script does, done early so /docker can
                    # have its ceiling before dockerd starts. The script repeats it.
                    mkdir -p "$cg/init" "$cg/docker"
                    xargs -rn1 < "$cg/cgroup.procs" > "$cg/init/cgroup.procs" || :
                    sed -e 's/ / +/g' -e 's/^/+/' < "$cg/cgroup.controllers" > "$cg/cgroup.subtree_control"
