                    [ "$lim" != max ] || { echo "DIND HAS NO MEMORY LIMIT" >&2; exit 1; }
                    echo "$((lim - 536870912))" > "$cg/docker/memory.max"
                    exec dockerd-entrypoint.sh dockerd --host=unix:///var/run/docker.sock --group="$DOCKER_GROUP_GID"
                env:
                  - { name: DOCKER_GROUP_GID, value: "123" }
                securityContext:
                  privileged: false
                  allowPrivilegeEscalation: true
                  # Every capability, held inside the pod's user namespace (dockerd needs SYS_ADMIN and
                  # NET_ADMIN there to make containers and their networks), less those that act on the
                  # whole kernel and have no use in a build: loading modules, raw I/O, the clock,
                  # rebooting, the kernel log, the audit system, the security modules, BPF and perf.
                  capabilities:
                    add: ["ALL"]
                    drop: [SYS_MODULE, SYS_RAWIO, SYS_TIME, SYS_BOOT, SYSLOG, AUDIT_CONTROL, AUDIT_READ, MAC_ADMIN, MAC_OVERRIDE, BPF, PERFMON, WAKE_ALARM, BLOCK_SUSPEND]
                  # A seccomp filter of our own, written on the node by the cgroup-delegated Plan
                  # (pieces/system-upgrade-controller/cgroup-delegated/dind-seccomp.json): it refuses the
                  # calls a container escape or a kernel exploit reaches for (module loading, kexec,
                  # open_by_handle_at, bpf, perf_event_open, userfaultfd, io_uring, the clock, swap,
                  # reboot) and lets through what nested containers need. NOT RuntimeDefault: measured on
                  # this sidecar, the runtime's default refuses keyctl ("unable to join session keyring")
                  # and the new mount API runc uses ("pivot_root .: operation not permitted"), so no
                  # container could start.
                  seccompProfile: { type: Localhost, localhostProfile: cgroup-delegated/dind.json }
                  # AppArmor's runtime default denies every mount, and dockerd mounts overlays and its
                  # containers' filesystems: measured on this sidecar, "mounting cgroup2 failed:
                  # Permission denied" under RuntimeDefault. The user namespace above is what confines it.
                  appArmorProfile: { type: Unconfined }
                  # /proc unmasked and writable, allowed only with a user namespace: dockerd writes its
                  # network sysctls, which a namespaced root can set only for this pod's own network.
                  procMount: Unmasked
