                    memory: 2560Mi
                  limits:
                    # 7Gi — roughly 40% above the observed peak, NOT a multiple of
                    # a number sampled at idle. That mistake capped this container
                    # at 3Gi when it needs 5.1Gi and took that CI down for three
                    # hours; see docs/ci/BASELINE.md.
                    #
                    # NO cpu limit, deliberately. A CPU limit throttles rather than
                    # protects, and the GitHub failure text for a starved runner
                    # ("lost communication with the server") is indistinguishable
                    # from the memory kill it also describes — which is exactly the
                    # ambiguity that made the last incident take three hours to
                    # attribute.
                    # 12Gi. Cererea de 8Gi este rezervarea; asta este plafonul unde
                    # nucleul omoară. Cei 7Gi de dinainte erau ~40% peste vârful
                    # INSTALĂRII și nu spuneau nimic despre construirea de imagini.
                    # O limită prea joasă nu încetinește o construire, o OMOARĂ, iar
                    # simptomul este „the self-hosted runner lost communication" —
                    # care se citește ca CI instabil, nu ca memorie epuizată. Exact
                    # greșeala documentată mai sus, care a ținut acel CI jos
                    # trei ore.
                    #
                    # DE MĂSURAT: vârful real al unei construiri de imagine pe acești
                    # runneri. Până atunci, 12Gi este peste tot ce s-a văzut.
                    # The ceiling is the estate's too (slot runner-memory-limit): on an estate whose CI
                    # shares ONE server with its services, an unbounded build is what pushes them out.
                    # psi (2026-11-16): 6Gi, was SEB's 12Gi. The runner shares psi's ONE server with every service;
                    # an unbounded job pushed the node to 103% of its allocatable memory and MemoryPressure.
                    # 4Gi was tried first and was too low: estate-gates' runner was SIGKILLed (exit 137) mid-job at
                    # 00:41Z on 16 Nov, after 2.1 Gi anonymous / 2.7 Gi working set sampled a minute apart, so its
                    # peak is above 4Gi and unmeasured. Lower this only with a peak measured DURING estate-gates.
                    memory: 6Gi
                    # A CPU LIMIT, 2 CPUs, after all (2026-11-18). The note above rejected one
                    # because a throttled runner and a killed one look alike from GitHub. That
                    # was the right worry for memory: a memory limit KILLS. A CPU limit only
                    # slows a build down, and the alternative is now measured. At ~20:10Z on
                    # 2026-11-18, three runners with no CPU limit took dev-k3s-agent-0 to
                    # load 33 on 16 cores. Live Convex queries ran 100x slower than normal
                    # there, and a user's query timed out.
                    #
                    # The numbers come from agent-0 (kubectl describe node, read-only, 2026-11-18):
                    #   allocatable 16 CPU, no system reservation; everything that is not a
                    #   runner requests 3.43 CPU and uses ~2-2.5 (kubectl top, Netdata).
                    #   One pod is capped at runner 2 + dind 1 = 3 CPUs.
                    #   At that estate's maxRunners 3 (slot max-runners), CI gets at most 9 CPUs
                    #   and the live services always keep 7. That covers their 3.43 requested,
                    #   the busiest Convex backend's raised request, and ~3 CPUs for k3s,
                    #   containerd and the kernel, which nothing reserves.
                    #   At SEB's default maxRunners 2, CI gets at most 6.
                    # Two for the runner, not less: an estate may request up to 2 here
                    # (slot runner-cpu), and a request above its limit is refused by the
                    # API server.
                    # The cost: CI is slower whenever it would otherwise have taken the whole
                    # node, most of all an image build compiled inside dind on one CPU.
                    # The estate's (slot runner-cpu-limit). Never empty: the gate
                    # tools/bundle/test/arc-runners-cpu.test.mjs refuses a runner pod
                    # container with no CPU limit, or with a request above its limit.
                    cpu: "2"
                # What the chart's dind mode adds to the runner: the daemon's socket
                # and the shared work directory.
                env:
                  - { name: DOCKER_HOST, value: "unix:///var/run/docker.sock" }
                  - { name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS, value: "120" }
                volumeMounts:
                  - { name: work, mountPath: /home/runner/_work }
                  - { name: dind-sock, mountPath: /var/run }
        # Explicit (Argo can't do the live-discovery the chart defaults to).
        controllerServiceAccount:
          name: arc-controller-gha-rs-controller
          namespace: arc-systems
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  info:
    - name: seb-bundle
      value: registry.psizone.ro/seb/bundle@sha256:25df6b6c9f959f836082d4d1493c28bbe3bce55ebb34a8f5e2dd8fb0bbb930e2
  revisionHistoryLimit: 2
