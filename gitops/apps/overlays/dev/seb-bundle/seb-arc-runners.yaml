                  # 9Gi ceiling, measured on the biggest build (an application image, with its
                  # registry cache export, 2026-11-02): anon peak 7.1 GiB. It passed
                  # under 8Gi in 593 s with no OOM kill, but its 7.5 GiB /docker
                  # ceiling was hit 824k times. 9Gi gives anon ~20% to grow into. The
                  # 14-15 GiB peaks read off the host's /docker/buildx were nearly
                  # all page cache, which a limit reclaims first. A build that
                  # outgrows this fails its own step, naming the memory.
                  #
                  # CPU: 250m reserved, 1 CPU ceiling. Every job container and buildx builder
                  # this daemon starts lives inside THIS container's cgroup (the private
                  # namespace above), so this limit is what caps an image build. Without it the
                  # runner's own CPU limit capped nothing that `docker build` does. The request
                  # is written out because a limit with no request makes the request equal the
                  # limit. Why the numbers: see the runner's CPU limit below.
                  requests: { memory: 256Mi, cpu: 250m }
                  limits:
                    # The estate's (slot dind-memory-limit), for the same reason as the runner's ceiling.
                    # It must stay above 512Mi: /docker gets this minus 512 MiB (the args above).
                    # psi (2026-11-16): 5Gi, was SEB's 9Gi. psi's apps.yml builds its application images in this
                    # sidecar (/docker gets 4.5 GiB of it); idle it holds 75 Mi anonymous, 350 Mi with page cache.
                    # Together with the runner's 4Gi a CI job is bounded at 9Gi of the node, not 21Gi.
                    memory: 5Gi
                    # The estate's (slot dind-cpu-limit). Never empty: tools/bundle/test/arc-runners-cpu.test.mjs
                    # refuses a runner pod container with no CPU limit.
                    cpu: "1"
                volumeMounts:
                  - { name: work, mountPath: /home/runner/_work }
                  - { name: dind-sock, mountPath: /var/run }
                  - { name: dind-externals, mountPath: /home/runner/externals }
            volumes:
              - { name: dind-sock, emptyDir: {} }
              - { name: dind-externals, emptyDir: {} }
              - { name: work, emptyDir: {} }
