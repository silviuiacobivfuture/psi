# SEB piece `arc-runners` — the GitHub Actions runner scale set (gha-runner-scale-set): ephemeral
# runner pods for the estate's GitHub owner (`runs-on: k8s` in a workflow → a pod spins up here,
# runs the job, vanishes). A dind sidecar gives each runner a docker daemon (for `docker build`).
# Auth via the arc-github-pat secret (arc-runner-secret.yaml in the dev overlay, from OpenBao).
# Its controller is the piece arc-controller.
#
# A HELM piece (contract: tools/bundle/helm-piece.mjs): this file is the Argo CD Application
# TEMPLATE; values.yaml beside it is the chart's values. The estate's GitHub owner and registry
# come from the identity (placeholders below); the notes in values.yaml that name an estate's own
# incidents are ESTATE SLOTS, filled from <estate-components>/arc-runners/<slot>.yaml.
# The SIZING is the estate's too, as slots: min-runners, max-runners (the scale set's warm and
# ceiling counts) and runner-cpu, runner-memory (the runner container's requests) — its servers,
# not SEB's. An estate with estate/runners.json takes min/max from each set's `size` instead.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runners
  namespace: argocd
  labels:
    platform.psizone.ro/source: seb-bundle
spec:
  project: default
  source:
    repoURL: ghcr.io/actions/actions-runner-controller-charts
    chart: gha-runner-scale-set
    targetRevision: 0.14.2
    helm:
      # Estate values: filled from the identity by the estate's upgrade step, never written here.
      parameters:
        - name: githubConfigUrl
          value: https://github.com/silviuiacobivfuture/psi
          forceString: true
        - name: template.spec.initContainers[1].image
          value: registry.psizone.ro/mirror/docker.io/library/docker:dind@sha256:97545b7bab66319a476800a85b008b25c06681733d484909e2a776281e41574f
          forceString: true
      values: |
        # githubConfigUrl: set by `parameters` below (an estate value).
        githubConfigSecret: arc-github-pat
        runnerScaleSetName: k8s
        # DIND, WRITTEN OUT — not `containerMode: dind`, whose sidecar is privileged.
        # containerd gives a private cgroup namespace only to UNPRIVILEGED containers,
        # and Kubernetes has no field to ask for one. So the chart's dockerd sat in the
        # HOST's namespace and created every job container, and buildx's builder at its
        # absolute /docker/buildx, at the host's cgroup root: outside this pod's limits.
        # A CI image build stalled the agent node that way on 2026-10-29.
        #
        # Staying privileged and bind-mounting the sidecar's own cgroup over
        # /sys/fs/cgroup (fe5dd2ec0) does NOT work: /sys/fs/cgroup then disagrees with
        # /proc/<pid>/cgroup, `runc exec` into the builder writes to a doubled path, and
        # buildx's boot check exits 127. The two views must come from one real namespace.
        # RUNBOOK 2026-11-02 has the measurements;
        # infrastructure/hetzner/scripts/tests/arc-dind-cgroup.test.sh refuses both shapes.
        # WARM, nu de la zero. Măsurat pe acest cluster: fiecare pornire la rece
        # înseamnă programarea unui pod plus tragerea imaginii înainte ca vreun
        # pas să ruleze, iar cu `minRunners: 0` ASTA se întâmpla la fiecare
        # lucrare care sosea pe un cluster liniștit.
        #
        # Doi, nu mai mulți: fiecare runner REZERVĂ 5Gi tot timpul, iar memoria
        # este plafonul acestui cluster (vezi `maxRunners`). Doi calzi costă 10Gi
        # din cei 35Gi alocabili muncitorilor și acoperă cazul obișnuit — o
        # împingere, uneori două deodată.
        # CALZI TOT TIMPUL, patru din patru: `minRunners == maxRunners`, deci nu se
        # pornește niciodată nimic la rece. Cu `0`, fiecare lucrare sosită pe un
        # cluster liniștit aștepta programarea unui pod și tragerea imaginii înainte
        # ca vreun pas să ruleze — cea mai mare întârziere care se putea scoate fără
        # hardware nou. NU costă bani: mașinile sunt plătite oricum. Costă capacitate
        # rezervată, și încape.
        # psi (2026-11-12): ONE server (CPX62, the account's core limit allows one), about 4Gi of
        # reservable memory left after the estate. One warm runner reserving 3Gi; the RMX numbers
        # above assume two agent nodes. Raise when psi's dedicated CI workers join.
        minRunners: 1
        # 8, raised from 4 (2026-09-03), on a MEASUREMENT rather than a feeling.
        #
        # The earlier note said queue pressure was mostly superseded runs and
        # that concurrency groups were the real fix. Those groups shipped, and
        # the queue is still the dominant cost — measured on run 33696054470:
        #
        #     wall 949s, of which 105s was work and 706s was waiting
        #     11 runs queued against 4 runners
        #
        # So the pressure that remains is genuine parallel demand, not
        # supersession. Gating (see docs/ci/BUILD-SPEED-PLAN.md Part D) cut the
        # WORK per push by about ninety percent; it cannot cut the wait, because
        # the wait is about how many jobs can run at once.
        # 5, not 8. Eight was chosen when a runner was believed to need ~1Gi;
        # it needs 5.1Gi measured, and ~29Gi is free across the two nodes, so
        # five is what physically fits. Leaving it at eight would not have run
        # eight — the scheduler would have placed five and left three Pending
        # indefinitely, which looks like a stuck queue rather than a full cluster.
        # ȘASE, urcat de la 5 — și de ce nu mai mult, cu cifrele de față.
        #
        # Măsurat 2026-09-22, pe nod, fiindcă programarea este PE NOD și un pod de
        # 5Gi trebuie să încapă întreg pe unul singur:
        #
        #   dev-k3s-cp       16 CPU / 30.6Gi — alții 3.7/13.0 — liber 12.3/17.6Gi
        #   dev-k3s-agent-0  16 CPU / 30.6Gi — alții 5.9/13.1 — liber 10.1/17.5Gi
        #   TOTAL pentru muncitori: 22.4 CPU / 35.0Gi
        #
        # La 5Gi măsurați per runner, 17.5Gi pe nod înseamnă TREI pe nod, deci
        # șase în total cu puțin aer. Șapte ar intra aritmetic și ar lăsa zero
        # rezervă; al optulea ar rămâne Pending la nesfârșit, ceea ce arată ca o
        # coadă înțepenită, nu ca un cluster plin — exact capcana pe care nota de
        # dinainte a numit-o când a coborât de la 8 la 5.
        #
        # Plafonul este MEMORIA, nu procesorul: 22.4 CPU liberi pentru șase
        # runneri înseamnă 3.7 CPU fiecare. De acolo vine viteza, nu din mai mulți.
        # PATRU, MAI PUȚINI ȘI MAI GRAȘI — plafonul este PE NOD, nu pe cluster.
        #
        # Măsurat 2026-09-22:
        #   dev-k3s-cp       16 CPU / 30.6Gi — alții 3.7/13.0 — liber 12.3/17.6Gi
        #   dev-k3s-agent-0  16 CPU / 30.6Gi — alții 5.9/13.1 — liber 10.1/17.5Gi
        #   TOTAL pentru muncitori: 22.4 CPU / 35.0Gi
        #
        # Un pod trebuie să încapă ÎNTREG pe un nod. La 8Gi intră DOI pe nod, deci
        # patru în total (32Gi din 35). Cinci la 8Gi nu ar încăpea; iar mai puțini
        # și mai mari nu ajută: la 11Gi intră doar UNUL pe nod, adică doi în total.
        # Patru × 8Gi este maximul de memorie per construire fără a pierde paralelism.
        maxRunners: 1
        # RESOURCES, declared for the first time — and placed where the chart
        # actually reads them, which is NOT where they look like they belong.
        #
        # A top-level `resources:` in these values is accepted, rendered, and
        # SILENTLY IGNORED. Verified by rendering the chart rather than by
        # reading it:
        #     helm template ... -f values.yaml | grep resources
        #     -> container runner: resources=None
        # The pods have therefore requested nothing at all, so the scheduler
        # packed runners by count, blind to what they consume. Doubling the
        # ceiling without this would have doubled a blind pack, and the failure
        # mode is a build killed for memory — which reads as a flaky test rather
        # than a capacity problem.
        #
        # Measured from four live runners (kubectl top, 2026-09-03):
        #     cpu 1093m-1984m, memory 517Mi-715Mi
        #
        # Requests sit BELOW observed usage on purpose: a request is a floor for
        # placement, not a forecast, and setting it at peak strands capacity.
        # 8 x 1Gi requested is 8Gi guaranteed against ~30Gi free across the two
        # nodes, so a full burst still schedules. Limits are ~4x observed peak
        # memory, so an unusual build has room without one pod taking a node down.
        #
        # The chart merges `containers` by name but APPENDS `initContainers`, so with
        # `containerMode: dind` a `dind` entry here produced TWO init containers called
        # dind (verified by rendering). With the mode written out there is one.
        template:
          spec:
            initContainers:
              # Exactly the chart's dind-mode init container.
              - name: init-dind-externals
                image: ghcr.io/actions/actions-runner:2.338.2@sha256:0ce3288e48b012a83685998f683a2ae0cbd284fa722c090dda0af5443215cf30
                command: ["cp"]
                args: ["-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
                volumeMounts:
                  - { name: dind-externals, mountPath: /home/runner/tmpDir }
              # The chart's dind sidecar, UNPRIVILEGED with every capability, so that
              # containerd gives it its own cgroup namespace.
              - name: dind
                # image: set by `parameters` below (an estate value).
                restartPolicy: Always
                command: ["/bin/sh", "-c"]
                args:
                  - |
                    set -eu
                    # Outside a private namespace dockerd's containers escape the pod.
                    # Refuse, rather than run the way that stalled a node.
                    [ "$(cat /proc/self/cgroup)" = "0::/" ] || { echo "DIND CGROUP NAMESPACE IS NOT PRIVATE: $(cat /proc/self/cgroup)" >&2; exit 1; }
                    # An unprivileged container gets these read-only.
                    umount /sys/fs/cgroup
                    mount -t cgroup2 cgroup2 /sys/fs/cgroup
                    umount /proc/sys
                    # What the image's dind script does, done early so /docker can
                    # have its ceiling before dockerd starts. The script repeats it.
                    cg=/sys/fs/cgroup
                    mkdir -p "$cg/init" "$cg/docker"
                    xargs -rn1 < "$cg/cgroup.procs" > "$cg/init/cgroup.procs" || :
                    sed -e 's/ / +/g' -e 's/^/+/' < "$cg/cgroup.controllers" > "$cg/cgroup.subtree_control"
                    # 512 MiB under the sidecar's limit. The kubelet sets
                    # memory.oom.group on the sidecar, so hitting ITS limit kills
                    # dockerd too and the job reads "docker lost"; hitting this one
                    # kills only the hog, and the step fails naming the memory.
                    lim="$(cat "$cg/memory.max")"
                    [ "$lim" != max ] || { echo "DIND HAS NO MEMORY LIMIT" >&2; exit 1; }
                    echo "$((lim - 536870912))" > "$cg/docker/memory.max"
                    exec dockerd-entrypoint.sh dockerd --host=unix:///var/run/docker.sock --group="$DOCKER_GROUP_GID"
                env:
                  - { name: DOCKER_GROUP_GID, value: "123" }
                securityContext:
                  privileged: false
                  allowPrivilegeEscalation: true
                  capabilities: { add: ["ALL"] }
                  seccompProfile: { type: Unconfined }
                  appArmorProfile: { type: Unconfined }
                startupProbe:
                  exec: { command: ["docker", "info"] }
                  initialDelaySeconds: 0
                  failureThreshold: 24
                  periodSeconds: 5
                resources:
                  # 256Mi reserved: the daemon idles at ~160Mi.
                  # 9Gi ceiling, measured on the biggest build (an application image, with its
                  # registry cache export, 2026-11-02): anon peak 7.1 GiB. It passed
                  # under 8Gi in 593 s with no OOM kill, but its 7.5 GiB /docker
                  # ceiling was hit 824k times. 9Gi gives anon ~20% to grow into. The
                  # 14-15 GiB peaks read off the host's /docker/buildx were nearly
                  # all page cache, which a limit reclaims first. A build that
                  # outgrows this fails its own step, naming the memory.
                  requests: { memory: 256Mi }
                  limits: { memory: 9Gi }
                volumeMounts:
                  - { name: work, mountPath: /home/runner/_work }
                  - { name: dind-sock, mountPath: /var/run }
                  - { name: dind-externals, mountPath: /home/runner/externals }
            volumes:
              - { name: dind-sock, emptyDir: {} }
              - { name: dind-externals, emptyDir: {} }
              - { name: work, emptyDir: {} }
            # Builds PREFER the agent node. The control plane holds the cluster's
            # stateful volumes; CI's image builds there helped push its disk to the
            # eviction line on 2026-10-29 (RUNBOOK). A hard nodeSelector was tried
            # first and was wrong: the agent node has memory for ONE runner, so three
            # sat Pending for 44 min and CI ran at a quarter of its capacity. The
            # disk's real fix is Harbor's retention (24% after it); this keeps builds
            # off the control plane whenever the agent node has room.
            affinity:
              nodeAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    preference:
                      matchExpressions:
                        - { key: kubernetes.io/hostname, operator: In, values: [dev-k3s-agent-0] }
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:2.338.2@sha256:0ce3288e48b012a83685998f683a2ae0cbd284fa722c090dda0af5443215cf30
                command: ["/home/runner/run.sh"]
                # REQUESTS ONLY. The limits that were here are REVERTED, and the
                # reason is a regression: the largest application's CI went red on dev
                # from 10:40 today, every run dying ~12 minutes into
                # "Install (frozen lockfile)" with "The self-hosted runner lost
                # communication with the server" and no uploaded logs — the shape
                # of a container killed rather than a step failing. This file
                # gained `memory: 3Gi` at 09:57.
                #
                # A `pnpm install --frozen-lockfile` across 76 workspace projects
                # is the memory peak of any job here, and it previously ran with
                # NO limit at all. Capping it at four times a casually-observed
                # 715Mi was a guess dressed as a measurement: I sampled runners at
                # an idle moment and sized the ceiling from that.
                #
                # Requests stay, because they are the half that was actually
                # broken — the scheduler could not reason about these pods at all
                # before, and 8 x 1Gi guaranteed is what makes maxRunners: 8 safe
                # to schedule. Burstable above that is the behaviour these jobs
                # have always had.
                #
                # Re-introducing a ceiling needs the peak measured DURING an
                # install, not sampled between them.
                resources:
                  requests:
                    # 5Gi, which is what a runner ACTUALLY uses. Measured during a
                    # real workload rather than between them: 230 container-level
                    # samples over a live CI run of the largest application, peak 5129Mi in the
                    # `runner` container (dind peaked at 160Mi, so the memory is
                    # essentially all runner).
                    #
                    # It was 1Gi, against a 5.1Gi reality. The scheduler therefore
                    # believed eight runners needed 8Gi when they can want 40Gi,
                    # and would happily place them on a node with ~29Gi free — an
                    # overcommit of roughly five times, whose failure mode is the
                    # kernel choosing a victim, quite possibly a service rather
                    # than a build. Nothing had gone wrong only because builds
                    # rarely peak together.
                    #
                    # The practical effect: about five heavy jobs fit at once
                    # instead of eight, and the rest QUEUE. That limit already
                    # existed in the hardware; this makes the scheduler aware of
                    # it instead of discovering it by eviction.
                    # DOI, urcat de la unu. Procesorul este resursa de care acest
                    # cluster are din belșug — 22.4 CPU liberi pentru șase runneri
                    # — iar cererea este ce folosește programatorul ca să împartă
                    # timpul: cu „1" un runner era tratat ca o sarcină mică și
                    # primea pe măsură când nodul era ocupat.
                    #
                    # Tot FĂRĂ limită de CPU, deliberat, din același motiv scris
                    # mai jos: o limită ar sugruma construirea în loc să o încetinească
                    # doar când altcineva chiar are nevoie de procesor.
                    # CINCI. Procesorul este resursa de care acest cluster are din
                    # belșug — 22.4 liberi, iar patru × 5 = 20 — și cererea este ce
                    # folosește programatorul ca să împartă timpul: cu „1" un runner
                    # era tratat ca o sarcină mică exact când nodul era ocupat.
                    # Construirile Node paralelizează, deci aici se câștigă viteza.
                    # Tot FĂRĂ limită de CPU, deliberat (vezi mai jos).
                    # PATRU, coborât de la cinci la 2026-10-28. Ceilalți locatari de
                    # pe dev-k3s-agent-0 rezervă acum 6.8 CPU, deci doi runneri la 5
                    # cer 16.8 din 16 și al patrulea stătea Pending „Insufficient
                    # cpu". Fără limită de CPU, cererea e doar ponderea programării:
                    # un runner tot folosește tot procesorul liber.
                    cpu: "2"
                    # 8Gi, urcat de la 5Gi MĂSURAȚI, fiindcă s-a cerut explicit mai
                    # multă memorie per construire în locul unui al cincilea runner.
                    # Vârful instalării rămâne 5129Mi pe 230 de eșantioane; cei 3Gi
                    # în plus sunt pentru calea care NU a fost măsurată niciodată
                    # aici — construirea de imagini în dind, care pe mașina Fly de
                    # 8Gi a fost omorâtă pentru memorie în aceeași zi.
                    # 6Gi, coborât de la 8Gi la 2026-10-28. Ceilalți locatari de pe
                    # dev-k3s-agent-0 au crescut de la 13.1Gi (2026-09-22) la 17.5Gi,
                    # deci doi runneri la 8Gi nu mai încap pe nod și CI rula cu trei.
                    # Folosirea măsurată: 1.0–2.4Gi per runner (kubectl top). Plafonul
                    # de 12Gi rămâne neschimbat, așa că o construire de imagini tot
                    # are loc să crească; se schimbă doar rezervarea.
                    # 4Gi, coborât de la 6Gi la 2026-11-02, odată cu memoria rezervată
                    # pe noduri (RUNBOOK 2026-11-02). Alocabil nou, din care scad
                    # ceilalți locatari: agent 26.1 − 20.4 = 5.7Gi, plan de control
                    # 24.1 − 8.9 = 15.2Gi. Cu 256Mi pentru dind, 6Gi încap 0 + 2 = doi
                    # runneri, 5Gi 1 + 2 = trei, 4Gi 1 + 3 = patru. Plafonul nu se
                    # schimbă. O cerere mai mare lasă un runner Pending pentru totdeauna
                    # (scripts/tests/kubelet-memory.test.sh).
                    memory: 3Gi
                  limits:
                    # 7Gi — roughly 40% above the observed peak, NOT a multiple of
                    # a number sampled at idle. That mistake capped this container
                    # at 3Gi when it needs 5.1Gi and took that CI down for three
                    # hours; see docs/ci/BASELINE.md.
                    #
                    # NO cpu limit, deliberately. A CPU limit throttles rather than
                    # protects, and the GitHub failure text for a starved runner
                    # ("lost communication with the server") is indistinguishable
                    # from the memory kill it also describes — which is exactly the
                    # ambiguity that made the last incident take three hours to
                    # attribute.
                    # 12Gi. Cererea de 8Gi este rezervarea; asta este plafonul unde
                    # nucleul omoară. Cei 7Gi de dinainte erau ~40% peste vârful
                    # INSTALĂRII și nu spuneau nimic despre construirea de imagini.
                    # O limită prea joasă nu încetinește o construire, o OMOARĂ, iar
                    # simptomul este „the self-hosted runner lost communication" —
                    # care se citește ca CI instabil, nu ca memorie epuizată. Exact
                    # greșeala documentată mai sus, care a ținut acel CI jos
                    # trei ore.
                    #
                    # DE MĂSURAT: vârful real al unei construiri de imagine pe acești
                    # runneri. Până atunci, 12Gi este peste tot ce s-a văzut.
                    memory: 12Gi
                # What the chart's dind mode adds to the runner: the daemon's socket
                # and the shared work directory.
                env:
                  - { name: DOCKER_HOST, value: "unix:///var/run/docker.sock" }
                  - { name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS, value: "120" }
                volumeMounts:
                  - { name: work, mountPath: /home/runner/_work }
                  - { name: dind-sock, mountPath: /var/run }
        # Explicit (Argo can't do the live-discovery the chart defaults to).
        controllerServiceAccount:
          name: arc-controller-gha-rs-controller
          namespace: arc-systems
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  info:
    - name: seb-bundle
      value: registry.psizone.ro/seb/bundle@sha256:c414ce92aed5fe96f5d20710bbc1d35066f90a21f9bd8188ba83038c3a9f795d
