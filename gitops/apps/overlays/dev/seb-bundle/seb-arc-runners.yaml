            # CI worker: tools/identity/lib/topology.mjs, derived CLUSTER_TOPOLOGY single-node). There
            # is nowhere else to run, and the runtime handler is installed there in this topology
            # (pieces/system-upgrade-controller/single-node). The pod keeps its own user namespace
            # (hostUsers: false above), so a job step's capabilities still reach only this pod. Settled
            # by the bundle builder (tools/bundle/topology.mjs), never by hand.
