                    description: "Infrastructură: Primește traficul de pe internet · Traefik"
                    namespace: kube-system
                    app: kube-system
                    podSelector: app.kubernetes.io/name=traefik
                - Reguli de admitere:
                    icon: kyverno.png
                    description: "Infrastructură: Politicile pe care le respectă orice pod · Kyverno"
                    namespace: kyverno
                    app: kyverno
                    podSelector: app.kubernetes.io/name=kyverno-admission-controller
                - Baze de date:
                    icon: postgresql.png
