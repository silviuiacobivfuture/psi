            # ── Tehnic ──────────────────────────────────────────────────────────
            # The glossary of this side, served by the hub itself (configMaps.glosar below);
            # it opens in the same tab and leads back with "← Înapoi la hub".
            - Glosar tehnic:
                - Ce înseamnă? · Glosar:
                    icon: mdi-book-alphabet
                    href: /glosar/tehnic.html
                    target: _self
                    description: Cuvintele de pe partea Tehnic — cod, CI/CD, livrare, estate, cluster — pe înțelesul tuturor
            - Livrare:
                - Codul sursă:
                    icon: si-github
                    href: https://github.com/silviuiacobivfuture/psi
                    description: Depozitul platformei — cod, pull requests, issues · GitHub
                - Rulări CI:
                    icon: si-githubactions
                    href: https://github.com/silviuiacobivfuture/psi/actions
                    description: Runner-ele GitHub Actions din cluster · ARC
                    namespace: arc-systems
                    app: arc-systems
                    podSelector: app.kubernetes.io/name=gha-rs-controller
                - Ce rulează în cluster:
                    icon: argo-cd.png
                    href: https://argocd.psizone.ro
                    description: Ce versiune e livrată și sincronizarea ei · Argo CD
                    namespace: argocd
                    app: argocd
                    podSelector: app.kubernetes.io/name=argocd-server
                - Imaginile aplicațiilor:
                    icon: harbor.png
                    href: https://registry.psizone.ro
                    description: Registrul de imagini de containere · Harbor
                    namespace: harbor
                    app: harbor
                    podSelector: app=harbor,component=core
                - Regulile verificate:
                    icon: mdi-clipboard-check-multiple-outline
                    href: https://tests.psizone.ro
                    description: Ce reguli respectă fiecare aplicație, verificate automat
                    namespace: test-reports
                    app: test-reports
                    podSelector: app.kubernetes.io/name=test-reports
                - Documentația tehnică:
                    icon: mdi-book-open-variant
                    href: https://reference.psizone.ro
                    description: Referința pentru dezvoltatori · Reference
                    namespace: reference
                    app: reference
                    podSelector: app=reference
                # Behind Authentik's gate. The service is an API: /health is the one page a browser
                # can read; the notes themselves reach people through Polaris's bell.
                - Note de versiune:
                    icon: mdi-timeline-text-outline
                    href: https://changelog.psizone.ro/health
                    description: Serviciul notelor de versiune, per aplicație — notele le citești în clopoțelul din Polaris · Changelog
                    namespace: changelog
                    app: changelog
                    podSelector: app=changelog
            - Acces și securitate:
                - Conturi și autentificare:
                    icon: authentik.png
                    href: https://auth.psizone.ro/if/admin/
                    description: Utilizatori, grupuri și porțile de autentificare · Authentik
                    namespace: authentik
                    app: authentik
