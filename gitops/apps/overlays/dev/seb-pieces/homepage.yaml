                - Documente și notițe:
                    icon: mdi-notebook-edit-outline
                    href: https://docs.psizone.ro
                    description: Documente, notițe și table albe, scrise împreună · AFFiNE
                    namespace: affine
                    app: affine
                    podSelector: app.kubernetes.io/name=affine
                - E-mail:
                    icon: mdi-email-outline
                    href: https://webmail.psizone.ro/account
                    description: Adresa ta @post.psizone.ro și parolele de aplicație pentru telefon · Stalwart
                    namespace: stalwart
                    app: stalwart
                    podSelector: app.kubernetes.io/name=stalwart
            - Conținut și brand:
                - Conținutul site-urilor:
                    icon: mdi-text-box-edit-outline
                    href: https://cms.psizone.ro/admin
                    description: Scrii și publici articole și pagini pe site-uri · CMS
