# GENERATED by tools/estate-pieces.mjs from SEB's pieces; re-render, never edit.
# psi EDITS THIS RENDER (the hub, 2026-11-12): config.kubernetes discovery off, widgets, services,
# settingsString and custom.css are psi's own — two sides, Business and Tehnic, in psi's design
# language. SEB's estate slots cover only part of that, so a re-render must carry them over.
# SEB piece `homepage` — Homepage (gethomepage.dev), the SYSTEM HUB: every service and UI running
# in the cluster on one page, private-network only (hub.<tailnet> and hub.<mesh>, behind the
# identity provider's outpost). Stateless: its configuration is these values; it discovers the
# rest from annotated Ingresses with read-only RBAC.
#
# A HELM piece (contract tools/bundle/helm-piece.mjs): this file is the Argo CD Application
# TEMPLATE; the chart comes from its upstream repository at the pinned version; values.yaml beside
# it carries identity placeholders the estate's upgrade step fills in, and ESTATE SLOTS the bundle
# builder fills from the estate's own fragments (--estate-components <dir>/homepage/<slot>.yaml):
#   greeting, title       the name the page wears (default: the identity's BRAND_TITLE)
#   services-apps         the estate's own tiles that no Ingress announces, as whole groups
#                         placed first (e.g. an "Apps" group: an application running elsewhere)
#   services-services     the estate's own backends without an Ingress, first in "Services"
#   custom-css            the estate's theme (default: none — an estate brings its own)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://jameswynn.github.io/helm-charts
    chart: homepage
    targetRevision: 2.1.0
    helm:
      values: |
        image:
          repository: "registry.psizone.ro/mirror/ghcr.io/gethomepage/homepage"
          tag: "v1.2.0@sha256:c4ff34bad2874432e4e4c375627400cfe8462ecffa62418cfe336dac6edff274"

        # Cluster-wide READ-ONLY RBAC + ServiceAccount (discovery only — no write verbs).
        enableRbac: true
        serviceAccount:
          create: true

        service:
          main:
            ports:
              http:
                port: 3000

        resources:
          requests: { cpu: 25m, memory: 128Mi }
          limits:   { cpu: 500m, memory: 384Mi }

        # Kyverno baseline+restricted policies on this cluster require non-root + no
        # privilege escalation. The gethomepage image runs fine as an unprivileged user.
        # This chart maps top-level `podSecurityContext` → pod and `securityContext` →
        # container (it predates the bjw-s multi-controller `controllers:` schema).
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]

        # Chart ingress DISABLED — the hub is gated by Authentik. The host
        # hub.<tailnet>.ts.net is served by the embedded outpost via the `hub` proxy
        # provider (gitops/platform/authentik/blueprints-providers.yaml) + the
        # replacement ingress in gitops/platform/authentik/ingress-proxied-apps.yaml
        # (ns authentik → authentik-server → homepage Service :3000). HOMEPAGE_ALLOWED_HOSTS
        # below still allows the hub host because the outpost preserves the Host header.
        ingress:
          main:
            enabled: false

        # The Next.js host-check must allow both private names (the outpost keeps the Host).
        env:
          - name: HOMEPAGE_ALLOWED_HOSTS
            value: hub.psizone.ro,hub.psizone.ro

        config:
          # Kubernetes integration in CLUSTER mode → uses the pod's SA token + the RBAC above.
          # It powers the live status of every tile (namespace + app + podSelector below).
          # NOTE: must be the `kubernetes` MAP (not kubernetesString) — the chart default sets
          # config.kubernetes.mode, and the configmap template prefers the map over the string.
          #
          # psi: Ingress DISCOVERY IS OFF (ingress/traefik/gateway false). The hub is two
          # sides — Business for the team, Tehnic for operators — with plain Romanian names,
          # and that cannot be expressed through the rendered pieces' `gethomepage.dev/*`
          # annotations (English product names, SEB's groups, tailnet links, tiles for
          # pieces psi does not run). Every tile is therefore declared once, below; an
          # annotated Ingress adds nothing to this page.
          kubernetes:
            mode: cluster
            ingress: false
            traefik: false
            gateway: false

          # An empty list REPLACES the chart's default bookmarks rather than falling back to them.
          bookmarks: []

          # The header, one row, the same on both sides: the name, the date, search.
          # No cluster load here: it means nothing to the Business side, and Netdata
          # carries it on the Tehnic side.
          widgets:
            - greeting:
                text_size: xl
                text: Psizone
            - datetime:
                text_size: md
                locale: ro
                format:
                  dateStyle: long
                  timeStyle: short
                  hourCycle: h23
            - search:
                provider: duckduckgo
                target: _blank

          # Every tile, in reading order: the Business groups first, then Tehnic.
          # A tile's name says what it is FOR; the product sits last in its description.
          # Each status needs all three of `namespace`, `app` and `podSelector` (homepage
          # draws none without `app`; the pods are chosen by `podSelector`). Selectors and
          # links checked against the live cluster on 2026-11-12. A tile without `href` is a
          # component with no screen of its own: it is here for its status.
          # NOTE: provided as the `services` LIST (not servicesString) — the chart ships a
          # default config.services that would otherwise win the merge over a string.
          services:
            # ── Business ────────────────────────────────────────────────────────
            - Site-urile noastre:
                - Psizone:
                    icon: mdi-web
                    href: https://landing.psizone.ro
                    description: Site-ul centrului Psizone
                    namespace: psizone-web
                    app: psizone-web
                    podSelector: app=psizone-web
                - EQ-SYNC:
                    icon: mdi-waveform
                    href: https://eqsync.psizone.ro
                    description: Site-ul programului sonor de 21 de zile
                    namespace: eqsync-web
                    app: eqsync-web
                    podSelector: app=eqsync-web
                - Hemi-Sync România:
                    icon: mdi-weather-sunset-up
                    href: https://hemisync.psizone.ro
                    description: Programele, produsele și atelierele Hemi-Sync®
                    namespace: hemisync-web
                    app: hemisync-web
                    podSelector: app=hemisync-web
                - Blogul:
                    icon: mdi-book-open-page-variant-outline
                    href: https://blog.psizone.ro
                    description: Articolele tuturor brandurilor, într-un singur loc
                    namespace: blog-web
                    app: blog-web
                    podSelector: app=blog-web
            - Munca de zi cu zi:
                - Proiecte și sarcini:
                    icon: mdi-clipboard-check-outline
                    href: https://plane.psizone.ro
                    description: Ce e de făcut, cine se ocupă și până când · Plane
                    namespace: plane
                    app: plane
                    podSelector: app.name=plane-plane-web
                - Fișiere și dosare comune:
                    icon: mdi-folder-outline
                    href: https://cloud.psizone.ro/apps/files/
                    description: Documentele echipei, pe care le editezi direct în browser · Nextcloud
                    namespace: nextcloud
                    app: nextcloud
                    podSelector: app.kubernetes.io/name=nextcloud
                - Calendar:
                    icon: mdi-calendar-blank-outline
                    href: https://cloud.psizone.ro/apps/calendar/
                    description: Întâlnirile și programul echipei · Nextcloud
                    namespace: nextcloud
                    app: nextcloud
                    podSelector: app.kubernetes.io/name=nextcloud
                - Mesaje și apeluri:
                    icon: mdi-forum-outline
                    href: https://cloud.psizone.ro/apps/spreed/
                    description: Discuții, apeluri și videoconferințe cu echipa · Talk
                    namespace: nextcloud
                    app: nextcloud
                    podSelector: app.kubernetes.io/name=nextcloud
                - Unelte PDF:
                    icon: mdi-file-document-outline
                    href: https://pdf.psizone.ro
                    description: Unești, împarți sau micșorezi PDF-uri; fișierele rămân pe calculatorul tău
                    namespace: pdfcraft
                    app: pdfcraft
                    podSelector: app.kubernetes.io/name=pdfcraft
            - Conținut și brand:
                - Conținutul site-urilor:
                    icon: mdi-text-box-edit-outline
                    href: https://cms.psizone.ro/admin
                    description: Scrii și publici articole și pagini pe site-uri · CMS
                    namespace: cms
                    app: cms
                    podSelector: app=cms
                - Ghidul vizual:
                    icon: mdi-palette-outline
                    href: https://design.psizone.ro
                    description: Culorile, fonturile și componentele fiecărui brand
                    namespace: design-gallery
                    app: design-gallery
                    podSelector: app=design-gallery

            # ── Tehnic ──────────────────────────────────────────────────────────
            - Livrare:
                - Codul sursă:
                    icon: si-github
                    href: https://github.com/silviuiacobivfuture/psi
                    description: Depozitul platformei — cod, pull requests, issues · GitHub
                - Rulări CI:
                    icon: si-githubactions
                    href: https://github.com/silviuiacobivfuture/psi/actions
                    description: Runner-ele GitHub Actions din cluster · ARC
                    namespace: arc-systems
                    app: arc-systems
                    podSelector: app.kubernetes.io/name=gha-rs-controller
                - Ce rulează în cluster:
                    icon: argo-cd.png
                    href: https://argocd.psizone.ro
                    description: Ce versiune e livrată și sincronizarea ei · Argo CD
                    namespace: argocd
                    app: argocd
                    podSelector: app.kubernetes.io/name=argocd-server
                - Imaginile aplicațiilor:
                    icon: harbor.png
                    href: https://registry.psizone.ro
                    description: Registrul de imagini de containere · Harbor
                    namespace: harbor
                    app: harbor
                    podSelector: app=harbor,component=core
                # No UI and no link, and it must stay that way: the Nx remote cache speaks
                # a four-verb HTTP protocol to `nx` behind a bearer token shared by every CI
                # job. When it is down nothing BREAKS, builds just get slow — hence the status.
                - Cache-ul de build:
                    icon: si-nx
                    description: Cache Nx la distanță — fără interfață, citit de fiecare job CI
                    namespace: nx-cache
                    app: nx-cache
                    podSelector: app=nx-cache
                # Tailnet-only Ingress today, so no psizone.ro link to give.
                - Note de versiune:
                    icon: mdi-timeline-text-outline
                    description: Notele de versiune per aplicație — încă fără adresă publică · Changelog
                    namespace: changelog
                    app: changelog
                    podSelector: app=changelog
                - Regulile verificate:
                    icon: mdi-clipboard-check-multiple-outline
                    href: https://tests.psizone.ro
                    description: Ce reguli respectă fiecare aplicație, verificate automat
                    namespace: test-reports
                    app: test-reports
                    podSelector: app.kubernetes.io/name=test-reports
                - Istoricul testelor:
                    icon: mdi-chart-box-outline
                    href: https://reports.psizone.ro
                    description: Rulări de teste, tendințe și analiza eșecurilor · ReportPortal
                    namespace: reportportal
                    app: reportportal
                    podSelector: component=reportportal-ui
                - Documentația tehnică:
                    icon: mdi-book-open-variant
                    href: https://reference.psizone.ro
                    description: Referința pentru dezvoltatori · Reference
                    namespace: reference
                    app: reference
                    podSelector: app=reference
            - Acces și securitate:
                - Conturi și autentificare:
                    icon: authentik.png
                    href: https://auth.psizone.ro/if/admin/
                    description: Utilizatori, grupuri și porțile de autentificare · Authentik
                    namespace: authentik
                    app: authentik
                    podSelector: app.kubernetes.io/name=authentik,app.kubernetes.io/component=server
                # access.psizone.ro answers 503 while Polaris is down (2026-11-12), so the
                # tile carries its status and no link until it answers again.
                - Drepturi de acces:
                    icon: mdi-shield-key-outline
                    description: Cine ce are voie să facă — drepturi, catalog, audit · Polaris
                    namespace: autorizare
                    app: autorizare
                    podSelector: app=autorizare-svc
                - Furnizorul de identitate:
                    icon: mdi-account-key-outline
                    description: Autentificarea OpenID pentru fiecare aplicație — fără interfață · Polaris id
                    namespace: autorizare
                    app: autorizare
                    podSelector: app=autorizare-hub
                # No Ingress by design: its API auth is an unscoped preshared key. Every
                # application asks it whether an action is permitted, so its status going
                # dark is the first sign authorization has stopped everywhere.
                - Motorul de autorizare:
                    icon: mdi-key-chain-variant
                    description: Răspunde fiecărei aplicații dacă o acțiune e permisă — fără interfață · OpenFGA
                    namespace: openfga
                    app: openfga
                    podSelector: app=openfga
                - Seiful de secrete:
                    icon: si-openbao
                    href: https://openbao.psizone.ro
                    description: Parolele și cheile platformei · OpenBao
                    namespace: openbao
                    app: openbao
                    podSelector: app.kubernetes.io/name=openbao,component=server
                - Sincronizarea secretelor:
                    icon: mdi-key-arrow-right
                    description: Aduce secretele din OpenBao în cluster · External Secrets
                    namespace: external-secrets
                    app: external-secrets
                    podSelector: app.kubernetes.io/name=external-secrets
            - Comunicare și automatizări:
                - Automatizări:
                    icon: mdi-sitemap-outline
                    href: https://n8n.psizone.ro
                    description: Fluxuri automate și webhook-uri · n8n
                    namespace: n8n
                    app: n8n
                    podSelector: app.kubernetes.io/name=n8n
                - Notificări:
                    icon: si-novu
                    href: https://novu.psizone.ro
                    description: Fluxuri de notificări, abonați și activitate · Novu
                    namespace: novu
                    app: novu
                    podSelector: app.kubernetes.io/name in (novu-api,novu-dashboard-public)
                - E-mail:
                    icon: mdi-email-fast-outline
                    href: https://plunk.psizone.ro
                    description: Trimitere, primire, șabloane și campanii · Plunk
                    namespace: plunk
                    app: plunk
                    podSelector: app.kubernetes.io/name=plunk
                - Alerte în Talk:
                    icon: mdi-bell-badge-outline
                    description: Transformă alertele platformei în mesaje Talk — fără interfață
                    namespace: nextcloud
                    app: nextcloud
                    podSelector: app.kubernetes.io/name=talk-webhook
                - Apeluri video:
                    icon: mdi-video-outline
                    description: Serverul de semnalizare pentru apelurile Talk — fără interfață · Talk HPB
                    namespace: talk-hpb
                    app: talk-hpb
                    podSelector: app.kubernetes.io/name=talk-hpb
                - Editarea documentelor:
                    icon: si-collaboraonline
                    description: Deschide documentele Office din Fișiere — fără interfață · Collabora
                    namespace: nextcloud
                    app: nextcloud
                    podSelector: app.kubernetes.io/name=collabora
                # Its API answers only with a token; a browser has nothing to open there.
                - Memoria ghidului AI:
                    icon: mdi-vector-polyline
                    description: Baza de date vectorială a site-urilor — doar prin API, cu token · Chroma
                    namespace: chroma
                    app: chroma
                    podSelector: app=chroma
            - Monitorizare:
                - Starea serverelor:
                    icon: netdata.png
                    href: https://netdata.psizone.ro
                    description: Procesor, memorie și rețea în timp real, pe noduri și poduri · Netdata
                    namespace: monitoring
                    app: netdata
                    podSelector: app=netdata,role=parent
                - Consola Kubernetes:
                    icon: si-kubernetes
                    href: https://headlamp.psizone.ro
                    description: Tot ce rulează în cluster, citit și administrat · Headlamp
                    namespace: headlamp
                    app: headlamp
                    podSelector: app.kubernetes.io/name=headlamp
                - Jurnale și urme:
                    icon: si-opentelemetry
                    description: Colectarea jurnalelor și a urmelor (agent și colector) · OpenTelemetry
                    namespace: observability
                    app: observability
                    podSelector: app in (otel-agent,otel-cluster)
                # A CronJob: no pod lives between runs, so no status.
                - Raportul zilnic:
                    icon: mdi-heart-pulse
                    description: Starea clusterului, trimisă zilnic în Talk
            - Infrastructură:
                - Certificate:
                    icon: cert-manager.png
                    description: Certificatele TLS (Let's Encrypt) · cert-manager
                    namespace: cert-manager
                    app: cert-manager
                    podSelector: app.kubernetes.io/name=cert-manager
                - Domenii:
                    icon: cloudflare.png
                    description: Înregistrările DNS (Cloudflare) · external-dns
                    namespace: external-dns
                    app: external-dns
                    podSelector: app.kubernetes.io/name=external-dns
                - Intrarea publică:
                    icon: traefik.png
                    description: Primește traficul de pe internet · Traefik
                    namespace: kube-system
                    app: kube-system
                    podSelector: app.kubernetes.io/name=traefik
                - Rețeaua privată:
                    icon: si-tailscale
                    description: Intrarea din rețeaua privată (operatorul tailnet) · Tailscale
                    namespace: tailscale
                    app: tailscale
                    podSelector: app=operator
                - Reguli de admitere:
                    icon: kyverno.png
                    description: Politicile pe care le respectă orice pod · Kyverno
                    namespace: kyverno
                    app: kyverno
                    podSelector: app.kubernetes.io/name=kyverno-admission-controller
                - Baze de date:
                    icon: postgresql.png
                    description: Operatorul PostgreSQL — fiecare bază de date din cluster · CloudNativePG
                    namespace: cnpg-system
                    app: cnpg-system
                    podSelector: app.kubernetes.io/name=cloudnative-pg
                - Copii de siguranță:
                    icon: velero.png
                    description: Salvarea și restaurarea clusterului · Velero
                    namespace: velero
                    app: velero
                    podSelector: name=velero
                - Reporniri la rotire:
                    icon: reloader.png
                    description: Repornește aplicațiile când li se schimbă secretele · Reloader
                    namespace: reloader
                    app: reloader
                    podSelector: app.kubernetes.io/name=reloader
                - Actualizări de sistem:
                    icon: k3s.png
                    description: Controlerul de actualizare k3s
                    namespace: system-upgrade
                    app: system-upgrade
                    podSelector: app.kubernetes.io/name=system-upgrade-controller
                - Discuri:
                    icon: mdi-harddisk
                    description: Volumele persistente Hetzner Cloud · hcloud CSI
                    namespace: kube-system
                    app: kube-system
                    podSelector: app.kubernetes.io/name=hcloud-csi
                - Consola cloud:
                    icon: hetzner.png
                    href: https://console.hetzner.cloud/
                    description: Servere, rețea și stocare · Hetzner Cloud

          # settingsString = stable layout ordering (Go/Helm toYaml sorts map keys otherwise).
          # Two tabs: Business (first, so the page opens on it) and Tehnic. Romanian first,
          # like every psi app (each app's project.inlang: baseLocale ro).
          settingsString: |
            title: Psizone · hub
            description: Tot ce folosește echipa Psizone, într-un singur loc
            theme: dark
            color: stone
            headerStyle: clean
            target: _blank
            language: ro
            hideVersion: true
            disableCollapse: true
            useEqualHeights: true
            quicklaunch:
              searchDescriptions: true
              hideInternetSearch: true
            layout:
              Site-urile noastre:
                tab: Business
                icon: mdi-web
                style: row
                columns: 4
              Munca de zi cu zi:
                tab: Business
                icon: mdi-briefcase-outline
                style: row
                columns: 4
              Conținut și brand:
                tab: Business
                icon: mdi-palette-outline
                style: row
                columns: 4
              Livrare:
                tab: Tehnic
                icon: mdi-source-branch
                style: row
                columns: 4
              Acces și securitate:
                tab: Tehnic
                icon: mdi-shield-lock-outline
                style: row
                columns: 4
              Comunicare și automatizări:
                tab: Tehnic
                icon: mdi-email-fast-outline
                style: row
                columns: 4
              Monitorizare:
                tab: Tehnic
                icon: mdi-chart-line
                style: row
                columns: 4
              Infrastructură:
                tab: Tehnic
                icon: mdi-server-outline
                style: row
                columns: 4

        # ── The estate's theme: psi's design language, Psizone · Night ───────────
        # Every colour, radius, space and face below is a psi token, copied from
        # packages/design/theme.generated.css ([data-theme="psizone-dark"] and @theme static,
        # generated from packages/design/tokens.json). Nothing here is a colour of its own.
        # gethomepage auto-loads /app/config/custom.css. The jameswynn chart does not
        # render a custom.css key into its config ConfigMap, so the CSS ships as an
        # extra ConfigMap (configMaps.* below), subPath-mounted by persistence.custom-css.
        configMaps:
          custom-css:
            enabled: true
            data:
              custom.css: |
                /* psi's faces, the same request the design gallery makes (Fraunces for headings,
                   Manrope for text, IBM Plex Mono for data). */
                @import url("https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,100..900,0..100;1,9..144,100..900,0..100&family=Manrope:wght@400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap");

                /* psizone-dark roles — packages/design/theme.generated.css. */
                :root {
                  color-scheme: dark;
                  --bg: #0D0B07;
                  --surface-1: #15120C;
                  --surface-2: #1E1A12;
                  --line: rgba(255,240,210,0.10);
                  --line-strong: #3E3626;
                  --line-control: #8A7D62;
                  --ink: #F7F1E3;
                  --ink-muted: #C2B79F;
                  --ink-faint: #9C927C;
                  --glow-1: #D2AA50;
                  --glow-2: #40D9C9;
                  --accent: #C2983F;
                  --accent-soft: rgba(194,152,63,0.16);
                  --focus: #40D9C9;
                  --success: #6EE7A8;
                  --danger: #FF9A8F;
                  --shadow-float: 0 12px 32px rgba(0,0,0,0.45);
                  --shadow-glow: 0 0 0 1px rgba(194,152,63,0.35), 0 8px 40px rgba(194,152,63,0.22);
                  --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
                  --font-sans: "Manrope", "Segoe UI", system-ui, sans-serif;
                  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
                  --radius-sm: 10px;
                  --radius-md: 18px;
                  --radius-pill: 999px;
                  --space-1: 4px;
                  --space-2: 8px;
                  --space-3: 12px;
                  --space-4: 16px;
                  --space-5: 24px;
                  --space-6: 32px;
                }

                /* Homepage paints with a 50–900 palette of RGB triples; each step is a psi role
                   (the same token values as above, written as homepage needs them). */
                .theme-stone {
                  --color-50: 247 241 227;  /* ink */
                  --color-100: 247 241 227; /* ink */
                  --color-200: 247 241 227; /* ink */
                  --color-300: 194 183 159; /* ink-muted */
                  --color-400: 156 146 124; /* ink-faint */
                  --color-500: 138 125 98;  /* line-control */
                  --color-600: 62 54 38;    /* line-strong */
                  --color-700: 30 26 18;    /* surface-2 */
                  --color-800: 13 11 7;     /* bg */
                  --color-900: 13 11 7;     /* bg */
                  --color-logo-start: 210 170 80; /* glow-1 */
                  --color-logo-stop: 194 152 63;  /* accent */
                }

                body, html { font-family: var(--font-sans); color: var(--ink); }

                /* The ground, with the Psizone ambient light standing still in one corner. */
                #page_container {
                  background:
                    radial-gradient(60rem 36rem at 12% -8%, color-mix(in oklab, var(--glow-1) 12%, transparent), transparent 70%),
                    radial-gradient(48rem 30rem at 100% 0%, color-mix(in oklab, var(--glow-2) 6%, transparent), transparent 70%),
                    var(--bg);
                }

                /* Header: the name in Fraunces, the date as data. */
                #information-widgets { padding-top: var(--space-5); }
                #information-widgets .text-xl {
                  font-family: var(--font-display);
                  font-variation-settings: "SOFT" 100, "opsz" 144;
                  font-weight: 400;
                  font-size: 32px;
                  letter-spacing: -0.015em;
                  color: var(--ink);
                }

                /* The two sides: pill tabs, the active one in accent-soft. */
                #myTab {
                  background: var(--surface-1);
                  border: 1px solid var(--line);
                  border-radius: var(--radius-pill);
                  padding: var(--space-1);
                  gap: var(--space-1);
                }
                #myTab li { height: auto; border-radius: var(--radius-pill); }
                #myTab button {
                  margin: 0;
                  padding: var(--space-3) var(--space-5);
                  border-radius: var(--radius-pill);
                  font-size: 14px;
                  font-weight: 600;
                  letter-spacing: 0.005em;
                  color: var(--ink-muted);
                  background: transparent;
                }
                #myTab button:hover { color: var(--ink); background: var(--surface-2); }
                #myTab button[aria-selected="true"] { color: var(--ink); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }

                /* Group headings in Fraunces, the family's voice. */
                .service-group-name {
                  font-family: var(--font-display);
                  font-variation-settings: "SOFT" 100;
                  font-weight: 400;
                  font-size: 26px;
                  letter-spacing: -0.015em;
                  color: var(--ink);
                }
                .service-group-icon { color: var(--accent); }

                /* Cards: solid surface-1, soft corners, hairline, lifting into surface-2. */
                .service-card {
                  background: var(--surface-1);
                  border: 1px solid var(--line);
                  border-radius: var(--radius-md);
                  box-shadow: none;
                  color: var(--ink);
                  padding: var(--space-2);
                  transition: background-color 250ms ease-out, box-shadow 250ms ease-out, border-color 250ms ease-out;
                }
                .service-card:hover {
                  background: var(--surface-2);
                  border-color: var(--line-strong);
                  box-shadow: var(--shadow-glow);
                  color: var(--ink);
                }
                .service-name { font-size: 16px; font-weight: 600; line-height: 24px; color: var(--ink); }
                .service-description { font-size: 14px; font-weight: 450; line-height: 22px; color: var(--ink-muted); }
                .service-icon { color: var(--ink-muted); }
                .service-card:hover .service-icon { color: var(--accent); }

                /* Status: the word stays (never colour alone), set as data. */
                .service-tag, .service-tag * { font-family: var(--font-mono); }

                /* Focus: 2px focus ring, 2px offset, on everything interactive. */
                a:focus-visible, button:focus-visible, input:focus-visible {
                  outline: 2px solid var(--focus);
                  outline-offset: 2px;
                  border-radius: var(--radius-sm);
                }

                @media (prefers-reduced-motion: reduce) {
                  *, *::before, *::after { transition: none !important; animation: none !important; }
                }

        persistence:
          logs:
            enabled: true
            type: emptyDir
            mountPath: /app/config/logs
          # Mount the chart-rendered custom-css ConfigMap as /app/config/custom.css.
          # gethomepage auto-loads it. subPath-mount (single key) so it lands as a
          # file alongside the other config files on the shared /app/config dir.
          # ConfigMap name = <release>-custom-css = "homepage-custom-css".
          custom-css:
            enabled: true
            type: configMap
            name: homepage-custom-css
            readOnly: true
            subPath:
              - path: custom.css
                mountPath: /app/config/custom.css
  destination:
    server: https://kubernetes.default.svc
    namespace: homepage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
