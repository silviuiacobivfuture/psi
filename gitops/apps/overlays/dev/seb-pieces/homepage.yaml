                    description: "Comunicare și automatizări: Serverul de semnalizare pentru apelurile Talk — fără interfață · Talk HPB"
                    namespace: talk-hpb
                    app: talk-hpb
                    podSelector: app.kubernetes.io/name=talk-hpb
                - Editarea documentelor:
                    icon: si-collaboraonline
                    description: "Comunicare și automatizări: Deschide documentele Office din Fișiere — fără interfață · Collabora"
                    namespace: nextcloud
                    app: nextcloud
                    podSelector: app.kubernetes.io/name=collabora
                # Its API answers only with a token; a browser has nothing to open there.
                - Memoria ghidului AI:
                    icon: mdi-vector-polyline
                    description: "Comunicare și automatizări: Baza de date vectorială a site-urilor — doar prin API, cu token · Chroma"
                    namespace: chroma
                    app: chroma
                    podSelector: app=chroma
                - Jurnale și urme:
                    icon: si-opentelemetry
                    description: "Monitorizare: Colectarea jurnalelor și a urmelor (agent și colector) · OpenTelemetry"
                    namespace: observability
                    app: observability
                    podSelector: app in (otel-agent,otel-cluster)
                # A CronJob: no pod lives between runs, so no status.
                - Raportul zilnic:
                    icon: mdi-heart-pulse
                    description: "Monitorizare: Starea clusterului, trimisă zilnic în Talk"
                - Certificate:
                    icon: cert-manager.png
                    description: "Infrastructură: Certificatele TLS (Let's Encrypt) · cert-manager"
                    namespace: cert-manager
