  destination:
    server: https://kubernetes.default.svc
    namespace: reportportal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # Load-bearing: it strips the ignoreDifferences paths from the APPLIED patch,
      # not just from the diff view. Without it every sync would push a patch that
      # REMOVES the Kyverno-injected annotations, the webhook would put them back,
      # and Argo would go OutOfSync again three minutes later — forever.
      - RespectIgnoreDifferences=true
