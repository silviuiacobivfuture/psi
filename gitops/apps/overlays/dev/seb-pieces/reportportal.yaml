# GENERATED by tools/estate-pieces.mjs from SEB's pieces; re-render, never edit.
# ReportPortal — the engineer-facing half of test visibility: permanent per-test
# history, trends, flakiness, and ML clustering of recurring failures. Phase 3 of
# infrastructure/hetzner/TEST-VISIBILITY-PLAN.md.
#
# IT DOES NOT REPLACE `test-reports` (phase 2). That service answers the BUSINESS
# question — "which business rules hold, and since when did that change" — in
# Romanian prose, and no generic test tool can, because none of them knows what a
# business rule is here. This answers the ENGINEER question. Both read the same CI
# run; they are layers, not alternatives.
#
# SPLIT, mirroring plane / plane-platform and nextcloud / nextcloud-platform:
#   - THIS app = the upstream Helm chart (api, uat, ui, index, jobs, analyzer, the
#     migrations Job, the pre-upgrade hook) + the OpenSearch subchart.
#   - `reportportal-platform` (git, wave 1) = the CNPG Postgres Cluster, our
#     RabbitMQ, every ExternalSecret, the two public Ingresses, the namespace quota.
#
# ============================ THE BITNAMI AUDIT ===============================
# The chart has four optional subcharts. EXACTLY ONE of them is a Bitnami chart —
# `minio`, pinned in the chart's own values to `bitnamilegacy/minio`, i.e. the
# DEPRECATED registry this platform has already been burned by twice (Redis and
# RabbitMQ; see the nextcloud and plane manifests). Disabling it removes the only
# exposure. VERIFIED by rendering: with the values below, `helm template` emits
# these images and no others —
#   opensearchproject/opensearch:3.8.0      rancher/kubectl:v1.36.2
#   reportportal/k8s-wait-for:2.1.5         reportportal/migrations:5.15.4
#   reportportal/service-api:5.15.4         reportportal/service-authorization:5.15.1
#   reportportal/service-auto-analyzer:5.15.5  reportportal/service-index:5.15.1
#   reportportal/service-jobs:5.15.2        reportportal/service-ui:5.15.5
# — no `bitnami/*`, no `bitnamilegacy/*`, and every tag pinned (disallow-latest-tag
# is ENFORCE). The other two subcharts are CloudPirates charts pulling the official
# docker-library `postgres` and `rabbitmq` images; both are disabled anyway.
# If a future chart version reintroduces a bitnami image, this list is the diff to
# check it against.
# ==============================================================================
#
# ======================== SSO — READ BEFORE CHANGING ==========================
# ReportPortal has NO OIDC. Checked twice, both ways:
#   * The CHART exposes no auth-provider values at all — the only auth key in
#     values.yaml is `uat.samlSessionLiveTime`. There is nothing to configure.
#   * The DOCS list Active Directory, GitHub, LDAP and SAML 2.0 as the supported
#     providers (reportportal.io/docs/plugins/authorization), and SAML is configured
#     through `Administration -> Plugins -> SAML -> Add integration` — i.e. it is a
#     ROW IN REPORTPORTAL'S OWN POSTGRES, not a file and not an env var.
# So federating to Authentik is not expressible as a Helm value, and OIDC is not
# expressible at all. Identity is therefore enforced ONE LAYER OUT, exactly as it is
# for Plane: the browser Ingress carries the Authentik forward-auth middleware, and
# ReportPortal's own account model is the second gate.
#
# IF SAML SSO IS EVER WANTED: the as-code path is an idempotent reconcile CronJob
# against the uat API — the same pattern and rationale as
# gitops/platform/secrets/harbor-oidc-reconcile.yaml and nextcloud's occ reconcile.
# Add an Authentik SAML provider to blueprints-providers.yaml, seed the metadata URL
# + certificate at secret/platform/authentik/reportportal-saml, and only THEN
# consider dropping the middleware from the UI Ingress. Do not drop it first.
# ==============================================================================
#
# KYVERNO: the reportportal namespace is excluded from the `disallow-privilege-
# escalation` rule of `disallow-privileged` — and from that rule ONLY — because the
# chart renders no container-level securityContext anywhere and exposes no seam for
# one. It exposes a POD-level seam, which the values below use on every workload
# (runAsNonRoot + a VERIFIED numeric runAsUser + seccompProfile). The two
# annotations the chart also cannot carry are injected by the narrow mutate policy
# `gitops/platform/kyverno/mutate-reportportal-annotations.yaml`, which is why
# `require-reloader-annotation`, `require-alert-annotation` and
# `require-run-as-non-root` all stay ENFORCE here. Rationale at each site.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reportportal
  namespace: argocd
  annotations:
    # After reportportal-platform (wave 1): the chart's pods block on the CNPG
    # Cluster's -rw Service, RabbitMQ and the ESO-synced Secrets existing.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  ignoreDifferences:
    # The two annotations Kyverno injects (see the header). They exist on the LIVE
    # object and in the ClusterPolicy, never in the chart's render — without this
    # the app is permanently OutOfSync and self-heal fights the webhook every three
    # minutes. RespectIgnoreDifferences below is what makes it stick: it strips
    # these paths from the APPLIED patch, not merely from the diff view.
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - '.metadata.annotations."reloader.stakater.com/auto"'
        - '.metadata.annotations."alerts.psizone.ro/owner"'
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - '.metadata.annotations."reloader.stakater.com/auto"'
        - '.metadata.annotations."alerts.psizone.ro/owner"'
        # API-server-defaulted fields on the analyzer + OpenSearch StatefulSets.
        # Same list, same reasons as plane-platform.yaml — see that file. Kept even
        # though these come from a chart rather than a hand-written manifest:
        # plane's cost real debugging time to find, and carrying the list is free.
        - '.spec.volumeClaimTemplates[].status'
        - '.spec.volumeClaimTemplates[].spec.volumeMode'
        - '.spec.volumeClaimTemplates[].apiVersion'
        - '.spec.volumeClaimTemplates[].kind'
        - '.spec.podManagementPolicy'
        - '.spec.revisionHistoryLimit'
        - '.spec.persistentVolumeClaimRetentionPolicy'
  source:
    # The documented URL (reportportal.io/kubernetes) 403s behind CloudFront and Argo's
    # repo-server could not fetch the chart from it (VERIFIED on dev 2026-08-20:
    # "not a valid chart repository or cannot be reached"). The GitHub Pages URL
    # redirects here, and this host serves index.yaml with 26.8.12 present.
    repoURL: https://k8s.reportportal.io
    chart: reportportal
    # Pinned. appVersion 26.0.5. NOTE: this repo is served through CloudFront and was
    # NOT reachable from the workstation while this was written (HTTP 403 "Request
    # blocked") — the chart was verified from its GitHub source at tag
    # `reportportal-26.8.12` instead. Argo's repo-server reaches it from the cluster;
    # if the first sync fails on the repo, that is the thing to check first.
    targetRevision: 26.8.12
    helm:
      values: |
        global:
          # POD-level securityContext, applied to every chart workload via the
          # chart's `reportportal.securityContext` helper. Per-service runAsUser
          # values below; this is the part that is common.
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          # Adds helm.sh/hook-weight to the ServiceAccount/Role/RoleBinding so Argo
          # creates them (as PreSync hooks) BEFORE the workloads that bind to them.
          # This flag exists in the chart specifically for Argo CD deployments.
          argocd:
            enabled: true
          # OFF. Seven PodDisruptionBudgets with maxUnavailable=1 in front of seven
          # SINGLE-replica workloads express nothing — the one pod may always be
          # evicted — while adding seven objects to reason about during a drain.
          pdb:
            create: false

        # --- Bundled infrastructure: THREE OFF, ONE ON -------------------------
        # postgres → CNPG (WAL archive + PITR + a 6-hourly logical dump; the chart's
        #            subchart is a bare StatefulSet with no backup at all)
        # rabbitmq → ours (gitops/services/reportportal/base/rabbitmq.yaml: pinned
        #            4.1 LTS -management, probes, limits, the Erlang-cookie fix and
        #            the password/vhost reconcile plane paid for)
        # minio    → Hetzner Object Storage (and the subchart is `bitnamilegacy/minio`
        #            — see THE BITNAMI AUDIT above)
        # opensearch → ON. The one genuinely new component, and the one this whole
        #            phase is for: it is what makes failure clustering possible.
        postgresql:
          install: false
        rabbitmq:
          install: false
        minio:
          install: false

        opensearch:
          image:
            # repository: set by `parameters` below (an estate value).
            tag: "3.8.0" # no digest: the subchart parses this as a version
          install: true
          # Forces replicas to 1 AND sets discovery.type=single-node, which also
          # SKIPS the bootstrap checks — including the vm.max_map_count check that
          # would otherwise need a node sysctl. (Moot in any case: the nodes run
          # Ubuntu 24.04, whose default vm.max_map_count is far above OpenSearch's
          # 262144 requirement. VERIFIED: `kubectl get nodes -o wide` reports
          # Ubuntu 24.04.4 LTS on both.)
          singleNode: true
          replicas: 1
          persistence:
            enabled: true
            # OFF — this is the `fsgroup-volume` initContainer, which runs
            # `chown -R` as runAsUser: 0 from a `busybox:latest` image. It would be
            # rejected twice over (require-run-as-non-root AND disallow-latest-tag,
            # both ENFORCE) and it is not needed: podSecurityContext.fsGroup below
            # already makes the volume group-writable for uid 1000.
            enableInitChown: false
            # local-path, DELIBERATELY, and this is the one storage decision worth
            # arguing about. The OpenSearch index is DERIVED STATE: ReportPortal can
            # regenerate it from Postgres (Administration -> Project -> Analyzer ->
            # Generate Index). Losing the node therefore costs a re-index, not data,
            # which is a very different loss from the Postgres volume — so it does
            # not justify a paid Hetzner block volume (EUR 0.57/mo minimum) and can
            # live on the node's existing disk at EUR 0/mo.
            # HONESTY: the re-index is a DOCUMENTED ReportPortal admin action; it has
            # not been exercised on this platform. If it turns out not to work, the
            # fix is one line here (storageClass: hcloud-volumes) plus the cost.
            storageClass: local-path
            size: 10Gi
          # Both OFF: `sysctl` needs an allowed unsafe sysctl on the kubelet and
          # `sysctlInit` runs a PRIVILEGED init container, which disallow-privileged
          # rejects. Neither is needed — see singleNode above.
          sysctl:
            enabled: false
          sysctlInit:
            enabled: false
          rbac:
            create: false
            automountServiceAccountToken: false
          extraEnvs:
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            # The security plugin is OFF. OpenSearch is reachable ONLY in-cluster
            # (no Ingress, no NodePort) and holds derived test-log data. Turning it
            # on would mean a demo-certificate PKI to manage for one client.
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
          # Heap fixed at 1g, the JVM rule of thumb of about half the memory, and
          # leaving the rest for Lucene's off-heap file cache.
          opensearchJavaOpts: "-Xms1g -Xmx1g"
          # This subchart DOES have a workload-annotation seam (it lands on the
          # StatefulSet's own metadata), so unlike the ReportPortal workloads it
          # carries the alert owner from values and is NOT touched by the Kyverno
          # mutate policy. It injects no Secret as env, so it needs no Reloader
          # annotation either.
          openSearchAnnotations:
            alerts.psizone.ro/owner: ops@psizone.ro
          podSecurityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          # A REAL container-level seam — which the ReportPortal chart lacks — so
          # OpenSearch satisfies disallow-privilege-escalation on its own and does
          # not rely on the namespace exclusion.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          initResources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
          # The fixed heap keeps this flat: 1512 Mi working set over 56 h, and the file
          # cache above that is reclaimable (RUNBOOK 2026-11-05).
          resources:
            requests: { cpu: 250m, memory: 1792Mi }
            limits: { cpu: "1", memory: 3Gi }

        # --- Datastores: hosts as VALUES, passwords as SECRET REFS -------------
        # Unlike plane-ce, this chart reads every credential through its own
        # secretKeyRef, so nothing secret appears here. The Secrets themselves are
        # gitops/services/reportportal/base/externalsecrets.yaml.
        database:
          # The CNPG operator-managed read/write Service: it always points at the
          # current primary, so a failover needs no config change.
          endpoint: reportportal-db-rw.reportportal.svc.cluster.local
          port: 5432
          user: reportportal
          dbName: reportportal
          ssl: disable
          secretName: reportportal-db-app
          passwordKeyName: password
          # HikariCP pool ceiling per service. 40 against the cluster's
          # max_connections of 200 leaves room for jobs, uat, the analyzer, the
          # migrations Job and the dump CronJob.
          connections: "40"

        msgbroker:
          endpoint: reportportal-rabbitmq.reportportal.svc.cluster.local
          port: 5672
          # The HTTP MANAGEMENT API, which api/jobs/analyzer use to enumerate and
          # manage the reporting queues. This is why our broker runs the
          # `-management` image variant and publishes 15672.
          apiport: 15672
          user: reportportal
          apiuser: reportportal
          # A SEPARATE vhost for the analyzer; reporting uses the default `/`.
          # RABBITMQ_DEFAULT_VHOST can only create one, so this one is created by
          # the reconcile block in our StatefulSet.
          vhost: analyzer
          ssl: false
          # ⚠️ The KEY NAME inside this Secret is HARD-CODED to "rabbitmq-password"
          # in four chart templates; there is no passwordKeyName here. The
          # ExternalSecret emits that exact key alongside the RABBITMQ_DEFAULT_*
          # pair, from ONE OpenBao property.
          secretName: reportportal-rabbitmq

        searchengine:
          # Left at the chart default (opensearch-cluster-master in this namespace).
          ssl: false
          port: 9200

        # --- Object storage: Hetzner, not MinIO --------------------------------
        # ⚠️ `type: minio` DOES NOT MEAN "deploy MinIO" — `minio.install: false`
        # above is what controls that, and they are independent. In this chart
        # `type` selects the CLIENT MODE, and `minio` is the only mode that emits
        # DATASTORE_ENDPOINT: verified in templates/_helpers.tpl, where
        # `reportportal.storageEndpoint` returns a value ONLY for the minio branch,
        # and in api-deployment.yaml, where DATASTORE_ENDPOINT is rendered `{{- if
        # eq $storageType "minio" }}`. Choosing `type: s3` would emit NO endpoint at
        # all and the client would talk to AWS. So "minio" here means
        # "S3-compatible, at the endpoint I give you", which is exactly Hetzner
        # Object Storage (Ceph RGW).
        #
        # ⚠️ HOW `minio` SIGNS DEPENDS ON THE SERVICE, and Hetzner refuses one of the
        # two. MEASURED 2026-11-04 with each image's own jclouds, in probe pods:
        #   service-api 5.15.4 (commons-dao 5.15.6): the minio bean sets path-style +
        #     SigV4 + region. Works; nothing to change.
        #   service-authorization 5.15.1, service-jobs 5.15.2: the minio bean sets
        #     NOTHING, so jclouds' default signer sends `Authorization: AWS …`
        #     (SigV2), which Hetzner answers 403 SignatureDoesNotMatch. Path-style
        #     alone and dropping `:443` both stay 403; SigV4 alone is 200.
        # In those two services the only bean that signs SigV4 is `seaweedfs`
        # (path-style + SigV4 + DATASTORE_REGION), so `uat` and `servicejobs` below
        # select it. The name is upstream's and says nothing about the backend.
        # It cannot be set here: `storage.type` is validated by the chart against
        # minio/s3/filesystem, and it is the same value for every service. It cannot
        # be an env either: the chart renders DATASTORE_TYPE after extraEnvs, and the
        # later duplicate wins. SPRING_APPLICATION_JSON outranks that env in Spring's
        # property order, so the DATASTORE_TYPE=minio still visible in these two pods
        # is NOT what they run. doctor.sh checks the override is present, because a
        # chart or image bump is what would make it wrong.
        storage:
          type: minio
          endpoint: fsn1.your-objectstorage.com
          port: "443"
          ssl: true
          region: fsn1
          secretName: reportportal-storage
          accesskeyName: access-key
          secretkeyName: secret-key
          bucket:
            # SINGLE, mandatory here. `multi` makes ReportPortal CREATE A NEW BUCKET
            # PER PROJECT, which is impossible against a Tofu-managed bucket and
            # would put unmanaged resources in the Hetzner project. The chart's own
            # values recommend single for production.
            type: single
            # Tofu: infrastructure/hetzner/environments/dev/main.tf →
            # module.reportportal_storage.
            # bucketDefaultName: set by `parameters` below (an estate value).

        # --- Ingress: OURS, not the chart's ------------------------------------
        # Both of the chart's routing mechanisms are disabled. Its Ingress template
        # renders an object with no annotations (no cert-manager, no Traefik
        # entrypoint, no forward-auth) and puts all four paths on ONE object, which
        # cannot express the gated/ungated split that keeps agents able to POST.
        # gitops/services/reportportal/base/ingress.yaml replaces both.
        ingress:
          enable: false
        gatewayAPI:
          enable: false

        # The chart can create its own namespace ResourceQuota. OFF: ours lives in
        # git next to the LimitRange it depends on, sized from the actual render.
        resourceQuota:
          enabled: false

        # Pinned. The chart's default for this image is `latest`, which
        # disallow-latest-tag (ENFORCE) rejects — and it is not a corner case: this
        # image is the `migrations-waiting-init` initContainer on api, uat, jobs and
        # analyzer, so the default blocks four of the seven workloads at admission.
        # 2.1.5 is the tag Docker Hub shows with the same push timestamp as `latest`.
        kubectl:
          image:
            # repository: set by `parameters` below (an estate value).
            tag: "v1.36.2@sha256:4cec4ed6f94a448b9461f5e7e7b7fec44ca1807b23b7f36b216dd6c5487893b1"

        k8sWaitFor:
          image:
            # repository: set by `parameters` below (an estate value).
            tag: "2.1.5@sha256:638f025c562d74107c9006c798e7906bf9de22b017fc5147b12d77cf1ed0c73f"

        hooks:
          enabled: true
          # The pre-upgrade cleanup Job deletes the (immutable) migrations Job so the
          # next sync can recreate it and re-run the migrations. Argo maps
          # `helm.sh/hook: pre-upgrade` to a PreSync hook, so this is what makes a
          # chart bump migrate the database without a manual step. Its pod
          # securityContext comes from the Kyverno mutate policy — see the header.
          preUpgrade:
            enabled: true
          # OFF. The readiness-test Pod is a `helm.sh/hook: test` resource, which
          # Argo never applies, so it is inert — but it is the only thing left in the
          # render pulling `curlimages/curl:latest`, and a manifest that carries an
          # unpinned image is a trap for whoever enables hooks next.
          test:
            enabled: false

        # --- Per-service sizing, securityContext and fail-loud asserts ----------
        # runAsUser is VERIFIED PER IMAGE, not guessed — a wrong uid here is not a
        # policy failure, it is a kubelet CreateContainerConfigError. Read from each
        # image's config on Docker Hub:
        #   service-api / service-authorization / service-jobs  USER=<none> (root)
        #       -> an explicit uid is REQUIRED: with runAsNonRoot and no USER the
        #          kubelet refuses to start the container. 1000 is arbitrary and
        #          safe: these are amazoncorretto images running a world-readable
        #          JAR from /usr/app on ports 8585/9999/8686 (all unprivileged), and
        #          the JVM writes only to /tmp.
        #          UNVERIFIED until first boot, stated plainly.
        #   service-ui       USER=<none>, but the base is nginxinc/nginx-unprivileged
        #       -> 101, the uid that base image is built around (it listens on 8080
        #          and owns /var/cache/nginx as 101).
        #   service-index    USER=1000                    -> matched.
        #   service-auto-analyzer USER=65532               -> matched.
        #   migrations       USER=nonroot                  -> 65532, VERIFIED by
        #          extracting /etc/passwd from the image layer:
        #          `nonroot:x:65532:65532:nonroot:/home/nonroot:/bin/sh`. The
        #          numeric form is REQUIRED: with a non-numeric image USER the
        #          kubelet cannot verify non-root and refuses to start.
        serviceapi:
          image:
            # repository: set by `parameters` below (an estate value).
            tag: "5.15.4@sha256:3977b0af5b997086d7df15f236950d916fb869dcc13c7108a9e2a8454944e551"
          # REQUIRED, not optional. The api image's logback config declares a
          # FILE_AUDIT appender writing /var/log/reportportal/audit.log
          # UNCONDITIONALLY, but the chart only mounts a writable volume there when
          # this flag is on. Left at its default `false`, the container dies at
          # startup with
          #   FileAppender[FILE_AUDIT] - Failed to create parent directories for
          #   [/var/log/reportportal/audit.log]
          # and CrashLoopBackOffs forever (VERIFIED on dev 2026-08-20). Enabling it
          # mounts an emptyDir at /var/log, which also keeps the container's
          # readOnlyRootFilesystem intact. Chart's own warning: this writes to node
          # storage — ship or cap it if the volume ever grows.
          auditLogs:
            enable: true
            loglevel: info
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests: { cpu: 300m, memory: 1Gi }
            limits: { cpu: "1", memory: 2Gi }
          # FAIL-LOUD (infrastructure/hetzner/CLAUDE.md, "New apps: secret schema is
          # MANDATORY"). The ExternalSecrets already make an ABSENT key a visible
          # SecretSyncedError; this catches the present-but-EMPTY case, which would
          # otherwise let the api start and fail authentication in a JDBC trace.
          # NOTE THE ORDER: the chart puts its own `migrations-waiting-init` FIRST
          # and appends these after it, so on a blank-secret cluster the migrations
          # Job is what fails first and this assert never runs. That is acceptable —
          # the failure is still NAMED, one object over — and it is not fixable from
          # values; the chart hard-codes the position.
          extraInitContainers:
            - name: assert-secrets
              # image: set by `parameters` below (an estate value).
              command:
                - sh
                - -c
                # `${VAR:-}` passes through kubelet's $(VAR) expansion untouched —
                # an `eval` loop over key names would assert on the NAME and pass
                # vacuously.
                - |
                  [ -n "${DB_PASSWORD:-}" ] || { echo "MISSING REQUIRED SECRET: reportportal-db-app/password" >&2; exit 1; }
                  [ -n "${AMQP_PASSWORD:-}" ] || { echo "MISSING REQUIRED SECRET: reportportal-rabbitmq/rabbitmq-password" >&2; exit 1; }
                  [ -n "${S3_ACCESS_KEY:-}" ] || { echo "MISSING REQUIRED SECRET: reportportal-storage/access-key" >&2; exit 1; }
                  [ -n "${S3_SECRET_KEY:-}" ] || { echo "MISSING REQUIRED SECRET: reportportal-storage/secret-key" >&2; exit 1; }
                  echo secrets-ok
              env:
                - name: DB_PASSWORD
                  valueFrom: { secretKeyRef: { name: reportportal-db-app, key: password } }
                - name: AMQP_PASSWORD
                  valueFrom: { secretKeyRef: { name: reportportal-rabbitmq, key: rabbitmq-password } }
                - name: S3_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: reportportal-storage, key: access-key } }
                - name: S3_SECRET_KEY
                  valueFrom: { secretKeyRef: { name: reportportal-storage, key: secret-key } }
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { cpu: 100m, memory: 64Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
        uat:
          image:
            # repository: set by `parameters` below (an estate value).
            tag: "5.15.1@sha256:bb19162e5f93d9088f7206610b9351ffa5c9dcf2485959850efd0cf08ea0834b"
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          # The FIRST-LAUNCH superadmin password, from OpenBao. ReportPortal ships a
          # publicly documented default; on a host reachable from the internet —
          # which reports.<apex> is, deliberately, because agents must POST
          # to its API — leaving that default is an open door, not a rough edge.
          # ⚠️ It is applied ONLY when the superadmin row is created. Rotating the
          # OpenBao path afterwards changes NOTHING; see the ExternalSecret.
          superadminInitPasswd:
            secretName: reportportal-superadmin
            passwordKeyName: password
          # Signs SigV4 against Hetzner: see "HOW `minio` SIGNS" above. Without it this
          # pod dies at startup on the integration salt's HEAD (403).
          extraEnvs:
            - name: SPRING_APPLICATION_JSON
              value: '{"datastore":{"type":"seaweedfs"}}'
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            # 500m starts this JVM in 65 s (measured 2026-11-04) against the chart's
            # 250 s startup budget.
            limits: { cpu: 500m, memory: 1Gi }
          extraInitContainers:
            - name: assert-secrets
              # image: set by `parameters` below (an estate value).
              command:
                - sh
                - -c
                - |
                  [ -n "${SUPERADMIN_PASSWORD:-}" ] || { echo "MISSING REQUIRED SECRET: reportportal-superadmin/password — uat would fall back to ReportPortal's published default credential" >&2; exit 1; }
                  [ -n "${DB_PASSWORD:-}" ] || { echo "MISSING REQUIRED SECRET: reportportal-db-app/password" >&2; exit 1; }
                  echo secrets-ok
              env:
                - name: SUPERADMIN_PASSWORD
                  valueFrom: { secretKeyRef: { name: reportportal-superadmin, key: password } }
                - name: DB_PASSWORD
                  valueFrom: { secretKeyRef: { name: reportportal-db-app, key: password } }
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { cpu: 100m, memory: 64Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
        serviceui:
          image:
            # repository: set by `parameters` below (an estate value).
            tag: "5.15.5@sha256:ccc6323a97cbaf00a5887b093f0d659e320b2d7ff56d49a42ae47a02f6d08c52"
          securityContext:
            runAsUser: 101
