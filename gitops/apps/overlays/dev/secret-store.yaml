# Argo app for the OpenBao ClusterSecretStore (the ESO→OpenBao binding).
# Separate from the external-secrets piece (pieces/external-secrets, the operator Helm install) because the
# store is OUR raw manifest + depends on the operator's CRDs already existing.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao-store
  namespace: argocd
  # Early sync-wave (after ESO CRDs at -5, before consumers at 0): the
  # ClusterSecretStore must exist before ExternalSecrets reference it. See PLATFORM.md.
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  # git-sourced → the overlay stamps targetRevision (= env branch). See BRANCHING.md.
  labels:
    platform.recomex.eu/source: git
spec:
  project: default
  source:
    repoURL: git@github.com:silviuiacobivfuture/psi.git
    # The estate's overlay over gitops/platform/openbao: it supplies the secret-watcher's
    # CI map and repository (estate/openbao/kustomization.yaml).
    path: estate/openbao
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
