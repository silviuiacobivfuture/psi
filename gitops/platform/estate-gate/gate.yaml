# THE ESTATE GATE — who may reach which public host (L3, owner 2026-10-23:
# "ensure that all these systems except wise ... cannot be visited unless
# through the tailnet").
#
# NOT a Kubernetes resource (not in kustomization.yaml). It is the ONE switch,
# kept in two registers: this one (the platform's hosts, and everything else the
# gate needs), and apps/gate.yaml (the business applications' hosts, read after
# this one; SEB 1.16b). A host is listed in exactly one of them.
#   infrastructure/hetzner/scripts/estate-gate.py render   writes routes.yaml + connector.yaml from it
#   infrastructure/hetzner/scripts/estate-gate.py check    fails when they differ (CI + doctor)
#   infrastructure/hetzner/scripts/estate-gate.py report   the dry run: replays Traefik's access log
#                                                         against this file and lists who WOULD be refused
#
# HOW A REQUEST IS JUDGED. Traefik sees the real client address (the traefik
# Service is externalTrafficPolicy: Local and Traefik runs on the node the DNS
# points at — pieces/traefik-accesslog). For a host in `enforce`, a
# request is answered by the refusal page (estate-front, port `gate`) when the
# client is NOT in `internal` AND the path is NOT exempt. Everything else falls
# through to the application's own Ingress, untouched. Nothing about an app's
# Ingress changes; the gate is one higher-priority router per host.
#
# HOW THE TAILNET GETS IN. `tailnet_route` (the control plane's public IPv4,
# which every *.<apex> name resolves to) is advertised as a subnet route by a
# Tailscale Connector. A tailnet device that accepts routes sends its traffic for
# that one address through the cluster, so it arrives from a cluster address —
# internal — with the same names, the same certificates and no DNS change. A
# device off the tailnet arrives from its own public address — refused.
#
# MODES, per host:
#   enforce  refused from outside, except the exempt paths
#   report   nothing refused; `report` lists what enforce WOULD refuse — every
#            host starts here, and moves to enforce only after a clean report
#   "off"    never gated (quoted: bare off is a YAML boolean), with the reason in `why` (Wise, and machine-only hosts)
#
# `name` is the label left of the apex ("@" is the apex itself); the apex comes
# from gitops/components/whitelabel — never typed here. Exempt entries are
# `prefix:` (PathPrefix) or `path:` (exact), each with the caller and the reason.
# STATUS 2026-10-23: DESIGN ONLY, SWITCHED OFF. Nothing here is deployed: there
# is no kustomization.yaml and no Argo Application for this directory, Traefik is
# still externalTrafficPolicy: Cluster (so it cannot tell outside from inside),
# and every host is `report`. What remains before any host can be enforced is
# listed in docs/estate/04-poarta.md.
apiVersion: estate.recomex.eu/v1
kind: EstateGate

# Sources that ARE the estate. Every request from one of these is internal.
internal:
  - cidr: 10.42.0.0/16
    what: pods — the Connector's tailnet traffic, and in-cluster callers whose request stays on the node
  - cidr: 10.0.0.0/16
    what: the Hetzner private network the nodes share
  - cidr: 100.64.0.0/10
    what: tailnet addresses, should a proxy ever forward one unchanged
  - cidr: 65.108.81.61/32
    what: dev-k3s-cp's public IPv4 — pods and kubelet on the control plane calling a public name
  - cidr: 65.108.92.182/32
    what: dev-k3s-agent-0's public IPv4 — pods on the agent leave through it (flannel masquerade), and the node pulls images from Harbor through it

# The one address the Connector advertises. MUST equal the *.<apex> A record
# (module.dns, ingress_ipv4 = the control plane) — doctor.sh fails when not.
tailnet_route: 65.108.81.61/32

hosts:
  # --- the estate's own front door -------------------------------------------
  - name: "@"
    mode: report
    why: the hub and the internal landing (estate-front); nothing outside calls it

  # --- the platform's applications ---------------------------------------
  - name: polaris
    mode: report
  - name: id
    mode: report
    why: the sign-in hub. Its back-channel (token, jwks, userinfo) is called only by servers inside the cluster, which are internal

  # --- the platform's services ------------------------------------------------
  - name: novu-api
    mode: report
    why: Wise's NOVU_API_URL is a Fly secret whose value is not in the repository — the report shows whether Fly calls this host
  - name: novu-ws
    mode: report

  # --- identity ------------------------------------------------------------------
  - name: auth
    mode: report
    why: Authentik. A new person's set-password link lands here, so the tailnet invitation must reach them before that e-mail does

  # --- tools ---------------------------------------------------------------------
  - name: harbor
    mode: report
    why: the nodes pull images from their own public addresses, which are internal; a push from a workstation must come over the tailnet
  - name: headplane
    mode: report
    why: the mesh's console, which the owner asked to find on this public address. Authentik's own gate protects it (docs/headscale/00-plan.md); enforcing this too would lock a person out of the console on the day the tailnet is what they came to repair
  - name: headscale
    mode: "off"
    why: a device must reach the control plane BEFORE it is on the tailnet, and DERP is what devices behind hard NAT relay through
  - name: headscale-stun
    mode: "off"
    why: machine-only, STUN over UDP. Not served by Traefik at all; listed so the register has every name
  - name: plane
    mode: report
  - name: tests
    mode: report
  - name: pdf
    mode: report
    why: PDFCraft, the staff's browser PDF toolkit; already behind the Authentik gate, and the report shows whether anyone uses it off the tailnet
  - name: reports
    mode: report
  - name: reference
    mode: report
  - name: notify
    mode: report
    exempt:
      - prefix: /notify/
        who: "Axiom"
        why: "the alert webhook into Talk is this host's only purpose"
  - name: cloud
    mode: report
    why: Nextcloud share links and Talk guests are people outside the tailnet — enforcing ends both
  - name: office
    mode: report
    why: Collabora, opened from Nextcloud by the same guests
  - name: signaling
    mode: report
    why: Talk's signalling server, used by the same guests
