# ClusterSecretStore — the single OpenBao backend all services pull secrets from.
# ESO authenticates to OpenBao via k8s auth: it presents its own ServiceAccount
# token (external-secrets/external-secrets) to OpenBao's `kubernetes` auth mount,
# which is bound (role `eso`) to the `eso-read` policy (read on secret/data/*).
# Cluster-scoped → any namespace's ExternalSecret can reference it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
