# OpenBao durable backup — 6-hourly snapshot of the secret store to Hetzner Object
# Storage. Cadence: every 6h at minute 30 (00:30, 06:30, 12:30, 18:30). Retention:
# keep the 20 most recent snapshots (≈5 days at 4/day), prune older.
#
# WHY tar-the-data-dir, NOT `bao operator raft snapshot save`:
# `raft snapshot save` is a RAFT-storage-only API. This OpenBao runs `standalone` +
# `file` storage (see gitops/apps/overlays/dev/openbao.yaml: Storage Type=file, HA
# disabled) — the raft snapshot endpoint returns 400 on a file backend. Switching the
# chart to `ha` raft storage would be a DESTRUCTIVE in-place backend migration of an
# already-initialized OpenBao that holds every platform secret (file<->raft are not
# interchangeable; it would need export/import or re-init — i.e. exactly the secret
# loss we are fixing). So for this single-node dev OpenBao we snapshot the cleanest
# safe way: tar the encrypted /openbao/data directory and upload to S3. The data is
# encrypted at rest by OpenBao's barrier (sealed) — the tarball is only restorable by
# someone holding the unseal key (persisted in infrastructure/hetzner/.env). When prod
# moves to HA raft + KMS auto-unseal, swap this for `raft snapshot save` (atomic,
# consistent) — tracked in RUNBOOK.
#
# Storage layout: bucket rmx-tfstate-dev (the platform-layer bucket, same as velero +
# tofu state), prefix openbao-snapshots/ — sibling to velero/ under the same bucket.
#
# Deployment: this is NOT applied by hand. It is Argo-synced — the `openbao-store`
# Application (gitops/apps/overlays/dev/secret-store.yaml, path gitops/platform/
# openbao) reconciles this directory's kustomization, which lists this file. So the
# CronJob (and its snapshot-s3 ExternalSecret) deploys automatically on commit.
#
# HOW it mounts the live data: the CronJob mounts the SAME data-openbao-0 PVC
# read-only. It is RWO on local-path (node-local) — the PV's nodeAffinity pins both
# openbao-0 and this job to the same node, and RWO permits multiple pods per node, so
# the job co-schedules with openbao-0 automatically. A live-FS tar of a file backend
# is crash-consistent (OpenBao's bolt/file writes are append-then-rename); acceptable
# for a daily safety net. Restore procedure: infrastructure/hetzner/RUNBOOK.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-snapshot
  namespace: openbao
spec:
  schedule: "30 */6 * * *" # every 6h at :30 — offset 30m from velero's "0 */6" so both don't hit the bucket at the same instant
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: openbao-snapshot
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 100 # openbao group can read the data dir (mode g+rx on /openbao/data)
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: data-openbao-0
                readOnly: true
            - name: work
              emptyDir: {}
          # amazon/aws-cli (main) ships NO tar and runs readOnlyRootFilesystem, so it
          # cannot create the archive. busybox (which has tar+gzip) archives the data
          # dir into the shared 'work' emptyDir; the main container only uploads it.
          initContainers:
            - name: archive
              image: busybox:1.37
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 250m, memory: 256Mi }
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  echo "Tarring /openbao/data → /work/snapshot.tar.gz"
                  tar -czf /work/snapshot.tar.gz -C /openbao data
                  ls -l /work/snapshot.tar.gz
              volumeMounts:
                - name: data
                  mountPath: /openbao/data
                  readOnly: true
                - name: work
                  mountPath: /work
          containers:
            - name: snapshot
              # amazon/aws-cli bundles the aws CLI; its Amazon Linux base ships tar+gzip.
              image: amazon/aws-cli:2.17.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 250m, memory: 256Mi }
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: openbao-snapshot-s3, key: AWS_ACCESS_KEY_ID }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: openbao-snapshot-s3, key: AWS_SECRET_ACCESS_KEY }
                # Hetzner Object Storage S3 endpoint/region — same as velero + tofu backend.
                - name: AWS_REGION
                  value: fsn1
                - name: AWS_ENDPOINT_URL
                  value: https://fsn1.your-objectstorage.com
                # Hetzner S3 needs PATH-STYLE addressing (bucket in the path, not the
                # host). Without this the aws CLI uses virtual-hosted style
                # (bucket.fsn1.your-objectstorage.com) and Hetzner answers 301
                # redirects — exactly why velero sets s3ForcePathStyle. Force it here.
                - name: AWS_S3_ADDRESSING_STYLE
                  value: path
                - name: BUCKET
                  value: rmx-tfstate-dev
                - name: PREFIX
                  value: openbao-snapshots
              volumeMounts:
                - name: data
                  mountPath: /openbao/data
                  readOnly: true
                - name: work
                  mountPath: /work
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  # Archive was produced by the 'archive' initContainer (busybox tar)
                  # — amazon/aws-cli has no tar + read-only root FS. We only upload it.
                  OUT="/work/snapshot.tar.gz"
                  test -s "${OUT}" || { echo "FATAL: /work/snapshot.tar.gz missing/empty (archive initContainer failed)" >&2; exit 1; }
                  # Hetzner S3 rejects the AWS SDK's default checksum (same flag velero
                  # uses); disable request checksums for the upload.
                  export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
                  export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
                  KEY="${PREFIX}/openbao-${TS}.tar.gz"
                  echo "Uploading → s3://${BUCKET}/${KEY}"
                  aws s3 cp "${OUT}" "s3://${BUCKET}/${KEY}" \
                    --endpoint-url "${AWS_ENDPOINT_URL}"
                  echo "Snapshot uploaded: s3://${BUCKET}/${KEY}"
                  # Retention: keep the 20 most recent snapshots, prune older
                  # (≈5 days at the 6-hourly cadence — mirrors velero's ~20-backup cap).
                  KEEP=20
                  aws s3 ls "s3://${BUCKET}/${PREFIX}/" --endpoint-url "${AWS_ENDPOINT_URL}" \
                    | awk '{print $4}' | grep -E '^openbao-.*\.tar\.gz$' | sort -r \
                    | tail -n +$((KEEP + 1)) | while read -r old; do
                        echo "Pruning old snapshot: ${old}"
                        aws s3 rm "s3://${BUCKET}/${PREFIX}/${old}" --endpoint-url "${AWS_ENDPOINT_URL}"
                      done
                  echo "Done."
