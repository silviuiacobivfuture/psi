# secret-watcher — "a secret changed in OpenBao: WHO uses it, and what must happen?"
#
# THE GAP THIS CLOSES. Rotation used to be automatic only for one of the three
# planes a secret can land on:
#   * k8s pod env/volume  -> ESO polls (30s app / 1h platform) and rewrites the k8s
#     Secret; Stakater Reloader restarts any workload annotated
#     `reloader.stakater.com/auto`. ALREADY AUTOMATIC.
#   * image build-args (`secret/apps/<app>/build`) -> baked into the image at
#     `docker build --build-arg`. INERT until CI rebuilds.
#   * Convex runtime env (`secret/apps/<app>/convex-env`) -> applied by `convex env
#     set` after `convex deploy`. INERT until CI runs.
# A `workflow_dispatch` fired ONLY when seed-secrets.sh performed the write
# (`dispatch_ci()`). A direct `bao kv put`/`kv patch` or an edit in the OpenBao UI
# changed the value and NOTHING happened — verified 2026-08-18: direct patches to
# both CI-consumed paths triggered zero Actions runs.
#
# WHY POLLING. OpenBao has no event system: Vault's `sys/events/subscribe` was never
# carried into the fork (upstream issue #553 closed unimplemented; a code search of
# v2.5.4 finds 0 hits for `events/subscribe` and 0 for `EventBus`). The detection
# primitive is therefore `secret/metadata/<path>`.`current_version`, which increments
# on EVERY write and is write-source-agnostic — a UI edit is caught exactly like a
# script run — and exposes NO secret material.
#
# WHAT IT DOES each tick (*/5):
#   1. Recursively LISTs secret/metadata/{apps,platform} — the inventory is
#      DISCOVERED, never hardcoded, so a new secret is picked up automatically.
#   2. Reads each leaf's current_version and diffs it against the state secret.
#   3. For each CHANGED path, decides the action BY DISCOVERY:
#      a. referenced by an ExternalSecret (.spec.data[].remoteRef.key /
#         .spec.dataFrom[].extract.key)? -> stamp `force-sync=<ts>` on it (the
#         documented pattern, RUNBOOK 2026-06-19) so ESO re-syncs NOW instead of at
#         the end of its refreshInterval, then report which workloads consume the
#         target Secret and whether they will actually restart.
#      b. in the CI map below? -> workflow_dispatch on this env's branch.
#      c. neither -> LOUD `WARN no-consumer` line naming the path. That is a real
#         finding: an undiscovered consumer (a hardcoded literal, a laptop
#         .env.local, a manual script) or a dead secret.
#   4. Writes the observed versions back with a KV v2 MERGE patch.
#
# THE ONLY HAND-MAINTAINED MAP is CI path -> workflow: nothing in the cluster
# declares that a build-arg is baked into an image. The platform ships the
# MECHANISM with an EMPTY table (ConfigMap secret-watcher-config below); the estate
# supplies its table and its repository by patching that ConfigMap from its own
# overlay. Adding a new CI-consumed secret path REQUIRES
# adding it to the estate's table in the same change — HARD RULE in
# infrastructure/hetzner/CLAUDE.md. Everything else is discovered.
#
# WHAT IT NEVER DOES: read a secret VALUE. Its OpenBao reads are metadata (versions),
# its own state path, and the GitHub PAT it dispatches with. Policy/role live in
# infrastructure/hetzner/scripts/openbao-bootstrap.sh (role `secret-watcher`); k8s
# RBAC in secret-watcher-rbac.yaml (no access to `secrets` at all).
#
# Deployment: Argo-synced by the `openbao-store` Application through the estate's
# overlay (which includes gitops/platform/openbao). NOT applied by hand.
#
# The estate's configuration. Shipped EMPTY: with no table nothing is ever
# dispatched, so no repository is needed. A table without GIT_OWNER/GIT_REPO is
# refused at the top of every tick (fail loud, never a silent no-dispatch).
#   GIT_OWNER, GIT_REPO  the repository whose workflows are dispatched
#   ci-map               one "<store-relative path> <workflow file>" per line;
#                        blank lines and lines starting with # are ignored
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-watcher-config
  namespace: openbao
data:
  GIT_OWNER: ""
  GIT_REPO: ""
  ci-map: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secret-watcher-script
  namespace: openbao
data:
  watch.sh: |
    #!/bin/sh
    # POSIX/ash. curlimages/curl ships busybox + curl and NO jq — every JSON parse
    # below is text-based and was verified byte-identical to the equivalent jq
    # query against the live cluster's 43 ExternalSecrets and 51 Deployments
    # (2026-08-18). Secrets travel to curl in header FILES (-H @file) and bodies
    # (-d @file), NEVER as argv: a literal -H "X-Vault-Token: ..." is visible to
    # `ps` inside the container.
    set -eu

    BAO_ADDR="${BAO_ADDR:-http://openbao.openbao.svc:8200}"
    BAO_ROLE="${BAO_ROLE:-secret-watcher}"
    STATE_PATH="${STATE_PATH:-platform/automation/watcher-state}"
    ROOTS="${ROOTS:-apps platform}"
    DISPATCH_CAP="${DISPATCH_CAP:-5}"
    CI_MAP_FILE="${CI_MAP_FILE:-/config/ci-map}"
    [ -r "$CI_MAP_FILE" ] || { printf 'FATAL CI map %s is not readable — is ConfigMap secret-watcher-config mounted?\n' "$CI_MAP_FILE"; exit 1; }
    if grep -qv '^[[:space:]]*\(#.*\)\{0,1\}$' "$CI_MAP_FILE"; then
      : "${GIT_OWNER:?MISSING REQUIRED CONFIG: GIT_OWNER (ConfigMap secret-watcher-config) — the CI map is not empty, so dispatches need a repository}"
      : "${GIT_REPO:?MISSING REQUIRED CONFIG: GIT_REPO (ConfigMap secret-watcher-config) — the CI map is not empty, so dispatches need a repository}"
    fi
    GITHUB_REPO="${GIT_OWNER:-}/${GIT_REPO:-}"
    ENV_BRANCH="${ENV_BRANCH:?ENV_BRANCH must be set (branch == environment, 1:1)}"

    K8S="https://kubernetes.default.svc"
    CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    SA_TOKEN=/var/run/secrets/kubernetes.io/serviceaccount/token
    W=/work
    umask 077
    # $W/resp transiently holds the GitHub PAT read response; emptyDir is disk-backed
    # and outlives the process until pod GC, so it is wiped with the header files.
    trap 'rm -f "$W/hdr.bao" "$W/hdr.k8s" "$W/hdr.gh" "$W/hdr.notify" "$W/login.json" "$W/resp"' EXIT

    # ---- notification sink: #security ----------------------------------------
    # A tick that ends with problems (or an un-consumed secret) is a SECURITY
    # finding, not a log line: `WARN no-consumer <path>` means a secret changed and
    # nothing known reads it — either an undiscovered consumer (a hardcoded literal,
    # a laptop .env.local) or a dead secret nobody revoked. Both are things a human
    # must look at, and neither has a symptom of its own.
    #
    # It posts to the IN-CLUSTER translator, never the public Ingress: these are the
    # messages that fire WHEN THINGS ARE BROKEN, so the path must not depend on
    # Traefik, external DNS or the public certificate (same reasoning as the header
    # of pieces/nextcloud-platform/base/talk-webhook.yaml).
    #
    # A CLEAN tick posts NOTHING. This channel has to stay worth reading — a
    # heartbeat here would train everyone to mute it, and the daily green heartbeat
    # already exists in #infra (gitops/platform/health-digest).
    #
    # FAIL-LOUD, no initContainer: `:?` exits non-zero with the key NAME before any
    # work is done, which is exactly what the "no silent deaths" rule
    # (infrastructure/hetzner/CLAUDE.md) asks a validation initContainer to achieve.
    # We own this entrypoint, so the assert belongs in it rather than in a second
    # container scheduled every five minutes. Empty counts as missing: ESO can sync a
    # present-but-EMPTY field, and an empty token 401s forever in silence.
    NOTIFY_URL="${NOTIFY_URL:-http://talk-webhook.nextcloud.svc}"
    NOTIFY_CHANNEL="${NOTIFY_CHANNEL:-security}"
    : "${NOTIFY_TOKEN:?MISSING REQUIRED SECRET: token (Secret talk-webhook-token, key token, ns openbao) — refusing to run a watcher that cannot report what it finds}"
    # Straight into a header FILE, then dropped from the environment: curl reads it
    # with -H @file so it never reaches argv, where `ps` inside the container sees it.
    printf 'X-Notify-Token: %s\n' "$NOTIFY_TOKEN" > "$W/hdr.notify"
    unset NOTIFY_TOKEN

    STAMP="$(date -u +%s)"
    CHANGED=0; ACTED=0; NOCONSUMER=0; DISPATCHES=0; PROBLEMS=0

    log() { printf '%s %s\n' "$(date -u +%H:%M:%SZ)" "$*"; }

    # alert <text> — queue ONE short line for the end-of-tick #security digest.
    # Deliberately separate from log(): the log keeps its full diagnostic prose, the
    # notification gets a scannable one-liner. A FILE, not a shell variable, because
    # some call sites run inside `| while` subshells where an assignment is discarded
    # at the pipe boundary — a file append survives.
    alert() { printf '%s\n' "$*" >> "$W/alerts"; }

    # http <curl args...> -> prints the HTTP status code; body lands in $W/resp.
    # curl's own -w prints 000 on a transport failure, so the code is always set.
    http() { curl -sS --max-time 20 -o "$W/resp" -w '%{http_code}' "$@" || true; }

    # ---- the ONE hand-maintained mapping: CI-consumed path -> workflow ----------
    # Values on these paths are baked into an image (--build-arg) or pushed to the
    # Convex plane (`convex env set`) BY A WORKFLOW RUN — nothing in the cluster
    # declares that, so it cannot be discovered. The table is the estate's
    # ($CI_MAP_FILE, from ConfigMap secret-watcher-config). This map is the SINGLE
    # dispatch point — seed-secrets.sh no longer dispatches (removed 2026-08-18) to
    # avoid double builds, so a path missing there is a path that never rebuilds.
    # Exact match on the first column; first match wins.
    ci_workflow() {
      while read -r cp cw _rest; do
        case "$cp" in ''|'#'*) continue ;; esac
        if [ "$cp" = "$1" ]; then echo "$cw"; return 0; fi
      done < "$CI_MAP_FILE"
      echo ""
    }

    # ---- auth -----------------------------------------------------------------
    # OpenBao k8s auth: the pod's own projected SA token is exchanged for a short
    # TTL client token. The JWT goes in a request-body FILE, never argv.
    { printf '{"role":"%s","jwt":"' "$BAO_ROLE"; tr -d '\n' < "$SA_TOKEN"; printf '"}'; } > "$W/login.json"
    CODE="$(http -X POST -d @"$W/login.json" "$BAO_ADDR/v1/auth/kubernetes/login")"
    [ "$CODE" = 200 ] || { log "FATAL OpenBao login failed (HTTP $CODE, role=$BAO_ROLE) — is the role bound to this ServiceAccount? see openbao-bootstrap.sh"; exit 1; }
    { printf 'X-Vault-Token: '; grep -o '"client_token":"[^"]*"' "$W/resp" | head -1 | cut -d'"' -f4; } > "$W/hdr.bao"
    [ -s "$W/hdr.bao" ] || { log "FATAL no client_token in the login response"; exit 1; }
    { printf 'Authorization: Bearer '; tr -d '\n' < "$SA_TOKEN"; printf '\n'; } > "$W/hdr.k8s"

    # gh_header — lazily read the PAT (only when a CI dispatch is actually needed).
    gh_header() {
      [ -f "$W/hdr.gh" ] && return 0
      c="$(http -H @"$W/hdr.bao" "$BAO_ADDR/v1/secret/data/platform/github/token")"
      [ "$c" = 200 ] || { log "    WARN cannot read platform/github/token (HTTP $c)"; return 1; }
      { printf 'Authorization: Bearer '; grep -o '"token":"[^"]*"' "$W/resp" | head -1 | cut -d'"' -f4; } > "$W/hdr.gh"
      [ -s "$W/hdr.gh" ] && return 0
      rm -f "$W/hdr.gh"; log "    WARN platform/github/token carries no 'token' field"; return 1
    }

    # ---- discovery: OpenBao path -> ExternalSecret -> k8s Secret ---------------
    # k8s serializes list items so each one starts with either
    #   {"apiVersion":"<g>/<v>","kind":"<K>"   (CRs — alphabetical map order) or
    #   {"metadata":{"name":"                  (built-ins — struct order)
    # and managedFields entries start with neither, so these two markers split items
    # EXACTLY. Escaped JSON inside annotations cannot false-match: \"key\":\" has a
    # backslash where the patterns require a quote.
    split_items() { sed -e 's/,{"apiVersion":"[^"]*","kind":"/\n&/g' -e 's/,{"metadata":{"name":"/\n&/g' "$1"; }

    es_map() {   # -> $W/esmap lines: <openbao-path> <ns> <es-name> <target-secret>
      [ -f "$W/esmap" ] && return 0
      [ -f "$W/esmap.failed" ] && return 1
      c="$(http --cacert "$CA" -H @"$W/hdr.k8s" "$K8S/apis/external-secrets.io/v1/externalsecrets")"
      [ "$c" = 200 ] || { : > "$W/esmap.failed"; log "  WARN ExternalSecret discovery failed (HTTP $c) — INCONCLUSIVE, not 'no consumer'"; return 1; }
      # `|| [ -n "$item" ]` — the apiserver body has no trailing newline; without it
      # the LAST ExternalSecret of the list is silently skipped.
      split_items "$W/resp" | grep '"kind":"ExternalSecret"' | while IFS= read -r item || [ -n "${item:-}" ]; do
        ns="$(printf '%s' "$item" | grep -o '"namespace":"[^"]*"' | head -1 | cut -d'"' -f4)"
        nm="$(printf '%s' "$item" | grep -o '"name":"[^"]*"' | head -1 | cut -d'"' -f4)"
        tg="$(printf '%s' "$item" | grep -o '"target":{[^}]*"name":"[^"]*"' | head -1 | sed 's/.*"name":"\([^"]*\)"$/\1/')"
        [ -n "$tg" ] || tg="$nm"
        printf '%s' "$item" | grep -o '"key":"[^"]*"' | cut -d'"' -f4 | sort -u \
          | while IFS= read -r k; do printf '%s %s %s %s\n' "$k" "$ns" "$nm" "$tg"; done
      done > "$W/esmap"
      return 0
    }

    wl_map() {   # -> $W/wlmap: <kind>|<ns>|<name>|<reloader>|<env secrets>|<volume secrets>
      [ -f "$W/wlmap" ] && return 0
      [ -f "$W/wlmap.failed" ] && return 1
      : > "$W/wlmap.tmp"
      for r in deployments statefulsets daemonsets; do
        c="$(http --cacert "$CA" -H @"$W/hdr.k8s" "$K8S/apis/apps/v1/$r")"
        [ "$c" = 200 ] || { : > "$W/wlmap.failed"; log "    WARN workload discovery ($r) failed (HTTP $c) — cannot report which pods restart"; rm -f "$W/wlmap.tmp"; return 1; }
        kind="$(printf '%s' "$r" | sed 's/s$//')"
        split_items "$W/resp" | grep '"name":"' | while IFS= read -r item || [ -n "${item:-}" ]; do
          nm="$(printf '%s' "$item" | grep -o '"name":"[^"]*"' | head -1 | cut -d'"' -f4)"
          [ -n "$nm" ] || continue
          ns="$(printf '%s' "$item" | grep -o '"namespace":"[^"]*"' | head -1 | cut -d'"' -f4)"
          rel=no
          printf '%s' "$item" | grep -q '"reloader.stakater.com/auto":"' && rel=yes
          envs="$(printf '%s' "$item" | grep -oE '"(secretRef|secretKeyRef)":\{[^}]*"name":"[^"]*"' | grep -o '"name":"[^"]*"$' | cut -d'"' -f4 | sort -u | tr '\n' ',')"
          vols="$(printf '%s' "$item" | grep -o '"secretName":"[^"]*"' | cut -d'"' -f4 | sort -u | tr '\n' ',')"
          printf '%s|%s|%s|%s|%s|%s\n' "$kind" "$ns" "$nm" "$rel" "${envs%,}" "${vols%,}"
        done >> "$W/wlmap.tmp"
      done
      mv "$W/wlmap.tmp" "$W/wlmap"
      return 0
    }

    # report_consumers <ns> <secret> — LOG ONLY. Says whether the rewritten Secret
    # actually reaches a running process. NOTE this annotation grep is laxer than
    # doctor.sh's (it would also match a pod-template annotation, which Reloader
    # ignores); doctor.sh and the Kyverno policy stay the enforcers — this reports.
    report_consumers() {
      wl_map || return 0
      found=0
      while IFS='|' read -r kind wns wname rel envs vols; do
        [ "$wns" = "$1" ] || continue
        case ",$envs," in *",$2,"*)
          found=1
          if [ "$rel" = yes ]; then
            log "    -> $kind $wns/$wname injects $2 as env and is Reloader-annotated: pod WILL restart"
          else
            log "    -> WARN $kind $wns/$wname injects $2 as ENV with NO reloader.stakater.com/auto annotation: the new value will NEVER reach the process (silent half-rotation)"
            alert "silent half-rotation: $kind $wns/$wname injects Secret $2 as env with no reloader.stakater.com/auto — the rotated value never reaches the process"
            PROBLEMS=$((PROBLEMS+1))
          fi ;;
        esac
        case ",$vols," in *",$2,"*)
          found=1
          log "    -> $kind $wns/$wname mounts $2 as a volume: the kubelet refreshes the file in place, no restart needed" ;;
        esac
      done < "$W/wlmap"
      [ "$found" = 1 ] || log "    -> no Deployment/StatefulSet/DaemonSet references Secret $1/$2 (consumer may be a Job/CronJob or a controller reading it through the API)"
    }

    es_force_sync() {   # <ns> <es-name>
      printf '{"metadata":{"annotations":{"force-sync":"%s"}}}\n' "$STAMP" > "$W/patch.json"
      c="$(http -X PATCH --cacert "$CA" -H @"$W/hdr.k8s" -H 'Content-Type: application/merge-patch+json' \
        -d @"$W/patch.json" "$K8S/apis/external-secrets.io/v1/namespaces/$1/externalsecrets/$2")"
      case "$c" in
        200|201) return 0 ;;
        *) log "    WARN force-sync of ExternalSecret $1/$2 failed (HTTP $c)"; return 1 ;;
      esac
    }

    ci_dispatch() {   # <workflow-file>
      wf="$1"
      if grep -qx "$wf" "$W/dispatched" 2>/dev/null; then
        log "    ci-dispatch $wf already fired this tick (dedupe: two paths, one workflow)"
        return 0
      fi
      if [ "$DISPATCHES" -ge "$DISPATCH_CAP" ]; then
        log "    WARN dispatch cap $DISPATCH_CAP reached — TRUNCATED, $wf NOT dispatched this tick. Re-run: gh workflow run $wf --ref $ENV_BRANCH"
        alert "dispatch cap $DISPATCH_CAP reached — $wf NOT dispatched. Re-run: gh workflow run $wf --ref $ENV_BRANCH"
        PROBLEMS=$((PROBLEMS+1))
        return 1
      fi
      gh_header || return 1
      printf '{"ref":"%s"}\n' "$ENV_BRANCH" > "$W/dispatch.json"
      c="$(http -X POST -H @"$W/hdr.gh" -H 'Accept: application/vnd.github+json' \
        -d @"$W/dispatch.json" "https://api.github.com/repos/$GITHUB_REPO/actions/workflows/$wf/dispatches")"
      if [ "$c" = 204 ]; then
        printf '%s\n' "$wf" >> "$W/dispatched"
        DISPATCHES=$((DISPATCHES+1))
        log "    ci-dispatch $wf ref=$ENV_BRANCH OK"
        return 0
      fi
      log "    WARN ci-dispatch $wf failed (HTTP $c) — run: gh workflow run $wf --ref $ENV_BRANCH"
      alert "ci-dispatch $wf failed (HTTP $c) — the rebuild that applies the new value did NOT start. Re-run: gh workflow run $wf --ref $ENV_BRANCH"
      return 1
    }

    record() { printf '%s %s\n' "$1" "$2" >> "$W/newstate"; }

    # ---- 1. enumerate every leaf under the roots (breadth-first LIST) ----------
    : > "$W/leaves"; : > "$W/dispatched"; : > "$W/newstate"; : > "$W/alerts"
    printf '%s\n' "$ROOTS" | tr ' ' '\n' > "$W/todo"
    LIST_OK=1
    while [ -s "$W/todo" ]; do
      mv "$W/todo" "$W/cur"; : > "$W/todo"
      while IFS= read -r d; do
        [ -n "$d" ] || continue
        c="$(http -H @"$W/hdr.bao" "$BAO_ADDR/v1/secret/metadata/$d?list=true")"
        [ "$c" = 404 ] && continue
        if [ "$c" != 200 ]; then log "WARN LIST $d failed (HTTP $c)"; LIST_OK=0; continue; fi
        # `read || [ -n "$k" ]`: curl writes the response body verbatim and OpenBao's
        # JSON carries NO trailing newline, so a plain `read` loop silently DROPS the
        # last element of every listing (caught in the mock run, 2026-08-18).
        sed -n 's/.*"keys":\[\([^]]*\)\].*/\1/p' "$W/resp" | tr ',' '\n' | tr -d '"' \
          | while IFS= read -r k || [ -n "${k:-}" ]; do
              [ -n "$k" ] || continue
              case "$k" in
                */) printf '%s/%s\n' "$d" "${k%/}" >> "$W/todo" ;;
                *)  printf '%s/%s\n' "$d" "$k" >> "$W/leaves" ;;
              esac
            done
      done < "$W/cur"
    done
    # The watcher's OWN state lives under platform/automation/ and its version bumps
    # on every tick — enumerating it would make the watcher permanently report itself
    # as a changed secret with no consumer. Machine-owned, excluded here.
    grep -v '^platform/automation/' "$W/leaves" > "$W/leaves.f" 2>/dev/null || : > "$W/leaves.f"
    mv "$W/leaves.f" "$W/leaves"
    LEAF_N="$(wc -l < "$W/leaves" | tr -d ' ')"
    if [ "$LEAF_N" = 0 ]; then
      log "FATAL enumerated 0 secret paths — refusing to write state off an empty inventory"
      exit 1
    fi
    log "enumerated $LEAF_N secret paths under: $ROOTS"
    [ "$LIST_OK" = 1 ] || log "WARN at least one LIST failed — this tick's inventory is INCOMPLETE"

    # ---- 2. read the recorded versions ----------------------------------------
    STATE_CODE="$(http -H @"$W/hdr.bao" "$BAO_ADDR/v1/secret/data/$STATE_PATH")"
    case "$STATE_CODE" in
      # Spaces stripped so the per-path lookup below is insensitive to JSON
      # pretty-printing (the values it reads are version numbers only).
      200) tr -d ' ' < "$W/resp" > "$W/state.json" ;;
      404) : > "$W/state.json"; log "first run: $STATE_PATH absent — recording current versions, taking NO action" ;;
      *)   log "FATAL state read failed (HTTP $STATE_CODE)"; exit 1 ;;
    esac

    # ---- 3. diff + act --------------------------------------------------------
    while IFS= read -r p; do
      [ -n "$p" ] || continue
      c="$(http -H @"$W/hdr.bao" "$BAO_ADDR/v1/secret/metadata/$p")"
      if [ "$c" != 200 ]; then
        log "WARN metadata read of $p failed (HTTP $c) — skipped, state NOT advanced"
        alert "metadata read of $p failed (HTTP $c) — that path was NOT checked this tick"
        PROBLEMS=$((PROBLEMS+1)); continue
      fi
      cur="$(grep -o '"current_version":[0-9]*' "$W/resp" | head -1 | cut -d: -f2)"
      if [ -z "$cur" ]; then
        log "WARN no current_version for $p — skipped"
        alert "no current_version for $p — that path was NOT checked this tick"
        PROBLEMS=$((PROBLEMS+1)); continue
      fi
      prev="$(grep -o "\"$p\":\"[0-9]*\"" "$W/state.json" 2>/dev/null | head -1 | cut -d'"' -f4)"
      if [ -z "$prev" ]; then
        # FIRST-RUN GUARD (per path, not per store): a path never seen before is
        # recorded WITHOUT acting. Without it the first tick rebuilds the fleet.
        log "new path $p (v$cur) — recorded, no action taken"
        record "$p" "$cur"; continue
      fi
      [ "$prev" = "$cur" ] && continue

      CHANGED=$((CHANGED+1))
      log "CHANGED $p  v$prev -> v$cur"
      acted=0; allok=1; esok=1

      # (a) k8s consumers, discovered from the ExternalSecrets themselves.
      if es_map; then
        while read -r k ens ename etarget; do
          [ "$k" = "$p" ] || continue
          acted=1
          log "  -> ExternalSecret $ens/$ename (Secret $ens/$etarget): force-syncing now"
          if es_force_sync "$ens" "$ename"; then report_consumers "$ens" "$etarget"; else allok=0; fi
        done < "$W/esmap"
      else
        esok=0; allok=0
      fi

      # (b) CI consumers — the declared map (build-args and convex env are inert
      #     until a workflow runs).
      wf="$(ci_workflow "$p")"
      if [ -n "$wf" ]; then
        acted=1
        log "  -> CI-consumed (baked at build / applied by 'convex env set'): dispatching $wf"
        ci_dispatch "$wf" || allok=0
      fi

      if [ "$acted" = 0 ] && [ "$esok" = 0 ]; then
        # NEVER call "no consumer" off a FAILED discovery — that is the false-green
        # this whole design exists to avoid. Inconclusive: warn, keep the old state,
        # retry next tick.
        PROBLEMS=$((PROBLEMS+1))
        alert "INCONCLUSIVE for $p — ExternalSecret discovery was unavailable, so 'no consumer' cannot be concluded. Retrying next tick."
        log "  INCONCLUSIVE for $p — ExternalSecret discovery was unavailable this tick, so 'no consumer' CANNOT be concluded. State NOT advanced; retrying next tick."
      elif [ "$acted" = 0 ]; then
        NOCONSUMER=$((NOCONSUMER+1))
        alert "no-consumer: $p changed (v$prev -> v$cur) and NOTHING known consumes it — an undiscovered consumer, or a dead secret. Check: grep -rn '$p' gitops/ .github/"
        log "  WARN no-consumer $p changed but NOTHING known consumes it: no ExternalSecret references it and it is not in the CI map. Either a consumer is undiscovered (a hardcoded literal, a laptop .env.local, a manual script, or a CI job that reads it at use time) or the secret is dead. Investigate: grep -rn '$p' gitops/ .github/"
        record "$p" "$cur"
      elif [ "$allok" = 1 ]; then
        ACTED=$((ACTED+1)); record "$p" "$cur"
      else
        PROBLEMS=$((PROBLEMS+1))
        alert "action FAILED for $p — state not advanced, the next tick retries"
        log "  action FAILED for $p — state deliberately NOT advanced; the next tick retries (a duplicate action beats a silently missed one)"
      fi
    done < "$W/leaves"

    # ---- 4. persist ------------------------------------------------------------
    # MERGE patch, never a put: every tracked path is a FIELD of this one secret and
    # `kv put` replaces the WHOLE path, wiping every other field.
    if [ -s "$W/newstate" ]; then
      {
        printf '{"data":{'
        first=1
        while read -r sp sv; do
          [ "$first" = 1 ] || printf ','
          first=0
          printf '"%s":"%s"' "$sp" "$sv"
        done < "$W/newstate"
        printf '}}\n'
      } > "$W/state-patch.json"
      if [ "$STATE_CODE" = 200 ]; then
        c="$(http -X PATCH -H @"$W/hdr.bao" -H 'Content-Type: application/merge-patch+json' \
          -d @"$W/state-patch.json" "$BAO_ADDR/v1/secret/data/$STATE_PATH")"
      else
        c="$(http -X POST -H @"$W/hdr.bao" -H 'Content-Type: application/json' \
          -d @"$W/state-patch.json" "$BAO_ADDR/v1/secret/data/$STATE_PATH")"
      fi
      case "$c" in
        200|204) log "state updated ($(wc -l < "$W/newstate" | tr -d ' ') path(s))" ;;
        *) log "FATAL state write failed (HTTP $c) — the next tick would REPEAT this tick's actions"; exit 1 ;;
      esac
    else
      log "no state change to persist"
    fi

    log "summary: $LEAF_N paths / $CHANGED changed / $ACTED acted / $NOCONSUMER no-consumer / $DISPATCHES dispatched / $PROBLEMS problem(s)"

    # ---- 5. report the tick's findings to #security ---------------------------
    # ONLY when there is something to say. A clean tick is silent BY DESIGN: at
    # */5 a heartbeat would be 288 messages a day and the channel would be muted
    # inside a week, which costs more than it buys. The "is the watcher still
    # alive?" question is answered by the daily #infra digest (which reports a
    # CronJob whose last run failed) and by the Axiom CronJob-failed monitor.
    if [ "$PROBLEMS" -gt 0 ] || [ "$NOCONSUMER" -gt 0 ]; then
      # json_escape: STDIN -> the inside of one JSON string. curlimages/curl has NO
      # jq, so this is sed. ORDER MATTERS: backslashes first, otherwise the second
      # rule's own escaping would be re-escaped by the first. Then quotes, then the
      # whole stream is folded into one line with literal \n separators
      # (`:a;N;$!ba` slurps every line into the pattern space first).
      json_escape() {
        sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/\\n/g'
      }
      # Cap the body: a tick that finds 200 problems must not post 200 lines into a
      # chat room. The log always has the full picture.
      ALERT_N="$(wc -l < "$W/alerts" | tr -d ' ')"
      head -20 "$W/alerts" > "$W/alerts.short"
      if [ "$ALERT_N" -gt 20 ]; then
        printf '... and %s more — see: kubectl -n openbao logs job/<this tick>\n' "$((ALERT_N - 20))" >> "$W/alerts.short"
      fi
      NOTIFY_SEV=warn
      [ "$PROBLEMS" -gt 0 ] && NOTIFY_SEV=fail
      NOTIFY_MSG="$(printf 'secret-watcher (%s): %s problem(s), %s with no known consumer, across %s secret path(s)' \
        "$ENV_BRANCH" "$PROBLEMS" "$NOCONSUMER" "$LEAF_N" | json_escape)"
      NOTIFY_DETAIL="$(json_escape < "$W/alerts.short")"
      printf '{"severity":"%s","message":"%s","detail":"%s"}\n' \
        "$NOTIFY_SEV" "$NOTIFY_MSG" "$NOTIFY_DETAIL" > "$W/notify.json"
      # Through the same failure-swallowing http() helper as everything else: a Talk
      # outage must never turn a SUCCESSFUL tick into a failed Job. The findings are
      # already on stdout either way.
      NOTIFY_CODE="$(http -X POST -H @"$W/hdr.notify" -H 'Content-Type: application/json' \
        -d @"$W/notify.json" "$NOTIFY_URL/notify/$NOTIFY_CHANNEL")"
      case "$NOTIFY_CODE" in
        200) log "reported to #$NOTIFY_CHANNEL ($ALERT_N finding(s))" ;;
        401) log "WARN #$NOTIFY_CHANNEL rejected the token (HTTP 401) — this tick's findings are LOG-ONLY. Check: kubectl -n openbao get externalsecret talk-webhook-token" ;;
        *)   log "WARN could not reach $NOTIFY_URL (HTTP $NOTIFY_CODE) — this tick's findings are LOG-ONLY. Check: kubectl -n nextcloud get deploy talk-webhook" ;;
      esac
    fi
    exit 0
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: secret-watcher
  namespace: openbao
  annotations:
    alerts.psizone.ro/owner: WLOPSEMAIL
spec:
  # Every 5 minutes. Detection is polling (OpenBao has no event stream), so this is
  # the worst-case latency between a write and the reaction.
  schedule: "*/5 * * * *"
  # Forbid: a slow tick must never overlap the next one — two ticks reading the same
  # pre-update state would double-dispatch CI.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      # backoffLimit 0 + restartPolicy Never: the retry IS the next 5-minute tick.
      # A Job-level retry could re-dispatch off a half-written state.
      backoffLimit: 0
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app: secret-watcher
        spec:
          serviceAccountName: secret-watcher
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100 # curlimages/curl's own unprivileged user
            runAsGroup: 100
            fsGroup: 100 # so the emptyDir is writable without root
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: script
              configMap:
                name: secret-watcher-script
                defaultMode: 0555
            # The estate's CI map (required: the platform always ships it).
            - name: config
              configMap:
                name: secret-watcher-config
                items:
                  - { key: ci-map, path: ci-map }
            # Scratch for header/body files (tokens never reach argv) — required
            # because the root filesystem is read-only.
            - name: work
              emptyDir: {}
          containers:
            - name: watcher
              # curl 8.5.0: OpenBao is plain HTTP in-cluster, and the same binary
              # does TLS to the apiserver and api.github.com (busybox wget's TLS is
              # unreliable). Pinned tag — never :latest.
              image: curlimages/curl:8.5.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 20m, memory: 48Mi }
                limits: { cpu: 200m, memory: 192Mi }
              env:
                - name: BAO_ADDR
                  value: http://openbao.openbao.svc:8200
                - name: BAO_ROLE
                  value: secret-watcher
                - name: STATE_PATH
                  value: platform/automation/watcher-state
                - name: ROOTS
                  value: "apps platform"
                # The repository dispatched to: from the estate's config (empty in
                # the platform's own copy, where the CI map is empty too).
                - name: GIT_OWNER
                  valueFrom:
                    configMapKeyRef: { name: secret-watcher-config, key: GIT_OWNER }
                - name: GIT_REPO
                  valueFrom:
                    configMapKeyRef: { name: secret-watcher-config, key: GIT_REPO }
                # Cap on workflow_dispatch calls per tick: a comparison bug can never
                # loop the whole build fleet. Truncation is logged, never silent.
                - name: DISPATCH_CAP
                  value: "5"
                # branch == environment, 1:1 — the `prod` branch's copy of this file
                # carries "prod" (same convention as the snapshot CronJob's BUCKET).
                - name: ENV_BRANCH
                  value: dev
                # ---- #security reporting ----------------------------------
                # The IN-CLUSTER translator address. These messages fire WHEN
                # THINGS ARE BROKEN, so the path must not depend on Traefik,
                # external DNS or the public certificate.
                - name: NOTIFY_URL
                  value: http://talk-webhook.nextcloud.svc
                - name: NOTIFY_CHANNEL
                  value: security
                # SEND-ONLY bearer, not the Talk bot signing key: the translator
                # does the HMAC, so this pod cannot forge a message even if it
                # were compromised. Required, never `optional: true` — the script
                # asserts it non-empty on its first line and exits with the key
                # NAME, so a missing/blank token is a CrashLoop with a named
                # error rather than a watcher that quietly reports to nobody.
                # No Reloader annotation: every tick is a fresh pod, so it always
                # reads the current value (CronJobs are outside the scope of both
                # the require-reloader-annotation policy and the doctor.sh
                # rotation layer, which match Deployment/StatefulSet/DaemonSet).
                - name: NOTIFY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: talk-webhook-token
                      key: token
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: work
                  mountPath: /work
              command: ["/bin/sh", "/scripts/watch.sh"]
