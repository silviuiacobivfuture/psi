# openbao-audit-notify — "WHO changed WHICH KEY, and WHERE does it land?"
#
# Three files, one component: this Deployment, the program in audit-notify-app.yaml,
# and least-privilege RBAC in audit-notify-rbac.yaml. The rationale lives here.
#
# THE GAP THIS CLOSES. The secret-watcher (secret-watcher.yaml) detects THAT a path
# changed, by polling `secret/metadata/<path>`.`current_version`. That is all KV
# metadata carries: version + timestamps. VERIFIED on the live cluster 2026-08-20 —
# `bao kv metadata get` returns NO author and NO key names. So the watcher can never
# answer "who did it" or "which key", and it must not: reading the VALUE plane to
# find out would be exactly the privilege regression its own header forbids.
#
# The AUDIT DEVICE answers both without any new privilege, because OpenBao HMACs
# every value before writing the entry. VERIFIED in an isolated
# quay.io/openbao/openbao:2.5.4 container, 2026-08-20 — a real `bao kv put` emitted:
#
#   "auth":    {"display_name":"root","policies":["root"], ...}
#   "request": {"operation":"create","path":"secret/data/apps/demo/env",
#               "data":{"data":{"CLERK_SECRET_KEY":"hmac-sha256:3d8b176e...",
#                               "OTHER":"hmac-sha256:eb97ffdd..."}}}
#
# KEY NAMES in clear, VALUES as HMAC-SHA256 — done by the server, not by us. This
# service reads the key names and the actor and posts them to #secrets. It never
# reads, forwards or logs a value, and it never posts the HMAC either (a hash of a
# low-entropy secret is still an offline-guessing target).
#
# WHY A LOG STREAM AND NOT AN API. OpenBao has no event system (upstream issue #553,
# closed unimplemented — see the secret-watcher header), and the audit device is
# write-only: nothing plays audit entries back. The device writes to the server's
# stdout (`file_path = "stdout"`, declared in the Helm values at
# gitops/apps/overlays/dev/openbao.yaml), so the stream IS the API. otel-agent
# already ships that same stdout to Axiom for retention; this reads it live.
#
#   ┌─ THE AUDIT DEVICE MUST BE ENABLED FIRST, BY A HUMAN ────────────────────────┐
#   │ OpenBao 2.5.4 REFUSES `bao audit enable` over the API (verified 2026-08-20): │
#   │   "cannot enable audit device via API; use declarative, config-based audit   │
#   │    device management instead"                                                │
#   │ so the stanza lives in server.standalone.config in the Helm values. The      │
#   │ chart sets NO config checksum annotation, so Argo syncing the ConfigMap does │
#   │ NOT restart openbao-0 — a human must delete the pod once. It comes back      │
#   │ SEALED and the unseal-agent sidecar unseals it within seconds (RUNBOOK       │
#   │ 2026-06-19). Until that restart this Deployment runs, follows the stream and │
#   │ finds no audit JSON on it, reconnecting on the ~5-minute STREAM_TIMEOUT.     │
#   │ That is healthy and silent by design — and the reason the log follow carries │
#   │ a read timeout at all: a connected-but-quiet stream must re-mark liveness or │
#   │ the probe below would kill a perfectly healthy pod.                          │
#   │ RISK — if ALL enabled audit devices fail to write, OpenBao STOPS SERVING     │
#   │ (vault/audit_broker.go:165,230 -> request_handling.go:1085,1229 in the 2.5.4 │
#   │ source). One `stdout` device is the lowest-risk shape there is; see the full │
#   │ note in gitops/apps/overlays/dev/openbao.yaml before adding a second.        │
#   └─────────────────────────────────────────────────────────────────────────────┘
#
# Deployment: Argo-synced by the `openbao-store` Application
# (gitops/apps/overlays/dev/secret-store.yaml -> path gitops/platform/openbao).
# That Application's destination namespace is `external-secrets`, so every resource
# in these three files sets metadata.namespace explicitly — same reason
# secret-watcher.yaml does. NOT applied by hand.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbao-audit-notify
  namespace: openbao
  annotations:
    # MANDATORY. NOTIFY_TOKEN is injected as env, and env is read ONCE at process
    # start — without this the pod would keep a revoked bearer forever after a
    # rotation of platform/talk/webhook and every report would 401 in silence:
    # exactly the silent half-rotation the HARD RULE in
    # infrastructure/hetzner/CLAUDE.md exists to prevent. (The Kyverno
    # require-reloader-annotation ClusterPolicy is still in Audit mode, so it would
    # only REPORT the omission — the rule binds regardless of enforcement mode.)
    reloader.stakater.com/auto: "true"
    alerts.psizone.ro/owner: WLOPSEMAIL
spec:
  # EXACTLY ONE. Two replicas would both follow the same log and post every change
  # twice; the replay-dedupe cache is per-process and cannot cross pods.
  replicas: 1
  # Recreate, not RollingUpdate: for the same reason, a new pod must not overlap the
  # old one on the stream during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openbao-audit-notify
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openbao-audit-notify
    spec:
      serviceAccountName: openbao-audit-notify
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: audit-notify
          # Same image and pinned tag as talk-webhook: stdlib only, no build step,
          # no registry of our own in the path of a security-reporting component.
          image: python:3.13-alpine
          command: ["python3", "/app/app.py"]
          env:
            - name: BAO_NAMESPACE
              value: openbao
            # StatefulSet ordinal-0 name — stable across restarts, which is what
            # lets the RBAC pin resourceNames to a single pod.
            - name: BAO_POD
              value: openbao-0
            # The SERVER container, NOT the unseal-agent sidecar: the audit device
            # writes to the server's stdout.
            - name: BAO_CONTAINER
              value: openbao
            # The IN-CLUSTER translator, never the public Ingress. Same reasoning as
            # the secret-watcher's: these messages must not depend on Traefik,
            # external DNS or the public certificate.
            - name: NOTIFY_URL
              value: http://talk-webhook.nextcloud.svc
            - name: NOTIFY_CHANNEL
              value: secrets
            # SEND-ONLY bearer, never the Talk bot signing key: the translator does
            # the HMAC, so this pod cannot forge a message even if compromised.
            # Required, never optional — app.py asserts it non-empty and exits with
            # the key NAME, so a missing/blank token CrashLoops with a named error
            # rather than reporting to nobody.
            - name: NOTIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: talk-webhook-token
                  key: token
            # branch == environment, 1:1 — the `prod` branch's copy carries "prod"
            # (same convention as the secret-watcher's ENV_BRANCH).
            - name: ENV_BRANCH
              value: dev
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 15
          # Asserts the LOG STREAM is connected, not just that python is running.
          # A reporter whose stream died is silent, and silence here reads exactly
          # like "nobody changed a secret" — the failure mode had to be given a
          # symptom of its own.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 3
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - name: app
              mountPath: /app
            # The estate's CI map, shared with the secret-watcher (no subPath, so the
            # kubelet refreshes it in place).
            - name: ci-map
              mountPath: /config
              readOnly: true
      volumes:
        - name: app
          configMap: { name: openbao-audit-notify-app }
        - name: ci-map
          configMap:
            name: secret-watcher-config
            items:
              - { key: ci-map, path: ci-map }
