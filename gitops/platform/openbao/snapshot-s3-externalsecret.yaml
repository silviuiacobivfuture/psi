# S3 credentials for the OpenBao snapshot CronJob → openbao-snapshot-s3 secret in the
# openbao namespace. Reuses the SAME Hetzner Object Storage creds as velero + the tofu
# state backend (OpenBao KV secret/platform/object-storage/dev). NOT inline.
#
# Chicken/egg note: this ExternalSecret depends on the very ClusterSecretStore that
# OpenBao backs. That is fine — the snapshot job is a steady-state safety net, not a
# bootstrap dependency. On a fresh cluster OpenBao is bootstrapped + seeded first
# (scripts/openbao-bootstrap.sh), THEN ESO syncs this secret and the CronJob can run.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-snapshot-s3
  namespace: openbao
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: openbao-snapshot-s3
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
