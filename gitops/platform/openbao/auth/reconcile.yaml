# openbao-auth-reconcile — OpenBao's auth configuration, RECONCILED from git.
#
# WHY. Until 2026-10-29 OpenBao's OIDC roles, policies and identity groups were set
# by an operator-run script (oidc-setup.sh) with the root token. Nothing compared the
# store with the code afterwards, so the default role `reader` stayed open to every
# account in the directory — anyone could read every app secret — and nobody saw it
# (RUNBOOK 2026-10-29). Now:
#   * declaration.json + policies/*.hcl (this directory) ARE the configuration;
#   * this CronJob makes the store equal to them every 10 minutes and REMOVES what is
#     not declared (roles, policies, identity groups and aliases, token roles, policies
#     attached directly to an entity), except the protected bootstrap paths;
#   * doctor.sh compares the live store with the same declaration through the
#     read-only `openbao-auth-audit` login and fails on any difference.
#
# TOKEN. No token is stored anywhere: each run exchanges this pod's projected
# ServiceAccount token at auth/kubernetes/login (role openbao-auth-reconcile, TTL
# 10 min, revoked at the end of the run). The role and its policy are bootstrap
# paths — written once by openbao-bootstrap.sh with root, then kept by this job,
# which can never delete them. Neither ServiceAccount holds any Kubernetes RBAC.
#
# SAFETY. The engine refuses BEFORE any write when the declaration is malformed,
# references an undeclared policy, drops a protected path, is itself open (an
# unbound role, a default role reaching a secret path), or when more than 5
# deletions are planned (a truncated declaration must not empty the store). It
# never enables or disables an auth method: an undeclared one is a FINDING.
#
# Run it now: infrastructure/hetzner/scripts/repair.sh <env> (step "OpenBao auth
# configuration"), which creates a Job from this CronJob and prints its log.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-auth-reconcile
  namespace: openbao
automountServiceAccountToken: false
---
# doctor.sh mints a 10-minute token for this one (`kubectl create token`) and logs
# in with role openbao-auth-audit: reads and lists auth configuration, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-auth-audit
  namespace: openbao
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-auth-reconcile
  namespace: openbao
  annotations:
    alerts.psizone.ro/owner: WLOPSEMAIL
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 0   # a failed run is reported, not retried: the next tick is 10 min away
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: { app: openbao-auth-reconcile }
        spec:
          restartPolicy: Never
          serviceAccountName: openbao-auth-reconcile
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: engine
              configMap: { name: openbao-auth-engine }
            - name: declaration
              configMap: { name: openbao-auth-declaration }
            # Only the token, projected short-lived and audience-bound to the API
            # server (OpenBao's TokenReview checks it there) — no CA, no namespace file.
            - name: sa-token
              projected:
                sources:
                  - serviceAccountToken:
                      path: token
                      expirationSeconds: 600
          containers:
            - name: reconcile
              image: python:3.13-alpine
              command:
                - python3
                - /app/openbao_auth.py
                - reconcile
                - --decl=/decl/declaration.json
                - --policies=/decl
                - --login=openbao-auth-reconcile
                - --jwt-file=/var/run/openbao/token
              env:
                - name: BAO_ADDR
                  value: http://openbao.openbao.svc:8200
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: PYTHONUNBUFFERED
                  value: "1"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 200m, memory: 128Mi }
              volumeMounts:
                - { name: engine, mountPath: /app, readOnly: true }
                - { name: declaration, mountPath: /decl, readOnly: true }
                - { name: sa-token, mountPath: /var/run/openbao, readOnly: true }
