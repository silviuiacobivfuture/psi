# secret-watcher RBAC — least privilege for the OpenBao change detector.
#
# The watcher (secret-watcher.yaml) answers "a secret changed in OpenBao — WHAT
# consumes it, and what must happen?" by DISCOVERY, not a hand-kept registry:
#   * ExternalSecrets declare their OpenBao source in .spec.data[].remoteRef.key
#     and .spec.dataFrom[].extract.key   -> read them to map path -> k8s Secret.
#   * Deployments/StatefulSets/DaemonSets declare the Secrets they consume via
#     envFrom[].secretRef / env[].valueFrom.secretKeyRef / volumes[].secret
#     -> read them to report which workloads a rotation actually reaches.
# The only WRITE it needs is `patch` on ExternalSecrets, to stamp the documented
# `force-sync=<ts>` annotation (RUNBOOK 2026-06-19) so ESO re-syncs NOW instead of
# at the end of its refreshInterval.
#
# It has NO access to `secrets` — the watcher must never read a secret VALUE. Its
# only OpenBao reads are metadata (versions, no material), its own state path, and
# the GitHub PAT it dispatches CI with (policy in openbao-bootstrap.sh).
# Cluster-scoped because ExternalSecrets and workloads live in every namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-watcher
  namespace: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secret-watcher
rules:
  # Discovery: which OpenBao path feeds which k8s Secret. Patch: force-sync stamp.
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "patch"]
  # Discovery: which workloads consume that Secret, and whether they carry the
  # Reloader annotation (i.e. whether the rotation will actually reach the process).
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: secret-watcher
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secret-watcher
subjects:
  - kind: ServiceAccount
    name: secret-watcher
    namespace: openbao
