# openbao-audit-notify — THE PROGRAM. Deployment: audit-notify.yaml (read it first,
# it carries the design rationale for all three files). RBAC: audit-notify-rbac.yaml.
# In one line: follow openbao-0's stdout audit stream and post "who changed which
# key, and where it lands" into #secrets. Never a value.
# Namespace explicit — the `openbao-store` Argo Application targets external-secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-audit-notify-app
  namespace: openbao
data:
  app.py: |
    """OpenBao audit stream -> the #secrets Nextcloud Talk channel.

    Python STDLIB ONLY, so the whole service is this ConfigMap: no pip install, no
    requirements file, no build step, no supply chain (as talk-webhook.yaml).

    SECURITY INVARIANT, honoured at every exit point below: the only things taken
    out of an audit entry are the ACTOR, PATH, OPERATION, VERSION and KEY NAMES.
    `request.data.data` is read for its keys(); its values are never read, logged
    or posted. On a parse failure the offending line is NEVER echoed — only the
    exception type — since a truncated entry can still carry HMACs, and a hash of
    a low-entropy secret is an offline-guessing target.
    """
    import json
    import os
    import ssl
    import sys
    import threading
    import time
    import urllib.error
    import urllib.request
    from collections import OrderedDict
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    K8S = "https://kubernetes.default.svc"
    CA = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    SA_TOKEN = "/var/run/secrets/kubernetes.io/serviceaccount/token"

    def require_env(name):
        """Fail LOUD with the key NAME, before any work, on missing OR empty.

        Empty counts as missing: ESO can sync a present-but-EMPTY field and an empty
        bearer 401s forever in silence. Same assert the secret-watcher makes on its
        first line, and the same reason there is no validation initContainer."""
        val = os.environ.get(name, "")
        if not val.strip():
            sys.stderr.write("MISSING REQUIRED SECRET: %s — refusing to run a "
                             "reporter that cannot report what it sees\n" % name)
            raise SystemExit(1)
        return val

    BAO_NAMESPACE = os.environ.get("BAO_NAMESPACE", "openbao")
    BAO_POD = os.environ.get("BAO_POD", "openbao-0")
    BAO_CONTAINER = os.environ.get("BAO_CONTAINER", "openbao")
    NOTIFY_URL = os.environ.get("NOTIFY_URL", "http://talk-webhook.nextcloud.svc").rstrip("/")
    NOTIFY_CHANNEL = os.environ.get("NOTIFY_CHANNEL", "secrets")
    NOTIFY_TOKEN = require_env("NOTIFY_TOKEN")
    # Replay bound on (re)connect. NOT unbounded: `pods/log?follow=true` with no
    # bound returns the ENTIRE existing log first, so every reconnect would re-post
    # history. This plus the id cache makes a reconnect at-most-once, never a flood.
    SINCE_SECONDS = int(os.environ.get("SINCE_SECONDS", "60"))
    # Discovery is cached: a seed-secrets.sh run is a BURST, and no single event
    # should re-list every ExternalSecret and workload in the cluster.
    DISCOVERY_TTL = int(os.environ.get("DISCOVERY_TTL", "120"))
    # SOCKET READ timeout on the log stream, NOT a lifetime. It must stay under the
    # liveness window (600s in audit-notify.yaml): a stream can legitimately go quiet
    # — always, before the audit device is enabled — and a connected-but-silent stream
    # would otherwise age past the probe and get the pod killed for being healthy.
    # Reconnecting re-marks liveness AND surfaces a half-dead TCP in minutes.
    STREAM_TIMEOUT = int(os.environ.get("STREAM_TIMEOUT", "300"))
    ENV_BRANCH = os.environ.get("ENV_BRANCH", "dev")

    # ONLY writes. `read`/`list` are deliberately absent: ESO polls 58 ExternalSecrets
    # (6 at 30s, 52 at 1h) and the secret-watcher walks the metadata tree every 5 min —
    # all reads. Reporting them would bury the one message a day that matters.
    WRITE_OPS = ("create", "update", "patch", "delete")
    # Machine-owned bookkeeping. The secret-watcher excludes its own state path from
    # its own enumeration for the same reason (it bumps whenever the watcher acts).
    MUTED_PREFIXES = ("platform/automation/",)
    SEEN_MAX = 4096

    CI_MAP_FILE = os.environ.get("CI_MAP_FILE", "/config/ci-map")

    def _ci_workflow(path):
        """OpenBao path -> the workflow that applies it (BUILD/CONVEX planes).

        Read from the estate's CI map (ConfigMap secret-watcher-config, key ci-map):
        the SAME table the secret-watcher dispatches from, so the two cannot drift.
        Re-read on every event, so an edit lands without a restart. The mount is
        required; an unreadable file raises rather than reporting "no workflow".
        """
        with open(CI_MAP_FILE, encoding="utf-8") as f:
            for line in f:
                cols = line.split()
                if len(cols) >= 2 and not cols[0].startswith("#") and cols[0] == path:
                    return cols[1]
        return ""

    # Path SHAPE -> the plane it lands on (three-plane table in APP-SECRETS.md,
    # "Change detection"). DECLARED plane only; discovery adds namespace + service,
    # and a path can match BOTH.
    PLANE_BY_LEAF = {
        "env": ("RUNTIME", "k8s Secret -> pod env/volume, synced by ESO"),
        "build": ("BUILD", "baked into the image at `docker build --build-arg`"),
        "convex-env": ("CONVEX", "applied by `convex env set` after `convex deploy`"),
        "convex": ("CONVEX-DEPLOY-KEY", "read by the deploy workflow at use time"),
    }

    def _bearer():
        """Read the projected SA token FRESH every use — it rotates hourly."""
        with open(SA_TOKEN, "r") as fh:
            return "Bearer " + fh.read().strip()

    def k8s_get(path):
        """GET a k8s API path -> parsed JSON, or None on any failure.

        None means INCONCLUSIVE, never "nothing found" — callers degrade to saying
        they could not resolve, never reporting an empty answer as fact."""
        req = urllib.request.Request(K8S + path, headers={"Authorization": _bearer()})
        try:
            ctx = ssl.create_default_context(cafile=CA)
            with urllib.request.urlopen(req, timeout=20, context=ctx) as resp:
                return json.loads(resp.read())
        except (urllib.error.URLError, OSError, ValueError) as exc:
            sys.stderr.write("k8s GET %s failed: %s\n" % (path, type(exc).__name__))
            return None

    class Discovery(object):
        """OpenBao path -> ExternalSecret -> k8s Secret -> workloads.

        The SAME discovery the secret-watcher does, over the two facts the cluster
        already declares: every ExternalSecret names its OpenBao source in
        .spec.data[].remoteRef.key / .spec.dataFrom[].extract.key, and every
        workload names the Secrets it consumes. Nothing is hand-registered."""

        def __init__(self):
            self._at = 0.0
            self._es = {}
            self._wl = []
            self._namespaces = set()
            self._ok = False

        def refresh(self):
            if self._ok and (time.time() - self._at) < DISCOVERY_TTL:
                return True
            es_doc = k8s_get("/apis/external-secrets.io/v1/externalsecrets")
            if es_doc is None:
                return False
            es = {}
            namespaces = set()
            for item in es_doc.get("items", []):
                meta = item.get("metadata", {})
                spec = item.get("spec", {})
                ns = meta.get("namespace", "")
                name = meta.get("name", "")
                target = (spec.get("target") or {}).get("name") or name
                namespaces.add(ns)
                keys = set()
                for entry in spec.get("data") or []:
                    key = (entry.get("remoteRef") or {}).get("key")
                    if key:
                        keys.add(key)
                for entry in spec.get("dataFrom") or []:
                    key = (entry.get("extract") or {}).get("key")
                    if key:
                        keys.add(key)
                for key in keys:
                    es.setdefault(key, []).append((ns, name, target))
            workloads = []
            for kind, resource in (
                ("Deployment", "deployments"),
                ("StatefulSet", "statefulsets"),
                ("DaemonSet", "daemonsets"),
            ):
                doc = k8s_get("/apis/apps/v1/" + resource)
                if doc is None:
                    return False
                for item in doc.get("items", []):
                    meta = item.get("metadata", {})
                    ns = meta.get("namespace", "")
                    namespaces.add(ns)
                    blob = json.dumps(item.get("spec", {}).get("template", {}))
                    workloads.append((kind, ns, meta.get("name", ""), blob))
            self._es, self._wl, self._namespaces = es, workloads, namespaces
            self._at, self._ok = time.time(), True
            return True

        def external_secrets(self, path):
            return self._es.get(path, [])

        def services_for(self, ns, secret_name):
            """Workloads in <ns> that reference Secret <secret_name>.

            A substring match on the serialised pod template, not a walk of every
            envFrom/secretKeyRef/volume shape: this REPORTS, it does not enforce
            (doctor.sh + the Kyverno policy are the enforcers — the watcher's
            report_consumers() notes the same), and a quoted name cannot miss a
            shape we forgot."""
            needle = '"%s"' % secret_name
            return [
                (kind, name)
                for kind, wns, name, blob in self._wl
                if wns == ns and needle in blob
            ]

        def namespaces(self):
            return self._namespaces

    DISCOVERY = Discovery()

    def render_actor(display_name, metadata):
        """audit `auth.display_name` -> something a human recognises.

        OpenBao composes it as <auth-mount-path>-<backend display name>
        (vault/request_handling.go:1901 in the v2.5.4 tag, read directly), so the
        raw value is a mount string, not a person:
          root                                root token       OBSERVED
          userpass-alice                      userpass login   OBSERVED
          kubernetes-<sa-namespace>-<sa-name> k8s auth         ASSUMED (from
              builtin/credential/kubernetes/path_login.go:185, "<ns>-<name>")
          oidc-<sub>                          Authentik login  ASSUMED

        The k8s form is AMBIGUOUS alone — namespace AND service account may both
        contain dashes, so "kubernetes-external-secrets-external-secrets" cannot be
        split by counting. It IS resolvable: match the LONGEST discovered namespace
        the remainder starts with; when nothing matches, say so, never guess.

        OIDC IS A KNOWN GAP: the declared OIDC roles (auth/declaration.json) set user_claim=sub, so an
        Authentik login renders as `oidc-<uuid>` — traceable, not readable.
        auth.metadata wins when it carries a username; the raw value is the honest
        fallback. Fix is one flag on the roles — see the RUNBOOK."""
        name = display_name or "(unknown)"
        if isinstance(metadata, dict):
            for key in ("username", "preferred_username", "email", "name"):
                val = metadata.get(key)
                if isinstance(val, str) and val.strip():
                    return "%s (%s)" % (val.strip(), name)
        if name == "root":
            return "root token"
        if name.startswith("kubernetes-"):
            rest = name[len("kubernetes-"):]
            best = ""
            for ns in DISCOVERY.namespaces():
                if (rest == ns or rest.startswith(ns + "-")) and len(ns) > len(best):
                    best = ns
            if best:
                sa = rest[len(best) + 1:] or best
                return "%s (k8s service account %s/%s)" % (sa, best, sa)
            return "%s (k8s service account)" % rest
        if name.startswith("oidc-"):
            return "%s (OIDC login)" % name[len("oidc-"):]
        if name.startswith("userpass-"):
            return "%s (userpass login)" % name[len("userpass-"):]
        return name

    def destinations(path):
        """Every place this path's value lands. A UNION, never a pick.

        Three independent sources, and a path can hit more than one — flattening
        them to "the" destination is the failure this reporter exists to avoid:
          1. the DECLARED plane, from the path's leaf (PLANE_BY_LEAF);
          2. EVERY ExternalSecret referencing the path — there can be SEVERAL, in
             different namespaces. `platform/talk/webhook` is the worked case here:
             it feeds nextcloud/talk-webhook-token (the translator) AND
             openbao/talk-webhook-token (the secret-watcher's bearer, and this
             pod's). One write, two namespaces, two services;
          3. the CI map, for values a workflow bakes or pushes.

        Returns (lines, resolved); resolved is False when discovery was
        unavailable, so the caller says INCONCLUSIVE rather than "nowhere".
        """
        lines = []
        plane = PLANE_BY_LEAF.get(path.rsplit("/", 1)[-1])
        resolved = DISCOVERY.refresh()
        refs = DISCOVERY.external_secrets(path) if resolved else []
        for ns, es_name, target in sorted(refs):
            services = DISCOVERY.services_for(ns, target)
            if services:
                svc = ", ".join("%s %s" % (k, n) for k, n in sorted(services))
            else:
                svc = "(no Deployment/StatefulSet/DaemonSet — a Job, CronJob, or a controller reading it through the API)"
            lines.append(
                "RUNTIME · namespace [%s] · service [%s] — via ExternalSecret %s/%s (Secret %s)"
                % (ns, svc, ns, es_name, target)
            )
        workflow = _ci_workflow(path)
        if workflow:
            label, how = plane if plane else ("CI", "applied by a workflow run")
            lines.append(
                "[%s] · CI workflow %s (ref %s) — %s; INERT until that run finishes"
                % (label, workflow, ENV_BRANCH, how)
            )
        elif plane and not refs:
            # Declared plane, no discovered consumer, no CI mapping. Say what the
            # shape implies AND that nothing confirms it — the secret-watcher
            # reports this same situation as `WARN no-consumer`.
            label, how = plane
            lines.append(
                "[%s] · %s — but NOTHING in the cluster references this path and it is not in the CI map (undiscovered consumer, or a dead secret)"
                % (label, how)
            )
        if not lines and resolved:
            lines.append(
                "[UNKNOWN] · no ExternalSecret references this path and it is not in the CI map — check: grep -rn '%s' gitops/ .github/" % path
            )
        return lines, resolved

    def build_message(entry):
        """Audit entry -> (message, detail, severity), or None to ignore it.

        The ONLY place an entry becomes text. Every field it touches is non-secret
        by construction: operation, path, version, key NAMES, actor."""
        if entry.get("type") != "response":
            # Every operation emits BOTH a `request` and a `response` entry; keying
            # off exactly one is what stops this double-posting.
            return None
        request = entry.get("request") or {}
        operation = request.get("operation")
        path = request.get("path") or ""
        if operation not in WRITE_OPS:
            return None
        if path.startswith("secret/data/"):
            logical = path[len("secret/data/"):]
            destroyed = False
        elif path.startswith("secret/metadata/"):
            # A metadata delete DESTROYS every version — more destructive than a
            # write, so reported, not filtered. It carries no request.data, so the
            # message degrades to path-only and says so, rather than showing no keys.
            logical = path[len("secret/metadata/"):]
            destroyed = True
        else:
            return None
        if any(logical.startswith(p) for p in MUTED_PREFIXES):
            return None
        refused = bool(entry.get("error"))
        if refused:
            # A DENIED or failed write. Worth reporting (an unauthorised write
            # against the secret store IS a security event) but never as a change.
            severity, verb, keys = "warn", "", []
        else:
            # keys() ONLY. The values are `hmac-sha256:...` strings written by
            # OpenBao; never read, and the HMAC is never posted either.
            inner = (request.get("data") or {}).get("data")
            keys = sorted(inner.keys()) if isinstance(inner, dict) else []
            # The VERB follows the OPERATION, not just the path prefix. A `delete` on
            # secret/data/* carries no request.data, so the first version of this code
            # fell through to "changed secret with key(s) not named in this entry" —
            # which reads as a confusing write when it was in fact a DELETION
            # (observed on the live #secrets feed, 2026-08-20).
            if destroyed:
                severity, verb = "warn", "destroyed every version of"
            elif operation == "delete":
                severity, verb = "warn", "deleted the current version of"
            else:
                severity, verb = "info", "changed"
        auth = entry.get("auth") or {}
        actor = render_actor(auth.get("display_name"), auth.get("metadata"))
        version = ((entry.get("response") or {}).get("data") or {}).get("version")
        if refused:
            message = "[%s] was REFUSED a write to [%s]" % (actor, logical)
        else:
            # A deletion names no keys BY DESIGN — the audit entry for a delete has no
            # request.data at all. Saying so is noise; the verb already carries it.
            if keys:
                message = "[%s] %s secret with key%s [%s] at [%s]%s" % (
                    actor, verb, "s" if len(keys) > 1 else "", ", ".join(keys), logical,
                    " (now v%s)" % version if version is not None else "")
            else:
                message = "[%s] %s the secret at [%s]" % (actor, verb, logical)
        lines, resolved = destinations(logical)
        if not resolved:
            lines = ["destination INCONCLUSIVE — the ExternalSecret/workload "
                     "listing was unavailable, so where this lands is unresolved"]
            severity = "warn"
        return message, "\n".join("→ " + line for line in lines), severity

    def post(message, detail, severity):
        body = json.dumps({"severity": severity, "message": message,
                           "detail": detail}).encode()
        req = urllib.request.Request(
            NOTIFY_URL + "/notify/" + NOTIFY_CHANNEL,
            data=body,
            method="POST",
            headers={"Content-Type": "application/json", "X-Notify-Token": NOTIFY_TOKEN},
        )
        try:
            with urllib.request.urlopen(req, timeout=15) as resp:
                return resp.status
        except urllib.error.HTTPError as exc:
            sys.stderr.write("talk-webhook rejected the post: HTTP %s\n" % exc.code)
        except Exception as exc:  # noqa: BLE001 - surface any transport failure
            sys.stderr.write("talk-webhook unreachable: %s\n" % type(exc).__name__)
        return 0


    class Health(object):
        """Liveness state. A dead reporter is SILENT, and silence here reads exactly
        like 'nobody changed a secret' — so the probe asserts the log stream is
        CONNECTED, not merely that the process exists."""

        def __init__(self):
            self.connected_at = 0.0
            self.lock = threading.Lock()

        def mark(self):
            with self.lock:
                self.connected_at = time.time()

        def ok(self):
            with self.lock:
                return self.connected_at > 0 and (time.time() - self.connected_at) < 600

    HEALTH = Health()

    class HealthHandler(BaseHTTPRequestHandler):
        def do_GET(self):
            code = 200 if HEALTH.ok() else 503
            payload = b"ok" if code == 200 else b"log stream not connected"
            self.send_response(code)
            self.send_header("Content-Type", "text/plain")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)

        def log_message(self, fmt, *args):
            return

    def stream_once(seen):
        """One `pods/log?follow=true` connection; returns when the stream ends."""
        url = (
            "%s/api/v1/namespaces/%s/pods/%s/log?container=%s&follow=true&sinceSeconds=%d"
            % (K8S, BAO_NAMESPACE, BAO_POD, BAO_CONTAINER, SINCE_SECONDS)
        )
        req = urllib.request.Request(url, headers={"Authorization": _bearer()})
        ctx = ssl.create_default_context(cafile=CA)
        with urllib.request.urlopen(req, timeout=STREAM_TIMEOUT, context=ctx) as resp:
            HEALTH.mark()
            sys.stderr.write(
                "connected to %s/%s [%s]\n" % (BAO_NAMESPACE, BAO_POD, BAO_CONTAINER)
            )
            for raw in resp:
                HEALTH.mark()
                line = raw.strip()
                # The server writes PLAIN-TEXT logs to this same stream (banner,
                # "expiration: revoked lease") — non-JSON is not an audit entry.
                if not line.startswith(b"{"):
                    continue
                try:
                    entry = json.loads(line)
                except ValueError:
                    # NEVER echo the line — a truncated entry still carries HMACs.
                    sys.stderr.write("skipped a non-JSON line on the audit stream\n")
                    continue
                request_id = (entry.get("request") or {}).get("id")
                marker = "%s|%s" % (request_id, entry.get("type"))
                if request_id and marker in seen:
                    # Replay guard: sinceSeconds bounds the reconnect backlog, but
                    # that window still overlaps what was already posted.
                    continue
                built = None
                try:
                    built = build_message(entry)
                except Exception as exc:  # noqa: BLE001 - one bad entry must not kill the stream
                    sys.stderr.write(
                        "failed to render an audit entry: %s\n" % type(exc).__name__
                    )
                if request_id:
                    seen[marker] = True
                    while len(seen) > SEEN_MAX:
                        seen.popitem(last=False)
                if built is None:
                    continue
                message, detail, severity = built
                sys.stderr.write("reporting: %s\n" % message)
                post(message, detail, severity)

    def main():
        serve = lambda: ThreadingHTTPServer(("", 8080), HealthHandler).serve_forever()
        threading.Thread(target=serve, daemon=True).start()
        seen = OrderedDict()
        backoff = 2
        while True:
            try:
                stream_once(seen)
                # A clean end of stream is NORMAL: the kubelet closes the follow
                # on rotation and on every openbao-0 restart. Reconnect promptly.
                sys.stderr.write("audit stream ended — reconnecting\n")
                backoff = 2
            except TimeoutError:
                # STREAM_TIMEOUT elapsed with no line. Expected whenever OpenBao is
                # quiet (and constant before the audit device is enabled) — a normal
                # reconnect, never a backoff and never an error.
                sys.stderr.write("audit stream quiet for %ss — reconnecting\n" % STREAM_TIMEOUT)
                backoff = 2
            except Exception as exc:  # noqa: BLE001 - never exit on a transport error
                sys.stderr.write(
                    "audit stream error (%s) — retrying in %ss\n"
                    % (type(exc).__name__, backoff)
                )
                time.sleep(backoff)
                backoff = min(backoff * 2, 60)

    if __name__ == "__main__":
        main()
