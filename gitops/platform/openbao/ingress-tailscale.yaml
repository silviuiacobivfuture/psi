# OpenBao UI + API, tailnet-only (Tailscale operator). The :8200 listener serves
# BOTH the web UI and the HTTP API, so this single ingress gives admins the UI
# AND local devs a BAO_ADDR for the secret-injection helper — zero public surface.
# MagicDNS name: openbao.<tailnet>.ts.net (from tls.hosts[0]).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openbao
  namespace: openbao
  annotations:
    # Homepage hub auto-discovery (gethomepage.dev) → "Platform" group.
    # Tailscale ingress uses a wildcard host, so the href is set explicitly.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "OpenBao"
    gethomepage.dev/description: "Secrets store"
    gethomepage.dev/group: "Platform"
    gethomepage.dev/icon: "si-openbao"
    gethomepage.dev/href: "https://openbao.WLTAILNET"
    # Ingress name `openbao` would derive `app.kubernetes.io/name=openbao`, which
    # ALSO matches the agent-injector pod. Pin component=server so the dot tracks
    # the StatefulSet pod (openbao-0) only.
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=openbao,component=server"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: openbao
      port:
        number: 8200
  tls:
    - hosts:
        - openbao
