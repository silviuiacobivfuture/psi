# The shared bearer that gates talk-webhook, mirrored into the `openbao` namespace so
# the secret-watcher CronJob can post its findings into the #security Talk channel.
#
# WHY A SECOND COPY: ESO cannot copy a Secret across namespaces, and talk-webhook's own
# copy lives in `nextcloud` (pieces/nextcloud-platform/base/externalsecrets.yaml). Both
# read the SAME OpenBao path, so the two can never drift — a rotation of
# platform/talk/webhook rewrites both within one refreshInterval.
#
# WHY NOT the bot signing key: the watcher posts through the translator
# (http://talk-webhook.nextcloud.svc), so it holds a SEND-ONLY token. The
# message-signing key never leaves the nextcloud namespace. Same reasoning as CI.
#
# CHICKEN/EGG, stated plainly (same argument as snapshot-s3-externalsecret.yaml): this
# ExternalSecret depends on the ClusterSecretStore that OpenBao itself backs. That is
# fine — notification is a steady-state concern, not a bootstrap dependency. On a fresh
# cluster OpenBao is bootstrapped and seeded first (scripts/openbao-bootstrap.sh +
# seed-secrets.sh), THEN ESO syncs this and the watcher can notify.
#
# Explicit data[] (never a bare dataFrom.extract): a missing key makes this go
# SecretSyncedError — LOUD — instead of syncing an empty token, which would make every
# notification 401 silently. A dropped alert has no symptom of its own, which is exactly
# why the empty case must be impossible rather than merely unlikely.
#
# TWO CONSUMERS IN THIS NAMESPACE, with DIFFERENT rotation needs:
#   * the secret-watcher CronJob — no Reloader annotation needed, and none possible:
#     every tick starts a FRESH pod that reads the current value, and both the
#     `require-reloader-annotation` ClusterPolicy and the doctor.sh rotation layer
#     match Deployment/StatefulSet/DaemonSet only, so neither looks at a CronJob.
#   * openbao-audit-notify (audit-notify.yaml) — a long-running DEPLOYMENT that
#     injects this token as env, so it MUST carry `reloader.stakater.com/auto`, and
#     it does. Without it the reporter would hold a revoked bearer forever after a
#     rotation and every report would 401 in silence — the silent half-rotation the
#     HARD RULE in infrastructure/hetzner/CLAUDE.md exists to prevent.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talk-webhook-token
  namespace: openbao
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: talk-webhook-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: platform/talk/webhook
        property: token
