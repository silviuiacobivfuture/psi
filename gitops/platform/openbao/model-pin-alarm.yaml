# model-pin-alarm — "is every consumer on the model Polaris released?"
#
# THE GAP THIS CLOSES (RUNBOOK 2026-10-29). Every autorizare-svc rollout releases
# the model its image carries (the release-model initContainer). Pins move only
# with the estate's pin procedure (REPIN_COMMAND names it) — deliberately, never
# automatically (root CLAUDE.md rule 3), and this alarm keeps it that way: it
# MOVES NOTHING. On 2026-10-29 Polaris released 01M6499DBGB5QH605SR0W43BA9 and
# all six consumers stayed on the previous model for hours; the mirror refused
# every feed for three business applications, and only a hand-run doctor noticed.
#
# WHAT IT COMPARES, every 5 minutes:
#   * the RELEASE — GET /v1/catalog/model on autorizare-svc, in-cluster. The
#     endpoint applications pin from; unauthenticated by design (a model id is
#     not a secret); no database access, no Convex key.
#   * each consumer's PIN — from the pin RECORD at
#     secret/platform/automation/model-pins, written by the estate's pin procedure
#     (and its --record mode) as `<app>: v<version>:<model id>`. NOT from
#     secret/apps/<app>/autorizare itself: those paths also hold machine
#     credentials (AUTORIZARE_CLIENT_SECRET, POLARIS_WEBHOOK_SECRET), and KV v2
#     grants read per PATH, never per field — reading the pin there means reading
#     the credentials too. The Convex apps' pin also lives in each deployment's
#     env, readable only with the admin key; the record is the OpenBao copy of it
#     (doctor's cxe_check proves the deployment agrees, and Polaris's own
#     watchdog pages on a mirror acknowledging under another model).
#   * the record's FRESHNESS — each path's current_version from
#     secret/metadata/apps/<app>/autorizare (metadata: versions, no values). A
#     path written after it was recorded (a hand `bao kv patch`, a seed run) has a
#     pin this alarm cannot see, so it says CANNOT TELL — never "current".
#
# WHAT IT POSTS, to #infra through the one translator into Talk
# (pieces/nextcloud-platform/base/talk-webhook.yaml), ONCE PER NEW STATE:
#   * a consumer TRAILS or is UNPINNED → fail, naming the apps, both ids and
#     the estate's pin procedure (`$REPIN_COMMAND --current` when it is set);
#   * a consumer UNKNOWN, or Polaris unreadable → warn, "cannot tell";
#   * back to all current → ok, once. The same state on the next tick posts
#     nothing: an alarm that repeats every five minutes is an alarm somebody mutes.
# A state is only remembered once its message was delivered, so a Talk outage
# retries next tick; the Job then exits 1, which the daily digest and the
# CronJob-failed monitor report, and doctor ("model-pin alarm") reads.
#
# LEAST PRIVILEGE. OpenBao role and policy `model-pin-alarm`
# (auth/declaration.json, auth/policies/model-pin-alarm.hcl): read the record,
# read the six paths' METADATA, read+write its own state. No secret value, no
# Kubernetes RBAC at all (the ServiceAccount exists only to log in).
#
# Consumers: CONSUMERS below is DERIVED — tests/model-pin-alarm.test.sh fails
# unless it equals cxe_pinned_apps + cxe_secret_pinned_apps (lib-convex-env.sh).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: model-pin-alarm
  namespace: openbao
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: model-pin-alarm-script
  namespace: openbao
data:
  alarm.sh: |
    #!/bin/sh
    # POSIX/ash on curlimages/curl (busybox + curl, no jq): every parse is text.
    # Tokens travel in header FILES, never argv.
    set -eu

    : "${NOTIFY_TOKEN:?MISSING REQUIRED SECRET: token (Secret talk-webhook-token, key token, ns openbao) — refusing to run an alarm that cannot report}"
    : "${ENV_NAME:?ENV_NAME must be set (branch == environment, 1:1)}"
    : "${CONSUMERS:?CONSUMERS must be set (the derived pin holders)}"
    BAO_ADDR="${BAO_ADDR:-http://openbao.openbao.svc:8200}"
    BAO_ROLE="${BAO_ROLE:-model-pin-alarm}"
    POLARIS_URL="${POLARIS_URL:-http://autorizare-svc.autorizare.svc}"
    NOTIFY_URL="${NOTIFY_URL:-http://talk-webhook.nextcloud.svc}"
    NOTIFY_CHANNEL="${NOTIFY_CHANNEL:-infra}"
    RECORD_PATH="${RECORD_PATH:-platform/automation/model-pins}"
    STATE_PATH="${STATE_PATH:-platform/automation/model-pin-alarm}"
    SA_TOKEN="${SA_TOKEN:-/var/run/secrets/kubernetes.io/serviceaccount/token}"
    W="${WORK_DIR:-/work}"
    # The estate's own pin procedure (its consumers are the estate's), when it names one.
    REPIN="${REPIN_COMMAND:-}"
    umask 077
    trap 'rm -f "$W/hdr.bao" "$W/hdr.notify" "$W/login.json" "$W/resp"' EXIT
    printf 'X-Notify-Token: %s\n' "$NOTIFY_TOKEN" > "$W/hdr.notify"
    unset NOTIFY_TOKEN

    log() { printf '%s %s\n' "$(date -u +%H:%M:%SZ)" "$*"; }
    http() { curl -sS --max-time 20 -o "$W/resp" -w '%{http_code}' "$@" 2>/dev/null || true; }
    ulid() { printf '%s' "$1" | grep -Eq '^[0-9A-HJKMNP-TV-Z]{26}$'; }
    json_escape() { sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/\\n/g'; }

    # ---- login (the pod's own ServiceAccount token, in a body FILE) ----------
    { printf '{"role":"%s","jwt":"' "$BAO_ROLE"; tr -d '\n' < "$SA_TOKEN"; printf '"}'; } > "$W/login.json"
    CODE="$(http -X POST -d @"$W/login.json" "$BAO_ADDR/v1/auth/kubernetes/login")"
    [ "$CODE" = 200 ] || { log "FATAL OpenBao login failed (HTTP $CODE, role=$BAO_ROLE)"; exit 1; }
    { printf 'X-Vault-Token: '; tr -d ' \n' < "$W/resp" | grep -o '"client_token":"[^"]*"' | head -1 | cut -d'"' -f4; } > "$W/hdr.bao"
    grep -q 'Token: .' "$W/hdr.bao" || { log "FATAL no client_token in the login response"; exit 1; }

    # ---- the release Polaris serves as current --------------------------------
    REL=""; REL_WHY=""
    CODE="$(http "$POLARIS_URL/v1/catalog/model")"
    if [ "$CODE" = 200 ]; then
      tr -d ' \n' < "$W/resp" > "$W/release.json"
      REL="$(sed -n 's/.*"modelId":"\([^"]*\)".*/\1/p' "$W/release.json")"
      if ! grep -q '"isCurrent":true' "$W/release.json"; then REL_WHY="the release it served is not marked current"; REL=""
      elif ! ulid "$REL"; then REL_WHY="the model id it served is malformed"; REL=""; fi
    else
      REL_WHY="GET $POLARIS_URL/v1/catalog/model answered HTTP $CODE"
    fi

    # ---- each consumer: the record, checked against the path's version --------
    : > "$W/verdicts"
    if [ -z "$REL" ]; then
      NOW="CANNOT_TELL polaris"
    else
      CODE="$(http -H @"$W/hdr.bao" "$BAO_ADDR/v1/secret/data/$RECORD_PATH")"
      case "$CODE" in
        200) tr -d ' \n' < "$W/resp" > "$W/record.json" ;;
        404) : > "$W/record.json" ;;
        *)   : > "$W/record.json"; log "WARN the pin record is unreadable (HTTP $CODE)" ;;
      esac
      for app in $CONSUMERS; do
        rec="$(grep -o "\"$app\":\"[^\"]*\"" "$W/record.json" | head -1 | cut -d'"' -f4 || true)"
        c="$(http -H @"$W/hdr.bao" "$BAO_ADDR/v1/secret/metadata/apps/$app/autorizare")"
        cur=""; [ "$c" = 200 ] && cur="$(tr -d ' \n' < "$W/resp" | grep -o '"current_version":[0-9]*' | head -1 | cut -d: -f2 || true)"
        recv="$(printf '%s' "$rec" | sed -n 's/^v\([0-9][0-9]*\):.*/\1/p')"
        pin="${rec#*:}"
        if [ -z "$rec" ] || [ -z "$recv" ]; then echo "$app UNKNOWN no_pin_record_yet"
        elif [ -z "$cur" ]; then echo "$app UNKNOWN the_version_of_apps/$app/autorizare_is_unreadable_(HTTP_$c)"
        elif [ "$cur" != "$recv" ]; then echo "$app UNKNOWN apps/$app/autorizare_was_written_(v$cur)_after_its_pin_was_recorded_(v$recv)"
        elif [ -z "$pin" ]; then echo "$app UNPINNED"
        elif [ "$pin" = "$REL" ]; then echo "$app CURRENT $pin"
        else echo "$app TRAILS $pin $REL"; fi
      done > "$W/verdicts"
      NOW="$(grep -v ' CURRENT ' "$W/verdicts" | sort | tr '\n' ';' | sed 's/;$//' || true)"
      [ -n "$NOW" ] || NOW="OK"
    fi

    # ---- the previous state ---------------------------------------------------
    CODE="$(http -H @"$W/hdr.bao" "$BAO_ADDR/v1/secret/data/$STATE_PATH")"
    case "$CODE" in
      200) PREV="$(tr -d '\n' < "$W/resp" | sed -n 's/.*"state" *: *"\([^"]*\)".*/\1/p')" ;;
      404) PREV="" ;;
      *)   log "FATAL the alarm's state is unreadable (HTTP $CODE)"; exit 1 ;;
    esac
    cat "$W/verdicts"

    if [ "$NOW" = "$PREV" ]; then
      log "model-pin-alarm: $NOW (unchanged — nothing posted)"; exit 0
    fi

    # ---- compose ONE message for the new state --------------------------------
    SEV=""; MSG=""; : > "$W/detail"
    if [ "$NOW" = OK ]; then
      if [ -n "$PREV" ] && [ "$PREV" != OK ]; then
        SEV=ok; MSG="[$ENV_NAME] Authorization model pins are current again — every consumer is on $REL"
      fi
    elif [ "$NOW" = "CANNOT_TELL polaris" ]; then
      SEV=warn; MSG="[$ENV_NAME] Cannot tell whether authorization pins are current — Polaris's release is unreadable"
      { echo "$REL_WHY."
        echo "The pins were NOT compared: this is not a clean bill."
        echo "Check: kubectl -n autorizare get pods -l app=autorizare-svc"; } > "$W/detail"
    else
      BEHIND="$(awk '$2 == "TRAILS" || $2 == "UNPINNED" {print $1}' "$W/verdicts" | tr '\n' ',' | sed 's/,$//; s/,/, /g')"
      UNSURE="$(awk '$2 == "UNKNOWN" {print $1}' "$W/verdicts" | tr '\n' ',' | sed 's/,$//; s/,/, /g')"
      while read -r app v a b; do
        case "$v" in
          TRAILS)   echo "$app is pinned to $a; Polaris's current release is $b." ;;
          UNPINNED) echo "$app has no pin at all." ;;
          UNKNOWN)  echo "$app: cannot tell — $(printf '%s' "$a" | tr '_' ' ')." ;;
        esac
      done < "$W/verdicts" > "$W/detail"
      if [ -n "$BEHIND" ]; then
        SEV=fail; MSG="[$ENV_NAME] Authorization model pins are behind Polaris's release: $BEHIND"
        { echo "Until they move, a Convex mirror refuses every feed and a secret-pinned service decides under the old model."
          if [ -n "$REPIN" ]; then echo "Fix (one operation, every consumer): $REPIN --current"
          else echo "Fix (one operation, every consumer): the estate's pin procedure, onto the current release — never a bare bao kv patch"; fi; } >> "$W/detail"
      else
        SEV=warn; MSG="[$ENV_NAME] Cannot tell whether these authorization pins are current: $UNSURE"
      fi
      if [ -n "$UNSURE" ]; then
        if [ -n "$REPIN" ]; then echo "Re-read every pin (moves none): $REPIN --record" >> "$W/detail"
        else echo "Re-read every pin (moves none) with the estate's pin procedure, which rewrites the record" >> "$W/detail"; fi
      fi
    fi

    if [ -n "$SEV" ]; then
      printf '{"severity": "%s", "message": "%s", "detail": "%s"}\n' \
        "$SEV" "$(printf '%s' "$MSG" | json_escape)" "$(json_escape < "$W/detail")" > "$W/notify.json"
      CODE="$(http -X POST -H @"$W/hdr.notify" -H 'Content-Type: application/json' \
        -d @"$W/notify.json" "$NOTIFY_URL/notify/$NOTIFY_CHANNEL")"
      if [ "$CODE" != 200 ]; then
        log "FATAL could not deliver to #$NOTIFY_CHANNEL (HTTP $CODE) — state NOT advanced, the next tick retries"
        log "model-pin-alarm: $NOW (UNDELIVERED)"
        exit 1
      fi
      log "posted to #$NOTIFY_CHANNEL ($SEV)"
    fi

    # ---- remember the state (only once its message is out) --------------------
    printf '{"data":{"state":"%s"}}\n' "$NOW" > "$W/state.json"
    CODE="$(http -X POST -H @"$W/hdr.bao" -H 'Content-Type: application/json' \
      -d @"$W/state.json" "$BAO_ADDR/v1/secret/data/$STATE_PATH")"
    case "$CODE" in
      200|204) ;;
      *) log "FATAL state write failed (HTTP $CODE) — the next tick would post this again"; exit 1 ;;
    esac
    log "model-pin-alarm: $NOW"
    exit 0
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-pin-alarm
  namespace: openbao
  annotations:
    alerts.psizone.ro/owner: WLOPSEMAIL
spec:
  schedule: "*/5 * * * *"
  # Forbid: two ticks reading the same state would post the same message twice.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      # The retry IS the next tick (the state is only advanced after delivery).
      backoffLimit: 0
      activeDeadlineSeconds: 180
      template:
        metadata:
          labels:
            app: model-pin-alarm
        spec:
          serviceAccountName: model-pin-alarm
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100 # curlimages/curl's own unprivileged user
            runAsGroup: 100
            fsGroup: 100
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: script
              configMap:
                name: model-pin-alarm-script
                defaultMode: 0555
            - name: work
              emptyDir: {}
          containers:
            - name: alarm
              image: curlimages/curl:8.5.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 100m, memory: 96Mi }
              env:
                # branch == environment, 1:1 — the `prod` branch's copy says "prod".
                - name: ENV_NAME
                  value: dev
                # DERIVED: cxe_pinned_apps + cxe_secret_pinned_apps
                # (infrastructure/hetzner/scripts/lib-convex-env.sh), in that
                # order. tests/model-pin-alarm.test.sh fails when they differ —
                # a new pin holder joins CXE_SECRET_PINNED AND this line.
                - name: CONSUMERS
                  value: "rmx-brs rmx-sign flow-platform rmx-invoice-svc vega authentik-tiles"
                - name: BAO_ADDR
                  value: http://openbao.openbao.svc:8200
                - name: POLARIS_URL
                  value: http://autorizare-svc.autorizare.svc
                # The IN-CLUSTER translator: these fire when things are broken, so
                # they must not depend on Traefik, DNS or the public certificate.
                - name: NOTIFY_URL
                  value: http://talk-webhook.nextcloud.svc
                - name: NOTIFY_CHANNEL
                  value: infra
                # SEND-ONLY bearer (not the bot signing key). Required: the script
                # exits naming the key when it is missing or empty. Every tick is a
                # fresh pod, so a rotation needs no Reloader.
                - name: NOTIFY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: talk-webhook-token
                      key: token
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
              command: ["/bin/sh", "/scripts/alarm.sh"]
