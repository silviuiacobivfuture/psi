# The ONE script both credential-issuer token reconciles run (invoicing and
# autorizare), on the one directory. It was a 400-line inline command in a
# single CronJob; a second service needing the same dedicated, narrowly
# permissioned token made it the third copy of one job across the tree, so it
# lives here once and each CronJob supplies only what differs (its env:
# JOB_NAME, AK_SERVICE_ACCOUNT, AK_ROLE, AK_TOKEN_IDENTIFIER, AK_TOKEN_DESCRIPTION,
# BAO_ROLE, TOKEN_SECRET_PATH). The full reasoning for every step is in the
# comments inside the script. docs/autorizare/18-sso-authentik-unic.md, step 2.
#
# It is the business directory's script with ONLY the instance and the token
# description parameterised (checked 2026-10-22 by a normalised diff: 289 lines
# each, 6 differing, all of them JOB_NAME / AK_TOKEN_DESCRIPTION). Both steps that
# matter beyond minting are kept here deliberately:
#   * step 9, the HS256 re-key of any `masina-*` provider without a signing key.
#     New issuing and every audited roll create a fresh provider WITH a key
#     (identitate.Issue sets signing_key), and copying providers across was
#     refused, so no known path puts a keyless one here — the step stays as the
#     guard for the path nobody knows yet. Proven on dev: a planted keyless
#     provider was re-keyed by the autorizare job on its first run.
#   * the held.txt comparison: the role's permissions are compared with
#     AK_PERMISSIONS on every run and only the missing ones assigned, so a
#     permission removed by hand comes back and none is ever granted twice.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-credential-token-reconcile
  namespace: authentik
data:
  reconcile.sh: |
    set -eu

    W=/work
    J="${JOB_NAME:?JOB_NAME is required}"

    die()  { echo "$J: FAILED — $*" >&2; exit 1; }
    note() { echo "$J: $*"; }

    # Present-but-EMPTY is the case ESO's data[] cannot catch.
    [ -n "${AUTHENTIK_BOOTSTRAP_TOKEN:-}" ] || die "MISSING REQUIRED SECRET: authentik-env/AUTHENTIK_BOOTSTRAP_TOKEN"

    umask 077

    # http <outfile> <curl args...> -> prints the status code
    # ("000" on a transport error) instead of aborting, so every
    # failure is reported with its own named message.
    http() {
      _out="$1"; shift
      _code="$(curl -sS --max-time 30 -o "$_out" -w '%{http_code}' "$@" 2>>"$W/curl.err")" || _code=000
      printf '%s' "$_code"
    }
    # Authentik's own words. `|| true` matters: without it a
    # non-JSON body makes jq fail, `set -e` aborts mid-argument and
    # the job dies with NO named reason.
    emsg() { (jq -r '(.detail // .non_field_errors[0]? // empty)' "$1" 2>/dev/null || head -c 300 "$1") | head -c 300; }

    # Every credential reaches curl through a FILE, never argv:
    # `ps` and /proc/<pid>/cmdline are readable inside this pod.
    # printf is a shell builtin, so the value never becomes an
    # exec'd argv.
    printf 'header = "Authorization: Bearer %s"\n' "$AUTHENTIK_BOOTSTRAP_TOKEN" > "$W/ak.cfg"
    printf 'header = "Content-Type: application/json"\n' >> "$W/ak.cfg"

    # --- 1. OpenBao, and what it already holds -------------------
    # A hard failure, unlike reportportal's warning: storing the
    # token IS this job's output, so without OpenBao there is
    # nothing useful left for it to do.
    { printf '{"role":"%s","jwt":"' "$BAO_ROLE"; tr -d '\n' < /var/run/secrets/kubernetes.io/serviceaccount/token; printf '"}'; } > "$W/login.json"
    BC="$(http "$W/bao.json" -X POST --data-binary "@$W/login.json" "$BAO_ADDR/v1/auth/kubernetes/login")"
    [ "$BC" = 200 ] || die "OpenBao login refused (HTTP $BC, role=$BAO_ROLE). Is the role bound? see infrastructure/hetzner/scripts/openbao-bootstrap.sh"
    # `jq -j`, NOT `-r`. `-r` appends a newline, which lands INSIDE
    # the quoted header value and splits it across two lines; curl's
    # config parser then hits an unterminated quote and EXITS
    # NON-ZERO, which this script records as HTTP 000. The failure
    # then reads as "check the policy" while the policy is perfect —
    # it cost an hour of looking at OpenBao instead of at curl.
    { printf 'header = "X-Vault-Token: '; jq -j '.auth.client_token' "$W/bao.json"; printf '"\n'; } > "$W/bao.cfg"
    printf 'header = "Content-Type: application/json"\n' >> "$W/bao.cfg"

    RC="$(http "$W/cur.json" -K "$W/bao.cfg" "$BAO_ADDR/v1/secret/data/$TOKEN_SECRET_PATH")"
    case "$RC" in
      200) CUR_DATA="$(jq -c '.data.data // {}' "$W/cur.json")" ;;
      # 404 is the path never seeded. Not fatal: this job creates
      # it, and seed-secrets.sh creating it empty is a courtesy.
      404) CUR_DATA='{}' ;;
      *)   die "reading secret/$TOKEN_SECRET_PATH -> HTTP $RC (expected 200 or 404) — check the $BAO_ROLE policy" ;;
    esac
    # `jq -j`, NOT `-r`, and it is load-bearing twice over. `-r`
    # appends a newline, so an EMPTY field would write one byte and
    # `[ -s ]` below would call the empty slot non-empty — the job
    # would then "validate" a blank bearer token instead of
    # recognising the state it exists to fix. `-j` also makes this
    # file byte-comparable with key.txt at the end, so an unchanged
    # token does not rewrite OpenBao on every run.
    printf '%s' "$CUR_DATA" | jq -j --arg f "$TOKEN_SECRET_FIELD" '.[$f] // ""' > "$W/stored.txt"

    # --- 2. does the stored token still authenticate? ------------
    # /core/users/me/ and NOT a providers/oauth2 list, which would
    # be a validation that cannot fail: Authentik's ObjectFilter
    # answers a LIST request from an unpermissioned token with 200
    # and an empty page rather than 403, so it proves nothing. The
    # GRANT is verified separately, below, against the directory
    # itself — which is the only place it can be read honestly.
    STORED_STATE=empty
    if [ -s "$W/stored.txt" ]; then
      { printf 'header = "Authorization: Bearer '; tr -d '\n' < "$W/stored.txt"; printf '"\n'; } > "$W/stored.cfg"
      VC="$(http "$W/me.json" -K "$W/stored.cfg" "$AK_API/api/v3/core/users/me/")"
      case "$VC" in
        200)     STORED_STATE=valid ;;
        401|403) STORED_STATE=stale; note "the stored token no longer authenticates (HTTP $VC) — repairing" ;;
        # Anything else means the answer is UNKNOWN. Acting on an
        # unknown is how a working credential gets replaced because
        # the server happened to be restarting.
        *) note "WARN could not validate the stored token (HTTP $VC) — leaving everything alone rather than acting on a transient error"; exit 0 ;;
      esac
    else
      note "the token slot at secret/$TOKEN_SECRET_PATH is EMPTY"
    fi

    # --- 3. the service account ---------------------------------
    C="$(http "$W/users.json" -K "$W/ak.cfg" "$AK_API/api/v3/core/users/?type=service_account&username=$AK_SERVICE_ACCOUNT")"
    [ "$C" = 200 ] || die "GET /core/users/ -> $C: $(emsg "$W/users.json")"
    USER_PK="$(jq -r --arg u "$AK_SERVICE_ACCOUNT" 'first(.results[]? | select(.username == $u) | .pk) // ""' "$W/users.json")"
    if [ -z "$USER_PK" ]; then
      # POST /core/users/ rather than /core/users/service_account/:
      # that convenience endpoint mints its token with intent
      # `app_password`, and authentik/api/authentication.py accepts
      # ONLY intent `api` as a bearer credential — so its token
      # would 401 on every call this service makes. Verified
      # against 2026.5.3 on 2026-09-02.
      jq -n --arg u "$AK_SERVICE_ACCOUNT" \
        '{username:$u, name:$u, type:"service_account", path:"users/service-accounts", is_active:true}' > "$W/body.json"
      C="$(http "$W/user.json" -K "$W/ak.cfg" -X POST --data-binary "@$W/body.json" "$AK_API/api/v3/core/users/")"
      case "$C" in 200|201) : ;; *) die "POST /core/users/ -> $C: $(emsg "$W/user.json")" ;; esac
      USER_PK="$(jq -r '.pk' "$W/user.json")"
      note "created service account '$AK_SERVICE_ACCOUNT' (pk $USER_PK)"
    fi
    [ -n "$USER_PK" ] || die "the service account '$AK_SERVICE_ACCOUNT' has no pk — the directory answered in a shape this job does not understand"

    # --- 4. the role --------------------------------------------
    # /rbac/roles/ has no exact-name filter, so search and match
    # client-side: `search` is a substring match and would happily
    # return a role whose name merely contains this one.
    C="$(http "$W/roles.json" -K "$W/ak.cfg" "$AK_API/api/v3/rbac/roles/?page_size=100&search=$AK_ROLE")"
    [ "$C" = 200 ] || die "GET /rbac/roles/ -> $C: $(emsg "$W/roles.json")"
    ROLE_PK="$(jq -r --arg n "$AK_ROLE" 'first(.results[]? | select(.name == $n) | .pk) // ""' "$W/roles.json")"
    if [ -z "$ROLE_PK" ]; then
      jq -n --arg n "$AK_ROLE" '{name:$n}' > "$W/body.json"
      C="$(http "$W/role.json" -K "$W/ak.cfg" -X POST --data-binary "@$W/body.json" "$AK_API/api/v3/rbac/roles/")"
      case "$C" in 200|201) : ;; *) die "POST /rbac/roles/ -> $C: $(emsg "$W/role.json")" ;; esac
      ROLE_PK="$(jq -r '.pk' "$W/role.json")"
      note "created role '$AK_ROLE' ($ROLE_PK)"
    fi
    [ -n "$ROLE_PK" ] || die "the role '$AK_ROLE' has no pk"

    # --- 5. the membership --------------------------------------
    # Asked of the ROLE list filtered by user, so the answer comes
    # from the same collection the previous step read.
    C="$(http "$W/myroles.json" -K "$W/ak.cfg" "$AK_API/api/v3/rbac/roles/?page_size=100&users=$USER_PK")"
    [ "$C" = 200 ] || die "GET /rbac/roles/?users= -> $C: $(emsg "$W/myroles.json")"
    if ! jq -e --arg p "$ROLE_PK" 'any(.results[]?; .pk == $p)' "$W/myroles.json" >/dev/null; then
      jq -n --argjson pk "$USER_PK" '{pk:$pk}' > "$W/body.json"
      C="$(http "$W/resp.json" -K "$W/ak.cfg" -X POST --data-binary "@$W/body.json" "$AK_API/api/v3/rbac/roles/$ROLE_PK/add_user/")"
      case "$C" in 200|204) note "added '$AK_SERVICE_ACCOUNT' to role '$AK_ROLE'" ;; *) die "POST /rbac/roles/$ROLE_PK/add_user/ -> $C: $(emsg "$W/resp.json")" ;; esac
    fi

    # --- 6. the permissions -------------------------------------
    # Read what the role already holds, assign only what is
    # missing. This is also the REPAIR path for a permission
    # removed by hand: the token would still authenticate, so
    # nothing else here would notice.
    #
    # THE `model` PARAMETER IS REQUIRED BY THE ENDPOINT AND SELECTS
    # NOTHING. Measured 2026-09-02: omitting it answers 400
    # `{"model":["This field is required."]}`, while asking with
    # `model=authentik_providers_oauth2.oauth2provider` returns
    # `model_permissions` carrying every permission the role holds
    # across every app — "authentik Read-only" came back with 130
    # of them, from auth.view_group to authentik_tenants.view_domain.
    #
    # So the jq must NOT narrow on `.model`, and until 2026-09-02
    # it did. That narrowing threw away exactly the cross-model
    # grants: `authentik_flows.view_flow` could never appear in
    # held.txt, was reported MISSING on every single run, and was
    # re-assigned every time — the "already holds every required
    # permission" branch below was unreachable. Adding the five
    # application grants would have made four more permanently
    # missing. Selecting on `role_pk` is what makes this correct:
    # every permission in that role's list IS held by that role.
    #
    # The `model` value below is therefore just a valid argument to
    # satisfy the parameter, not a filter anything depends on.
    C="$(http "$W/perms.json" -K "$W/ak.cfg" "$AK_API/api/v3/rbac/permissions/assigned_by_roles/?model=authentik_providers_oauth2.oauth2provider&page_size=100")"
    [ "$C" = 200 ] || die "GET /rbac/permissions/assigned_by_roles/ -> $C: $(emsg "$W/perms.json")"
    jq -r --arg p "$ROLE_PK" \
      '[.results[]? | select(.role_pk == $p) | .model_permissions[]? | .app_label + "." + .codename] | .[]' \
      "$W/perms.json" | sort -u > "$W/held.txt"
    MISSING=""
    for P in $AK_PERMISSIONS; do
      grep -qx "$P" "$W/held.txt" || MISSING="$MISSING $P"
    done
    if [ -n "$MISSING" ]; then
      # Assigned WITHOUT `model`/`object_pk`, which is what makes
      # them GLOBAL rather than scoped to one provider — the role
      # must be able to create providers that do not exist yet.
      printf '%s\n' $MISSING | jq -Rs 'split("\n") | map(select(length > 0)) | {permissions: .}' > "$W/body.json"
      C="$(http "$W/assign.json" -K "$W/ak.cfg" -X POST --data-binary "@$W/body.json" "$AK_API/api/v3/rbac/permissions/assigned_by_roles/$ROLE_PK/assign/")"
      case "$C" in 200|201|204) note "assigned to '$AK_ROLE':$MISSING" ;; *) die "POST assign -> $C: $(emsg "$W/assign.json")" ;; esac
    else
      note "role '$AK_ROLE' already holds every required permission"
    fi

    # --- 7. the token -------------------------------------------
    C="$(http "$W/tokens.json" -K "$W/ak.cfg" "$AK_API/api/v3/core/tokens/?identifier=$AK_TOKEN_IDENTIFIER&intent=api")"
    [ "$C" = 200 ] || die "GET /core/tokens/ -> $C: $(emsg "$W/tokens.json")"
    HAVE="$(jq -rc --arg i "$AK_TOKEN_IDENTIFIER" 'first(.results[]? | select(.identifier == $i)) // empty' "$W/tokens.json")"
    if [ -z "$HAVE" ]; then
      jq -n --arg d "$AK_TOKEN_DESCRIPTION" --arg i "$AK_TOKEN_IDENTIFIER" --argjson u "$USER_PK" \
        '{identifier:$i, intent:"api", user:$u, expiring:false, description:$d}' > "$W/body.json"
      C="$(http "$W/token.json" -K "$W/ak.cfg" -X POST --data-binary "@$W/body.json" "$AK_API/api/v3/core/tokens/")"
      case "$C" in 200|201) note "minted API token '$AK_TOKEN_IDENTIFIER'" ;; *) die "POST /core/tokens/ -> $C: $(emsg "$W/token.json")" ;; esac
    elif printf '%s' "$HAVE" | jq -e '.expiring == true' >/dev/null; then
      # The one targeted write to an existing object, and only ever
      # to the one THIS job manages. An expiring credential goes
      # stale on a date nobody is watching, and the failure looks
      # exactly like the bug this file exists to close.
      printf '{"expiring": false, "expires": null}' > "$W/body.json"
      C="$(http "$W/patch.json" -K "$W/ak.cfg" -X PATCH --data-binary "@$W/body.json" "$AK_API/api/v3/core/tokens/$AK_TOKEN_IDENTIFIER/")"
      case "$C" in 200) note "token '$AK_TOKEN_IDENTIFIER' was expiring — made permanent" ;; *) die "PATCH /core/tokens/$AK_TOKEN_IDENTIFIER/ -> $C: $(emsg "$W/patch.json")" ;; esac
    fi

    # Authentik stores an API token's key in cleartext and serves
    # it here, so the token is READ rather than re-minted: a stale
    # OpenBao copy is a mirroring problem, and minting a second
    # token to fix a mirroring problem leaves the first one live.
    C="$(http "$W/key.json" -K "$W/ak.cfg" "$AK_API/api/v3/core/tokens/$AK_TOKEN_IDENTIFIER/view_key/")"
    [ "$C" = 200 ] || die "GET /core/tokens/$AK_TOKEN_IDENTIFIER/view_key/ -> $C: $(emsg "$W/key.json")"
    # `-j` for the same two reasons as stored.txt above.
    jq -j '.key // ""' "$W/key.json" > "$W/key.txt"
    [ -s "$W/key.txt" ] || die "view_key answered 200 with no key for '$AK_TOKEN_IDENTIFIER'"

    # It must actually work before it is stored. Storing a value
    # that 401s is the same class of defect as storing a random
    # one: present, plausible, and dead at the first call.
    { printf 'header = "Authorization: Bearer '; tr -d '\n' < "$W/key.txt"; printf '"\n'; } > "$W/new.cfg"
    C="$(http "$W/newme.json" -K "$W/new.cfg" "$AK_API/api/v3/core/users/me/")"
    [ "$C" = 200 ] || die "the token this job maintains does not authenticate (HTTP $C on /core/users/me/) — it was minted, permissioned and then refused, so something outside this job is rejecting it"

    # --- 8. write it back ---------------------------------------
    if cmp -s "$W/key.txt" "$W/stored.txt"; then
      note "OpenBao already holds the current token (state: $STORED_STATE)"
    else
      # MERGE into the existing data map: a KV v2 write creates a
      # whole new version, so a bare {token} would DROP any other
      # field on this path.
      jq -n --argjson cur "$CUR_DATA" --arg f "$TOKEN_SECRET_FIELD" --rawfile k "$W/key.txt" \
        '{data: ($cur + {($f): ($k | rtrimstr("\n"))})}' > "$W/body.json"
      WC="$(http "$W/resp.json" -K "$W/bao.cfg" -X POST --data-binary "@$W/body.json" "$BAO_ADDR/v1/secret/data/$TOKEN_SECRET_PATH")"
      case "$WC" in
        200|204) note "wrote the token to secret/$TOKEN_SECRET_PATH (previous state: $STORED_STATE)" ;;
        *) die "the token is valid but FAILED to write to secret/$TOKEN_SECRET_PATH (HTTP $WC) — check the $BAO_ROLE policy; nothing was lost, the key is re-readable from Authentik" ;;
      esac
    fi

    # --- 9. machine providers that sign with HS256 --------------
    # @rule MACH-1 — the BACKFILL, and the reason it is a job step
    # rather than a note in a runbook. Every credential issued
    # before the issuer learned to set `signing_key` has none, so
    # it mints HS256 tokens signed with a client secret nothing on
    # this platform keeps. The issuer no longer creates them that
    # way; this repairs the ones that already exist, and it is
    # written here because this repository treats an un-scripted
    # manual step as a defect in its own right.
    #
    # IDEMPOTENT and NARROW. It touches only providers whose
    # application slug carries the machine prefix, and only those
    # whose signing key is actually null — so a second run does
    # nothing, and an interactive application is never a candidate
    # even if somebody cleared its key by hand.
    #
    # `superuser_full_list=true` is REQUIRED on the applications
    # list. Without it Authentik answers even akadmin with an
    # empty page, because the viewset filters by the requesting
    # user's explicit object permissions rather than by superuser
    # status — measured 2026-09-02, and it reads exactly like
    # "there are no machine credentials" when there are two.
    C="$(http "$W/apps.json" -K "$W/ak.cfg" "$AK_API/api/v3/core/applications/?page_size=500&superuser_full_list=true")"
    [ "$C" = 200 ] || die "GET /core/applications/ -> $C: $(emsg "$W/apps.json")"
    jq -r '[.results[]? | select(.slug | startswith("masina-")) | .provider | select(. != null)] | .[]' \
      "$W/apps.json" | sort -u > "$W/machine-providers.txt"

    if [ ! -s "$W/machine-providers.txt" ]; then
      note "no machine credentials exist yet — nothing to backfill"
    else
      C="$(http "$W/provs.json" -K "$W/ak.cfg" "$AK_API/api/v3/providers/oauth2/?page_size=500")"
      [ "$C" = 200 ] || die "GET /providers/oauth2/ -> $C: $(emsg "$W/provs.json")"
      jq -r '[.results[]? | select(.signing_key == null) | .pk] | .[]' "$W/provs.json" | sort -u > "$W/unsigned.txt"
      UNSIGNED="$(comm -12 "$W/machine-providers.txt" "$W/unsigned.txt" | tr '\n' ' ')"

      if [ -z "$(printf '%s' "$UNSIGNED" | tr -d ' ')" ]; then
        note "every machine credential already signs with an asymmetric key"
      else
        # Resolved by NAME, exactly as the adapter resolves it, so
        # the job and the service cannot disagree about which key
        # a credential signs with.
        C="$(http "$W/certs.json" -K "$W/ak.cfg" "$AK_API/api/v3/crypto/certificatekeypairs/?name=$AK_SIGNING_CERT_ENC")"
        [ "$C" = 200 ] || die "GET /crypto/certificatekeypairs/ -> $C: $(emsg "$W/certs.json")"
        CERT_PK="$(jq -r --arg n "$AK_SIGNING_CERT" 'first(.results[]? | select(.name == $n) | .pk) // ""' "$W/certs.json")"
        [ -n "$CERT_PK" ] || die "the directory has no certificate-key pair named '$AK_SIGNING_CERT'; machine credentials cannot be repaired until it exists"

        for PPK in $UNSIGNED; do
          jq -n --arg k "$CERT_PK" '{signing_key:$k}' > "$W/body.json"
          C="$(http "$W/patch.json" -K "$W/ak.cfg" -X PATCH --data-binary "@$W/body.json" "$AK_API/api/v3/providers/oauth2/$PPK/")"
          case "$C" in 200) note "provider $PPK now signs with '$AK_SIGNING_CERT' (was HS256)" ;; *) die "PATCH /providers/oauth2/$PPK/ -> $C: $(emsg "$W/patch.json")" ;; esac
        done
      fi
    fi

    note "done — service account '$AK_SERVICE_ACCOUNT', role '$AK_ROLE', token '$AK_TOKEN_IDENTIFIER'"
