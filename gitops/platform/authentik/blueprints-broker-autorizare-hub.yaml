# Authentik Blueprint ConfigMap — THE LOGIN HUB'S BROKER CLIENT.
# docs/autorizare/18-sso-authentik-unic.md step 4; the hub's design is
# docs/autorizare/21-hub-organizatii-widgeturi.md (D23: autorizare is the only
# relying party of Authentik for business applications).
#
# Every business application (BRS, Sign, flow-platform, the autorizare console)
# signs in through the hub at id.<apex>, and the hub signs in HERE, through
# this one confidential client. Infra tools keep their own clients
# (blueprints-providers.yaml).
#
# Named `blueprints-broker-*`, not `blueprints-sso-*`: that prefix belongs to
# authz/tools/generate.py, which emits one per app manifest, and the wiring gate
# refuses an `sso` blueprint no manifest declares. The hub is not an application
# with a capability manifest; it is the broker in front of them.
#
# Credentials: secret/platform/authentik/autorizare-hub-oidc {client_id,
# client_secret} — seeded by seed-secrets.sh, synced by the
# authentik-oidc-clients ExternalSecret into AUTHENTIK_OIDC__AUTORIZARE_HUB__*,
# read by the hub from the same path. Never copied through a UI.
#
# Decisions carried here:
#   * sub_mode hashed_user_id — a STABLE subject that is not the e-mail
#     (addresses change and get reused). The hub links (issuer, sub) to its own
#     person id (D25) and never uses this value as anybody's id.
#   * authentication_flow = default-authentication-flow — password + mandatory
#     TOTP (blueprints-mfa.yaml). Authentik emits `amr: ["pwd", "mfa"]` natively
#     when the login's validate stage used a device; the hub refuses an id_token
#     without "mfa" (HUB_REQUIRE_MFA=true). Proven on dev 2026-10-22, see doc 18.
#   * NO policy binding: everyone who signs in to any business application signs
#     in through this one client; what they may do is decided by the hub and
#     autorizare, not by an Authentik group (agreed with the hub lane).
#   * Redirect URIs at the hub's ONE address, id.<apex> (owner's choice,
#     2026-10-23). Its former address is not served since the move off `.dev`
#     (2026-10-24), and nothing else is registered.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-broker-autorizare-hub
  namespace: authentik
data:
  broker-autorizare-hub.yaml: |
    version: 1
    metadata:
      name: WLSLUG-broker-autorizare-hub
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    context:
      client_id:     !Env [AUTHENTIK_OIDC__AUTORIZARE_HUB__ID, ""]
      client_secret: !Env [AUTHENTIK_OIDC__AUTORIZARE_HUB__SECRET, ""]
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        # A blank id would create a provider every sign-in fails against with
        # `invalid_client`; until the secret has synced, the entry is skipped.
        conditions:
          - !Condition [AND, !Context client_id, !Context client_secret]
        identifiers:
          name: autorizare-hub
        attrs:
          client_type: confidential
          client_id: !Context client_id
          client_secret: !Context client_secret
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          grant_types:
            - authorization_code
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          # `default-invalidation-flow`, NOT `default-provider-invalidation-flow`.
          # Measured on dev 2026-10-23: the provider flow has NO stage bound, so an
          # end-session through it said "logged out of application" and left the
          # Authentik session alive — the next sign-in at the hub went straight
          # through with no password, which is exactly the "sign out does not sign
          # me out" the owner reported. This one carries the user-logout stage
          # (default-invalidation-logout), so signing out of the estate ends the
          # one Authentik session too.
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          sub_mode: hashed_user_id
          include_claims_in_id_token: true
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          redirect_uris:
            - matching_mode: strict
              url: https://id.WLDOMAIN/hub/callback
            # RP-initiated logout returns here (post_logout_redirect_uri). In
            # Authentik 2026.5 the type is `logout` (RedirectURIType.LOGOUT).
            - matching_mode: strict
              url: https://id.WLDOMAIN/hub/signed-out
              redirect_uri_type: logout
      # How long a login lasts is part of the sign-out: when Authentik cannot be reached
      # the hub's pages tell a person that closing the browser ends the session, and
      # that is only true of a session cookie. seconds=0 is that cookie (Authentik's
      # stock value, declared so nobody moves it without moving the page). Every login
      # stage in use; WLSLUG-enrollment-login declares its own in blueprints-enrollment.yaml.
      # doctor reads them (ak-hub-shape.py); sso-signout-outage.sh refuses another value.
      - model: authentik_stages_user_login.userloginstage
        identifiers:
          name: default-authentication-login
        attrs:
          session_duration: seconds=0
      - model: authentik_stages_user_login.userloginstage
        identifiers:
          name: default-source-authentication-login
        attrs:
          session_duration: seconds=0
      - model: authentik_stages_user_login.userloginstage
        identifiers:
          name: default-source-enrollment-login
        attrs:
          session_duration: seconds=0
      - model: authentik_core.application
        conditions:
          - !Condition [AND, !Context client_id, !Context client_secret]
        identifiers:
          slug: autorizare-hub
        attrs:
          name: RECOMEX
          # The hub's tile is the door to every estate application: it wears their six
          # marks, three by two (packages/rmx-ui/scripts/authentik-tiles.mjs). Each
          # application has its own tile too (blueprints-estate-tiles.yaml), and each
          # carries this application's bindings — so add one here and regenerate.
          meta_icon: /static/dist/assets/recomex/app-autorizare-hub.svg
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, autorizare-hub]]
          meta_launch_url: https://id.WLDOMAIN
