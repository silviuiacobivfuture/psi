# Authentik Blueprint ConfigMap — psi's agent-studio (apps/agent-studio, https://studio.psizone.ro):
# its two groups, its forward-auth proxy provider and application, and who may pass the gate.
#
# NOT YET WIRED (docs/plans/agent-studio.md, Registration): this ConfigMap must be listed in this
# directory's kustomization.yaml AND under blueprints.configMaps in
# gitops/apps/overlays/dev/authentik.yaml, as authentik-blueprints-cms is; and the `agent-studio`
# provider must be added to the embedded outpost's provider list in blueprints-providers.yaml —
# that list REPLACES the outpost's set, so it cannot be appended from here.
#
# Mode forward_single, as pdfcraft, novu and plunk: the outpost looks the Host up exactly among the
# per-host providers before the domain-wide one, so ONLY the bindings below decide who reaches
# studio.psizone.ro — never Plane's. The application slug is load-bearing: Authentik's issuer is
# per application (https://auth.psizone.ro/application/o/agent-studio/), and the pod refuses a gate
# token with any other issuer (AUTHENTIK_GATE_ISSUER in gitops/services/agent-studio).
#
# No client id or secret here: a proxy provider's are generated by Authentik and not settable from
# a blueprint, and its tokens are HS256 under that secret (ProxyProvider.set_oauth_defaults forces
# signing_key to None). The pod therefore confirms each gate token with Authentik's userinfo
# endpoint instead of verifying a signature (apps/agent-studio/src/auth/verify-gate.ts).
#
# Sign-out goes through default-invalidation-flow (the one with the user-logout stage), as every
# provider here does (.github/scripts/sso-signout.sh refuses the stage-less flow).
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-agent-studio
  namespace: authentik
data:
  agent-studio.yaml: |
    version: 1
    metadata:
      name: psi-agent-studio
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # Studio's two roles (apps/agent-studio/authz.manifest.json): view, and operate (run agents,
      # tools and workflows — it spends OpenRouter credit). Membership is granted in the directory.
      - model: authentik_core.group
        identifiers:
          name: app-agent-studio-viewer
        attrs:
          is_superuser: false
      - model: authentik_core.group
        identifiers:
          name: app-agent-studio-operator
        attrs:
          is_superuser: false
      - model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: agent-studio
        attrs:
          mode: forward_single
          external_host: https://studio.psizone.ro
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          access_token_validity: hours=24
      - model: authentik_core.application
        identifiers:
          slug: agent-studio
        attrs:
          name: Agent Studio
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, agent-studio]]
          meta_launch_url: https://studio.psizone.ro
          meta_description: Mastra Studio — the guides' agents, traces and threads
      # Without a binding an application lets ANY authenticated user through. Three bindings,
      # engine mode `any`: the two Studio groups, and `authentik Admins` (Authentik's own superuser
      # group, present in every directory) as break-glass — a binding must never lock the operator
      # out, and a group another blueprint creates may not exist when this one is applied.
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, agent-studio]]
          group: !Find [authentik_core.group, [name, app-agent-studio-viewer]]
        attrs: { negate: false, enabled: true, order: 0 }
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, agent-studio]]
          group: !Find [authentik_core.group, [name, app-agent-studio-operator]]
        attrs: { negate: false, enabled: true, order: 1 }
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, agent-studio]]
          group: !Find [authentik_core.group, [name, authentik Admins]]
        attrs: { negate: false, enabled: true, order: 2 }
