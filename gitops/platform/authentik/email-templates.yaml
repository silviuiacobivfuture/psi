# The directory's own mail, in Romanian — the set-password link every person
# receives first (doc 18, step 3), and the same mail for "Ai uitat parola?".
#
# Mounted at /templates/recomex/ on server AND worker (global.volumes in
# gitops/apps/overlays/dev/authentik.yaml): Authentik's `email.template_dir` is
# /templates and an email stage names a custom template by its path relative to
# it, here `recomex/setare-parola.html` (blueprints-recovery.yaml). The worker
# is the half that renders and sends; the server lists the choice in the UI.
# The `.txt` beside it is the plain-text part — Authentik looks it up by
# replacing `html` with `txt` in the name, so the two names must stay paired.
#
# What the mail must say, and why: it is the first contact somebody has with the
# new sign-in, so it states the whole journey — choose a password, then sign in
# with e-mail + password, then enrol the authenticator app (TOTP) the first time
# — and that the link is single-use with an end date. The date comes from the
# token (`expires`), never a number written here, so the mail cannot disagree
# with `token_expiry` in the blueprint. It is shown in Romania's time.
#
# THE LOOK (`base.html`, which every Recomex mail extends instead of Authentik's
# own `email/base.html`): the estate's light theme — a mail client cannot read a
# CSS variable, so each colour is the sRGB of a token in packages/rmx-ui/src/
# tokens.css (`:root`), and the drift test (packages/rmx-ui/src/__tests__/
# authentik-theme.test.ts) fails on any colour here that is not one. The logo is
# `cid:logo`: Authentik attaches web/icons/icon_left_brand.png to every mail it
# sends, and that path is the estate's wordmark (estate/mail-logo.png, mounted
# by the Helm values) — so the mail shows it without loading anything remote.
# Tables and inline styles only, because that is what mail clients render.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-email-templates
  namespace: authentik
data:
  base.html: |
    <!DOCTYPE html>
    <html lang="ro">
      <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="color-scheme" content="light">
        <meta name="supported-color-schemes" content="light">
        <title>WLBRAND</title>
      </head>
      <body style="margin: 0; padding: 0; background-color: #f9fafd;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f9fafd" style="background-color: #f9fafd;">
          <tr>
            <td align="center" style="padding: 32px 16px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 520px;">
                <tr>
                  <td align="left" style="padding: 0 4px 20px 4px;">
                    <img src="cid:logo" alt="WLBRAND" width="252" height="40" style="display: block; width: 252px; height: 40px; border: 0;">
                  </td>
                </tr>
                <tr>
                  <td bgcolor="#fcfeff" style="background-color: #fcfeff; border: 1px solid #e1e5ed; border-radius: 12px; padding: 32px 28px; font-family: Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; line-height: 1.6; color: #0e192e;">
                    {% block content %}{% endblock %}
                  </td>
                </tr>
                <tr>
                  <td style="padding: 20px 4px 0 4px; font-family: Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 12px; line-height: 1.6; color: #525d70;">
                    {% block sub_content %}{% endblock %}
                    <p style="margin: 12px 0 0 0;">WLBRAND — mesaj trimis automat. Nu răspunde la acest e-mail.</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </body>
    </html>
  setare-parola.html: |
    {% extends "recomex/base.html" %}
    {% load tz %}
    {% block content %}
    <h1 style="margin: 0 0 16px 0; font-size: 22px; line-height: 1.3; font-weight: 600; color: #0e192e;">Bună{% if user.name %}, {{ user.name }}{% endif %}!</h1>
    <p style="margin: 0 0 16px 0;">
      Pentru contul tău WLBRAND ({{ user.email }}) a fost cerută setarea parolei.
      Apasă butonul de mai jos și alege o parolă.
    </p>
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 24px 0;">
      <tr>
        <td bgcolor="#1059ac" style="background-color: #1059ac; border-radius: 8px;">
          <a id="confirm" href="{{ url }}" rel="noopener noreferrer" target="_blank" style="display: inline-block; padding: 12px 22px; font-weight: 600; font-size: 15px; color: #f9fafd; text-decoration: none; border-radius: 8px;">Setează parola</a>
        </td>
      </tr>
    </table>
    <p style="margin: 0 0 16px 0;">
      Apoi te autentifici cu adresa de e-mail și parola. La prima autentificare
      îți configurezi și aplicația de autentificare de pe telefon (cod TOTP din
      Google Authenticator, Microsoft Authenticator sau o aplicație similară) și
      confirmi cu încă un cod din aplicație (așteaptă să apară codul următor).
      De atunci, codul ei îți va fi cerut la fiecare autentificare.
    </p>
    <p style="margin: 0; font-size: 13px; color: #525d70;">
      Dacă butonul nu se deschide, copiază în browser adresa:<br>
      <a href="{{ url }}" rel="noopener noreferrer" target="_blank" style="color: #1059ac; word-break: break-all;">{{ url }}</a>
    </p>
    {% endblock %}
    {% block sub_content %}
    {% timezone "Europe/Bucharest" %}
    <p style="margin: 0;">
      Linkul poate fi folosit o singură dată și este valabil până la
      {{ expires|date:"d.m.Y, H:i" }} (ora României). Dacă nu tu ai cerut acest
      e-mail, ignoră-l: parola ta rămâne neschimbată.
    </p>
    {% endtimezone %}
    {% endblock %}
  setare-parola.txt: |
    {% load tz %}{% autoescape off %}Bună{% if user.name %}, {{ user.name }}{% endif %}!

    Pentru contul tău WLBRAND ({{ user.email }}) a fost cerută setarea parolei.
    Deschide linkul de mai jos și alege o parolă:

    {{ url }}

    Apoi te autentifici cu adresa de e-mail și parola. La prima autentificare îți
    configurezi și aplicația de autentificare de pe telefon (cod TOTP din Google
    Authenticator, Microsoft Authenticator sau o aplicație similară) și confirmi cu
    încă un cod din aplicație (așteaptă să apară codul următor). De atunci, codul
    ei îți va fi cerut la fiecare autentificare.

    {% timezone "Europe/Bucharest" %}Linkul poate fi folosit o singură dată și este valabil până la
    {{ expires|date:"d.m.Y, H:i" }} (ora României).{% endtimezone %} Dacă nu tu ai cerut acest e-mail,
    ignoră-l: parola ta rămâne neschimbată.

    —
    WLBRAND — mesaj trimis automat. Nu răspunde la acest e-mail.
    {% endautoescape %}
