# Authentik platform manifests (OUR raw resources, git-sourced via the
# authentik-platform Argo app). Split from the Helm install (authentik.yaml overlay)
# same as openbao-store vs openbao. Carries: the tailnet ingress, the Blueprint
# ConfigMaps the chart mounts (blueprints.configMaps), and the Traefik forward-auth
# Middleware for public apps.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authentik
resources:
  - ingress-public.yaml
  - ingress-proxied-apps.yaml
  - middleware-forwardauth.yaml
  # A refused callback starts the sign-in again (one mechanism, every gated host).
  - sso-restart.yaml
  # A sign-out Authentik cannot answer is told so, by the hub.
  - sso-signout-unfinished.yaml
  - redis.yaml
  # The CNPG Cluster + ScheduledBackup that replace the chart-bundled Bitnami
  # subchart (I2). Listed BEFORE the blueprints for readability only — Argo
  # applies a kustomization as one set, and the ordering that matters between
  # the Helm release and this app is the sync WAVE on the two Applications.
  - cnpg-cluster.yaml
  - blueprints-groups.yaml
  - blueprints-sources.yaml
  - blueprints-providers.yaml
  - blueprints-admins.yaml
  - blueprints-enrollment.yaml
  - blueprints-mfa.yaml
  - blueprints-outpost.yaml
  # Password policy + the emailed one-time set-password link (doc 18, step 3).
  # Also named under blueprints.configMaps in gitops/apps/overlays/dev/authentik.yaml.
  - blueprints-recovery.yaml
  # The people moved onto this directory (doc 18, step 6). Also in blueprints.configMaps.
  - blueprints-people.yaml
  # Romanian mail templates, mounted at /templates/recomex/ via global.volumes in
  # gitops/apps/overlays/dev/authentik.yaml (NOT a blueprint; no configMaps entry).
  - email-templates.yaml
  # The dedicated token for autorizare, and the one script every token reconciler
  # runs (step 2) — the applications' (invoice, vega) included, in apps/.
  - autorizare-token-reconcile.yaml
  - plane-sso-token-reconcile.yaml
  - plunk-sso-token-reconcile.yaml
  - novu-sso-token-reconcile.yaml
  - n8n-sso-token-reconcile.yaml
  # Authentik as n8n-sso's SCIM client (apps/n8n-sso), and one per generated instance.
  # Also named under blueprints.configMaps in gitops/apps/overlays/dev/authentik.yaml.
  - blueprints-n8n-sso.yaml
  - blueprints-n8n-instances.generated.yaml
  - credential-token-reconcile-script.yaml
  # The rule every runtime-issued machine credential is bound to (step 2).
  # Also in blueprints.configMaps.
  - blueprints-machine-credentials.yaml
  # Re-discovers blueprint files every 10 minutes, so a newly synced one is
  # applied without anybody running repair.sh.
  - blueprint-discovery.yaml
  # The login hub's broker client (doc 18, step 4). Also in blueprints.configMaps.
  - blueprints-broker-autorizare-hub.yaml
  # The estate's look on the sign-in: brand, Romanian titles and labels.
  # Also in blueprints.configMaps.
  - blueprints-theme.yaml
  # GENERATED by packages/rmx-ui/scripts/authentik-assets.mjs: a library tile for
  # every estate application the hub declares. Also in blueprints.configMaps.
  # The platform's tiles here; the applications' are spliced in by apps/.
  - blueprints-estate-tiles.yaml
  # The working fields the estate's values are built in (never rendered). See below.
  - identity/lines.yaml

# The applications' part: their groups, sign-ins and token reconcilers
# (generated group/sso blueprints, invoice and vega API tokens), their estate
# tiles (spliced into blueprints-estate-tiles.yaml) and their tile icons (merged
# into the authentik-estate ConfigMap below). A Component, so it can add to the
# platform's own objects. See apps/.
components:
  # Argo's prune/delete guard on the PVCs and CNPG Clusters rendered here (the data).
  - ../../components/prune-guard
  # The estate identity (estate/identity.yaml → gitops/components/whitelabel): the
  # source the replacements below read the estate's values from. Never rendered.
  - ../../components/whitelabel

# The estate's values — hosts, brand title, the alert owner — read from the
# identity. The manifests and blueprints write dot-free placeholders (WLAUTHHOST,
# WLDOMAIN, WLBRAND, …); fields.yaml fills those outside blueprint text, and the
# GENERATED replacements.yaml rebuilds each blueprint line that carries one
# (identity/lines.mjs; regenerate after editing a blueprint). For RMX's identity
# the render is byte-identical to the values written out.
replacements:
  - path: identity/fields.yaml
  - path: identity/replacements.yaml
  # The registry host (REGISTRY_HOST), generated by tools/whitelabel/replacements.py.
  - path: whitelabel-replacements.yaml

# The estate's look, as FILES Authentik serves and reads (gitops/apps/overlays/dev/
# authentik.yaml mounts both, on server AND worker):
#   authentik-estate     → /web/dist/assets/recomex/  — served at
#                          /static/dist/assets/recomex/: the stylesheet the brand
#                          blueprint reads with !File, the Romanian layer, the
#                          logo, favicon and night background; and the mail's
#                          logo, also mounted as /web/icons/icon_left_brand.png,
#                          the image Authentik attaches to every mail; and the
#                          tile icon of every application in "Aplicațiile mele"
#                          (app-<slug>.svg — provenance in estate/app-icons.json,
#                          which is NOT mounted; the applications' own tile icons
#                          are merged in from apps/estate/); and restart.html, the page
#                          a refused callback is answered with on every gated
#                          host (sso-restart.yaml). The SVGs,
#                          the PNG and the stylesheet's token block are GENERATED
#                          by packages/rmx-ui/scripts/authentik-assets.mjs.
#   authentik-templates  → /templates/base/  — the page template that loads ro.js.
# Fixed names (no hash suffix): the Helm values name them, and Reloader restarts
# the pods when either changes.
configMapGenerator:
  - name: authentik-estate
    options:
      disableNameSuffixHash: true
    files:
      - estate/recomex.css
      - estate/ro.js
      - estate/favicon.svg
      - estate/logo-dark.svg
      - estate/logo-light.svg
      - estate/fundal.svg
      - estate/mail-logo.png
      - estate/restart.html
      - estate/n8n-down.html
      - estate/app-argocd.svg
      - estate/app-autorizare-hub.svg
      - estate/app-browseruse-webui.svg
      - estate/app-harbor.svg
      - estate/app-headlamp.svg
      - estate/app-headplane.svg
      - estate/app-hub.svg
      - estate/app-netdata.svg
      - estate/app-nextcloud.svg
      - estate/app-n8n.svg
      - estate/app-novu.svg
      - estate/app-openbao.svg
      - estate/app-pdfcraft.svg
      - estate/app-plane.svg
      - estate/app-plunk.svg
      - estate/app-polaris.svg
  - name: authentik-templates
    options:
      disableNameSuffixHash: true
    files:
      - templates/skeleton.html
