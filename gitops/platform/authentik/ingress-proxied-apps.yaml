# Tailnet dashboard gates — Authentik embedded-outpost proxy ingresses.
#
# These replace each app's OWN tailscale ingress. Every request to
# https://<app>.<tailnet>.ts.net now lands on authentik-server (the embedded
# outpost), which matches the Host against a proxy-MODE provider
# (gitops/platform/authentik/blueprints-providers.yaml → proxy-forwardauth.yaml),
# enforces Authentik login, then reverse-proxies to the app's in-cluster Service
# (the provider's internal_host). The app keeps its ClusterIP Service but NO
# ingress of its own — so the only way in is through Authentik (no tailnet bypass).
#
# WHY here (ns authentik): a k8s Ingress can only target a Service in its OWN
# namespace. The outpost is authentik-server in ns authentik, so the gate ingress
# must live here too. The cross-namespace hop to the real app happens at the
# proxy-provider internal_host layer (plain cluster DNS), which has no such limit.
#
# The MagicDNS host (tls.hosts[0]) is the SAME short name the app used before, so
# the tailnet URL is unchanged; only the backend moved behind the gate.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netdata-gate
  namespace: authentik
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Netdata"
    gethomepage.dev/description: "Real-time node and pod metrics"
    gethomepage.dev/group: "Observability"
    gethomepage.dev/icon: "netdata.png"
    gethomepage.dev/href: "https://netdata.WLTAILNET"
    # Status: this gate ingress lives in ns authentik; homepage queries the pod
    # selector in the INGRESS's OWN namespace. The pod that actually serves this
    # host is the authentik-server (embedded outpost), so select THAT. Without a
    # selector homepage derives `app.kubernetes.io/name=netdata-gate`, which
    # matches nothing → "NOT FOUND". (Netdata itself runs in ns monitoring; a
    # cross-ns selector here can't reach it — the outpost is the live backend.)
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=authentik,app.kubernetes.io/component=server"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: authentik-server
      port:
        number: 80
  tls:
    - hosts:
        - netdata
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hub-gate
  namespace: authentik
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "System Hub"
    gethomepage.dev/description: "This page — every service in the cluster"
    gethomepage.dev/group: "Observability"
    gethomepage.dev/icon: "homepage.png"
    gethomepage.dev/href: "https://hub.WLTAILNET"
    # Status via the authentik-server pod that serves this gate (same ns). The
    # homepage pod itself carries app.kubernetes.io/name=homepage (no `app=` label),
    # and lives in ns homepage anyway — so we track the gate's real backend here.
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=authentik,app.kubernetes.io/component=server"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: authentik-server
      port:
        number: 80
  tls:
    - hosts:
        - hub
# headlamp-gate REMOVED — Headlamp moved to NATIVE OIDC and serves its OWN tailnet
# ingress again (pieces/headlamp/values.yaml extraManifests → ns
# headlamp). Identity is now enforced at the kube-apiserver (HEADLAMP_K8S_OIDC.md
# §4), so the embedded-outpost gate here is redundant. Removal sequencing matters
# (RUNBOOK 2026-06-18): the headlamp Service ingress and this gate both claim host
# `headlamp.<tailnet>.ts.net`; drop this gate and add the headlamp-owned ingress in
# the SAME sync so the host is never double-bound or briefly open.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: browseruse-webui-gate
  namespace: authentik
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Browser-Use WebUI"
    gethomepage.dev/description: "Browser automation console"
    gethomepage.dev/group: "Services"
    gethomepage.dev/icon: "mdi-monitor-screenshot"
    gethomepage.dev/href: "https://browseruse-webui.WLTAILNET"
    # Same as the other gates: track the authentik-server outpost pod (this ns),
    # not the derived `name=browseruse-webui-gate` selector that matches nothing.
    gethomepage.dev/pod-selector: "app.kubernetes.io/name=authentik,app.kubernetes.io/component=server"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: authentik-server
      port:
        number: 80
  tls:
    - hosts:
        - browseruse-webui
