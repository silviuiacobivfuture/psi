# cms's OIDC client, as the env vars the cms blueprint reads (AUTHENTIK_OIDC__CMS__ID/SECRET),
# from OpenBao secret/apps/cms/oidc — the path cms itself reads. Fail loud: explicit data[]
# keys; a missing one makes this SecretSyncedError (graded by the doctor through
# apps/cms/seb.app.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-cms-oidc
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: authentik-cms-oidc, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - secretKey: AUTHENTIK_OIDC__CMS__ID
      remoteRef: { key: apps/cms/oidc, property: client_id }
    - secretKey: AUTHENTIK_OIDC__CMS__SECRET
      remoteRef: { key: apps/cms/oidc, property: client_secret }
