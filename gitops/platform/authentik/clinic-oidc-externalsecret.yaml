# clinic's OIDC client, as the env vars the clinic blueprint reads (AUTHENTIK_OIDC__CLINIC__ID/SECRET),
# from OpenBao secret/apps/clinic/oidc — the path clinic itself reads. Fail loud: explicit data[]
# keys; a missing one makes this SecretSyncedError (graded by the doctor through
# apps/clinic/seb.app.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-clinic-oidc
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: authentik-clinic-oidc, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - secretKey: AUTHENTIK_OIDC__CLINIC__ID
      remoteRef: { key: apps/clinic/oidc, property: client_id }
    - secretKey: AUTHENTIK_OIDC__CLINIC__SECRET
      remoteRef: { key: apps/clinic/oidc, property: client_secret }
