# Authentik Blueprint ConfigMap — THE RULE EVERY MACHINE CREDENTIAL IS JUDGED BY.
# docs/autorizare/18-sso-authentik-unic.md, step 2. Ported from the business
# directory's providers blueprint (that instance was deleted on 2026-10-25),
# where it was declared next to the business providers; here it stands alone
# because nothing else in that file moves.
#
# Machine credentials are issued at RUNTIME, one OAuth client-credentials
# provider and one application each, by packages/rmx-securitate/identitate
# (Issue). Each application gets a policy binding to THIS policy, looked up by
# its NAME (identitate.denyInteractivePolicyName) — so the name is a contract
# with that code and is kept byte for byte, `business` and all. Without it on
# this directory, every Issue here fails at the lookup, before anything is
# created.
#
# WHY IT EXISTS: without a binding an application is open to every user in the
# directory. A machine credential has no legitimate human user, so its binding
# admits nobody — except the service account Authentik itself generates for
# the client_credentials grant, because the token endpoint runs this same
# policy engine on that path and a blanket deny would refuse the machine too.
# That account is `ak-<provider>-client_credentials`, type service_account,
# path goauthentik.io/apps/<application slug>; matching on the path keeps one
# credential's account from passing another credential's application.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-machine-credentials
  namespace: authentik
data:
  machine-credentials.yaml: |
    version: 1
    metadata:
      name: WLSLUG-machine-credentials
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_policies_expression.expressionpolicy
        identifiers:
          name: WLSLUG-business-machine-credential-only
        attrs:
          execution_logging: false
          expression: |
            # Denies every person. Passes only the service account Authentik
            # generated for THIS application's client_credentials grant.
            return (
                request.user.type == "service_account"
                and request.user.path == f"goauthentik.io/apps/{request.obj.slug}"
            )
