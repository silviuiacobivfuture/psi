# Traefik forward-auth Middleware → Authentik embedded outpost. Reference this on
# any PUBLIC Traefik ingress to gate it behind Authentik SSO (the recomex-forward-auth
# proxy provider, mode forward_domain). Traefik calls the outpost's auth endpoint;
# on 2xx it forwards the request (and the X-authentik-* identity headers), otherwise
# it redirects the browser to the Authentik login.
#
# WIRING (per public ingress, opt-in — does NOT auto-apply):
#   metadata.annotations:
#     traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-forwardauth@kubernetescrd
# Namespaced name is "<namespace>-<name>@kubernetescrd" = authentik-authentik-forwardauth.
#
# GUARDRAIL: not attached to any existing ingress here. Apps keep working unchanged
# until the user opts a given ingress in. The embedded outpost redirects the browser
# to the PUBLIC authentik host (auth.recomex.eu) — pinned in
# blueprints-outpost.yaml; the proxy provider's external_host is the same public
# host — see blueprints-providers.yaml.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-forwardauth
  namespace: authentik
spec:
  forwardAuth:
    address: http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
