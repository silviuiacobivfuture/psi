# Authentik Blueprint ConfigMap — INTERNAL ADMINS (config-as-code).
# Mounted by the chart at /blueprints/custom/ (blueprints.configMaps in
# gitops/apps/overlays/dev/authentik.yaml) and reconciled by the worker on boot.
#
# WHY: the GitHub OAuth source (blueprints-sources.yaml) enrolls every federated
# user as type=`external`, and Authentik blocks external users from the admin/user
# interface ("Interface can only be accessed by internal users"). So each platform
# admin must be pinned to type=`internal` (an enterprise-licensed seat — keep this
# list to the few who genuinely need the Authentik UI; regular SSO users stay
# external/free). Matched to the GitHub login by email (source matching mode is
# email_link), and re-added to the superuser group on every reconcile so a
# delete+re-enroll can't silently demote an admin. Idempotent.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-admins
  namespace: authentik
data:
  admins.yaml: |
    version: 1
    metadata:
      name: WLSLUG-internal-admins
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      # The groups listed below must exist first; on a fresh install a !Find
      # against a group not yet created fails this whole blueprint.
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: WLSLUG-groups
          required: true
      - model: authentik_core.user
        identifiers:
          email: WLOPERATOREMAIL
        attrs:
          username: WLOPERATOR
          name: WLOPERATORNAME
          type: internal
          is_active: true
          # platform-admins = Authentik admin + break-glass. dept-platform + the
          # app-*-admin entitlements = the taxonomy (ROLES.md): admin on every app,
          # so the binding migration platform-admins→app-*-* can't lock the operator
          # out. NOTE: blueprint sets the group m2m exactly to this list.
          # No `groups:` (psi 2026-11-12): a group list here REPLACES every membership, so each
          # re-apply stripped the operator from groups added later (n8n, Novu, Plunk, AFFiNE).
          # Membership is owned by the group rosters in blueprints-groups.yaml only.
