# The DEDICATED, READ-ONLY Authentik API token plunk-sso reads the directory with at each sign-in:
# view_user + view_group, nothing else (apps/plunk-sso/lib/directory.mjs). Plane-sso's shape, with its
# own ServiceAccount, OpenBao role and slot, secret/platform/authentik/plunk-sso-api-token. The
# script is the shared one (credential-token-reconcile-script.yaml): read-before-write, additive.
#   kubectl -n authentik create job --from=cronjob/authentik-plunk-sso-token-reconcile plunk-sso-token-now
apiVersion: v1
kind: ServiceAccount
metadata:
  name: authentik-plunk-sso-token
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-plunk-sso-token-reconcile
  annotations:
    alerts.recomex.eu/owner: WLOPSEMAIL
spec:
  schedule: "8,23,38,53 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels: { app: authentik-plunk-sso-token-reconcile }
        spec:
          restartPolicy: OnFailure
          serviceAccountName: authentik-plunk-sso-token
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: work
              emptyDir: {}
            - name: script
              configMap: { name: authentik-credential-token-reconcile }
          containers:
            - name: reconcile
              image: WLREGISTRY/mirror/docker.io/alpine/k8s:1.30.3@sha256:12d9fc5d5e9467c7d932a18015ddfe48bdf2e02dd5677507f155ac05fdd63b73
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { cpu: 300m, memory: 256Mi }
              volumeMounts:
                - { name: work, mountPath: /work }
                - { name: script, mountPath: /script, readOnly: true }
              env:
                - name: AK_API
                  value: http://authentik-server.authentik.svc.cluster.local:80
                - name: JOB_NAME
                  value: authentik-plunk-sso-token-reconcile
                - name: AK_TOKEN_DESCRIPTION
                  value: "plunk-sso — reads one person's groups at sign-in so Plunk access follows Authentik groups (apps/plunk-sso). Maintained by the authentik-plunk-sso-token-reconcile CronJob."
                - name: AK_SERVICE_ACCOUNT
                  value: svc-plunk-sso
                - name: AK_ROLE
                  value: plunk-sso-directory-reader
                - name: AK_TOKEN_IDENTIFIER
                  value: plunk-sso-api
                - name: AK_PERMISSIONS
                  value: >-
                    authentik_core.view_user
                    authentik_core.view_group
                - name: AK_SIGNING_CERT
                  value: "authentik Self-signed Certificate"
                - name: AK_SIGNING_CERT_ENC
                  value: "authentik%20Self-signed%20Certificate"
                - name: BAO_ADDR
                  value: http://openbao.openbao.svc:8200
                - name: BAO_ROLE
                  value: authentik-plunk-sso-token
                - name: TOKEN_SECRET_PATH
                  value: platform/authentik/plunk-sso-api-token
                - name: TOKEN_SECRET_FIELD
                  value: token
                - name: AUTHENTIK_BOOTSTRAP_TOKEN
                  valueFrom: { secretKeyRef: { name: authentik-env, key: AUTHENTIK_BOOTSTRAP_TOKEN } }
              command: ["/bin/sh", "/script/reconcile.sh"]
