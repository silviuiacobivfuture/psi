# The estate's values in Authentik's platform manifests OUTSIDE blueprint text,
# read from the estate identity (the whitelabel component, gitops/WHITELABEL.md).
# The manifests write dot-free placeholders these fill in; a placeholder left in
# a render is refused by .github/scripts/tests/seb-authentik-identity_test.sh.
# The blueprint TEXT is filled by replacements.yaml, generated by lines.mjs.
#
# ── Authentik's public host (AUTHENTIK_HOST, derived from AUTHENTIK_HOST_PREFIX and BASE_DOMAIN) ──
- source: {kind: ConfigMap, name: whitelabel, fieldPath: data.AUTHENTIK_HOST}
  targets:
    - select: {kind: Ingress, name: authentik-public}
      fieldPaths: [spec.rules.0.host, spec.tls.0.hosts.0]
    # the hub's sign-out doors on auth.<apex> (sso-signout-unfinished.yaml)
    - select: {kind: Ingress, name: authentik-end-session-unfinished}
      fieldPaths: [spec.rules.0.host, spec.tls.0.hosts.0]
    # the domain-wide callback's restart (sso-restart.yaml)
    - select: {kind: Ingress, name: authentik-callback-restart}
      fieldPaths: [spec.rules.0.host, spec.tls.0.hosts.0]
    - select: {kind: Ingress, name: authentik-invalidation-unconfirmed}
      fieldPaths: [spec.rules.0.host, spec.tls.0.hosts.0]
# ── the tailnet dashboards' links on the homepage: https://<label>.WLTAILNET ──
- source: {kind: ConfigMap, name: whitelabel, fieldPath: data.TAILNET_DOMAIN}
  targets:
    - select: {kind: Ingress, name: netdata-gate}
      fieldPaths: ["metadata.annotations.[gethomepage.dev/href]"]
      options: {delimiter: ".", index: 1}
    - select: {kind: Ingress, name: hub-gate}
      fieldPaths: ["metadata.annotations.[gethomepage.dev/href]"]
      options: {delimiter: ".", index: 1}
    - select: {kind: Ingress, name: browseruse-webui-gate}
      fieldPaths: ["metadata.annotations.[gethomepage.dev/href]"]
      options: {delimiter: ".", index: 1}
# ── who is paged for a workload (OPS_EMAIL) ──
- source: {kind: ConfigMap, name: whitelabel, fieldPath: data.OPS_EMAIL}
  targets:
    - select: {kind: Cluster, name: authentik-db}
      fieldPaths: ["metadata.annotations.[alerts.psizone.ro/owner]"]
    - select: {kind: CronJob, name: authentik-blueprint-discovery}
      fieldPaths: ["metadata.annotations.[alerts.psizone.ro/owner]"]
    - select: {kind: CronJob, name: authentik-autorizare-token-reconcile}
      fieldPaths: ["metadata.annotations.[alerts.psizone.ro/owner]"]
    - select: {kind: CronJob, name: authentik-plane-sso-token-reconcile}
      fieldPaths: ["metadata.annotations.[alerts.psizone.ro/owner]"]
    - select: {kind: CronJob, name: authentik-plunk-sso-token-reconcile}
      fieldPaths: ["metadata.annotations.[alerts.psizone.ro/owner]"]
    - select: {kind: CronJob, name: authentik-novu-sso-token-reconcile}
      fieldPaths: ["metadata.annotations.[alerts.psizone.ro/owner]"]
    - select: {kind: CronJob, name: authentik-n8n-sso-token-reconcile}
      fieldPaths: ["metadata.annotations.[alerts.psizone.ro/owner]"]
# ── the database's archive: the estate's object storage, its bucket <BUCKET_PREFIX>-tfstate-dev ──
- source: {kind: ConfigMap, name: whitelabel, fieldPath: data.BUCKET_PREFIX}
  targets:
    - select: {kind: ConfigMap, name: authentik-backup-bucket}
      fieldPaths: [data.BUCKET]
      options: {delimiter: "-", index: 0}
- source: {kind: ConfigMap, name: authentik-backup-bucket, fieldPath: data.BUCKET}
  targets:
    - select: {kind: Cluster, name: authentik-db}
      fieldPaths: [spec.backup.barmanObjectStore.destinationPath]
      options: {delimiter: "/", index: 2}
