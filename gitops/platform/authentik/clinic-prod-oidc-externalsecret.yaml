# clinic-prod's OIDC client, as the env vars the clinic-prod blueprint reads (AUTHENTIK_OIDC__CLINIC_PROD__ID/SECRET), from
# OpenBao secret/apps/clinic-prod/oidc — the path clinic-prod itself reads. Fail loud: explicit data[] keys; a missing one
# makes this SecretSyncedError.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-clinic-prod-oidc
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: authentik-clinic-prod-oidc, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - secretKey: AUTHENTIK_OIDC__CLINIC_PROD__ID
      remoteRef: { key: apps/clinic-prod/oidc, property: client_id }
    - secretKey: AUTHENTIK_OIDC__CLINIC_PROD__SECRET
      remoteRef: { key: apps/clinic-prod/oidc, property: client_secret }
