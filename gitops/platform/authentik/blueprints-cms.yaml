# Authentik Blueprint ConfigMap — psi's cms (apps/cms, https://cms.psizone.ro): its OIDC
# provider and application, the editors' group, and who may sign in.
#
# client_id / client_secret come from OpenBao secret/apps/cms/oidc through the
# authentik-cms-oidc ExternalSecret (cms-oidc-externalsecret.yaml) and the chart's envFrom
# (gitops/apps/overlays/dev/authentik.yaml); cms reads the SAME path (gitops/services/cms), so
# the two cannot drift. Also named under blueprints.configMaps in that file.
#
# cms signs in with the authorization code flow + PKCE and asks for openid, email and profile;
# it matches a person on their e-mail. Sign-out goes through default-invalidation-flow (the one
# with the user-logout stage), as every provider here does.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-cms
  namespace: authentik
data:
  cms.yaml: |
    version: 1
    metadata:
      name: psi-cms
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    context:
      cms_client_id:     !Env [AUTHENTIK_OIDC__CMS__ID, ""]
      cms_client_secret: !Env [AUTHENTIK_OIDC__CMS__SECRET, ""]
    entries:
      # The people who edit content. Membership is granted in the directory.
      - model: authentik_core.group
        identifiers:
          name: app-cms-editor
        attrs:
          is_superuser: false
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: cms
        attrs:
          client_type: confidential
          client_id: !Context cms_client_id
          client_secret: !Context cms_client_secret
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          grant_types:
            - authorization_code
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          sub_mode: hashed_user_id
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          redirect_uris:
            - matching_mode: strict
              url: https://cms.psizone.ro/api/users/oauth/callback
      - model: authentik_core.application
        identifiers:
          slug: cms
        attrs:
          name: CMS
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, cms]]
          meta_launch_url: https://cms.psizone.ro/admin
      # Without a binding an application lets ANY authenticated user through. Two bindings,
      # engine mode `any`: the editors' group, and platform-admins as break-glass (a binding
      # must never lock the operator out).
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, cms]]
          group: !Find [authentik_core.group, [name, app-cms-editor]]
        attrs:
          negate: false
          enabled: true
          order: 0
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, cms]]
          group: !Find [authentik_core.group, [name, platform-admins]]
        attrs:
          negate: false
          enabled: true
          order: 1
