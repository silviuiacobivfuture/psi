      # An application goes before its provider; its bindings go with it.
      - model: authentik_core.application
        state: absent
        identifiers: { slug: headscale }
      - model: authentik_providers_oauth2.oauth2provider
        state: absent
        identifiers: { name: headscale }
      - model: authentik_core.application
        state: absent
        identifiers: { slug: headplane }
      - model: authentik_providers_proxy.proxyprovider
        state: absent
        identifiers: { name: headplane }
      - model: authentik_core.application
        state: absent
        identifiers: { slug: headplane-oidc }
      - model: authentik_providers_oauth2.oauth2provider
        state: absent
        identifiers: { name: headplane-oidc }
      - model: authentik_providers_oauth2.scopemapping
        state: absent
        identifiers: { name: headplane-role-scope }
      # ---- AFFiNE: documents, notes, whiteboards (pieces/affine) ------------------
      # Behind TWO Authentik checks, the Headplane shape:
      # 1. The EDGE: this forward_single provider owns <AFFINE_HOST_PREFIX>.<apex> outright,
      #    so a signed-out or unlisted person gets a redirect or a refusal and never a byte of
      #    AFFiNE. Only its bindings decide there, never the domain-wide provider's (Plane's).
      # 2. The APPLICATION: AFFiNE's own OIDC sign-in (the `affine-oidc` client below), with
      #    the same bindings. AFFiNE has no group mapping, so these bindings are the whole
      #    access decision; AFFiNE makes the account at the first sign-in and matches an
      #    existing one by e-mail. Its own e-mail sign-up is off (write-config.mjs).
      # Why two applications: an Authentik application holds one provider. The edge's is the
      # tile in "My applications"; the sign-in's is hidden (nobody launches it).
      - model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: affine
        attrs:
          mode: forward_single
          external_host: https://WLAFFINEPREFIX.WLDOMAIN
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          access_token_validity: hours=24
      - model: authentik_core.application
        identifiers:
          slug: affine
        attrs:
          name: AFFiNE
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, affine]]
          meta_launch_url: https://WLAFFINEPREFIX.WLDOMAIN/
          meta_icon: /static/dist/assets/recomex/app-affine.svg
          meta_description: Documente, notițe și table albe
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, affine]]
          group: !Find [authentik_core.group, [name, app-affine-user]]
        attrs: { negate: false, enabled: true, order: 0 }
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, affine]]
          group: !Find [authentik_core.group, [name, platform-admins]]
        attrs: { negate: false, enabled: true, order: 1 }
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, affine]]
          group: !Find [authentik_core.group, [name, app-affine-admin]]
        attrs: { negate: false, enabled: true, order: 2 }
      # AFFiNE REFUSES a sign-in whose `email_verified` is not true ("Email for this account
      # is not verified"), and Authentik's own email mapping sends false for an account whose
      # address was never confirmed by a mail round-trip. The estate's accounts are made by its
      # administrators (blueprints, invitations, the federated sources), so the address IS the
      # one the estate vouches for: this mapping, bound to AFFiNE's provider ONLY, says so.
      # Every other provider keeps the managed email mapping.
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          name: affine-email-scope
        attrs:
          scope_name: email
          description: "E-mail, vouched for by the estate (AFFiNE requires email_verified)"
