          group: !Find [authentik_core.group, [name, app-mail-admin]]
        attrs: { negate: false, enabled: true, order: 2 }
      # ---- Tailnet dashboard gates (proxy MODE) --------------------------------
      # These apps can't speak OIDC natively (netdata/hub) or shouldn't (headlamp:
      # OIDC would require reconfiguring the k3s apiserver). Instead the embedded
      # outpost reverse-proxies them: a request to https://<app>.<tailnet>.ts.net is
      # routed (by Host) to the matching proxy provider, gated behind Authentik, then
      # proxied to internal_host. The app's OWN tailscale ingress is removed and a
      # replacement ingress in ns authentik points at authentik-server (the embedded
      # outpost) — see gitops/platform/authentik/ingress-proxied-apps.yaml. Group
      # membership is enforced per-app via the `app-dashboards-view` policy bindings
      # at the bottom of this blueprint (only its members may reach these apps).
      - model: authentik_providers_proxy.proxyprovider
        identifiers: { name: netdata }
        attrs:
          mode: proxy
          external_host: https://netdata.WLTAILNET
          internal_host: http://netdata.monitoring.svc.cluster.local:19999
          internal_host_ssl_validation: false
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          access_token_validity: hours=24
      - model: authentik_core.application
        identifiers: { slug: netdata }
        attrs:
          name: Netdata
          meta_icon: /static/dist/assets/recomex/app-netdata.svg
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, netdata]]
      - model: authentik_providers_proxy.proxyprovider
        identifiers: { name: hub }
        attrs:
          mode: proxy
          external_host: https://hub.WLTAILNET
          internal_host: http://homepage.homepage.svc.cluster.local:3000
          internal_host_ssl_validation: false
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          access_token_validity: hours=24
      - model: authentik_core.application
        identifiers: { slug: hub }
        attrs:
          # psi's hub (hub.psizone.ro, "Psizone · hub"), named plainly.
          name: Hub
          meta_icon: /static/dist/assets/recomex/app-hub.svg
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, hub]]
      # Headlamp embedded-outpost proxy gate REMOVED — Headlamp moved to NATIVE k8s OIDC
      # (the apiserver trusts Authentik via the SUC drop-in; identity enforced at the API
      # server itself, HEADLAMP_K8S_OIDC.md §4). The proxy gate + native OIDC together
      # would be redundant double-auth. The `headlamp` OIDC oauth2provider (above) is KEPT
      # and now used for real. The headlamp-gate ingress + this provider are dropped in the
      # same step Headlamp switched to native OIDC.
      # ---- Browser-Use WebUI and the private-network twins: REMOVED on psi ---------
      # psi does not run Browser-Use, and with no mesh the "(private network)" twins of
      # Netdata and the hub claimed the SAME host as the public ones (WLMESH = WLTAILNET =
      # the apex here). Deleted, application before provider; bindings go with them.
      - model: authentik_core.application
        state: absent
        identifiers: { slug: browseruse-webui }
      - model: authentik_providers_proxy.proxyprovider
        state: absent
        identifiers: { name: browseruse-webui }
      - model: authentik_core.application
        state: absent
        identifiers: { slug: browseruse-webui-net }
      - model: authentik_providers_proxy.proxyprovider
        state: absent
        identifiers: { name: browseruse-webui-net }
      - model: authentik_core.application
        state: absent
        identifiers: { slug: netdata-net }
      - model: authentik_providers_proxy.proxyprovider
        state: absent
        identifiers: { name: netdata-net }
      - model: authentik_core.application
        state: absent
        identifiers: { slug: hub-net }
      - model: authentik_providers_proxy.proxyprovider
        state: absent
        identifiers: { name: hub-net }

      # ---- Access policy: gate the tailnet dashboards on group membership ------
      # By default an application with ZERO policy bindings lets ANY authenticated
      # user through. We bind the entitlement group `app-dashboards-view` directly
      # to each of netdata / hub so ONLY its members may reach
      # them through the embedded outpost; everyone else is denied at Authentik.
      #
      # How the deny works: each Application's policy_engine_mode is `any` (pass if
      # at least one binding matches). With exactly one binding — a group binding,
      # negate:false — a request passes ONLY when the user is in `app-dashboards-view`;
      # for any non-member NO binding matches, so the engine returns deny and the
      # outpost refuses the request (no proxy to internal_host). PolicyBinding has a
      # first-class `group` FK (target=Application, group=Group), so this needs NO
      # expression policy — the group binding is the canonical, simplest mechanism
      # in Authentik 2026.5. Operator `silviu` is a member of `app-dashboards-view`,
      # so access is preserved. Idempotent: identifiers (target+group) are stable,
      # re-applies cleanly. Headlamp is intentionally NOT gated here (native OIDC).
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, netdata]]
          group: !Find [authentik_core.group, [name, app-dashboards-view]]
        attrs:
          negate: false
          enabled: true
          order: 0
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, hub]]
          group: !Find [authentik_core.group, [name, app-dashboards-view]]
        attrs:
          negate: false
          enabled: true
          order: 0

      # ---- n8n: a PER-HOST forward-auth provider --------------------------------
      # Gates the host in pieces/n8n/base/host.env (.github/scripts/n8n-gate.sh
      # refuses a tree where the two differ). forward_single owns the host outright, so
      # ONLY this binding decides, and it is deliberately one group: an n8n instance
      # runs code and holds credentials, so no platform-admins break-glass and no
      # department bundle reach it by accident. n8n Community's own sign-in is behind
      # this gate. Only /webhook/ and /webhook-waiting/ pass without it (ingress.yaml).
      - model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: n8n
        attrs:
          mode: forward_single
          external_host: https://n8n.WLDOMAIN
          # IMPLICIT, and it is a security setting here. The explicit flow's page leaves by script, which
          # turns any arrival into a same-site one, so a page on another site could sign a person in and
          # make a pending person's account (docs/n8n/01-identity.md H15). The gate holds this.
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          access_token_validity: hours=8
      - model: authentik_core.application
        identifiers:
          slug: n8n
        attrs:
          name: n8n
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, n8n]]
          # /sso/setup answers everybody: to n8n's own sign-in, or, for someone who has not
          # chosen a password yet, to their invitation (apps/n8n-sso/src/setup.ts).
          meta_launch_url: https://n8n.WLDOMAIN/sso/setup
          meta_description: Automatizări — fluxuri de lucru și webhook-uri
          meta_icon: /static/dist/assets/recomex/app-n8n.svg
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, n8n]]
          group: !Find [authentik_core.group, [name, app-n8n-admin]]
        attrs: { negate: false, enabled: true, order: 0 }

      # Bind ALL proxy providers (forward-auth + the tailnet gates) to the embedded
      # outpost (the in-cluster server pod runs it). The list REPLACES the m2m set,
      # so every provider that must be served has to appear here.
      - model: authentik_outposts.outpost
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          providers:
            - !Find [authentik_providers_proxy.proxyprovider, [name, WLSLUG-forward-auth]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, pdfcraft]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, novu]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, plunk]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, n8n]]
            # BEGIN GENERATED n8n instances (apps/n8n-sso)
            # END GENERATED n8n instances
            - !Find [authentik_providers_proxy.proxyprovider, [name, affine]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, mail]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, webmail]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, netdata]]
            - !Find [authentik_providers_proxy.proxyprovider, [name, hub]]
