          meta_icon: /static/dist/assets/recomex/app-novu.svg
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, novu]]
          meta_launch_url: https://novu.WLDOMAIN
          meta_description: Notificări — fluxuri, abonați, activitate
      #   app-novu-admin   Novu admin   (apps/novu-sso/mapping.json; blueprints-groups.yaml)
      #   app-novu-member  Novu member
