      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, novu]]
          group: !Find [authentik_core.group, [name, platform-admins]]
        attrs: { negate: false, enabled: true, order: 1 }
      # ---- Plunk: a PER-HOST forward-auth provider ------------------------------
      # plunk.WLDOMAIN (pieces/plunk/base/ingress.yaml) carries the same
      # Traefik middleware. Same reasoning as PDFCraft and Novu: a forward_single
      # provider owns the host outright, so ONLY these bindings decide there —
      # never the domain-wide provider's (Plane's). Passing the gate is the whole
      # sign-in: apps/plunk-sso then signs the person into Plunk with the role
      # their groups map to (apps/plunk-sso/mapping.json). Sign-out goes through
      # this provider's logout signature (X-authentik-logout) on plunk.<apex>.
      # The API host (plunk-api.<apex>) is NOT gated — keys and SES webhooks.
      - model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: plunk
        attrs:
          mode: forward_single
          external_host: https://plunk.WLDOMAIN
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          access_token_validity: hours=24
      - model: authentik_core.application
        identifiers:
          slug: plunk
        attrs:
          name: Plunk
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, plunk]]
          meta_launch_url: https://plunk.WLDOMAIN
          meta_description: E-mail — trimitere, primire, șabloane, campanii
          meta_icon: /static/dist/assets/recomex/app-plunk.svg
      # EVERY group apps/plunk-sso/mapping.json names is bound here (engine mode
