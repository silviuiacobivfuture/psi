      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, mail-oidc]]
          group: !Find [authentik_core.group, [name, app-mail-admin]]
        attrs: { negate: false, enabled: true, order: 2 }
