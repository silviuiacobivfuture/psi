# Authentik Blueprint ConfigMap — PROVIDERS + APPLICATIONS (config-as-code).
# Mounted at /blueprints/mounted/, reconciled by the worker on boot.
#
# Delivers:
#   - One OAuth2/OIDC provider + application per OIDC-capable UI:
#       Harbor, Argo CD, Headlamp, OpenBao.
#   - A domain-level forward-auth Proxy provider for the PUBLIC Traefik apps,
#     bound to the embedded outpost (Traefik forwardAuth Middleware targets it).
#
# client_id / client_secret per OIDC app are DETERMINISTIC, injected from env
# (sourced from OpenBao secret/platform/authentik/<app>-oidc) via the chart envFrom +
# the authentik-oidc-clients ESO secret. This lets the SAME id/secret be handed to
# each app's OIDC config (see per-app secrets in gitops/platform/secrets/). Redirect
# URIs use the tailnet/public hostnames.
#
# Flows + scope mappings are referenced inline with !Find (authentik defaults shipped
# by the chart's own system blueprints).
#
# Every application a person can open carries `meta_icon`: its tile in "Aplicațiile
# mele" is otherwise a letter. The icon is a FILE in estate/ (app-<slug>.svg, its
# source and licence in estate/app-icons.json), served by the directory itself at
# /static/dist/assets/recomex/ — never a URL on somebody else's host: the Novu
# tile pointed at a CDN path that never existed and showed a broken image.
# doctor.sh's "Authentik library tiles" layer fetches each one.
#
# Every provider here signs out through `default-invalidation-flow` (the one
# with the user-logout stage), NEVER `default-provider-invalidation-flow`, which
# has no stage at all: an end-session through it says "you signed out of <app>"
# and leaves the Authentik session alive. Measured on dev 2026-10-29 with the
# e2e-hub robot in Chromium: PDF Studio's and Plunk's ?X-authentik-logout=true
# and Plane's outpost sign_out each ran it, Authentik's users/me stayed 200, and
# the next visit to the app signed the robot straight back in. Same finding as
# the hub's provider on 2026-10-23 (blueprints-broker-autorizare-hub.yaml).
# .github/scripts/sso-signout.sh refuses the stage-less flow in any blueprint
# here; doctor.sh ("Authentik sign-out flows") checks the live providers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints-providers
  namespace: authentik
data:
  oidc-providers.yaml: |
    version: 1
    metadata:
      name: WLSLUG-oidc-providers
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    context:
      harbor_client_id:     !Env [AUTHENTIK_OIDC__HARBOR__ID, ""]
      harbor_client_secret: !Env [AUTHENTIK_OIDC__HARBOR__SECRET, ""]
      argo_client_id:       !Env [AUTHENTIK_OIDC__ARGO__ID, ""]
      argo_client_secret:   !Env [AUTHENTIK_OIDC__ARGO__SECRET, ""]
      headlamp_client_id:     !Env [AUTHENTIK_OIDC__HEADLAMP__ID, ""]
      headlamp_client_secret: !Env [AUTHENTIK_OIDC__HEADLAMP__SECRET, ""]
      openbao_client_id:     !Env [AUTHENTIK_OIDC__OPENBAO__ID, ""]
      openbao_client_secret: !Env [AUTHENTIK_OIDC__OPENBAO__SECRET, ""]
      nextcloud_client_id:     !Env [AUTHENTIK_OIDC__NEXTCLOUD__ID, ""]
      nextcloud_client_secret: !Env [AUTHENTIK_OIDC__NEXTCLOUD__SECRET, ""]
    entries:
      # ---------- Groups scope ----------
      # Emits a `groups` claim (the user's Authentik group names) so each app can
      # map groups -> roles (e.g. Argo g,platform-admins,role:admin). Referenced by
      # every OIDC provider's property_mappings below. Without it, tokens carry no
      # groups and RBAC can't match.
      - model: authentik_providers_oauth2.scopemapping
        identifiers:
          name: WLSLUG-groups-scope
        attrs:
          scope_name: groups
          description: "User's Authentik groups (+ expanded role bundles)"
          expression: |
            # Emit the user's group names. ROLE BUNDLES (ROLES.md): if the user is in a
            # bundle-* group, ALSO emit that bundle's entitlement group names — so one
            # bundle assignment grants the mapped app roles without per-app group adds.
            # Also emit email_verified=True: the k8s apiserver REQUIRES it in the id_token
            # when --oidc-username-claim=email (HEADLAMP_K8S_OIDC.md) — without it every
            # OIDC login is rejected with "oidc: email not verified". Our users are
            # federated (GitHub/Google verified) or admin-created, so this is sound.
            # Wrapped so a bad lookup can NEVER break the claim (RBAC depends on it).
            # ⚠ Keep BUNDLES in sync with the bundle-* groups in blueprints-groups.yaml.
            try:
                names = {g.name for g in request.user.ak_groups.all()}
                BUNDLES = {
                    "bundle-platform":  ["app-argocd-admin", "app-harbor-admin", "app-openbao-admin", "app-k8s-admin", "app-dashboards-view"],
                    "bundle-developer": ["app-argocd-view", "app-argocd-developer", "app-harbor-push", "app-openbao-read", "app-openbao-developer", "app-k8s-view", "app-k8s-developer", "app-dashboards-view"],
                    "bundle-viewer":    ["app-dashboards-view"],
                }
                for bundle, ents in BUNDLES.items():
                    if bundle in names:
                        names.update(ents)
                return {"groups": sorted(names), "email_verified": True}
            except Exception:
                return {"groups": [g.name for g in request.user.ak_groups.all()], "email_verified": True}

      # ---------- Harbor ----------
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: harbor
        attrs:
          client_type: confidential
          client_id: !Context harbor_client_id
          client_secret: !Context harbor_client_secret
          # Authentik 2026.5 gates allowed grant types per provider — empty list
          # rejects the authorize as "invalid_request / malformed". signing_key is
          # required to sign the id_token JWT (OIDC). Both omitted = login broken.
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          sub_mode: user_email
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, WLSLUG-groups-scope]]
          # BOTH names for the cutover (docs/estate/02-adrese.md T1): Harbor's
          # sign-in works whichever name it is serving on; the cut keeps the new.
          redirect_uris:
            - matching_mode: strict
              url: https://WLREGISTRY/c/oidc/callback
      - model: authentik_core.application
        identifiers:
          slug: harbor
        attrs:
          name: Harbor
          meta_icon: /static/dist/assets/recomex/app-harbor.svg
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, harbor]]
          meta_launch_url: https://WLREGISTRY

      # ---------- Argo CD ----------
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: argocd
        attrs:
          client_type: confidential
          client_id: !Context argo_client_id
          client_secret: !Context argo_client_secret
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          sub_mode: user_email
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, WLSLUG-groups-scope]]
          redirect_uris:
            - matching_mode: strict
              url: https://argocd.WLTAILNET/auth/callback
            - matching_mode: strict
              url: https://argocd.WLMESH/auth/callback
            - matching_mode: strict
              url: https://argocd.WLTAILNET/api/dex/callback
            - matching_mode: strict
              url: https://argocd.WLMESH/api/dex/callback
      - model: authentik_core.application
        identifiers:
          slug: argocd
        attrs:
          name: Argo CD
          meta_icon: /static/dist/assets/recomex/app-argocd.svg
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, argocd]]
          meta_launch_url: https://argocd.WLTAILNET

      # ---------- Headlamp ----------
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: headlamp
        attrs:
          client_type: confidential
          client_id: !Context headlamp_client_id
          client_secret: !Context headlamp_client_secret
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          sub_mode: user_email
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, WLSLUG-groups-scope]]
          redirect_uris:
            - matching_mode: strict
              url: https://headlamp.WLTAILNET/oidc-callback
            - matching_mode: strict
              url: https://headlamp.WLMESH/oidc-callback
      - model: authentik_core.application
        identifiers:
          slug: headlamp
        attrs:
          name: Headlamp
          meta_icon: /static/dist/assets/recomex/app-headlamp.svg
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, headlamp]]
          meta_launch_url: https://headlamp.WLTAILNET

      # ---------- OpenBao ----------
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: openbao
        attrs:
          client_type: confidential
          client_id: !Context openbao_client_id
          client_secret: !Context openbao_client_secret
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          sub_mode: user_email
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, WLSLUG-groups-scope]]
          redirect_uris:
            # OpenBao OIDC auth method: UI callback + CLI localhost listener.
            - matching_mode: strict
              url: https://openbao.WLTAILNET/ui/vault/auth/oidc/oidc/callback
            - matching_mode: strict
              url: https://openbao.WLMESH/ui/vault/auth/oidc/oidc/callback
            - matching_mode: strict
              url: https://openbao.WLTAILNET/oidc/callback
            - matching_mode: strict
              url: https://openbao.WLMESH/oidc/callback
            - matching_mode: strict
              url: http://localhost:8250/oidc/callback
      - model: authentik_core.application
        identifiers:
          slug: openbao
        attrs:
          name: OpenBao
          meta_icon: /static/dist/assets/recomex/app-openbao.svg
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, openbao]]
          meta_launch_url: https://openbao.WLTAILNET

      # ---------- Nextcloud ----------
      # The collaboration suite (files/Office/Talk) at cloud.WLDOMAIN. PUBLIC,
      # not tailnet-gated: it is the day-to-day workspace for people who are not on
      # the tailnet, so Authentik itself is the only gate.
      #
      # The Nextcloud side of this pairing is written by the occ reconcile CronJob
      # (pieces/nextcloud-platform/base/occ-reconcile.yaml), which registers the
      # provider with the SAME client id/secret — both read OpenBao
      # secret/platform/authentik/nextcloud-oidc, so they cannot drift.
      #
      # user_oidc maps users on `preferred_username`, so the profile scope is
      # REQUIRED (without it the claim is absent and every login creates a new
      # orphaned account). The groups scope drives Nextcloud group provisioning.
      - model: authentik_providers_oauth2.oauth2provider
        identifiers:
          name: nextcloud
        attrs:
          client_type: confidential
          client_id: !Context nextcloud_client_id
          client_secret: !Context nextcloud_client_secret
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
          grant_types:
            - authorization_code
            - refresh_token
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          sub_mode: user_email
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, WLSLUG-groups-scope]]
          redirect_uris:
            - matching_mode: strict
              url: https://cloud.WLDOMAIN/apps/user_oidc/code
      - model: authentik_core.application
        identifiers:
          slug: nextcloud
        attrs:
          name: Nextcloud
          meta_icon: /static/dist/assets/recomex/app-nextcloud.svg
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, nextcloud]]
          meta_launch_url: https://cloud.WLDOMAIN

      # ---- Nextcloud: gate on the entitlement group -------------------------
      # Without a binding an application lets ANY authenticated user through — so
      # before this, a self-enrolled `pending` user (zero entitlements everywhere
      # else) could sign into the collaboration suite. Two bindings, and the
      # engine mode is `any`, so either one grants access:
      #   app-nextcloud-user  the entitlement; how a teammate is granted access
      #   platform-admins     break-glass, for the SAME reason blueprints-admins.yaml
      #                       gives the operator every app-*-admin group: a binding
      #                       must never be able to lock the operator out of the app
      #                       (including during the window where this binding exists
      #                       but the group membership has not reconciled yet).
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, nextcloud]]
          group: !Find [authentik_core.group, [name, app-nextcloud-user]]
        attrs:
          negate: false
          enabled: true
          order: 0
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, nextcloud]]
          group: !Find [authentik_core.group, [name, platform-admins]]
        attrs:
          negate: false
          enabled: true
          order: 1
  proxy-forwardauth.yaml: |
    version: 1
    metadata:
      name: WLSLUG-forward-auth
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    context:
      # AFFiNE's client, from OpenBao platform/authentik/affine-oidc through the
      # authentik-affine-oidc ExternalSecret (affine-oidc-externalsecret.yaml); AFFiNE reads
      # the same path. Empty until seeded: the provider then has a blank secret, nothing else.
      affine_client_id:     !Env [AUTHENTIK_OIDC__AFFINE__ID, ""]
      affine_client_secret: !Env [AUTHENTIK_OIDC__AFFINE__SECRET, ""]
      # The webmail's client secret (pieces/stalwart), from OpenBao platform/authentik/webmail-oidc
      # through the authentik-webmail-oidc ExternalSecret; Roundcube reads the same path.
      webmail_client_secret: !Env [AUTHENTIK_OIDC__WEBMAIL__SECRET, ""]
    entries:
      # Domain-level forward-auth proxy provider for the PUBLIC Traefik apps.
      # mode forward_domain → one outpost cookie covers every host under
      # cookie_domain. It is the APEX (WLDOMAIN), not dev.WLDOMAIN: the gated
      # tools move to <name>.WLDOMAIN (docs/estate/02-adrese.md), and the apex
      # covers the old and the new names alike, so both work throughout the move.
      # Changing it costs each person one extra sign-in (the old cookie no longer
      # matches). The
      # Traefik forwardAuth Middleware (gitops/platform/authentik/middleware-forwardauth.yaml)
      # points at the embedded outpost's /outpost.goauthentik.io/auth/traefik.
      - model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: WLSLUG-forward-auth
        attrs:
          mode: forward_domain
          external_host: https://WLAUTHHOST
          cookie_domain: psizone.ro
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
          access_token_validity: hours=24
      - model: authentik_core.application
        identifiers:
          slug: WLSLUG-forward-auth
        attrs:
          name: WLBRAND forward auth
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, WLSLUG-forward-auth]]
          # The domain-wide gate is plumbing, not something a person opens: hidden
          # from "My applications" (authentik's blank://blank convention). Each app
          # behind it gets its own tile below, e.g. Plane.
          meta_launch_url: blank://blank
      # ---- Plane's tile in "My applications" ------------------------------------
      # Plane is signed into through the domain gate above, which has no launch URL,
      # so without this the library showed "RecomEx Forward Auth" and no Plane. This
      # application carries NO provider — it is the tile, nothing more; access is
      # still decided at the gate. Its bindings match who the gate admits (the Plane
      # role groups and platform-admins, not the e2e robots), so the tile appears
      # exactly for the people Plane will let in.
      - model: authentik_core.application
        identifiers:
          slug: plane
        attrs:
          name: Plane
          meta_icon: /static/dist/assets/recomex/app-plane.svg
          meta_launch_url: https://plane.WLDOMAIN
          meta_description: Proiecte, sarcini și rapoarte de testare
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, plane]]
          group: !Find [authentik_core.group, [name, app-plane-user]]
        attrs: { negate: false, enabled: true, order: 0 }
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, plane]]
          group: !Find [authentik_core.group, [name, app-plane-admin]]
        attrs: { negate: false, enabled: true, order: 1 }
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, plane]]
          group: !Find [authentik_core.group, [name, app-plane-guest]]
        attrs: { negate: false, enabled: true, order: 2 }
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, plane]]
          group: !Find [authentik_core.group, [name, platform-admins]]
        attrs: { negate: false, enabled: true, order: 3 }
      # ---- WHO may pass the forward-auth gate --------------------------------
      # WITHOUT these bindings an application has NO policy attached, and authentik
      # then admits EVERY authenticated user — so any account in the directory could
      # reach every public forward-auth'd app. That was the state until Plane became
      # the first consumer of this middleware; the tailnet gates below always had
      # their own bindings, which is why the gap was easy to miss.
      #
      # SCOPE: this provider is DOMAIN-level (mode forward_domain, cookie_domain
      # WLDOMAIN), so these bindings gate EVERY ingress carrying the
      # authentik-forwardauth middleware — today only plane.WLDOMAIN. When a
      # second app is gated, add ITS entitlement group as a further binding here
      # (engine mode `any` → any one binding grants access); do NOT widen an
      # existing group to cover an unrelated app.
      #
      # Two bindings, same rationale as nextcloud above:
      #   app-plane-user   the entitlement; how a teammate is granted access
      #   platform-admins  break-glass, so a binding can never lock the operator out
      #                    (including in the window where the binding exists but the
      #                    group membership has not reconciled yet)
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, WLSLUG-forward-auth]]
          group: !Find [authentik_core.group, [name, app-plane-user]]
        attrs:
          negate: false
          enabled: true
          order: 0
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, WLSLUG-forward-auth]]
          group: !Find [authentik_core.group, [name, platform-admins]]
        attrs:
          negate: false
          enabled: true
          order: 1
      # The Plane ROLE groups (apps/plane-sso/mapping.yaml) admit at the gate too:
      # a person given only a role group — a Guest, or a robot in rmx-e2e — must
      # reach Plane to be signed in with that role. Every group mapping.yaml names
      # is bound here; a mapped group the gate refuses would be a role nobody can
      # use. doctor.sh checks the two lists agree.
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, WLSLUG-forward-auth]]
          group: !Find [authentik_core.group, [name, app-plane-admin]]
        attrs: { negate: false, enabled: true, order: 2 }
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, WLSLUG-forward-auth]]
          group: !Find [authentik_core.group, [name, app-plane-guest]]
        attrs: { negate: false, enabled: true, order: 3 }
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, WLSLUG-forward-auth]]
          group: !Find [authentik_core.group, [name, app-plane-e2e-member]]
        attrs: { negate: false, enabled: true, order: 4 }
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, WLSLUG-forward-auth]]
          group: !Find [authentik_core.group, [name, app-plane-e2e-guest]]
        attrs: { negate: false, enabled: true, order: 5 }
      # ---- PDFCraft: a PER-HOST forward-auth provider ---------------------------
      # pdf.<apex> carries the same Traefik middleware as Plane, but it must NOT be
      # judged by the domain-wide bindings above (those are Plane's). The embedded
      # outpost looks a request's Host up EXACTLY among proxy/forward_single
      # providers FIRST and falls back to the forward_domain one only when none
      # matches (authentik 2026.5.3 internal/outpost/proxyv2/handlers.go,
      # lookupApp). So this forward_single provider owns pdf.<apex> outright, and
