            - !Find [authentik_providers_oauth2.scopemapping, [name, affine-email-scope]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
          redirect_uris:
            - matching_mode: strict
              url: https://WLAFFINEPREFIX.WLDOMAIN/oauth/callback
      - model: authentik_core.application
        identifiers:
          slug: affine-oidc
        attrs:
          name: AFFiNE (sign-in)
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, affine-oidc]]
          meta_launch_url: blank://blank
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, affine-oidc]]
          group: !Find [authentik_core.group, [name, app-affine-user]]
        attrs: { negate: false, enabled: true, order: 0 }
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, affine-oidc]]
          group: !Find [authentik_core.group, [name, platform-admins]]
        attrs: { negate: false, enabled: true, order: 1 }
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, affine-oidc]]
          group: !Find [authentik_core.group, [name, app-affine-admin]]
        attrs: { negate: false, enabled: true, order: 2 }
      # ---- Mail: the estate's own mail server (pieces/stalwart) --------------------
      # TWO hosts, each behind TWO Authentik checks (the AFFiNE shape), so every browser entry
      # starts here and nobody types a password into a mail page:
      # - <WEBMAIL_HOST_PREFIX>.<apex>, the webmail (Roundcube): the `webmail` edge provider,
      #   then Roundcube's CONFIDENTIAL client `webmail-oidc`, which goes straight to this
      #   sign-in and hands its access token to the mail server as the IMAP/SMTP credential.
      # - <MAIL_HOST_PREFIX>.<apex>, Stalwart's own pages (app passwords for phones,
      #   administration): the `mail` edge provider, then Stalwart's web interface signing in
      #   here as a PUBLIC client with PKCE (`mail-oidc`, no secret: it runs in the browser).
      # Stalwart validates either client's access token (a JWT, audience = the client id) and
      # maps the person to a mailbox by the `mail_address` claim (the `mail` scope below).
      # Phones and desktop mail apps do not come this way: they use app passwords.
