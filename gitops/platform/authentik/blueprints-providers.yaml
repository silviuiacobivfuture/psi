      # the same Traefik middleware, for the dashboard page AND for the /v1 + /v2
      # API paths it calls on that host. Same reasoning as PDFCraft above: a
      # forward_single provider owns the host outright, so the domain-wide
      # bindings (Plane's) never decide who reaches Novu, and a Plane user is not
      # thereby a Novu operator. Its application IS the "Novu" tile in the
      # library (it has a launch URL), so no separate provider-less tile is
      # needed — Plane needs one only because its gate is the domain-wide
      # provider, whose application is hidden.
      - model: authentik_providers_proxy.proxyprovider
        identifiers:
          name: novu
        attrs:
          mode: forward_single
          external_host: https://novu.WLDOMAIN
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
