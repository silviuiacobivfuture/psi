      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, mail]]
          group: !Find [authentik_core.group, [name, platform-admins]]
        attrs: { negate: false, enabled: true, order: 1 }
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, mail]]
          group: !Find [authentik_core.group, [name, app-mail-admin]]
        attrs: { negate: false, enabled: true, order: 2 }
      # The `mail` scope: which mailbox a person owns, as the claim `mail_address`. Their
      # attribute `mail_address` (the whole address, name@<MAILBOX_DOMAIN>) when the estate set
      # one, else their username, to which Stalwart appends <MAILBOX_DOMAIN>. Their `email`
