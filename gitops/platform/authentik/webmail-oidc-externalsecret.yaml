# The webmail's OIDC client secret (the `webmail-oidc` provider in blueprints-providers.yaml,
# pieces/stalwart), as the env var that blueprint reads (AUTHENTIK_OIDC__WEBMAIL__SECRET), from
# OpenBao secret/platform/authentik/webmail-oidc — the path Roundcube itself reads (pieces/stalwart,
# ExternalSecret webmail-app), so the two cannot drift. Seeded by seed-secrets.sh (seed_stalwart).
# Fail loud: explicit data[] key. The chart's secretRef to it is OPTIONAL
# (gitops/apps/overlays/dev/authentik.yaml): a client not seeded yet never holds the directory
# down — the provider has a blank secret meanwhile and the webmail's pods refuse to start, by name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-webmail-oidc
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: authentik-webmail-oidc, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - secretKey: AUTHENTIK_OIDC__WEBMAIL__SECRET
      remoteRef: { key: platform/authentik/webmail-oidc, property: client_secret }
