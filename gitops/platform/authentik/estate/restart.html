<!doctype html>
<!--
  THE SIGN-IN RESTART PAGE — one page for every host behind the Authentik gate.

  The outpost answers its callback 400 with an EMPTY body whenever the callback's
  `state` was minted for another outpost session: a sign-in begun in one browser
  and finished in another, or cookieless requests racing so the last cookie no
  longer matches. The URL keeps the dead state, so reloading repeats the 400 and
  the person is stuck on a blank page (measured 2026-10-29 on novu, pdf, plunk,
  plane: RUNBOOK).

  Traefik's errors middleware `authentik-sso-restart` (sso-restart.yaml) sits in
  front of the gate on every host's callback route and replaces that 400 with
  THIS file, served by authentik-server from /static/dist/assets/recomex/. The
  browser's address stays the callback, so the script reads the state from it:
  the state's `redirect` claim names the page the sign-in was for. It is read
  WITHOUT verifying the signature — it only chooses where to go, and it is
  accepted only if it is https, on this host (or, on auth.<apex>, a host under
  <apex>), and not the outpost's own paths. Anything else goes to this host's
  front page. The fresh start reuses the browser's own outpost cookie, so the
  next callback matches.

  At most three restarts in two minutes (sessionStorage), then it stops and says
  what to do — a callback that keeps failing (the directory's database down) is
  never a redirect loop. Without sessionStorage nothing is counted, so nothing is
  automatic either. Status stays 400.

  The strings are packages/rmx-i18n (namespace `auth`), spliced in by
  packages/rmx-ui/scripts/sso-restart.mjs; its test fails when they differ.
-->
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>…</title>
<style>
:root { color-scheme: light dark; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; font: 16px/1.5 system-ui, sans-serif; }
main { max-width: 34rem; padding: 1.5rem; }
h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
a { color: LinkText; }
</style>
</head>
<body>
<main>
<p id="auto"><span id="auto-text"></span> <a id="auto-link" href="/"></a></p>
<div id="stuck" hidden><h1 id="stuck-title"></h1><p id="stuck-text"></p><p><a id="stuck-link" href="/"></a></p></div>
</main>
<script>
(function () {
	/* ── BEGIN GENERATED MESSAGES ── */
	// biome-ignore format: generated by packages/rmx-ui/scripts/sso-restart.mjs
	const MESSAGES = {"ro":{"auth_restart_auto":"Conectarea nu mai era valabilă (a început în altă fereastră sau a expirat). O reluăm…","auth_restart_continue":"Continuă","auth_restart_stuck_title":"Conectarea nu reușește","auth_restart_stuck":"Am reluat-o de câteva ori fără succes. Închide celelalte ferestre ale aplicației, șterge cookie-urile acestui site, apoi deschide-l din nou. Dacă tot nu merge, anunță echipa de platformă.","auth_restart_open":"Deschide din nou"},"en":{"auth_restart_auto":"This sign-in was no longer valid (it started in another window or expired). Starting it again…","auth_restart_continue":"Continue","auth_restart_stuck_title":"Signing in is not working","auth_restart_stuck":"It was restarted several times without success. Close the application's other windows, clear this site's cookies, then open it again. If it still fails, tell the platform team.","auth_restart_open":"Open again"}};
	/* ── END GENERATED MESSAGES ── */

	var KEY = "recomex-sso-restarts";
	var WINDOW_MS = 120000;
	var MAX = 3;

	/** Where the refused sign-in was going: a same-host (or, on auth.<apex>, an <apex>) https page, else "/". */
	function restartTarget(href) {
		var here = new URL(href);
		var home = here.origin + "/";
		try {
			var state = here.searchParams.get("state") || "";
			var part = (state.split(".")[1] || "").replace(/-/g, "+").replace(/_/g, "/");
			while (part.length % 4) part += "=";
			var claims = JSON.parse(decodeURIComponent(escape(atob(part))));
			if (!claims || typeof claims.redirect !== "string") return home;
			var to = new URL(claims.redirect, here.origin);
			if (to.protocol !== "https:") return home;
			var apex = here.hostname.indexOf("auth.") === 0 ? here.hostname.slice(5) : null;
			var sameHost = to.host === here.host;
			var underApex = apex !== null && to.hostname.slice(-(apex.length + 1)) === "." + apex && to.port === "";
			if (!sameHost && !underApex) return home;
			if (to.pathname.indexOf("/outpost.goauthentik.io") === 0) return home;
			return to.href;
		} catch (e) {
			return home;
		}
	}

	var lang = (navigator.language || "ro").toLowerCase().indexOf("en") === 0 ? "en" : "ro";
	var t = MESSAGES[lang];
	document.documentElement.lang = lang;
	document.title = t.auth_restart_stuck_title;
	var next = restartTarget(location.href);
	document.getElementById("auto-text").textContent = t.auth_restart_auto;
	var autoLink = document.getElementById("auto-link");
	autoLink.textContent = t.auth_restart_continue;
	autoLink.href = next;
	document.getElementById("stuck-title").textContent = t.auth_restart_stuck_title;
	document.getElementById("stuck-text").textContent = t.auth_restart_stuck;
	var stuckLink = document.getElementById("stuck-link");
	stuckLink.textContent = t.auth_restart_open;
	stuckLink.href = next;

	try {
		var now = Date.now();
		var seen = JSON.parse(sessionStorage.getItem(KEY) || "[]").filter(function (at) {
			return typeof at === "number" && now - at < WINDOW_MS;
		});
		if (seen.length >= MAX) throw new Error("stuck");
		seen.push(now);
		sessionStorage.setItem(KEY, JSON.stringify(seen));
	} catch (e) {
		document.getElementById("auto").hidden = true;
		document.getElementById("stuck").hidden = false;
		return;
	}
	location.replace(next);
})();
</script>
</body>
</html>
