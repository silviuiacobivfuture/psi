# AFFiNE's OIDC client (the `affine-oidc` provider in blueprints-providers.yaml), as the env
# vars that blueprint reads (AUTHENTIK_OIDC__AFFINE__ID/SECRET), from OpenBao
# secret/platform/authentik/affine-oidc — the path AFFiNE itself reads (pieces/affine,
# ExternalSecret affine-app), so the two cannot drift. Seeded by seed-secrets.sh.
# Fail loud: explicit data[] keys; a missing one makes this SecretSyncedError. The chart's
# secretRef to it is OPTIONAL (gitops/apps/overlays/dev/authentik.yaml): a client not seeded
# yet never holds the directory down — the provider shows an empty client id meanwhile and
# AFFiNE's own pods refuse to start, by name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-affine-oidc
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: authentik-affine-oidc, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - secretKey: AUTHENTIK_OIDC__AFFINE__ID
      remoteRef: { key: platform/authentik/affine-oidc, property: client_id }
    - secretKey: AUTHENTIK_OIDC__AFFINE__SECRET
      remoteRef: { key: platform/authentik/affine-oidc, property: client_secret }
