apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# The white-label values every overlay reads through kustomize `replacements`. GENERATED from the
# estate identity file:
#   node tools/identity/load.mjs configmap <identity.yaml> > whitelabel-config.yaml
# SEB ships it rendered from its test fixture; every estate render (tools/estate-repo.mjs, the bundle
# builder) renders it again from the estate's own identity.
resources:
  - whitelabel-config.yaml
