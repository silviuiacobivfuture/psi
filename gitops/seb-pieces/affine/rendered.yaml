apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: affine-db
  namespace: affine
spec:
  backup:
    barmanObjectStore:
      data:
        compression: gzip
      destinationPath: s3://psi-tfstate-dev/cnpg/affine-db
      endpointURL: https://nbg1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          key: AWS_ACCESS_KEY_ID
          name: affine-backup-s3
        secretAccessKey:
          key: AWS_SECRET_ACCESS_KEY
          name: affine-backup-s3
      wal:
        compression: gzip
        maxParallel: 2
    retentionPolicy: 14d
  bootstrap:
    initdb:
      database: affine
      encoding: UTF8
      localeCType: C
      localeCollate: C
      owner: affine
      postInitApplicationSQL:
      - CREATE EXTENSION IF NOT EXISTS "vector"
      - CREATE EXTENSION IF NOT EXISTS "pgcrypto"
      secret:
        name: affine-db-app
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-system-trixie
  instances: 1
  postgresql:
    parameters:
      effective_cache_size: 192MB
      max_connections: "50"
      shared_buffers: 48MB
      work_mem: 8MB
  primaryUpdateStrategy: unsupervised
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 64Mi
  smartShutdownTimeout: 10
  storage:
    size: 5Gi
    storageClass: local-path
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: affine-db-base
  namespace: affine
spec:
  backupOwnerReference: self
  cluster:
    name: affine-db
  immediate: true
  schedule: 0 0 3 * * 0
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: affine-local-auth-off
  namespace: affine
spec:
  ipAllowList:
    sourceRange:
    - 127.0.0.1/32
