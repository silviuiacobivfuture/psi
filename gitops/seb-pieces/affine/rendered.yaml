    metadata:
      labels:
        app.kubernetes.io/name: affine
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - node
        - ./dist/main.js
        env:
        - name: HOME
          value: /home/affine
        - name: NODE_ENV
          value: production
        - name: AFFINE_SERVER_HTTPS
          value: "true"
        - name: AFFINE_INDEXER_ENABLED
          value: "false"
        - name: REDIS_SERVER_HOST
