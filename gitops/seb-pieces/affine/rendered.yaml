apiVersion: v1
data:
  first-admin.mjs: "// The instance's first account, made by us — never by a stranger.
    A fresh AFFiNE answers\n// POST /api/setup/create-admin-user to ANYONE until one
    account exists (AFFiNE\n// core/selfhost/controller.ts), and makes that account
    the instance's administrator. So the\n// moment the server is up, this job claims
    it for the estate operator (OPERATOR_EMAIL) with a\n// password nobody is given
    (OpenBao apps/affine/app admin_password). The operator then signs\n// in through
    Authentik and AFFiNE lands them on this same account, by e-mail.\n//\n// Idempotent:
    \"First user already created\" (403) is success — the instance is claimed.\n//
    Anything else fails the job loudly, by status and message.\nconst base = process.env.AFFINE_URL
    ?? \"http://affine:3010\";\nconst email = process.env.ADMIN_EMAIL ?? \"\";\nconst
    password = process.env.ADMIN_PASSWORD ?? \"\";\nfor (const [k, v] of [\n\t[\"ADMIN_EMAIL\",
    email],\n\t[\"ADMIN_PASSWORD\", password],\n]) {\n\tif (!v) {\n\t\tprocess.stderr.write(`MISSING
    REQUIRED SECRET: ${k}\\n`);\n\t\tprocess.exit(1);\n\t}\n}\nconst sleep = (ms)
    => new Promise((r) => setTimeout(r, ms));\nlet up = false;\nfor (let i = 0; i
    < 90 && !up; i++) {\n\ttry {\n\t\tup = (await fetch(`${base}/info`)).ok;\n\t}
    catch {\n\t\tup = false;\n\t}\n\tif (!up) await sleep(5000);\n}\nif (!up) {\n\tprocess.stderr.write(`FATAL:
    ${base}/info did not answer within 7.5 minutes\\n`);\n\tprocess.exit(1);\n}\nconst
    res = await fetch(`${base}/api/setup/create-admin-user`, {\n\tmethod: \"POST\",\n\theaders:
    { \"content-type\": \"application/json\" },\n\tbody: JSON.stringify({ email, password,
    name: \"Administrator\" }),\n});\nconst text = await res.text();\nif (res.ok)
    {\n\tprocess.stdout.write(`first account created for ${email}: the instance is
    claimed\\n`);\n} else if (res.status === 403 && text.includes(\"First user already
    created\")) {\n\tprocess.stdout.write(\"the instance already has its first account:
    nothing to do\\n\");\n} else {\n\tprocess.stderr.write(`FATAL: create-admin-user
    answered ${res.status}: ${text.slice(0, 300)}\\n`);\n\tprocess.exit(1);\n}\n"
  write-config.mjs: "// AFFiNE's config.json, written at every start from the estate's
    settings (ConfigMap\n// affine-settings) and its secrets (Secret affine-app),
    into $HOME/.affine/config/ — the\n// path the server and its migration read (AFFiNE
    base/config/register.ts, CONFIG_JSON_PATHS).\n// Run by the server's own image
    (node), so it needs nothing of ours.\n//\n// Why a file and not env: the sign-in
    provider, the storage and the sign-up switches have NO\n// environment variable
    in AFFiNE (0.27.4: only the host, the URL, Redis, the key and the\n// mailer do).
    And AFFiNE IGNORES a config.json it cannot parse (\"Invalid json config file\",\n//
    then the defaults: open sign-up, files on the pod's disk). So this file is written
    by\n// JSON.stringify — never by a template — and read back before the server
    starts.\n//\n// What it decides, and why:\n//   auth.allowSignup false           no
    account is made with an e-mail and a password\n//   auth.allowSignupForOauth true
    \   an account is made by the first Authentik sign-in —\n//                                    Authentik
    decides who may (app-affine-user, -admin)\n//   oauth.providers.oidc             the
    estate's Authentik, client `affine-oidc`\n//   storages blob + avatar           the
    estate's bucket; usePresignedURL OFF, so every file\n//                                    passes
    through the server (and its gate) and no\n//                                    browser
    is ever sent to the bucket (no CORS needed)\n//   flags.allowGuestDemoWorkspace
    \   false: nothing is made by someone who is not signed in\n//   copilot / indexer
    \               off: no AI provider, no search engine to run\nimport { mkdirSync,
    readFileSync, writeFileSync } from \"node:fs\";\nimport { homedir } from \"node:os\";\nimport
    { join } from \"node:path\";\n\nconst need = [\n\t\"OIDC_ISSUER\",\n\t\"OIDC_CLIENT_ID\",\n\t\"OIDC_CLIENT_SECRET\",\n\t\"S3_ENDPOINT\",\n\t\"S3_REGION\",\n\t\"S3_BUCKET\",\n\t\"S3_ACCESS_KEY_ID\",\n\t\"S3_SECRET_ACCESS_KEY\",\n];\nconst
    missing = need.filter((k) => !process.env[k]);\nif (missing.length > 0) {\n\tfor
    (const k of missing) process.stderr.write(`MISSING REQUIRED SECRET: ${k}\\n`);\n\tprocess.exit(1);\n}\nconst
    env = (k) => process.env[k] ?? \"\";\n\nconst s3 = {\n\tprovider: \"aws-s3\",\n\tbucket:
    env(\"S3_BUCKET\"),\n\tconfig: {\n\t\tendpoint: env(\"S3_ENDPOINT\"),\n\t\tregion:
    env(\"S3_REGION\"),\n\t\tforcePathStyle: true,\n\t\tcredentials: {\n\t\t\taccessKeyId:
    env(\"S3_ACCESS_KEY_ID\"),\n\t\t\tsecretAccessKey: env(\"S3_SECRET_ACCESS_KEY\"),\n\t\t},\n\t\tusePresignedURL:
    { enabled: false },\n\t},\n};\nconst config = {\n\t$schema: \"https://github.com/toeverything/affine/releases/latest/download/config.schema.json\",\n\tauth:
    {\n\t\tallowSignup: false,\n\t\tallowSignupForOauth: true,\n\t},\n\toauth: {\n\t\t\"providers.oidc\":
    {\n\t\t\tclientId: env(\"OIDC_CLIENT_ID\"),\n\t\t\tclientSecret: env(\"OIDC_CLIENT_SECRET\"),\n\t\t\tissuer:
    env(\"OIDC_ISSUER\"),\n\t\t\tallowPrivateNetwork: false,\n\t\t\targs: { scope:
    \"openid profile email\" },\n\t\t},\n\t},\n\tstorages: {\n\t\t\"blob.storage\":
    s3,\n\t\t\"avatar.storage\": s3,\n\t},\n\tflags: { allowGuestDemoWorkspace: false
    },\n\tcopilot: { enabled: false },\n\tindexer: { enabled: false },\n};\n\nconst
    dir = join(homedir(), \".affine\", \"config\");\nmkdirSync(dir, { recursive: true
    });\nconst file = join(dir, \"config.json\");\nwriteFileSync(file, JSON.stringify(config,
    null, 2), { mode: 0o600 });\n// Read back: what AFFiNE will parse is exactly what
    was meant.\nconst back = JSON.parse(readFileSync(file, \"utf8\"));\nif (back.oauth[\"providers.oidc\"].issuer
    !== env(\"OIDC_ISSUER\") || back.auth.allowSignup !== false) {\n\tprocess.stderr.write(`FATAL:
    ${file} does not read back as written\\n`);\n\tprocess.exit(1);\n}\nprocess.stdout.write(\n\t`wrote
    ${file}: sign-in ${env(\"OIDC_ISSUER\")}, files in ${env(\"S3_BUCKET\")} at ${env(\"S3_ENDPOINT\")}\\n`,\n);\n"
kind: ConfigMap
metadata:
  name: affine-scripts-8k77c86m66
  namespace: affine
