        - name: NODE_OPTIONS
          value: --max-old-space-size=1024
        envFrom:
        - configMapRef:
            name: affine-settings
        - secretRef:
            name: affine-app
        image: registry.psizone.ro/mirror/ghcr.io/toeverything/affine:0.27.4@sha256:c312116a134184947d98749c8a8e29f4e3bc97f4f2a51c9a3497f9baea2eec2b
        livenessProbe:
          failureThreshold: 4
          httpGet:
            path: /info
            port: http
          periodSeconds: 30
        name: affine
        ports:
        - containerPort: 3010
          name: http
        readinessProbe:
          httpGet:
            path: /info
            port: http
          periodSeconds: 10
        resources:
          limits:
            cpu: "2"
            memory: 1536Mi
          requests:
            cpu: 50m
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /info
            port: http
          periodSeconds: 5
        volumeMounts:
        - mountPath: /home/affine
          name: home
        - mountPath: /tmp
          name: tmp
        - mountPath: /scripts
          name: scripts
          readOnly: true
        - mountPath: /app/src
          name: generated
      enableServiceLinks: false
      initContainers:
      - args:
        - |
          for k in DATABASE_URL REDIS_SERVER_PASSWORD AFFINE_PRIVATE_KEY OIDC_CLIENT_ID OIDC_CLIENT_SECRET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY; do
            eval "v=\${$k:-}"
            [ -n "$v" ] || { echo "MISSING REQUIRED SECRET: $k" >&2; exit 1; }
          done
          echo "all required secrets present"
        command:
        - sh
        - -c
        envFrom:
        - secretRef:
            name: affine-app
        image: registry.psizone.ro/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
        name: assert-secrets
        resources:
          limits:
            cpu: 100m
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      - command:
        - node
        - /scripts/write-config.mjs
        env:
        - name: HOME
          value: /home/affine
        - name: NODE_ENV
          value: production
        - name: AFFINE_SERVER_HTTPS
          value: "true"
        - name: AFFINE_INDEXER_ENABLED
          value: "false"
        - name: REDIS_SERVER_HOST
          value: affine-redis
        - name: REDIS_SERVER_PORT
          value: "6379"
        - name: NODE_OPTIONS
          value: --max-old-space-size=1024
        envFrom:
        - configMapRef:
            name: affine-settings
        - secretRef:
            name: affine-app
        image: registry.psizone.ro/mirror/ghcr.io/toeverything/affine:0.27.4@sha256:c312116a134184947d98749c8a8e29f4e3bc97f4f2a51c9a3497f9baea2eec2b
        name: config
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /home/affine
          name: home
        - mountPath: /tmp
          name: tmp
        - mountPath: /scripts
          name: scripts
          readOnly: true
      - command:
        - node
        - ./scripts/self-host-predeploy.js
        env:
        - name: HOME
          value: /home/affine
        - name: NODE_ENV
          value: production
        - name: AFFINE_SERVER_HTTPS
          value: "true"
        - name: AFFINE_INDEXER_ENABLED
          value: "false"
        - name: REDIS_SERVER_HOST
          value: affine-redis
        - name: REDIS_SERVER_PORT
          value: "6379"
        - name: NODE_OPTIONS
          value: --max-old-space-size=1024
        envFrom:
        - configMapRef:
            name: affine-settings
        - secretRef:
            name: affine-app
        image: registry.psizone.ro/mirror/ghcr.io/toeverything/affine:0.27.4@sha256:c312116a134184947d98749c8a8e29f4e3bc97f4f2a51c9a3497f9baea2eec2b
        name: migrate
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 50m
            memory: 192Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /home/affine
          name: home
        - mountPath: /tmp
          name: tmp
        - mountPath: /scripts
          name: scripts
          readOnly: true
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir:
          sizeLimit: 64Mi
        name: home
      - emptyDir:
          sizeLimit: 512Mi
        name: tmp
      - emptyDir:
          sizeLimit: 16Mi
        name: generated
      - configMap:
          name: affine-scripts-8k77c86m66
        name: scripts
