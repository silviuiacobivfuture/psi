apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  labels:
    seb.platform/piece: cert-manager
  name: letsencrypt-prod
spec:
  acme:
    email: certificates@psizone.ro
    privateKeySecretRef:
      name: letsencrypt-prod-key
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            key: token
            name: cloudflare-api-token
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  labels:
    seb.platform/piece: cert-manager
  name: letsencrypt-staging
spec:
  acme:
    email: certificates@psizone.ro
    privateKeySecretRef:
      name: letsencrypt-staging-key
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            key: token
            name: cloudflare-api-token
