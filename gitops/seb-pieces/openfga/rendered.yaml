apiVersion: v1
kind: ResourceQuota
metadata:
  labels:
    seb.platform/piece: openfga
  name: openfga
  namespace: openfga
spec:
  hard:
    limits.cpu: "6"
    limits.memory: 4Gi
    persistentvolumeclaims: "4"
    requests.cpu: "2"
    requests.memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: openfga
    seb.platform/piece: openfga
  name: openfga
  namespace: openfga
spec:
  ports:
  - name: app
    port: 8081
    targetPort: app
  selector:
    app: openfga
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: openfga
    seb.platform/piece: openfga
  name: openfga-admin
  namespace: openfga
spec:
  ports:
  - name: admin
    port: 8080
    targetPort: admin
  selector:
    app: openfga
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
    reloader.stakater.com/auto: "true"
  labels:
    app: openfga
    seb.platform/piece: openfga
  name: openfga
  namespace: openfga
spec:
  replicas: 2
  selector:
    matchLabels:
      app: openfga
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: openfga
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: openfga
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - args:
        - run
        env:
        - name: OPENFGA_DATASTORE_ENGINE
          value: postgres
        - name: OPENFGA_DATASTORE_URI
          valueFrom:
            secretKeyRef:
              key: uri
              name: openfga-db-app
        - name: OPENFGA_HTTP_ADDR
          value: 0.0.0.0:8080
        - name: OPENFGA_GRPC_ADDR
          value: 127.0.0.1:8082
        - name: OPENFGA_METRICS_ADDR
          value: 127.0.0.1:2112
        - name: OPENFGA_AUTHN_METHOD
          value: preshared
        - name: OPENFGA_AUTHN_PRESHARED_KEYS
          valueFrom:
            secretKeyRef:
              key: OPENFGA_AUTHN_PRESHARED_KEYS
              name: openfga-secrets
        - name: OPENFGA_LOG_LEVEL
          value: info
        - name: OPENFGA_LOG_FORMAT
          value: json
        - name: OPENFGA_PLAYGROUND_ENABLED
          value: "false"
        image: registry.psizone.ro/mirror/docker.io/openfga/openfga:v1.19.0@sha256:b9543c46f1efd110968ef1d4db65194348651b99f11d013c63a5207c95a3b86c
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: openfga
        ports:
        - containerPort: 8080
          name: admin
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 2
          periodSeconds: 10
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      - command:
        - /authzfilter
        env:
        - name: OPENFGA_UPSTREAM
          value: http://127.0.0.1:8080
        - name: LISTEN_ADDR
          value: :8081
        image: registry.psizone.ro/psi/autorizare-svc:REPLACE_ME
        livenessProbe:
          httpGet:
            path: /healthz
            port: app
          initialDelaySeconds: 5
          periodSeconds: 20
        name: authzfilter
        ports:
        - containerPort: 8081
          name: app
        readinessProbe:
          httpGet:
            path: /healthz
            port: app
          initialDelaySeconds: 2
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      imagePullSecrets:
      - name: harbor-pull
      initContainers:
      - command:
        - sh
        - -c
        - '[ -n "${OPENFGA_AUTHN_PRESHARED_KEYS:-}" ] || { echo "MISSING REQUIRED
          SECRET: OPENFGA_AUTHN_PRESHARED_KEYS" >&2; exit 1; }; [ -n "${OPENFGA_DATASTORE_URI:-}"
          ] || { echo "MISSING REQUIRED SECRET: OPENFGA_DATASTORE_URI" >&2; exit 1;
          }; echo secrets-ok'
        env:
        - name: OPENFGA_AUTHN_PRESHARED_KEYS
          valueFrom:
            secretKeyRef:
              key: OPENFGA_AUTHN_PRESHARED_KEYS
              name: openfga-secrets
        - name: OPENFGA_DATASTORE_URI
          valueFrom:
            secretKeyRef:
              key: uri
              name: openfga-db-app
        image: registry.psizone.ro/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
        name: assert-secrets
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
      - args:
        - migrate
        env:
        - name: OPENFGA_DATASTORE_ENGINE
          value: postgres
        - name: OPENFGA_DATASTORE_URI
          valueFrom:
            secretKeyRef:
              key: uri
              name: openfga-db-app
        image: registry.psizone.ro/mirror/docker.io/openfga/openfga:v1.19.0@sha256:b9543c46f1efd110968ef1d4db65194348651b99f11d013c63a5207c95a3b86c
        name: migrate
        resources:
          limits:
            cpu: "1"
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    seb.platform/piece: openfga
  name: openfga
  namespace: openfga
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: openfga
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    seb.platform/piece: openfga
  name: harbor-pull
  namespace: openfga
spec:
  data:
  - remoteRef:
      key: platform/harbor/pull
      property: username
    secretKey: username
  - remoteRef:
      key: platform/harbor/pull
      property: password
    secretKey: password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: harbor-pull
    template:
      data:
        .dockerconfigjson: |
          {"auths":{"registry.psizone.ro":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
      type: kubernetes.io/dockerconfigjson
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    seb.platform/piece: openfga
  name: openfga-backup-s3
  namespace: openfga
spec:
  data:
  - remoteRef:
      key: platform/object-storage/dev
      property: access_key_id
    secretKey: AWS_ACCESS_KEY_ID
  - remoteRef:
      key: platform/object-storage/dev
      property: secret_access_key
    secretKey: AWS_SECRET_ACCESS_KEY
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: openfga-backup-s3
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    seb.platform/piece: openfga
  name: openfga-db-app
  namespace: openfga
spec:
  data:
  - remoteRef:
      key: apps/openfga/db
      property: username
    secretKey: username
  - remoteRef:
      key: apps/openfga/db
      property: password
    secretKey: password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: openfga-db-app
    template:
      data:
        password: '{{ .password }}'
        uri: postgres://{{ .username }}:{{ .password }}@openfga-db-rw.openfga.svc:5432/openfga?sslmode=disable
        username: '{{ .username }}'
      type: kubernetes.io/basic-auth
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    seb.platform/piece: openfga
  name: openfga-secrets
  namespace: openfga
spec:
  data:
  - remoteRef:
      key: apps/openfga/env
      property: OPENFGA_AUTHN_PRESHARED_KEYS
    secretKey: OPENFGA_AUTHN_PRESHARED_KEYS
  refreshInterval: 30s
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: openfga-secrets
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    seb.platform/piece: openfga
  name: openfga
  namespace: openfga
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: autorizare
      podSelector:
        matchLabels:
          app: autorizare-svc
    ports:
    - port: 8080
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: autorizare
      podSelector:
        matchLabels:
          app: autorizare-hub
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: authentik
      podSelector:
        matchLabels:
          app.kubernetes.io/component: server
          app.kubernetes.io/name: authentik
    ports:
    - port: 8081
      protocol: TCP
  - from:
    - ipBlock:
        cidr: 10.0.1.10/32
    - ipBlock:
        cidr: 10.0.1.1/32
    - ipBlock:
        cidr: 10.42.0.1/32
    - ipBlock:
        cidr: 10.42.1.1/32
    ports:
    - port: 8081
      protocol: TCP
  podSelector:
    matchLabels:
      app: openfga
  policyTypes:
  - Ingress
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    seb.platform/piece: openfga
  name: openfga-db
  namespace: openfga
spec:
  backup:
    barmanObjectStore:
      data:
        compression: gzip
      destinationPath: s3://psi-tfstate-dev/cnpg/openfga-db
      endpointURL: https://nbg1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          key: AWS_ACCESS_KEY_ID
          name: openfga-backup-s3
        secretAccessKey:
          key: AWS_SECRET_ACCESS_KEY
          name: openfga-backup-s3
      wal:
        compression: gzip
        maxParallel: 2
    retentionPolicy: 30d
  bootstrap:
    initdb:
      database: openfga
      owner: openfga
      secret:
        name: openfga-db-app
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  instances: 1
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 192Mi
  smartShutdownTimeout: 10
  storage:
    size: 10Gi
    storageClass: hcloud-volumes
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  labels:
    seb.platform/piece: openfga
  name: openfga-db-base
  namespace: openfga
spec:
  backupOwnerReference: self
  cluster:
    name: openfga-db
  immediate: true
  schedule: 0 0 4 * * 0
