apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
  name: reportportal-email-reconcile
  namespace: reportportal
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: reportportal-email-reconcile
        spec:
          automountServiceAccountToken: false
          containers:
          - command:
            - /bin/sh
            - -c
            - |
              set -eu

              W=/work
              UAT=http://reportportal-uat.reportportal.svc.cluster.local:9999/uat
              API=http://reportportal-api.reportportal.svc.cluster.local:8585/api

              die() { echo "reportportal-email-reconcile: FAILED — $*" >&2; exit 1; }

              # Present-but-EMPTY is the case ESO's data[] cannot catch; an
              # ABSENT key already makes the ExternalSecret SecretSyncedError.
              [ -n "${SMTP_PASSWORD:-}" ] || die "MISSING REQUIRED SECRET: email-sender/EMAIL_API_KEY"
              [ -n "${SMTP_FROM:-}" ] || die "MISSING REQUIRED SECRET: email-sender/EMAIL_FROM"
              [ -n "${RP_SUPERADMIN_PASSWORD:-}" ] || die "MISSING REQUIRED SECRET: reportportal-superadmin/password"

              umask 077

              # Every credential reaches curl through a FILE, never argv:
              # `ps` / /proc/<pid>/cmdline are readable inside this pod, and an
              # SMTP password on a command line is the same class of leak the
              # seed script's stdin plumbing exists to avoid. `printf` is a
              # shell builtin, so the value never becomes an exec'd argv either.
              printf 'user = "ui:uiman"\n' > "$W/uat.cfg"
              printf '%s' "$RP_SUPERADMIN_PASSWORD" > "$W/pw.txt"

              # http <outfile> <curl args...> -> prints the status code
              # ("000" on a transport error) instead of aborting, so every
              # failure is reported with its own named message.
              http() {
                _out="$1"; shift
                _code="$(curl -sS --max-time 60 -o "$_out" -w '%{http_code}' "$@" 2>>"$W/curl.err")" || _code=000
                printf '%s' "$_code"
              }

              # --- 1. mint a superadmin token -------------------------------
              CODE="$(http "$W/token.json" -K "$W/uat.cfg" \
                --data 'grant_type=password' \
                --data 'username=superadmin' \
                --data-urlencode "password@$W/pw.txt" \
                "$UAT/sso/oauth/token")"
              [ "$CODE" = 200 ] || die "POST /uat/sso/oauth/token -> $CODE (expected 200). The most likely cause is a STALE superadmin password: uat applies secret/apps/reportportal/superadmin ONLY when the row is created, so a password changed in the RP UI must be written back to OpenBao — see infrastructure/hetzner/RUNBOOK.md"
              TOKEN="$(jq -r '.access_token // empty' "$W/token.json")"
              [ -n "$TOKEN" ] || die "POST /uat/sso/oauth/token returned 200 with no access_token"
              printf 'header = "Authorization: Bearer %s"\n' "$TOKEN" > "$W/api.cfg"
              printf 'header = "Content-Type: application/json"\n' >> "$W/api.cfg"

              # --- 2. desired state -----------------------------------------
              # jq reads the secrets from the ENVIRONMENT, so they are not argv
              # here either. `port` string + boolean flags: see the header.
              jq -n '{
                name: "email",
                enabled: true,
                integrationParameters: {
                  host:           env.SMTP_HOST,
                  port:           env.SMTP_PORT,
                  protocol:       "smtp",
                  authEnabled:    true,
                  starTlsEnabled: true,
                  sslEnabled:     false,
                  username:       env.SMTP_USERNAME,
                  password:       env.SMTP_PASSWORD,
                  from:           env.SMTP_FROM,
                  rpHost:         env.RP_HOST
                }
              }' > "$W/create.json"
              # The UI omits `name` on update and so do we — see the header.
              jq 'del(.name)' "$W/create.json" > "$W/update.json"

              # Canonical, TYPE-NORMALISED projection of the comparable fields.
              # `tostring` on both sides is load-bearing: the API may hand back
              # a boolean where we sent a boolean and a string where we sent a
              # string, but a jsonb round-trip is not guaranteed to preserve
              # that — and a too-strict compare would report drift on EVERY run,
              # i.e. an emailed test message every 15 minutes, which is the
              # exact failure this design exists to prevent. `password` is
              # absent by construction: the API never returns it.
              PROJECT='{
                enabled: (.enabled | tostring),
                p: (.integrationParameters
                    | { host, port, protocol, authEnabled, starTlsEnabled,
                        sslEnabled, username, from, rpHost }
                    | with_entries(.value |= (if . == null then "" else tostring end)))
              }'
              WANT="$(jq -Sc "$PROJECT" "$W/create.json")"

              # --- 3. what exists today -------------------------------------
              CODE="$(http "$W/list.json" -K "$W/api.cfg" "$API/v1/integration/global/all/email")"
              [ "$CODE" = 200 ] || die "GET /api/v1/integration/global/all/email -> $CODE (expected 200)"
              COUNT="$(jq 'length' "$W/list.json")"

              # write <method> <url> <bodyfile> <what>
              # --data-binary, NOT --data: --data STRIPS newlines from a file,
              # which happens to leave this JSON valid but only by luck.
              write() {
                _c="$(http "$W/resp.json" -K "$W/api.cfg" -X "$1" --data-binary "@$3" "$2")"
                case "$_c" in
                  200|201) echo "reportportal-email-reconcile: $4 OK ($1 $2 -> $_c)" ;;
                  # RP validates the config by actually sending the test mail,
                  # so a rejected write means the SMTP settings or the relay
                  # key are wrong — surface its own message, do not swallow it.
                  # The `|| true` matters: without it a non-JSON error body
                  # makes jq fail, `set -e` aborts mid-argument and the job dies
                  # with NO named reason — the opposite of the contract here.
                  *) die "$1 $2 -> $_c: $( (jq -r '.message // .error_description // empty' "$W/resp.json" 2>/dev/null || head -c 400 "$W/resp.json") | head -c 400 )" ;;
                esac
              }

              if [ "$COUNT" -gt 1 ]; then
                die "$COUNT global email integrations exist; expected at most 1. Refusing to guess which one is authoritative — delete the extras in Administrate -> Integrations and re-run"
              fi

              if [ "$COUNT" -eq 0 ]; then
                echo "reportportal-email-reconcile: no email integration — creating (ReportPortal will send ONE 'Email server integration creation' message to $SMTP_FROM)"
                write POST "$API/v1/integration/email" "$W/create.json" "create"
                exit 0
              fi

              ID="$(jq -r '.[0].id' "$W/list.json")"
              HAVE="$(jq -Sc ".[0] | $PROJECT" "$W/list.json")"

              if [ "$HAVE" != "$WANT" ]; then
                echo "reportportal-email-reconcile: drift on integration $ID — reconciling"
                echo "  have: $HAVE"
                echo "  want: $WANT"
                write PUT "$API/v1/integration/$ID" "$W/update.json" "update"
                exit 0
              fi

              # --- 4. parameters match: is the CREDENTIAL still good? --------
              # Sends no mail (JavaMailSender.testConnection = SMTP connect +
              # AUTH). This is the only way to notice a rotated sender key,
              # because the stored password is never returned.
              CODE="$(http "$W/test.json" -K "$W/api.cfg" "$API/v1/integration/$ID/connection/test")"
              if [ "$CODE" = 200 ] && [ "$(cat "$W/test.json")" = true ]; then
                echo "reportportal-email-reconcile: in sync (integration $ID, $SMTP_HOST:$SMTP_PORT, from $SMTP_FROM) — no write, no mail"
                exit 0
              fi

              echo "reportportal-email-reconcile: connection test failed (-> $CODE) while the parameters match — the stored password is stale or the server is unreachable; re-pushing the credential"
              write PUT "$API/v1/integration/$ID" "$W/update.json" "credential repair"
              CODE="$(http "$W/test.json" -K "$W/api.cfg" "$API/v1/integration/$ID/connection/test")"
              if [ "$CODE" = 200 ] && [ "$(cat "$W/test.json")" = true ]; then
                echo "reportportal-email-reconcile: credential repaired, connection test now passes"
                exit 0
              fi
              die "connection test STILL fails after re-pushing the credential (-> $CODE). ReportPortal cannot send mail: check the reports sender key (secret/apps/reportportal/plunk, plunk-bootstrap.sh), cluster-dns, and that $SMTP_HOST:$SMTP_PORT is reachable from this namespace"
            env:
            - name: SMTP_HOST
              value: plunk-smtp.psizone.ro
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USERNAME
              value: plunk
            - name: RP_HOST
              value: https://reports.psizone.ro
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: EMAIL_API_KEY
                  name: email-sender
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  key: EMAIL_FROM
                  name: email-sender
            - name: RP_SUPERADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: reportportal-superadmin
            image: registry.psizone.ro/mirror/docker.io/alpine/k8s:1.30.3@sha256:12d9fc5d5e9467c7d932a18015ddfe48bdf2e02dd5677507f155ac05fdd63b73
            name: reconcile
            resources:
              limits:
                cpu: 200m
                memory: 256Mi
              requests:
                cpu: 25m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
            - mountPath: /work
              name: work
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - emptyDir: {}
            name: work
  schedule: '*/15 * * * *'
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
