metadata:
  name: stalwart-admin
  namespace: stalwart
spec:
  data:
  - remoteRef:
      key: apps/stalwart/admin
      property: password
    secretKey: password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    name: stalwart-admin
    template:
      data:
        STALWART_PASSWORD: '{{ .password }}'
        STALWART_RECOVERY_ADMIN: admin:{{ .password }}
        STALWART_USER: admin
