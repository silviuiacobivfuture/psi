    #ffffff;\n\t--psi-paper-ink: #16120a;\n\t--psi-paper-line: #d8cbae;\n}\nhtml.dark-mode
    {\n\t--psi-primary: #c2983f;\n\t--psi-primary-hover: #cda449;\n\t--psi-ring: #40d9c9;\n\t--psi-paper-line:
    #3e3626;\n}\n\n/* ---- faces ---- */\nbody,\ninput,\nselect,\ntextarea,\nbutton,\n.popover,\n.ui-dialog,\n.menu
    span.inner,\n.listing,\n.messagelist,\n#messagebody .message-part pre,\n#messagebody
    .message-part div.pre {\n\tfont-family: var(--psi-font);\n}\n/* A plain-text message
    in the reading face rather than a typewriter. */\n#messagebody .message-part div.pre
    {\n\tfont-size: 0.95rem;\n\tline-height: 1.6;\n}\n#message-header > .subject,\n.ui-dialog
    .ui-dialog-title {\n\tfont-family: var(--psi-display);\n\tfont-weight: 500;\n}\n\n/*
    ---- accent fills: dark ink on gold, as on psi's sign-in (white on gold is below
    AA) ---- */\n.btn-primary,\n.btn-primary:not(:disabled):not(.disabled),\n.btn-primary:not(:disabled):not(.disabled):active,\n.btn-primary:hover,\n.btn-primary:focus,\n.ui-dialog
    .ui-dialog-buttonset .btn-primary,\n.listing .unread .msgcount,\n.listing li .unreadcount,\n.messagelist
    tr td span.msgcount,\n#taskmenu a .unread-count,\n.badge {\n\tcolor: var(--psi-on-primary)
    !important;\n}\n.btn-primary,\n.btn-primary:not(:disabled):not(.disabled) {\n\tbackground-color:
    var(--psi-primary);\n\tborder-color: var(--psi-primary);\n}\n.btn-primary:hover,\n.btn-primary:focus
    {\n\tbackground-color: var(--psi-primary-hover);\n\tborder-color: var(--psi-primary-hover);\n}\ninput:focus,\nselect:focus,\ntextarea:focus,\n.form-control:focus
    {\n\tborder-color: var(--psi-ring) !important;\n\tbox-shadow: 0 0 0 0.2rem color-mix(in
    srgb, var(--psi-ring) 25%, transparent) !important;\n}\n\n/* ---- the logo: psi's
    mark, legible, never squeezed to a speck ---- */\n#layout-menu .popover-header
    img,\n#logo {\n\tmax-width: 100%;\n\tmax-height: 2.25rem;\n\twidth: auto;\n\tpadding:
    0;\n}\n\n/* ---- no cut labels at desktop width: a wider menu column, labels allowed
    two lines ---- */\n@media screen and (min-width: 1025px) {\n\t#layout-menu {\n\t\twidth:
    6.5rem;\n\t\tmin-width: 6.5rem;\n\t}\n\t#taskmenu a,\n\thtml.dark-mode #taskmenu
    a {\n\t\twidth: 100%;\n\t\theight: auto;\n\t\tmin-height: 3.6rem;\n\t\tpadding:
    0.5rem 0.25rem;\n\t\tfont-size: 0.82rem;\n\t\tline-height: 1.2;\n\t\twhite-space:
    normal;\n\t}\n\t#taskmenu a span.inner {\n\t\tdisplay: block;\n\t\twhite-space:
    normal;\n\t\toverflow: visible;\n\t\ttext-overflow: clip;\n\t\toverflow-wrap:
    anywhere;\n\t\tmargin-top: 0.3rem;\n\t}\n}\n@media screen and (min-width: 769px)
    {\n\t/* Toolbar buttons (\"Grupare după subiect\", \"Răspunde la toți\"): two
    short lines, never \"…\". */\n\t.menu.toolbar a {\n\t\tmax-width: 7rem;\n\t\theight:
    auto;\n\t\tmin-height: 58px;\n\t}\n\t.menu.toolbar a span.inner {\n\t\tdisplay:
    block;\n\t\twhite-space: normal;\n\t\toverflow: visible;\n\t\ttext-overflow: clip;\n\t\tline-height:
    1.15;\n\t\tfont-size: 0.8rem;\n\t}\n\t/* The mailbox address over the folder list
    fits on one line. */\n\t#layout-sidebar > .header .header-title {\n\t\tfont-size:
    0.85rem;\n\t\twhite-space: normal;\n\t\toverflow-wrap: anywhere;\n\t\tline-height:
    1.2;\n\t\ttext-overflow: clip;\n\t}\n}\n\n/* ---- the message frame: always readable,
    plain text and HTML, light and dark ---- */\n/* Elastic keeps HTML messages on
    white in dark mode (senders paint for white paper). That stays,\n * as a framed
