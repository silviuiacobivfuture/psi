    #layout-menu,\n\thtml:not(.dark-mode) #layout-menu .popover-header {\n\t\tbackground-color:
    #ece3d1 !important;\n\t}\n\thtml:not(.dark-mode) #layout-menu {\n\t\tborder-right:
    1px solid rgba(46, 34, 10, 0.1);\n\t}\n\thtml:not(.dark-mode) #layout-menu .special-buttons,\n\thtml:not(.dark-mode)
    #layout-menu .special-buttons a,\n\thtml:not(.dark-mode) #layout-menu .special-buttons
    a:not(:focus) {\n\t\tbackground: transparent !important;\n\t}\n\thtml:not(.dark-mode)
    #taskmenu a,\n\thtml:not(.dark-mode) #layout-menu .special-buttons a {\n\t\tcolor:
    #554c3b;\n\t\tbackground: transparent;\n\t}\n\thtml:not(.dark-mode) #taskmenu
    a.selected,\n\thtml:not(.dark-mode) #taskmenu a:hover,\n\thtml:not(.dark-mode)
    #taskmenu a:focus {\n\t\tcolor: #16120a;\n\t\tbackground-color: rgba(169, 123,
