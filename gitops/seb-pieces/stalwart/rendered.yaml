    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - --config
        - /etc/stalwart/config.json
        env:
        - name: STALWART_RECOVERY_ADMIN
          valueFrom:
            secretKeyRef:
              key: STALWART_RECOVERY_ADMIN
