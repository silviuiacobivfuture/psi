          name: data
        - mountPath: /etc/stalwart
          name: config
          readOnly: true
        - mountPath: /tmp
          name: tmp
      enableServiceLinks: false
      initContainers:
      - args:
        - |
          [ -n "${STALWART_PASSWORD:-}" ] || { echo "MISSING REQUIRED SECRET: STALWART_PASSWORD (apps/stalwart/admin)" >&2; exit 1; }
          echo "all required secrets present"
        command:
        - sh
        - -c
        envFrom:
        - secretRef:
            name: stalwart-admin
        image: registry.psizone.ro/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
        name: assert-secrets
        resources:
          limits:
            cpu: 100m
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        fsGroup: 2000
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: stalwart-data
      - configMap:
          name: stalwart-config
        name: config
      - emptyDir:
          sizeLimit: 256Mi
