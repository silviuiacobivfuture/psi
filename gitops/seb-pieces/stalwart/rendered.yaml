        image: registry.psizone.ro/mirror/docker.io/stalwartlabs/stalwart:v1.0.3@sha256:e01129152d3684a6350feae33a3c4fc852538ec5fcdbd1ca8de3cb7e493b68d6
        livenessProbe:
          failureThreshold: 4
          periodSeconds: 30
          tcpSocket:
            port: http
        name: stalwart
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 25
          name: smtp
        - containerPort: 465
          name: submissions
        - containerPort: 587
          name: submission
        - containerPort: 993
          name: imaps
        readinessProbe:
          periodSeconds: 10
          tcpSocket:
            port: http
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 60
          periodSeconds: 5
          tcpSocket:
            port: http
        volumeMounts:
