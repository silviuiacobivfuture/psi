    #b42318 !important;\n\t}\n}\n\n/* ---- dark mode: the message header's links (sender,
    \"Detalii\", \"Antete\") in psi's link gold,\n * not the deep gold the colour
    map gives Elastic's dark-blue links (below AA on Night). ---- */\nhtml.dark-mode
    #message-header a,\nhtml.dark-mode #message-header .header-links a,\nhtml.dark-mode
    #message-header .header-links a:before {\n\tcolor: #d2aa50;\n}\n"
  estate_theme.php: |
    <?php
    /**
     * The estate's look on the webmail: one stylesheet (estate.css) after the skin's own, and the
     * estate's mark (logo.svg, see estate.php). SEB ships both empty; an estate's layer replaces
     * them (components/estate/stalwart, ConfigMap webmail-theme).
     */
    class estate_theme extends rcube_plugin
    {
        public $task = '.*';

        public function init()
        {
            $this->include_stylesheet('estate.css');
        }
    }
