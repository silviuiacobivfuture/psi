apiVersion: v1
kind: ResourceQuota
metadata:
  name: reference
  namespace: reference
spec:
  hard:
    limits.cpu: 500m
    limits.memory: 512Mi
    pods: "5"
    requests.cpu: 100m
    requests.memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: reference
  namespace: reference
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: reference
---
apiVersion: v1
kind: LimitRange
metadata:
  name: reference
  namespace: reference
spec:
  limits:
  - default:
      cpu: 100m
      memory: 64Mi
    defaultRequest:
      cpu: 10m
      memory: 16Mi
    max:
      cpu: 250m
      memory: 128Mi
    type: Container
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: reference
  name: reference
  namespace: reference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reference
  template:
    metadata:
      labels:
        app: reference
    spec:
      containers:
      - image: registry.psizone.ro/mirror/docker.io/traefik/whoami:v1.10.4@sha256:02d8fe035f170f91cbb5e458a57f4cefab747436f8244a0eb2d66785fe5e565f
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
        name: reference
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 2
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    gethomepage.dev/description: Developer reference and docs
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Everyday tools
    gethomepage.dev/icon: mdi-book-open-variant
    gethomepage.dev/name: Reference
    gethomepage.dev/pod-selector: app=reference
    gethomepage.dev/weight: "40"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  name: reference
  namespace: reference
spec:
  ingressClassName: traefik
  rules:
  - host: reference.psizone.ro
    http:
      paths:
      - backend:
          service:
            name: reference
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - reference.psizone.ro
    secretName: reference-tls
