apiVersion: v1
kind: Service
metadata:
  labels:
    app: nx-cache
    seb.platform/piece: nx-cache
  name: nx-cache
  namespace: nx-cache
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: nx-cache
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
    reloader.stakater.com/auto: "true"
  labels:
    app: nx-cache
    seb.platform/piece: nx-cache
  name: nx-cache
  namespace: nx-cache
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nx-cache
  template:
    metadata:
      labels:
        app: nx-cache
    spec:
      containers:
      - envFrom:
        - secretRef:
            name: nx-cache-secrets
        image: registry.psizone.ro/psi/nx-cache-svc:REPLACE_ME
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 20
        name: nxcached
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      imagePullSecrets:
      - name: harbor-pull
      initContainers:
      - command:
        - sh
        - -c
        - |
          for k in NX_CACHE_ACCESS_TOKEN NX_CACHE_S3_ENDPOINT NX_CACHE_S3_BUCKET \
                   NX_CACHE_S3_ACCESS_KEY_ID NX_CACHE_S3_SECRET_ACCESS_KEY; do
            eval v=\$$k
            if [ -z "$v" ]; then echo "MISSING REQUIRED SECRET: $k"; exit 1; fi
          done
          echo "every required secret is present"
        envFrom:
        - secretRef:
            name: nx-cache-secrets
        image: registry.psizone.ro/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
        name: assert-secrets
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    seb.platform/piece: nx-cache
  name: harbor-pull
  namespace: nx-cache
spec:
  data:
  - remoteRef:
      key: platform/harbor/pull
      property: username
    secretKey: username
  - remoteRef:
      key: platform/harbor/pull
      property: password
    secretKey: password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    name: harbor-pull
    template:
      data:
        .dockerconfigjson: |
          {"auths":{"registry.psizone.ro":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
      type: kubernetes.io/dockerconfigjson
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    seb.platform/piece: nx-cache
  name: nx-cache-secrets
  namespace: nx-cache
spec:
  data:
  - remoteRef:
      key: platform/nx-cache/token
      property: token
    secretKey: token
  - remoteRef:
      key: platform/nx-cache/objectstore
      property: access_key_id
    secretKey: access_key_id
  - remoteRef:
      key: platform/nx-cache/objectstore
      property: secret_access_key
    secretKey: secret_access_key
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    name: nx-cache-secrets
    template:
      data:
        NX_CACHE_ACCESS_TOKEN: '{{ .token }}'
        NX_CACHE_S3_ACCESS_KEY_ID: '{{ .access_key_id }}'
        NX_CACHE_S3_BUCKET: psi-nx-cache-dev
        NX_CACHE_S3_ENDPOINT: https://nbg1.your-objectstorage.com
        NX_CACHE_S3_PREFIX: nx/
        NX_CACHE_S3_SECRET_ACCESS_KEY: '{{ .secret_access_key }}'
