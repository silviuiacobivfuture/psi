apiVersion: batch/v1
kind: CronJob
metadata:
  name: harbor-oidc-reconcile
  namespace: harbor
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 120
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: harbor-oidc-reconcile
        spec:
          containers:
          - command:
            - /bin/sh
            - -c
            - |
              set -eu
              body=$(cat <<JSON
              {
                "auth_mode": "oidc_auth",
                "oidc_name": "Authentik",
                "oidc_endpoint": "https://auth.psizone.ro/application/o/harbor/",
                "oidc_client_id": "${OIDC_CLIENT_ID}",
                "oidc_client_secret": "${OIDC_CLIENT_SECRET}",
                "oidc_scope": "openid,profile,email,groups,offline_access",
                "oidc_groups_claim": "groups",
                "oidc_admin_group": "app-harbor-admin",
                "oidc_user_claim": "preferred_username",
                "oidc_auto_onboard": true,
                "oidc_verify_cert": true
              }
              JSON
              )
              echo "Reconciling Harbor OIDC config via internal API..."
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                -u "admin:${HARBOR_ADMIN_PASSWORD}" \
                -X PUT "http://harbor-core.harbor.svc.cluster.local/api/v2.0/configurations" \
                -H "Content-Type: application/json" \
                -d "${body}")
              echo "PUT /configurations -> ${code}"
              case "$code" in 200|201) echo "OK (Harbor OIDC reconciled)";; *) echo "FAILED"; exit 1;; esac
            env:
            - name: HARBOR_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: secret
                  name: harbor-admin
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: client_id
                  name: harbor-oidc
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: client_secret
                  name: harbor-oidc
            image: curlimages/curl:8.5.0
            name: reconcile
            resources:
              limits:
                cpu: 100m
                memory: 64Mi
              requests:
                cpu: 10m
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
          restartPolicy: OnFailure
          securityContext:
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
  schedule: '*/15 * * * *'
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
