apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: plane-db
  namespace: plane
spec:
  backup:
    barmanObjectStore:
      data:
        compression: gzip
      destinationPath: s3://psi-tfstate-dev/cnpg/plane-db
      endpointURL: https://nbg1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          key: AWS_ACCESS_KEY_ID
          name: plane-backup-s3
        secretAccessKey:
          key: AWS_SECRET_ACCESS_KEY
          name: plane-backup-s3
      wal:
        compression: gzip
        maxParallel: 2
    retentionPolicy: 14d
  bootstrap:
    initdb:
      database: plane
      encoding: UTF8
      localeCType: C
      localeCollate: C
      owner: plane
      secret:
        name: plane-db-app
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-system-trixie
  instances: 1
  postgresql:
    parameters:
      effective_cache_size: 512MB
      max_connections: "200"
      shared_buffers: 256MB
      work_mem: 8MB
  primaryUpdateStrategy: unsupervised
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi
  smartShutdownTimeout: 10
  storage:
    size: 10Gi
    storageClass: local-path
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: plane-db-base
  namespace: plane
spec:
  backupOwnerReference: self
  cluster:
    name: plane-db
  immediate: true
  schedule: 0 40 2 * * 0
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: plane-body-limit
  namespace: plane
