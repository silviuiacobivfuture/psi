apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
  name: plane-smtp-reconcile
  namespace: plane
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: plane-smtp-reconcile
        spec:
          containers:
          - args:
            - |
              set -eu

              # The api pod. Not ready yet (a first install, or a rollout) is a
              # NON-failure: the next run in 15 minutes picks it up, and failing
              # here would page for a condition that resolves itself.
              # `app.name=plane-plane-api` is an EXACT match, so it can never
              # select the migrator pod (app.name=plane-plane-api-migrate).
              POD="$(kubectl get pod -l app.name=plane-plane-api \
                      --field-selector=status.phase=Running \
                      -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
              if [ -z "$POD" ]; then
                echo "no running plane-api pod yet — nothing to reconcile this run"
                exit 0
              fi
              echo "reconciling against pod $POD"

              # Fail LOUD on a blank credential instead of writing "" into the
              # table, which would read as configured and send nothing.
              if [ -z "${SMTP_PASSWORD:-}" ]; then
                echo "FATAL PLANE_SMTP_EMPTY_PASSWORD: the email-sender Secret carried a blank EMAIL_API_KEY. Capture the plane sender's key (infrastructure/hetzner/scripts/plunk-bootstrap.sh) and check: kubectl -n plane get externalsecret email-sender"
                exit 1
              fi
              if [ -z "${EMAIL_FROM:-}" ]; then
                echo "FATAL PLANE_SMTP_EMPTY_FROM: the email-sender Secret carried a blank EMAIL_FROM. Plunk refuses a sender outside the project's verified domain, so an empty From would fail every send."
                exit 1
              fi

              # The prelude. base64 for the two secret-derived values so they can
              # sit in a Python string literal whatever characters they contain,
              # and so the key never appears in plaintext even in this pod's
              # memory-resident script. Everything goes over STDIN, never argv.
              {
                printf 'HOST = "%s"\n'  "$SMTP_HOST"
                printf 'PORT = "%s"\n'  "$SMTP_PORT"
                printf 'USER = "%s"\n'  "$SMTP_USER"
                printf 'MAGIC = "%s"\n' "$PLANE_ENABLE_MAGIC_LINK"
                printf 'FROM_B64 = "%s"\n' \
                  "$(printf '%s <%s>' "$EMAIL_FROM_NAME" "$EMAIL_FROM" | base64 | tr -d '\n')"
                printf 'PW_B64 = "%s"\n' \
                  "$(printf '%s' "$SMTP_PASSWORD" | base64 | tr -d '\n')"
                cat /script/reconcile.py
              } | kubectl exec -i "$POD" -c plane-api -- python manage.py shell

              # `manage.py shell` with no -c execs whatever arrives on a non-tty
              # STDIN, and a SystemExit raised inside it propagates out as the
              # exec's exit code — VERIFIED against this pod on 2026-08-20, so
              # every FATAL above really does fail the Job. `set -e` on a pipeline
              # takes the exit status of the LAST command, which is the exec.
            command:
            - /bin/sh
            - -c
            env:
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: EMAIL_API_KEY
                  name: email-sender
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  key: EMAIL_FROM
                  name: email-sender
            - name: EMAIL_FROM_NAME
              valueFrom:
                secretKeyRef:
                  key: EMAIL_FROM_NAME
                  name: email-sender
            - name: SMTP_HOST
              value: plunk-smtp.psizone.ro
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_USER
              value: plunk
            - name: PLANE_ENABLE_MAGIC_LINK
              value: "1"
            image: registry.psizone.ro/mirror/docker.io/alpine/k8s:1.30.3@sha256:12d9fc5d5e9467c7d932a18015ddfe48bdf2e02dd5677507f155ac05fdd63b73
            name: reconcile
            resources:
              limits:
                cpu: 300m
                memory: 256Mi
              requests:
                cpu: 20m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
            - mountPath: /script
              name: script
              readOnly: true
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: plane-smtp-reconcile
          volumes:
          - configMap:
              name: plane-smtp-reconcile-script
            name: script
  schedule: '*/15 * * * *'
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
---
apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
  name: plane-sso-reconcile
  namespace: plane
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: plane-sso-reconcile
        spec:
          containers:
          - args:
            - |
              set -eu
              [ -n "${AUTHENTIK_API_TOKEN:-}" ] || { echo "MISSING REQUIRED SECRET: AUTHENTIK_API_TOKEN (plane-sso-directory)" >&2; exit 1; }
              POD="$(kubectl get pod -l app.name=plane-plane-api --field-selector=status.phase=Running \
                      -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
              if [ -z "$POD" ]; then
                echo "no running plane-api pod yet — nothing to reconcile this run"
                exit 0
              fi
              echo "reconciling against pod $POD (mode $MODE)"
              {
                printf 'API = "%s"\n' "$AUTHENTIK_API_URL"
                printf 'MODE = "%s"\n' "$MODE"
                printf 'TOKEN_B64 = "%s"\n' "$(printf '%s' "$AUTHENTIK_API_TOKEN" | base64 | tr -d '\n')"
                cat /script/reconcile.py
              } | kubectl exec -i "$POD" -c plane-api -- python manage.py shell
            command:
            - /bin/sh
            - -c
            env:
            - name: AUTHENTIK_API_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: plane-sso-directory
            - name: AUTHENTIK_API_URL
              value: http://authentik-server.authentik.svc.cluster.local:80
            - name: MODE
              value: apply
            image: registry.psizone.ro/mirror/docker.io/alpine/k8s:1.30.3@sha256:12d9fc5d5e9467c7d932a18015ddfe48bdf2e02dd5677507f155ac05fdd63b73
            name: reconcile
            resources:
              limits:
