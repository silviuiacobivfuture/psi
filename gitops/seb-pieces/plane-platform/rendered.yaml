  buffering:
    maxRequestBodyBytes: 20971520
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: plane-credential-redirect
  namespace: plane
spec:
  redirectRegex:
    permanent: false
    regex: ^https?://([^/]+)/[^?]*(\?.*)?$
    replacement: https://${1}/auth/authentik/${2}
---
apiVersion: traefik.io/v1alpha1
