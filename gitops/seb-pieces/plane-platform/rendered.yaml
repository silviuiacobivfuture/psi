apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: plane-rabbitmq
  name: plane-rabbitmq
  namespace: plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plane-rabbitmq
  serviceName: plane-rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plane-rabbitmq
    spec:
      containers:
      - command:
        - /bin/sh
        - -c
        - |
          set -eu
          # ERLANG COOKIE PERMISSIONS — must run BEFORE the server starts.
          # fsGroup:101 makes every file on the PVC group-writable (0660), but the
          # Erlang VM refuses to boot unless .erlang.cookie is owner-accessible
          # ONLY, and dies in prelaunch with:
          #   "Cookie file /var/lib/rabbitmq/.erlang.cookie must be accessible by
          #    owner only"
          # (VERIFIED on dev 2026-08-18 — CrashLoopBackOff after the PVC's first
          # write.) The entrypoint creates the cookie itself when absent, so this
          # only tightens the mode; `|| true` because the file legitimately does
          # not exist on the very first boot.
          [ -f /var/lib/rabbitmq/.erlang.cookie ] && chmod 0400 /var/lib/rabbitmq/.erlang.cookie || true
          (
            # NOT under `set -e`: await_startup is EXPECTED to fail on the first
            # attempts while the Erlang node is still coming up ("unable to
            # perform an operation on node ... Target node is not running"), and
            # an inherited -e would kill the subshell on that first failure before
            # the retry loop could run (VERIFIED against this image locally).
            set +e
            tries=0
            until rabbitmqctl await_startup --timeout 60 >/dev/null 2>&1; do
              tries=$((tries+1))
              if [ "$tries" -ge 30 ]; then break; fi
              sleep 10
            done
            if rabbitmqctl await_startup --timeout 60 >/dev/null 2>&1; then
              rabbitmqctl change_password "$RABBITMQ_DEFAULT_USER" "$RABBITMQ_DEFAULT_PASS" \
                && echo "rotation-reconcile: password reconciled" \
                || echo "rotation-reconcile: FAILED to set password — Celery may not authenticate" >&2
            else
              echo "rotation-reconcile: broker did not start within ~5min — password NOT reconciled" >&2
            fi
          ) &
          exec docker-entrypoint.sh rabbitmq-server
        envFrom:
        - secretRef:
            name: plane-rabbitmq
            optional: false
        image: registry.psizone.ro/mirror/docker.io/library/rabbitmq:4.1.8-alpine@sha256:fc3178754f93e048db7f596a19742c68f438d71fcfe80657dff3198e196de64d
        livenessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - check_running
          failureThreshold: 3
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 20
        name: rabbitmq
        ports:
        - containerPort: 5672
          name: amqp
        readinessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - ping
          failureThreshold: 3
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 15
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /var/lib/rabbitmq
          name: data
      securityContext:
        fsGroup: 101
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
      storageClassName: local-path
---
