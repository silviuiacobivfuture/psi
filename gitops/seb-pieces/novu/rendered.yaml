apiVersion: v1
kind: ResourceQuota
metadata:
  name: novu
  namespace: novu
spec:
  hard:
    limits.cpu: "10"
    limits.memory: 10Gi
    pods: "16"
    requests.cpu: 1500m
    requests.memory: 4Gi
---
apiVersion: v1
data:
  API_ROOT_URL: https://novu-api.psizone.ro
  BROADCAST_QUEUE_CHUNK_SIZE: "100"
  DASHBOARD_URL: https://novu.psizone.ro
  FRONT_BASE_URL: ^$
  HOME: /tmp
  IS_API_IDEMPOTENCY_ENABLED: "true"
  IS_API_RATE_LIMITING_ENABLED: "true"
  IS_EMAIL_INLINE_CSS_DISABLED: "false"
  IS_NEW_MESSAGES_API_RESPONSE_ENABLED: "true"
  IS_SELF_HOSTED: "true"
  IS_USE_MERGED_DIGEST_ID_ENABLED: "false"
  IS_V2_ENABLED: "true"
  LOG_LEVEL: info
  MONGO_AUTO_CREATE_INDEXES: "true"
  MONGO_MAX_POOL_SIZE: "10"
  MONGO_MIN_POOL_SIZE: "2"
  MULTICAST_QUEUE_CHUNK_SIZE: "100"
  NEW_RELIC_ENABLED: "false"
  NODE_ENV: production
  NOVU_ENTERPRISE: "false"
  NOVU_SAFE_OUTBOUND_ALLOW: novu-bridge.novu.svc.cluster.local,plunk-smtp.psizone.ro
  REDIS_CACHE_SERVICE_HOST: novu-redis.novu.svc.cluster.local
  REDIS_CACHE_SERVICE_PORT: "6379"
  REDIS_DB_INDEX: "2"
  REDIS_HOST: novu-redis.novu.svc.cluster.local
  REDIS_PORT: "6379"
  S3_BUCKET_NAME: psi-novu-dev
  S3_LOCAL_STACK: https://nbg1.your-objectstorage.com
  S3_REGION: nbg1
  STORAGE_SERVICE: AWS
  SUBSCRIBER_WIDGET_JWT_EXPIRATION_TIME: 15d
kind: ConfigMap
metadata:
  name: novu-config
  namespace: novu
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: novu-api
  name: novu-api
  namespace: novu
spec:
  ports:
  - name: http
    port: 3000
    targetPort: http
  selector:
    app.kubernetes.io/name: novu-api
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: novu-bridge
  name: novu-bridge
  namespace: novu
spec:
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app.kubernetes.io/name: novu-bridge
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: novu-dashboard
  name: novu-dashboard
  namespace: novu
spec:
  ports:
  - name: http
    port: 4000
    targetPort: http
  selector:
    app.kubernetes.io/name: novu-dashboard
---
apiVersion: v1
kind: Service
metadata:
