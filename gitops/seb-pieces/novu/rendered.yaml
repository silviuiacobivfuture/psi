apiVersion: v1
kind: LimitRange
metadata:
  name: novu
  namespace: novu
spec:
  limits:
  - default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 25m
      memory: 64Mi
    max:
      cpu: "2"
      memory: 2Gi
    type: Container
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: novu-api
  name: novu-api
  namespace: novu
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: novu-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: novu-api
    spec:
      containers:
      - env:
        - name: PORT
          value: "3000"
        - name: NODE_OPTIONS
          value: --max-old-space-size=768
        envFrom:
        - configMapRef:
            name: novu-config
        - secretRef:
            name: novu-app
        image: registry.psizone.ro/mirror/ghcr.io/novuhq/novu/api:3.19.0@sha256:76f1c2071a1a96c0a88255187d67a2167bd65757afc05d3be967d0d7b02f609d
        livenessProbe:
          failureThreshold: 4
          httpGet:
            path: /v1/health-check
            port: http
          periodSeconds: 30
          timeoutSeconds: 10
        name: api
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          httpGet:
            path: /v1/health-check
            port: http
          periodSeconds: 15
          timeoutSeconds: 10
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 320Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /v1/health-check
            port: http
          periodSeconds: 10
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      initContainers:
      - command:
        - sh
        - -c
        - '[ -n "${JWT_SECRET:-}" ] || { echo "MISSING REQUIRED SECRET: JWT_SECRET"
          >&2; exit 1; }; [ -n "${STORE_ENCRYPTION_KEY:-}" ] || { echo "MISSING REQUIRED
          SECRET: STORE_ENCRYPTION_KEY" >&2; exit 1; }; [ "${#STORE_ENCRYPTION_KEY}"
          -eq 32 ] || { echo "INVALID SECRET: STORE_ENCRYPTION_KEY must be exactly
          32 characters" >&2; exit 1; }; [ -n "${NOVU_SECRET_KEY:-}" ] || { echo "MISSING
          REQUIRED SECRET: NOVU_SECRET_KEY" >&2; exit 1; }; [ -n "${MONGO_URL:-}"
          ] || { echo "MISSING REQUIRED SECRET: MONGO_URL" >&2; exit 1; }; [ -n "${REDIS_PASSWORD:-}"
          ] || { echo "MISSING REQUIRED SECRET: REDIS_PASSWORD" >&2; exit 1; }; [
          -n "${AWS_ACCESS_KEY_ID:-}" ] || { echo "MISSING REQUIRED SECRET: AWS_ACCESS_KEY_ID"
          >&2; exit 1; }; [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || { echo "MISSING REQUIRED
          SECRET: AWS_SECRET_ACCESS_KEY" >&2; exit 1; }; echo secrets-ok'
        envFrom:
        - secretRef:
            name: novu-app
        image: registry.psizone.ro/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
        name: assert-secrets
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir: {}
        name: tmp
---
apiVersion: apps/v1
