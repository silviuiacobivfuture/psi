apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: etcd-s3
  namespace: system-upgrade
spec:
  concurrency: 1
  cordon: false
  nodeSelector:
    matchExpressions:
    - key: node-role.kubernetes.io/control-plane
      operator: In
      values:
      - "true"
  secrets:
  - name: etcd-s3
    path: /run/system-upgrade/secrets/etcd-s3
  serviceAccountName: system-upgrade
  tolerations:
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
  - key: CriticalAddonsOnly
    operator: Exists
  upgrade:
    args:
    - |
      set -eu
      ACCESS_KEY="$(cat /run/system-upgrade/secrets/etcd-s3/access_key 2>/dev/null || true)"
      SECRET_KEY="$(cat /run/system-upgrade/secrets/etcd-s3/secret_key 2>/dev/null || true)"

      DROPIN_DIR=/host/etc/rancher/k3s/config.yaml.d
      DROPIN="$DROPIN_DIR/etcd-s3.yaml"
      NSENTER="nsenter -t 1 -m -u -i -n -p --"

      restart_k3s() {
        echo "[etcd-s3-plan] restarting k3s on the host (single control-plane, in-place)"
        $NSENTER systemctl restart k3s
      }

      wait_healthz() {
        echo "[etcd-s3-plan] waiting for apiserver /healthz=ok (break-glass kubeconfig)"
        i=0
        while [ "$i" -lt 60 ]; do
          if $NSENTER k3s kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml get --raw /healthz 2>/dev/null | grep -q '^ok$'; then
            echo "[etcd-s3-plan] apiserver healthy"
            return 0
          fi
          i=$((i + 1)); sleep 2
        done
        echo "[etcd-s3-plan] FATAL: apiserver did not return /healthz=ok within 120s" >&2
        return 1
      }

      # ---- Rollback path: remove the drop-in, restart, verify ----
      if [ "${ENABLE_ETCD_S3:-true}" != "true" ]; then
        if [ -f "$DROPIN" ]; then
          echo "[etcd-s3-plan] ENABLE_ETCD_S3!=true → deleting $DROPIN and restarting k3s"
          rm -f "$DROPIN" "$DROPIN.bak"
          restart_k3s
          # The drop-in is already gone; a healthz hiccup must NOT flip the node into
          # a failed/retry loop. The node is in the correct no-etcd-s3 state.
          wait_healthz || true
        else
          echo "[etcd-s3-plan] ENABLE_ETCD_S3!=true but no drop-in present → no-op"
          rm -f "$DROPIN.bak"
        fi
        exit 0
      fi

      # ---- Apply path: require both S3 keys from the ESO secret ----
      if [ -z "$ACCESS_KEY" ] || [ -z "$SECRET_KEY" ]; then
        echo "[etcd-s3-plan] FATAL: S3 access/secret key empty (seed OpenBao secret/platform/object-storage/dev) — refusing to write broken etcd-s3 flags" >&2
        exit 1
      fi

      mkdir -p "$DROPIN_DIR"

      # Render the desired drop-in, then compare — idempotent: if the live drop-in
      # already matches, DO NOT restart. Built with printf (NOT a heredoc) so the
      # YAML block-scalar indentation of this script does not leak into the drop-in.
      DESIRED="$(mktemp)"
      {
        printf '%s\n' '# Managed by system-upgrade-controller Plan etcd-s3 (GitOps). DO NOT EDIT.'
        printf '%s\n' '# k3s native timed etcd snapshots to Hetzner Object Storage (S3). Mirrors the'
        printf '%s\n' '# flags modules/k3s bakes into cloud-init for a from-scratch rebuild.'
        printf '%s\n' 'etcd-s3: true'
        printf 'etcd-s3-bucket: "%s"\n'              "$ETCD_S3_BUCKET"
        printf 'etcd-s3-folder: "%s"\n'              "$ETCD_S3_FOLDER"
        printf 'etcd-s3-endpoint: "%s"\n'            "$ETCD_S3_ENDPOINT"
        printf 'etcd-s3-region: "%s"\n'              "$ETCD_S3_REGION"
        printf 'etcd-s3-access-key: "%s"\n'          "$ACCESS_KEY"
        printf 'etcd-s3-secret-key: "%s"\n'          "$SECRET_KEY"
        printf 'etcd-snapshot-schedule-cron: "%s"\n' "$ETCD_SNAPSHOT_SCHEDULE_CRON"
        printf 'etcd-snapshot-retention: %s\n'       "$ETCD_SNAPSHOT_RETENTION"
      } > "$DESIRED"

      if [ -f "$DROPIN" ] && cmp -s "$DESIRED" "$DROPIN"; then
        # Already current → pure no-op. Do NOT call wait_healthz: nothing restarted,
        # and an unrelated apiserver blip would otherwise false-fail the Plan into a
        # retry loop on a correctly-configured node.
        echo "[etcd-s3-plan] drop-in already present and current → no-op (no restart)"
        rm -f "$DESIRED"
        exit 0
      fi

      # Back up any pre-existing drop-in before overwriting.
      if [ -f "$DROPIN" ]; then
        cp "$DROPIN" "$DROPIN.bak"
        echo "[etcd-s3-plan] backed up existing drop-in → $DROPIN.bak"
      fi

      cp "$DESIRED" "$DROPIN"
      rm -f "$DESIRED"
      chmod 600 "$DROPIN"   # the drop-in carries S3 secret-key — restrict it
      echo "[etcd-s3-plan] wrote $DROPIN"

      restart_k3s
      if ! wait_healthz; then
        echo "[etcd-s3-plan] apiserver unhealthy after applying etcd-s3 — rolling back drop-in" >&2
        if [ -f "$DROPIN.bak" ]; then
          mv "$DROPIN.bak" "$DROPIN"
        else
          rm -f "$DROPIN"
        fi
        restart_k3s
        wait_healthz || true
        exit 1
      fi

      echo "[etcd-s3-plan] etcd-s3 snapshots enabled (6h cadence, retain 20) and apiserver verified healthy"
    command:
    - /bin/sh
    - -c
    envFrom:
    - configMapRef:
        name: etcd-s3-flags
    image: registry.psizone.ro/mirror/docker.io/library/alpine:3.20@sha256:c64c687cbea9300178b30c95835354e34c4e4febc4badfe27102879de0483b5e
  version: etcd-s3-v1
