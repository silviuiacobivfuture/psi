apiVersion: v1
data:
  copy.py: |
    """A consistent copy of the live k3s datastore, through SQLite's own online-backup API.

    Runs in the k3s-datastore-copy CronJob (../k3s-datastore-copy.yaml says why it is a
    CronJob here). Exit 0 leaves a verified /work/state.db.gz; anything else leaves nothing
    to upload, so a bad copy can never replace a good one, and prints one line
    `COPY REFUSED [REASON]: ...`. Only counts are ever printed: the file holds every
    Secret on the cluster.

    The source is opened mode=ro on a read-only mount. SQLite takes its shared read lock
    on the -shm file with a read-only descriptor, so the checkpointer honours this reader
    while it holds its snapshot; backup() with its default pages=-1 copies every page in
    that one read transaction, so a write during the copy cannot make it restart or mix
    two states. tests/datastore-copy.test.sh runs this against a live writer.
    """

    import datetime
    import gzip
    import os
    import shutil
    import sqlite3
    import sys

    SOURCE = os.environ.get("DATASTORE_DB", "/db/state.db")
    WORK = os.environ.get("DATASTORE_WORK", "/work")
    BUSY_TIMEOUT_SECS = 60
    GZIP_LEVEL = 6


    def refuse(reason: str, message: str) -> None:
        for name in ("state.db", "state.db-wal", "state.db-shm", "state.db.gz", "taken-at"):
            path = os.path.join(WORK, name)
            if os.path.exists(path):
                os.remove(path)
        print(f"COPY REFUSED [{reason}]: {message}", file=sys.stderr)
        sys.exit(3)


    def take_copy(copy_path: str) -> None:
        try:
            os.stat(SOURCE)
        except FileNotFoundError:
            refuse("SOURCE_MISSING", f"{SOURCE} does not exist; this node is not on SQLite")
        except PermissionError:
            refuse("SOURCE_UNREADABLE", f"{SOURCE} cannot be read by uid {os.getuid()}; k3s keeps its directory 0700 root")
        try:
            source = sqlite3.connect(f"file:{SOURCE}?mode=ro", uri=True, timeout=BUSY_TIMEOUT_SECS)
            copy = sqlite3.connect(copy_path)
            with copy:
                source.backup(copy)
            # The header carries the source's WAL flag. A rollback journal makes the copy one
            # plain file that opens read-only anywhere; k3s switches it back to WAL itself.
            copy.execute("PRAGMA journal_mode=DELETE")
            copy.close()
            source.close()
        except sqlite3.Error as err:
            refuse("BACKUP_FAILED", f"the online backup stopped: {err}")


    def verify(copy_path: str) -> dict:
        """A status proves nothing: an empty database passes integrity_check."""
        try:
            copy = sqlite3.connect(f"file:{copy_path}?mode=ro", uri=True)
            integrity = copy.execute("PRAGMA integrity_check").fetchall()
            if integrity != [("ok",)]:
                refuse("INTEGRITY_FAILED", f"integrity_check reported {len(integrity)} problem(s)")
            tables = {row[0] for row in copy.execute("SELECT name FROM sqlite_master WHERE type='table'")}
            if "kine" not in tables:
                refuse("NOT_A_DATASTORE", "the copy has no kine table")
            live = "FROM kine WHERE deleted = 0 AND id IN (SELECT MAX(id) FROM kine GROUP BY name)"
            objects = copy.execute(f"SELECT COUNT(*) {live}").fetchone()[0]
            namespaces = copy.execute(f"SELECT COUNT(*) {live} AND name LIKE '/registry/namespaces/%'").fetchone()[0]
            bootstrap = copy.execute(f"SELECT COUNT(*) {live} AND name LIKE '/bootstrap/%'").fetchone()[0]
            copy.close()
        except sqlite3.Error as err:
            refuse("INTEGRITY_FAILED", f"the copy does not open as a database: {err}")
        if namespaces == 0:
            refuse("EMPTY_DATASTORE", f"the copy holds {objects} objects and no namespace")
        if bootstrap == 0:
            refuse("NO_BOOTSTRAP", "the copy holds no /bootstrap/ row: the cluster's certificates could not be restored from it")
        return {"objects": objects, "namespaces": namespaces, "bootstrap": bootstrap}


    def compress(copy_path: str, out_path: str) -> None:
        with open(copy_path, "rb") as raw, gzip.open(out_path, "wb", compresslevel=GZIP_LEVEL) as packed:
            shutil.copyfileobj(raw, packed, 1024 * 1024)
        os.remove(copy_path)


    def memory_peak() -> str:
        try:
            with open("/sys/fs/cgroup/memory.peak", encoding="ascii") as peak:
                return f"{int(peak.read()) // (1024 * 1024)}Mi"
        except OSError:
            return "unknown"


    def main() -> None:
        os.umask(0o027)  # owner and the pod's fsGroup: the upload container, nobody else
        copy_path = os.path.join(WORK, "state.db")
        out_path = os.path.join(WORK, "state.db.gz")
        # The copy's name says when its contents are from, so the clock is read BEFORE the
        # backup: whatever existed at that time is in the copy, which is what the drill
        # compares. Named at upload, a runner's Secret created in between read as lost.
        taken_at = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ")
        take_copy(copy_path)
        counts = verify(copy_path)
        raw_bytes = os.path.getsize(copy_path)
        compress(copy_path, out_path)
        with open(os.path.join(WORK, "taken-at"), "w", encoding="ascii") as stamp:
            stamp.write(taken_at + "\n")
        print(
            f"copy ok: integrity_check=ok objects={counts['objects']} namespaces={counts['namespaces']} "
            f"bootstrap={counts['bootstrap']} raw_bytes={raw_bytes} gz_bytes={os.path.getsize(out_path)} "
            f"memory_peak={memory_peak()}"
        )


    if __name__ == "__main__":
        main()
  upload.sh: |
    #!/bin/sh
    # Upload the copy copy.py verified, read it back, then prune. Pruning comes last and
    # only after the object store has confirmed the new object's size: a run that fails
    # anywhere keeps every older copy. Prints names and sizes, never a credential.
    set -eu

    OUT="${WORK:-/work}/state.db.gz"
    test -s "$OUT" || { echo "COPY REFUSED [NOTHING_TO_UPLOAD]: $OUT is missing or empty" >&2; exit 3; }

    # Hetzner S3 rejects the AWS SDK's default checksum (same flag velero uses).
    export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
    export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required

    # When the contents are from, written by copy.py before it read the database. Not now:
    # compressing and starting this container take seconds, and objects get created in them.
    TS="$(cat "${WORK:-/work}/taken-at" 2>/dev/null || true)"
    printf '%s' "$TS" | grep -qE '^[0-9]{8}T[0-9]{6}Z$' || { echo "COPY REFUSED [NO_TIMESTAMP]: copy.py left no time for this copy" >&2; exit 3; }
    NAME="state-${TS}.db.gz"
    KEY="${PREFIX}/${NAME}"
    WANT="$(wc -c < "$OUT" | tr -d ' ')"

    aws s3 cp --only-show-errors "$OUT" "s3://${BUCKET}/${KEY}" --endpoint-url "${AWS_ENDPOINT_URL}"
    GOT="$(aws s3api head-object --bucket "$BUCKET" --key "$KEY" --query ContentLength --output text --endpoint-url "${AWS_ENDPOINT_URL}")"
    [ "$GOT" = "$WANT" ] || { echo "COPY REFUSED [UPLOAD_SHORT]: s3://${BUCKET}/${KEY} holds ${GOT} bytes, ${WANT} were sent" >&2; exit 3; }
    rm -f "$OUT" "${WORK:-/work}/taken-at"
    echo "uploaded s3://${BUCKET}/${KEY} bytes=${GOT}"

    # Keep the newest KEEP, by the timestamp in the name. Only names this job writes are
    # ever candidates.
    aws s3 ls "s3://${BUCKET}/${PREFIX}/" --endpoint-url "${AWS_ENDPOINT_URL}" \
      | awk '{print $4}' | grep -E '^state-[0-9]{8}T[0-9]{6}Z\.db\.gz$' | sort -r \
      | tail -n +$((KEEP + 1)) | while read -r old; do
          echo "pruning ${old}"
          aws s3 rm --only-show-errors "s3://${BUCKET}/${PREFIX}/${old}" --endpoint-url "${AWS_ENDPOINT_URL}"
        done
    echo "done"
kind: ConfigMap
metadata:
  name: k3s-datastore-copy
  namespace: system-upgrade
---
apiVersion: v1
data:
  KM_APPLY_SH: |
    #!/bin/sh
    # Runs on a node as the Plans' upgrade container (alpine, privileged, node root at
    # /host). Writes the kubelet's memory settings as a k3s drop-in and restarts k3s.
    # Delivered as the env var KM_APPLY_SH because a Plan can mount no ConfigMap.
    #
    # KM_MODE decides: hold (do nothing; this is how it ships), apply, remove.
    #
    # THE HAZARD. After a restart the kubelet re-admits every pod on the node, oldest
    # first, against the NEW allocatable. Requests above it mean the newest pods are
    # rejected (status Failed, reason OutOfmemory), and on these nodes the newest pods
    # are the CI runners. So apply refuses before writing anything when the requests
    # would not fit, and when MemAvailable is under the soft line (the eviction manager
    # starts acting the moment the kubelet is back).
    #
    # RESTART SAFE. k3s runs with KillMode=process, so containers keep running through
    # a restart. Failing here exits non-zero; the Job retries (backoff limit 2 in this
    # kustomization) and SUC runs a new Job after the failed one's TTL. A refusal
    # changes nothing, so a retry is harmless.
    set -eu

    ROOT="${KM_HOST_ROOT:-/host}"
    NSENTER="${KM_NSENTER:-nsenter -t 1 -m -u -i -n -p --}"
    MEMINFO="${KM_MEMINFO:-/proc/meminfo}"
    WAIT_TRIES="${KM_WAIT_TRIES:-90}"; WAIT_SLEEP="${KM_WAIT_SLEEP:-2}"
    GATE_TRIES="${KM_GATE_TRIES:-60}"; GATE_SLEEP="${KM_GATE_SLEEP:-10}"
    NODE="${SYSTEM_UPGRADE_NODE_NAME:?SUC sets the node name}"
    MODE="${KM_MODE:-}"; ROLE="${KM_ROLE:-}"
    DIR="$ROOT/etc/rancher/k3s/config.yaml.d"
    DROPIN="$DIR/kubelet-memory.yaml"

    log() { echo "[kubelet-memory] $*"; }
    die() { echo "[kubelet-memory] FATAL: $*" >&2; exit 1; }

    case "$ROLE" in
      agent)  SERVICE=k3s-agent; DESIRED="${KM_DROPIN_AGENT:-}" ;;
      server) SERVICE=k3s;       DESIRED="${KM_DROPIN_SERVER:-}" ;;
      *) die "KM_ROLE must be agent or server, got [$ROLE]" ;;
    esac
    [ -n "$DESIRED" ] || die "the drop-in for $ROLE is empty"

    # The node's own identity exists on both roles and may read its pods and itself.
    node_kubectl() { $NSENTER k3s kubectl --kubeconfig /var/lib/rancher/k3s/agent/kubelet.kubeconfig "$@"; }
    # Only a server has this one; only the server's gate needs it.
    admin_kubectl() { $NSENTER k3s kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml "$@"; }

    # arg <flag> <drop-in text> → that flag's value
    arg() { printf '%s\n' "$2" | sed -n "s/^  - \"$1=\(.*\)\"\$/\1/p"; }
    # to_ki <quantity> → integer KiB. Empty is zero.
    to_ki() {
      printf '%s\n' "$1" | awk '
        /^$/ { print 0; exit }
        { v=$0; n=v; u=v; sub(/[A-Za-z]+$/,"",n); sub(/^[0-9.]+/,"",u)
          f = (u=="Ki")?1 : (u=="Mi")?1024 : (u=="Gi")?1048576 : (u=="Ti")?1073741824 : (u=="k")?1000/1024 : (u=="M")?1000000/1024 : (u=="G")?1000000000/1024 : (u=="m")?1/1024000 : 1/1024
          printf "%d\n", n*f + 0.5 }'
    }
    reserved_ki() { # reserved_ki <flag>, memory=<q>
      to_ki "$(arg "$1" "$DESIRED" | sed -n 's/^memory=//p')"
    }
    threshold_ki() { # threshold_ki <flag>, memory.available<q among the signals
      to_ki "$(arg "$1" "$DESIRED" | tr ',' '\n' | sed -n 's/^memory\.available<//p')"
    }

    # The kubelet's own sum: for a pod, the larger of (containers + sidecars) and its
    # largest plain init container. Finished pods hold nothing.
    pods_requested_ki() {
      # Read first, then sum: POSIX sh has no pipefail, and a failed read piped into awk
      # would be a sum of zero, which fits every allocatable.
      listing="$(node_kubectl get pods -A --field-selector "spec.nodeName=$NODE" -o \
        'jsonpath={range .items[*]}{.status.phase}{"\t"}{range .spec.containers[*]}{.resources.requests.memory}{","}{end}{"\t"}{range .spec.initContainers[*]}{.restartPolicy}{":"}{.resources.requests.memory}{","}{end}{"\n"}{end}')" || return 1
      printf '%s\n' "$listing" | awk -F'\t' '
          function ki(q, n, u) {
            if (q == "") return 0
            n = q; u = q; sub(/[A-Za-z]+$/, "", n); sub(/^[0-9.]+/, "", u)
            if (u == "Ki") return n
            if (u == "Mi") return n * 1024
            if (u == "Gi") return n * 1048576
            if (u == "k")  return n * 1000 / 1024
            if (u == "M")  return n * 1000000 / 1024
            if (u == "G")  return n * 1000000000 / 1024
            if (u == "m")  return n / 1024000
            return n / 1024
          }
          $1 == "Succeeded" || $1 == "Failed" { next }
          { s = 0; m = 0
            k = split($2, c, ","); for (i = 1; i <= k; i++) s += ki(c[i])
            k = split($3, c, ",")
            for (i = 1; i <= k; i++) { split(c[i], p, ":"); if (p[1] == "Always") s += ki(p[2]); else if (ki(p[2]) > m) m = ki(p[2]) }
            t += (s > m ? s : m) }
          END { printf "%d\n", t + 0.5 }'
    }

    restart() {
      log "restarting $SERVICE (containers keep running)"
      $NSENTER systemctl restart "$SERVICE"
    }

    # wait_node [expected allocatable KiB] → the node is Ready and reports that allocatable.
    wait_node() {
      i=0
      while [ "$i" -lt "$WAIT_TRIES" ]; do
        ready="$(node_kubectl get node "$NODE" -o 'jsonpath={.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || true)"
        if [ "$ready" = True ]; then
          [ -n "${1:-}" ] || return 0
          have="$(to_ki "$(node_kubectl get node "$NODE" -o 'jsonpath={.status.allocatable.memory}' 2>/dev/null || true)")"
          diff=$(( have > $1 ? have - $1 : $1 - have ))
          [ "$diff" -gt 1024 ] || { log "node Ready, allocatable ${have}Ki as expected"; return 0; }
        fi
        i=$((i + 1)); sleep "$WAIT_SLEEP"
      done
      echo "[kubelet-memory] node not Ready with allocatable ${1:-any}Ki (last: ready=[${ready:-}] allocatable=[${have:-}]Ki)" >&2
      return 1
    }

    # The server goes second: every agent must already run these values, or it waits.
    wait_for_agents() {
      want="$(arg eviction-hard "${KM_DROPIN_AGENT:-}" | tr ',' '\n' | sed -n 's/^memory\.available<//p')"
      [ -n "$want" ] || die "cannot read the agent's hard threshold"
      i=0
      while :; do
        missing=""
        for n in $(admin_kubectl get nodes -l '!node-role.kubernetes.io/control-plane' -o 'jsonpath={.items[*].metadata.name}'); do
          admin_kubectl get --raw "/api/v1/nodes/$n/proxy/configz" 2>/dev/null \
            | grep -q "\"memory.available\":\"$want\"" || missing="$missing $n"
        done
        [ -n "$missing" ] || { log "every agent runs the values"; return 0; }
        i=$((i + 1))
        [ "$i" -lt "$GATE_TRIES" ] || die "agent(s)$missing do not run the values yet — the control plane goes second"
        log "waiting for agent(s)$missing"
        sleep "$GATE_SLEEP"
      done
    }

    case "$MODE" in
      hold) log "mode hold: nothing to do on $NODE"; exit 0 ;;
      remove)
        if [ -f "$DROPIN" ]; then
          rm -f "$DROPIN" "$DROPIN.bak"
          log "removed $DROPIN"
          restart
          wait_node || die "$NODE did not come back after the removal"
        else
          log "no drop-in on $NODE: nothing to remove"
        fi
        exit 0 ;;
      apply) ;;
      *) die "KM_MODE must be hold, apply or remove, got [$MODE]" ;;
    esac

    TMP="$(mktemp)"
    printf '%s' "$DESIRED" > "$TMP"
    if [ -f "$DROPIN" ] && cmp -s "$TMP" "$DROPIN"; then
      rm -f "$TMP"
      log "drop-in already current on $NODE: no restart"
      exit 0
    fi

    [ "$ROLE" = agent ] || wait_for_agents

    CAPACITY="$(to_ki "$(node_kubectl get node "$NODE" -o 'jsonpath={.status.capacity.memory}')")"
    [ "$CAPACITY" -gt 0 ] || die "cannot read this node's capacity"
    HARD="$(threshold_ki eviction-hard)"; SOFT="$(threshold_ki eviction-soft)"
    RESERVED=$(( $(reserved_ki system-reserved) + $(reserved_ki kube-reserved) ))
    [ "$HARD" -gt 0 ] && [ "$SOFT" -gt 0 ] && [ "$RESERVED" -gt 0 ] || die "cannot read the values from the drop-in"
    ALLOCATABLE=$(( CAPACITY - RESERVED - HARD ))

    REQUESTED="$(pods_requested_ki)" || die "cannot list this node's pods: refusing to restart blind"
    [ -n "$REQUESTED" ] || die "cannot list this node's pods: refusing to restart blind"
    log "capacity ${CAPACITY}Ki, new allocatable ${ALLOCATABLE}Ki, requested ${REQUESTED}Ki"
    if [ "$REQUESTED" -gt "$ALLOCATABLE" ]; then
      die "requests ${REQUESTED}Ki are above the new allocatable ${ALLOCATABLE}Ki: the kubelet would refuse the newest pods at its restart. Nothing changed. Lower the requests first (RUNBOOK 2026-11-02)."
    fi

    AVAILABLE="$(awk '/^MemAvailable:/ { print $2; exit }' "$MEMINFO")"
    if [ "${AVAILABLE:-0}" -lt "$SOFT" ]; then
      die "MemAvailable ${AVAILABLE:-unknown}Ki is under the soft line ${SOFT}Ki: the kubelet would start evicting as soon as it is back. Nothing changed. Retry on a quieter node."
    fi

    mkdir -p "$DIR"
    [ ! -f "$DROPIN" ] || cp "$DROPIN" "$DROPIN.bak"
    cp "$TMP" "$DROPIN"
    rm -f "$TMP"
    log "wrote $DROPIN"

    # A kubelet that refuses a flag fails the restart itself: that too must reach the
    # take-back below, or set -e would leave the bad file and a stopped service.
    restart || log "the restart failed"
    if wait_node "$ALLOCATABLE"; then
      rm -f "$DROPIN.bak"
      log "applied on $NODE"
      exit 0
    fi

    echo "[kubelet-memory] the node did not take the values: taking them back" >&2
    if [ -f "$DROPIN.bak" ]; then mv "$DROPIN.bak" "$DROPIN"; else rm -f "$DROPIN"; fi
    restart || log "the second restart failed too: systemctl status $SERVICE on the node"
    wait_node || true
    exit 1
  KM_DROPIN_AGENT: |
    # /etc/rancher/k3s/config.yaml.d/kubelet-memory.yaml — dev agent, cx53. DO NOT EDIT on the node.
    # Written by cloud-init on a rebuild and by Plan kubelet-memory-agent on a live node.
    # Values and the arithmetic behind them: RUNBOOK 2026-11-02.
    kubelet-arg+:
      - "system-reserved=memory=512Mi"
      - "kube-reserved=memory=2Gi"
      - "eviction-hard=memory.available<2Gi,imagefs.available<5%,nodefs.available<5%"
      - "eviction-minimum-reclaim=memory.available=512Mi,imagefs.available=10%,nodefs.available=10%"
      - "eviction-soft=memory.available<4Gi"
      - "eviction-soft-grace-period=memory.available=60s"
      - "eviction-max-pod-grace-period=60"
  KM_DROPIN_SERVER: |
    # /etc/rancher/k3s/config.yaml.d/kubelet-memory.yaml — dev control plane, cx53. DO NOT EDIT on the node.
    # Written by cloud-init on a rebuild and by Plan kubelet-memory-server on a live node.
    # Values and the arithmetic behind them: RUNBOOK 2026-11-02.
    kubelet-arg+:
      - "system-reserved=memory=512Mi"
      - "kube-reserved=memory=4Gi"
      - "eviction-hard=memory.available<2Gi,imagefs.available<5%,nodefs.available<5%"
      - "eviction-minimum-reclaim=memory.available=512Mi,imagefs.available=10%,nodefs.available=10%"
      - "eviction-soft=memory.available<4Gi"
      - "eviction-soft-grace-period=memory.available=60s"
      - "eviction-max-pod-grace-period=60"
  KM_MODE: apply
kind: ConfigMap
metadata:
  name: kubelet-memory
  namespace: system-upgrade
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: system-upgrade-controller
  namespace: system-upgrade
spec:
  selector:
    matchLabels:
      upgrade.cattle.io/controller: system-upgrade-controller
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: system-upgrade-controller
        upgrade.cattle.io/controller: system-upgrade-controller
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                - system-upgrade-controller
            topologyKey: kubernetes.io/hostname
      containers:
      - env:
        - name: SYSTEM_UPGRADE_CONTROLLER_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['upgrade.cattle.io/controller']
        - name: SYSTEM_UPGRADE_CONTROLLER_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SYSTEM_UPGRADE_CONTROLLER_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        envFrom:
        - configMapRef:
            name: default-controller-env
        image: registry.psizone.ro/mirror/docker.io/rancher/system-upgrade-controller:v0.19.2@sha256:9411406c244d9b956c492bc47d22096e28f8dba512aee68167bc1445fe78decb
        imagePullPolicy: IfNotPresent
        name: system-upgrade-controller
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /etc/ssl
          name: etc-ssl
          readOnly: true
        - mountPath: /etc/pki
          name: etc-pki
          readOnly: true
        - mountPath: /etc/ca-certificates
          name: etc-ca-certificates
          readOnly: true
        - mountPath: /tmp
          name: tmp
      serviceAccountName: system-upgrade
      tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/controlplane
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      - effect: NoExecute
        key: node-role.kubernetes.io/etcd
        operator: Exists
      volumes:
      - hostPath:
          path: /etc/ssl
          type: DirectoryOrCreate
        name: etc-ssl
      - hostPath:
          path: /etc/pki
          type: DirectoryOrCreate
        name: etc-pki
      - hostPath:
          path: /etc/ca-certificates
          type: DirectoryOrCreate
        name: etc-ca-certificates
      - emptyDir: {}
        name: tmp
---
apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    alerts.psizone.ro/owner: platform-infra
  name: k3s-datastore-copy
  namespace: system-upgrade
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: k3s-datastore-copy
        spec:
          automountServiceAccountToken: false
          containers:
          - command:
            - /bin/sh
            - /scripts/upload.sh
            env:
            - name: HOME
              value: /work
            - name: AWS_REGION
              value: nbg1
            - name: AWS_ENDPOINT_URL
              value: https://nbg1.your-objectstorage.com
            - name: AWS_S3_ADDRESSING_STYLE
              value: path
            - name: BUCKET
              value: psi-tfstate-dev
            - name: PREFIX
              value: datastore-snapshots
            - name: KEEP
              value: "20"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: AWS_ACCESS_KEY_ID
                  name: k3s-datastore-s3
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: AWS_SECRET_ACCESS_KEY
                  name: k3s-datastore-s3
            image: amazon/aws-cli:2.17.0
            name: upload
            resources:
              limits:
                cpu: 250m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /work
              name: work
            - mountPath: /scripts
              name: scripts
              readOnly: true
          enableServiceLinks: false
          initContainers:
          - command:
            - /bin/sh
            - -c
            - |
              [ -n "${AWS_ACCESS_KEY_ID:-}" ] || { echo "MISSING REQUIRED SECRET: AWS_ACCESS_KEY_ID" >&2; exit 1; }
              [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || { echo "MISSING REQUIRED SECRET: AWS_SECRET_ACCESS_KEY" >&2; exit 1; }
            envFrom:
            - secretRef:
                name: k3s-datastore-s3
            image: busybox:1.37
            name: assert-secrets
            resources:
              limits:
                cpu: 50m
                memory: 32Mi
              requests:
                cpu: 10m
                memory: 16Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
          - command:
            - python
            - -I
            - /scripts/copy.py
            env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            image: python:3.13-alpine
            name: copy
            resources:
              limits:
