apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    gethomepage.dev/description: Turns platform alerts into Nextcloud Talk messages
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Messaging
    gethomepage.dev/href: https://cloud.psizone.ro/apps/spreed
    gethomepage.dev/icon: mdi-bell-badge
    gethomepage.dev/name: Talk alerts relay
    gethomepage.dev/pod-selector: app.kubernetes.io/name=talk-webhook
    gethomepage.dev/weight: "50"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  name: talk-webhook
  namespace: nextcloud
spec:
  ingressClassName: traefik
  rules:
  - host: notify.psizone.ro
    http:
      paths:
      - backend:
          service:
            name: talk-webhook
            port:
              name: http
        path: /notify
        pathType: Prefix
  tls:
  - hosts:
    - notify.psizone.ro
    secretName: talk-webhook-tls
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: nextcloud-db
  namespace: nextcloud
spec:
  backup:
    barmanObjectStore:
      data:
        compression: gzip
      destinationPath: s3://psi-tfstate-dev/cnpg/nextcloud-db
      endpointURL: https://nbg1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          key: AWS_ACCESS_KEY_ID
          name: nextcloud-backup-s3
        secretAccessKey:
          key: AWS_SECRET_ACCESS_KEY
          name: nextcloud-backup-s3
      wal:
        compression: gzip
        maxParallel: 2
    retentionPolicy: 14d
  bootstrap:
    initdb:
      database: nextcloud
      encoding: UTF8
      localeCType: C
      localeCollate: C
      owner: nextcloud
      secret:
        name: nextcloud-db-app
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-system-trixie
  instances: 1
  postgresql:
    parameters:
      effective_cache_size: 512MB
      max_connections: "200"
      shared_buffers: 256MB
      work_mem: 8MB
  primaryUpdateStrategy: unsupervised
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 384Mi
  smartShutdownTimeout: 10
  storage:
    size: 10Gi
    storageClass: local-path
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: nextcloud-db-base
  namespace: nextcloud
spec:
  backupOwnerReference: self
  cluster:
    name: nextcloud-db
  immediate: true
  schedule: 0 20 2 * * 0
