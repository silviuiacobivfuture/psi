  ro.js: "// Romanian for the English upstream ships under /ro/ — every tool's name
    and\n// description, the category descriptions, and the catalogue messages its
    ro.json\n// lacks. Read from ONE map, base/ro-overrides.json (\"texts\", \"messages\"),
    and\n// applied as the front proxies upstream's pages and JS chunks. Upstream's
    files\n// are never edited.\n//\n// WHY njs AND NOT sub_filter: nginx refuses
    more than 255 sub_filter patterns in\n// one location (\"number of search patterns
    exceeds 255\", measured on the pinned\n// image), and these strings need thousands
    — each one in every spelling a page,\n// a route payload and a minified chunk
    give it. Here a string is matched WHOLE,\n// as a string value, and looked up
    in the map: no spelling list to keep, and a\n// string that merely contains a
    mapped one is never touched.\n//\n// WHERE (each a real seam, each covered by
    selftest/routing.sh):\n//   html   — the React Server Component payload pushed
    inline\n//            (self.__next_f.push([1,\"…\"])), decoded, rewritten, re-encoded
    the\n//            way Next encodes it; then the markup React will hydrate against\n//
    \           it: text between tags and the content/title/alt/aria-label/\n//            placeholder
    attributes. Markup and payload MUST agree, or React\n//            discards the
    server markup — so a message (matched by key in the\n//            payload) is
    rewritten in the markup only where the payload of the\n//            same page
    rewrote that English, and never kept it elsewhere.\n//   flight — the .txt route
    payloads the router fetches on a client navigation;\n//   js     — `key:\"value\"`
    string literals in the chunks (the tool catalogue the\n//            Studio and
    the workflow editor list, the category descriptions).\n//\n// NEVER TOUCHED: a
    payload's TEXT ROWS (`<id>:T<hex length>,<bytes>`). Their\n// length is declared
    in bytes, so a translation inside one would desynchronise\n// everything after
    it; they hold schema.org JSON-LD that nobody reads. If the\n// payload's shape
    cannot be followed (a row cut where its kind is unknown, an\n// inline push of
    a shape not recognised) translation STOPS for the rest of that\n// document rather
    than guess. Any exception leaves the response as upstream sent it.\n//\n// GRACEFUL
    ON UPGRADE: a string upstream rewords no longer matches and stays\n// English;
    nothing breaks. selftest/routing.sh reports how much still matches.\n//\n// njs
    0.8.4 (the image's): no Map, no for…of — plain objects and indexes.\n// biome-ignore
    lint/style/useNodejsImportProtocol: njs names its module \"fs\"; \"node:fs\" does
    not exist there.\nimport fs from \"fs\";\n\nconst MAP_FILE = process.env.RO_OVERRIDES
    || \"/etc/nginx/psi/ro-overrides.json\";\nconst MAP = JSON.parse(fs.readFileSync(MAP_FILE));\nconst
    TEXTS = MAP.texts;\nconst MESSAGES = MAP.messages;\nconst SUFFIX = \" | PDFCraft\";\nconst
    BRAND_SUFFIX = \" | PDF Studio\";\nconst LONGEST = 700; // no mapped string is
    longer, in any spelling (tools/ro-overrides.py)\nconst ATTRS = { content: 1, title:
    1, alt: 1, \"aria-label\": 1, placeholder: 1 };\nconst own = Object.prototype.hasOwnProperty;\n//
    Every English a message translates, whatever its key.\nconst MESSAGE_ENGLISH =
    {};\nObject.keys(MESSAGES).forEach((k) => {\n\tObject.keys(MESSAGES[k]).forEach((en)
    => {\n\t\tMESSAGE_ENGLISH[en] = 1;\n\t});\n});\nconst NON_ASCII = new RegExp(`[${String.fromCharCode(0x80)}-${String.fromCharCode(0xffff)}]`,
    \"g\");\nconst LS = String.fromCharCode(0x2028);\nconst PS = String.fromCharCode(0x2029);\n\n//
    The Romanian for one string, or null. A message is matched by its own key AND\n//
    its English, so \"Odd\" is translated where it is tools.extractPages.selectOdd\n//
    and nowhere else; a tool text by its English alone. \"<title> | PDFCraft\" is
    a\n// title with upstream's suffix: the estate calls the tool PDF Studio, so the\n//
    suffix is renamed on EVERY such title (the stem translated when the map has\n//
    it) — a tab reads \"… | PDF Studio\" whether or not its stem is mapped.\nfunction
    translate(key, plain) {\n\tif (key !== null && own.call(MESSAGES, key) && own.call(MESSAGES[key],
    plain)) {\n\t\treturn MESSAGES[key][plain];\n\t}\n\tif (own.call(TEXTS, plain))
    return TEXTS[plain];\n\tif (plain.length > SUFFIX.length && plain.slice(-SUFFIX.length)
    === SUFFIX) {\n\t\tconst stem = plain.slice(0, -SUFFIX.length);\n\t\treturn (own.call(TEXTS,
    stem) ? TEXTS[stem] : stem) + BRAND_SUFFIX;\n\t}\n\treturn null;\n}\n\n// Index
    of the quote closing the literal opened at s[i], or -1 (none within `limit`).\nfunction
    closing(s, i, limit) {\n\tconst q = s[i];\n\tlet j = i + 1;\n\tfor (;;) {\n\t\tj
    = s.indexOf(q, j);\n\t\tif (j < 0 || j - i > limit) return -1;\n\t\tlet n = 0;\n\t\twhile
    (s[j - 1 - n] === \"\\\\\") n++;\n\t\tif (n % 2 === 0) return j;\n\t\tj++;\n\t}\n}\n\nfunction
    decodeLiteral(lit) {\n\ttry {\n\t\tif (lit[0] === '\"') return JSON.parse(lit);\n\t\tconst
    inner = lit.slice(1, -1).replace(/\\\\'/g, \"'\").replace(/\"/g, '\\\\\"');\n\t\treturn
