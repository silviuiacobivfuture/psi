apiVersion: v1
data:
  me.js: "// /_psi/me — the signed-in person, for the estate's bar (apps/pdfcraft-bar).\n//\n//
    Authentik's forward-auth gate passes the person to this pod as request headers\n//
    (X-authentik-name, X-authentik-email; gitops/platform/authentik/\n// middleware-forwardauth.yaml).
    They are answered as JSON built by\n// JSON.stringify — never spliced into a page,
    where a name holding a quote or an\n// angle bracket would be markup. Nothing
    is stored and nothing else is read.\n//\n// njs (nginx's JavaScript module, shipped
    in the image as ngx_http_js_module).\nfunction me(r) {\n\tconst name = r.headersIn[\"X-authentik-name\"]
    || \"\";\n\tconst email = r.headersIn[\"X-authentik-email\"] || \"\";\n\tr.headersOut[\"Content-Type\"]
    = \"application/json; charset=utf-8\";\n\tr.headersOut[\"Cache-Control\"] = \"no-store\";\n\tr.headersOut[\"X-Content-Type-Options\"]
    = \"nosniff\";\n\tr.return(200, JSON.stringify({ name: name, email: email }));\n}\n\nexport
    default { me };\n"
  nginx.conf: |
    # nginx MAIN config for PDFCraft — replaces the image's /etc/nginx/nginx.conf.
    #
    # It differs from the stock nginx:1.25-alpine one in exactly what running as a
    # non-root user on a READ-ONLY root filesystem requires, and nothing else:
    #   - no `user` directive (meaningless when not started as root);
    #   - pid and every temp path under /tmp, the pod's one writable emptyDir;
    #   - logs straight to the container's stdout/stderr;
    #   - a fixed worker count: `auto` means one worker per NODE cpu, not per the
    #     pod's cpu limit;
    #   - server_tokens off, and relative redirects (TLS ends at Traefik).
    # The site itself — routes, caching, the COOP/COEP headers the WebAssembly tools
    # need — is upstream's /etc/nginx/conf.d/default.conf, untouched.
    #
    # OUR CUSTOMISATION (the owner, 2026-10-28: "a lot in Chinese, and a lot of
    # marketing I don't want; customize it while staying resilient to future
    # updates") is the `server` at the bottom: a front on :8080 that proxies to
    # upstream's untouched server on 127.0.0.1:80. Upstream's files are never edited,
    # so a new image cannot silently undo or conflict with any of this.
    # njs, for /_psi/me (base/me.js) — shipped in the image, loaded here.
    load_module modules/ngx_http_js_module.so;

    worker_processes  2;

    error_log  /dev/stderr notice;
    pid        /tmp/nginx.pid;

    events {
        worker_connections  1024;
    }

    http {
        client_body_temp_path /tmp/client_temp;
        proxy_temp_path       /tmp/proxy_temp;
        fastcgi_temp_path     /tmp/fastcgi_temp;
        uwsgi_temp_path       /tmp/uwsgi_temp;
        scgi_temp_path        /tmp/scgi_temp;

        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /dev/stdout  main;

        sendfile           on;
        keepalive_timeout  65;
        server_tokens      off;
        # Behind Traefik's TLS, nginx sees plain http on :80. Its directory redirect
        # (/en/tools/merge-pdf → …/merge-pdf/) would otherwise be written as an
        # ABSOLUTE http://<host>/… URL — a scheme downgrade on every tool link. A
        # relative Location keeps the browser on https.
        absolute_redirect  off;

        # Upstream's site: `listen 80`, served to the front below only. The pod's
        # NetworkPolicy admits :8080 alone, so nothing outside the pod reaches :80.
        include /etc/nginx/conf.d/*.conf;

        # Which upstream responses the front may receive COMPRESSED. sub_filter can
        # only rewrite plain text, so pages (paths without a static-file extension,
        # .html, the .txt route payloads) are fetched uncompressed and the front
        # gzips them itself; every static asset keeps upstream's own compression.
        map $uri $psi_upstream_ae {
            # The JS chunks are rewritten (Romanian for upstream's hardcoded Chinese),
            # so they too come uncompressed. Listed FIRST: map regexes match in order.
            ~^/_next/static/chunks/  "";
            ~*\.(js|mjs|css|wasm|data|bin|json|svg|woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|ico|gz|map|pdf)$  $http_accept_encoding;
            default  "";
        }

        # The account endpoint's handler (base/me.js).
        js_import psi_me from /etc/nginx/psi/me.js;
        # Romanian for upstream's English tool names, descriptions and messages
        # (base/ro.js, from base/ro-overrides.json).
        js_import psi_ro from /etc/nginx/psi/ro.js;

        # ---- THE FRONT ----------------------------------------------------------
        server {
            listen 8080 default_server;
            server_name _;

            gzip on;
            gzip_vary on;
            gzip_proxied any;
            gzip_comp_level 6;
            gzip_min_length 256;
            gzip_types text/plain text/css application/javascript application/json;

            # ── ROUTING (owner, 2026-10-28: "only the landing pages … an entry point")
            # Reachable: OUR entry page at `/`, and their Studio, tools, workflow and
            # FAQ in Romanian. Everything else is sent to one of those.
            #
            # `/` → the tools index, until our own landing page is deployed in front.
            location = / {
                return 302 /ro/tools/;
            }
            location = /index.html {
                return 302 /;
            }
            # THEIR home and their marketing pages → our entry point. The .txt files
            # are the payloads their router fetches for an in-app navigation; they are
            # redirected too, or a click on their logo would render their home
            # without ever passing through here.
            location ~ "^/ro(/(index\.(html|txt))?)?$" {
                return 302 /;
            }
            location ~ "^/ro/(about|contact|privacy|terms|cookies)(/|\.|$)" {
                return 302 /;
            }
            # Every OTHER locale prefix → the same path under /ro/. Matched by SHAPE
            # (two letters, optionally -XX), not by a list, so a locale upstream adds
            # later is redirected too. No shared asset directory has that shape
            # (_next, fonts, images, web, workers, *-wasm, pdfjs-*, 404).
            # 302, not 301: nothing here should be cached for ever.
            location ~ "^/(?!ro(/|$))[a-z]{2}(-[A-Z]{2})?$" {
                return 302 /ro/;
            }
            location ~ "^/(?!ro/)[a-z]{2}(?:-[A-Z]{2})?/(.*)$" {
                return 302 /ro/$1$is_args$args;
            }

            # Our script (gitops/services/pdfcraft/base/psi.js): switches their
            # GitHub update check off and adds the „realizat cu PDFCraft” credit.
            location = /_psi/psi.js {
                alias /etc/nginx/psi/psi.js;
                default_type application/javascript;
                add_header Cache-Control "public, max-age=0, must-revalidate";
                add_header X-Content-Type-Options "nosniff" always;
                add_header Cross-Origin-Resource-Policy "same-origin" always;
            }

            # The estate's bar (apps/pdfcraft-bar, built into base/bar.js).
            location = /_psi/bar.js {
                alias /etc/nginx/psi/bar.js;
                default_type application/javascript;
                add_header Cache-Control "public, max-age=0, must-revalidate";
                add_header X-Content-Type-Options "nosniff" always;
                add_header Cross-Origin-Resource-Policy "same-origin" always;
            }

            # The signed-in person, as the forward-auth gate passed them: JSON built
            # by JSON.stringify in njs (base/me.js), never spliced into markup.
            location = /_psi/me {
                js_content psi_me.me;
            }

            # Our one stylesheet (gitops/services/pdfcraft/base/psi.css).
            location = /_psi/psi.css {
                alias /etc/nginx/psi/psi.css;
                default_type text/css;
                add_header Cache-Control "public, max-age=0, must-revalidate";
                add_header X-Content-Type-Options "nosniff" always;
                add_header Cross-Origin-Resource-Policy "same-origin" always;
            }

            # Upstream's JS chunks, in Romanian, from base/ro-overrides.json:
            #   - its hardcoded Chinese (the Workflow templates, the node counter), by
            #     sub_filter rules GENERATED from the map (tools/ro-overrides.py);
            #   - its English tool names and descriptions (the catalogue the Studio and
            #     the workflow editor list), by base/ro.js, string by string.
            # ONLY those run here — never the </head> injection, which inside a JS
            # string would break the script. A string upstream changes stays
            # untranslated; nothing breaks. Their `immutable` one-year cache is
            # replaced by one day, so a change to the map reaches browsers within a
            # day; the conditional headers are not forwarded, so a browser holding an
            # untranslated copy is never told by upstream that it is still current.
            location ^~ /_next/static/chunks/ {
                proxy_pass http://127.0.0.1:80;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header Connection "";
                proxy_set_header Accept-Encoding $psi_upstream_ae;
                proxy_set_header If-None-Match "";
                proxy_set_header If-Modified-Since "";
                proxy_max_temp_file_size 0;
                js_header_filter psi_ro.headers;
                js_body_filter psi_ro.body buffer_type=buffer;
                proxy_hide_header Cache-Control;
                proxy_hide_header Expires;
                add_header Cache-Control "public, max-age=86400" always;
                sub_filter_types application/javascript;
                sub_filter_once off;
                include /etc/nginx/psi/ro-overrides.conf;
            }

            # THEIR PAGES and the .txt route payloads, in Romanian: every tool's name
            # and description and the messages upstream's ro.json lacks, by base/ro.js
            # (njs — sub_filter takes at most 255 patterns a location, far too few).
            # Only these paths go through it: it holds a response whole before
            # rewriting, which is right for a page and wrong for a 30 MiB
            # WebAssembly file, so every static asset stays in `location /` below.
            # Otherwise the same as `location /`.
            location ~ "(/|\.html|\.txt)$" {
                proxy_pass http://127.0.0.1:80;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header Connection "";
                proxy_set_header Accept-Encoding $psi_upstream_ae;
                proxy_set_header If-None-Match "";
                proxy_set_header If-Modified-Since "";
                proxy_max_temp_file_size 0;
                js_header_filter psi_ro.headers;
                js_body_filter psi_ro.body buffer_type=buffer;
                sub_filter '</head>' '<link rel="stylesheet" href="/_psi/psi.css"><script src="/_psi/psi.js"></script><script src="/_psi/bar.js" defer></script></head>';
                sub_filter '<link rel="manifest" href="/manifest.webmanifest"/>' '<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials"/>';
                sub_filter_once on;
                sub_filter_types text/html;
            }

            location / {
                proxy_pass http://127.0.0.1:80;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header Connection "";
                proxy_set_header Accept-Encoding $psi_upstream_ae;
                # STREAM, never spool to disk: the LibreOffice WebAssembly is tens of
                # MiB and /tmp is a 64Mi emptyDir. A disk-buffered response would
                # fill it and get the pod evicted.
                proxy_max_temp_file_size 0;
                # One stylesheet of ours, before </head>, on every page: the estate's
                # colours and font, and the hiding of their footer and social links.
                sub_filter '</head>' '<link rel="stylesheet" href="/_psi/psi.css"><script src="/_psi/psi.js"></script><script src="/_psi/bar.js" defer></script></head>';
                # Browsers fetch a web-app manifest WITHOUT credentials unless told
                # otherwise, so the Authentik gate answered it with a redirect to the
                # sign-in and the console showed a CORS error on every page. Asking for
                # it WITH the session cookie keeps the gate closed on everything. If
                # upstream changes this markup the rule matches nothing: the console
                # error returns, nothing breaks.
                sub_filter '<link rel="manifest" href="/manifest.webmanifest"/>' '<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials"/>';
                sub_filter_once on;
                sub_filter_types text/html;
            }
        }
    }
  psi.css: |
    /*
     * PDFCraft's stylesheet slot, injected by the nginx front before </head> on every page
     * (nginx.conf). SEB ships no theme: an estate brings its own colours and hides what it
     * chooses through its component (components/estate/pdfcraft), which replaces this file.
     */
  psi.js: "/*\n * PDFCraft's script slot, loaded by the nginx front from <head> on
    every page (nginx.conf).\n * SEB's default does one thing: upstream's automatic
    \"check for updates\" asks GitHub and two\n * third-party mirrors from every visitor's
    browser; it reads its switch from localStorage, so\n * the switch is set OFF here,
    before their application starts. An estate's component\n * (components/estate/pdfcraft)
    may replace this file (keeping the switch off).\n */\n(() => {\n\tconst UPDATE_SETTINGS
    = \"pdfcraft_update_settings\";\n\ttry {\n\t\tconst raw = window.localStorage.getItem(UPDATE_SETTINGS);\n\t\tconst
    settings = raw ? JSON.parse(raw) : {};\n\t\tif (settings === null || typeof settings
    !== \"object\" || settings.autoCheck !== false) {\n\t\t\twindow.localStorage.setItem(\n\t\t\t\tUPDATE_SETTINGS,\n\t\t\t\tJSON.stringify({
    ...(settings || {}), autoCheck: false }),\n\t\t\t);\n\t\t}\n\t} catch {\n\t\t/*
    storage blocked: the check runs as upstream ships it */\n\t}\n})();\n"
  ro-overrides.conf: |
    # GENERATED by gitops/services/pdfcraft/tools/ro-overrides.py from
    # ro-overrides.json — do not edit. Included by nginx.conf in the location
    # that serves upstream's JS chunks.
    sub_filter '合同安全加水印与加密归档 (Secure Contract Publishing)' 'Contract securizat: filigran, anonimizare și criptare';
    sub_filter '\\u5408\\u540c\\u5b89\\u5168\\u52a0\\u6c34\\u5370\\u4e0e\\u52a0\\u5bc6\\u5f52\\u6863 (Secure Contract Publishing)' 'Contract securizat: filigran, anonimizare \\u0219i criptare';
    sub_filter '从 PDF 输入开始，依次添加水印、敏感信息脱敏、高强度密码加密，并直接提供下载产物' 'Pornește de la un PDF, adaugă un filigran, ascunde informațiile sensibile, îl criptează cu o parolă puternică și oferă fișierul gata de descărcat.';
    sub_filter '\\u4ece PDF \\u8f93\\u5165\\u5f00\\u59cb\\uff0c\\u4f9d\\u6b21\\u6dfb\\u52a0\\u6c34\\u5370\\u3001\\u654f\\u611f\\u4fe1\\u606f\\u8131\\u654f\\u3001\\u9ad8\\u5f3a\\u5ea6\\u5bc6\\u7801\\u52a0\\u5bc6\\uff0c\\u5e76\\u76f4\\u63a5\\u63d0\\u4f9b\\u4e0b\\u8f7d\\u4ea7\\u7269' 'Porne\\u0219te de la un PDF, adaug\\u0103 un filigran, ascunde informa\\u021biile sensibile, \\u00eel cripteaz\\u0103 cu o parol\\u0103 puternic\\u0103 \\u0219i ofer\\u0103 fi\\u0219ierul gata de desc\\u0103rcat.';
    sub_filter 'PDF 源文档输入' 'Document PDF sursă';
    sub_filter 'PDF \\u6e90\\u6587\\u6863\\u8f93\\u5165' 'Document PDF surs\\u0103';
    sub_filter '添加防伪水印' 'Adaugă filigran de autenticitate';
    sub_filter '\\u6dfb\\u52a0\\u9632\\u4f2a\\u6c34\\u5370' 'Adaug\\u0103 filigran de autenticitate';
    sub_filter '机密文档 仅供参考' 'CONFIDENȚIAL — doar pentru consultare';
    sub_filter '\\u673a\\u5bc6\\u6587\\u6863 \\u4ec5\\u4f9b\\u53c2\\u8003' 'CONFIDEN\\u021aIAL \\u2014 doar pentru consultare';
    sub_filter '设置访问密码' 'Setează parola de acces';
    sub_filter '\\u8bbe\\u7f6e\\u8bbf\\u95ee\\u5bc6\\u7801' 'Seteaz\\u0103 parola de acces';
    sub_filter '下载安全合同 PDF' 'Descarcă contractul securizat (PDF)';
    sub_filter '\\u4e0b\\u8f7d\\u5b89\\u5168\\u5408\\u540c PDF' 'Descarc\\u0103 contractul securizat (PDF)';
    sub_filter '扫描件净化纠偏与增强 (Scanned Cleanup & Optimize)' 'Curățare și optimizare documente scanate';
    sub_filter '\\u626b\\u63cf\\u4ef6\\u51c0\\u5316\\u7ea0\\u504f\\u4e0e\\u589e\\u5f3a (Scanned Cleanup & Optimize)' 'Cur\\u0103\\u021bare \\u0219i optimizare documente scanate';
    sub_filter '自动对倾斜扫描件进行矫正、智能检测并删除空白页、进行快速线性化压缩优化' 'Îndreaptă automat paginile scanate strâmb, detectează și elimină paginile goale, apoi comprimă și optimizează documentul pentru afișare rapidă.';
    sub_filter '\\u81ea\\u52a8\\u5bf9\\u503e\\u659c\\u626b\\u63cf\\u4ef6\\u8fdb\\u884c\\u77eb\\u6b63\\u3001\\u667a\\u80fd\\u68c0\\u6d4b\\u5e76\\u5220\\u9664\\u7a7a\\u767d\\u9875\\u3001\\u8fdb\\u884c\\u5feb\\u901f\\u7ebf\\u6027\\u5316\\u538b\\u7f29\\u4f18\\u5316' '\\u00cendreapt\\u0103 automat paginile scanate str\\u00e2mb, detecteaz\\u0103 \\u0219i elimin\\u0103 paginile goale, apoi comprim\\u0103 \\u0219i optimizeaz\\u0103 documentul pentru afi\\u0219are rapid\\u0103.';
    sub_filter '扫描件原稿输入' 'Documentul scanat original';
    sub_filter '\\u626b\\u63cf\\u4ef6\\u539f\\u7a3f\\u8f93\\u5165' 'Documentul scanat original';
    sub_filter '自动倾斜校正' 'Îndreptare automată';
    sub_filter '\\u81ea\\u52a8\\u503e\\u659c\\u6821\\u6b63' '\\u00cendreptare automat\\u0103';
    sub_filter '移除空白扫描页' 'Elimină paginile goale';
    sub_filter '\\u79fb\\u9664\\u7a7a\\u767d\\u626b\\u63cf\\u9875' 'Elimin\\u0103 paginile goale';
    sub_filter 'Web 快视优化' 'Optimizare pentru afișare rapidă pe web';
    sub_filter 'Web \\u5feb\\u89c6\\u4f18\\u5316' 'Optimizare pentru afi\\u0219are rapid\\u0103 pe web';
    sub_filter '导出高清净化 PDF' 'Exportă PDF-ul curățat, la calitate înaltă';
    sub_filter '\\u5bfc\\u51fa\\u9ad8\\u6e05\\u51c0\\u5316 PDF' 'Export\\u0103 PDF-ul cur\\u0103\\u021bat, la calitate \\u00eenalt\\u0103';
    sub_filter '电子发票首页提取与归档 ZIP (Invoice Batch Archiver)' 'Arhivare facturi în lot (ZIP)';
    sub_filter '\\u7535\\u5b50\\u53d1\\u7968\\u9996\\u9875\\u63d0\\u53d6\\u4e0e\\u5f52\\u6863 ZIP (Invoice Batch Archiver)' 'Arhivare facturi \\u00een lot (ZIP)';
    sub_filter '批量提取电子发票的首页有效凭证，执行中等质量压缩，并将全部发票打包为 ZIP 归档' 'Extrage prima pagină, cea relevantă, din fiecare factură, o comprimă la calitate medie și pune toate facturile într-o arhivă ZIP.';
    sub_filter '\\u6279\\u91cf\\u63d0\\u53d6\\u7535\\u5b50\\u53d1\\u7968\\u7684\\u9996\\u9875\\u6709\\u6548\\u51ed\\u8bc1\\uff0c\\u6267\\u884c\\u4e2d\\u7b49\\u8d28\\u91cf\\u538b\\u7f29\\uff0c\\u5e76\\u5c06\\u5168\\u90e8\\u53d1\\u7968\\u6253\\u5305\\u4e3a ZIP \\u5f52\\u6863' 'Extrage prima pagin\\u0103, cea relevant\\u0103, din fiecare factur\\u0103, o comprim\\u0103 la calitate medie \\u0219i pune toate facturile \\u00eentr-o arhiv\\u0103 ZIP.';
    sub_filter '发票原件批量输入' 'Facturile originale, în lot';
    sub_filter '\\u53d1\\u7968\\u539f\\u4ef6\\u6279\\u91cf\\u8f93\\u5165' 'Facturile originale, \\u00een lot';
    sub_filter '提取发票首页' 'Extrage prima pagină a facturii';
    sub_filter '\\u63d0\\u53d6\\u53d1\\u7968\\u9996\\u9875' 'Extrage prima pagin\\u0103 a facturii';
    sub_filter '平衡质量压缩' 'Compresie echilibrată';
    sub_filter '\\u5e73\\u8861\\u8d28\\u91cf\\u538b\\u7f29' 'Compresie echilibrat\\u0103';
    sub_filter '打包发票为 ZIP 归档' 'Arhivează facturile în ZIP';
    sub_filter '\\u6253\\u5305\\u53d1\\u7968\\u4e3a ZIP \\u5f52\\u6863' 'Arhiveaz\\u0103 facturile \\u00een ZIP';
    sub_filter '相册多图转双面折页小册子 (Photo Album Booklet)' 'Broșură foto din mai multe imagini';
    sub_filter '\\u76f8\\u518c\\u591a\\u56fe\\u8f6c\\u53cc\\u9762\\u6298\\u9875\\u5c0f\\u518c\\u5b50 (Photo Album Booklet)' 'Bro\\u0219ur\\u0103 foto din mai multe imagini';
    sub_filter '上传多张图片合成 PDF，自动重排为可直接对折骑马钉装订的小册子并加上页码' 'Încarci mai multe imagini, le transformă într-un PDF, le reordonează ca broșură gata de îndoit și capsat la mijloc și adaugă numerele paginilor.';
    sub_filter '\\u4e0a\\u4f20\\u591a\\u5f20\\u56fe\\u7247\\u5408\\u6210 PDF\\uff0c\\u81ea\\u52a8\\u91cd\\u6392\\u4e3a\\u53ef\\u76f4\\u63a5\\u5bf9\\u6298\\u9a91\\u9a6c\\u9489\\u88c5\\u8ba2\\u7684\\u5c0f\\u518c\\u5b50\\u5e76\\u52a0\\u4e0a\\u9875\\u7801' '\\u00cencarci mai multe imagini, le transform\\u0103 \\u00eentr-un PDF, le reordoneaz\\u0103 ca bro\\u0219ur\\u0103 gata de \\u00eendoit \\u0219i capsat la mijloc \\u0219i adaug\\u0103 numerele paginilor.';
    sub_filter '批量图片输入' 'Imaginile, în lot';
    sub_filter '\\u6279\\u91cf\\u56fe\\u7247\\u8f93\\u5165' 'Imaginile, \\u00een lot';
    sub_filter '图片转 PDF' 'Imagini în PDF';
    sub_filter '\\u56fe\\u7247\\u8f6c PDF' 'Imagini \\u00een PDF';
    sub_filter '双面折页小册子重排' 'Reordonare pentru broșură îndoită';
