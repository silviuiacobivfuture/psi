apiVersion: v1
data:
  guard.js: "// The SSO guard: Plane's own sign-in UI is never drawn (apps/plane-sso,
    \"The web half\").\n//\n// plane-web's nginx puts this into every page's <head>,
    so it runs before the\n// app's module scripts. The edge already sends every page
    load without a Plane\n// session through Authentik (plane-session-check); this
    covers what happens\n// INSIDE an already loaded page, where no edge can reach:\n//\n//
    \  * an api answer of 401 (the Plane session ended: expired, signed out in\n//
    \    another tab, cookie cleared) → straight to /auth/authentik/, back to this\n//
    \    page, instead of the app drawing its e-mail form;\n//   * the app routing
    itself to one of its credential screens (sign-in, sign-up,\n//     password set
    / reset / forgot) → the same.\n//\n// 401s that do not mean \"this browser's session
    is gone\" are left alone: the\n// X-API-Key api (/api/v1/), published pages (/api/public/)
    and the instance\n// probe (/api/instances/). The page is hidden while it leaves,
    so the form does\n// not flash.\n(() => {\n\t// verify-live B6 asks whether the
    guard ran; the app drops the tag from <head>.\n\twindow.__planeSsoGuard = true;\n\tconst
    SSO = \"/auth/authentik/\";\n\t// Every credential route of the v1.4.1 web app
    (apps/plane-sso/test-web.sh\n\t// fails an upgrade that adds one these do not
    cover). The edge\n\t// redirects the same set (gitops/services/plane/base/ingress.yaml).\n\tconst
    CREDENTIAL = /^\\/(?:sign-in|sign-up|signin|login|register|accounts\\/[^/]+)\\/?$/;\n\tconst
    NOT_SESSION = /^\\/api\\/(?:v1|public|instances)\\//;\n\tlet leaving = false;\n\n\tfunction
    nextPath() {\n\t\tconst here = new URL(window.location.href);\n\t\tconst onCredentialScreen
    = here.pathname === \"/\" || CREDENTIAL.test(here.pathname);\n\t\tif (!onCredentialScreen)
    return here.pathname + here.search;\n\t\tconst inner = here.searchParams.get(\"next_path\")
    ?? \"\";\n\t\treturn CREDENTIAL.test(inner.split(\"?\")[0]) ? \"\" : inner;\n\t}\n\n\tfunction
    toSSO() {\n\t\tif (leaving) return;\n\t\tleaving = true;\n\t\tdocument.documentElement.style.visibility
    = \"hidden\";\n\t\tconst next = nextPath();\n\t\twindow.location.replace(\n\t\t\tSSO
    + (next && next !== \"/\" ? `?next_path=${encodeURIComponent(next)}` : \"\"),\n\t\t);\n\t}\n\n\tfunction
    sessionGone(url, status) {\n\t\tif (status !== 401 || !url) return false;\n\t\ttry
    {\n\t\t\tconst u = new URL(url, window.location.href);\n\t\t\treturn (\n\t\t\t\tu.origin
    === window.location.origin &&\n\t\t\t\tu.pathname.startsWith(\"/api/\") &&\n\t\t\t\t!NOT_SESSION.test(u.pathname)\n\t\t\t);\n\t\t}
    catch {\n\t\t\treturn false;\n\t\t}\n\t}\n\n\t// XMLHttpRequest (the app's axios).
    \"loadend\" listeners added at send() run\n\t// after the ones axios set, so this
    navigation is the one that wins.\n\tconst urls = new WeakMap();\n\tconst open
    = XMLHttpRequest.prototype.open;\n\tXMLHttpRequest.prototype.open = function (method,
    url, ...rest) {\n\t\turls.set(this, String(url));\n\t\treturn open.call(this,
    method, url, ...rest);\n\t};\n\tconst send = XMLHttpRequest.prototype.send;\n\tXMLHttpRequest.prototype.send
    = function (...args) {\n\t\tthis.addEventListener(\"loadend\", () => {\n\t\t\tif
    (sessionGone(this.responseURL || urls.get(this), this.status)) toSSO();\n\t\t});\n\t\treturn
    send.apply(this, args);\n\t};\n\n\tconst fetch = window.fetch;\n\twindow.fetch
    = function (...args) {\n\t\treturn fetch.apply(this, args).then((r) => {\n\t\t\tif
    (sessionGone(r.url, r.status)) toSSO();\n\t\t\treturn r;\n\t\t});\n\t};\n\n\tconst
    onRoute = () => {\n\t\tif (CREDENTIAL.test(window.location.pathname)) toSSO();\n\t};\n\tfor
    (const method of [\"pushState\", \"replaceState\"]) {\n\t\tconst original = window.history[method];\n\t\twindow.history[method]
    = function (...args) {\n\t\t\tconst result = original.apply(this, args);\n\t\t\tonRoute();\n\t\t\treturn
    result;\n\t\t};\n\t}\n\twindow.addEventListener(\"popstate\", onRoute);\n\tonRoute();\n})();\n"
  headers.conf: |
    # Upstream's security headers (v1.4.1 nginx.conf), plus the HTML no-store from
    # nginx.conf's map. One file because nginx drops every inherited add_header in a
    # location that sets its own: each location that adds one includes this first.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Cache-Control $plane_sso_cache_control always;
  nginx.conf: |
    # plane-web's nginx, replacing the image's /etc/nginx/nginx.conf (apps/plane-sso,
    # "The web half"). It is upstream's v1.4.1 file (sha256 pinned in
    # apps/plane-sso/upstream-web-files.sha256, so an upgrade that changes it fails
    # naming it) plus THREE things, each so that Plane's own sign-in form is never
    # drawn for a person:
    #
    #   1. HTML is never cached (Cache-Control: no-store). Upstream sends HTML with a
    #      months-old Last-Modified and no Cache-Control, so browsers keep it
    #      "heuristically fresh" for days and serve a page navigation straight from
    #      disk: no request reaches Traefik, the session check never runs, the app
    #      asks /api/users/me/, gets 401 and renders its e-mail form. Measured on dev
    #      2026-10-28 (the owner's browser, then reproduced: verify_browser.mjs B1).
    #   2. The SSO guard (/plane-sso/guard.js) is put into every page, before the
    #      app's own scripts: a 401 from the api, or the app routing to one of its
    #      credential screens, goes to /auth/authentik/ instead of drawing a form.
    #   3. /sw.js is a worker that retires itself (clears Cache Storage, unregisters,
    #      reloads its pages), so a browser holding an old Plane PWA install heals on
    #      its next visit. v1.4.1 itself registers no worker but still ships one.
    worker_processes 4;

    events {
      worker_connections 1024;
    }

    http {
      include mime.types;

      default_type  application/octet-stream;

      set_real_ip_from        0.0.0.0/0;
      real_ip_recursive       on;
      real_ip_header          X-Forwarded-For;
      limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

      access_log /dev/stdout;
      error_log /dev/stderr;

      # (1) Only HTML: the hashed /assets keep whatever caching they had.
      map $sent_http_content_type $plane_sso_cache_control {
        ~^text/html  "no-store";
        default      "";
      }

      server {
        listen 3000;

        include /etc/nginx/plane-sso/headers.conf;

        # (3) The retiring worker. Same path the old install registered, so the
        # browser's own update check fetches it.
        location = /sw.js {
          include /etc/nginx/plane-sso/headers.conf;
          add_header Cache-Control "no-store" always;
          default_type application/javascript;
          alias /etc/nginx/plane-sso/sw.js;
        }

        # (2) The guard itself.
        location = /plane-sso/guard.js {
          include /etc/nginx/plane-sso/headers.conf;
          add_header Cache-Control "no-cache" always;
          default_type application/javascript;
          alias /etc/nginx/plane-sso/guard.js;
        }

        location / {
          root   /usr/share/nginx/html;
          index  index.html index.htm;
          try_files $uri $uri/ /index.html;

          # (2) A classic script in <head> runs before the app's module scripts.
          sub_filter '</head>' '<script src="/plane-sso/guard.js"></script></head>';
          sub_filter_once on;
        }
      }
    }
  sw.js: "// Plane's service worker, retired (apps/plane-sso, \"The web half\").\n//\n//
    Served at /sw.js instead of upstream's caching worker. A browser that ever\n//
    installed Plane's worker fetches this file on its next visit (the browser's own\n//
    update check), and this version: takes over at once, empties Cache Storage,\n//
    unregisters itself and reloads every Plane tab it controlled. After that the\n//
    tabs talk to the network, where the edge's SSO gate is. Nothing registers a\n//
    worker again (v1.4.1's web app has no registration of its own).\nself.addEventListener(\"install\",
    () => self.skipWaiting());\n\nself.addEventListener(\"activate\", (event) => {\n\tevent.waitUntil(\n\t\t(async
    () => {\n\t\t\tawait self.clients.claim();\n\t\t\tfor (const key of await caches.keys())
    await caches.delete(key);\n\t\t\tconst tabs = await self.clients.matchAll({ type:
    \"window\" });\n\t\t\tawait self.registration.unregister();\n\t\t\tfor (const
    tab of tabs) tab.navigate(tab.url);\n\t\t})(),\n\t);\n});\n"
