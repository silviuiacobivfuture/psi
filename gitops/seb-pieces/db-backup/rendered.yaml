              ls -l /work/novu.archive.gz
              sz=$(wc -c < /work/novu.archive.gz); [ "$sz" -gt 1000 ] || { echo "FATAL: novu dump too small ($sz bytes) — connection/auth failed or empty database" >&2; exit 1; }
