apiVersion: batch/v1
kind: CronJob
metadata:
  name: harbor-db-dump
  namespace: harbor
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: harbor-db-dump
        spec:
          containers:
          - args:
            - |
              set -eu
              TS=$(date -u +%Y%m%dT%H%M%SZ)
              OUT=/work/harbor.sql.gz
              test -s "$OUT" || { echo "FATAL: dump missing/empty (initContainer failed)" >&2; exit 1; }
              # Hetzner S3 rejects the SDK default checksum (same as velero/openbao).
              export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
              export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
              KEY="${PREFIX}/harbor-${TS}.sql.gz"
              echo "Uploading → s3://${BUCKET}/${KEY}"
              aws s3 cp "$OUT" "s3://${BUCKET}/${KEY}" --endpoint-url "$AWS_ENDPOINT_URL"
              echo "DB dump uploaded: s3://${BUCKET}/${KEY}"
              # Retention: keep the 20 most recent dumps (≈5 days at 6-hourly).
              KEEP=20
              aws s3 ls "s3://${BUCKET}/${PREFIX}/" --endpoint-url "$AWS_ENDPOINT_URL" \
                | awk '{print $4}' | grep -E '^harbor-.*\.sql\.gz$' | sort -r | tail -n +$((KEEP + 1)) \
                | while read -r f; do aws s3 rm "s3://${BUCKET}/${PREFIX}/${f}" --endpoint-url "$AWS_ENDPOINT_URL"; done || true
            command:
            - /bin/sh
            - -c
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: AWS_ACCESS_KEY_ID
                  name: harbor-backup-s3
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: AWS_SECRET_ACCESS_KEY
                  name: harbor-backup-s3
            - name: AWS_REGION
              value: nbg1
            - name: AWS_ENDPOINT_URL
              value: https://nbg1.your-objectstorage.com
            - name: AWS_S3_ADDRESSING_STYLE
              value: path
            - name: BUCKET
              value: psi-tfstate-dev
            - name: PREFIX
              value: db-dumps/harbor
            image: amazon/aws-cli:2.17.0
            name: upload
            resources:
              limits:
                cpu: 250m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /work
              name: work
          initContainers:
          - args:
            - |
              set -eu
              echo "pg_dumpall harbor-database → /work/harbor.sql.gz"
              pg_dumpall -h harbor-database -p 5432 -U postgres | gzip -c > /work/harbor.sql.gz
              ls -l /work/harbor.sql.gz
              # Fail LOUD if the dump is suspiciously tiny (auth/connect failure
              # yields an near-empty file) — a silent bad backup is worse than none.
              sz=$(wc -c < /work/harbor.sql.gz); [ "$sz" -gt 1000 ] || { echo "FATAL: harbor dump too small ($sz bytes) — connection/auth failed" >&2; exit 1; }
            command:
            - /bin/sh
            - -c
            env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: harbor-database
            image: postgres:17-alpine
            name: dump
            resources:
              limits:
                cpu: 500m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
            - mountPath: /work
              name: work
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 70
            runAsNonRoot: true
            runAsUser: 70
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - emptyDir: {}
            name: work
      ttlSecondsAfterFinished: 43200
  schedule: 15 */6 * * *
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
---
