                memory: 256Mi
              requests:
                cpu: 50m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /work
              name: work
          initContainers:
          - args:
            - |
              set -eu
              echo "pg_dump reportportal (db=reportportal, user=reportportal) → /work/reportportal.sql.gz"
              pg_dump -h reportportal-db-rw -p 5432 -U reportportal -d reportportal | gzip -c > /work/reportportal.sql.gz
              ls -l /work/reportportal.sql.gz
              sz=$(wc -c < /work/reportportal.sql.gz); [ "$sz" -gt 1000 ] || { echo "FATAL: reportportal dump too small ($sz bytes) — connection/auth failed" >&2; exit 1; }
            command:
            - /bin/sh
            - -c
            env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: reportportal-db-app
            image: registry.psizone.ro/mirror/docker.io/library/postgres:17-alpine@sha256:e4cb93687b062cd25a0e8f672d85a7708235009d70d31f8a7698d9370092a9c4
            name: dump
            resources:
              limits:
                cpu: "1"
