apiVersion: v1
kind: ResourceQuota
metadata:
  labels:
    seb.platform/piece: test-reports
  name: test-reports
  namespace: test-reports
spec:
  hard:
    limits.cpu: "2"
    limits.memory: 1Gi
    pods: "6"
    requests.cpu: 300m
    requests.memory: 384Mi
---
apiVersion: v1
data:
  analysis.py: |
    """Derive the things a stakeholder actually asks, from stored run history.

    Three questions, three functions:

      1. "Since when has this been broken?"  -> failing_since()
         A red mark with no age is useless. "Failing since 3 runs ago" is the whole
         difference between "someone just broke it" and "we have been shipping around
         this for a week".

      2. "Did anything get worse?"          -> area_movement()
         Comparing the latest run to the one before it is the only movement signal a
         non-technical reader needs: this area regressed, that one recovered.

      3. "Is it getting better over time?"  -> trend()
         Rules-holding per run, most recent last, ready to draw as bars.

    All three are PURE: they take already-loaded envelopes and return plain data. No
    filesystem, no HTTP, no rendering — so they are trivially testable offline, which
    is how the page was verified before it ever ran on the cluster.
    """

    # A rule is identified by (area, title). The title IS the business rule as
    # written by whoever wrote the test, so a renamed rule reads as a new rule — which
    # is correct: the sentence being asserted changed. The tab separator keeps the two
    # fields from running together: a plain concatenation would make ("ab", "c") and
    # ("a", "bc") the same key, i.e. one rule's history silently attributed to another.


    def rule_key(area, title):
        return "%s\t%s" % (area, title)


    def _rules_by_key(envelope):
        """{rule_key: status} for one run."""
        out = {}
        for area in envelope.get("areas") or []:
            name = area.get("area") or ""
            for rule in area.get("rules") or []:
                out[rule_key(name, rule.get("title") or "")] = rule.get("status")
        return out


    def _area_failures(envelope):
        """{area name: failed count} for one run."""
        return {
            (a.get("area") or ""): int(a.get("failed") or 0)
            for a in envelope.get("areas") or []
        }


    def failing_since(history):
        """For every rule failing in the newest run, how long it has been failing.

        `history` is newest-first. Returns {rule_key: {"runs": int, "since": str|None,
        "beyond": bool}} where:
          * runs   — consecutive runs (including the newest) in which it has failed
          * since  — the timestamp of the OLDEST of those runs, or None if unknown
          * beyond — True when the streak reaches the end of the scanned window, i.e.
                     it has been failing for AT LEAST `runs` runs and probably longer.
                     Rendering that honestly ("de cel puțin N rulări") matters: the
                     alternative is a confident number that quietly caps at the scan
                     limit and understates a long-standing regression.
        """
        if not history:
            return {}
        latest = history[0]
        statuses = [_rules_by_key(run) for run in history]
        out = {}
        for key, status in statuses[0].items():
            if status != "failed":
                continue
            runs = 1
            since = latest.get("receivedAt") or latest.get("timestamp")
            beyond = True
            for index in range(1, len(statuses)):
                previous = statuses[index].get(key)
                if previous == "failed":
                    runs += 1
                    since = history[index].get("receivedAt") or history[index].get("timestamp")
                    continue
                if previous is None:
                    # The rule did not exist in that run (a new test, or a suite that
                    # never ran). The streak ends here and the age IS known.
                    beyond = False
                    break
                beyond = False  # it was passing (or skipped) then — a real boundary
                break
            else:
                # Ran off the end of the scanned window without finding a boundary.
                beyond = True
            out[key] = {"runs": runs, "since": since, "beyond": beyond}
        return out


    def area_movement(history):
        """Per-area change between the newest run and the one before it.

        Returns {area: {"delta": int, "direction": "worse"|"better"|"same"|"new"}},
        where delta is the change in FAILING rules (positive = more failures).
        """
        if not history:
            return {}
        current = _area_failures(history[0])
        if len(history) < 2:
            return {area: {"delta": 0, "direction": "new"} for area in current}
        previous = _area_failures(history[1])
        out = {}
        for area, failed in current.items():
            if area not in previous:
                out[area] = {"delta": 0, "direction": "new"}
                continue
            delta = failed - previous[area]
            if delta > 0:
                direction = "worse"
            elif delta < 0:
                direction = "better"
            else:
                direction = "same"
            out[area] = {"delta": delta, "direction": direction}
        return out


    def trend(history, limit=20):
        """Rules-holding per run, OLDEST FIRST so it reads left-to-right as time.

        Each point: {"id", "passed", "failed", "total", "at", "commit"}.
        """
        points = []
        for run in list(history[:limit])[::-1]:
            totals = run.get("totals") or {}
            passed = int(totals.get("passed") or 0)
            failed = int(totals.get("failed") or 0)
            points.append(
                {
                    "id": run.get("id") or "",
                    "passed": passed,
                    "failed": failed,
                    "total": passed + failed,
                    "at": run.get("receivedAt") or run.get("timestamp") or "",
                    "commit": (run.get("commit") or "")[:8],
                }
            )
        return points


    def totals_of(envelope):
        """(passed, failed, skipped) for one run, defaulting safely."""
        totals = envelope.get("totals") or {}
        return (
            int(totals.get("passed") or 0),
            int(totals.get("failed") or 0),
            int(totals.get("skipped") or 0),
        )
  app.py: |
    """test-reports — receive a CI run's business-rule outcome, keep it, serve it.

    WHY IT EXISTS
        Until now a run's result lived in a GitHub job summary and a 30-day artifact
        zip. No history, no trend, nothing to link a chat message at, and nothing a
        non-technical stakeholder could open. This is phase 2 of
        infrastructure/hetzner/TEST-VISIBILITY-PLAN.md — deliberately NOT ReportPortal
        (that is phase 3), just the cheap half that delivers the business-facing value.

    WHY PYTHON STDLIB
        http.server + json are in the base image, so there is no pip install, no
        requirements file, no supply chain and no build step — same reasoning as
        gitops/services/nextcloud/base/talk-webhook.yaml. It handles a handful of
        requests a day.

    THE AUTH SPLIT — READ THIS BEFORE ADDING A ROUTE
        The UI (`/`, `/run/...`) sits behind the Authentik forward-auth middleware.
        `/ingest/...` and `/healthz` sit on a SEPARATE, UNGATED Ingress and are
        protected by a bearer token instead. That is not a shortcut: a forward-auth
        gate answers an unauthenticated request with a 302 to another origin, which a
        machine caller cannot follow — the exact failure that broke Plane outright on
        2026-08-19 (gitops/services/plane/base/ingress.yaml). A new MACHINE route must
        go on the ungated Ingress with token auth; a new BROWSER route goes on the
        gated one.

        Nothing here re-checks SSO: the gated Ingress is the only thing standing in
        front of the UI, so the routes are all reachable in-cluster by design. What
        the token protects is WRITES.
    """

    import hmac
    import json
    import os
    import sys
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    import digest
    import render
    import store

    # Bearer for POST /ingest. Read at startup: a rotation arrives as a new env value,
    # which is why the Deployment carries the Reloader annotation (rotating the secret
    # without restarting the pod would leave it validating the OLD token forever).
    INGEST_TOKEN = os.environ["INGEST_TOKEN"]

    # A report for ~400 rules is ~60 KB. 4 MiB is two orders of magnitude of headroom
    # and still bounds what one request can make this process allocate.
    MAX_BODY = int(os.environ.get("MAX_BODY_BYTES", str(4 * 1024 * 1024)))

    # How many runs the index page scans. Bounds page-render cost and is the window
    # within which "failing since N runs" can be stated exactly (analysis.py reports
    # "de cel puțin N" when a streak reaches the edge of it, rather than lying).
    HISTORY_LIMIT = int(os.environ.get("HISTORY_LIMIT", "40"))

    # Listen port. 8080 in the cluster; overridable so the offline test can bind a
    # free port and run the REAL server rather than a stand-in.
    PORT = int(os.environ.get("PORT", "8080"))

    # Public origin of this page, used ONLY to build the link inside the weekly digest.
    # Not derived from the request Host: the digest is fetched over the in-cluster
    # Service name, so Host would read `test-reports.test-reports.svc` and the chat
    # message would carry a URL nobody outside the cluster can open.
    PUBLIC_URL = os.environ["PUBLIC_URL"].rstrip("/")  # set by the piece: https://tests. + the estate apex

    # Names the environment in the digest text. branch == environment, 1:1.
    ENV_NAME = os.environ.get("ENV_NAME", "dev")

    # How many runs per app the weekly digest scans. Larger than HISTORY_LIMIT because
    # it compares against a run from a week ago and one busy app alone can do ~20 a day.
    DIGEST_LIMIT = int(os.environ.get("DIGEST_LIMIT", "400"))

    SCHEMA = "test-report/v1"


    def validate(payload):
        """Return an error string if this is not a report envelope we can store.

        Boundary validation, in the sense root CLAUDE.md means it: everything arriving
        over HTTP is untrusted until it is checked. Rejecting loudly here is what stops
        a malformed sender quietly filling the volume with files the page then skips.
        """
        if not isinstance(payload, dict):
            return "body must be a JSON object"
        if payload.get("schema") != SCHEMA:
            return "unsupported schema (expected %s)" % SCHEMA
        if not isinstance(payload.get("totals"), dict):
            return "missing totals object"
        areas = payload.get("areas")
        if not isinstance(areas, list):
            return "missing areas array"
        for area in areas:
            if not isinstance(area, dict) or not isinstance(area.get("area"), str):
                return "each area needs an `area` name"
            if not isinstance(area.get("rules"), list):
                return "each area needs a `rules` array"
        return None


    class Handler(BaseHTTPRequestHandler):
        server_version = "test-reports/1.0"

        # -- plumbing -----------------------------------------------------------
        def _send(self, code, body, content_type):
            payload = body.encode("utf-8")
            self.send_response(code)
            # charset matters: every string on this page is Romanian.
            self.send_header("Content-Type", "%s; charset=utf-8" % content_type)
            self.send_header("Content-Length", str(len(payload)))
            # The page is entirely self-contained (inline CSS, no scripts, no remote
            # assets), so it can afford the strictest policy there is.
            self.send_header(
                "Content-Security-Policy",
                "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; "
                "form-action 'none'; frame-ancestors 'none'; base-uri 'none'",
            )
            self.send_header("X-Content-Type-Options", "nosniff")
            self.end_headers()
            if self.command != "HEAD":
                self.wfile.write(payload)

        def _text(self, code, message):
            self._send(code, message + "\n", "text/plain")

        def _html(self, code, markup):
            self._send(code, markup, "text/html")

        def _json(self, code, obj):
            self._send(code, json.dumps(obj, ensure_ascii=False) + "\n", "application/json")

        def log_message(self, fmt, *args):
            # Method + path only. Never the query string — the same discipline
            # talk-webhook applies, so a token can never reach the container log.
            sys.stderr.write("%s %s\n" % (self.command, self.path.split("?")[0]))

        # -- reads --------------------------------------------------------------
        def do_HEAD(self):
            self.do_GET()

        def do_GET(self):
            path = self.path.split("?")[0].rstrip("/") or "/"
            if path == "/healthz":
                self._json(200, self.health())
                return
            if path == "/digest":
                # The weekly #tests summary, pre-rendered as the exact JSON body the
                # talk-webhook translator accepts — so the CronJob that posts it
                # (../weekly-digest.yaml) is a `curl | curl` and holds no logic at all.
                #
                # THIS ROUTE IS NOT ON THE UNGATED INGRESS, on purpose. Its only caller
                # is in-cluster and dials the Service directly, so it needs no public
                # exposure; the gated Ingress's `/` catch-all covers it for a browser,
                # which means it inherits the Authentik gate rather than adding a new
                # anonymous surface. Do NOT add /digest to the ingest Ingress.
                #
                # The body also carries a `summaries` array the translator ignores (it
                # reads message/detail/severity and nothing else) — kept because it is
                # what the offline harness and a human debugging the digest assert on.
                sections = [(app, store.history(app, DIGEST_LIMIT)) for app in store.apps()]
                self._json(
                    200,
                    digest.weekly(
                        sections,
                        now=datetime.now(timezone.utc),
                        base_url=PUBLIC_URL,
                        env_name=ENV_NAME,
                    ),
                )
                return
            if path == "/":
                sections = [(app, store.history(app, HISTORY_LIMIT)) for app in store.apps()]
                self._html(200, render.render_index(sections))
                return
            if path.startswith("/run/"):
                parts = path[len("/run/") :].split("/")
                if len(parts) != 2:
                    self._text(404, "not found")
                    return
                app, stem = parts
                run = store.load(app, stem)
                if run is None:
                    self._text(404, "verificarea nu există")
                    return
                self._html(200, render.render_run(run))
                return
            self._text(404, "not found")

        def health(self):
            """Liveness AND freshness in one answer.

            ALWAYS 200, even when a report is stale: this endpoint is the kubelet's
            liveness probe, and returning 503 for staleness would restart a perfectly
            healthy pod because CI happened to be quiet. The AGE is reported and
            `doctor.sh` is what judges it — a silently-dead ingest is exactly the
            failure this whole service exists to prevent, so the number has to be
            readable from outside.
            """
            now = datetime.now(timezone.utc)
            apps = {}
            for app in store.apps():
                apps[app] = {
                    "runs": len(store.stems(app)),
                    "newestAgeSeconds": store.newest_age_seconds(app, now=now),
                }
            return {
                "status": "ok",
                "retentionDays": store.RETENTION_DAYS,
                "apps": apps,
                "now": now.strftime("%Y-%m-%dT%H:%M:%SZ"),
            }

        # -- writes -------------------------------------------------------------
        def do_POST(self):
            path = self.path.split("?")[0].rstrip("/")
            if not path.startswith("/ingest/"):
                self._text(404, "not found")
                return

            # Header-only bearer, deliberately: unlike talk-webhook there is no sender
            # here that cannot set a header (the only caller is a CI step), so the
            # ?token= form is not offered and cannot end up in a proxy access log.
            supplied = self.headers.get("X-Report-Token", "")
            if not hmac.compare_digest(supplied, INGEST_TOKEN):
                self._text(401, "unauthorized")
                return

            app = path[len("/ingest/") :]
            if not store.valid_app(app):
                self._text(400, "invalid app name")
                return

            try:
                length = int(self.headers.get("Content-Length") or 0)
            except ValueError:
                self._text(400, "bad Content-Length")
                return
            if length <= 0:
                self._text(400, "empty body")
                return
            if length > MAX_BODY:
                self._text(413, "body too large (max %d bytes)" % MAX_BODY)
                return

            try:
                payload = json.loads(self.rfile.read(length).decode("utf-8"))
            except (ValueError, UnicodeDecodeError) as exc:
                # "Reject anything that does not parse" — a stored file that cannot be
                # read is worse than a rejected request, because it is discovered later.
                self._text(400, "body is not valid JSON: %s" % exc)
                return

            problem = validate(payload)
            if problem:
                self._text(400, problem)
                return

            try:
                run_id = store.save(app, payload)
            except (OSError, ValueError) as exc:
                sys.stderr.write("store failed for %s: %s\n" % (app, exc))
                self._text(500, "could not store the report")
                return

            # Prune here because there is no scheduler in a one-replica stdlib service
            # and ingest is the only guaranteed tick. It only ever deletes files whose
            # own name timestamp is outside the window.
            pruned = store.prune(app)
            self._text(201, "stored %s (pruned %d)" % (run_id, pruned))


    def main():
        os.makedirs(store.DATA_DIR, exist_ok=True)
        ThreadingHTTPServer(("", PORT), Handler).serve_forever()


    if __name__ == "__main__":
        main()
  digest.py: |
    """The weekly #tests digest, computed here rather than in the CronJob's shell.

    WHY THE LOGIC LIVES IN PYTHON AND NOT IN THE JOB
        The CronJob that posts this (../../base/weekly-digest.yaml) is a `curl | curl`
        pipe on purpose. Everything it would otherwise have to do — scan a year of
        stored runs, compare against the same week last week, agree the Romanian noun
        with the count — is work this service already has the data and the helpers for,
        and shell is the worst possible place to do it. Keeping it here also means the
        offline harness (../../selftest/run.sh) exercises the REAL digest text against
        REAL stored runs, with no cluster and no Talk.

        It rides the same deploy path as everything else in base/app/: kustomize
        rehashes the ConfigMap name on any edit, which rolls the pod. There is no
        separate image and nothing to bump.

    THE NOTIFICATION PRINCIPLE (infrastructure/hetzner/TEST-VISIBILITY-PLAN.md §1)
        A notification carries a SUMMARY AND A LINK. It never carries the payload. So
        this returns counts, movement and a URL — never a rule title, never a failure
        message, never a stack trace. "Which rules" is what the page answers, and the
        page is one click away. A digest that pasted three failing rule names into chat
        would be unreadable within a month and would leak test detail into a room that
        is not gated the way the page is.

    PURE
        weekly() takes already-loaded envelopes and returns plain data. No filesystem,
        no HTTP, no clock of its own (the caller passes `now`), so it is trivially
        asserted offline.
    """

    from datetime import datetime, timedelta, timezone

    # Matches the stem `store.py` writes: <YYYYmmddTHHMMSSZ>-<short-sha>.
    _STEM_FORMAT = "%Y%m%dT%H%M%SZ"
    # Matches `receivedAt`, the service's own receipt stamp.
    _ISO_FORMAT = "%Y-%m-%dT%H:%M:%SZ"


    def _plural(count, one, few, many):
        """Romanian noun agreement, which has THREE forms, not two.

            1        -> "o regulă"        (singular)
            2..19    -> "5 reguli"        (plural, bare)
            20+      -> "2773 de reguli"  (plural, with the particle "de")

        and the form is decided by the LAST TWO DIGITS, so 118 takes the bare plural
        ("118 reguli") while 120 takes "de" ("120 de reguli").

        Not cosmetic. This text is read by the business side, and "1 reguli" or
        "2773 reguli" both read as machine output — which is exactly the impression
        this whole surface exists to avoid.
        """
        if count == 1:
            return one
        # ZERO is special-cased rather than folded into the modulo: `0 % 100 == 0`
        # would take the "de" branch and produce "0 de reguli", while 100 — which has
        # the SAME remainder — genuinely needs it ("100 de reguli"). One `== 0` test
        # keeps both right.
        if count == 0:
            return few
        return few if 1 <= count % 100 <= 19 else many


    def run_time(envelope):
        """When this run was recorded, as a UTC datetime, or None.

        The STEM is preferred over any field the sender supplied: this service wrote
        the filename itself, so a CI runner with a wrong clock cannot backdate or
        fast-forward its way into (or out of) the weekly window.
        """
        stem = envelope.get("stem") or ""
        head = stem.split("-", 1)[0]
        for value, fmt in ((head, _STEM_FORMAT), (envelope.get("receivedAt"), _ISO_FORMAT)):
            if not value:
                continue
            try:
                return datetime.strptime(value, fmt).replace(tzinfo=timezone.utc)
            except (ValueError, TypeError):
                continue
        return None


    def _failing(envelope):
        totals = envelope.get("totals") or {}
        return int(totals.get("failed") or 0)


    def _checked(envelope):
        totals = envelope.get("totals") or {}
        return int(totals.get("passed") or 0) + int(totals.get("failed") or 0)


    def app_summary(app, runs, now, window_days=7):
        """One application's week. `runs` is newest-first, as store.history returns."""
        if not runs:
            return {
                "app": app,
                "runs": 0,
                "stale": True,
                "ageDays": None,
                "checked": 0,
                "failing": 0,
                "areasBroken": 0,
                "delta": 0,
            }

        cutoff = now - timedelta(days=window_days)
        latest = runs[0]
        latest_at = run_time(latest)
        in_window = [r for r in runs if (run_time(r) or datetime.min.replace(tzinfo=timezone.utc)) >= cutoff]

        # The comparison point is the OLDEST run still inside the window — i.e. "how did
        # this look a week ago". When the window holds a single run there is nothing to
        # compare against and the delta is 0 rather than an invented movement.
        reference = in_window[-1] if len(in_window) > 1 else None

        return {
            "app": app,
            "runs": len(in_window),
            # STALE means nothing was recorded this week. It is a WARNING, never a
            # failure: these workflows are path-filtered, so a genuinely quiet week is
            # normal. doctor.sh is what escalates a month of silence to a failure.
            "stale": not in_window,
            "ageDays": None if latest_at is None else max(0, (now - latest_at).days),
            "checked": _checked(latest),
            "failing": _failing(latest),
            "areasBroken": sum(1 for a in latest.get("areas") or [] if int(a.get("failed") or 0)),
            "delta": _failing(latest) - _failing(reference) if reference else 0,
        }


    def _app_line(summary):
        app = summary["app"]
        if summary["runs"] == 0:
            if summary["ageDays"] is None:
                return "%s — nicio verificare înregistrată" % app
            return "%s — nicio verificare în ultimele 7 zile (ultima acum %d %s)" % (
                app,
                summary["ageDays"],
                _plural(summary["ageDays"], "zi", "zile", "de zile"),
            )

        checks = "%d %s" % (
            summary["runs"],
            _plural(summary["runs"], "verificare", "verificări", "de verificări"),
        )
        if summary["failing"] == 0:
            return "%s — toate cele %d %s se respectă (%s)" % (
                app,
                summary["checked"],
                _plural(summary["checked"], "regulă", "reguli", "de reguli"),
                checks,
            )

        movement = ""
        if summary["delta"] > 0:
            movement = ", cu %d în plus față de acum o săptămână" % summary["delta"]
        elif summary["delta"] < 0:
            movement = ", cu %d mai puține decât acum o săptămână" % -summary["delta"]
        return "%s — %d din %d %s nu se respectă%s, în %d %s (%s)" % (
            app,
            summary["failing"],
            summary["checked"],
            _plural(summary["checked"], "regulă", "reguli", "de reguli"),
            movement,
            summary["areasBroken"],
            _plural(summary["areasBroken"], "zonă de business", "zone de business", "de zone de business"),
            checks,
        )


    def weekly(sections, now, base_url, env_name="dev", window_days=7):
        """The whole digest: `{severity, message, detail, summaries}`.

        `sections` is [(app, runs-newest-first)] — the same shape render_index takes,
        so the digest and the page can never disagree about what was stored.

        `severity` follows the talk-webhook vocabulary used by health-digest:
          fail — at least one business rule is not holding right now
          warn — everything that ran is green, but some app went a week without running
          ok   — green and fresh. POSTED ANYWAY, deliberately: a digest that only
                 speaks when something is broken is indistinguishable from a digest
                 that has stopped working, and a quiet Monday would then be silently
                 ambiguous. The green heartbeat IS the liveness proof, exactly as
                 gitops/platform/health-digest reasons for #infra.
        """
        summaries = [app_summary(app, runs, now, window_days) for app, runs in sections]

        if not summaries:
            return {
                "severity": "warn",
                "message": "sumar săptămânal (%s): serviciul nu are nicio verificare stocată" % env_name,
                "detail": "Pagina: %s" % base_url,
                "summaries": [],
            }

        failing = sum(s["failing"] for s in summaries)
        checked = sum(s["checked"] for s in summaries)
        runs = sum(s["runs"] for s in summaries)
        stale = [s["app"] for s in summaries if s["stale"]]

        if failing:
            severity = "fail"
            headline = "%d din %d %s de business nu se respectă" % (
                failing,
                checked,
                _plural(checked, "regulă", "reguli", "de reguli"),
            )
        elif stale:
            severity = "warn"
            headline = "toate cele %d %s verificate se respectă; %s fără verificări" % (
                checked,
                _plural(checked, "regulă", "reguli", "de reguli"),
                ", ".join(stale),
            )
        else:
            severity = "ok"
