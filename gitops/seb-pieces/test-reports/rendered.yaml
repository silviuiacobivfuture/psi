        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - configMap:
          name: test-reports-app-cktcgkd9fk
        name: app
      - name: data
        persistentVolumeClaim:
          claimName: test-reports-data
