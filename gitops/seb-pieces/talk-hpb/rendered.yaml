apiVersion: v1
kind: ResourceQuota
metadata:
  labels:
    seb.platform/piece: talk-hpb
  name: talk-hpb
  namespace: talk-hpb
spec:
  hard:
    limits.cpu: "4"
    limits.memory: 3Gi
    pods: "3"
    requests.cpu: 600m
    requests.memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: talk-hpb
    seb.platform/piece: talk-hpb
  name: talk-hpb
  namespace: talk-hpb
spec:
  ports:
  - name: signaling
    port: 8081
    targetPort: 8081
  selector:
    app.kubernetes.io/name: talk-hpb
---
apiVersion: v1
kind: LimitRange
metadata:
  labels:
    seb.platform/piece: talk-hpb
  name: talk-hpb
  namespace: talk-hpb
spec:
  limits:
  - default:
      cpu: "1"
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: "2"
      memory: 2Gi
    type: Container
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: talk-hpb
    seb.platform/piece: talk-hpb
  name: talk-hpb
  namespace: talk-hpb
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: talk-hpb
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: talk-hpb
    spec:
      containers:
      - args:
        - sh
        - -c
        - |
          set -eu
          PUB=$(dig +short "$TALK_HOST" A | grep -E '^[0-9]+\.' | head -1)
          [ -n "$PUB" ] || { echo "FATAL: cannot resolve $TALK_HOST — TURN relay address unknown" >&2; exit 1; }
          sed -i "s|relay_ipv4_addr:.*|relay_ipv4_addr: \"$PUB\"|" /conf/eturnal.yml
          echo "eturnal relay address set to $PUB"
          grep relay_ipv4_addr /conf/eturnal.yml
          exec supervisord -c /supervisord.conf
        env:
        - name: NC_DOMAIN
          value: cloud.psizone.ro
        - name: TALK_HOST
          value: turn.psizone.ro
        - name: TURN_DOMAIN
          value: turn.psizone.ro
        - name: TALK_PORT
          value: "3478"
        - name: AIO_LOG_LEVEL
          value: info
        - name: TURN_SECRET
          valueFrom:
            secretKeyRef:
              key: turn-secret
              name: talk-hpb-secrets
        - name: SIGNALING_SECRET
          valueFrom:
            secretKeyRef:
              key: signaling-secret
              name: talk-hpb-secrets
        - name: INTERNAL_SECRET
          valueFrom:
            secretKeyRef:
              key: internal-secret
              name: talk-hpb-secrets
        image: registry.psizone.ro/mirror/docker.io/nextcloud/aio-talk:20260817_082005@sha256:19244334b59d9c54d5d1235ff1dc32c352aa6bd47e14a6bf50b5ff45124a364c
        livenessProbe:
          httpGet:
            path: /api/v1/welcome
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 20
        name: talk
        ports:
        - containerPort: 8081
          name: signaling
          protocol: TCP
        - containerPort: 3478
          name: turn-udp
          protocol: UDP
        - containerPort: 3478
          name: turn-tcp
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /api/v1/welcome
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          limits:
            cpu: "2"
            memory: 1Gi
          requests:
            cpu: 200m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /conf
          name: conf
        - mountPath: /var/run/supervisord
          name: run
        - mountPath: /var/log/supervisord
          name: log
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir: {}
        name: conf
      - emptyDir: {}
        name: run
      - emptyDir: {}
        name: log
      - emptyDir: {}
        name: tmp
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    seb.platform/piece: talk-hpb
  name: talk-hpb-secrets
  namespace: talk-hpb
spec:
  data:
  - remoteRef:
      key: apps/talk-hpb/secrets
      property: signaling_secret
    secretKey: signaling-secret
  - remoteRef:
      key: apps/talk-hpb/secrets
      property: turn_secret
    secretKey: turn-secret
  - remoteRef:
      key: apps/talk-hpb/secrets
      property: internal_secret
    secretKey: internal-secret
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    name: talk-hpb-secrets
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    gethomepage.dev/description: Nextcloud Talk high-performance backend — calls and
      video
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Messaging
    gethomepage.dev/href: https://signaling.psizone.ro/api/v1/welcome
    gethomepage.dev/icon: mdi-message-video
    gethomepage.dev/name: Talk signaling
    gethomepage.dev/pod-selector: app.kubernetes.io/name=talk-hpb
    gethomepage.dev/weight: "40"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  labels:
    seb.platform/piece: talk-hpb
  name: talk-hpb
  namespace: talk-hpb
spec:
  ingressClassName: traefik
  rules:
  - host: signaling.psizone.ro
    http:
      paths:
      - backend:
          service:
            name: talk-hpb
            port:
              number: 8081
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - signaling.psizone.ro
    secretName: talk-hpb-tls
