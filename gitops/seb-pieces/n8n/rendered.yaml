        cidr: 10.0.1.1/32
    - ipBlock:
        cidr: 10.42.0.1/32
    - ipBlock:
        cidr: 10.42.1.1/32
    ports:
    - port: 5680
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: runner
      app.kubernetes.io/name: n8n
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n8n-sso
  namespace: n8n
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  - ports:
    - port: 5678
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: main
          app.kubernetes.io/name: n8n
  - ports:
    - port: 9000
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: authentik
      podSelector:
        matchLabels:
          app.kubernetes.io/component: server
          app.kubernetes.io/name: authentik
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: authentik
      podSelector:
        matchLabels:
          app.kubernetes.io/name: authentik
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app: estate-watch
    ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: n8n-sso
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: n8n-db
  namespace: n8n
spec:
  backup:
    barmanObjectStore:
      data:
        compression: gzip
      destinationPath: s3://psi-tfstate-dev/cnpg/n8n-db
      endpointURL: https://nbg1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          key: AWS_ACCESS_KEY_ID
          name: n8n-backup-s3
        secretAccessKey:
          key: AWS_SECRET_ACCESS_KEY
          name: n8n-backup-s3
      wal:
        compression: gzip
        maxParallel: 2
    retentionPolicy: 14d
  bootstrap:
    initdb:
      database: n8n
      encoding: UTF8
      localeCType: C
      localeCollate: C
      owner: n8n
      secret:
        name: n8n-db-app
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-system-trixie
  instances: 1
  postgresql:
    parameters:
      effective_cache_size: 256MB
      jit: "off"
      max_connections: "30"
      shared_buffers: 96MB
      work_mem: 4MB
  primaryUpdateStrategy: unsupervised
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 192Mi
  smartShutdownTimeout: 10
  storage:
    size: 5Gi
    storageClass: local-path
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: n8n-db-base
  namespace: n8n
spec:
  backupOwnerReference: self
  cluster:
    name: n8n-db
  immediate: true
  schedule: 0 55 2 * * 0
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n-sso-intercept
  namespace: n8n
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`n8n.psizone.ro`) && Method(`GET`) && Header(`Sec-Fetch-Dest`, `document`)
      && !HeaderRegexp(`Cookie`, `(^|;\s*)n8n-auth=`) && !Query(`sso`, `1`) && !PathRegexp(`^/(sso|signup|forgot-password|change-password|outpost\.goauthentik\.io|rest|api|assets|static|types|\.well-known|healthz|metrics|e2e|favicon\.ico|webhook|webhook-test|webhook-waiting|form|form-test|form-waiting|mcp|mcp-test)(/|$)`)
    middlewares:
    - name: n8n-sso-intercept
    priority: 2
    services:
    - kind: TraefikService
      name: noop@internal
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n-sso-launch
  namespace: n8n
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`auth.psizone.ro`) && PathRegexp(`^/application/launch/n8n/?$`)
    middlewares:
    - name: n8n-sso-launch
    priority: 300
    services:
    - kind: TraefikService
      name: noop@internal
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n-sso-page
  namespace: n8n
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`n8n.psizone.ro`) && Path(`/sso/page.js`) && Method(`GET`)
    middlewares:
    - name: n8n-webhook-rate
    priority: 200
    services:
    - name: n8n-sso
      port: http
      serversTransport: n8n-sso-page
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: n8n-sso-press
  namespace: n8n
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`n8n.psizone.ro`) && Path(`/sso/setup`) && Header(`Sec-Fetch-Site`,
      `cross-site`) && Header(`Sec-Fetch-Dest`, `document`) && !Query(`press`, `1`)
    middlewares:
    - name: n8n-sso-press
    priority: 300
    services:
    - kind: TraefikService
      name: noop@internal
  - kind: Rule
    match: Host(`n8n.psizone.ro`) && PathPrefix(`/outpost.goauthentik.io/start`) &&
      Header(`Sec-Fetch-Site`, `cross-site`) && Header(`Sec-Fetch-Dest`, `document`)
    middlewares:
    - name: n8n-sso-press-start
    priority: 300
    services:
    - kind: TraefikService
      name: noop@internal
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: n8n-body-limit
  namespace: n8n
spec:
  buffering:
    maxRequestBodyBytes: 16777216
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: n8n-hooks-strip
  namespace: n8n
spec:
  headers:
    customRequestHeaders:
      Cookie: ""
    customResponseHeaders:
      Clear-Site-Data: ""
      Content-Security-Policy: sandbox allow-scripts allow-forms allow-popups
      Set-Cookie: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: n8n-refuse-all
  namespace: n8n
spec:
  ipAllowList:
    sourceRange:
    - 255.255.255.255/32
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: n8n-sso-intercept
  namespace: n8n
spec:
  redirectRegex:
    permanent: false
    regex: ^(https?)://([^/]+)(/.*)$
    replacement: ${1}://${2}/sso/setup?from=${3}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: n8n-sso-launch
  namespace: n8n
spec:
  redirectRegex:
    permanent: false
    regex: ^.*$
    replacement: https://n8n.psizone.ro/sso/setup
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: n8n-sso-press
  namespace: n8n
spec:
  redirectRegex:
    permanent: false
    regex: ^(https?)://([^/?]+)/[^?]*\??(.*)$
    replacement: ${1}://${2}/sso/setup?press=1&${3}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: n8n-sso-press-start
  namespace: n8n
spec:
  redirectRegex:
    permanent: false
    regex: ^(https?)://([^/]+)/.*$
    replacement: ${1}://${2}/sso/setup?press=1
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: n8n-webhook-rate
  namespace: n8n
spec:
  rateLimit:
    average: 20
    burst: 40
    period: 1s
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: n8n-sso-page
  namespace: n8n
spec:
  forwardingTimeouts:
    dialTimeout: 2s
    responseHeaderTimeout: 2s
