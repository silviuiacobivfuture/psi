        - name: N8N_DIAGNOSTICS_CONFIG_BACKEND
          value: ""
        - name: N8N_DIAGNOSTICS_POSTHOG_API_KEY
          value: ""
        - name: N8N_DIAGNOSTICS_POSTHOG_API_HOST
          value: ""
