        - license.n8n.io
        - enterprise.n8n.io
        ip: 127.0.0.1
      initContainers:
      - args:
        - |
          for k in N8N_ENCRYPTION_KEY N8N_USER_MANAGEMENT_JWT_SECRET N8N_RUNNERS_AUTH_TOKEN N8N_INSTANCE_OWNER_PASSWORD_HASH DB_POSTGRESDB_USER DB_POSTGRESDB_PASSWORD N8N_HOST; do
            eval "v=\${$k:-}"
            [ -n "$v" ] || { echo "MISSING REQUIRED SECRET: $k" >&2; exit 1; }
          done
          echo "all required secrets present"
        command:
        - sh
        - -c
        envFrom:
        - secretRef:
            name: n8n-app
        - configMapRef:
            name: n8n-host
        image: registry.psizone.ro/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
        name: assert-secrets
        resources:
          limits:
            cpu: 100m
            memory: 32Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir:
          sizeLimit: 1Gi
        name: n8n-home
      - emptyDir:
          sizeLimit: 256Mi
        name: cache
      - emptyDir:
          sizeLimit: 256Mi
        name: tmp
