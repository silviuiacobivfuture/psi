apiVersion: v1
data:
  advisory-watch.mjs: "// Is the n8n in this image inside any published security advisory?
    advisory-watch.yaml\n// says why this exists. Exit 0: no. Exit 1: yes, naming
    each, or it could not tell.\n// A lookup that fails is never \"clean\".\nimport
    { readFileSync } from \"node:fs\";\n\nconst API = process.env.N8N_ADVISORY_API
    ?? \"https://api.github.com/repos/n8n-io/n8n/security-advisories\";\nconst PACKAGE
    = process.env.N8N_PACKAGE_JSON ?? \"/usr/local/lib/node_modules/n8n/package.json\";\n//
    GitHub pages this list by cursor, in the Link header; a `page` parameter is ignored
    and\n// answers the first hundred again (measured 2026-11-03).\nconst MAX_PAGES
    = 20;\n// Open-ended by nature: upstream states no fix, and it never leaves the
    list. Each is here\n// because of something the estate does and the selftest proves,
    and only that id passes.\nconst ACCEPTED = new Map([\n\t[\"GHSA-365g-vjw2-grx8\",
    \"Execute Command is what the node does: refused by NODES_EXCLUDE, selftest X6\"],\n]);\n\nconst
    parse = (v) => v.trim().split(\"-\")[0].split(\".\").map(Number);\nfunction compare(a,
    b) {\n\tconst x = parse(a);\n\tconst y = parse(b);\n\tfor (let i = 0; i < 3; i
    += 1) {\n\t\tif ((x[i] ?? 0) !== (y[i] ?? 0)) return (x[i] ?? 0) < (y[i] ?? 0)
    ? -1 : 1;\n\t}\n\treturn 0;\n}\n\nconst TESTS = {\n\t\">=\": (c) => c >= 0,\n\t\">\":
    (c) => c > 0,\n\t\"<=\": (c) => c <= 0,\n\t\"<\": (c) => c < 0,\n\t\"=\": (c)
    => c === 0,\n};\n\n// GitHub's form: \">= 2.46.0, < 2.46.1\", \"< 1.123.89\",
    \"= 2.0.0\". One part it cannot\n// read throws: an unreadable range must not
    read as \"not affected\".\nexport function inRange(version, range) {\n\treturn
    range.split(\",\").every((part) => {\n\t\tconst m = part.trim().match(/^(>=|<=|>|<|=)\\s*(\\d+(?:\\.\\d+){0,2}\\S*)$/);\n\t\tif
    (!m) throw new Error(`unreadable range: ${range}`);\n\t\treturn TESTS[m[1]](compare(version,
    m[2]));\n\t});\n}\n\n// GitHub lists one entry per maintained line, and the ranges
    overlap: an advisory fixed in\n// 2.46.1 also says \"< 3.0.1\". Read literally
    that reports every 2.x as affected (it did, 60\n// advisories on 2.46.4, seen
    on the cluster 2026-11-03). So the fixes decide: a fix in this\n// minor line
    decides alone; else a fix at or below this version in the same major means\n//
    the fix is in; else any newer fix means this version predates them all. Only an\n//
    advisory that names no fix at all falls back to its range.\nexport function isAffected(version,
    vulns) {\n\tconst fixed = [];\n\tfor (const v of vulns) {\n\t\tif (!v.vulnerable_version_range
    && !v.patched_versions) throw new Error(\"states no version range\");\n\t\t//
    Free text upstream. Forms in the real list: \">= 2.46.1\", \"1.123.80\", \"2.10.1,
    2.9.3\",\n\t\t// and a bound written in the wrong field (\"< 1.122.0\"), which
    is the range's end.\n\t\tif (/^\\s*</.test(v.patched_versions ?? \"\")) {\n\t\t\tv.vulnerable_version_range
    = [v.vulnerable_version_range, v.patched_versions].filter(Boolean).join(\", \");\n\t\t\tcontinue;\n\t\t}\n\t\tfor
    (const part of (v.patched_versions ?? \"\").split(\",\")) {\n\t\t\tconst m = part.trim().match(/^(?:>=\\s*)?(\\d+\\.\\d+\\.\\d+\\S*)$/);\n\t\t\tif
    (m) fixed.push(m[1]);\n\t\t}\n\t}\n\tif (fixed.length === 0) {\n\t\tconst ranges
    = vulns.filter((v) => v.vulnerable_version_range);\n\t\tif (ranges.length ===
    0) throw new Error(`unreadable fix: ${vulns[0].patched_versions}`);\n\t\treturn
    ranges.some((v) => inRange(version, v.vulnerable_version_range));\n\t}\n\tconst
    [major, minor] = parse(version);\n\tconst line = fixed.filter((f) => parse(f)[0]
    === major && parse(f)[1] === minor);\n\tif (line.length > 0) return line.every((f)
    => compare(version, f) < 0);\n\tif (fixed.some((f) => parse(f)[0] === major &&
    compare(f, version) <= 0)) return false;\n\treturn fixed.some((f) => compare(f,
    version) > 0);\n}\n\nfunction cannotTell(why) {\n\tconsole.log(`CANNOT TELL whether
    this n8n is affected: ${why}`);\n\tprocess.exit(1);\n}\n\nlet version;\ntry {\n\tversion
    = JSON.parse(readFileSync(PACKAGE, \"utf8\")).version;\n} catch (e) {\n\tcannotTell(`no
    version in ${PACKAGE}: ${e.message}`);\n}\nif (!/^\\d+\\.\\d+\\.\\d+/.test(version
    ?? \"\")) cannotTell(`version is '${version}'`);\n\nconst affected = [];\nlet
    read = 0;\nlet next = `${API}?per_page=100`;\nfor (let page = 1; next; page +=
    1) {\n\tif (page > MAX_PAGES) cannotTell(`more than ${MAX_PAGES} pages of advisories`);\n\tlet
    answer;\n\ttry {\n\t\tanswer = await fetch(next, {\n\t\t\theaders: { Accept: \"application/vnd.github+json\",
    \"User-Agent\": \"n8n-advisory-watch\" },\n\t\t\tsignal: AbortSignal.timeout(30_000),\n\t\t});\n\t}
    catch (e) {\n\t\tcannotTell(`GitHub did not answer: ${e.message}`);\n\t}\n\tif
    (answer.status !== 200) cannotTell(`GitHub answered HTTP ${answer.status}`);\n\tlet
    list;\n\ttry {\n\t\tlist = await answer.json();\n\t} catch {\n\t\tcannotTell(\"GitHub's
    answer is not JSON\");\n\t}\n\tif (!Array.isArray(list)) cannotTell(\"GitHub's
    answer is not a list\");\n\tnext = (answer.headers.get(\"link\") ?? \"\").match(/<([^>]+)>;\\s*rel=\"next\"/)?.[1];\n\tfor
    (const item of list) {\n\t\tread += 1;\n\t\tif (ACCEPTED.has(item.ghsa_id)) continue;\n\t\ttry
    {\n\t\t\tif ((item.vulnerabilities ?? []).length === 0) throw new Error(\"states
    no version range\");\n\t\t\tif (isAffected(version, item.vulnerabilities)) affected.push(item);\n\t\t}
    catch (e) {\n\t\t\tcannotTell(`${item.ghsa_id}: ${e.message}`);\n\t\t}\n\t}\n}\nif
    (read === 0) cannotTell(\"the advisory list is empty\");\n\nif (affected.length
    === 0) {\n\tconsole.log(`n8n ${version}: inside none of ${read} published advisories`);\n\tprocess.exit(0);\n}\nconsole.log(`n8n
    ${version} IS AFFECTED by ${affected.length} advisories. Move the pin (docs/n8n/00-plan.md
    §9):`);\nfor (const item of affected) console.log(`  ${item.severity} ${item.ghsa_id}
    ${item.summary} ${item.html_url ?? \"\"}`);\nprocess.exit(1);\n"
kind: ConfigMap
metadata:
  name: n8n-advisory-watch-fg9b5bc8tk
  namespace: n8n
---
apiVersion: v1
data:
  AUTHENTIK_HOST: auth.psizone.ro
  N8N_HOOKS_HOST: n8n-hooks.psizone.ro
  N8N_HOST: n8n.psizone.ro
  N8N_WEBHOOK_URL: https://n8n-hooks.psizone.ro/
kind: ConfigMap
metadata:
  name: n8n-host
  namespace: n8n
---
apiVersion: v1
data:
  mapping.json: "{\n\t\"_doc\": \"Authentik group → access to THIS n8n. Read apps/n8n-sso/CLAUDE.md.
    `access`: being in one of these is what an account here means; a person in none
    is removed by the reconcile, their work moved to the owner. Every group must also
    pass the `n8n` gate (gitops/platform/authentik/blueprints-providers.yaml), and
    .github/scripts/tests/n8n-sso_test.sh compares the lists. `projects`: group (Authentik
    pk or name) → n8n project, with an optional per-project node policy. Empty on
    purpose: on the Community Edition n8n refuses both calls by licence (docs/n8n/01-identity.md).
    A declaration here starts working, with nothing else to change, the moment the
    instance holds a licence that covers it. Per-group node limits on the Community
    Edition come from one n8n instance per group: gitops/services/n8n-instances/instances.json.\",\n\t\"version\":
    1,\n\t\"access\": [\"app-n8n-admin\"],\n\t\"neverRemove\": [],\n\t\"maxRemovalsPerRun\":
    5,\n\t\"nodePolicies\": {\n\t\t\"restricted\": {\n\t\t\t\"defaultAction\": \"allow\",\n\t\t\t\"deny\":
    [\"n8n-nodes-base.executeCommand\", \"n8n-nodes-base.readWriteFile\"]\n\t\t}\n\t},\n\t\"projects\":
    []\n}\n"
kind: ConfigMap
metadata:
  name: n8n-sso-mapping
  namespace: n8n
---
