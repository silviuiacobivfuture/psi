    alerts.psizone.ro/owner: platform-infra
  name: headscale-db-copy
  namespace: headscale
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: headscale-db-copy
        spec:
          automountServiceAccountToken: false
          containers:
          - command:
            - /bin/sh
            - /scripts/upload.sh
            env:
            - name: HOME
