  selector:
    matchLabels:
      app.kubernetes.io/name: plunk
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plunk
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - node
        - /app/plunk-sso/bin/send-gate.mjs
        env:
