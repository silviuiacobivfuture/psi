data:
  mapping.json: "{\n\t\"_doc\": \"PSI's Authentik group → Plunk access (the SEB default,
    apps/plunk-sso/mapping.json, names the first estate's service account). Authentik
    group → Plunk access. THE source of truth for who may use Plunk and with which
    role, re-synced on every sign-in (lib/access.mjs). `managed` = every project in
    projects.json except the robots'. Roles are Plunk's own: ADMIN (domains, settings,
    members' view) or MEMBER (templates, campaigns, contacts). OWNER is never mappable:
    it is the service account's, which owns every project so no person can delete
    one. A person in several groups gets the HIGHEST role per project. Every group
    named here must also be bound at the Plunk gate (gitops/platform/authentik/blueprints-providers.yaml,
    application `plunk`) — a mapped group the gate refuses is a role nobody can use;
    doctor.sh compares the two lists.\",\n\t\"version\": 1,\n\t\"serviceAccount\":
    \"svc-plunk@psizone.ro\",\n\t\"grants\": [\n\t\t{\n\t\t\t\"group\": \"app-plunk-admin\",\n\t\t\t\"projects\":
    \"managed\",\n\t\t\t\"role\": \"ADMIN\"\n\t\t},\n\t\t{\n\t\t\t\"group\": \"app-plunk-user\",\n\t\t\t\"projects\":
    \"managed\",\n\t\t\t\"role\": \"MEMBER\"\n\t\t},\n\t\t{\n\t\t\t\"group\": \"platform-admins\",\n\t\t\t\"projects\":
    \"managed\",\n\t\t\t\"role\": \"ADMIN\"\n\t\t},\n\t\t{\n\t\t\t\"group\": \"app-plunk-e2e\",\n\t\t\t\"projects\":
