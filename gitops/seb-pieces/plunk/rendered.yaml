apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    seb.platform/piece: plunk
  name: plunk-db
  namespace: plunk
spec:
  backup:
    barmanObjectStore:
      data:
        compression: gzip
      destinationPath: s3://psi-tfstate-dev/cnpg/plunk-db
      endpointURL: https://nbg1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          key: AWS_ACCESS_KEY_ID
          name: plunk-backup-s3
        secretAccessKey:
          key: AWS_SECRET_ACCESS_KEY
          name: plunk-backup-s3
      wal:
        compression: gzip
        maxParallel: 2
    retentionPolicy: 14d
  bootstrap:
    initdb:
      database: plunk
      encoding: UTF8
      localeCType: C
      localeCollate: C
      owner: plunk
      secret:
        name: plunk-db-app
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-system-trixie
  instances: 1
  postgresql:
    parameters:
      effective_cache_size: 384MB
      max_connections: "100"
      shared_buffers: 160MB
      work_mem: 8MB
  primaryUpdateStrategy: unsupervised
  resources:
    limits:
      cpu: "1"
      memory: 768Mi
    requests:
      cpu: 100m
      memory: 256Mi
  smartShutdownTimeout: 10
  storage:
    size: 5Gi
    storageClass: local-path
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  labels:
    seb.platform/piece: plunk
  name: plunk-db-base
  namespace: plunk
spec:
  backupOwnerReference: self
  cluster:
    name: plunk-db
  immediate: true
  schedule: 0 50 2 * * 0
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    seb.platform/piece: plunk
  name: plunk-api-sso
  namespace: plunk
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: |-
      Host(`plunk-api.psizone.ro`) && (

        ((Method(`GET`) || Method(`POST`)) && Path(`/auth/logout`)) ||
        (Method(`POST`) && (Path(`/auth/login`) || Path(`/auth/signup`) || Path(`/auth/verify-email`) ||
          Path(`/auth/request-verification`) || Path(`/auth/request-password-reset`) || Path(`/auth/reset-password`) ||
          Path(`/users/@me/password`) || Path(`/users/@me/projects`) ||
          PathRegexp(`^/users/@me/projects/[^/]+/regenerate-keys$`) || PathRegexp(`^/projects/[^/]+/members$`))) ||
        ((Method(`PATCH`) || Method(`DELETE`)) && PathRegexp(`^/projects/[^/]+/members/[^/]+$`)) ||
        (Method(`DELETE`) && (Path(`/users/@me`) || PathRegexp(`^/users/@me/projects/[^/]+$`))))
    priority: 1000
    services:
    - name: plunk-sso
      port: 8080
  tls:
    secretName: plunk-api-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  labels:
    seb.platform/piece: plunk
  name: plunk-body-limit
  namespace: plunk
spec:
  buffering:
    maxRequestBodyBytes: 12582912
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  labels:
    seb.platform/piece: plunk
  name: plunk-credential-redirect
  namespace: plunk
spec:
  redirectRegex:
    permanent: false
    regex: ^https?://([^/]+)/.*$
    replacement: https://${1}/auth/authentik/
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  labels:
    seb.platform/piece: plunk
  name: plunk-session-check
  namespace: plunk
spec:
  forwardAuth:
    address: http://plunk-sso.plunk.svc.cluster.local:8080/auth/authentik/session/
    trustForwardHeader: false
