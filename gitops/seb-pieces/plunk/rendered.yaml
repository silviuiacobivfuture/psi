              optional: true
        - name: PLUNK_FROM_ADDRESS
          valueFrom:
            secretKeyRef:
              key: EMAIL_FROM
              name: email-sender
              optional: true
        envFrom:
        - secretRef:
            name: plunk-app
        image: registry.psizone.ro/mirror/ghcr.io/useplunk/plunk:0.17.0@sha256:9eb0c3bdfa02ec2a9b2e6144a8807aaed08c8bd8eaec4116efbe25ff4adca912
