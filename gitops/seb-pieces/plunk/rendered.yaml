apiVersion: batch/v1
kind: CronJob
metadata:
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
  labels:
    seb.platform/piece: plunk
  name: plunk-db-dump
  namespace: plunk
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 900
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: plunk-db-dump
        spec:
          automountServiceAccountToken: false
          containers:
          - args:
            - |
              set -eu
              TS=$(date -u +%Y%m%dT%H%M%SZ)
              test -s /work/plunk.sql.gz || { echo "FATAL: dump missing/empty" >&2; exit 1; }
              export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
              export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
              KEY="${PREFIX}/plunk-${TS}.sql.gz"
              aws s3 cp /work/plunk.sql.gz "s3://${BUCKET}/${KEY}" --endpoint-url "$AWS_ENDPOINT_URL"
              echo "DB dump uploaded: s3://${BUCKET}/${KEY}"
              KEEP=20
              aws s3 ls "s3://${BUCKET}/${PREFIX}/" --endpoint-url "$AWS_ENDPOINT_URL" \
                | awk '{print $4}' | grep -E '^plunk-.*\.sql\.gz$' | sort -r | tail -n +$((KEEP + 1)) \
                | while read -r f; do aws s3 rm "s3://${BUCKET}/${PREFIX}/${f}" --endpoint-url "$AWS_ENDPOINT_URL"; done || true
            command:
            - /bin/sh
            - -c
            env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: AWS_ACCESS_KEY_ID
                  name: plunk-backup-s3
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: AWS_SECRET_ACCESS_KEY
                  name: plunk-backup-s3
            - name: AWS_REGION
              value: nbg1
            - name: AWS_ENDPOINT_URL
              value: https://nbg1.your-objectstorage.com
            - name: AWS_S3_ADDRESSING_STYLE
              value: path
            - name: BUCKET
              value: psi-tfstate-dev
            - name: PREFIX
              value: db-dumps/plunk
            - name: HOME
              value: /work
            image: registry.psizone.ro/mirror/docker.io/amazon/aws-cli:2.17.0@sha256:7b7edf789765c22d75e61ad6f307c06950e15357b79ea1749104641ce3a11fec
            name: upload
            resources:
              limits:
                cpu: 250m
                memory: 256Mi
              requests:
                cpu: 50m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
            volumeMounts:
            - mountPath: /work
              name: work
          initContainers:
          - args:
            - |
              set -eu
              pg_dump -h plunk-db-rw -p 5432 -U plunk -d plunk | gzip -c > /work/plunk.sql.gz
              sz=$(wc -c < /work/plunk.sql.gz); [ "$sz" -gt 1000 ] || { echo "FATAL: plunk dump too small ($sz bytes) — connection/auth failed" >&2; exit 1; }
            command:
            - /bin/sh
            - -c
            env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: plunk-db-app
            image: registry.psizone.ro/mirror/docker.io/library/postgres:17-alpine@sha256:e4cb93687b062cd25a0e8f672d85a7708235009d70d31f8a7698d9370092a9c4
            name: dump
            resources:
              limits:
                cpu: "1"
                memory: 512Mi
              requests:
                cpu: 50m
                memory: 64Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
            - mountPath: /work
              name: work
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 70
            runAsNonRoot: true
            runAsUser: 70
            seccompProfile:
              type: RuntimeDefault
          volumes:
          - emptyDir: {}
            name: work
      ttlSecondsAfterFinished: 43200
  schedule: 20 */6 * * *
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
