          periodSeconds: 30
        name: plunk
        ports:
        - containerPort: 80
          name: http
        - containerPort: 587
          name: smtp-submit
        - containerPort: 465
          name: smtps
        readinessProbe:
          httpGet:
            httpHeaders:
            - name: Host
              value: plunk-api.psizone.ro
            path: /health
            port: http
          periodSeconds: 10
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 200m
            memory: 576Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 30
