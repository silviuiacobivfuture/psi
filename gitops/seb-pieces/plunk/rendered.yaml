        - name: DASHBOARD_DOMAIN
          value: plunk.psizone.ro
        - name: LANDING_DOMAIN
          value: plunk.psizone.ro
        - name: WIKI_DOMAIN
          value: plunk.psizone.ro
        - name: SMTP_DOMAIN
          value: plunk-smtp.psizone.ro
        - name: DISABLE_SIGNUPS
          value: "true"
        - name: SHOW_SPONSOR
          value: "false"
        - name: SES_CONFIGURATION_SET
          value: plunk-tracking
        - name: SES_CONFIGURATION_SET_NO_TRACKING
          value: plunk-no-tracking
        - name: MAIL_FROM_SUBDOMAIN
          value: bounce
        - name: AUTO_PROJECT_DISABLE
          value: "true"
        - name: PLUNK_API_KEY
