          valueFrom:
            secretKeyRef:
              key: AWS_SES_REGION
              name: plunk-app
        - name: AWS_SES_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              key: AWS_SES_ACCESS_KEY_ID
              name: plunk-app
        - name: AWS_SES_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: AWS_SES_SECRET_ACCESS_KEY
              name: plunk-app
        - name: PLUNK_SES_CONFIGURED
          valueFrom:
            secretKeyRef:
              key: PLUNK_SES_CONFIGURED
              name: plunk-app
        image: registry.psizone.ro/psi/plunk-sso:0.17.0-a882578@sha256:cec22a0df9954a831a8b846822b87ed2888f92fda8f9940d4790980d92ef3d35
        livenessProbe:
          failureThreshold: 4
          httpGet:
            path: /healthz
            port: send-gate
          periodSeconds: 30
        name: send-gate
        ports:
        - containerPort: 8091
          name: send-gate
        readinessProbe:
          httpGet:
            path: /healthz
            port: send-gate
          periodSeconds: 10
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: send-gate
          periodSeconds: 2
      - env:
        - name: SERVICE
          value: all
        - name: NODE_ENV
          value: production
        - name: USE_HTTPS
          value: "true"
        - name: API_DOMAIN
