    secretKey: NOVU_APPLICATION_ID
  - remoteRef:
      key: apps/estate-watch/env
      property: CRON_WATCH_KEY
    secretKey: CRON_WATCH_KEY
  - remoteRef:
      key: platform/talk/webhook
      property: token
    secretKey: NOTIFY_TOKEN
  refreshInterval: 30s
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: autorizare-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: email-sender
  namespace: autorizare
spec:
  data:
  - remoteRef:
      key: apps/autorizare/plunk
      property: secret_key
    secretKey: secret_key
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    name: email-sender
    template:
      data:
        EMAIL_API_KEY: '{{ .secret_key }}'
        EMAIL_API_URL: http://plunk.plunk.svc.cluster.local
        EMAIL_FROM: noreply@polaris.psizone.ro
        EMAIL_FROM_NAME: Polaris
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull
  namespace: autorizare
spec:
  data:
  - remoteRef:
      key: platform/harbor/pull
      property: username
    secretKey: username
  - remoteRef:
      key: platform/harbor/pull
      property: password
    secretKey: password
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: harbor-pull
    template:
      data:
        .dockerconfigjson: |
          {"auths":{"registry.psizone.ro":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
      type: kubernetes.io/dockerconfigjson
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    gethomepage.dev/description: The estate's sign-in — OpenID provider for every
      application
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Platform
    gethomepage.dev/href: https://sso.psizone.ro/.well-known/openid-configuration
    gethomepage.dev/icon: mdi-account-key
    gethomepage.dev/name: Sign-in (id)
    gethomepage.dev/pod-selector: app=autorizare-hub
    traefik.ingress.kubernetes.io/router.middlewares: autorizare-hub-root-to-front@kubernetescrd
  name: autorizare-hub
  namespace: autorizare
spec:
  ingressClassName: traefik
  rules:
  - host: sso.psizone.ro
    http:
      paths:
      - backend:
          service:
            name: autorizare-svc
            port:
              name: http
        path: /rmx.autorizare.v1.OrgService
        pathType: Prefix
      - backend:
          service:
            name: autorizare-svc
            port:
              name: http
        path: /rmx.autorizare.v1.PersonService
        pathType: Prefix
      - backend:
          service:
            name: autorizare-svc
            port:
              name: http
        path: /rmx.autorizare.v1.CatalogService
        pathType: Prefix
      - backend:
          service:
            name: autorizare-svc
            port:
              name: http
        path: /rmx.autorizare.v1.GrantService
        pathType: Prefix
      - backend:
          service:
            name: autorizare-svc
            port:
              name: http
        path: /rmx.autorizare.v1.ChangelogService
        pathType: Prefix
      - backend:
          service:
            name: autorizare-svc
            port:
              name: http
        path: /rmx.autorizare.v1.NotificationService
        pathType: Prefix
      - backend:
          service:
            name: autorizare-svc
            port:
              name: http
        path: /hub/invitatii/accepta
        pathType: Exact
      - backend:
          service:
            name: autorizare-hub
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - sso.psizone.ro
    secretName: autorizare-hub-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    gethomepage.dev/description: 'Authorization — who may do what: grants, catalog,
      audit'
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Apps
    gethomepage.dev/href: https://access.psizone.ro
    gethomepage.dev/icon: mdi-shield-key
    gethomepage.dev/name: Polaris
    gethomepage.dev/pod-selector: app=autorizare-svc
    gethomepage.dev/weight: "20"
  name: autorizare-svc
  namespace: autorizare
spec:
  ingressClassName: traefik
  rules:
  - host: access.psizone.ro
    http:
      paths:
      - backend:
          service:
            name: autorizare-svc
            port:
              name: http
        path: /v1/auth/oidc/callback
        pathType: Exact
      - backend:
          service:
            name: autorizare-svc
            port:
              name: http
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - access.psizone.ro
    secretName: autorizare-svc-tls
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: autorizare-db
  namespace: autorizare
spec:
  backup:
    barmanObjectStore:
      data:
        compression: gzip
      destinationPath: s3://psi-tfstate-dev/cnpg/autorizare-db
      endpointURL: https://nbg1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          key: AWS_ACCESS_KEY_ID
          name: autorizare-backup-s3
        secretAccessKey:
          key: AWS_SECRET_ACCESS_KEY
          name: autorizare-backup-s3
      wal:
        compression: gzip
        maxParallel: 2
    retentionPolicy: 30d
  bootstrap:
    initdb:
      database: autorizare
      icuLocale: ro-RO
      localeCType: C.UTF-8
      localeCollate: C.UTF-8
      localeProvider: icu
      owner: autorizare
      secret:
        name: autorizare-db-app
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  instances: 1
  managed:
    roles:
    - bypassrls: false
      comment: application role; owns no schema
      connectionLimit: -1
      createdb: false
      createrole: false
      ensure: present
      inherit: true
      login: true
      name: autorizare_app
      passwordSecret:
        name: autorizare-app-credentials
      superuser: false
  postgresql:
    parameters:
      jit: "off"
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 192Mi
  smartShutdownTimeout: 10
  storage:
    size: 10Gi
    storageClass: hcloud-volumes
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: autorizare-db-base
  namespace: autorizare
spec:
  backupOwnerReference: self
  cluster:
    name: autorizare-db
  immediate: true
  schedule: 0 10 4 * * 0
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hub-root-to-front
  namespace: autorizare
spec:
  redirectRegex:
    permanent: false
    regex: ^https?://[^./]+\.([^/]+)/?$
    replacement: https://${1}/
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: signout-unconfirmed
  namespace: autorizare
spec:
  errors:
    query: /hub/sign-out-unconfirmed
    service:
      name: autorizare-hub
      port: 80
    status:
    - 502-504
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: signout-unfinished
  namespace: autorizare
spec:
  errors:
    query: /hub/sign-out-unfinished
    service:
      name: autorizare-hub
      port: 80
    status:
    - 502-504
