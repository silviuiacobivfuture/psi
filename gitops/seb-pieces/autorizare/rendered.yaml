apiVersion: v1
kind: ResourceQuota
metadata:
  name: autorizare
  namespace: autorizare
spec:
  hard:
    limits.cpu: "8"
    limits.memory: 5Gi
    persistentvolumeclaims: "4"
    requests.cpu: "2"
    requests.memory: 2Gi
---
apiVersion: v1
data:
  APP_URL: https://access.psizone.ro
  AUTHENTIK_API_URL: https://auth.psizone.ro
  AUTHENTIK_MACHINE_CREDENTIAL_POLICY: psi-business-machine-credential-only
  CHANGELOG_URL: http://changelog.changelog.svc.cluster.local
  CONSOLE_IDENTITY: hub
  DIRECTORY_TENANT: psi
  E2E_COLLEAGUE_ROLES: ""
  E2E_COMPANY_RELATION: ""
  E2E_COMPANY_TYPE: ""
  E2E_ROBOT_DOMAIN: psi.invalid
  ENVIRONMENT: dev
  ESTATE_BRAND_DIR: /estate-brand
  ESTATE_DOMAIN: psizone.ro
  ESTATE_ORG_ID: o-psi-not-yet-founded
  HUB_CLIENTS_FILE: /estate/hub/clients.json
  HUB_HOST_PREFIX: sso
  NOTIFY_URL: http://talk-webhook.nextcloud.svc
  NOVU_API_URL: http://novu-api.novu.svc.cluster.local:3000
  NOVU_PUBLIC_API_URL: https://novu-api.psizone.ro
  NOVU_PUBLIC_WS_URL: https://novu-ws.psizone.ro
  OIDC_ISSUER_URL: https://sso.psizone.ro
  OIDC_REDIRECT_URL: https://access.psizone.ro/v1/auth/oidc/callback
  OPENFGA_ADMIN_URL: http://openfga-admin.openfga.svc.cluster.local:8080
  PLATFORM_OBJECT: platform:psi
kind: ConfigMap
metadata:
  name: autorizare-config
  namespace: autorizare
---
apiVersion: v1
data:
  ENVIRONMENT: dev
  ESTATE_NAME: Psi
  HUB_BASE_DOMAIN: psizone.ro
  HUB_CLIENTS_FILE: /estate/hub/clients.json
  HUB_HOST_PREFIX: sso
  HUB_REQUIRE_MFA: "true"
  HUB_UPSTREAM_ISSUER: https://auth.psizone.ro/application/o/autorizare-hub/
  OPENFGA_URL: http://openfga.openfga.svc.cluster.local:8081
  PLATFORM_OBJECT: platform:psi
kind: ConfigMap
metadata:
  name: autorizare-hub-config
  namespace: autorizare
---
apiVersion: v1
data:
  clients.json: "{\n\t\"clients\": [\n\t\t{\n\t\t\t\"client_id\": \"console\",\n\t\t\t\"tenant\":
    \"psi\",\n\t\t\t\"application\": \"autorizare\",\n\t\t\t\"name\": \"Polaris\",\n\t\t\t\"module\":
    \"autorizare\",\n\t\t\t\"kind\": \"confidential\",\n\t\t\t\"redirect_uris\": [\"https://access.{base}/v1/auth/oidc/callback\"],\n\t\t\t\"post_logout_redirect_uris\":
    [\"https://access.{base}/autentificare\"],\n\t\t\t\"frontchannel_logout_uris\":
    [\"https://access.{base}/v1/auth/oidc/frontchannel-logout\"],\n\t\t\t\"delegation\":
    false,\n\t\t\t\"platform\": true,\n\t\t\t\"estate\": {\n\t\t\t\t\"key\": \"polaris\",\n\t\t\t\t\"notifications\":
    true,\n\t\t\t\t\"home\": \"https://access.{base}/\",\n\t\t\t\t\"changelog\": {\n\t\t\t\t\t\"author\":
    \"platform\",\n\t\t\t\t\t\"linked\": false\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t]\n}\n"
kind: ConfigMap
metadata:
  name: estate-hub-registry-gc54bbt8cg
  namespace: autorizare
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: autorizare-hub
  name: autorizare-hub
  namespace: autorizare
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  - name: internal
    port: 8081
    targetPort: internal
  selector:
    app: autorizare-hub
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: autorizare-svc
  name: autorizare-svc
  namespace: autorizare
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: autorizare-svc
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
    reloader.stakater.com/auto: "true"
  labels:
    app: autorizare-hub
  name: autorizare-hub
  namespace: autorizare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autorizare-hub
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: autorizare-hub
    spec:
      containers:
      - command:
        - /autorizare-hub
        envFrom:
        - configMapRef:
            name: autorizare-hub-config
        - secretRef:
            name: autorizare-hub-secrets
        image: registry.psizone.ro/psi/autorizare-svc:REPLACE_ME
        lifecycle:
          preStop:
            sleep:
              seconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 20
        name: autorizare-hub
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: internal
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          limits:
            cpu: 400m
            memory: 192Mi
          requests:
            cpu: 25m
            memory: 48Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /estate/hub
          name: estate-hub-registry
          readOnly: true
      imagePullSecrets:
      - name: harbor-pull
      initContainers:
      - command:
        - sh
        - -c
        - 'for k in DATABASE_URL OPENFGA_URL OPENFGA_TOKEN OPENFGA_STORE_ID HUB_BASE_DOMAIN
          HUB_UPSTREAM_ISSUER HUB_UPSTREAM_CLIENT_ID HUB_UPSTREAM_CLIENT_SECRET HUB_SIGNING_KEK_ID
          HUB_SIGNING_KEK ENVIRONMENT ESTATE_NAME HUB_PERSON_LOOKUP_TOKEN HUB_CLIENTS_FILE
          PLATFORM_OBJECT; do eval "v=\${$k:-}"; [ -n "$v" ] || { echo "MISSING REQUIRED
          SECRET: $k" >&2; exit 1; }; done; echo secrets-ok'
        envFrom:
        - configMapRef:
            name: autorizare-hub-config
        - secretRef:
            name: autorizare-hub-secrets
        image: registry.psizone.ro/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
        name: assert-secrets
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
      - command:
        - /autorizaremigrate
        env:
        - name: DATABASE_MIGRATE_URL
          valueFrom:
            secretKeyRef:
              key: uri
              name: autorizare-db-app
        - name: DB_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: autorizare-app-credentials
        image: registry.psizone.ro/psi/autorizare-svc:REPLACE_ME
        name: migrate
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 40
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: autorizare-hub
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
      - configMap:
          name: estate-hub-registry-gc54bbt8cg
        name: estate-hub-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
    reloader.stakater.com/auto: "true"
  labels:
    app: autorizare-svc
  name: autorizare-svc
  namespace: autorizare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autorizare-svc
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: autorizare-svc
    spec:
      containers:
      - command:
        - /autorizared
        env:
        - name: LISTEN_ADDR
          value: :8080
        - name: WEBHOOK_EGRESS_ALLOWLIST
          value: ""
        envFrom:
        - configMapRef:
            name: autorizare-config
        - secretRef:
            name: autorizare-secrets
        - secretRef:
            name: email-sender
        image: registry.psizone.ro/psi/autorizare-svc:REPLACE_ME
        lifecycle:
          preStop:
            sleep:
              seconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 20
        name: autorizare-svc
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 10
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 36
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        volumeMounts:
        - mountPath: /estate-brand
          name: estate-brand
          readOnly: true
        - mountPath: /estate/hub
          name: estate-hub-registry
          readOnly: true
      imagePullSecrets:
      - name: harbor-pull
      initContainers:
      - command:
        - sh
        - -c
        - '[ -n "${DATABASE_URL:-}" ] || { echo "MISSING REQUIRED SECRET: DATABASE_URL"
          >&2; exit 1; }; [ -n "${DATABASE_MIGRATE_URL:-}" ] || { echo "MISSING REQUIRED
          SECRET: DATABASE_MIGRATE_URL" >&2; exit 1; }; [ -n "${OPENFGA_ADMIN_URL:-}"
          ] || { echo "MISSING REQUIRED SECRET: OPENFGA_ADMIN_URL" >&2; exit 1; };
          [ -n "${OPENFGA_TOKEN:-}" ] || { echo "MISSING REQUIRED SECRET: OPENFGA_TOKEN"
          >&2; exit 1; }; [ -n "${OPENFGA_STORE_ID:-}" ] || { echo "MISSING REQUIRED
          SECRET: OPENFGA_STORE_ID" >&2; exit 1; }; [ -n "${OIDC_ISSUER_URL:-}" ]
          || { echo "MISSING REQUIRED SECRET: OIDC_ISSUER_URL" >&2; exit 1; }; [ -n
          "${OIDC_CLIENT_ID:-}" ] || { echo "MISSING REQUIRED SECRET: OIDC_CLIENT_ID"
          >&2; exit 1; }; [ -n "${OIDC_CLIENT_SECRET:-}" ] || { echo "MISSING REQUIRED
          SECRET: OIDC_CLIENT_SECRET" >&2; exit 1; }; [ -n "${OIDC_REDIRECT_URL:-}"
          ] || { echo "MISSING REQUIRED SECRET: OIDC_REDIRECT_URL" >&2; exit 1; };
          [ -n "${AUTHENTIK_API_URL:-}" ] || { echo "MISSING REQUIRED SECRET: AUTHENTIK_API_URL"
          >&2; exit 1; }; [ -n "${AUTHENTIK_API_TOKEN:-}" ] || { echo "MISSING REQUIRED
          SECRET: AUTHENTIK_API_TOKEN" >&2; exit 1; }; [ -n "${AUTHENTIK_MACHINE_CREDENTIAL_POLICY:-}"
          ] || { echo "MISSING REQUIRED SECRET: AUTHENTIK_MACHINE_CREDENTIAL_POLICY"
          >&2; exit 1; }; [ -n "${ENVIRONMENT:-}" ] || { echo "MISSING REQUIRED SECRET:
          ENVIRONMENT" >&2; exit 1; }; [ -n "${DIRECTORY_TENANT:-}" ] || { echo "MISSING
          REQUIRED SECRET: DIRECTORY_TENANT" >&2; exit 1; }; [ -n "${ESTATE_ORG_ID:-}"
          ] || { echo "MISSING REQUIRED SECRET: ESTATE_ORG_ID" >&2; exit 1; }; [ -n
          "${ESTATE_DOMAIN:-}" ] || { echo "MISSING REQUIRED SECRET: ESTATE_DOMAIN"
          >&2; exit 1; }; [ -n "${PLATFORM_OBJECT:-}" ] || { echo "MISSING REQUIRED
          SECRET: PLATFORM_OBJECT" >&2; exit 1; }; [ -n "${CHANGELOG_URL:-}" ] ||
          { echo "MISSING REQUIRED SECRET: CHANGELOG_URL" >&2; exit 1; }; [ -n "${CHANGELOG_API_KEY:-}"
          ] || { echo "MISSING REQUIRED SECRET: CHANGELOG_API_KEY" >&2; exit 1; };
          [ -n "${APP_URL:-}" ] || { echo "MISSING REQUIRED SECRET: APP_URL" >&2;
          exit 1; }; [ -n "${WEBHOOK_SEALING_KEY_ID:-}" ] || { echo "MISSING REQUIRED
          SECRET: WEBHOOK_SEALING_KEY_ID" >&2; exit 1; }; [ -n "${WEBHOOK_SEALING_KEY:-}"
          ] || { echo "MISSING REQUIRED SECRET: WEBHOOK_SEALING_KEY" >&2; exit 1;
          }; [ -n "${EMAIL_API_URL:-}" ] || { echo "MISSING REQUIRED SECRET: EMAIL_API_URL"
          >&2; exit 1; }; [ -n "${EMAIL_API_KEY:-}" ] || { echo "MISSING REQUIRED
          SECRET: EMAIL_API_KEY" >&2; exit 1; }; [ -n "${EMAIL_FROM:-}" ] || { echo
          "MISSING REQUIRED SECRET: EMAIL_FROM" >&2; exit 1; }; [ -n "${EMAIL_FROM_NAME:-}"
          ] || { echo "MISSING REQUIRED SECRET: EMAIL_FROM_NAME" >&2; exit 1; }; [
          -n "${NOTIFY_URL:-}" ] || { echo "MISSING REQUIRED SECRET: NOTIFY_URL" >&2;
          exit 1; }; [ -n "${NOVU_SECRET_KEY:-}" ] || { echo "MISSING REQUIRED SECRET:
          NOVU_SECRET_KEY" >&2; exit 1; }; [ -n "${CRON_WATCH_KEY:-}" ] || { echo
          "MISSING REQUIRED SECRET: CRON_WATCH_KEY" >&2; exit 1; }; [ -n "${NOVU_APPLICATION_ID:-}"
          ] || { echo "MISSING REQUIRED SECRET: NOVU_APPLICATION_ID" >&2; exit 1;
          }; [ -n "${NOTIFY_TOKEN:-}" ] || { echo "MISSING REQUIRED SECRET: NOTIFY_TOKEN"
          >&2; exit 1; }; echo secrets-ok'
        env:
        - name: DATABASE_MIGRATE_URL
          valueFrom:
            secretKeyRef:
              key: uri
              name: autorizare-db-app
        envFrom:
        - configMapRef:
            name: autorizare-config
        - secretRef:
            name: autorizare-secrets
        - secretRef:
            name: email-sender
        image: registry.psizone.ro/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
        name: assert-secrets
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
      - command:
        - /autorizaremigrate
        env:
        - name: DATABASE_MIGRATE_URL
          valueFrom:
            secretKeyRef:
              key: uri
              name: autorizare-db-app
        - name: DB_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_APP_PASSWORD
              name: autorizare-secrets
        image: registry.psizone.ro/psi/autorizare-svc:REPLACE_ME
        name: migrate
        resources:
          limits:
            cpu: "1"
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      - command:
        - /autorizared
        - release
        envFrom:
        - configMapRef:
            name: autorizare-config
        - secretRef:
            name: autorizare-secrets
        - secretRef:
            name: email-sender
        image: registry.psizone.ro/psi/autorizare-svc:REPLACE_ME
        name: release-model
        resources:
          limits:
            cpu: "1"
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 70
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app: autorizare-svc
        maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
      volumes:
