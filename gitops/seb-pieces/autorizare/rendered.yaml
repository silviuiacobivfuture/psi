  resources:
    limits:
      cpu: "1"
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 192Mi
  smartShutdownTimeout: 10
  storage:
    size: 10Gi
    storageClass: hcloud-volumes
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: autorizare-db-base
  namespace: autorizare
spec:
  backupOwnerReference: self
  cluster:
    name: autorizare-db
  immediate: true
  schedule: 0 10 4 * * 0
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hub-root-to-front
  namespace: autorizare
spec:
  redirectRegex:
    permanent: false
    regex: ^https?://[^./]+\.([^/]+)/?$
    replacement: https://${1}/
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: signout-unconfirmed
  namespace: autorizare
spec:
  errors:
    query: /hub/sign-out-unconfirmed
    service:
      name: autorizare-hub
      port: 80
    status:
    - 502-504
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: signout-unfinished
  namespace: autorizare
spec:
  errors:
    query: /hub/sign-out-unfinished
    service:
      name: autorizare-hub
      port: 80
    status:
    - 502-504
