metadata:
  name: estate-brand-t429td4ddm
  namespace: autorizare
---
apiVersion: v1
data:
  clients.json: "{\n\t\"clients\": [\n\t\t{\n\t\t\t\"client_id\": \"console\",\n\t\t\t\"tenant\":
    \"psi\",\n\t\t\t\"application\": \"autorizare\",\n\t\t\t\"name\": \"Polaris\",\n\t\t\t\"module\":
    \"autorizare\",\n\t\t\t\"kind\": \"confidential\",\n\t\t\t\"redirect_uris\": [\"https://access.{base}/v1/auth/oidc/callback\"],\n\t\t\t\"post_logout_redirect_uris\":
    [\"https://access.{base}/autentificare\"],\n\t\t\t\"frontchannel_logout_uris\":
    [\"https://access.{base}/v1/auth/oidc/frontchannel-logout\"],\n\t\t\t\"delegation\":
    false,\n\t\t\t\"platform\": true,\n\t\t\t\"estate\": {\n\t\t\t\t\"key\": \"polaris\",\n\t\t\t\t\"notifications\":
    true,\n\t\t\t\t\"home\": \"https://access.{base}/\",\n\t\t\t\t\"changelog\": {\n\t\t\t\t\t\"author\":
    \"platform\",\n\t\t\t\t\t\"linked\": false\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\t]\n}\n"
kind: ConfigMap
metadata:
  name: estate-hub-registry-gc54bbt8cg
  namespace: autorizare
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: autorizare-hub
  name: autorizare-hub
  namespace: autorizare
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  - name: internal
    port: 8081
    targetPort: internal
  selector:
    app: autorizare-hub
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: autorizare-svc
  name: autorizare-svc
  namespace: autorizare
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: autorizare-svc
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    alerts.psizone.ro/owner: ops@psizone.ro
    reloader.stakater.com/auto: "true"
  labels:
    app: autorizare-hub
  name: autorizare-hub
  namespace: autorizare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autorizare-hub
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: autorizare-hub
    spec:
      containers:
      - command:
        - /autorizare-hub
        envFrom:
        - configMapRef:
            name: autorizare-hub-config
        - secretRef:
            name: autorizare-hub-secrets
        image: registry.psizone.ro/psi/autorizare-svc:REPLACE_ME
        lifecycle:
          preStop:
            sleep:
              seconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 20
        name: autorizare-hub
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: internal
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          limits:
            cpu: 400m
            memory: 192Mi
          requests:
            cpu: 25m
            memory: 48Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /estate/hub
          name: estate-hub-registry
          readOnly: true
      imagePullSecrets:
      - name: harbor-pull
      initContainers:
      - command:
        - sh
        - -c
        - 'for k in DATABASE_URL OPENFGA_URL OPENFGA_TOKEN OPENFGA_STORE_ID HUB_BASE_DOMAIN
          HUB_UPSTREAM_ISSUER HUB_UPSTREAM_CLIENT_ID HUB_UPSTREAM_CLIENT_SECRET HUB_SIGNING_KEK_ID
          HUB_SIGNING_KEK ENVIRONMENT ESTATE_NAME HUB_PERSON_LOOKUP_TOKEN HUB_CLIENTS_FILE
          PLATFORM_OBJECT; do eval "v=\${$k:-}"; [ -n "$v" ] || { echo "MISSING REQUIRED
          SECRET: $k" >&2; exit 1; }; done; echo secrets-ok'
        envFrom:
        - configMapRef:
            name: autorizare-hub-config
        - secretRef:
            name: autorizare-hub-secrets
