                out.append(finding(
                    f"notice-given-up:{app}:{event}", "fail",
                    f"{app} gave up on notice {event} ({n} in the last day): people were not told, and nothing will try again. {TEXT_FIX}",
                ))
        for gone in set(state) - set(sources):
            del state[gone]
        if json.dumps(state, sort_keys=True) != before:
            save(cfg, kube, state, cannot_tell)
        return out
  velero-run-bounds.json: |
    {
      "_": "When a Velero run stops being healthy. One copy: doctor (lib-velero-run.sh) and estate-watch (backup_watch.py) both read this. Measured on the 21 runs kept on 2026-11-05: the longest healthy run took 1h33m, the longest silence in a run that finished was 56m, and Velero stops waiting on volumes at 4h (4h00m04 on 11-02). RUNBOOK 2026-11-05.",
      "slow_secs": 7200,
      "stall_secs": 5400,
      "overdue_secs": 15300,
      "finished": ["Completed", "PartiallyFailed", "Failed", "FailedValidation", "Deleting"]
    }
