apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/description: Pods may not share the host network/PID/IPC namespaces
      nor mount hostPath volumes — these break the container isolation boundary.
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod, Volume
    policies.kyverno.io/title: Disallow Host Namespaces and hostPath
  name: disallow-host-namespaces-and-hostpath
spec:
  background: true
  failurePolicy: Ignore
  rules:
  - exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kube-public
          - kube-node-lease
          - kyverno
          - argocd
          - arc-systems
          - arc-runners
          - tailscale
          - openbao
          - harbor
          - external-secrets
          - cert-manager
          - external-dns
          - observability
          - monitoring
          - system-upgrade
          - talk-hpb
    match:
      any:
      - resources:
          kinds:
          - Pod
    name: disallow-host-namespaces
    validate:
      message: Sharing the host namespaces (hostNetwork/hostPID/hostIPC) is not allowed.
      pattern:
        spec:
          =(hostIPC): "false"
          =(hostNetwork): "false"
          =(hostPID): "false"
  - exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kube-public
          - kube-node-lease
          - kyverno
          - argocd
          - arc-systems
          - arc-runners
          - tailscale
          - openbao
          - harbor
          - external-secrets
          - cert-manager
          - external-dns
          - observability
          - monitoring
          - system-upgrade
          - velero
    match:
      any:
      - resources:
          kinds:
          - Pod
    name: disallow-hostpath
    validate:
      message: hostPath volumes are not allowed.
      pattern:
        spec:
          =(volumes):
          - X(hostPath): "null"
  validationFailureAction: Enforce
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: Images must use an explicit, non-`latest` tag
      so deployments are reproducible and rollbacks are deterministic.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/title: Disallow Latest Image Tag
  name: disallow-latest-tag
spec:
  background: true
  failurePolicy: Ignore
  rules:
  - exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kube-public
          - kube-node-lease
          - kyverno
          - argocd
          - arc-systems
          - arc-runners
          - tailscale
          - openbao
          - harbor
          - external-secrets
          - cert-manager
          - external-dns
          - observability
    match:
      any:
      - resources:
          kinds:
          - Pod
    name: require-image-tag
    validate:
      message: An explicit image tag is required (untagged images default to :latest).
      pattern:
        spec:
          containers:
          - image: '*:*'
  - exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kube-public
          - kube-node-lease
          - kyverno
          - argocd
          - arc-systems
          - arc-runners
          - tailscale
          - openbao
          - harbor
          - external-secrets
          - cert-manager
          - external-dns
          - observability
    match:
      any:
      - resources:
          kinds:
          - Pod
    name: disallow-latest-tag
    validate:
      message: Using the :latest image tag is not allowed; pin an explicit version.
      pattern:
        spec:
          containers:
          - image: '!*:latest'
  validationFailureAction: Enforce
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/description: Privileged containers and privilege escalation
      are disallowed. Privileged mode is near-host-root; allowPrivilegeEscalation=false
      blocks setuid-style privilege gain.
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/title: Disallow Privileged Containers
  name: disallow-privileged
spec:
  background: true
  failurePolicy: Ignore
  rules:
  - exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kube-public
          - kube-node-lease
          - kyverno
          - argocd
          - arc-systems
          - arc-runners
          - tailscale
          - openbao
          - harbor
          - external-secrets
          - cert-manager
          - external-dns
          - observability
          - monitoring
          - system-upgrade
          - velero
    match:
      any:
      - resources:
          kinds:
          - Pod
    name: disallow-privileged
    validate:
      message: Privileged containers are not allowed (securityContext.privileged must
        be false).
      pattern:
        spec:
          =(ephemeralContainers):
          - =(securityContext):
              =(privileged): "false"
          =(initContainers):
          - =(securityContext):
              =(privileged): "false"
          containers:
          - =(securityContext):
              =(privileged): "false"
  - exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kube-public
          - kube-node-lease
          - kyverno
          - argocd
          - arc-systems
          - arc-runners
          - tailscale
          - openbao
          - harbor
          - external-secrets
          - cert-manager
          - external-dns
          - observability
          - monitoring
          - system-upgrade
          - velero
          - plane
          - reportportal
    match:
      any:
      - resources:
          kinds:
          - Pod
    name: disallow-privilege-escalation
    validate:
      message: allowPrivilegeEscalation must be set to false on every container.
      pattern:
        spec:
          =(ephemeralContainers):
          - securityContext:
              allowPrivilegeEscalation: "false"
          =(initContainers):
          - securityContext:
              allowPrivilegeEscalation: "false"
          containers:
          - securityContext:
              allowPrivilegeEscalation: "false"
  validationFailureAction: Enforce
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Workload Configuration
    policies.kyverno.io/description: The plane-ce chart can only attach a pull secret
      by rendering one from plaintext Helm values. This adds the ESO-managed harbor-pull
      Secret to Plane pods whose image comes from registry.psizone.ro, so the credential
      never enters git.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/title: Harbor pull secret for Plane's own-built images
  name: mutate-plane-harbor-pull
spec:
  rules:
  - match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - plane
          operations:
          - CREATE
    mutate:
      patchStrategicMerge:
        spec:
          imagePullSecrets:
          - name: harbor-pull
    name: add-harbor-pull
    preconditions:
      any:
      - key: '{{ request.object.spec.containers[].image }}'
        operator: AnyIn
        value:
        - registry.psizone.ro/*
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/description: The plane-ce chart renders its api-migrate Job
      with no resources block and exposes no values key to add one, so require-requests-limits
      (ENFORCE, via its autogenerated Job rule) rejects it and Plane never gets a
      database schema. This mutates the Job to carry explicit requests+limits so the
      security policy can stay ENFORCE for every other workload.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Job
    policies.kyverno.io/title: Inject resources on Plane's migrator Job
  name: mutate-plane-migrator-resources
spec:
  rules:
  - match:
      any:
      - resources:
          kinds:
          - Job
          names:
          - plane-api-migrate-*
          namespaces:
          - plane
    mutate:
      foreach:
      - list: request.object.spec.template.spec.containers
        patchStrategicMerge:
          spec:
            template:
              spec:
                containers:
                - name: '{{ element.name }}'
                  resources:
                    limits:
                      cpu: "1"
                      memory: 1Gi
                    requests:
                      cpu: 100m
                      memory: 256Mi
    name: add-migrator-resources
    preconditions:
      all:
      - key: '{{ request.object.spec.template.spec.containers[0].resources.requests.cpu
          || '''' }}'
        operator: Equals
        value: ""
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Workload Configuration
    policies.kyverno.io/description: kubelet's legacy service-link variables collide
      with the env var names Plane's frontend reads (PLANE_ADMIN_PORT), making it
      build god-mode URLs against the in-cluster Service port 3000. The chart exposes
      no way to set env or enableServiceLinks, so this mutates the Deployments to
      turn the injection off.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment
    policies.kyverno.io/title: Disable service-link env injection for Plane
  name: mutate-plane-service-links
spec:
  rules:
  - match:
      any:
      - resources:
          kinds:
          - Deployment
          namespaces:
          - plane
    mutate:
      patchStrategicMerge:
        spec:
          template:
            spec:
              enableServiceLinks: false
    name: disable-service-links
    preconditions:
      all:
      - key: '{{ request.object.metadata.name }}'
        operator: AnyIn
        value:
        - plane-web-wl
        - plane-admin-wl
        - plane-space-wl
        - plane-api-wl
        - plane-worker-wl
        - plane-beat-worker-wl
        - plane-live-wl
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Operations
    policies.kyverno.io/description: The reportportal chart renders every workload
      with empty metadata.annotations and exposes only podAnnotations, which neither
      Stakater Reloader nor require-alert-annotation reads. This injects the two annotations
      on the workload's own metadata so both cluster-wide policies can stay ENFORCE,
      and backfills the pod securityContext on the chart's pre-upgrade hook Job, which
      is the one workload the chart's securityContext helper is not applied to.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment, StatefulSet, Job
    policies.kyverno.io/title: Inject Reloader + alert-owner annotations on ReportPortal
      workloads
  name: mutate-reportportal-annotations
spec:
  rules:
  - match:
      any:
      - resources:
          kinds:
          - Deployment
          - StatefulSet
          namespaces:
          - reportportal
    mutate:
      patchStrategicMerge:
        metadata:
          annotations:
            alerts.psizone.ro/owner: ops@psizone.ro
            reloader.stakater.com/auto: "true"
    name: add-workload-annotations
    preconditions:
      all:
      - key: '{{ request.object.metadata.annotations."reloader.stakater.com/auto"
          || '''' }}'
        operator: Equals
        value: ""
      - key: '{{ request.object.metadata.annotations."alerts.psizone.ro/owner" ||
          '''' }}'
        operator: Equals
        value: ""
  - match:
      any:
      - resources:
          kinds:
          - Job
          names:
          - '*-pre-upgrade-cleanup'
          namespaces:
          - reportportal
    mutate:
      patchStrategicMerge:
        spec:
          template:
            spec:
              securityContext:
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
                seccompProfile:
                  type: RuntimeDefault
    name: add-preupgrade-hook-security-context
    preconditions:
      all:
      - key: '{{ request.object.spec.template.spec.securityContext.runAsNonRoot ||
          '''' }}'
        operator: Equals
        value: ""
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Observability / Alerting
    policies.kyverno.io/description: Long-running (Deployment/StatefulSet) and scheduled
      (CronJob) workloads must carry the alerts.psizone.ro/owner annotation declaring
      their alert route, so a failure has a named owner alongside the external Axiom
      failure monitors.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment, StatefulSet, CronJob
    policies.kyverno.io/title: Require alert-owner annotation
  name: require-alert-annotation
spec:
  background: true
  failurePolicy: Ignore
  rules:
  - exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kube-public
          - kube-node-lease
          - kyverno
          - argocd
          - arc-systems
          - arc-runners
          - tailscale
          - openbao
          - harbor
          - external-secrets
          - cert-manager
          - external-dns
          - observability
          - monitoring
          - system-upgrade
          - velero
    match:
      any:
      - resources:
          kinds:
          - Deployment
          - StatefulSet
          - CronJob
    name: require-alert-owner
    validate:
      message: Workload must set the alerts.psizone.ro/owner annotation (a non-empty
        alert route, e.g. an email or team handle) so failures have a declared owner.
      pattern:
        metadata:
          annotations:
            alerts.psizone.ro/owner: ?*
  validationFailureAction: Audit
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Operability / Discoverability
    policies.kyverno.io/description: Every Ingress must carry the gethomepage.dev
      discovery annotations, so the service it exposes appears on the platform hub.
      A deployed service missing from the hub is one nobody knows to check, renew
      a certificate for, or look at first during an incident.
    policies.kyverno.io/severity: low
    policies.kyverno.io/subject: Ingress
    policies.kyverno.io/title: Require hub (gethomepage) annotations
  name: require-hub-annotation
spec:
  background: true
  failurePolicy: Ignore
  rules:
  - exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kube-public
          - kube-node-lease
          - kyverno
          - argocd
          - arc-systems
          - arc-runners
          - tailscale
          - openbao
          - harbor
          - external-secrets
          - cert-manager
          - external-dns
          - observability
          - monitoring
          - system-upgrade
          - velero
    match:
      any:
      - resources:
          kinds:
          - Ingress
    name: require-hub-discovery
    validate:
      message: 'Ingress must set the gethomepage.dev discovery annotations (enabled,
        name, description, group, icon) so the service appears on the platform hub.
        `group` must be one of the groups declared in the hub layout — Apps, Everyday
        tools, Delivery, Services, Messaging, Platform, Observability — because Homepage
        does not merge a near-miss: an undeclared group renders as an extra, unstyled
        section rather than joining the one that was meant.'
      pattern:
        metadata:
          annotations:
            gethomepage.dev/description: ?*
            gethomepage.dev/enabled: "true"
            gethomepage.dev/group: Apps|Everyday tools|Delivery|Services|Messaging|Platform|Observability
            gethomepage.dev/icon: ?*
            gethomepage.dev/name: ?*
  validationFailureAction: Audit
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Secrets / Rotation
    policies.kyverno.io/description: Workloads that inject a Secret as environment
      variables (envFrom[].secretRef or env[].valueFrom.secretKeyRef) read those values
      once at startup, so a rotated secret never takes effect without a restart. They
      must carry the reloader.stakater.com/auto annotation so Stakater Reloader rolls
      them when the Secret changes — or set it to "false" to declare the opt-out in
      git. Volume-mounted Secret consumers are refreshed in place by the kubelet and
      do not match.
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Deployment, StatefulSet, DaemonSet
    policies.kyverno.io/title: Require Reloader annotation on env-injected Secret
      consumers
  name: require-reloader-annotation
spec:
  background: true
  failurePolicy: Ignore
  rules:
  - exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kube-public
          - kube-node-lease
          - argocd
          - harbor
    match:
      any:
      - resources:
          kinds:
          - Deployment
          - StatefulSet
          - DaemonSet
    name: require-reloader-auto-on-env-secret-consumers
    preconditions:
      any:
      - key: '{{ request.object.spec.template.spec.[containers, initContainers][].envFrom[?secretRef][]
          | length(@) }}'
        operator: GreaterThan
        value: 0
      - key: '{{ request.object.spec.template.spec.[containers, initContainers][].env[?valueFrom.secretKeyRef][]
          | length(@) }}'
        operator: GreaterThan
        value: 0
    validate:
      message: 'This workload injects a Secret as environment variables, which are
        read only at process start — a rotated secret would silently never take effect.
        Set the annotation reloader.stakater.com/auto: "true" on the workload''s own
        metadata.annotations (NOT the pod template) so Stakater Reloader restarts
        it when the Secret changes. If it genuinely must not auto-restart, set it
        to "false" with a comment — that declares the exception in git. Volume-mounted
        Secrets need neither (the kubelet refreshes them in place). See gitops/services/APP-SECRETS.md.'
      pattern:
        metadata:
          annotations:
            reloader.stakater.com/auto: ?*
  validationFailureAction: Audit
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/description: Every container must declare CPU & memory requests
      and limits so the scheduler can place it and one workload cannot starve the
      node.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/title: Require Resource Requests and Limits
  name: require-requests-limits
spec:
  background: true
  failurePolicy: Ignore
  rules:
  - exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kube-public
          - kube-node-lease
          - kyverno
          - argocd
          - arc-systems
          - arc-runners
          - tailscale
          - openbao
          - harbor
          - external-secrets
          - cert-manager
          - external-dns
          - observability
          - monitoring
          - system-upgrade
          - velero
    match:
      any:
      - resources:
          kinds:
          - Pod
    name: require-requests-limits
    validate:
      message: CPU and memory requests and limits are required on every container.
      pattern:
        spec:
          containers:
          - resources:
              limits:
                cpu: ?*
                memory: ?*
              requests:
                cpu: ?*
                memory: ?*
  validationFailureAction: Enforce
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/description: Containers must run as a non-root user (runAsNonRoot=true),
      set at the pod or container securityContext level.
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/title: Require runAsNonRoot
  name: require-run-as-non-root
spec:
  background: true
  failurePolicy: Ignore
  rules:
  - exclude:
      any:
      - resources:
          namespaces:
          - kube-system
          - kube-public
          - kube-node-lease
          - kyverno
          - argocd
          - arc-systems
          - arc-runners
          - tailscale
          - openbao
          - harbor
          - external-secrets
          - cert-manager
          - external-dns
          - observability
          - monitoring
          - system-upgrade
          - velero
          - nextcloud
          - plane
    match:
      any:
      - resources:
          kinds:
          - Pod
    name: run-as-non-root
    validate:
      anyPattern:
      - spec:
          securityContext:
            runAsNonRoot: "true"
      - spec:
          containers:
          - securityContext:
              runAsNonRoot: "true"
      message: runAsNonRoot must be true at the pod or container securityContext level.
  validationFailureAction: Enforce
