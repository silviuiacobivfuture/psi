# The estate's gates on every push to an environment branch and every pull request: the locked
# SEB bundle first, then a frozen install, Biome, and lint/type-check/test/build for what the
# change affects (Nx), one project at a time.
name: estate-gates

on:
  push:
    branches: [dev]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: estate-gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write # the GitHub OIDC token OpenBao verifies (bundle pull)

jobs:
  gates:
    runs-on: k8s
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/seb-bundle
        with:
          openbao-addr: ${{ vars.OPENBAO_ADDR }}
          openbao-mount: ${{ vars.OPENBAO_JWT_MOUNT }}
          openbao-audience: ${{ vars.OPENBAO_AUDIENCE }}
          openbao-role: ${{ vars.OPENBAO_ROLE_GATE }}
          pull-secret: ${{ vars.REGISTRY_PULL_SECRET }}
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Biome
        run: pnpm lint
      # apps/clinic's browser suites (contrast, viewports, reduced motion) need a real Chromium and never skip:
      # Playwright's own build, installed once into the runner's browser cache (the install is a no-op when it is
      # already there), and its path handed to the suites as CLINIC_CHROME (apps/clinic/src/test/browser.ts).
      - name: Chromium for the browser suites
        working-directory: apps/clinic
        run: |
          set -euo pipefail
          pnpm exec playwright-core install chromium
          chrome="$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')"
          [ -x "$chrome" ] || { echo "::error::Chromium is not at $chrome after the install"; exit 1; }
          echo "CLINIC_CHROME=$chrome" >> "$GITHUB_ENV"
      - name: Affected projects
        env:
          NX_DAEMON: "false"
          # Tests never spend money or reach a provider: no key in the environment (a blank key counts as unset),
          # and the suites that build a model client only ever talk to the in-process fake.
          OPENROUTER_API_KEY: ""
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$BEFORE"
          else
            base="origin/$BASE"
          fi
          pnpm exec nx affected -t lint,type-check,test,build --base="$base" --parallel=1
