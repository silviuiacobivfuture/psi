# Sigma's own icons (generated by @seb/ui scripts/brand-assets.mjs, ESTATE_APP_DIRS sigma=brand/sigma),
# as the ConfigMap the register's interface copies over psi's brand (SEB slot register-web/icons; its
# name is <REGISTER_WEB>-icons). Everything in this one directory, because a kustomization reads files
# only at or below itself.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
configMapGenerator:
  - name: psi-register-web-icons
    files:
      - favicon.svg=public/estate/favicon.svg
      - favicon-32.png=public/estate/favicon-32.png
      - apple-touch-icon.png=public/estate/apple-touch-icon.png
      - icon-192.png=public/estate/icon-192.png
      - icon-512.png=public/estate/icon-512.png
      - icon-maskable-512.png=public/estate/icon-maskable-512.png
      - og.png=public/estate/og.png
