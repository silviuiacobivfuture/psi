# Agent collector — one pod PER NODE. Collects:
#   - node/process logs  : journald (/var/log/journal) → <estate>-<env>-node
#   - container/pod logs : /var/log/pods → <estate>-<env>-containers
#   - network/ingress    : kube-system pod logs (Traefik/CoreDNS) routed → <estate>-<env>-network
# Config comes from the `otel-agent` ConfigMap (generated per env in the overlay).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-agent
  labels: { app: otel-agent }
  annotations:
    # Reloader: roll on axiom-token rotation (OpenBao -> ESO -> Secret -> roll),
    # same opt-in chain as the app Deployments (gitops/apps/overlays/dev/reloader.yaml).
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels: { app: otel-agent }
  template:
    metadata:
      labels: { app: otel-agent }
    spec:
      serviceAccountName: otel-collector
      imagePullSecrets:
        - name: harbor-pull
      # Read host log paths + journald; run on every node incl. control-plane.
      securityContext:
        runAsUser: 0
      tolerations:
        - effect: NoSchedule
          operator: Exists
      containers:
        - name: otel-collector
          # Custom image = collector-contrib + journalctl (journald receiver needs it).
          image: WLREGISTRY/WLAPPS/otel-collector-journald:0.111.0
          args: ["--config=/conf/agent-config.yaml"]
          env:
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
            - name: AXIOM_TOKEN
              valueFrom:
                secretKeyRef: { name: axiom-token, key: AXIOM_TOKEN }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /conf }
            - { name: varlogpods, mountPath: /var/log/pods, readOnly: true }
            - { name: varlibdockercontainers, mountPath: /var/lib/docker/containers, readOnly: true }
            - { name: journal, mountPath: /var/log/journal, readOnly: true }
            - { name: machineid, mountPath: /etc/machine-id, readOnly: true }
            - { name: checkpoints, mountPath: /var/lib/otelcol }
      volumes:
        - { name: config, configMap: { name: otel-agent } }
        - { name: varlogpods, hostPath: { path: /var/log/pods } }
        - { name: varlibdockercontainers, hostPath: { path: /var/lib/docker/containers } }
        - { name: journal, hostPath: { path: /var/log/journal } }
        - { name: machineid, hostPath: { path: /etc/machine-id } }
        - { name: checkpoints, hostPath: { path: /var/lib/otelcol, type: DirectoryOrCreate } }
