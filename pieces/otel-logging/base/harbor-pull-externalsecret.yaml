# Harbor pull credential (dockerconfigjson) for the custom otel-collector-journald
# image. Synced from OpenBao platform/harbor/pull. Same pattern as the app services.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: harbor-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"WLREGISTRY":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: platform/harbor/pull, property: username }
    - secretKey: password
      remoteRef: { key: platform/harbor/pull, property: password }
