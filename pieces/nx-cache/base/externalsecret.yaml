# Secrets for the Nx cache server.
#
# Keys are declared INDIVIDUALLY rather than with dataFrom.extract, matching the
# rule in gitops/services/APP-SECRETS.md: an absent property must surface as a
# FAILED ExternalSecret, not as an empty value the app treats as configuration.
# For a cache that distinction matters more than usual — an empty token would
# make the server reject every request, which looks exactly like a cold cache.
#
# USER STEP — none of this syncs until the paths exist in OpenBao:
#   bao kv put secret/platform/nx-cache/token       token=<a long random string>
#   bao kv put secret/platform/nx-cache/objectstore access_key_id=<id> secret_access_key=<key>
# `seed-secrets.sh` generates the token and seeds both paths; see that script.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nx-cache-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: nx-cache-secrets
    creationPolicy: Owner
    template:
      data:
        NX_CACHE_ACCESS_TOKEN: "{{ .token }}"
        NX_CACHE_S3_ACCESS_KEY_ID: "{{ .access_key_id }}"
        NX_CACHE_S3_SECRET_ACCESS_KEY: "{{ .secret_access_key }}"
        # Not secrets, but they belong beside the credentials they are used
        # with: a bucket name that disagrees with the key it is addressed by is
        # a 403 nobody can explain.
        NX_CACHE_S3_ENDPOINT: "WLOBJECTSTORAGEENDPOINT"
        NX_CACHE_S3_BUCKET: "WLBUCKETPREFIX-nx-cache-dev"
        NX_CACHE_S3_PREFIX: "nx/"
  data:
    - secretKey: token
      remoteRef: { key: platform/nx-cache/token, property: token }
    - secretKey: access_key_id
      remoteRef: { key: platform/nx-cache/objectstore, property: access_key_id }
    - secretKey: secret_access_key
      remoteRef: { key: platform/nx-cache/objectstore, property: secret_access_key }
