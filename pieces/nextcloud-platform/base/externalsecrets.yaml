# Nextcloud runtime secrets, synced from OpenBao by ESO. Every value lives ONLY in
# OpenBao (seeded by infrastructure/hetzner/scripts/seed-secrets.sh); these
# manifests hold the mapping, never a value. See gitops/services/APP-SECRETS.md.
#
# Each `data[]` key is declared EXPLICITLY (no bare dataFrom.extract) so a missing
# key makes the ExternalSecret go SecretSyncedError — loud — instead of syncing a
# partial secret that would leave Nextcloud installed with no admin, no storage
# credentials, or an OIDC login that silently 500s.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-admin
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: nextcloud-admin, creationPolicy: Owner }
  data:
    - secretKey: admin-username
      remoteRef: { key: apps/nextcloud/admin, property: username }
    - secretKey: admin-password
      remoteRef: { key: apps/nextcloud/admin, property: password }
---
# S3 primary storage keys. Same Hetzner Object Storage credentials the rest of the
# platform uses (platform/object-storage/<env>); the BUCKET is not here — it is
# non-secret and env-specific, so it lives in the Helm values next to the endpoint.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-s3
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: nextcloud-s3, creationPolicy: Owner }
  data:
    - secretKey: access-key
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: secret-key
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
---
# The Postgres application role. CNPG CONSUMES this secret (bootstrap.initdb.secret)
# rather than generating its own — so the credential's source of truth is OpenBao and
# survives a cluster rebuild. If CNPG minted it, a rebuild would generate a NEW
# password while a database restored from backup still held the OLD one, and
# Nextcloud would come up unable to authenticate against its own restored data.
# CNPG requires type kubernetes.io/basic-auth with exactly username/password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-db-app
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: nextcloud-db-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef: { key: apps/nextcloud/db, property: username }
    - secretKey: password
      remoteRef: { key: apps/nextcloud/db, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-redis
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: nextcloud-redis, creationPolicy: Owner }
  data:
    - secretKey: redis-password
      remoteRef: { key: apps/nextcloud/redis, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: collabora-admin
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: collabora-admin, creationPolicy: Owner }
  data:
    - secretKey: username
      remoteRef: { key: apps/nextcloud/collabora, property: username }
    - secretKey: password
      remoteRef: { key: apps/nextcloud/collabora, property: password }
---
# OIDC client credentials — read from the SAME OpenBao path the Authentik providers
# blueprint reads (platform/authentik/nextcloud-oidc). One source of truth for both
# ends of the handshake: Authentik gets them via the authentik-oidc-clients secret
# (AUTHENTIK_OIDC__NEXTCLOUD__ID/__SECRET), Nextcloud via this one. If they ever
# diverged the login would fail with an opaque invalid_client.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-oidc
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: nextcloud-oidc, creationPolicy: Owner }
  data:
    - secretKey: client-id
      remoteRef: { key: platform/authentik/nextcloud-oidc, property: client_id }
    - secretKey: client-secret
      remoteRef: { key: platform/authentik/nextcloud-oidc, property: client_secret }
---
# Talk's shared secrets, mirrored into THIS namespace so the occ reconcile CronJob
# can register the signaling server and TURN server with the exact same values the
# talk-hpb pod boots with. Same OpenBao path, two consumers in two namespaces (ESO
# cannot copy a Secret across namespaces).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talk-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: talk-secrets, creationPolicy: Owner }
  data:
    - secretKey: signaling-secret
      remoteRef: { key: apps/talk-hpb/secrets, property: signaling_secret }
    - secretKey: turn-secret
      remoteRef: { key: apps/talk-hpb/secrets, property: turn_secret }
---
# CNPG's WAL-archive credentials (barman → Hetzner Object Storage). Deliberately a
# SEPARATE secret from nextcloud-s3 with the AWS_* key names barman expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: nextcloud-backup-s3, creationPolicy: Owner }
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
---
# The Talk notification bot's shared secret — ONE bot, six conversations
# (infra/devops/gitops/security/tasks/tests). Read by the occ reconcile CronJob,
# which CREATES the bot with exactly this value (`occ talk:bot:create --secret`),
# and by anything in this namespace that posts a message: the Talk bot API signs
# every request HMAC-SHA256(random ++ message) with it.
#
# Seeded (generated, 64 chars) by infrastructure/hetzner/scripts/seed-secrets.sh at
# secret/platform/talk/bot. Declared per-key like every other secret here, so an
# unseeded OpenBao makes this ExternalSecret go SecretSyncedError — LOUD — instead
# of handing the reconcile job an empty secret, which `talk:bot:create` would
# reject at the 40-char minimum with a message nobody is watching for.
#
# NOT rotatable by a re-seed alone: Talk keeps its own copy in the database and the
# reconcile job never resets an existing bot. See the RUNBOOK entry for the
# uninstall-then-reconcile procedure.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-api
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: plane-api, creationPolicy: Owner }
  # Read-only Plane API token. talk-webhook resolves the UUIDs Plane puts in its
  # webhooks (state ids, issue ids) into human names and builds a link to the work
  # item. OPTIONAL by design: if this secret is absent the notifier still posts, it
  # just cannot resolve names — so a missing token degrades the message rather than
  # dropping the notification.
  data:
    - secretKey: token
      remoteRef: { key: platform/plane/api, property: token }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talk-webhook-token
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: talk-webhook-token, creationPolicy: Owner }
  # The shared bearer that gates talk-webhook. Explicit data[] (not dataFrom) so a
  # missing key is a LOUD SecretSyncedError instead of an empty env var that would
  # make the service reject every notification with 401 — silently, since a dropped
  # alert has no symptom of its own.
  data:
    - secretKey: token
      remoteRef: { key: platform/talk/webhook, property: token }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talk-bot
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: talk-bot, creationPolicy: Owner }
  data:
    - secretKey: secret
      remoteRef: { key: platform/talk/bot, property: secret }
