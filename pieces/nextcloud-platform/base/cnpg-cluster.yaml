# Nextcloud's Postgres — a CloudNativePG Cluster, the first one on this platform
# (PLATFORM.md named CNPG the standard; the operator itself lands via the `cnpg`
# Argo app).
#
# DURABILITY — the important part, because this runs on local-path:
# local-path PVCs are node-pinned and non-resizable (Track A of
# DURABILITY-HA-PLAN.md is not applied yet, so there is no hcloud-volumes class to
# use). A node loss would therefore take the volume with it. That is survivable
# ONLY because of continuous backup: barman ships every WAL segment to Hetzner
# Object Storage, so recovery is a fresh Cluster with a `bootstrap.recovery`
# stanza pointed at the same destinationPath, restoring to any point in the
# retention window on any node. Losing the volume costs a restore, not the data.
#
# Two backup layers on purpose, matching the platform convention:
#   1. THIS — continuous WAL + weekly base backup → PITR, minutes of RPO.
#   2. A 6-hourly logical pg_dump (pieces/db-backup/nextcloud-db-dump.yaml)
#      → a plain .sql.gz that restores without the operator, into anything.
# Velero's raw-PVC snapshot is a third, incidental layer.
#
# DEPRECATION NOTE: `backup.barmanObjectStore` is the in-tree implementation, which
# CNPG has been phasing out since 1.26 in favour of the Barman Cloud CNPG-I plugin.
# It is still supported and shipped in 1.30, and the operator states the exact
# deadline when it is used: "Native support for Barman Cloud backups and recovery
# is deprecated and will be completely removed in CloudNativePG 1.31.0" — so the
# migration to the Barman Cloud Plugin must land BEFORE the operator reaches 1.31.
# It is used here deliberately: the plugin needs its own operator deployment and an
# OCI Helm source, which Argo would need repo config for, and the in-tree path keeps
# a brand-new database on ONE moving part. When CNPG drops it, migrate to the plugin
# (the destinationPath and credentials carry over unchanged) — the pg_dump layer
# above covers the gap either way.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-db
  annotations:
    alerts/owner: ops@WLDOMAIN
spec:
  # Single instance: dev has one worker + one (schedulable) control plane, and a
  # replica on the SAME local-path node protects against nothing. Real HA needs
  # Track A/B (off-node volumes + a second node worth replicating to); until then
  # the WAL archive is the durability story, not a replica.
  instances: 1
  # Fast clean stop after 10 s, not CNPG's 180 s smart-shutdown default: the
  # pooled clients never leave, so a smart shutdown always runs the full window
  # and refuses every connection meanwhile. Rationale and the 2026-10-29
  # measurement: gitops/platform/authentik/cnpg-cluster.yaml. Guard:
  # infrastructure/hetzner/scripts/tests/cnpg-fast-stop.test.sh.
  smartShutdownTimeout: 10
  # PG 17, not the operator's 18.x default: Nextcloud 34 supports 17 everywhere,
  # and the logical-dump CronJob's pg_dump image (postgres:17-alpine, matching the
  # existing authentik/harbor dumps) must be >= the server version.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-system-trixie
  primaryUpdateStrategy: unsupervised

  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud
      # The role's password comes from the ESO-synced secret (OpenBao is the source
      # of truth) instead of being generated by the operator — see externalsecrets.yaml.
      secret:
        name: nextcloud-db-app
      # Nextcloud requires a UTF8 database; ICU/C collation keeps sorting stable
      # across a restore onto a differently-configured node.
      encoding: UTF8
      localeCollate: C
      localeCType: C

  storage:
    size: 10Gi
    storageClass: local-path

  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

  postgresql:
    parameters:
      # Sized for the 1Gi limit above — shared_buffers ~25% of the container's
      # memory, the rest left to the OS page cache and work_mem.
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
      work_mem: "8MB"
      max_connections: "200" # Nextcloud + cron sidecar + occ jobs + dump job

  backup:
    # 14 days of PITR. Bigger than the pg_dump retention because WAL is small and
    # this is the layer that actually rescues a lost node.
    retentionPolicy: "14d"
    barmanObjectStore:
      # Same platform bucket the etcd snapshots and Velero backups use — no new
      # bucket, no new credentials. Path-namespaced by cluster.
      destinationPath: s3://WLBUCKET-tfstate-dev/cnpg/nextcloud-db
      endpointURL: https://nbg1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          name: nextcloud-backup-s3
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: nextcloud-backup-s3
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
---
# Weekly base backup. WAL alone cannot restore — PITR replays WAL ON TOP of a base
# backup, so without this the archive is unusable and the retention policy has
# nothing to prune against.
# NOTE: CNPG's schedule is a SIX-field cron (leading seconds field), unlike the
# five-field k8s CronJob schedules elsewhere in this repo.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: nextcloud-db-base
spec:
  # 02:20 Sunday — offset from velero(:00), openbao(:30), harbor(:15),
  # authentik(:45) and the nextcloud dump(:05) so backups never contend.
  schedule: "0 20 2 * * 0"
  # Take one IMMEDIATELY on creation instead of waiting for the first Sunday.
  # Without this the cluster spends up to a week with WAL archiving "working" and
  # NO restorable point — WAL is replayed ON TOP of a base backup, so an archive
  # with no base is unusable. It also matters on every rebuild: a restored or
  # re-created cluster gets its first base backup at once rather than whenever the
  # next Sunday happens to fall.
  immediate: true
  backupOwnerReference: self
  cluster:
    name: nextcloud-db
