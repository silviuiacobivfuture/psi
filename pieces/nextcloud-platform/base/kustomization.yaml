# Nextcloud's non-chart half — see pieces/nextcloud-platform (its Application generated by the consumer).
# Order is documentation only (Argo applies by kind/wave, not by list position).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - resourcequota.yaml
  - externalsecrets.yaml
  - cnpg-cluster.yaml
  - redis.yaml
  - occ-reconcile.yaml
  # The plain-webhook -> signed-Talk translator. Lives here because it mounts the
  # talk-channels ConfigMap and talk-bot Secret this app already owns.
  - talk-webhook.yaml
# The relay's whole program, one file. Plain name (no hash): the Deployment mounts it by name.
# An estate's component may merge its own wording over it (behavior: merge), keeping this name.
configMapGenerator:
  - name: talk-webhook-app
    files:
      - app.py=talk-webhook/app.py
    options:
      disableNameSuffixHash: true
components:
  # Argo's prune/delete guard on the PVCs and CNPG Clusters rendered here (the data).
  - ../../../components/prune-guard
