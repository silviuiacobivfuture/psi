# Redis for Nextcloud — transactional file locking + the distributed memory cache.
# Official upstream image, NOT Bitnami (the Bitnami catalog moved free images to
# docker.io/bitnamilegacy in 2025 and the chart's pinned tags 404) — the same
# reasoning and shape as gitops/platform/authentik/redis.yaml.
#
# NO PVC, unlike authentik's: everything in here is derived state — caches and
# short-lived file locks that Nextcloud re-creates on demand and that expire on
# their own. Persisting it would add a second node-pinned local-path volume for
# data nobody would ever want restored. An emptyDir keeps the failure mode to "a
# cold cache after a restart".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-redis
  labels:
    app.kubernetes.io/name: nextcloud-redis
  annotations:
    # REQUIRED: redis-password is injected as an env var and baked into the
    # redis-server --requirepass argv at start, so a rotated password would leave
    # redis accepting only the OLD one while Nextcloud authenticates with the new
    # one — a silent split-brain that surfaces as random file-locking errors.
    reloader.stakater.com/auto: "true"
    alerts/owner: ops@WLDOMAIN
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: WLREGISTRY/mirror/docker.io/library/redis:7.4-alpine@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
          command: ["sh", "-c"]
          # requirepass via env so the password never appears in the manifest/argv.
          # appendonly no: see the header — this data is disposable by design.
          args:
            - exec redis-server --requirepass "$REDIS_PASSWORD" --appendonly no --maxmemory 192mb --maxmemory-policy allkeys-lru
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-redis
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-redis
  labels:
    app.kubernetes.io/name: nextcloud-redis
spec:
  selector:
    app.kubernetes.io/name: nextcloud-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
