# Reloader auto-restarts this Deployment when the ESO-synced
# cloudflare-api-token Secret changes (OpenBao -> ESO -> Secret -> roll).
# REQUIRED: CF_API_TOKEN is injected as an ENV VAR (env.valueFrom.secretKeyRef
# below) and env is read once at startup, so without this a rotated token would
# silently never take effect. Enforced by the require-reloader-annotation
# Kyverno policy. Chart key VERIFIED against external-dns 1.21.1
# templates/deployment.yaml:10 — `deploymentAnnotations` lands on the
# Deployment's own metadata, which is where Reloader reads the annotation
# (`podAnnotations` would put it on the pod template, where Reloader ignores it).
deploymentAnnotations:
  reloader.stakater.com/auto: "true"
provider:
  name: cloudflare
env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: token
# domainFilters and txtOwnerId are estate values: set by `parameters`
# below, which the identity fills (kustomization.yaml replacements).
policy: upsert-only
sources:
  - ingress
# Nodes have no public ExternalIP in k8s yet (no Hetzner CCM), so the
# only IPs external-dns sees are the private 10.x — exclude them so it
# does NOT publish broken private-IP records. Until CCM (or a LB) gives
# a real public target, the manual *.dev wildcard serves public DNS.
# Once CCM is in, drop this and external-dns publishes public IPs.
extraArgs:
  - --exclude-target-net=10.0.0.0/8
  - --exclude-target-net=172.16.0.0/12
  - --exclude-target-net=192.168.0.0/16
