existingSecretAdminPassword: harbor-admin
existingSecretAdminPasswordKey: secret
# Every value the chart would otherwise MINT at render time (randAlphaNum, genCA, htpasswd) comes
# from one Secret, harbor-keys (pieces/platform-secrets/harbor-keys.yaml, OpenBao
# secret/platform/harbor/keys, seeded by seed-secrets.sh). Minted values differ on every Argo
# render, and the checksum/* annotations on core, jobservice and registry with them, so any change
# to the Application restarted all three. Gate: .github/scripts/tests/helm-stable-render_test.sh.
core:
  existingSecret: harbor-keys
  # The token-signing key pair (tls.crt, tls.key), mounted by core and the registry.
  secretName: harbor-keys
  existingXsrfSecret: harbor-keys
  existingXsrfSecretKey: CSRF_KEY
jobservice:
  existingSecret: harbor-keys # key JOBSERVICE_SECRET
  existingSecretKey: JOBSERVICE_SECRET
registry:
  existingSecret: harbor-keys # key REGISTRY_HTTP_SECRET
  existingSecretKey: REGISTRY_HTTP_SECRET
  credentials:
    # REGISTRY_PASSWD and REGISTRY_HTPASSWD (bcrypt of that password, made once at seeding).
    existingSecret: harbor-keys # keys REGISTRY_PASSWD, REGISTRY_HTPASSWD
expose:
  type: ingress
  tls:
    enabled: true
    certSource: secret
    # secret.secretName: set by `parameters` below.
  ingress:
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      # Homepage hub auto-discovery (gethomepage.dev) → "Delivery" group.
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Harbor"
      gethomepage.dev/description: "Container image registry"
      gethomepage.dev/group: "Delivery"
      gethomepage.dev/icon: "harbor.png"
      # Explicit href → Harbor UI root. Without it homepage derives the link
      # from the ingress path set (Harbor exposes /api/* + /service/*), landing
      # the tile on /api/ which 404s in a browser. Pin the real UI URL
      # (gethomepage.dev/href, set by `parameters` below).
      gethomepage.dev/pod-selector: "app=harbor,component=core"
# The two PVCs Argo tracks carry Argo's prune/delete guard (components/prune-guard says
# why); `helm.sh/resource-policy: keep` is Helm's and stops no Argo prune.
persistence:
  enabled: true
  persistentVolumeClaim:
    registry: { storageClass: local-path, size: 40Gi, annotations: { argocd.argoproj.io/sync-options: "Prune=false,Delete=false" } }   # NOT a cap (local-path does not enforce it; 229.9 GB sat here on 2026-10-29): retention + GC are the harbor-housekeeping CronJob (gitops/platform/secrets/harbor-housekeeping.yaml), HARBOR_QUOTA_GI=36 (harbor-bootstrap.sh) the push backstop. local-path CANNOT online-resize and Argo APPLIES this size every sync (ignoreDifferences hides the diff, not the apply) → this MUST equal the live PVC or sync 500s with "forbidden: only dynamically provisioned pvc can be resized". To change size: scale registry to 0, delete the PVC+PV, let Argo recreate at the new size (images re-push via CI), THEN bump the quota.
    jobservice: { jobLog: { storageClass: local-path, size: 1Gi, annotations: { argocd.argoproj.io/sync-options: "Prune=false,Delete=false" } } }
    database: { storageClass: local-path, size: 2Gi }
    redis: { storageClass: local-path, size: 1Gi }
    trivy: { storageClass: local-path, size: 2Gi }
trivy: { enabled: false }
notary: { enabled: false }
