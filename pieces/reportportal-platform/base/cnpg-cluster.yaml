# ReportPortal's Postgres — a CloudNativePG Cluster, the fourth on this platform
# after nextcloud-db, plane-db and the convex instances. Shape, rationale and
# deprecation notes mirror gitops/services/plane/base/cnpg-cluster.yaml — read that
# file first; only the differences are explained here.
#
# WHY NOT THE CHART'S BUNDLED POSTGRES: chart 26.8.12 depends on the CloudPirates
# `postgres` subchart (a bare StatefulSet with no backup of any kind) and would
# store every launch, test item and log row on a volume nothing copies anywhere.
# `postgresql.install: false` replaces it with this, which has two independent
# durability layers:
#   1. THIS — continuous WAL archive + a weekly base backup → PITR, minutes of RPO.
#   2. A 6-hourly logical pg_dump (pieces/db-backup/reportportal-db-dump.yaml)
#      → a plain .sql.gz that restores without the operator, into anything.
#
# EXTENSIONS: NONE DECLARED HERE, and that is a VERIFIED decision, not an omission.
# ReportPortal's migrations create three extensions — `ltree` (the test-item path
# hierarchy), `pg_trgm` and `pgcrypto` — confirmed by extracting `/migrations` from
# the reportportal/migrations:5.15.4 image and grepping:
#     CREATE EXTENSION IF NOT EXISTS ltree
#     CREATE EXTENSION IF NOT EXISTS pgcrypto
#     CREATE EXTENSION IF NOT EXISTS pg_trgm
# All three are TRUSTED extensions, which a non-superuser holding CREATE on the
# database may install. Verified on this cluster against the SAME operator image
# used below (`ghcr.io/cloudnative-pg/postgresql:17.7-system-trixie`, PG 17.7):
#     psql -tAc "SELECT name, trusted FROM pg_available_extension_versions
#                WHERE name IN ('ltree','pgcrypto','pg_trgm');"
#     ltree|t  pg_trgm|t  pgcrypto|t
# So the `reportportal` role — which owns the database via bootstrap.initdb.owner —
# can create them itself and no `postInitApplicationSQL` is needed. If a future RP
# release adds a NON-trusted extension the migration will fail loudly at that exact
# statement; add it here as `bootstrap.initdb.postInitApplicationSQL` then.
#
# STORAGE: local-path, 10Gi, same as plane-db. Node-pinned and non-resizable, which
# is survivable ONLY because of the WAL archive above — a node loss costs a restore,
# not the data.
#
# DEPRECATION NOTE (same clock as nextcloud-db and plane-db):
# `backup.barmanObjectStore` is the in-tree implementation CNPG has been phasing out
# since 1.26 and removes in 1.31. Migrate ALL clusters to the Barman Cloud Plugin
# before bumping the operator past 1.31.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: reportportal-db
  annotations:
    alerts/owner: ops@WLDOMAIN
spec:
  # Single instance, same reasoning as plane-db: dev has one worker plus a
  # schedulable control plane, and a replica on the SAME local-path node protects
  # against nothing. The WAL archive is the durability story here, not a replica.
  instances: 1
  # Fast clean stop after 10 s, not CNPG's 180 s smart-shutdown default: the
  # pooled clients never leave, so a smart shutdown always runs the full window
  # and refuses every connection meanwhile. Rationale and the 2026-10-29
  # measurement: gitops/platform/authentik/cnpg-cluster.yaml. Guard:
  # infrastructure/hetzner/scripts/tests/cnpg-fast-stop.test.sh.
  smartShutdownTimeout: 10
  # PG 17, matching every other cluster here. The chart's bundled subchart pins
  # postgres 18.4, but ReportPortal reaches the database only through golang-migrate
  # + JDBC and its migrations use no version-gated syntax beyond the three trusted
  # extensions above. Keeping 17 also keeps the logical-dump image
  # (postgres:17-alpine, shared with the other dumps) >= the server version, which
  # pg_dump requires. ASSUMPTION, stated: established by reading the migrations, not
  # by running ReportPortal against PG 17.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-system-trixie
  primaryUpdateStrategy: unsupervised

  bootstrap:
    initdb:
      database: reportportal
      owner: reportportal
      # The role's password comes from the ESO-synced Secret (OpenBao is the source
      # of truth) rather than being generated by the operator — so it survives a
      # cluster rebuild and still matches a database restored from backup. Same
      # Secret the chart reads for RP_DB_PASS, so the two ends cannot drift.
      secret:
        name: reportportal-db-app
      encoding: UTF8
      localeCollate: C
      localeCType: C

  storage:
    size: 10Gi
    storageClass: local-path

  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

  postgresql:
    parameters:
      # Sized for the 1Gi limit above — shared_buffers ~25% of the container's
      # memory, the rest to the OS page cache and work_mem.
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
      work_mem: "8MB"
      # api + uat + jobs + analyzer + the migrations Job + the dump job. The api's
      # own HikariCP pool is capped at 40 (`database.connections` in the Helm
      # values), so this leaves room for the rest with headroom.
      max_connections: "200"

  backup:
    # 14 days of PITR, same as the other clusters.
    retentionPolicy: "14d"
    barmanObjectStore:
      # The shared PLATFORM bucket, path-namespaced by cluster — the same one the
      # etcd snapshots, Velero backups and the other CNPG archives use. NOT
      # WLBUCKET-reportportal-dev: that bucket holds ReportPortal's ATTACHMENTS and is
      # app-facing; backups stay on the platform bucket by convention.
      destinationPath: s3://WLBUCKET-tfstate-dev/cnpg/reportportal-db
      endpointURL: https://nbg1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          name: reportportal-backup-s3
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: reportportal-backup-s3
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
---
# Weekly base backup. WAL alone cannot restore — PITR replays WAL ON TOP of a base
# backup, so without this the archive is unusable and the retention policy has
# nothing to prune against.
# NOTE: CNPG's schedule is a SIX-field cron (leading seconds field), unlike the
# five-field k8s CronJob schedules elsewhere in this repo.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: reportportal-db-base
spec:
  # 02:55 Sunday — an UNUSED slot. Taken already: velero :00, nextcloud dump :05,
  # plane dump :10, harbor :15, nextcloud-db base :20, openbao :30, plane-db base
  # :40, authentik :45. Nothing contends at :55.
  schedule: "0 55 2 * * 0"
  # Take one IMMEDIATELY on creation instead of waiting for the first Sunday —
  # otherwise the cluster spends up to a week with WAL archiving "working" and NO
  # restorable point, and every rebuild repeats that window.
  immediate: true
  backupOwnerReference: self
  cluster:
    name: reportportal-db
