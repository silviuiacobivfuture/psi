# ReportPortal runtime secrets, synced from OpenBao by ESO. Every value lives ONLY
# in OpenBao (seeded by infrastructure/hetzner/scripts/seed-secrets.sh); these
# manifests hold the MAPPING, never a value. See gitops/services/APP-SECRETS.md.
#
# Each `data[]` key is declared EXPLICITLY (no bare `dataFrom.extract`) so a key that
# is absent in OpenBao makes the ExternalSecret report SecretSyncedError — loud and
# visible in `kubectl get externalsecret -A` — instead of syncing a partial Secret
# that would leave ReportPortal booting with a blank password and dying in a JDBC
# stack trace.
#
# WHY THE SECRETS ARE SEPARATE OBJECTS, NOT ONE
# ---------------------------------------------
# Unlike Plane (whose chart substitutes ONE whole Secret per workload, forcing us to
# compose full DSNs), the reportportal chart 26.8.12 reads each credential through
# its own `secretKeyRef` and takes the host/port/user/db as plain VALUES. Verified
# against the chart's templates:
#     database.secretName    + database.passwordKeyName   -> RP_DB_PASS
#     msgbroker.secretName   + key "rabbitmq-password"    -> RP_AMQP_PASS
#     storage.secretName     + accesskeyName/secretkeyName-> DATASTORE_{ACCESS,SECRET}KEY
#     uat.superadminInitPasswd.secretName + passwordKeyName -> RP_INITIAL_ADMIN_PASSWORD
# So the natural shape is one Secret per datastore, each holding exactly the key the
# chart names — which also keeps the blast radius of each credential separate.
#
# ⚠️ THE RABBITMQ KEY NAME IS HARD-CODED IN THE CHART. `msgbroker.passwordKeyName`
# does NOT exist: api-deployment.yaml, uat-deployment.yaml, jobs-deployment.yaml and
# analyzer-statefulset.yaml all spell `key: "rabbitmq-password"` literally. Renaming
# the key below would produce a Secret that syncs perfectly and a pod that
# CreateContainerConfigError's on a missing key. Do not "tidy" it to `password`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reportportal-db-app
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: reportportal-db-app
    creationPolicy: Owner
    template:
      # CNPG requires type kubernetes.io/basic-auth with exactly username/password
      # for `bootstrap.initdb.secret`. The SAME Secret is what the chart reads for
      # RP_DB_PASS (`database.passwordKeyName: password`), so the role CNPG creates
      # and the password ReportPortal presents are one value by construction —
      # they cannot drift, and a rebuilt cluster still matches a restored database.
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef: { key: apps/reportportal/db, property: username }
    - secretKey: password
      remoteRef: { key: apps/reportportal/db, property: password }
---
# The broker credentials, in BOTH the env-var names the upstream rabbitmq image
# reads (RABBITMQ_DEFAULT_USER/PASS, consumed by our StatefulSet with a single
# envFrom) and the key name the chart hard-codes (`rabbitmq-password`). One OpenBao
# property, two spellings, so the broker and its clients cannot disagree.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reportportal-rabbitmq
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: reportportal-rabbitmq
    creationPolicy: Owner
    template:
      data:
        RABBITMQ_DEFAULT_USER: "{{ .username }}"
        RABBITMQ_DEFAULT_PASS: "{{ .password }}"
        # The chart's hard-coded key name. Same value; see the header.
        rabbitmq-password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef: { key: apps/reportportal/rabbitmq, property: username }
    - secretKey: password
      remoteRef: { key: apps/reportportal/rabbitmq, property: password }
---
# Object storage — the Hetzner Object Storage bucket WLBUCKET-reportportal-dev
# (Tofu-managed: infrastructure/hetzner/environments/dev/main.tf →
# module.reportportal_storage). The SAME platform S3 credentials every other
# workload uses; only the BUCKET is per-app.
#
# The bucket name, endpoint, region and path-style are NOT here: the chart takes
# them as plain values (`storage.bucket.bucketDefaultName`, `storage.endpoint`,
# `storage.region`), they are non-secret, and they are env-specific — the same split
# nextcloud and plane make.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reportportal-storage
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: reportportal-storage
    creationPolicy: Owner
    template:
      data:
        # Key names must match storage.accesskeyName / storage.secretkeyName in the
        # Helm values (gitops/apps/overlays/dev/reportportal.yaml).
        access-key: "{{ .access_key_id }}"
        secret-key: "{{ .secret_access_key }}"
  data:
    - secretKey: access_key_id
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: secret_access_key
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
---
# The FIRST-LAUNCH superadmin password.
#
# WHY THIS MATTERS MORE THAN IT LOOKS: ReportPortal ships a publicly documented
# default superadmin credential. On a host that is reachable from the internet —
# which reports.WLDOMAIN is, deliberately, because agents must POST to its API
# — leaving that default in place is not a rough edge, it is an open door. The chart
# takes the initial password from a Secret (`uat.superadminInitPasswd.secretName`),
# so ours is generated per-cluster by seed-secrets.sh and never exists in git.
#
# ⚠️ IT IS AN *INITIAL* PASSWORD, NOT A RECONCILED ONE. The chart's own docs say the
# value "can't change the password on redeployments": uat applies it only when the
# superadmin row is created. Rotating this path in OpenBao afterwards changes
# NOTHING in ReportPortal — the change must be made in the RP UI and then written
# back here. That is why `seed-secrets.sh` seeds it generate-if-missing and
# `--rotate` would be misleading; the RUNBOOK records the manual rotation path.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reportportal-superadmin
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: reportportal-superadmin
    creationPolicy: Owner
    template:
      data:
        # Key name must match uat.superadminInitPasswd.passwordKeyName.
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: apps/reportportal/superadmin, property: password }
---
# CNPG's WAL-archive credentials (barman → Hetzner Object Storage) and the pg_dump
# CronJob's uploader. Deliberately a SEPARATE Secret from reportportal-storage, with
# the AWS_* key names barman expects and no bucket/endpoint members — different
# consumer, different blast radius, exactly as plane-backup-s3 is split.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reportportal-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: reportportal-backup-s3, creationPolicy: Owner }
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
---
# The ROSTER's passwords — one field per login on secret/apps/reportportal/users.
#
# ⚠️ THIS IS THE ONE ExternalSecret IN THIS FILE WITHOUT AN EXPLICIT `data[]`, AND
# THAT IS DELIBERATE. The rule (infrastructure/hetzner/CLAUDE.md, "New apps: secret
# schema is MANDATORY") exists so a missing key fails LOUDLY instead of syncing a
# blank value. Here the key SET IS DYNAMIC BY DESIGN: it is one field per person on
# the roster, and the entire point of that roster
# (pieces/reportportal-platform/base/config-reconcile-data.yaml) is that adding a
# teammate is ONE LINE. Declaring the logins here too would put the list in two
# places and guarantee they drift — the exact failure mode the rule is trying to
# prevent, one level up.
#
# So the loudness moves INTO the consumer, where it is strictly better: the
# `reportportal-config-reconcile` CronJob mounts this Secret as a DIRECTORY and,
# for every roster login it has to create, refuses to continue without a password:
#     MISSING REQUIRED SECRET: reportportal-users/<login>
# — a NAMED failure that also tells you WHICH person is missing, which a
# SecretSyncedError on a whole path could not. The mount is `optional: true` for
# the same reason: a non-optional mount of a Secret that does not exist yet wedges
# the pod in ContainerCreating, and a reconcile that never runs is silent.
#
# VOLUME-MOUNTED, so no Reloader annotation is needed or wanted (and the consumer
# is a CronJob, which starts a fresh pod per run anyway).
#
# Seeded generate-if-missing by infrastructure/hetzner/scripts/seed-secrets.sh,
# which reads the SAME roster block — so the list still lives in exactly one place.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reportportal-users
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: reportportal-users, creationPolicy: Owner }
  # The four sub-keys below are the CRD's OWN DEFAULTS, written out explicitly.
  # WHY: this Application syncs with ServerSideApply=true, and with `dataFrom`
  # Argo compares the git manifest against the DEFAULTED live object — so a
  # manifest that omits them sits permanently OutOfSync while `kubectl diff`
  # reports no difference at all (verified on dev 2026-08-20). A permanently
  # OutOfSync resource is worse than cosmetic: it masks the next REAL drift and
  # keeps the app amber forever. Declaring the defaults makes desired == live.
  dataFrom:
    - extract:
        key: apps/reportportal/users
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
