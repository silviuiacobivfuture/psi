# Every key is declared, so a missing one is SecretSyncedError, not an empty Secret. Seeded by
# seed-secrets.sh, schema in gitops/services/APP-SECRETS.md. Separate Secrets on purpose: the
# console's pod holds no key of the server's, and the server's holds none of the console's.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: headscale-secrets, creationPolicy: Owner }
  data:
    # Lose these and every device must re-register. Written once, never regenerated.
    - secretKey: noise_private_key
      remoteRef: { key: apps/headscale/env, property: noise_private_key }
    - secretKey: derp_private_key
      remoteRef: { key: apps/headscale/env, property: derp_private_key }
    # The same path the Authentik blueprint reads, so the two ends cannot drift.
    - secretKey: oidc_client_id
      remoteRef: { key: platform/authentik/headscale-oidc, property: client_id }
    - secretKey: oidc_client_secret
      remoteRef: { key: platform/authentik/headscale-oidc, property: client_secret }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headplane-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: headplane-secrets, creationPolicy: Owner }
  data:
    - secretKey: cookie_secret
      remoteRef: { key: apps/headscale/headplane, property: cookie_secret }
    # Only Headscale can mint this: an EMPTY SLOT until headscale-bootstrap.sh captures it,
    # and until then the console refuses to start, by name.
    - secretKey: headscale_api_key
      remoteRef: { key: apps/headscale/headplane, property: api_key }
    - secretKey: oidc_client_id
      remoteRef: { key: platform/authentik/headplane-oidc, property: client_id }
    - secretKey: oidc_client_secret
      remoteRef: { key: platform/authentik/headplane-oidc, property: client_secret }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headscale-db-copy-s3
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: headscale-db-copy-s3, creationPolicy: Owner }
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
