# Argo CD's read credential for this repository, rendered from OpenBao.
#
# Before 2026-10-21 this Secret was created ONCE by scripts/gitops.sh from a key
# file on whichever workstation ran the bootstrap, and nothing anywhere recorded
# it. When the matching deploy key disappeared from GitHub (gone by 2026-10-20
# 06:00, cause unknown), every git-sourced Application went to sync=Unknown and
# merges to `dev` stopped deploying, with no copy of the key to re-register.
#
# Now the key lives at secret/platform/github/argocd-deploy-key (sshPrivateKey,
# publicKey), seeded and kept registered on GitHub by seed-secrets.sh
# (seed_deploy_key), and checked by doctor.sh. gitops.sh still creates the
# Secret at bootstrap, because OpenBao does not exist yet at that layer; this
# ExternalSecret takes it over once ESO is running.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: repo-platform
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: repo-platform
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: GIT_SSH_URL # the estate repository, from the identity (kustomization.yaml)
        sshPrivateKey: "{{ .sshPrivateKey }}"
  data:
    - secretKey: sshPrivateKey
      remoteRef: { key: platform/github/argocd-deploy-key, property: sshPrivateKey }
