# CORRECTED 2026-09-03: this directory IS Argo-synced. The `argocd-config`
# Application deploys this piece (pieces/argocd-config), with selfHeal on —
# read off the live Application rather than assumed. Every file here carried a
# header claiming the opposite and telling the reader to apply it by hand, which
# is unnecessary and is also how live state gets created that then fights
# self-heal. A merge to the environment branch is the deploy, here as everywhere
# else on this platform.
#
# Merges the Authentik OIDC client creds into the existing argocd-secret
# (keys authentikClientID / authentikClientSecret — dot-free for Argo's
# $-substitution in oidc.config). Source: OpenBao secret/platform/authentik/argo-oidc.
# creationPolicy: Merge → adds keys without owning/replacing the Argo-managed secret.
#
# Synced by the `argocd-config` Application — or kubectl apply this with
# the cm changes, then rollout restart argocd-server so it reloads the secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-authentik-oidc
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: argocd-secret
    creationPolicy: Merge
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        authentikClientID: "{{ .id }}"
        authentikClientSecret: "{{ .secret }}"
  data:
    - secretKey: id
      remoteRef: { key: platform/authentik/argo-oidc, property: client_id }
    - secretKey: secret
      remoteRef: { key: platform/authentik/argo-oidc, property: client_secret }
