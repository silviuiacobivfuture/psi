# Changelog Postgres logical backup — 6-hourly `pg_dump` → Hetzner Object Storage.
# Same shape as reportportal-db-dump.yaml, and the SECOND of changelog-db's two
# backup layers:
#   - CNPG's barman WAL archive (services/changelog/base/cnpg-cluster.yaml) gives
#     PITR, but needs the operator and a matching Postgres major to restore;
#   - THIS gives a plain .sql.gz that restores anywhere psql runs.
#
# WHAT IS LOST WITHOUT IT: every tenant, changelog entry, per-user "seen" mark and
# API key hash the service holds. The hashes are the sharp one — a lost key table
# revokes every consumer's key at once, and only the consumers hold the plaintext.
#
# Runs IN the changelog namespace to read the ESO-synced owner credential
# (changelog-db-app) and dials the CNPG read/write Service. postgres:17-alpine
# because the Cluster runs PG 17 (pg_dump must be >= the server version).
# Restore: infrastructure/hetzner/scripts/restore-changelog-db.sh.
# Storage: s3://<BUCKET_PREFIX>-tfstate-<env>/db-dumps/changelog/.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: changelog-db-dump
  namespace: changelog
  annotations:
    alerts/owner: OPS_EMAIL # the estate ops address, from the identity (kustomization.yaml)
spec:
  # :50 — an UNUSED slot on the 6-hourly cadence. Taken: velero :00 and the dumps
  # at :05 :10 :15 :20 :25 :30 :35 :45 (grep `schedule:` across gitops/).
  schedule: "50 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  # One failed run is kept for diagnosis, and every finished run is removed
  # 12h (two schedule windows) after it ends: a failure from days ago left
  # db-backup Degraded long after the next runs completed, masking whatever
  # failed next. Freshness is doctor.sh's to judge ("logical DB dumps"): it
  # fails when a CronJob has not COMPLETED within its window.
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 43200
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels: { app: changelog-db-dump }
        spec:
          restartPolicy: OnFailure
          securityContext:
            # uid/gid 70 = the `postgres` user in the alpine postgres image.
            runAsNonRoot: true
            runAsUser: 70
            fsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: work
              emptyDir: {}
          initContainers:
            - name: dump
              image: WLREGISTRY/mirror/docker.io/library/postgres:17-alpine@sha256:e4cb93687b062cd25a0e8f672d85a7708235009d70d31f8a7698d9370092a9c4
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
              env:
                # `changelog` OWNS the `changelog` database (bootstrap.initdb.owner),
                # so a single-DB dump as the owner needs no superuser.
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: changelog-db-app, key: password } }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 250m, memory: 256Mi }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  echo "pg_dump changelog (db=changelog, user=changelog) → /work/changelog.sql.gz"
                  pg_dump -h changelog-db-rw -p 5432 -U changelog -d changelog | gzip -c > /work/changelog.sql.gz
                  ls -l /work/changelog.sql.gz
                  sz=$(wc -c < /work/changelog.sql.gz); [ "$sz" -gt 1000 ] || { echo "FATAL: changelog dump too small ($sz bytes) — connection/auth failed" >&2; exit 1; }
              volumeMounts:
                - { name: work, mountPath: /work }
          containers:
            - name: upload
              image: WLREGISTRY/mirror/docker.io/amazon/aws-cli:2.17.0@sha256:7b7edf789765c22d75e61ad6f307c06950e15357b79ea1749104641ce3a11fec
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: changelog-backup-s3, key: AWS_ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: changelog-backup-s3, key: AWS_SECRET_ACCESS_KEY } }
                - { name: AWS_REGION, value: OBJECT_STORAGE_REGION }
                - { name: AWS_ENDPOINT_URL, value: OBJECT_STORAGE_ENDPOINT }
                - { name: AWS_S3_ADDRESSING_STYLE, value: path }
                - { name: BUCKET, value: BUCKET_PREFIX-tfstate-dev }
                - { name: PREFIX, value: db-dumps/changelog }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 250m, memory: 256Mi }
              volumeMounts:
                - { name: work, mountPath: /work }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  OUT=/work/changelog.sql.gz
                  test -s "$OUT" || { echo "FATAL: dump missing/empty (initContainer failed)" >&2; exit 1; }
                  export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
                  export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
                  KEY="${PREFIX}/changelog-${TS}.sql.gz"
                  echo "Uploading → s3://${BUCKET}/${KEY}"
                  aws s3 cp "$OUT" "s3://${BUCKET}/${KEY}" --endpoint-url "$AWS_ENDPOINT_URL"
                  echo "DB dump uploaded: s3://${BUCKET}/${KEY}"
                  KEEP=20
                  aws s3 ls "s3://${BUCKET}/${PREFIX}/" --endpoint-url "$AWS_ENDPOINT_URL" \
                    | awk '{print $4}' | grep -E '^changelog-.*\.sql\.gz$' | sort -r | tail -n +$((KEEP + 1)) \
                    | while read -r f; do aws s3 rm "s3://${BUCKET}/${PREFIX}/${f}" --endpoint-url "$AWS_ENDPOINT_URL"; done || true
