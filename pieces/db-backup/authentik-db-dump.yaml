# Authentik Postgres logical backup — 6-hourly `pg_dump` → Hetzner Object Storage.
# Same rationale as harbor-db-dump.yaml: a transactionally consistent logical dump on
# top of the CNPG Cluster's own barman backups. Authentik holds all identities/groups/
# providers — losing it = SSO rebuild. Runs IN the authentik namespace to read the
# `authentik` role's password from `authentik-db-app` (the CNPG bootstrap Secret) — it
# owns the `authentik` DB, so a single-DB pg_dump as that role needs no superuser.
# Image is postgres:17 because the server is PG 17 (pg_dump must be >= the server
# version). Storage: s3://<BUCKET_PREFIX>-tfstate-<env>/db-dumps/authentik/.
#
# FAILED EVERY RUN FROM 2026-09-21 TO 2026-10-22. I2 moved Authentik off the Bitnami
# subchart onto the CNPG Cluster `authentik-db`, and this job kept dialling the retired
# `authentik-postgresql` Service, which no longer exists. It now addresses `-rw`, the
# only one of CNPG's three Services that follows a failover — as the application does
# (gitops/apps/overlays/dev/authentik.yaml) and as nextcloud-db-dump.yaml already did.
#
# The `authentik-backup-s3` ExternalSecret the upload reads is NOT declared here any
# more: it is owned by platform-secrets (pieces/platform-secrets/authentik-db-app.yaml),
# because barman needs it before the Cluster exists. Declaring it in both places made
# one object a member of two Applications, which Argo reports as SharedResourceWarning
# and leaves this one permanently OutOfSync.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: authentik-db-dump
  namespace: authentik
  annotations:
    alerts/owner: OPS_EMAIL # the estate ops address, from the identity (kustomization.yaml)
spec:
  schedule: "45 */6 * * *" # offset from velero(:00)/openbao(:30)/harbor(:15)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  # One failed run is kept for diagnosis, and every finished run is removed
  # 12h (two schedule windows) after it ends: a failure from days ago left
  # db-backup Degraded long after the next runs completed, masking whatever
  # failed next. Freshness is doctor.sh's to judge ("logical DB dumps"): it
  # fails when a CronJob has not COMPLETED within its window.
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 43200
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: { app: authentik-db-dump }
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            fsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: work
              emptyDir: {}
          initContainers:
            - name: dump
              image: WLREGISTRY/mirror/docker.io/library/postgres:17-alpine@sha256:e4cb93687b062cd25a0e8f672d85a7708235009d70d31f8a7698d9370092a9c4
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
              env:
                # Dump as the `authentik` role — it owns the `authentik` database, so
                # a single-DB pg_dump as the owner is all a restore needs. Read from
                # the CNPG bootstrap Secret, the credential the Cluster itself was
                # initialised with, rather than the retired subchart's key names.
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: authentik-db-app, key: password } }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  echo "pg_dump authentik (db=authentik, user=authentik) → /work/authentik.sql.gz"
                  pg_dump -h authentik-db-rw -p 5432 -U authentik -d authentik | gzip -c > /work/authentik.sql.gz
                  ls -l /work/authentik.sql.gz
                  sz=$(wc -c < /work/authentik.sql.gz); [ "$sz" -gt 1000 ] || { echo "FATAL: authentik dump too small ($sz bytes) — connection/auth failed" >&2; exit 1; }
              volumeMounts:
                - { name: work, mountPath: /work }
          containers:
            - name: upload
              image: WLREGISTRY/mirror/docker.io/amazon/aws-cli:2.17.0@sha256:7b7edf789765c22d75e61ad6f307c06950e15357b79ea1749104641ce3a11fec
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: authentik-backup-s3, key: AWS_ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: authentik-backup-s3, key: AWS_SECRET_ACCESS_KEY } }
                - { name: AWS_REGION, value: OBJECT_STORAGE_REGION }
                - { name: AWS_ENDPOINT_URL, value: OBJECT_STORAGE_ENDPOINT }
                - { name: AWS_S3_ADDRESSING_STYLE, value: path }
                - { name: BUCKET, value: BUCKET_PREFIX-tfstate-dev }
                - { name: PREFIX, value: db-dumps/authentik }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 250m, memory: 256Mi }
              volumeMounts:
                - { name: work, mountPath: /work }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  OUT=/work/authentik.sql.gz
                  test -s "$OUT" || { echo "FATAL: dump missing/empty (initContainer failed)" >&2; exit 1; }
                  export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
                  export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
                  KEY="${PREFIX}/authentik-${TS}.sql.gz"
                  echo "Uploading → s3://${BUCKET}/${KEY}"
                  aws s3 cp "$OUT" "s3://${BUCKET}/${KEY}" --endpoint-url "$AWS_ENDPOINT_URL"
                  echo "DB dump uploaded: s3://${BUCKET}/${KEY}"
                  KEEP=20
                  aws s3 ls "s3://${BUCKET}/${PREFIX}/" --endpoint-url "$AWS_ENDPOINT_URL" \
                    | awk '{print $4}' | grep -E '^authentik-.*\.sql\.gz$' | sort -r | tail -n +$((KEEP + 1)) \
                    | while read -r f; do aws s3 rm "s3://${BUCKET}/${PREFIX}/${f}" --endpoint-url "$AWS_ENDPOINT_URL"; done || true
