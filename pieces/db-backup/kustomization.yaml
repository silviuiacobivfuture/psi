# SEB piece `db-backup`: logical (pg_dump / mongodump) DB backups for the platform's in-cluster
# databases — a transactionally-consistent layer on top of Velero's raw-PVC backup. Each CronJob
# runs in its app's own namespace (to reach the DB credential there) and uploads to
# s3://<BUCKET_PREFIX>-tfstate-<env>/db-dumps/<app>/. Stateless itself (each run dumps, uploads
# and prunes to 20 generations); no webhook. Delivered in the SEB bundle, rendered at build time
# (tools/bundle/build.mjs).
#
# The estate's own dumps (its business layer's databases) come from its layer,
# ../../components/estate/db-backup, as CronJobs of the same shape; the values below (region,
# endpoint, bucket, alert owner) are filled into them too.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - harbor-db-dump.yaml
  - authentik-db-dump.yaml
  - nextcloud-db-dump.yaml
  - plane-db-dump.yaml
  - reportportal-db-dump.yaml
  - changelog-db-dump.yaml
  # MongoDB (mongodump), not Postgres — Novu's only consistent DB backup layer.
  - novu-db-dump.yaml

# Estate values come from the identity (the whitelabel component, generated by the bundle
# builder from the estate's identity), never written in the manifests.
components:
  - ../../components/whitelabel
  - ../../components/estate/db-backup
replacements:
  - path: whitelabel-replacements.yaml
  # Who is paged: the estate's operations address (the key is moved to
  # alerts.<ESTATE_LABEL_DOMAIN>/owner by ../../components/alert-owner).
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.OPS_EMAIL }
    targets:
      - select: { kind: CronJob, annotationSelector: alerts/owner }
        fieldPaths:
          - metadata.annotations.alerts/owner
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.OBJECT_STORAGE_REGION }
    targets:
      - select: { kind: CronJob }
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.*.env.[name=AWS_REGION].value
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.OBJECT_STORAGE_ENDPOINT }
    targets:
      - select: { kind: CronJob }
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.*.env.[name=AWS_ENDPOINT_URL].value
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.BUCKET_PREFIX }
    targets:
      - select: { kind: CronJob }
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.*.env.[name=BUCKET].value
        options: { delimiter: "-", index: 0 }
transformers:
  - ../../components/alert-owner
