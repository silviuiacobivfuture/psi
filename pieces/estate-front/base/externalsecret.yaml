# The front's one secret: SESSION_KEY, which signs the session cookie so either
# replica accepts what the other issued (apps/estate-front/internal/front/auth.go).
# Declared key by key — the platform's rule for an app that needs a secret
# (infrastructure/hetzner/CLAUDE.md, "New apps: secret schema is MANDATORY") —
# and asserted by the assert-secrets initContainer. Seeded by
# infrastructure/hetzner/scripts/seed-secrets.sh into secret/apps/estate-front/env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: estate-front-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: estate-front-secrets
    creationPolicy: Owner
  data:
    - secretKey: SESSION_KEY
      remoteRef: { key: apps/estate-front/env, property: SESSION_KEY }
  dataFrom:
    - extract: { key: apps/estate-front/env }
