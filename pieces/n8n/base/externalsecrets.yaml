# n8n's secrets, synced from OpenBao by ESO. Values live ONLY in OpenBao (seeded by
# infrastructure/hetzner/scripts/seed-secrets.sh, seed_n8n); these manifests hold the
# MAPPING. Contract: gitops/services/APP-SECRETS.md (n8n).
#
# Every property is a per-key `data[]` entry: an absent one makes the ExternalSecret
# SecretSyncedError, loud, instead of a Secret that boots n8n with a blank value.
#
# THE ENCRYPTION KEY IS THE ONE THAT MUST NOT BE LOST. n8n encrypts every stored
# credential with it; the database alone decrypts nothing. Without this value every
# credential in a restored database is unreadable, and n8n never regenerates it from
# anything. Where its copies are and how a restore is proven: docs/n8n/00-plan.md §6.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-app
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: n8n-app
    creationPolicy: Owner
    template:
      # With a template present ESO emits ONLY these keys. The owner's PASSWORD is
      # not among them: the pod holds its bcrypt hash alone.
      data:
        N8N_ENCRYPTION_KEY: "{{ .encryption_key }}"
        N8N_USER_MANAGEMENT_JWT_SECRET: "{{ .jwt_secret }}"
        N8N_RUNNERS_AUTH_TOKEN: "{{ .runner_token }}"
        N8N_INSTANCE_OWNER_PASSWORD_HASH: "{{ .owner_password_hash }}"
        DB_POSTGRESDB_USER: "{{ .db_username }}"
        DB_POSTGRESDB_PASSWORD: "{{ .db_password }}"
  data:
    - secretKey: encryption_key
      remoteRef: { key: apps/n8n/encryption, property: key }
    - secretKey: jwt_secret
      remoteRef: { key: apps/n8n/app, property: jwt_secret }
    - secretKey: runner_token
      remoteRef: { key: apps/n8n/app, property: runner_token }
    - secretKey: owner_password_hash
      remoteRef: { key: apps/n8n/app, property: owner_password_hash }
    - secretKey: db_username
      remoteRef: { key: apps/n8n/db, property: username }
    - secretKey: db_password
      remoteRef: { key: apps/n8n/db, property: password }
---
# The runner's own Secret: the broker token and nothing else. Code nodes run in that
# pod, so what it can read is what an escaped Code node can read.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-runner
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: n8n-runner, creationPolicy: Owner }
  data:
    - secretKey: N8N_RUNNERS_AUTH_TOKEN
      remoteRef: { key: apps/n8n/app, property: runner_token }
---
# The Postgres application role. CNPG CONSUMES this (bootstrap.initdb.secret), so
# OpenBao is the credential's source of truth and a rebuild restores a database
# whose role password still matches (same reasoning as plunk-db-app).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-db-app
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: n8n-db-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef: { key: apps/n8n/db, property: username }
    - secretKey: password
      remoteRef: { key: apps/n8n/db, property: password }
---
# barman's WAL archive + the pg_dump uploader: the SHARED platform object-storage
# credential, the platform bucket, as plunk-backup-s3. Neither n8n nor its runner
# mounts this one: only the database and the dump job do.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: n8n-backup-s3, creationPolicy: Owner }
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
