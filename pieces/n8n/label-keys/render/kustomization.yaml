# The piece writes n8n's keys neutrally, `n8n/api-client` (the label that admits a pod to n8n's
# API: on the sso pod, and in the NetworkPolicy that matches it) and `n8n/tested-digest` (the
# image digest the harness tested, which doctor and estate-watch compare with what runs). A
# kustomize replacement can write a value but never a KEY, so each PatchTransformer here MOVES one
# to n8n.<ESTATE_LABEL_DOMAIN>/<name>; the domain comes from SEB's whitelabel component, so no
# piece file names it. Same mechanism as components/alert-owner and components/platform-labels:
# each patch's `path:` line is `~1`-delimited segment 1, composed first in lines.yaml
# (ESTATE_LABEL_DOMAIN at dot-split index 1).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
components:
  - ../../../../components/whitelabel
resources:
  - lines.yaml
  - patches.yaml
replacements:
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.ESTATE_LABEL_DOMAIN }
    targets:
      - select: { kind: ConfigMap, name: n8n-key-api-client-pod }
        fieldPaths: [data.SEGMENT]
        options: { delimiter: ".", index: 1 }
      - select: { kind: ConfigMap, name: n8n-key-api-client-policy }
        fieldPaths: [data.SEGMENT]
        options: { delimiter: ".", index: 1 }
      - select: { kind: ConfigMap, name: n8n-key-tested-digest }
        fieldPaths: [data.SEGMENT]
        options: { delimiter: ".", index: 1 }
  - source: { kind: ConfigMap, name: n8n-key-api-client-pod, fieldPath: data.SEGMENT }
    targets:
      - select: { kind: PatchTransformer, name: n8n-key-api-client-pod }
        fieldPaths: [patch]
        options: { delimiter: "~1", index: 1 }
  - source: { kind: ConfigMap, name: n8n-key-api-client-policy, fieldPath: data.SEGMENT }
    targets:
      - select: { kind: PatchTransformer, name: n8n-key-api-client-policy }
        fieldPaths: [patch]
        options: { delimiter: "~1", index: 1 }
  - source: { kind: ConfigMap, name: n8n-key-tested-digest, fieldPath: data.SEGMENT }
    targets:
      - select: { kind: PatchTransformer, name: n8n-key-tested-digest }
        fieldPaths: [patch]
        options: { delimiter: "~1", index: 1 }
