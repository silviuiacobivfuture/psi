# The authorization service's and the hub's error reporting: the `autorizare` GlitchTip project's
# DSN, written to OpenBao by GlitchTip's projects reconcile (pieces/glitchtip/base/projects.yaml)
# at secret/apps/autorizare/glitchtip. Its OWN ExternalSecret (only where GlitchTip runs: ./kustomization.yaml), mounted `optional: true` by both
# Deployments: until the reconcile has written the slot this ExternalSecret is SecretSyncedError
# (doctor.sh names it), and both processes start anyway, telemetry off, said once in their log.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autorizare-glitchtip
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: autorizare-glitchtip
    creationPolicy: Owner
    template:
      data:
        SENTRY_DSN: "{{ .dsn }}"
  data:
    - secretKey: dsn
      remoteRef: { key: apps/autorizare/glitchtip, property: dsn }
