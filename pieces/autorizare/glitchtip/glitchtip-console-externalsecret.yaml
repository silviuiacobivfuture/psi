# The console's error reporting: the `autorizare-console` GlitchTip project's PUBLIC DSN, written
# to OpenBao by GlitchTip's projects reconcile (pieces/glitchtip/base/projects/platform.json) at
# secret/apps/autorizare-console/glitchtip. The service hands it to the page at
# /telemetry/telemetry.json (internal/api/console_telemetry.go). Its OWN ExternalSecret, mounted
# `optional: true`, so a missing slot never touches the service's own DSN (autorizare-glitchtip):
# until the slot exists the file is a 404 and the console runs without reporting.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autorizare-console-glitchtip
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: autorizare-console-glitchtip
    creationPolicy: Owner
    template:
      data:
        CONSOLE_SENTRY_DSN: "{{ .dsn }}"
  data:
    - secretKey: dsn
      remoteRef: { key: apps/autorizare-console/glitchtip, property: dsn }
