# The backup bucket's name, composed from the estate identity (kustomization.yaml). A
# replacements SOURCE only: config.kubernetes.io/local-config keeps it out of the render.
apiVersion: v1
kind: ConfigMap
metadata:
  name: autorizare-bucket
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  BUCKET: BUCKET_PREFIX-tfstate-dev
