apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - harbor-pull-externalsecret.yaml
  - cnpg-cluster.yaml
  - externalsecret.yaml
  # The six non-secret settings config.go requires. Listed before the Deployment
  # that envFroms it, because a reader following the file order meets the values
  # before the container that consumes them.
  - configmap.yaml
  # Each Deployment's own service account: OpenBao's roles are bound to them.
  - serviceaccounts.yaml
  - deployment.yaml
  # The sign-in hub (D23): its own Deployment, Service, Ingress and secrets.
  - hub-externalsecret.yaml
  - hub.yaml
  # Error reporting's DSN for both (optional at the pods).
  - service.yaml
  - ingress.yaml
  - resourcequota.yaml
