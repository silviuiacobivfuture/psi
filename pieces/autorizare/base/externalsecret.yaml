# autorizare's runtime secrets, synced from OpenBao into the k8s Secret the
# Deployment consumes via envFrom. Values live ONLY in OpenBao; this manifest
# holds the mapping, never a value.
#
# PER-KEY `data[]`, and NO `dataFrom.extract` ANYWHERE IN THIS FILE.
#
# That is a departure from services that keep an additive extract for the
# contents of a hand-authored .env file, and it is deliberate. `extract` does
# not error on a missing key: it syncs a partial Secret and the pod starts with an
# empty string. For an authorization control plane every one of these keys is
# load-bearing in a way where "empty" is not degraded, it is wrong — an empty
# OPENFGA_TOKEN makes every write fail as unauthenticated, an empty
# OPENFGA_STORE_ID points at no store at all, and an empty AUTHENTIK_API_TOKEN
# turns credential provisioning into a silent 403. There is no key here whose
# absence should be tolerated, so there is nothing for an extract to usefully add.
#
# Three places, ONE list: this file, the `assert-secrets` initContainer in
# deployment.yaml, and internal/config/config.go's `required` slice. Adding a key
# to any of them means adding it to all three. See gitops/services/APP-SECRETS.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autorizare-secrets
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: autorizare-secrets
    creationPolicy: Owner
    # Retain is the API server's own default, written out so the manifest says
    # what is true. Left implicit it appeared only on the live object, and Argo
    # reported the application OutOfSync forever over a field nobody had set.
    # Declared rather than added to Argo's ignore list, because four manifests
    # elsewhere set this to Merge on purpose — ignoring it would have made
    # those four invisible.
    deletionPolicy: Retain
  data:
    # ── The data plane ───────────────────────────────────────────────────────
    #
    # THE SAME OpenBao path and property openfga's own
    # OPENFGA_AUTHN_PRESHARED_KEYS reads (pieces/openfga/base/
    # externalsecret.yaml). One value read twice: a drift between the two would
    # make every control-plane write fail as unauthenticated, with an error that
    # names neither side.
    - secretKey: OPENFGA_TOKEN
      remoteRef:
        key: apps/openfga/env
        property: OPENFGA_AUTHN_PRESHARED_KEYS
    # @rule D11 — ONE store per environment. The id is not a secret, but it is
    # PROVISIONED: it does not exist until a human creates the store against the
    # admin port, and the service refuses to start without it. Keeping it here
    # rather than pinned in the manifest means the dev id is written once, by the
    # person who created the store, instead of copied into git from a terminal.
    - secretKey: OPENFGA_STORE_ID
      remoteRef:
        key: apps/autorizare/env
        property: OPENFGA_STORE_ID

    # ── The control plane's own database ─────────────────────────────────────
    #
    # The APPLICATION role's connection string, not the owner's (see
    # cnpg-cluster.yaml's managed.roles). CNPG generates a secret for the OWNER
    # and knows nothing about autorizare_app, so this URI is stored alongside the
    # password the role is created with, and the two agree because they come from
    # the same place.
    - secretKey: DATABASE_URL
      remoteRef:
        key: apps/autorizare/app
        property: DATABASE_URL
    # The same password on its own, for the CNPG managed-role reconciler below.
    # Two keys rather than parsing it out of the URI: a parser here would be a
    # second place that has to agree about the URI's shape.
    - secretKey: DB_APP_PASSWORD
      remoteRef:
        key: apps/autorizare/app
        property: DB_APP_PASSWORD

    # ── Identity ─────────────────────────────────────────────────────────────
    #
    # The console's client AT THE SIGN-IN HUB (client_id `console`, declared in
    # apps/autorizare-svc/hub/clients.json). The hub keeps only the SHA-256 of
    # the secret; seed-hub-clients.sh mints it there and writes it here, and
    # doctor's hub layer proves the two agree. The console's client at the
    # retired business Authentik went with that instance on 2026-10-25.
    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: apps/autorizare/console-hub
        property: HUB_CLIENT_ID
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: apps/autorizare/console-hub
        property: HUB_CLIENT_SECRET

    # ── The highest-value secret this service holds ──────────────────────────
    #
    # @rule MACH-1 / decision D12 — an Authentik admin token able to CREATE
    # OAuth2 providers. It can mint credentials, which makes it more valuable
    # than anything else in this Secret, and D12 requires it to have its own
    # OpenBao path for that reason: a path is the unit of rotation and of policy,
    # so sharing one with the ordinary env keys would mean rotating it on their
    # schedule and granting read on it wherever they are read.
    #
    # Minted on the estate's Authentik and kept valid by the CronJob
    # authentik-autorizare-token-reconcile, which writes it to this path.
    - secretKey: AUTHENTIK_API_TOKEN
      remoteRef:
        key: platform/authentik/autorizare-api-token
        property: token
    # ── The webhook signing secrets' sealing key ─────────────────────────────
    #
    # @rule WHK-11 / SEC-4 — the FIRST secret this service stores and reads back.
    # Everything above is either used to talk to something else or minted
    # elsewhere; a webhook signing secret is shown to its subscriber once and
    # then only ever verified, so the stored copy must be sealed and openable.
    #
    # BOTH are required, and their absence is not degradation: a deployment
    # without them boots, serves every read, and fails the first
    # CreateSubscription a new integrator makes — hours after the mistake, on the
    # one call whose result cannot be shown again.
    #
    # The ID is not itself a secret; it lives here rather than in the ConfigMap
    # so that rotating a key touches ONE OpenBao path and nothing in git. A key
    # id in a manifest and a key in a secret store is exactly the pair that
    # drifts.
    # ITS OWN PATH, not apps/autorizare/env. A path is the unit of rotation and
    # of policy here, and these two rotate for a reason nothing else on that path
    # shares — while the OpenFGA store id never rotates at all. It is also a
    # safety property of the seeding script: `bao kv put` replaces a WHOLE path,
    # so a re-seed that wrote these onto .../env would silently blank the store
    # id and the service would come up pointing at no store.
    - secretKey: WEBHOOK_SEALING_KEY_ID
      remoteRef:
        key: apps/autorizare/webhook
        property: WEBHOOK_SEALING_KEY_ID
    - secretKey: WEBHOOK_SEALING_KEY
      remoteRef:
        key: apps/autorizare/webhook
        property: WEBHOOK_SEALING_KEY
    # The estate changelog's key (the changelog's own estate-hub key: global,
    # NOT an admin — apps/changelog/src/estate.ts). Its own path, because it
    # is issued by the changelog service and rotates with it:
    # seed-changelog-hub.sh issues it in the changelog pod and writes it here.
    - secretKey: CHANGELOG_API_KEY
      remoteRef:
        key: apps/autorizare/changelog
        property: CHANGELOG_API_KEY
    # ── The mail sender ── NOT here: Polaris sends as its OWN declared
    # sender (gitops/services/plunk/senders/polaris.json, noreply@polaris.<apex>),
    # whose four EMAIL_* keys arrive through the GENERATED ExternalSecret
    # `email-sender` (email.generated.yaml, docs/email/02-onboarding.md) — one
    # per-app Plunk key, so rotating another application's key never stops
    # invitations. The deployment mounts it and assert-secrets asserts all four.

    # ── The pager (owner decision D1, audit PA3) ─────────────────────────────
    #
    # The SEND-ONLY bearer of the estate's Talk translator (talk-webhook), the
    # same path every in-cluster notifier reads (secret watcher, health digest,
    # test-report digest). It can post a message and nothing else: the Talk
    # signing key stays in the nextcloud namespace. Break-glass pages #security
    # through it the moment a window opens.
    # @rule NOTIF-1, NOTIF-7 — the estate's one Novu key and application (novu-bootstrap.sh
    # writes them). Read from the estate's path rather than copied, so a new key reaches
    # this pod through ESO and Reloader alone.
    - secretKey: NOVU_SECRET_KEY
      remoteRef: { key: apps/novu/estate, property: secret_key }
    - secretKey: NOVU_APPLICATION_ID
      remoteRef: { key: apps/novu/estate, property: application_id }
    # @rule NOTIF-5 — what estate-watch reads /ops/netrimise with: the key it already holds, from
    # the path it reads it from, so there is one thing to revoke. That path is the estate's
    # (one of its applications holds the key): its layer (components/estate/autorizare)
    # names it.
    - secretKey: CRON_WATCH_KEY
      remoteRef: { key: apps/estate-watch/env, property: CRON_WATCH_KEY }
    - secretKey: NOTIFY_TOKEN
      remoteRef:
        key: platform/talk/webhook
        property: token
---
# @rule OPS-4 — CNPG's WAL-archive credentials (barman -> Hetzner Object Storage).
#
# A SEPARATE Secret from the application's, with the AWS_* key names barman
# expects. Separate because the two rotate for different reasons: folding them
# together means a credential rotation for the app silently stops the backups,
# and a stopped backup is invisible until the day it is needed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autorizare-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: autorizare-backup-s3, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
---
# The OWNER's credential, in the form CNPG's bootstrap requires, plus the `uri`
# the migrate initContainer reads.
#
# `bootstrap.initdb.secret.name` in cnpg-cluster.yaml names this Secret, and
# naming one means the operator expects it to EXIST — CNPG generates
# `<cluster>-app` for itself only when the field is omitted, and a named-but-
# absent secret leaves the cluster in "Setting up primary" forever with the
# initdb pod in CreateContainerConfigError.
#
# `kubernetes.io/basic-auth` with exactly `username` and `password` is what CNPG
# reads; `uri` is not part of basic-auth, so a hand-supplied secret has to compose
# it or the migrate initContainer fails with "couldn't find key uri", several
# layers from the cause.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autorizare-db-app
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: autorizare-db-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        # The OWNER's DSN, used ONLY by the migration runner. `-rw` is the
        # CNPG-managed Service that always points at the current primary; never
        # address the pod.
        uri: "postgres://{{ .username }}:{{ .password }}@autorizare-db-rw.autorizare.svc:5432/autorizare?sslmode=disable"
  data:
    - secretKey: username
      remoteRef: { key: apps/autorizare/db, property: username }
    - secretKey: password
      remoteRef: { key: apps/autorizare/db, property: password }
---
# The application role's password, in the shape CNPG's managed-roles reconciler
# reads (kubernetes.io/basic-auth, username + password).
#
# SAME OpenBao key the service's own DATABASE_URL is built from, so the role's
# password and the connection string cannot disagree — one value read twice,
# never two values kept in step.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autorizare-app-credentials
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: autorizare-app-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "autorizare_app"
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: apps/autorizare/app, property: DB_APP_PASSWORD }
