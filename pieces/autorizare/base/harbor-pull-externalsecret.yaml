# The kubelet's credential for Harbor, this platform's PRIVATE registry. Without
# it the kubelet pulls anonymously and fails with "no basic auth credentials",
# which reads like a missing image rather than a missing credential.
#
# A second copy of the same ExternalSecret shipped in the openfga namespace: a
# Secret is namespaced, and the openfga pod pulls the same image for its
# authzfilter sidecar. Two objects, one OpenBao path — the value cannot drift.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: harbor-pull
    creationPolicy: Owner
    # Retain is the API server's own default, written out so the manifest says
    # what is true. Left implicit it appeared only on the live object, and Argo
    # reported the application OutOfSync forever over a field nobody had set.
    # Declared rather than added to Argo's ignore list, because four manifests
    # elsewhere set this to Merge on purpose — ignoring it would have made
    # those four invisible.
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"WLREGISTRY":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: platform/harbor/pull, property: username }
    - secretKey: password
      remoteRef: { key: platform/harbor/pull, property: password }
