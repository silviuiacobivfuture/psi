# The sign-in hub's runtime secrets. PER-KEY data[], no extract — the same rule as
# externalsecret.yaml: every one of these is load-bearing, and an empty one is
# not degraded, it is wrong.
#
#   DATABASE_URL                the application role (shared with the control plane)
#   OPENFGA_TOKEN, _STORE_ID    the engine, read through the read port
#   HUB_UPSTREAM_CLIENT_*       the hub's broker client at Authentik. The SAME path
#                               Authentik's blueprint reads (platform/authentik/
#                               autorizare-hub-oidc), so the two ends cannot drift
#   HUB_SIGNING_KEK*            the key-encryption key that seals the signing keys
#                               in Postgres. Its OWN path: it rotates for its own
#                               reason, and losing it makes every stored key
#                               unreadable — the hub then refuses to start (fail loud)
#   HUB_PERSON_LOOKUP_TOKEN     the bearer of the internal person lookup the
#                               directory's estate tile policy calls
#                               (internal/hub/person_lookup.go). ONE value at
#                               apps/autorizare/hub, read here and by Authentik
#                               (pieces/platform-secrets/authentik-estate-tiles.yaml)
#
# Seeded by infrastructure/hetzner/scripts/seed-secrets.sh ("apps/autorizare hub").
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autorizare-hub-secrets
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: autorizare-hub-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef: { key: apps/autorizare/app, property: DATABASE_URL }
    - secretKey: OPENFGA_TOKEN
      remoteRef: { key: apps/openfga/env, property: OPENFGA_AUTHN_PRESHARED_KEYS }
    - secretKey: OPENFGA_STORE_ID
      remoteRef: { key: apps/autorizare/env, property: OPENFGA_STORE_ID }
    - secretKey: HUB_UPSTREAM_CLIENT_ID
      remoteRef: { key: platform/authentik/autorizare-hub-oidc, property: client_id }
    - secretKey: HUB_UPSTREAM_CLIENT_SECRET
      remoteRef: { key: platform/authentik/autorizare-hub-oidc, property: client_secret }
    - secretKey: HUB_SIGNING_KEK_ID
      remoteRef: { key: apps/autorizare/hub, property: HUB_SIGNING_KEK_ID }
    - secretKey: HUB_SIGNING_KEK
      remoteRef: { key: apps/autorizare/hub, property: HUB_SIGNING_KEK }
    - secretKey: HUB_PERSON_LOOKUP_TOKEN
      remoteRef: { key: apps/autorizare/hub, property: HUB_PERSON_LOOKUP_TOKEN }
