# The control plane's and the hub's own identities, for the one thing they ask
# OpenBao for: an organisation's identity-provider client secret (@rule ORG-6).
# OpenBao's kubernetes auth binds a role to a service account by name
# (pieces/openbao-store/auth/declaration.json: autorizare-org-idp,
# autorizare-hub-org-idp), so each Deployment runs as its own rather than as
# `default`, which every other pod in the namespace shares.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autorizare-svc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autorizare-hub
