apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Plane's images pinned by DIGEST. The chart writes `<image>:<planeVersion>` and has no key for a
# digest, so the pin is made here, on the chart's output: each image becomes
# `<image>:<planeVersion>@sha256:…`, the tag kept for reading, the digest deciding what runs.
#
# The digests are what the estate's registry serves for those tags: the four upstream images are
# the `moved docker.io/makeplane/*` rows of infrastructure/hetzner/images.list (the amd64 manifest
# the mirror holds), the backend is apps/plane-sso's build (build.sh --push prints it). A version
# bump moves planeVersion, the backend path in values.yaml, the images.list rows AND these lines in
# the same change: an `images` entry whose name no longer matches pins nothing, so
# .github/scripts/tests/plane-digests_test.sh refuses a rendered Plane workload without one.
#
# Listed in ../kustomization.yaml BEFORE the estate's own component, which therefore sees (and may
# act on) the pinned images.
images:
  - name: WLREGISTRY/WLAPPS/plane-backend-sso/f9b8831d4e3e
    newTag: v1.4.2
    digest: sha256:139a5e35d91b507f3b3c475347f5bccc20af27d0a6a1f724fec6b11c7a7ab56a
  - name: WLREGISTRY/mirror/docker.io/makeplane/plane-live
