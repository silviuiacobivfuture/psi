# Stalwart — the estate's own mail server (<MAIL_HOST_PREFIX>.<apex>; upstream's unchanged
# image). Order is documentation only.
#
#   settings.yaml         the estate's hosts, resolved once; the data-store file
#   externalsecrets.yaml  the administrator, the SES SMTP credential
#   certificate.yaml      <MAIL_HOST>'s certificate (cert-manager), fed into Stalwart by the plan
#   stalwart.yaml         the server (mail ports as hostPorts, so senders keep their address),
#                         its RocksDB volume, its in-cluster web Service
#   mailboxes.yaml        the estate's mailboxes (empty in SEB; the estate's layer lists them)
#   config-job.yaml       the configuration plan, applied after every sync and daily; then every
#                         listener it declares must answer (listeners.sh)
#   bulwark.yaml          the mail client (Bulwark) at <BULWARK_HOST>: JMAP on this server,
#                         signed in only through Authentik, the estate's theme by default
#   ingress.yaml          <MAIL_ADMIN_HOST> (Stalwart's own pages) behind the Authentik gate;
#                         <BULWARK_HOST> (Bulwark, and the server's JMAP paths on the same host)
#
#   admins.yaml           the server's administrators follow Authentik's groups (app-mail-admin,
#                         platform-admins), every five minutes (admins.sh)
#
#   backup.yaml           the daily CONSISTENT backup: server stopped, data archived, started,
#                         archive to object storage (restore: scripts/restore-stalwart.sh)
#
# Backups: backup.yaml is the one to restore from; Velero's 6-hourly file-system copy of the
# live volume is only crash-consistent.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - settings.yaml
  - externalsecrets.yaml
  - certificate.yaml
  - stalwart.yaml
  - mailboxes.yaml
  - config-job.yaml
  - bulwark.yaml
  - ingress.yaml
  - sso-start.yaml
  - admins.yaml
  - backup.yaml
configMapGenerator:
  # The plan and its renderer. The name hash rolls the CronJob's and the hook Job's pods
  # onto a changed plan; Argo re-runs the hook on every sync anyway.
  - name: stalwart-plan
    files:
      - plan.ndjson.tmpl
      - render-plan.sh
      - unlink.sh
      - listeners.sh
  # The administrators' reconcile (admins.yaml), its own ConfigMap so the plan's hash is not
  # rolled by it.
  - name: stalwart-admins
    files:
      - admins.sh
  # Bulwark's seed (bulwark/seed-config.mjs) and its look: SEB's neutral default (Bulwark's own
  # colours, a plain mark), which an estate's layer replaces (the `bulwark-theme` slot).
  # The panels' sign-in start (sso-start.yaml): its page, the start, its server's routes.
  - name: stalwart-sso-start
    files:
      - sso-start/start.html
      - sso-start/start.mjs
      - sso-start/nginx.conf
  - name: bulwark-seed
    files:
      - bulwark/seed-config.mjs
      - bulwark/extensions.mjs
  - name: bulwark-theme
    files:
      - bulwark/estate.css
      - bulwark/logo.svg
      - bulwark/logo-dark.svg
      - bulwark/favicon.svg
