# The sign-in start's server (sso-start.yaml). Three answers, each for both panels:
#   /<panel>/_sso/start.mjs   the start itself
#   /<panel>/_sso/account     the gate's identity of the person (X-authentik-email, set by the
#                             Authentik forward-auth middleware on every request to this host), as
#                             text: only a login hint, never trusted for who signs in
#   /<panel>[/...]            the page that runs the start
# Anything else is not ours: 404.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location ~ ^/(admin|account)/_sso/start\.mjs$ {
        types { }
        default_type text/javascript;
        try_files /start.mjs =404;
    }
    location ~ ^/(admin|account)/_sso/account$ {
        default_type text/plain;
        return 200 $http_x_authentik_email;
    }
    location ~ ^/(admin|account)(/|$) {
        types { }
        default_type text/html;
        try_files /start.html =404;
    }
    location / {
        return 404;
    }
}
