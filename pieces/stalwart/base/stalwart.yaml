# The mail server: Stalwart v1 (upstream's unchanged image), one replica on its RocksDB volume.
# It binds the mail ports itself (25, 465, 587, 993): the image's binary carries the
# NET_BIND_SERVICE file capability, so that one capability is added back after dropping all
# (without it the binary cannot even be executed), and nothing else. Recreate: RocksDB takes a
# process lock, two pods on one volume never start.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stalwart-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 10Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalwart
  labels:
    app.kubernetes.io/name: stalwart
  annotations:
    reloader.stakater.com/auto: "true"
    alerts/owner: WLOPSEMAIL
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: assert-secrets
          image: WLREGISTRY/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
          envFrom:
            - secretRef: { name: stalwart-admin }
          command: ["sh", "-c"]
          args:
            - |
              [ -n "${STALWART_PASSWORD:-}" ] || { echo "MISSING REQUIRED SECRET: STALWART_PASSWORD (apps/stalwart/admin)" >&2; exit 1; }
              echo "all required secrets present"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
      containers:
        - name: stalwart
          image: WLREGISTRY/mirror/docker.io/stalwartlabs/stalwart:v1.0.3@sha256:e01129152d3684a6350feae33a3c4fc852538ec5fcdbd1ca8de3cb7e493b68d6
          args: ["--config", "/etc/stalwart/config.json"]
          env:
            - name: STALWART_RECOVERY_ADMIN
              valueFrom: { secretKeyRef: { name: stalwart-admin, key: STALWART_RECOVERY_ADMIN } }
            - name: STALWART_PUBLIC_URL
              valueFrom: { configMapKeyRef: { name: stalwart-settings, key: STALWART_PUBLIC_URL } }
            - { name: STALWART_HOSTNAME, value: stalwart }
          ports:
            - { name: http, containerPort: 8080 }
            # The mail ports straight on the node (hostPort, the CNI's DNAT), so the server sees
            # each sender's real address: SPF, DMARC, IPREV and the auto-ban judge by it. Through a
            # servicelb LoadBalancer every connection arrived from the svclb pod's address and every
            # sender failed SPF (seen on the first estate to run it, 2026-11-12). The Hetzner firewall opens them
            # (modules/k3s, expose_mail); one replica, Recreate, so the ports are never held twice.
            - { name: smtp, containerPort: 25, hostPort: 25 }
            - { name: submissions, containerPort: 465, hostPort: 465 }
            - { name: submission, containerPort: 587, hostPort: 587 }
            - { name: imaps, containerPort: 993, hostPort: 993 }
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"], add: ["NET_BIND_SERVICE"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/stalwart }
            - { name: config, mountPath: /etc/stalwart, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: stalwart-data }
        - name: config
          configMap: { name: stalwart-config }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
---
# Inside the cluster: the web interface (account manager, admin) and the configuration API.
apiVersion: v1
kind: Service
metadata:
  name: stalwart
spec:
  selector: { app.kubernetes.io/name: stalwart }
  ports:
    - { name: http, port: 8080, targetPort: http }
