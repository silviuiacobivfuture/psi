---
# What the listeners step may do: see the server's pods and Deployment, and delete its pod once
# so the Deployment starts it again with every listener bound. Nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stalwart-config
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stalwart-config
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["stalwart"]
    verbs: ["get", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stalwart-config
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: stalwart-config }
subjects:
  - { kind: ServiceAccount, name: stalwart-config }
