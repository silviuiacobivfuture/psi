# The webmail: Roundcube 1.7 (upstream's unchanged image), at <WEBMAIL_HOST>. Stalwart v1 ships
# no webmail of its own and its web interface takes a logo only in the Enterprise edition, so
# people read mail here, in a client the estate themes (the estate_theme plugin), and Stalwart's
# own pages (<MAIL_HOST>) stay for administrators and for app passwords.
#
# Signed in ONLY through Authentik (webmail/estate.php): the gate at the edge, then Roundcube's
# OIDC sign-in (the public `mail-oidc` client, PKCE), whose access token is the IMAP and SMTP
# credential (OAUTHBEARER) the mail server validates itself. No password is ever typed into Roundcube.
#
# Runs as www-data on 8080 with a read-only root: the image copies itself into an emptyDir at
# start (its entrypoint), keeps preferences in SQLite on a small volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webmail-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webmail
  labels:
    app.kubernetes.io/name: webmail
  annotations:
    reloader.stakater.com/auto: "true"
    alerts/owner: WLOPSEMAIL
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: webmail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webmail
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: assert-secrets
          image: WLREGISTRY/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
          envFrom:
            - secretRef: { name: webmail-app }
          command: ["sh", "-c"]
          args:
            - |
              for k in DES_KEY; do
                eval "v=\${$k:-}"
                [ -n "$v" ] || { echo "MISSING REQUIRED SECRET: $k" >&2; exit 1; }
              done
              echo "all required secrets present"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
      containers:
        - name: roundcube
          image: WLREGISTRY/mirror/docker.io/roundcube/roundcubemail:1.7.6-apache@sha256:ecf8a57da1d2c4a54285be9fac1ae2ed145d84567c6af449afe28bfd0f28b558
          envFrom:
            - configMapRef: { name: stalwart-settings }
            - secretRef: { name: webmail-app }
          env:
            - { name: ROUNDCUBEMAIL_SKIN, value: elastic }
            - { name: ROUNDCUBEMAIL_PLUGINS, value: "archive,zipdownload" }
            - { name: ROUNDCUBEMAIL_DB_DIR, value: /var/roundcube/db }
          ports:
            - { name: http, containerPort: 8080 }
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /index.php, port: http }
            periodSeconds: 15
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
            failureThreshold: 4
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }
          volumeMounts:
            - { name: html, mountPath: /var/www/html }
            - { name: theme, mountPath: /var/roundcube/estate_theme, readOnly: true }
            - { name: tasks, mountPath: /entrypoint-tasks/post-setup, readOnly: true }
            - { name: config, mountPath: /var/roundcube/config, readOnly: true }
            - { name: data, mountPath: /var/roundcube/db }
            - { name: tmp, mountPath: /tmp }
            - { name: run, mountPath: /var/run/apache2 }
            - { name: lock, mountPath: /var/lock/apache2 }
            - { name: apache, mountPath: /etc/apache2/ports.conf, subPath: apache.conf, readOnly: true }
            - { name: apache, mountPath: /etc/apache2/sites-enabled/000-default.conf, subPath: empty.conf, readOnly: true }
      volumes:
        - name: html
          emptyDir: { sizeLimit: 256Mi }
        - name: theme
          configMap: { name: webmail-theme }
        - name: config
          configMap: { name: webmail-config }
        - name: data
          persistentVolumeClaim: { claimName: webmail-data }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        - name: run
          emptyDir: { sizeLimit: 1Mi }
        - name: lock
          emptyDir: { sizeLimit: 1Mi }
        - name: apache
          configMap: { name: webmail-apache }
        - name: tasks
          configMap: { name: webmail-tasks, defaultMode: 0555 }
---
apiVersion: v1
kind: Service
metadata:
  name: webmail
spec:
  selector: { app.kubernetes.io/name: webmail }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# The mail server's IMAP and submission ports inside the cluster, for the webmail. Roundcube
# checks the server's certificate against <MAIL_HOST> (peer_name), so the hop stays verified.
apiVersion: v1
kind: Service
metadata:
  name: stalwart-mail
spec:
  selector: { app.kubernetes.io/name: stalwart }
  ports:
    - { name: imaps, port: 993, targetPort: imaps }
    - { name: submission, port: 587, targetPort: submission }
