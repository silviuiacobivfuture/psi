# The mail server's secrets, synced from OpenBao by ESO; values live ONLY in OpenBao (seeded by
# infrastructure/hetzner/scripts/seed-secrets.sh, seed_stalwart). Contract:
# gitops/services/APP-SECRETS.md (stalwart). Per-key data[] so an absent property fails loud.
#
# stalwart-admin: the server's administrator, Stalwart's recovery administrator (an
#   environment credential, never stored in its database). The configuration job signs in
#   with it; a person uses it only as break-glass at https://<MAIL_ADMIN_HOST>/admin.
#   WHY IT STAYS SET (measured on v1.0.3, 2026-11-12): Stalwart advises removing it once it is
#   not needed, but the configuration job has no other way in. Once the directory is the
#   estate's sign-in (OIDC), every account's credentials are the directory's: the server
#   refuses to give any account a password or an API key ("Cannot set credentials for accounts
#   in an external directory"), a service account's password set before the switch is refused
#   after a restart (401), and the recovery administrator cannot make an API key itself (it is
#   not an account: `notFound`). Removing it would stop the plan (mailboxes, certificate
#   renewals, the SES route) on the next run. It is a 32-character value from OpenBao, read only
#   by the server and the job, rotated by re-seeding apps/stalwart/admin (Reloader restarts the
#   server).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-admin
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: stalwart-admin
    creationPolicy: Owner
    template:
      data:
        STALWART_RECOVERY_ADMIN: "admin:{{ .password }}"
        STALWART_USER: admin
        STALWART_PASSWORD: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef: { key: apps/stalwart/admin, property: password }
---
# stalwart-ses: the SMTP credential of the estate's Amazon SES sender, derived from the SES
# IAM key (secret/platform/ses/admin) by seed_stalwart. Outbound mail to the world leaves
# through SES; the server itself never talks to port 25 of another host.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-ses
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: stalwart-ses
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef: { key: apps/stalwart/ses-smtp, property: username }
    - secretKey: password
      remoteRef: { key: apps/stalwart/ses-smtp, property: password }
    - secretKey: host
      remoteRef: { key: apps/stalwart/ses-smtp, property: host }
---
# bulwark-app: Bulwark's session key (encrypts its remembered sessions and the settings it syncs
# for people) and its admin password (used only by the bulwark-extensions job; Stalwart's
# administrators open the dashboard without it). Bulwark signs in with the public `mail-oidc`
# client and holds no client secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bulwark-app
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: bulwark-app
    creationPolicy: Owner
  data:
    - secretKey: SESSION_SECRET
      remoteRef: { key: apps/stalwart/bulwark, property: session_secret }
    - secretKey: ADMIN_PASSWORD
      remoteRef: { key: apps/stalwart/bulwark, property: admin_password }
---
# bulwark-ai: the estate's Anthropic key for Bulwark's AI Assistant, an OPTIONAL slot
# (platform/anthropic/api `key`, seeded empty by seed_stalwart). Empty: the assistant is installed
# and off. Read only by the bulwark-extensions job, which hands it to Bulwark's server-side plugin
# store; it never reaches a browser.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bulwark-ai
spec:
  refreshInterval: 15m
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: bulwark-ai
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef: { key: platform/anthropic/api, property: key }
