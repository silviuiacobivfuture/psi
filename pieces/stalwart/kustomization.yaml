# SEB piece `stalwart`: the estate's own mail server (Stalwart v1). Delivered in the SEB bundle,
# rendered at build time (tools/bundle/build.mjs). Deployed where the estate's platform
# applications include `stalwart` (tools/estate-pieces.json); the cluster's firewall opens the
# mail ports only there too (identity-tf.sh → expose_mail).
#
# The estate's values come from its identity (the whitelabel component), each into ONE place
# first (stalwart-settings) and carried from there:
#   MAIL_HOST_PREFIX + BASE_DOMAIN    → MAIL_HOST (post.<apex>): SMTP/IMAP name, MX target,
#                                       the certificate — the mail node, for mail only
#   BULWARK_HOST_PREFIX + BASE_DOMAIN → BULWARK_HOST (mail.<apex>): Bulwark, the server's JMAP
#                                       paths beside it, its hub tile (into bulwark-settings)
#   MAIL_ADMIN_HOST_PREFIX + BASE_DOMAIN → MAIL_ADMIN_HOST (mail-admin.<apex>): Stalwart's own
#                                       pages (admin, app passwords), their certificate, the
#                                       server's public URL — on the web ingress
#   BRAND_TITLE                       → the mail client's name
#   MAILBOX_DOMAIN                    → the mailboxes' domain (<user>@<this>)
#   AUTHENTIK_HOST                    → the OIDC issuer
#   REGISTRY_HOST                     → the images (Harbor's mirror)
#   OPS_EMAIL                         → who is paged
# The estate's mailboxes come from its layer (../../components/estate/stalwart).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: stalwart
resources:
  - base

components:
  # Argo's prune/delete guard on the PVC rendered here (the mail).
  - ../../components/prune-guard
  - ../../components/whitelabel
  - ../../components/estate/stalwart

replacements:
  - path: whitelabel-replacements.yaml
  # MAIL_HOST and MAIL_ADMIN_HOST: <prefix>.<BASE_DOMAIN>, resolved ONCE into
  # stalwart-settings.
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.BASE_DOMAIN }
    targets:
      - select: { kind: ConfigMap, name: stalwart-settings }
        fieldPaths: [data.MAIL_HOST, data.MAIL_ADMIN_HOST]
        options: { delimiter: ".", index: 1 }
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.MAIL_HOST_PREFIX }
    targets:
      - select: { kind: ConfigMap, name: stalwart-settings }
        fieldPaths: [data.MAIL_HOST]
        options: { delimiter: ".", index: 0 }
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.MAIL_ADMIN_HOST_PREFIX }
    targets:
      - select: { kind: ConfigMap, name: stalwart-settings }
        fieldPaths: [data.MAIL_ADMIN_HOST]
        options: { delimiter: ".", index: 0 }
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.MAILBOX_DOMAIN }
    targets:
      - select: { kind: ConfigMap, name: stalwart-settings }
        fieldPaths: [data.MAILBOX_DOMAIN]
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.AUTHENTIK_HOST }
    targets:
      - select: { kind: ConfigMap, name: stalwart-settings }
        fieldPaths: [data.AUTHENTIK_HOST]
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.BRAND_TITLE }
    targets:
      - select: { kind: ConfigMap, name: stalwart-settings }
        fieldPaths: [data.BRAND_TITLE]
  - source: { kind: ConfigMap, name: stalwart-settings, fieldPath: data.MAIL_HOST }
    targets:
      - select: { kind: Certificate, name: stalwart-mail }
        fieldPaths: [spec.dnsNames.0]
  - source: { kind: ConfigMap, name: stalwart-settings, fieldPath: data.MAIL_ADMIN_HOST }
    targets:
      - select: { kind: Ingress, name: stalwart-admin }
        fieldPaths: [spec.rules.0.host, spec.tls.0.hosts.0]
      - select: { kind: Ingress, name: stalwart-admin-callback }
        fieldPaths: [spec.rules.0.host, spec.tls.0.hosts.0]
      - select: { kind: Ingress, name: stalwart-admin-sso }
        fieldPaths: [spec.rules.0.host, spec.tls.0.hosts.0]
      - select: { kind: ConfigMap, name: stalwart-settings }
        fieldPaths: [data.STALWART_PUBLIC_URL]
        options: { delimiter: "/", index: 2 }
  # Bulwark (base/bulwark.yaml): BULWARK_HOST = <BULWARK_HOST_PREFIX>.<BASE_DOMAIN>, resolved ONCE
  # into bulwark-settings and carried from there; the issuer, Stalwart's account page and the
  # brand from stalwart-settings.
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.BASE_DOMAIN }
    targets:
      - select: { kind: ConfigMap, name: bulwark-settings }
        fieldPaths: [data.BULWARK_HOST]
        options: { delimiter: ".", index: 1 }
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.BULWARK_HOST_PREFIX }
    targets:
      - select: { kind: ConfigMap, name: bulwark-settings }
        fieldPaths: [data.BULWARK_HOST]
        options: { delimiter: ".", index: 0 }
  - source: { kind: ConfigMap, name: bulwark-settings, fieldPath: data.BULWARK_HOST }
    targets:
      - select: { kind: ConfigMap, name: bulwark-settings }
        fieldPaths: [data.JMAP_SERVER_URL]
        options: { delimiter: "/", index: 2 }
      - select: { kind: Ingress, name: bulwark }
        fieldPaths: [spec.rules.0.host, spec.tls.0.hosts.0]
      - select: { kind: Ingress, name: bulwark-jmap }
        fieldPaths: [spec.rules.0.host, spec.tls.0.hosts.0]
      - select: { kind: Ingress, name: bulwark }
        fieldPaths: ["metadata.annotations.[gethomepage.dev/href]"]
        options: { delimiter: "/", index: 2 }
  - source: { kind: ConfigMap, name: stalwart-settings, fieldPath: data.AUTHENTIK_HOST }
    targets:
      - select: { kind: ConfigMap, name: bulwark-settings }
        fieldPaths: [data.OAUTH_ISSUER_URL]
        options: { delimiter: "/", index: 2 }
  - source: { kind: ConfigMap, name: stalwart-settings, fieldPath: data.MAIL_ADMIN_HOST }
    targets:
      - select: { kind: ConfigMap, name: bulwark-settings }
        fieldPaths: [data.ACCOUNT_MANAGEMENT_URL]
        options: { delimiter: "/", index: 2 }
  - source: { kind: ConfigMap, name: stalwart-settings, fieldPath: data.BRAND_TITLE }
    targets:
      - select: { kind: ConfigMap, name: bulwark-settings }
        fieldPaths: [data.APP_NAME, data.APP_SHORT_NAME, data.LOGIN_COMPANY_NAME]
  # The daily backup's object storage (backup.yaml): the estate's region, endpoint and bucket.
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.OBJECT_STORAGE_REGION }
    targets:
      - select: { kind: CronJob, name: stalwart-backup }
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=upload].env.[name=AWS_REGION].value
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.OBJECT_STORAGE_ENDPOINT }
    targets:
      - select: { kind: CronJob, name: stalwart-backup }
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=upload].env.[name=AWS_ENDPOINT_URL].value
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.BUCKET_PREFIX }
    targets:
      - select: { kind: CronJob, name: stalwart-backup }
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=upload].env.[name=BUCKET].value
        options: { delimiter: "-", index: 0 }
  # Who is paged for a workload: the estate's operations address (the key is moved to
  # alerts.<apex>/owner by ../../components/alert-owner).
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.OPS_EMAIL }
    targets:
      - select: { annotationSelector: alerts/owner }
        fieldPaths: [metadata.annotations.alerts/owner]
transformers:
  - ../../components/alert-owner
