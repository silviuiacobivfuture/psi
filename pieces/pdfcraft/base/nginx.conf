# nginx MAIN config for PDFCraft — replaces the image's /etc/nginx/nginx.conf.
#
# It differs from the stock nginx:1.25-alpine one in exactly what running as a
# non-root user on a READ-ONLY root filesystem requires, and nothing else:
#   - no `user` directive (meaningless when not started as root);
#   - pid and every temp path under /tmp, the pod's one writable emptyDir;
#   - logs straight to the container's stdout/stderr;
#   - a fixed worker count: `auto` means one worker per NODE cpu, not per the
#     pod's cpu limit;
#   - server_tokens off, and relative redirects (TLS ends at Traefik).
# The site itself — routes, caching, the COOP/COEP headers the WebAssembly tools
# need — is upstream's /etc/nginx/conf.d/default.conf, untouched.
#
# OUR CUSTOMISATION (the owner, 2026-10-28: "a lot in Chinese, and a lot of
# marketing I don't want; customize it while staying resilient to future
# updates") is the `server` at the bottom: a front on :8080 that proxies to
# upstream's untouched server on 127.0.0.1:80. Upstream's files are never edited,
# so a new image cannot silently undo or conflict with any of this.
# njs, for /_${ESTATE_SLUG}/me (base/me.js) — shipped in the image, loaded here.
load_module modules/ngx_http_js_module.so;

worker_processes  2;

error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout  main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;
    # Behind Traefik's TLS, nginx sees plain http on :80. Its directory redirect
    # (/en/tools/merge-pdf → …/merge-pdf/) would otherwise be written as an
    # ABSOLUTE http://<host>/… URL — a scheme downgrade on every tool link. A
    # relative Location keeps the browser on https.
    absolute_redirect  off;

    # Upstream's site: `listen 80`, served to the front below only. The pod's
    # NetworkPolicy admits :8080 alone, so nothing outside the pod reaches :80.
    include /etc/nginx/conf.d/*.conf;

    # Which upstream responses the front may receive COMPRESSED. sub_filter can
    # only rewrite plain text, so pages (paths without a static-file extension,
    # .html, the .txt route payloads) are fetched uncompressed and the front
    # gzips them itself; every static asset keeps upstream's own compression.
    map $uri $${ESTATE_SLUG}_upstream_ae {
        # The JS chunks are rewritten (Romanian for upstream's hardcoded Chinese),
        # so they too come uncompressed. Listed FIRST: map regexes match in order.
        ~^/_next/static/chunks/  "";
        ~*\.(js|mjs|css|wasm|data|bin|json|svg|woff2?|ttf|otf|eot|png|jpe?g|gif|webp|avif|ico|gz|map|pdf)$  $http_accept_encoding;
        default  "";
    }

    # The account endpoint's handler (base/me.js).
    js_import ${ESTATE_SLUG}_me from /etc/nginx/${ESTATE_SLUG}/me.js;
    # Romanian for upstream's English tool names, descriptions and messages
    # (base/ro.js, from base/ro-overrides.json).
    js_import ${ESTATE_SLUG}_ro from /etc/nginx/${ESTATE_SLUG}/ro.js;

    # ---- THE FRONT ----------------------------------------------------------
    server {
        listen 8080 default_server;
        server_name _;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_min_length 256;
        gzip_types text/plain text/css application/javascript application/json;

        # ── ROUTING (owner, 2026-10-28: "only the landing pages … an entry point")
        # Reachable: OUR entry page at `/`, and their Studio, tools, workflow and
        # FAQ in Romanian. Everything else is sent to one of those.
        #
        # `/` → the tools index, until our own landing page is deployed in front.
        location = / {
            return 302 /ro/tools/;
        }
        location = /index.html {
            return 302 /;
        }
        # THEIR home and their marketing pages → our entry point. The .txt files
        # are the payloads their router fetches for an in-app navigation; they are
        # redirected too, or a click on their logo would render their home
        # without ever passing through here.
        location ~ "^/ro(/(index\.(html|txt))?)?$" {
            return 302 /;
        }
        location ~ "^/ro/(about|contact|privacy|terms|cookies)(/|\.|$)" {
            return 302 /;
        }
        # Every OTHER locale prefix → the same path under /ro/. Matched by SHAPE
        # (two letters, optionally -XX), not by a list, so a locale upstream adds
        # later is redirected too. No shared asset directory has that shape
        # (_next, fonts, images, web, workers, *-wasm, pdfjs-*, 404).
        # 302, not 301: nothing here should be cached for ever.
        location ~ "^/(?!ro(/|$))[a-z]{2}(-[A-Z]{2})?$" {
            return 302 /ro/;
        }
        location ~ "^/(?!ro/)[a-z]{2}(?:-[A-Z]{2})?/(.*)$" {
            return 302 /ro/$1$is_args$args;
        }

        # Our script (gitops/services/pdfcraft/base/${ESTATE_SLUG}.js): switches their
        # GitHub update check off and adds the „realizat cu PDFCraft” credit.
        location = /_${ESTATE_SLUG}/${ESTATE_SLUG}.js {
            alias /etc/nginx/${ESTATE_SLUG}/${ESTATE_SLUG}.js;
            default_type application/javascript;
            add_header Cache-Control "public, max-age=0, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
        }

        # The estate's bar (apps/pdfcraft-bar, built into base/bar.js).
        location = /_${ESTATE_SLUG}/bar.js {
            alias /etc/nginx/${ESTATE_SLUG}/bar.js;
            default_type application/javascript;
            add_header Cache-Control "public, max-age=0, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
        }

        # The signed-in person, as the forward-auth gate passed them: JSON built
        # by JSON.stringify in njs (base/me.js), never spliced into markup.
        location = /_${ESTATE_SLUG}/me {
            js_content ${ESTATE_SLUG}_me.me;
        }

        # Our one stylesheet (gitops/services/pdfcraft/base/${ESTATE_SLUG}.css).
        location = /_${ESTATE_SLUG}/${ESTATE_SLUG}.css {
            alias /etc/nginx/${ESTATE_SLUG}/${ESTATE_SLUG}.css;
            default_type text/css;
            add_header Cache-Control "public, max-age=0, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
        }

        # Upstream's JS chunks, in Romanian, from base/ro-overrides.json:
        #   - its hardcoded Chinese (the Workflow templates, the node counter), by
        #     sub_filter rules GENERATED from the map (tools/ro-overrides.py);
        #   - its English tool names and descriptions (the catalogue the Studio and
        #     the workflow editor list), by base/ro.js, string by string.
        # ONLY those run here — never the </head> injection, which inside a JS
        # string would break the script. A string upstream changes stays
        # untranslated; nothing breaks. Their `immutable` one-year cache is
        # replaced by one day, so a change to the map reaches browsers within a
        # day; the conditional headers are not forwarded, so a browser holding an
        # untranslated copy is never told by upstream that it is still current.
        location ^~ /_next/static/chunks/ {
            proxy_pass http://127.0.0.1:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding $${ESTATE_SLUG}_upstream_ae;
            proxy_set_header If-None-Match "";
            proxy_set_header If-Modified-Since "";
            proxy_max_temp_file_size 0;
            js_header_filter ${ESTATE_SLUG}_ro.headers;
            js_body_filter ${ESTATE_SLUG}_ro.body buffer_type=buffer;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            add_header Cache-Control "public, max-age=86400" always;
            sub_filter_types application/javascript;
            sub_filter_once off;
            include /etc/nginx/${ESTATE_SLUG}/ro-overrides.conf;
        }

        # THEIR PAGES and the .txt route payloads, in Romanian: every tool's name
        # and description and the messages upstream's ro.json lacks, by base/ro.js
        # (njs — sub_filter takes at most 255 patterns a location, far too few).
        # Only these paths go through it: it holds a response whole before
        # rewriting, which is right for a page and wrong for a 30 MiB
        # WebAssembly file, so every static asset stays in `location /` below.
        # Otherwise the same as `location /`.
        location ~ "(/|\.html|\.txt)$" {
            proxy_pass http://127.0.0.1:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding $${ESTATE_SLUG}_upstream_ae;
            proxy_set_header If-None-Match "";
            proxy_set_header If-Modified-Since "";
            proxy_max_temp_file_size 0;
            js_header_filter ${ESTATE_SLUG}_ro.headers;
            js_body_filter ${ESTATE_SLUG}_ro.body buffer_type=buffer;
            sub_filter '</head>' '<link rel="stylesheet" href="/_${ESTATE_SLUG}/${ESTATE_SLUG}.css"><script src="/_${ESTATE_SLUG}/${ESTATE_SLUG}.js"></script><script src="/_${ESTATE_SLUG}/bar.js" defer></script></head>';
            sub_filter '<link rel="manifest" href="/manifest.webmanifest"/>' '<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials"/>';
            sub_filter_once on;
            sub_filter_types text/html;
        }

        location / {
            proxy_pass http://127.0.0.1:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding $${ESTATE_SLUG}_upstream_ae;
            # STREAM, never spool to disk: the LibreOffice WebAssembly is tens of
            # MiB and /tmp is a 64Mi emptyDir. A disk-buffered response would
            # fill it and get the pod evicted.
            proxy_max_temp_file_size 0;
            # One stylesheet of ours, before </head>, on every page: the estate's
            # colours and font, and the hiding of their footer and social links.
            sub_filter '</head>' '<link rel="stylesheet" href="/_${ESTATE_SLUG}/${ESTATE_SLUG}.css"><script src="/_${ESTATE_SLUG}/${ESTATE_SLUG}.js"></script><script src="/_${ESTATE_SLUG}/bar.js" defer></script></head>';
            # Browsers fetch a web-app manifest WITHOUT credentials unless told
            # otherwise, so the Authentik gate answered it with a redirect to the
            # sign-in and the console showed a CORS error on every page. Asking for
            # it WITH the session cookie keeps the gate closed on everything. If
            # upstream changes this markup the rule matches nothing: the console
            # error returns, nothing breaks.
            sub_filter '<link rel="manifest" href="/manifest.webmanifest"/>' '<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials"/>';
            sub_filter_once on;
            sub_filter_types text/html;
        }
    }
}
