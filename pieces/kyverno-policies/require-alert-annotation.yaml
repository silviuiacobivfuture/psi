# Require an alert-owner annotation on every long-running / scheduled workload, so
# nothing ships without a declared alert route. The annotation `alerts.<ESTATE_LABEL_DOMAIN>/owner`
# names who/what is paged when this workload fails — it pairs with the EXTERNAL Axiom
# alerting (infrastructure/hetzner/modules/axiom/monitors.tf: workload crashloop/OOM,
# CronJob/backup failed) so a crashing Deployment or a dead backup CronJob has an owner,
# not just a fired monitor. Mirrors the require-run-as-non-root.yaml structure.
#
# Mode: AUDIT (2026-06-22, initial). Existing app workloads are NOT yet annotated, so
# Enforce would block their next sync. This runs in `background: true` → PolicyReports
# list the un-annotated workloads; annotate each (add the annotation to its gitops
# manifest), then flip `validationFailureAction: Enforce`. Same staged convention the
# kustomization header documents.
# EXCLUDED namespaces: the same system/platform set the other baseline policies exclude
# (Helm-managed components we do not own the templates for).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-alert-annotation
  annotations:
    policies.kyverno.io/title: Require alert-owner annotation
    policies.kyverno.io/category: Observability / Alerting
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment, StatefulSet, CronJob
    policies.kyverno.io/description: >-
      Long-running (Deployment/StatefulSet) and scheduled (CronJob) workloads must
      carry the alerts/owner annotation declaring their alert route, so a
      failure has a named owner alongside the external Axiom failure monitors.
spec:
  validationFailureAction: Audit
  background: true
  failurePolicy: Ignore
  rules:
    - name: require-alert-owner
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - CronJob
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                - argocd
                - arc-systems
                - arc-runners
                - tailscale
                - openbao
                - harbor
                - external-secrets
                - cert-manager
                - external-dns
                - observability
                - monitoring
                - system-upgrade
                - velero
      validate:
        message: >-
          Workload must set the alerts/owner annotation (a non-empty alert
          route, e.g. an email or team handle) so failures have a declared owner.
        pattern:
          metadata:
            annotations:
              alerts/owner: "?*" # key renamed to alerts.<ESTATE_LABEL_DOMAIN>/owner (kustomization.yaml)
