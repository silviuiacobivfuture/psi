# Kyverno ClusterPolicies — platform security guardrails (Argo app
# `kyverno-policies`). Each policy is cluster-scoped, runs in `background: true`
# (audit existing live workloads → PolicyReports) and EXCLUDES the system/platform
# namespaces that legitimately run privileged Helm components (kube-system, kyverno,
# argocd, arc-systems, arc-runners, tailscale, openbao, harbor, external-secrets,
# cert-manager, external-dns, observability). Mirrors the Pod Security
# baseline→restricted profile intent.
#
# EXCEPTION: `require-reloader-annotation` deliberately uses a MUCH narrower exclude
# list (kube-system/kube-public/kube-node-lease + argocd + harbor only) — the
# platform namespaces the other policies exclude are exactly the ones whose secret
# rotation it has to cover. Its per-namespace reasoning is in that file's header.
#
# validationFailureAction per policy is set in-file: Audit unless ALL current
# app-namespace workloads already pass it (then Enforce). See each policy header.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - require-requests-limits.yaml
  - disallow-latest-tag.yaml
  - disallow-privileged.yaml
  - require-run-as-non-root.yaml
  - disallow-host-namespaces-and-hostpath.yaml
  - require-alert-annotation.yaml
  - require-reloader-annotation.yaml
  # Operability rather than security: every Ingress carries the hub discovery
  # annotations, so a deployed service cannot be invisible on the one page an
  # operator looks at first. AUDIT deliberately and probably permanently — a tile
  # is not worth refusing a deployment over, and the convention it replaces had
  # already failed twice as prose. Its static-tile half (components with no
  # Ingress, which Kyverno cannot see) is checked by the architecture test in
  # apps/autorizare-svc/internal/architecture.
  - require-hub-annotation.yaml
  # MUTATE (not a validation): injects resources onto Plane's migrator Job, the
  # one workload whose chart ships none and exposes no values key — so
  # require-requests-limits can stay ENFORCE instead of excluding the namespace.
  - mutate-plane-migrator-resources.yaml
  # MUTATE: turns off kubelet's legacy service-link env injection for the Plane
  # frontend workloads — PLANE_ADMIN_PORT collides with the var name the app
  # reads, making every god-mode link point at the in-cluster port 3000.
  - mutate-plane-service-links.yaml
  # MUTATE: adds the ESO-managed harbor-pull Secret to Plane pods running our
  # own-built backend (apps/plane-sso); the chart could only render one from
  # plaintext values.
  - mutate-plane-harbor-pull.yaml
  # MUTATE: injects reloader.stakater.com/auto + the alert-owner annotation onto
  # ReportPortal's workloads (the chart exposes podAnnotations only, which neither
  # consumer reads) and the pod securityContext onto its pre-upgrade hook Job (the
  # one workload the chart's securityContext helper skips) — so
  # require-reloader-annotation, require-alert-annotation and require-run-as-non-root
  # can all stay ENFORCE instead of excluding the namespace.
  - mutate-reportportal-annotations.yaml
  # Scratch values (local-config, never rendered).
  - estate-values.yaml

# Estate values come from the identity (the whitelabel component, generated by the bundle
# builder from the estate's identity), never written in the policies: the alert owner, the
# registry and the alert-owner annotation's key alerts.<ESTATE_LABEL_DOMAIN>/owner (written
# `alerts/owner` in the policies). The estate's own additions (e.g. its namespaces excluded
# from require-run-as-non-root) come from components/estate/kyverno-policies, which the
# estate replaces at bundle build.
components:
  - ../../components/whitelabel
  - ../../components/alert-owner/key
  - ../../components/estate/kyverno-policies
replacements:
  - path: whitelabel-replacements.yaml
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.OPS_EMAIL }
    targets:
      - select: { kind: ClusterPolicy, name: mutate-reportportal-annotations }
        fieldPaths:
          - spec.rules.[name=add-workload-annotations].mutate.patchStrategicMerge.metadata.annotations.alerts/owner
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.REGISTRY_HOST }
    targets:
      - select: { kind: ClusterPolicy, name: mutate-plane-harbor-pull }
        fieldPaths:
          - spec.rules.[name=add-harbor-pull].preconditions.any.0.value.0
        options: { delimiter: "/", index: 0 }
      - select: { kind: ConfigMap, name: kyverno-policies-values }
        fieldPaths: [data.REGISTRY_WORD]
        options: { delimiter: ",", index: 0 }
  - source: { kind: ConfigMap, name: kyverno-policies-values, fieldPath: data.REGISTRY_WORD }
    targets:
      - select: { kind: ClusterPolicy, name: mutate-plane-harbor-pull }
        fieldPaths: ["metadata.annotations.[policies.kyverno.io/description]"]
        options: { delimiter: " ", index: 29 }
  # The annotation key inside strings: each is the space- or quote-delimited word `alerts/owner`.
  - source: { kind: ConfigMap, name: alert-owner-key, fieldPath: data.KEY }
    targets:
      - select: { kind: ClusterPolicy, name: require-alert-annotation }
        fieldPaths: ["metadata.annotations.[policies.kyverno.io/description]"]
        options: { delimiter: " ", index: 9 }
      - select: { kind: ClusterPolicy, name: require-alert-annotation }
        fieldPaths: ["spec.rules.[name=require-alert-owner].validate.message"]
        options: { delimiter: " ", index: 4 }
      - select: { kind: ClusterPolicy, name: mutate-reportportal-annotations }
        fieldPaths: ["spec.rules.[name=add-workload-annotations].preconditions.all.1.key"]
        options: { delimiter: '"', index: 1 }
# The alert-owner map keys inside two policies' specs (see alert-owner-keys/).
transformers:
  - alert-owner-keys
