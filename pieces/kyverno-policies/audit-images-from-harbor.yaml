# PREPARED, NOT WIRED (PLATFORM-11): this file is in no kustomization, so nothing applies it. Step 1
# of the procedure in infrastructure/hetzner/RUNBOOK.md 2026-11-05 adds it to kustomization.yaml.
#
# Reports a pod that pulls from anywhere but Harbor. Mode: AUDIT, and it stays Audit until CNPG and
# ARC's controller are excluded or moved: they fail it today, on purpose, and refusing them is
# refusing a database's restart. failurePolicy Ignore, because mutate.kyverno.svc-fail already
# blocks pods whenever Kyverno is down; this must not add a second way to do that.
#
# EXCLUDED: Harbor's cold start, what watches and recovers Harbor (COLD_START in
# .github/scripts/image_refs.py), and the runners, which float on ghcr on purpose (images.list).
# Those stay upstream by decision, so a report on them would be permanent noise hiding real drift.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: audit-images-from-harbor
  annotations:
    policies.kyverno.io/title: Images Come From Harbor
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      A pod outside Harbor's own cold start pulls from the estate's Harbor (WLREGISTRY), so an upstream
      registry's outage or rate limit cannot stop its restart on a fresh node.
spec:
  validationFailureAction: Audit
  background: true
  failurePolicy: Ignore
  rules:
    - name: images-from-harbor
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - kyverno
                - argocd
                - openbao
                - harbor
                - external-secrets
                - cert-manager
                - external-dns
                - tailscale
                - velero
                - arc-runners
          - resources:
              names:
                - "health-digest*"
                - "estate-watch*"
                - "k3s-datastore-copy*"
      validate:
        message: "This image is not served from WLREGISTRY: add it to infrastructure/hetzner/images.list, run harbor-mirror-images.sh, then name WLREGISTRY/mirror/<upstream>."
        pattern:
          spec:
            =(ephemeralContainers):
              - image: "WLREGISTRY/*"
            =(initContainers):
              - image: "WLREGISTRY/*"
            containers:
              - image: "WLREGISTRY/*"
