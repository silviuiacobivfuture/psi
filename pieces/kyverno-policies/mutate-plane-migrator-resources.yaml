# Inject resources onto Plane's migrator Job — the ONE workload the plane-ce chart
# renders with no resources block and no values key to add one.
#
# WHY THIS EXISTS (verified on dev 2026-08-18): the chart's
# templates/workloads/migrator.job.yaml declares a single container with envFrom,
# command and imagePullPolicy — and NO `resources:` at all. `require-requests-limits`
# is ENFORCE and Kyverno AUTOGENERATES a Job/CronJob rule from its Pod rule, so the
# Job is rejected at admission:
#
#   admission webhook "validate.kyverno.svc-ignore" denied the request:
#   resource Job/plane/plane-api-migrate-1 was blocked ... rule
#   autogen-require-requests-limits: CPU and memory requests and limits are required
#
# and Plane's schema is never created. The API pods then sit in
# `wait_for_migrations`, which loops on a 10s sleep FOREVER instead of failing — so
# the symptom is a permanently 0/1 plane-api-wl with a healthy-looking cluster.
#
# WHY A MUTATE AND NOT AN EXCLUSION: excluding `plane` from require-requests-limits
# would let EVERY unbounded plane workload through — a single unbounded migrator
# could then evict a neighbour on the same node. The namespace LimitRange does NOT
# help: LimitRanger defaults are applied when the POD is created, but Kyverno's
# autogen rule validates the JOB TEMPLATE at admission, before any pod exists — so
# the Job is rejected while its would-be pod would have been fine. Mutating the
# template itself fixes the gap at its source, keeps the policy ENFORCE for
# everything else, and leaves the values as-code (nothing is hand-patched live).
#
# SCOPE: deliberately narrow — namespace `plane`, name prefix `plane-api-migrate-*`,
# and only when resources are absent (the preconditions), so a future chart version
# that ships its own resources is left untouched.
#
# SIZING: the migrator runs `./bin/docker-entrypoint-migrator.sh` (Django
# `migrate`) — a short, single-threaded, DB-bound task. Requests are modest;
# the limit gives headroom for a large migration without letting it run away.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mutate-plane-migrator-resources
  annotations:
    policies.kyverno.io/title: Inject resources on Plane's migrator Job
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Job
    policies.kyverno.io/description: >-
      The plane-ce chart renders its api-migrate Job with no resources block and
      exposes no values key to add one, so require-requests-limits (ENFORCE, via its
      autogenerated Job rule) rejects it and Plane never gets a database schema. This
      mutates the Job to carry explicit requests+limits so the security policy can
      stay ENFORCE for every other workload.
spec:
  # Mutation must run BEFORE the validating webhook sees the resource.
  rules:
    - name: add-migrator-resources
      match:
        any:
          - resources:
              kinds:
                - Job
              namespaces:
                - plane
              names:
                - plane-api-migrate-*
      preconditions:
        all:
          # Only when the chart still ships no resources — a future version that adds
          # its own must win over this rule.
          - key: "{{ request.object.spec.template.spec.containers[0].resources.requests.cpu || '' }}"
            operator: Equals
            value: ""
      mutate:
        foreach:
          - list: "request.object.spec.template.spec.containers"
            patchStrategicMerge:
              spec:
                template:
                  spec:
                    containers:
                      - name: "{{ element.name }}"
                        resources:
                          requests:
                            cpu: 100m
                            memory: 256Mi
                          limits:
                            cpu: "1"
                            memory: 1Gi
