apiVersion: v1
kind: LimitRange
metadata:
  name: convex
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 50m, memory: 128Mi }
      default: { cpu: 500m, memory: 512Mi }
      max: { cpu: "6", memory: 6Gi }
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: convex
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 10Gi
    pods: "10"
