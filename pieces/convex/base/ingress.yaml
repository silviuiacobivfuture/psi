apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: convex
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Convex API - WLINSTANCE"
    gethomepage.dev/description: "WLPURPOSE - client + admin API"
    gethomepage.dev/group: "Services"
    gethomepage.dev/icon: "convex.png"
    gethomepage.dev/pod-selector: "app=convex-backend"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - convex-WLINSTANCE.WLDOMAIN
        - convex-WLINSTANCE-site.WLDOMAIN
      secretName: convex-tls
  rules:
    - host: convex-WLINSTANCE.WLDOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: convex-backend
                port:
                  name: cloud
    - host: convex-WLINSTANCE-site.WLDOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: convex-backend
                port:
                  name: site
---
# The data browser, behind ITS OWN gate: the instance's forward_single provider convex-<name>-dash
# on the embedded outpost (generated by tools/convex/tenant-gate.mjs into the estate's
# authentik-platform component), bound to the tenant's group autorizare-tenant-<TENANT> and to
# platform-admins. The outpost matches this host exactly, so that binding alone decides who
# passes: a person outside the tenant is refused here, before the dashboard asks for its key.
# Until the estate has generated the provider, the estate-wide domain gate answers instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: convex-dashboard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik-forwardauth@kubernetescrd
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Convex Data - WLINSTANCE"
    gethomepage.dev/description: "WLPURPOSE - data browser (Authentik-gated)"
    gethomepage.dev/group: "Services"
    gethomepage.dev/icon: "convex.png"
    gethomepage.dev/pod-selector: "app=convex-dashboard"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [convex-WLINSTANCE-dash.WLDOMAIN]
      secretName: convex-dashboard-tls
  rules:
    - host: convex-WLINSTANCE-dash.WLDOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: convex-dashboard
                port:
                  name: http
---
# The dashboard gate's own callback (a forward_single provider answers on its own host), the
# restart first so a refused sign-in starts again instead of a blank 400
# (.github/scripts/sso-restart.sh, pieces/authentik-platform/CLAUDE.md).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: convex-dashboard-callback
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: authentik-sso-restart@kubernetescrd,authentik-authentik-forwardauth@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [convex-WLINSTANCE-dash.WLDOMAIN]
      secretName: convex-dashboard-tls
  rules:
    - host: convex-WLINSTANCE-dash.WLDOMAIN
      http:
        paths:
          - path: /outpost.goauthentik.io/callback
            pathType: Exact
            backend:
              service:
                name: convex-dashboard
                port:
                  name: http
