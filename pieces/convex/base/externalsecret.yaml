apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: convex-backend-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: convex-backend-secrets
    creationPolicy: Owner
    template:
      data:
        INSTANCE_SECRET: "{{ .instance_secret }}"
        POSTGRES_URL: "postgresql://{{ .db_username }}:{{ .db_password }}@convex-db-rw:5432"
  data:
    - secretKey: instance_secret
      remoteRef: { key: apps/convex/WLINSTANCE/instance, property: instance_secret }
    - secretKey: db_username
      remoteRef: { key: apps/convex/WLINSTANCE/db, property: username }
    - secretKey: db_password
      remoteRef: { key: apps/convex/WLINSTANCE/db, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: convex-db-app
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: convex-db-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef: { key: apps/convex/WLINSTANCE/db, property: username }
    - secretKey: password
      remoteRef: { key: apps/convex/WLINSTANCE/db, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: convex-storage-s3
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: convex-storage-s3, creationPolicy: Owner }
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
