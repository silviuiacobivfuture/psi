# ONE self-hosted Convex instance: its backend, its data browser, its own CNPG Postgres and the
# secrets they read. Every per-instance and per-estate value is a WL token here; the instance
# component (../instance) fills them from the instance's declaration and the estate's identity.
# Never rendered alone: an instance (instances/<name>) brings it in through ../instance.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - resourcequota.yaml
  - externalsecret.yaml
  - backup-s3-externalsecret.yaml
  - cnpg-cluster.yaml
  - backend.yaml
  - dashboard.yaml
  - service.yaml
  - ingress.yaml
# The tenant the instance is held for, on every object it renders: the neutral key platform/tenant,
# its value from the declaration's TENANT (../instance), moved under the estate's label domain (platform.<label domain>/tenant)
# by components/platform-labels. Selectors and pod templates keep theirs: a selector is immutable,
# and the namespace already says whose a pod is.
labels:
  - pairs: { platform/tenant: WLTENANT }
    includeSelectors: false
    includeTemplates: false
components:
  # Argo's prune/delete guard on the PVC and the CNPG Cluster (the data).
  - ../../../components/prune-guard
