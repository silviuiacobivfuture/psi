# Velero S3 credentials → velero-credentials secret (key `cloud`) in the velero
# namespace, read by the velero Helm chart (credentials.existingSecret:
# velero-credentials, key `cloud`). The `cloud` value is rendered as the
# AWS-shared-credentials-file format Velero's velero-plugin-for-aws expects.
# Synced from OpenBao secret/platform/object-storage/dev (the SAME Hetzner Object
# Storage S3 creds used for the tofu state backend). The velero namespace is
# created by the velero Argo app; ESO retries until it exists (same as the harbor
# / observability platform secrets). See gitops/PLATFORM.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-credentials
  namespace: velero
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: velero-credentials
    creationPolicy: Owner
    template:
      data:
        cloud: |
          [default]
          aws_access_key_id={{ .access_key_id }}
          aws_secret_access_key={{ .secret_access_key }}
  data:
    - secretKey: access_key_id
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: secret_access_key
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
