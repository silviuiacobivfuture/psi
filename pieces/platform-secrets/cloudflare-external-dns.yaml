# Cloudflare API token → cloudflare-api-token secret (key `token`) in the
# external-dns namespace, read by the external-dns Helm chart via secretKeyRef
# as CF_API_TOKEN. Synced from OpenBao secret/platform/cloudflare/token (key
# api_token). Replaces the out-of-band secret created by gitops-apply.sh.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: { key: platform/cloudflare/token, property: api_token }
