# Tailscale operator OAuth creds → operator-oauth secret (keys client_id,
# client_secret) in the tailscale namespace, read by the tailscale-operator Helm
# chart. Synced from OpenBao secret/platform/tailscale/oauth. Replaces the
# out-of-band secret previously created by scripts/platform-tailscale.sh from .env.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: operator-oauth
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef: { key: platform/tailscale/oauth, property: client_id }
    - secretKey: client_secret
      remoteRef: { key: platform/tailscale/oauth, property: client_secret }
