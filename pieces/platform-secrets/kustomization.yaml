# SEB piece `platform-secrets`: the platform's own ExternalSecrets — shared/infra day-2 secrets synced
# from OpenBao (secret/platform/*, through the `openbao` ClusterSecretStore of the openbao
# piece) into the namespaces their consumers expect, each ExternalSecret carrying its own target
# namespace — and the two Harbor reconcilers that read them (OIDC config, housekeeping).
# Stateless: ExternalSecrets, CronJobs and their RBAC; the secret values live in OpenBao only.
# Delivered in the SEB bundle, rendered at build time (tools/bundle/build.mjs). See
# gitops/PLATFORM.md.
#
# An application's own ExternalSecrets live with the application (its declaration and its own
# manifests), never here. The estate's additions to this piece (secrets of its own platform
# tooling, the platform sender's display name, its current engine files) come from its
# component, ../../components/estate/platform-secrets; SEB's default adds nothing.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cloudflare-cert-manager.yaml
  - cloudflare-external-dns.yaml
  - tailscale-operator-oauth.yaml
  - harbor-admin.yaml
  - harbor-oidc.yaml
  - harbor-oidc-reconcile.yaml
  # Tag retention on every project + weekly GC (RUNBOOK 2026-10-29).
  - harbor-housekeeping.yaml
  - headlamp-oidc.yaml
  - axiom-ingest.yaml
  - velero-credentials.yaml
  - authentik-env.yaml
  - authentik-db-creds.yaml
  # CNPG bootstrap credential + the barman S3 credential for authentik-db (I2).
  # Both target the `authentik` namespace and both must exist BEFORE the
  # Cluster is applied: a Cluster whose bootstrap.initdb.secret is absent sits
  # in "Setting up primary" forever, which reads as a broken operator.
  - authentik-db-app.yaml
  - authentik-github-oauth.yaml
  - authentik-google-oauth.yaml
  - authentik-oidc-clients.yaml
  # n8n-sso's SCIM tokens, GENERATED with the n8n instances (apps/n8n-sso).
  - authentik-n8n-scim.generated.yaml
  # Outgoing mail (set-password and recovery links) through Plunk's relay, as the apex `platform` sender.
  - authentik-email.yaml
  # What the estate tile policy reads: the engine, the pin, the hub's lookup.
  - authentik-estate-tiles.yaml
  # Hetzner Cloud API token for the hcloud-csi block-storage driver
  # (kube-system). See pieces/hcloud-csi/values.yaml.
  - hcloud-token.yaml

configMapGenerator:
  - name: harbor-housekeeping-script
    namespace: harbor
    files:
      - harbor-housekeeping.sh

# Estate values come from the identity (the whitelabel component, generated by the bundle
# builder from the estate's identity), never written in the manifests. ./defaults sets the
# values an estate may override; its component comes after it, so its patches win.
components:
  - ../../components/whitelabel
  - defaults
  - ../../components/estate/platform-secrets
replacements:
  - path: whitelabel-replacements.yaml
  # Who is paged: the estate's operations address (the key is moved to
  # alerts.<ESTATE_LABEL_DOMAIN>/owner by ../../components/alert-owner).
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.OPS_EMAIL }
    targets:
      - select: { kind: CronJob, annotationSelector: alerts/owner }
        fieldPaths:
          - metadata.annotations.alerts/owner
  # AUTHENTIK_HOST is derived by the loader: AUTHENTIK_HOST_PREFIX.BASE_DOMAIN.
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.AUTHENTIK_HOST }
    targets:
      - select: { kind: ExternalSecret, name: headlamp-oidc }
        fieldPaths:
          - spec.target.template.data.OIDC_ISSUER_URL
        options: { delimiter: "/", index: 2 }
  # Harbor's OIDC issuer, inside the reconciler's script: its first "/" are those of https://.
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.AUTHENTIK_HOST }
    targets:
      - select: { kind: CronJob, name: harbor-oidc-reconcile }
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=reconcile].command.2
        options: { delimiter: "/", index: 2 }
transformers:
  - ../../components/alert-owner
