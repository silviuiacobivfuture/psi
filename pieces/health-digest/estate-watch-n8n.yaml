# n8n_edge.py: the tested digest and the running image. One namespace. The sidecar's own probe is
# asked on its Service, through its NetworkPolicy, and needs nothing from the API server.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: estate-watch-n8n-edge
  namespace: n8n
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["n8n"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: estate-watch-n8n-edge
  namespace: n8n
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: estate-watch-n8n-edge
subjects:
  - kind: ServiceAccount
    name: estate-watch
    namespace: observability
