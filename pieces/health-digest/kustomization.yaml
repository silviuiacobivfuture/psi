# SEB piece `health-digest`: the daily "is the platform actually fine?" message into the #infra
# Talk channel (health-digest.yaml), and estate-watch, which says once what fails in silence
# (estate-watch.yaml, its engine estate_watch.py). CronJobs, a read-only ServiceAccount each,
# the send-only talk-webhook bearer mirrored into this namespace. Stateless: estate-watch keeps
# what it has said in one ConfigMap declared with no data, so Argo never owns its contents.
#
# It lives in `observability` next to the OTel collector because that is where
# platform-observation workloads belong, and its stdout is already shipped from that namespace,
# so the full report survives even when the Talk post fails.
#
# Delivered in the SEB bundle, rendered at build time (tools/bundle/build.mjs). The estate's own
# (its applications' cron logs and notice senders, the key they ask for) comes from its
# component, ../../components/estate/health-digest; SEB's default adds nothing.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - health-digest.yaml
  - estate-watch.yaml
  - estate-watch-n8n.yaml
# The watcher's code as a real file, so its test runs what ships.
configMapGenerator:
  - name: estate-watch-script
    namespace: observability
    files:
      - estate_watch.py
      - backup_watch.py
      - velero-run-bounds.json
      - image_watch.py
      - notice_watch.py
      - n8n_edge.py
      - n8n-page-hook.sha256

# Estate values come from the identity (the whitelabel component, generated by the bundle
# builder from the estate's identity), never written in the manifests.
components:
  - ../../components/whitelabel
  - ../../components/estate/health-digest
replacements:
  # Who is paged: the estate's operations address (the key is moved to
  # alerts.<ESTATE_LABEL_DOMAIN>/owner by ../../components/alert-owner).
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.OPS_EMAIL }
    targets:
      - select: { kind: CronJob, annotationSelector: alerts/owner }
        fieldPaths:
          - metadata.annotations.alerts/owner
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.BASE_DOMAIN }
    targets:
      - select: { kind: CronJob, name: estate-watch }
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.*.env.[name=N8N_EDGE_HOST].value
          - spec.jobTemplate.spec.template.spec.containers.*.env.[name=N8N_EDGE_HOOKS_HOST].value
        options: { delimiter: ".", index: 1 }
  # AUTHENTIK_HOST is derived by the loader: AUTHENTIK_HOST_PREFIX.BASE_DOMAIN.
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.AUTHENTIK_HOST }
    targets:
      - select: { kind: CronJob, name: estate-watch }
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.*.env.[name=N8N_EDGE_AUTH_HOST].value
  # The estate's repository estate-watch reads (GITHUB_REPO, shipped "/"): owner, then repository.
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.GIT_OWNER }
    targets:
      - select: { kind: CronJob, name: estate-watch }
        fieldPaths: ["spec.jobTemplate.spec.template.spec.containers.[name=watch].env.[name=GITHUB_REPO].value"]
        options: { delimiter: "/", index: 0 }
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.GIT_REPO }
    targets:
      - select: { kind: CronJob, name: estate-watch }
        fieldPaths: ["spec.jobTemplate.spec.template.spec.containers.[name=watch].env.[name=GITHUB_REPO].value"]
        options: { delimiter: "/", index: 1 }
transformers:
  - ../../components/alert-owner
