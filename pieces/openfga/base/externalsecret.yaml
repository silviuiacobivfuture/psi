# OpenFGA's runtime secrets, synced from OpenBao into the k8s Secret the
# Deployment consumes. Values live ONLY in OpenBao; this manifest holds the
# mapping, never a value.
#
# PER-KEY `data[]`, and NOT a bare `dataFrom.extract`. `extract` does not error on
# a missing key: it syncs a partial Secret, `envFrom` injects a blank env, and the
# process starts with an empty preshared key — which for THIS process means
# OpenFGA accepts every unauthenticated caller while reporting healthy. A per-key
# `data` ref whose property is absent makes the ExternalSecret go
# `SecretSyncedError`, which `kubectl get externalsecret -A` and doctor.sh both
# see. See gitops/services/APP-SECRETS.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openfga-secrets
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: openfga-secrets
    creationPolicy: Owner
    # Retain is the API server's own default, written out so the manifest says
    # what is true. Left implicit it appeared only on the live object, and Argo
    # reported the application OutOfSync forever over a field nobody had set.
    # Declared rather than added to Argo's ignore list, because four manifests
    # elsewhere set this to Merge on purpose — ignoring it would have made
    # those four invisible.
    deletionPolicy: Retain
  data:
    # The preshared key every caller presents. OpenFGA's keys are UNSCOPED — a
    # holder can Check and can equally Write tuples or replace the model — which
    # is the whole reason for the port split in deployment.yaml (@rule OPS-2, D7).
    # The key is therefore NOT the access control; the ports and the
    # NetworkPolicy are. It is attribution and a closed door on an accident.
    #
    # THE SAME OpenBao path and property autorizare's OPENFGA_TOKEN reads
    # (pieces/autorizare/base/externalsecret.yaml). ONE value read
    # twice, never two values kept in step by hand: a drift between them makes
    # every control-plane write fail with an unauthenticated error that names
    # nothing.
    - secretKey: OPENFGA_AUTHN_PRESHARED_KEYS
      remoteRef:
        key: apps/openfga/env
        property: OPENFGA_AUTHN_PRESHARED_KEYS
  # NO dataFrom.extract. Unlike a business service, whose OpenBao env path holds the
  # contents of a .env file authored by a human, this app has exactly one runtime
  # secret. An additive extract here would be a door for a key nobody declared.
---
# @rule OPS-4 — CNPG's WAL-archive credentials (barman -> Hetzner Object Storage).
#
# A SEPARATE Secret from the application's, with the AWS_* key names barman
# expects. Separate because the two rotate for different reasons and on different
# schedules: folding them together means a credential rotation for the app
# silently stops the backups, and a stopped backup is invisible until the day it
# is needed.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openfga-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: openfga-backup-s3, creationPolicy: Owner, deletionPolicy: Retain }
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
---
# The database owner's credential, in the form CNPG's bootstrap requires.
#
# `bootstrap.initdb.secret.name` in cnpg-cluster.yaml names this Secret, and
# naming one means the operator expects it to EXIST. `kubernetes.io/basic-auth`
# with exactly `username` and `password` is what CNPG reads; any other shape is
# accepted by Kubernetes and ignored by the operator.
#
# It also composes `uri`, which CNPG puts on the secret IT generates but which is
# not part of basic-auth — so a hand-supplied secret has to build it or the
# migrate initContainer fails with "couldn't find key uri", several layers from
# the cause.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openfga-db-app
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: openfga-db-app
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        # `-rw` is the CNPG-managed Service that always points at the current
        # primary. Never address the pod. Fully qualified, because the migrate
        # initContainer and the server read it from the same string and a bare
        # name only resolves inside this namespace.
        uri: "postgres://{{ .username }}:{{ .password }}@openfga-db-rw.openfga.svc:5432/openfga?sslmode=disable"
  data:
    - secretKey: username
      remoteRef: { key: apps/openfga/db, property: username }
    - secretKey: password
      remoteRef: { key: apps/openfga/db, property: password }
