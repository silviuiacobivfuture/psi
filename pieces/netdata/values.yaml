# Keep this at v2.12.0 or later (scripts/tests/netdata-memory.test.sh refuses less).
# Older releases never freed the charts of a gone container, so each container ever
# seen cost about 335 KiB until the process died, and cp's child reached its limit
# in 18.5 h. Retention only changes the price of each. RUNBOOK 2026-11-04.
image:
  # repository: set by `parameters` below (an estate value).
  tag: "v2.12.2@sha256:9e7c8b8078660ac1dc0220de39e6184e4e25a3b3951ef7d1e9b3c313987bda0a"
  pullPolicy: IfNotPresent
initContainersImage:
  # repository: set by `parameters` below (an estate value).
  tag: "latest@sha256:c26612752c78b18faacd63c7d50f4592c2e7b0f25e0e20e82bd74e465c57ab0d"

# Chart's own ingress OFF — we expose tailnet-only via extraManifests... but
# this chart has no extraManifests hook, so the Tailscale Ingress is applied
# as a sibling resource (kubectl) — documented at the bottom of this file.
ingress:
  enabled: false

# PSP is removed from modern k8s (>=1.25); don't create a dead no-op PSP.
rbac:
  create: true
  pspEnabled: false
serviceAccount:
  create: true
  name: netdata

restarter:
  enabled: false

# ---- Parent: aggregation + retention + UI ----
parent:
  enabled: true
  hostname: netdata-parent
  port: 19999
  database:
    persistence: true
    storageclass: local-path
    volumesize: 3Gi
  alarms:
    persistence: true
    storageclass: local-path
    volumesize: 1Gi
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: "1", memory: 1536Mi }
  # NOTE: do NOT set env.DO_NOT_TRACK here — netdata reacts to it by touching
  # /etc/netdata/.opt-out-from-anonymous-statistics, which is a read-only
  # ConfigMap mount → the parent (uid 201) crashloops. We opt out via the
  # netdata.conf `[global] anonymous statistics = no` below instead.
  configs:
    netdata:
      enabled: true
      path: /etc/netdata/netdata.conf
      data: |
        [global]
          hostname = netdata-parent
          anonymous statistics = no
        [db]
          mode = dbengine
          storage tiers = 1
          dbengine multihost disk space MB = 2560
          # A CI pod's charts stay an hour after the pod is gone, and CI makes
          # hundreds of them: 16,673 charts held here on 2026-11-03 with the
          # parent at 1,535 MiB of its 1,536 limit and OOM-killed 11 times.
          cleanup obsolete charts after = 10m
          update every = 1
        # 413 MiB of the 1,478 this pod held on 2026-11-03, the largest single
        # use, growing 30 MiB/h: a model for every dimension of every host. No
        # alarm but its own (ml_1min_node_ar) reads it.
        [ml]
          enabled = no
        [plugins]
          cgroups = no
          tc = no
          # go.d ENABLED on the parent so the httpcheck collector below can
          # probe the k3s apiserver /healthz. The parent runs health, so its
          # alarm (health.d/k3s-apiserver.conf) goes RED when the apiserver is
          # unreachable — visible in the netdata UI AND emitted to stdout →
          # OTel → Axiom (${ESTATE_SLUG}-dev-containers), backing the external
          # Axiom cluster-down monitor.
          enable running new plugins = yes
          check for new plugins every = 72000
          python.d = no
          charts.d = no
          go.d = yes
          node.d = no
          apps = no
          proc = no
          idlejitter = no
          diskspace = no
          scripts.d = no
          netflow = no
    # go.d master switch: keep ALL go.d modules off except httpcheck, so
    # enabling go.d for the apiserver probe doesn't light up dozens of
    # auto-detected collectors on the parent.
    godconf:
      enabled: true
      path: /etc/netdata/go.d.conf
      data: |
        enabled: yes
        modules:
          httpcheck: yes
    # httpcheck job: probe the k3s apiserver health endpoint.
    # Use the apiserver ClusterIP (10.43.0.1 — the well-known `kubernetes`
    # service IP, .1 of the k3s default service CIDR 10.43.0.0/16), NOT the
    # DNS name `kubernetes.default.svc`: the netdata PARENT runs with
    # dnsPolicy=Default (node/Hetzner resolv.conf, no CoreDNS), so it CANNOT
    # resolve cluster-internal names → the probe failed `could not resolve
    # host` → false "apiserver unreachable" CRIT for a full day (2026-06-19).
    # The ClusterIP needs no DNS and is stable across reprovision.
    # 200 (healthy) or 401 (healthy but unauthenticated — netdata sends no
    # token) both = UP. tls_skip_verify: the apiserver serves its own CA cert.
    httpcheck:
      enabled: true
      path: /etc/netdata/go.d/httpcheck.conf
      data: |
        jobs:
          - name: k3s_apiserver
            url: https://10.43.0.1:443/healthz
            method: GET
            timeout: 2
            status_accepted:
              - 200
              - 401
            tls_skip_verify: yes
    # Health alarm: RED when the apiserver probe is NOT succeeding. The
    # httpcheck.status chart's `success` dimension is 1 while the endpoint
    # answers (200/401) and 0 on timeout/no_connection/bad_status. crit when
    # the max over the last minute is not 1 → apiserver unreachable.
    health:
      enabled: true
      path: /etc/netdata/health.d/k3s-apiserver.conf
      data: |
        template: k3s_apiserver_unreachable
              on: httpcheck.status
           class: Errors
            type: Kubernetes
        component: API server
          lookup: max -1m of success
           units: up
           every: 10s
            crit: $this != 1
           delay: down 2m multiplier 1.5 max 10m
            info: k3s apiserver /healthz probe is failing — control plane unreachable from in-cluster
              to: sysadmin
    stream:
      enabled: true
      path: /etc/netdata/stream.conf
      data: |
        [11111111-2222-3333-4444-555555555555]
          enabled = yes
          default memory mode = dbengine
          health enabled by default = auto
          allow from = *
  # claiming.enabled defaults to false (kept local / self-hosted).

# The Kubernetes service discovery on each child. All it found was Prometheus
# pages that no alarm or reader uses: 2,936 of agent-0's 16,232 dimensions on
# 2026-11-03 (cert-manager 1,230, traefik 951, velero 740). The informers and
# the scrapes go with it.
sd:
  child:
    enabled: false

# ---- Child: per-node agent (privileged) → streams to parent ----
# hostPID/hostNetwork/hostPath/privileged/SYS_ADMIN are hardcoded in the chart
# child DaemonSet template (required for cgroups + eBPF + per-pod network).
child:
  enabled: true
  # The ~703Mi once called steady here was the leak in the pin's comment, on its
  # way up. Do not size this from a reading: see what `image` says first.
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { cpu: 500m, memory: 1024Mi }
  # No DO_NOT_TRACK env (same read-only-mount crash as the parent). The child
  # netdata.conf disables anon stats below.
  configs:
    netdata:
      enabled: true
      path: /etc/netdata/netdata.conf
      data: |
        [global]
          anonymous statistics = no
        [db]
          mode = ram
          # Measured 2026-11-03: 5055 charts and 10554 dimensions at the
          # default 1h08m kept the agent at 450-614 MiB and peaks of 860-930,
          # OOM-killed at this 1 GiB limit. It streams everything to the
          # parent, which holds the history; a child needs a reconnect's worth.
          retention = 10m
          cleanup obsolete charts after = 10m
        # A fifth to a third of a child's dimensions on 2026-11-03 (3,283 of agent-0's 16,232,
        # 3,229 of cp's 10,125), and every short-lived command name becomes 14
        # new charts. The same processes are charted per pod and per systemd unit.
        # scripts.d and netflow arrived with v2.11-2.12 and nothing here uses them:
        # 8 MiB resident on an idle agent, measured 2026-11-04.
        [plugins]
          apps = no
          scripts.d = no
          netflow = no
        # These Jobs live a median 4 s, too short to chart, and were 38% of all
        # containers on 2026-11-05. Every container charted stays in the parent's
        # registry until it restarts (RUNBOOK 2026-11-05), so each costs it for
        # good. k8s_state still shows their phase. A Job not named here is charted.
        [plugin:cgroups]
          enable by default cgroups names matching = !k8s_cntr_*-reconcile-* !k8s_cntr_*_secret-watcher-* !k8s_cntr_*_estate-watch-* !k8s_cntr_*_authentik-blueprint-discovery-* !k8s_cntr_*-kopia-maintain-job-* *
        [web]
          bind to = localhost:19999
        [health]
          enabled = no
        [ml]
          enabled = no
    # The Prometheus module has nothing left to scrape without the discovery; off
    # so the listener discovery cannot bring pages back. kube-proxy's charts: no
    # alarm, no reader.
    go.d:
      data: |
        modules:
          pulsar: no
          prometheus: no
          k8s_kubeproxy: no
    kubeproxy:
      enabled: false
    # k3s serves one registry on every metrics port, so on the server this page
    # is the apiserver's too: 14 MB and 92,000 series, against 425 KB on the agent.
    # Parsed by two jobs each second, go.d held 310-390 MiB there, with the pod
    # throttled in 68% of its CPU periods. Every 10 s still feeds the kubelet
    # alarms, which are evaluated every 10 s.
    kubelet:
      data: |
        update_every: 10
        autodetection_retry: 0
        jobs:
          - name: local
            url: http://127.0.0.1:10255/metrics
          - name: local
            url: https://localhost:10250/metrics
            tls_skip_verify: yes
  # claiming.enabled defaults to false.

# K8s state (kube-state-metrics-style) — pod/deployment/node object state.
k8sState:
  enabled: true
  # claiming.enabled defaults to false.
  # The chart's default is no limit: on 2026-11-02 this pod had grown to
  # 5.6 GiB on dev-k3s-agent-0 (about 107 MiB/day since June), the node's
  # largest tenant. It keeps nothing it cannot rebuild, so a restart at the
  # limit costs little; its siblings run at 544-779 MiB.
  resources:
    requests: { memory: 256Mi }
    limits: { memory: 1Gi }
  # 948 MiB of that limit after 28 h on 2026-11-03, with 984 MiB anonymous: the
  # next OOM kill. The children's retention was never applied here, so this pod
  # kept its 1h08m of 9,441 dimensions and every gone pod's charts for an hour.
  # Pod state at 1 Hz was also a quarter of what the parent stored; its alarms
  # are evaluated every 10 s.
  configs:
    netdata:
      data: |
        [global]
          hostname = {{ .Values.k8sState.hostname }}
        [db]
          mode = ram
          retention = 10m
          cleanup obsolete charts after = 10m
        [web]
          bind to = localhost:19999
        [health]
          enabled = no
        [ml]
          enabled = no
        [plugins]
          timex = no
          checks = no
          idlejitter = no
          tc = no
          diskspace = no
          proc = no
          cgroups = no
          enable running new plugins = no
          slabinfo = no
          perf = no
          go.d = yes
          ioping = no
          ebpf = no
          charts.d = no
          apps = no
          python.d = no
          fping = no
    go.d-k8s_state:
      data: |
        jobs:
          - name: k8s_state
            update_every: 10
