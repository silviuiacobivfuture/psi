# OIDC client_id → `apiserver-oidc` Secret in the `system-upgrade` namespace, read
# by the SUC Plan job (oidc-apiserver-plan.yaml) when it writes the apiserver OIDC
# drop-in onto the control-plane node. Source: OpenBao
# secret/platform/authentik/headlamp-oidc (key client_id) — the SAME deterministic
# client the Authentik blueprint provisions and that the kube-apiserver trusts as
# its oidc-client-id (single source of truth shared with pieces/platform-secrets/
# headlamp-oidc.yaml).
#
# Only the client_id is templated here: the issuer URL + the other OIDC flags are
# NON-secret constants and live in the Plan's ConfigMap (oidc-apiserver-plan.yaml).
# Mirrors pieces/platform-secrets/headlamp-oidc.yaml (same OpenBao key, same store);
# different target namespace because the Plan job runs in `system-upgrade`.
#
# Until the OpenBao entry is seeded the value syncs empty → the Plan job FAILS its
# precondition check (empty client_id) and the node stays not-applied (safe no-op),
# rather than writing a broken apiserver flag.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: apiserver-oidc
  namespace: system-upgrade
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: apiserver-oidc
    creationPolicy: Owner
  data:
    - secretKey: client_id
      remoteRef: { key: platform/authentik/headlamp-oidc, property: client_id }
