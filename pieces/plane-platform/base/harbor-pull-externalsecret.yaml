# Pull credentials for the estate registry (REGISTRY_HOST), as every service here carries — for
# Plane's api/worker/beat-worker/migrator, which run our own image
# (apps/plane-sso). Attached to those pods by the Kyverno policy
# pieces/kyverno-policies/mutate-plane-harbor-pull.yaml, because the chart can
# only attach a pull secret it renders from plaintext values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: harbor-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"WLREGISTRY":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: platform/harbor/pull, property: username }
    - secretKey: password
      remoteRef: { key: platform/harbor/pull, property: password }
