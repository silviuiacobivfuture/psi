# Plane runtime secrets, synced from OpenBao by ESO. Every value lives ONLY in
# OpenBao (seeded by infrastructure/hetzner/scripts/seed-secrets.sh); these
# manifests hold the MAPPING, never a value. See gitops/services/APP-SECRETS.md.
#
# Each `data[]` key is declared EXPLICITLY (no bare dataFrom.extract) so a key that
# is absent in OpenBao makes the ExternalSecret go SecretSyncedError — LOUD, visible
# in `kubectl get externalsecret -A` — instead of syncing a partial Secret that would
# leave Plane booting with a blank DATABASE_URL and dying with an opaque Django trace.
#
# WHY THE SECRETS ARE COMPOSED HERE INSTEAD OF IN THE CHART VALUES
# ---------------------------------------------------------------
# The plane-ce chart's documented "external Postgres/Redis/RabbitMQ/S3" path is
# `env.pgdb_password`, `env.remote_redis_url`, `rabbitmq.external_rabbitmq_url`,
# `env.aws_secret_access_key`, … — all of which are Helm VALUES, i.e. they would land
# in git inside pieces/plane/values.yaml in plaintext. That is forbidden
# ("NEVER commit secrets"). The chart offers the escape hatch we use instead:
# `external_secrets.{app_env,doc_store,live_env}_existingSecret` make the chart SKIP
# rendering its own Secret and point every `envFrom[].secretRef` at a Secret WE own —
# so the DSNs are assembled here, from OpenBao material, and never exist in git.
# VERIFIED against chart 1.6.2 templates/config-secrets/{app-env,doc-store,live-env}.yaml
# (`{{- if empty .Values.external_secrets.<x>_existingSecret }}` guards each Secret)
# and templates/workloads/{api,worker,beat-worker,migrator,live}.* (the secretRef name
# switches to the provided value).
#
# CONSEQUENCE, deliberate: because the chart substitutes the WHOLE Secret, these
# objects must also carry the non-secret members of the same env block (bucket name,
# endpoint, region, USE_MINIO, FILE_SIZE_LIMIT). They are env-specific but not secret,
# exactly like harbor's externalURL or nextcloud's S3 host in the Helm values.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: plane-app-secrets
    creationPolicy: Owner
    template:
      # ENGINE NOTE: with a `template` present ESO emits ONLY these keys — the
      # fetched `data[]` names above are inputs, not outputs. That is what lets a
      # password be consumed into a DSN and never exist as a standalone env var.
      data:
        # --- Django / live shared signing keys -----------------------------------
        # The chart's default SECRET_KEY is a publicly-known string and Plane 1.4.1
        # logs a CRITICAL "SECURITY: SECRET_KEY is set to a known insecure or
        # placeholder value" for it (apps/api/plane/settings/common.py:37-47,
        # GHSA-cmwv-pjmw-8483). Ours is generated per-cluster by seed-secrets.sh.
        SECRET_KEY: "{{ .secret_key }}"
        # Shared HMAC between the api and the live (hocuspocus) server; `live`
        # rejects every connection whose header does not match
        # (apps/live/src/lib/auth-middleware.ts:38). ONE OpenBao property, TWO
        # consumers — same one-source-of-truth shape as nextcloud's talk-secrets.
        LIVE_SERVER_SECRET_KEY: "{{ .live_server_secret_key }}"

        # --- Datastore DSNs, assembled from OpenBao material ---------------------
        # plane-db-rw is the CNPG operator-managed read/write Service: it always
        # points at the current primary, so a failover needs no config change.
        # Passwords are generated by seed-secrets.sh's `bao_gen`, whose alphabet is
        # [A-Za-z0-9] (seed-secrets.sh:99) — URL-SAFE, so no percent-encoding is
        # needed inside these DSNs. Keep that alphabet if you ever change bao_gen.
        DATABASE_URL: "postgresql://{{ .db_username }}:{{ .db_password }}@plane-db-rw.plane.svc.cluster.local:5432/plane"
        # Redis takes no username (`requirepass` only) — hence the empty user part.
        REDIS_URL: "redis://:{{ .redis_password }}@plane-redis.plane.svc.cluster.local:6379/"
        # Celery's broker. Plane REQUIRES RabbitMQ; with AMQP_URL blank the worker
        # and beat-worker start, connect to nothing, and every background job
        # (emails, notifications, webhooks, exports) silently never runs.
        AMQP_URL: "amqp://{{ .rabbitmq_username }}:{{ .rabbitmq_password }}@plane-rabbitmq.plane.svc.cluster.local:5672/"

        # --- HTTPS overrides for the chart's http-only ConfigMap -----------------
        # chart 1.6.2 templates/config-secrets/app-env.yaml hardcodes
        # `WEB_URL: "http://{{ .Values.ingress.appHost }}"` with NO way to make it
        # https. Every backend container lists `configMapRef: plane-app-vars` FIRST
        # and this Secret SECOND, and for a duplicate key the LAST envFrom source
        # wins — so these two entries override the ConfigMap's values.
        # WEB_URL is load-bearing: base_host() derives every auth redirect, the
        # /god-mode and /spaces links and every emailed URL from it
        # (apps/api/plane/utils/host.py:25-66). Left http, the login round-trip
        # bounces the browser off TLS mid-flow.
        WEB_URL: "https://plane.WLDOMAIN"
        # https-ONLY on purpose. CSRF_TRUSTED_ORIGINS is set from this list, and
        # `secure_origins` (which drives SESSION_COOKIE_SECURE + CSRF_COOKIE_SECURE)
        # is False as soon as ANY origin contains "http:" — the chart's default value
        # includes the http:// form and would therefore ship non-Secure cookies over
        # a TLS-only site (apps/api/plane/settings/common.py:180-190, 375-392).
        CORS_ALLOWED_ORIGINS: "https://plane.WLDOMAIN"
        # ADMIN/SPACE base URLs — the chart NEVER sets these (grep of chart 1.6.2
        # templates: only WEB_URL exists), and Plane's web app falls back to the
        # browser origin plus the target service's CONTAINER port when they are
        # empty. The result is a redirect to
        #   https://plane.WLDOMAIN:3000/god-mode/
        # which nothing listens on — port 3000 is the in-cluster Service port, not
        # a published one — so instance setup is unreachable and the "Get started"
        # button hangs then dead-ends. VERIFIED on dev 2026-08-19: ADMIN_BASE_URL
        # was empty in plane-api-wl while /god-mode routed correctly through the
        # ingress (302 at the Authentik gate, 200 from plane-admin in-cluster) —
        # i.e. only the URL Plane HANDED the browser was wrong.
        # Set to the public origin with NO port so the ingress path routes them:
        #   /god-mode -> plane-admin:3000, /spaces -> plane-space:3000.
        ADMIN_BASE_URL: "https://plane.WLDOMAIN"
        SPACE_BASE_URL: "https://plane.WLDOMAIN"
        # In-cluster address of the live server, used by ONE feature: duplicating a
        # page converts its rich text through {LIVE_URL}/convert-document
        # (apps/api/plane/bgtasks/copy_s3_object.py:74). Unset, that call is skipped
        # and the copy silently loses formatting. Internal http:// is correct — this
        # hop never leaves the pod network, so it must NOT go out through the
        # Authentik-gated public ingress. LIVE_BASE_PATH defaults to "/live/".
        LIVE_BASE_URL: "http://plane-live.plane.svc.cluster.local:3000"

        # --- Authentik SSO (apps/plane-sso) — configuration, not secrets ----------
        # Where the login view CONFIRMS an identity: the same outpost endpoint the
        # Traefik forward-auth middleware asks (gitops/platform/authentik/
        # middleware-forwardauth.yaml). In-cluster http, never the public host.
        # Unset, every SSO login is refused with `sso-misconfigured` — loud, by
        # design (apps/plane-sso/plane_sso/identity.py).
        PLANE_SSO_VERIFY_URL: "http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik"
        # Where sign-out sends the browser once Plane's session is ended:
        # Authentik's default INVALIDATION flow on the PUBLIC Authentik host. It
        # ends the one Authentik session, and the outposts drop their per-host
        # sessions with it. NOT /outpost.goauthentik.io/sign_out: measured
        # 2026-10-29 with e2e-hub, that path ends only the forward-auth
        # provider's session (its end-session runs the stage-less
        # default-provider-invalidation-flow), Authentik's users/me stayed 200 and
        # the next visit to Plane or Novu signed the robot straight back in.
        # .github/scripts/sso-signout.sh refuses anything else here.
        PLANE_SSO_SIGNOUT_URL: "https://auth.WLDOMAIN/flows/-/default/invalidation/"
        # Each sign-in reads the person's groups from the directory (plane_sso/directory.py), with
        # the reconcile's read-only token: view_user + view_group, nothing else.
        AUTHENTIK_API_URL: "http://authentik-server.authentik.svc.cluster.local:80"
        AUTHENTIK_API_TOKEN: "{{ .authentik_api_token }}"
  data:
    - secretKey: secret_key
      remoteRef: { key: apps/plane/app, property: secret_key }
    - secretKey: live_server_secret_key
      remoteRef: { key: apps/plane/app, property: live_server_secret_key }
    - secretKey: db_username
      remoteRef: { key: apps/plane/db, property: username }
    - secretKey: db_password
      remoteRef: { key: apps/plane/db, property: password }
    - secretKey: redis_password
      remoteRef: { key: apps/plane/redis, property: password }
    - secretKey: rabbitmq_username
      remoteRef: { key: apps/plane/rabbitmq, property: username }
    - secretKey: rabbitmq_password
      remoteRef: { key: apps/plane/rabbitmq, property: password }
    - secretKey: authentik_api_token
      remoteRef: { key: platform/authentik/plane-sso-api-token, property: token }
---
# The `live` (hocuspocus collaborative-editing) server's env. A SEPARATE Secret
# because the chart wires it through its own key (`live_env_existingSecret`) and the
# live container must NOT receive the database or S3 credentials — it needs exactly
# the shared HMAC and Redis. Both values are read from the SAME OpenBao properties
# the app Secret above uses: one source of truth, two consumers. If they ever
# diverged, every collaborative editing session would 401 against the api.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-live-secrets
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: plane-live-secrets
    creationPolicy: Owner
    template:
      data:
        LIVE_SERVER_SECRET_KEY: "{{ .live_server_secret_key }}"
        REDIS_URL: "redis://:{{ .redis_password }}@plane-redis.plane.svc.cluster.local:6379/"
  data:
    - secretKey: live_server_secret_key
      remoteRef: { key: apps/plane/app, property: live_server_secret_key }
    - secretKey: redis_password
      remoteRef: { key: apps/plane/redis, property: password }
---
# Object storage (the estate bucket for Plane uploads, …-plane-dev, Tofu-managed:
# infrastructure/hetzner/environments/dev/main.tf → module.plane_storage). Same
# platform S3 credentials every other workload uses; only the BUCKET is per-app.
#
# USE_MINIO MUST be "0". With "1" Plane rewrites every asset URL to
# <WEB_URL>/<bucket>/… and signs against the request host instead of the real
# endpoint (apps/api/plane/settings/storage.py:38-53) — attachments would 404 with
# the credentials looking perfectly correct.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-doc-store
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: plane-doc-store
    creationPolicy: Owner
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_access_key }}"
        # Non-secret, env-specific. They live here only because the chart replaces
        # the WHOLE doc-store Secret when doc_store_existingSecret is set — there is
        # no seam to split them out of.
        AWS_S3_BUCKET_NAME: "WLBUCKET-plane-dev"
        AWS_REGION: "nbg1"
        AWS_S3_ENDPOINT_URL: "https://nbg1.your-objectstorage.com"
        # Plane's boto3 client passes no addressing_style, and botocore defaults to
        # PATH style for a non-AWS endpoint_url — which is what Hetzner requires
        # (virtual-host style resolves <bucket>.nbg1… which their wildcard cert does
        # not cover). Same constraint nextcloud pins explicitly via usePathStyle.
        USE_MINIO: "0"
        FILE_SIZE_LIMIT: "5242880"
  data:
    - secretKey: access_key_id
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: secret_access_key
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
---
# The Postgres application role. CNPG CONSUMES this Secret (bootstrap.initdb.secret)
# instead of generating its own — so the credential's source of truth is OpenBao and
# it survives a cluster rebuild. If CNPG minted it, a rebuild would generate a NEW
# password while a database restored from backup still held the OLD one, and Plane
# would come up unable to authenticate against its own restored data.
# CNPG requires type kubernetes.io/basic-auth with exactly username/password.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-db-app
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: plane-db-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef: { key: apps/plane/db, property: username }
    - secretKey: password
      remoteRef: { key: apps/plane/db, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-redis
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: plane-redis, creationPolicy: Owner }
  data:
    - secretKey: redis-password
      remoteRef: { key: apps/plane/redis, property: password }
---
# RabbitMQ's broker credentials, in the env-var NAMES the upstream image reads
# (RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS) so the StatefulSet can consume the
# whole Secret with a single envFrom. They MUST hold the same values the AMQP_URL in
# plane-app-secrets is built from — both are read from the same OpenBao properties,
# so they cannot drift.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-rabbitmq
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: plane-rabbitmq
    creationPolicy: Owner
    template:
      data:
        RABBITMQ_DEFAULT_USER: "{{ .username }}"
        RABBITMQ_DEFAULT_PASS: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef: { key: apps/plane/rabbitmq, property: username }
    - secretKey: password
      remoteRef: { key: apps/plane/rabbitmq, property: password }
---
# CNPG's WAL-archive credentials (barman → Hetzner Object Storage) and the pg_dump
# CronJob's uploader. Deliberately a SEPARATE Secret from plane-doc-store, with the
# AWS_* key names barman expects and no bucket/endpoint members.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plane-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: plane-backup-s3, creationPolicy: Owner }
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
