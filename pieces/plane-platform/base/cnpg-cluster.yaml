# Plane's Postgres — a CloudNativePG Cluster, the second one on this platform after
# nextcloud-db (PLATFORM.md named CNPG the standard; the operator lands via the
# `cnpg` Argo app). Shape, rationale and deprecation notes mirror
# pieces/nextcloud-platform/base/cnpg-cluster.yaml — read that file first.
#
# DURABILITY: local-path PVCs are node-pinned and non-resizable, so a node loss
# takes the volume with it. That is survivable ONLY because barman ships every WAL
# segment to Hetzner Object Storage — recovery is a fresh Cluster with a
# `bootstrap.recovery` stanza against the same destinationPath. Losing the volume
# costs a restore, not the data. Two layers on purpose:
#   1. THIS — continuous WAL + weekly base backup → PITR, minutes of RPO.
#   2. A 6-hourly logical pg_dump (pieces/db-backup/plane-db-dump.yaml)
#      → a plain .sql.gz that restores without the operator, into anything.
# Velero's raw-PVC snapshot is a third, incidental layer.
#
# EXTENSIONS: NONE. The task brief assumed Plane needs pg_trgm/btree_gin; that was
# CHECKED and is FALSE for 1.4.1 — all 123 files under apps/api/plane/db/migrations
# and the whole apps/api tree contain no CreateExtension, no RunSQL, no
# TrigramSimilarity/SearchVector and no CREATE EXTENSION. Plane uses only ArrayField
# / ArrayAgg from django.contrib.postgres, which need no extension (its own
# apps/api/docs/django-5.2-migration-plan.md says the same). So there is deliberately
# no postInitApplicationSQL here: declaring an extension the app never uses would be
# unowned surface, and CNPG's app role is not superuser so it could only ever be
# created here anyway. If a future Plane release adds one, add it as
# `bootstrap.initdb.postInitApplicationSQL` — the app role cannot CREATE EXTENSION
# itself, so the migration would fail at that point, loudly.
#
# DEPRECATION NOTE (same clock as nextcloud-db): `backup.barmanObjectStore` is the
# in-tree implementation CNPG has been phasing out since 1.26. The operator prints
# "Native support for Barman Cloud backups and recovery is deprecated and will be
# completely removed in CloudNativePG 1.31.0". Migrate BOTH clusters to the Barman
# Cloud Plugin before bumping the operator past 1.31.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: plane-db
  annotations:
    alerts/owner: ops@WLDOMAIN
spec:
  # Single instance: dev has one worker + one (schedulable) control plane, and a
  # replica on the SAME local-path node protects against nothing. Real HA needs
  # off-node volumes (Track A/B of DURABILITY-HA-PLAN.md); until then the WAL
  # archive IS the durability story, not a replica.
  instances: 1
  # Fast clean stop after 10 s, not CNPG's 180 s smart-shutdown default: the
  # pooled clients never leave, so a smart shutdown always runs the full window
  # and refuses every connection meanwhile. Rationale and the 2026-10-29
  # measurement: gitops/platform/authentik/cnpg-cluster.yaml. Guard:
  # infrastructure/hetzner/scripts/tests/cnpg-fast-stop.test.sh.
  smartShutdownTimeout: 10
  # PG 17, matching nextcloud-db. Upstream plane-ce pins postgres:15.7 for its
  # BUNDLED database, but nothing in Plane 1.4.1 is version-gated: it reaches
  # Postgres only through Django 5.2 + dj-database-url (supported range 13-18) and
  # uses no version-specific SQL. Keeping 17 also keeps the logical-dump image
  # (postgres:17-alpine, shared with the authentik/harbor/nextcloud dumps) >= the
  # server version, which pg_dump requires. ASSUMPTION, stated: verified by reading
  # the settings/migrations, not by running Plane against PG 17.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.7-system-trixie
  primaryUpdateStrategy: unsupervised

  bootstrap:
    initdb:
      database: plane
      owner: plane
      # The role's password comes from the ESO-synced Secret (OpenBao is the source
      # of truth) instead of being generated by the operator — see externalsecrets.yaml.
      secret:
        name: plane-db-app
      encoding: UTF8
      localeCollate: C
      localeCType: C

  storage:
    size: 10Gi
    storageClass: local-path

  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

  postgresql:
    parameters:
      # Sized for the 1Gi limit above — shared_buffers ~25% of the container's
      # memory, the rest left to the OS page cache and work_mem.
      shared_buffers: "256MB"
      effective_cache_size: "512MB"
      work_mem: "8MB"
      # api (gunicorn) + worker + beat-worker + the migrator Job + the dump job.
      # Django opens one connection per process and Plane does not pool.
      max_connections: "200"

  backup:
    # 14 days of PITR — same as nextcloud-db. WAL is small and this is the layer
    # that actually rescues a lost node.
    retentionPolicy: "14d"
    barmanObjectStore:
      # Same platform bucket the etcd snapshots, Velero backups and nextcloud-db's
      # archive use — no new bucket, no new credentials. Path-namespaced by cluster.
      # NOTE this is NOT the Plane uploads bucket (…-plane-dev): that bucket holds Plane's user uploads and
      # is app-facing; backups stay on the platform bucket by convention.
      destinationPath: s3://WLBUCKET-tfstate-dev/cnpg/plane-db
      endpointURL: WLENDPOINT
      s3Credentials:
        accessKeyId:
          name: plane-backup-s3
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: plane-backup-s3
          key: AWS_SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
---
# Weekly base backup. WAL alone cannot restore — PITR replays WAL ON TOP of a base
# backup, so without this the archive is unusable and the retention policy has
# nothing to prune against.
# NOTE: CNPG's schedule is a SIX-field cron (leading seconds field), unlike the
# five-field k8s CronJob schedules elsewhere in this repo.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: plane-db-base
spec:
  # 02:40 Sunday — offset from velero(:00), openbao(:30), harbor(:15),
  # authentik(:45), the nextcloud dump(:05), the plane dump(:10) and the
  # nextcloud-db base backup (Sun 02:20) so no two backups ever contend.
  schedule: "0 40 2 * * 0"
  # Take one IMMEDIATELY on creation instead of waiting for the first Sunday.
  # Without this the cluster spends up to a week with WAL archiving "working" and
  # NO restorable point, and every rebuild repeats that window.
  immediate: true
  backupOwnerReference: self
  cluster:
    name: plane-db
