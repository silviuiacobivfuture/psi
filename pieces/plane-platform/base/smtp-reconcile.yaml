# Plane outbound email as code: Plunk's in-cluster SMTP relay, as the `plane`
# sender (gitops/services/plunk/senders/plane.json → noreply@plane.<apex>), with
# that sender's own Plunk key from the generated `email-sender` Secret
# (email.generated.yaml). the e-mail migration plan (first estate's history, not shipped), step 2.
#
# THE GAP THIS CLOSES: Plane keeps its SMTP settings in its OWN database, in the
# `instance_configuration` table — NOT in Helm values and NOT in env. Left alone the
# instance reports `is_smtp_configured: false` on /api/instances/ and every workspace
# invitation, magic-link login and notification email is silently dropped: the UI
# stays up, nothing crashes, and nobody finds out until an invite never arrives.
# Measured on dev 2026-08-20 — `is_smtp_configured: false`,
# `is_magic_login_enabled: false`.
#
# WHY ENV VARS CANNOT FIX IT (read out of the running v1.4.1 image, not assumed):
#   * plane/license/utils/instance_value.py:get_configuration_value() consults the
#     environment ONLY when settings.SKIP_ENV_VAR is false, and
#     plane/settings/common.py:369 defaults it to TRUE ("1"). The api pod sets no
#     SKIP_ENV_VAR, so the DATABASE is authoritative.
#   * The per-key env fallback applies only to a key with NO ROW. But
#     plane/license/management/commands/configure_instance.py seeds every key with
#     `get_or_create` and fills the value only when `created` is true — so the rows
#     exist already, holding "". A row that exists but is empty can NEVER be refilled
#     from the environment. Confirmed by reading the live table: EMAIL_HOST,
#     EMAIL_PORT, EMAIL_FROM, EMAIL_HOST_USER and EMAIL_HOST_PASSWORD all present,
#     all "".
#   SKIP_ENV_VAR=0 would "work", but it flips EVERY instance setting (signup, the
#   OAuth toggles, the LLM key) to env-only and turns /god-mode into a form that
#   writes rows nothing reads. Far too wide a blast radius for an SMTP fix.
#
# WHY NOT THE HTTP API: PATCH /api/instances/configurations/ is the surface the
# /god-mode UI uses and it is gated by InstanceAdminPermission — a SESSION-cookie
# login as an instance admin USER (plane/license/api/permissions/instance.py). The
# cluster holds no instance admin's password, and putting a human's login credential
# into OpenBao purely so a CronJob could log in as them would be a worse design than
# the one below. Plane offers no token or service-account form of that auth.
#
# WHAT THIS JOB DOES INSTEAD — and why it is NOT "raw DB writes": it execs into the
# RUNNING api pod and drives Plane's OWN Django ORM through `manage.py shell`. Same
# models, same plane.license.utils.encryption.encrypt_data, same settings.SECRET_KEY,
# same code path the API's PATCH handler takes (compare
# plane/license/api/views/configuration.py). Nothing bypasses the application, no SQL
# is written by hand, and a migration that renamed a field would break this job
# LOUDLY at import time instead of corrupting a row. The one thing it must redo by
# hand is the cache invalidation the PATCH handler gets from a decorator.
#
# Same pattern and rationale as pieces/platform-secrets/harbor-oidc-reconcile.yaml
# (Harbor's DB-stored auth config) and pieces/nextcloud-platform/base/occ-reconcile.yaml
# (Nextcloud's DB-stored app config). Every 15 minutes, so a rebuilt cluster converges
# with no manual step and a change made in /god-mode is corrected on the next tick.
#
# SECRET HANDLING: the sender's Plunk key IS the SMTP password. It reaches this pod as an
# env var, is base64'd into a six-line prelude, and the prelude + script travel over
# STDIN to `kubectl exec -i`. It never appears in argv on either side (argv is
# world-readable through `ps` inside a container) and is never written to disk.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plane-smtp-reconcile
---
# Narrow by construction: exec into pods of THIS namespace and nothing else. No
# `secrets` verb, no configmap writes, no access to any other Kubernetes object.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plane-smtp-reconcile
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: plane-smtp-reconcile
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: plane-smtp-reconcile
subjects:
  - kind: ServiceAccount
    name: plane-smtp-reconcile
---
# The reconcile body, as a real Python file rather than a shell heredoc.
#
# THIS IS NOT COSMETIC. Python is indentation-significant and a shell heredoc does
# NOT strip the leading whitespace a YAML block scalar carries, so the same script
# inlined into the CronJob's `args` would reach the interpreter indented and die with
# an IndentationError. A ConfigMap's block scalar IS unindented by the YAML parser,
# so the file arrives exactly as written here.
#
# The six values that vary (three literals, two secret-derived, one toggle) are
# prepended by the CronJob as a generated prelude — single printf lines, immune to
# the same problem — so this file is a constant and holds no credential.
apiVersion: v1
kind: ConfigMap
metadata:
  name: plane-smtp-reconcile-script
data:
  reconcile.py: |
    # Prelude supplied by the CronJob: HOST, PORT, USER, MAGIC, FROM_B64, PW_B64.
    import base64
    from django.core.cache import cache
    from plane.license.models import InstanceConfiguration
    from plane.license.utils.encryption import encrypt_data, decrypt_data
    import smtplib
    import ssl

    FROM = base64.b64decode(FROM_B64).decode()  # noqa: F821 - from the prelude
    PW = base64.b64decode(PW_B64).decode()      # noqa: F821 - from the prelude

    desired = {
        "ENABLE_SMTP": "1",
        "EMAIL_HOST": HOST,          # noqa: F821
        "EMAIL_PORT": PORT,          # noqa: F821
        "EMAIL_HOST_USER": USER,     # noqa: F821
        "EMAIL_HOST_PASSWORD": PW,
        # Plane reads these two as the strings "1"/"0"
        # (plane/license/api/views/configuration.py builds the Django connection with
        # use_tls=EMAIL_USE_TLS == "1"). 587 is STARTTLS, so TLS on and SSL off;
        # swapping them would attempt implicit TLS against a plaintext port and hang.
        "EMAIL_USE_TLS": "1",
        "EMAIL_USE_SSL": "0",
        "EMAIL_FROM": FROM,
        "ENABLE_MAGIC_LINK_LOGIN": MAGIC,  # noqa: F821
        # Plane's public sign-up stays CLOSED (apps/plane-sso, 2026-10-28). Who gets
        # an account is decided by Authentik groups; the SSO's own provisioning does
        # not consult this switch (plane_sso/adapter.py), so closing it closes only
        # Plane's own form. Held here so a /god-mode toggle is undone on the next tick.
        "ENABLE_SIGNUP": "0",
    }

    # PROVE the credential works BEFORE storing it. A stored-but-wrong password is
    # precisely the silent failure this job exists to prevent: Plane would report
    # is_smtp_configured true and drop every mail. This authenticates only — it opens
    # a session, upgrades it with STARTTLS, logs in and quits. No message is sent.
    # The certificate is VERIFIED here exactly as Django's backend verifies it when
    # Plane really sends (ssl.create_default_context(): chain + hostname). smtplib's
    # own default checks nothing, so a probe without the context would pass against
    # a relay name every real send then refuses.
    try:
        srv = smtplib.SMTP(HOST, int(PORT), timeout=20)  # noqa: F821
        srv.ehlo()
        srv.starttls(context=ssl.create_default_context())
        srv.ehlo()
        srv.login(USER, PW)  # noqa: F821
        srv.quit()
    except Exception as exc:
        print(
            "FATAL PLANE_SMTP_AUTH_FAILED: %s:%s refused user %r (%s: %s). Nothing was "
            "written. Check the plane sender's key (secret/apps/plane/plunk, "
            "plunk-bootstrap.sh), that cluster-dns resolves the relay's name and "
            "that this namespace can reach it." % (HOST, PORT, USER, type(exc).__name__, exc)  # noqa: F821
        )
        raise SystemExit(1)
    print("smtp auth OK (%s:%s, STARTTLS, user %s)" % (HOST, PORT, USER))  # noqa: F821

    rows = {c.key: c for c in InstanceConfiguration.objects.filter(key__in=list(desired))}
    absent = sorted(set(desired) - set(rows))
    if absent:
        print(
            "FATAL PLANE_CONFIG_ROW_MISSING: %s. instance_configuration does not carry "
            "these keys, so configure_instance has not run for this schema and there is "
            "nothing to update." % ", ".join(absent)
        )
        raise SystemExit(1)

    # Fernet ciphertext is NON-deterministic (random IV), so an encrypted row must be
    # compared DECRYPTED. Comparing ciphertext would rewrite the password on every
    # single run and never once report "no change".
    changed = []
    for key, want in desired.items():
        row = rows[key]
        have = decrypt_data(row.value) if row.is_encrypted else (row.value or "")
        if have == want:
            continue
        row.value = encrypt_data(want) if row.is_encrypted else want
        row.save(update_fields=["value"])
        changed.append(key)
    print("updated: %s" % ", ".join(changed) if changed else "already current — no write")

    # /api/instances/ and /api/instances/configurations/ are cached for TWO HOURS
    # (plane.utils.cache.cache_response with user=False, so the cache key is the bare
    # path). The API's PATCH handler drops them via @invalidate_cache; an ORM write
    # does not, so without these two lines the instance would keep serving
    # is_smtp_configured:false for up to two hours after being configured.
    cache.delete("/api/instances/")
    cache.delete("/api/instances/configurations/")

    # Read back through the ORM. A write silently rejected, or reverted by a
    # concurrent /god-mode edit mid-run, must FAIL the Job rather than pass it.
    check = {
        c.key: (decrypt_data(c.value) if c.is_encrypted else (c.value or ""))
        for c in InstanceConfiguration.objects.filter(key__in=list(desired))
    }
    bad = sorted(k for k, v in desired.items() if check.get(k) != v)
    if bad:
        print("FATAL PLANE_SMTP_WRITE_REJECTED: %s did not persist" % ", ".join(bad))
        raise SystemExit(1)
    print("reconcile OK (/api/instances/ now reports is_smtp_configured true)")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: plane-smtp-reconcile
  annotations:
    alerts/owner: ops@WLDOMAIN
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels: { app: plane-smtp-reconcile }
        spec:
          restartPolicy: OnFailure
          serviceAccountName: plane-smtp-reconcile
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: script
              configMap: { name: plane-smtp-reconcile-script }
          containers:
            - name: reconcile
              # alpine/k8s, NOT rancher/kubectl: the rancher image ships kubectl with
              # NO shell, so the container dies at startup before the script runs.
              # Same image + tag as nextcloud's occ-reconcile and the db-backup
              # health CronJob.
              image: WLREGISTRY/mirror/docker.io/alpine/k8s:1.30.3@sha256:12d9fc5d5e9467c7d932a18015ddfe48bdf2e02dd5677507f155ac05fdd63b73
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { cpu: 300m, memory: 256Mi }
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
              env:
                # The plane sender's Plunk key IS the relay's SMTP password; the
                # address and display name are the declaration's. All three from the
                # GENERATED `email-sender` Secret (email.generated.yaml, from
                # gitops/services/plunk/senders/plane.json), so the sender cannot
                # drift from the key: Plunk refuses a From outside the project's
                # verified domain.
                - name: SMTP_PASSWORD
                  valueFrom: { secretKeyRef: { name: email-sender, key: EMAIL_API_KEY } }
                - name: EMAIL_FROM
                  valueFrom: { secretKeyRef: { name: email-sender, key: EMAIL_FROM } }
                - name: EMAIL_FROM_NAME
                  valueFrom: { secretKeyRef: { name: email-sender, key: EMAIL_FROM_NAME } }
                # NON-SECRET and env-specific. Kept as env rather than baked into the
                # ConfigMap so a prod overlay patches these and nothing else.
                #
                # Plunk's relay (pieces/plunk/base/plunk.yaml, Service
                # plunk-smtp): STARTTLS on 587, the username is the LITERAL "plunk"
                # (Plunk's apps/smtp handleAuth), the password a project's secret
                # key. The host is the name on the relay's certificate; cluster-dns
                # resolves it to the Service in-cluster, so Django verifies it.
                - name: SMTP_HOST
                  value: plunk-smtp.WLDOMAIN
                - name: SMTP_PORT
                  value: "587"
                - name: SMTP_USER
                  value: plunk
                # Magic-link (passwordless email) login. Plane ships it "0", which is
                # why /api/instances/ reported is_magic_login_enabled:false — with no
                # SMTP there was nothing to send it with. Turned on here because it is
                # the login path that outbound email actually buys, and it is a
                # ONE-TOKEN revert: set "0" and the next run turns it off again.
                # Plane stays behind the Authentik forward-auth gate on the Ingress
                # either way (pieces/plane-platform/base/ingress.yaml).
                - name: PLANE_ENABLE_MAGIC_LINK
                  value: "1"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu

                  # The api pod. Not ready yet (a first install, or a rollout) is a
                  # NON-failure: the next run in 15 minutes picks it up, and failing
                  # here would page for a condition that resolves itself.
                  # `app.name=plane-plane-api` is an EXACT match, so it can never
                  # select the migrator pod (app.name=plane-plane-api-migrate).
                  POD="$(kubectl get pod -l app.name=plane-plane-api \
                          --field-selector=status.phase=Running \
                          -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
                  if [ -z "$POD" ]; then
                    echo "no running plane-api pod yet — nothing to reconcile this run"
                    exit 0
                  fi
                  echo "reconciling against pod $POD"

                  # Fail LOUD on a blank credential instead of writing "" into the
                  # table, which would read as configured and send nothing.
                  if [ -z "${SMTP_PASSWORD:-}" ]; then
                    echo "FATAL PLANE_SMTP_EMPTY_PASSWORD: the email-sender Secret carried a blank EMAIL_API_KEY. Capture the plane sender's key (infrastructure/hetzner/scripts/plunk-bootstrap.sh) and check: kubectl -n plane get externalsecret email-sender"
                    exit 1
                  fi
                  if [ -z "${EMAIL_FROM:-}" ]; then
                    echo "FATAL PLANE_SMTP_EMPTY_FROM: the email-sender Secret carried a blank EMAIL_FROM. Plunk refuses a sender outside the project's verified domain, so an empty From would fail every send."
                    exit 1
                  fi

                  # The prelude. base64 for the two secret-derived values so they can
                  # sit in a Python string literal whatever characters they contain,
                  # and so the key never appears in plaintext even in this pod's
                  # memory-resident script. Everything goes over STDIN, never argv.
                  {
                    printf 'HOST = "%s"\n'  "$SMTP_HOST"
                    printf 'PORT = "%s"\n'  "$SMTP_PORT"
                    printf 'USER = "%s"\n'  "$SMTP_USER"
                    printf 'MAGIC = "%s"\n' "$PLANE_ENABLE_MAGIC_LINK"
                    printf 'FROM_B64 = "%s"\n' \
                      "$(printf '%s <%s>' "$EMAIL_FROM_NAME" "$EMAIL_FROM" | base64 | tr -d '\n')"
                    printf 'PW_B64 = "%s"\n' \
                      "$(printf '%s' "$SMTP_PASSWORD" | base64 | tr -d '\n')"
                    cat /script/reconcile.py
                  } | kubectl exec -i "$POD" -c plane-api -- python manage.py shell

                  # `manage.py shell` with no -c execs whatever arrives on a non-tty
                  # STDIN, and a SystemExit raised inside it propagates out as the
                  # exec's exit code — VERIFIED against this pod on 2026-08-20, so
                  # every FATAL above really does fail the Job. `set -e` on a pipeline
                  # takes the exit status of the LAST command, which is the exec.
