# Fail-loud guard for Plane's required secrets — the SECOND half of the contract in
# gitops/services/APP-SECRETS.md ("New apps: secret schema is MANDATORY").
#
# WHY A CRONJOB AND NOT AN initContainer
# --------------------------------------
# The platform rule asks for an `assert-secrets` initContainer on the app's own pod
# (as nextcloud has, via the chart's `nextcloud.extraInitContainers`). chart 1.6.2
# offers NO such seam: its per-service values are exactly {replicas, image,
# pullPolicy, cpu/memory Request/Limit, assign_cluster_ip, labels, annotations,
# nodeSelector, tolerations, affinity} — no extraInitContainers, no extraEnv, no
# podSpec passthrough (verified against the chart's values.yaml and all eight
# workload templates). There is nowhere to inject a container into the Plane pods
# without forking the chart.
#
# So the assertion runs beside them instead, on the same Secrets, on a schedule:
#   - guard 1 (KEY ABSENT IN OPENBAO) is unaffected — every required key is declared
#     per-key in externalsecrets.yaml, so ESO reports SecretSyncedError immediately
#     and `doctor.sh` fails on it.
#   - guard 2 (KEY PRESENT BUT EMPTY) is what this Job covers. It exits non-zero
#     with `MISSING REQUIRED SECRET: <key>`, which makes the Job fail — picked up by
#     the Axiom "CronJob/backup failed" monitor and routed by the
#     alerts owner annotation below.
# The trade-off, stated honestly: detection is within 15 minutes rather than at pod
# start, and it does not PREVENT a blank-env boot the way an initContainer would.
# Revisit if the chart ever grows an extraInitContainers key.
#
# NOTE on the assertion style: kubelet expands command strings, so each key is
# asserted LITERALLY with ${VAR:-}. An `eval v=\$$k` loop reaches sh as `v=$k` (the
# key NAME, always non-empty) and would never fire — the same trap documented on
# nextcloud's initContainer.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: plane-assert-secrets
  annotations:
    alerts/owner: ops@WLDOMAIN
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      # No retry: a missing secret does not fix itself within a Job's lifetime, and
      # a single failed Job is the signal we want.
      backoffLimit: 0
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels: { app: plane-assert-secrets }
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: assert
              image: WLREGISTRY/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { cpu: 100m, memory: 64Mi }
              envFrom:
                # The EXACT two Secrets the api/worker/beat-worker consume, so this
                # asserts what they will actually receive — not a re-declaration
                # that could drift from it.
                - secretRef: { name: plane-app-secrets, optional: false }
                - secretRef: { name: plane-doc-store, optional: false }
              command:
                - sh
                - -c
                - '[ -n "${SECRET_KEY:-}" ] || { echo "MISSING REQUIRED SECRET: SECRET_KEY" >&2; exit 1; }; [ -n "${LIVE_SERVER_SECRET_KEY:-}" ] || { echo "MISSING REQUIRED SECRET: LIVE_SERVER_SECRET_KEY" >&2; exit 1; }; [ -n "${DATABASE_URL:-}" ] || { echo "MISSING REQUIRED SECRET: DATABASE_URL" >&2; exit 1; }; [ -n "${REDIS_URL:-}" ] || { echo "MISSING REQUIRED SECRET: REDIS_URL" >&2; exit 1; }; [ -n "${AMQP_URL:-}" ] || { echo "MISSING REQUIRED SECRET: AMQP_URL" >&2; exit 1; }; [ -n "${AWS_ACCESS_KEY_ID:-}" ] || { echo "MISSING REQUIRED SECRET: AWS_ACCESS_KEY_ID" >&2; exit 1; }; [ -n "${AWS_SECRET_ACCESS_KEY:-}" ] || { echo "MISSING REQUIRED SECRET: AWS_SECRET_ACCESS_KEY" >&2; exit 1; }; [ -n "${AWS_S3_BUCKET_NAME:-}" ] || { echo "MISSING REQUIRED SECRET: AWS_S3_BUCKET_NAME" >&2; exit 1; }; echo secrets-ok'
