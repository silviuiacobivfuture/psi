# SEB piece `plane-platform` (Argo Application `plane-platform`): Plane's own objects —
# database, queue, cache, secrets, Ingress, reconcile jobs. The chart is the piece `plane`.
# Delivered in the SEB bundle, rendered at build time (tools/bundle/build.mjs). This is the
# dev rendering: env-specific values (the hostname, the S3 bucket, the barman
# destinationPath) sit in the base manifests.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: plane
resources:
  - base
# Whitelabel: hosts are written `<prefix>.WLDOMAIN` and the owner address `ops@WLDOMAIN`;
# the values come from the estate identity through the `whitelabel` component
# (SEB's components/whitelabel, generated by the bundle builder from the estate identity).
components:
  - ../../components/whitelabel
  # What is the estate's own and not a setting: its layer, ../../components/estate/plane-platform
  # (Plane's e-mail sender, the ExternalSecret `email-sender`, GENERATED by
  # apps/plunk-sso/bin/email-sync.mjs from the estate's sender declaration).
  - ../../components/estate/plane-platform
configMapGenerator:
  # local-config, never rendered: the sign-in host resolved once, so the sign-out URL can
  # take it whole at its position after `https://` (see the replacements below).
  - name: sign-in-host
    literals: [HOST=auth.WLDOMAIN]
    options:
      disableNameSuffixHash: true
      annotations: { config.kubernetes.io/local-config: "true" }
  - name: backup-bucket # local-config, never rendered: see the bucket replacements below
    literals: [BUCKET=WLBUCKET-tfstate-dev]
    options:
      disableNameSuffixHash: true
      annotations: { config.kubernetes.io/local-config: "true" }
replacements:
  - path: whitelabel-replacements.yaml
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.BASE_DOMAIN }
    targets:
      - select: { kind: Ingress }
        fieldPaths: [spec.rules.*.host, spec.tls.*.hosts.*]
        options: { delimiter: ".", index: 1 }
      - select: { kind: CronJob, name: plane-smtp-reconcile }
        fieldPaths:
          - "spec.jobTemplate.spec.template.spec.containers.*.env.[name=SMTP_HOST].value"
        options: { delimiter: ".", index: 1 }
      - select: { kind: ConfigMap, name: sign-in-host }
        fieldPaths: [data.HOST]
        options: { delimiter: ".", index: 1 }
      - select: { kind: ExternalSecret, name: plane-app-secrets }
        fieldPaths:
          - "spec.target.template.data.WEB_URL"
          - "spec.target.template.data.CORS_ALLOWED_ORIGINS"
          - "spec.target.template.data.ADMIN_BASE_URL"
          - "spec.target.template.data.SPACE_BASE_URL"
        options: { delimiter: ".", index: 1 }
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.OPS_EMAIL }
    targets:
      - select: { annotationSelector: alerts/owner }
        fieldPaths: [metadata.annotations.alerts/owner]
      - select: { kind: ExternalSecret, name: plane-app-secrets }
        fieldPaths: [spec.target.template.data.PLANE_SSO_ADMIN_EMAIL]
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.BRAND_TITLE }
    targets:
      - select: { kind: ExternalSecret, name: plane-app-secrets }
        fieldPaths: [spec.target.template.data.PLANE_SSO_BRAND]
  # The hub link carries its Ingress's host (resolved above), so a path stays intact.
  - source: { kind: Ingress, name: plane, fieldPath: spec.rules.0.host }
    targets:
      - select: { kind: Ingress, name: plane }
        fieldPaths: ["metadata.annotations.[gethomepage.dev/href]"]
        options: { delimiter: "/", index: 2 }
  # The pull secret names the registry as `WLREGISTRY`: REGISTRY_HOST, at the auths key.
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.REGISTRY_HOST }
    targets:
      - select: { kind: ExternalSecret, name: harbor-pull }
        fieldPaths: ["spec.target.template.data.[.dockerconfigjson]"]
        options: { delimiter: '"', index: 3 }
  # Buckets are written `WLBUCKET-<use>-<env>`. `backup-bucket` is a local-config ConfigMap
  # (never rendered) that resolves this environment's backup bucket once, so a path can take
  # it whole at its position after `s3://`.
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.BUCKET_PREFIX }
    targets:
      - select: { kind: ConfigMap, name: backup-bucket }
        fieldPaths: [data.BUCKET]
        options: { delimiter: "-", index: 0 }
      - select: { kind: ExternalSecret, name: plane-doc-store }
        fieldPaths: [spec.target.template.data.AWS_S3_BUCKET_NAME]
        options: { delimiter: "-", index: 0 }
  - source: { kind: ConfigMap, name: backup-bucket, fieldPath: data.BUCKET }
    targets:
      - select: { kind: Cluster, name: plane-db }
        fieldPaths: [spec.backup.barmanObjectStore.destinationPath]
        options: { delimiter: "/", index: 2 }
  - source: { kind: ConfigMap, name: sign-in-host, fieldPath: data.HOST }
    targets:
      - select: { kind: ExternalSecret, name: plane-app-secrets }
        fieldPaths: [spec.target.template.data.PLANE_SSO_SIGNOUT_URL]
        options: { delimiter: "/", index: 2 }
# The alert annotation is written `alerts/owner` (value OPS_EMAIL, above); its key becomes
# alerts.<label domain>/owner here.
transformers:
  - ../../components/alert-owner
