# plunk-sso — our Authentik sign-in for Plunk (apps/plunk-sso; read its
# CLAUDE.md before changing anything here). Runs OUR image: upstream Plunk plus
# /app/plunk-sso, which imports Plunk's own compiled modules (session signing,
# cookie options, memberships), so it needs exactly Plunk's env.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plunk-sso
  labels:
    app.kubernetes.io/name: plunk-sso
  annotations:
    reloader.stakater.com/auto: "true"
    alerts/owner: WLOPSEMAIL
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plunk-sso
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plunk-sso
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 65533
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: assert-secrets
          image: WLREGISTRY/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
          envFrom:
            - secretRef: { name: plunk-app }
          env:
            - name: AUTHENTIK_API_TOKEN
              valueFrom: { secretKeyRef: { name: plunk-sso-directory, key: token } }
          command: ["sh", "-c"]
          args:
            - |
              for k in JWT_SECRET DATABASE_URL REDIS_URL AWS_SES_ACCESS_KEY_ID AWS_SES_SECRET_ACCESS_KEY AUTHENTIK_API_TOKEN; do
                eval "v=\${$k:-}"
                [ -n "$v" ] || { echo "MISSING REQUIRED SECRET: $k" >&2; exit 1; }
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 32Mi }
      containers:
        - name: plunk-sso
          image: WLREGISTRY/WLAPPS/plunk-sso:0.17.0-6707e4b@sha256:0f60973bceec244e2165124e1a8a2399448ed8fc6702b7155a8a5b0758eca2a5
          envFrom:
            - secretRef: { name: plunk-app }
            # plunk-bootstrap.sh runs the reconcile in THIS container (kubectl
            # exec), so it carries the inbound tokens as the CronJob does.
            - secretRef: { name: plunk-inbound, optional: true }
          env:
            # Each sign-in and session check reads the person's groups from the directory
            # (lib/directory.mjs).
            - name: AUTHENTIK_API_TOKEN
              valueFrom: { secretKeyRef: { name: plunk-sso-directory, key: token } }
            - { name: AUTHENTIK_API_URL, value: "http://authentik-server.authentik.svc.cluster.local:80" }
            - { name: NODE_ENV, value: production }
            # What Plunk's entrypoint derives for its own processes; plunk-sso
            # imports Plunk's modules, which read them (cookie domain, origins).
            - { name: API_URI, value: https://plunk-api.WLDOMAIN }
            - { name: DASHBOARD_URI, value: https://plunk.WLDOMAIN }
            - { name: LANDING_URI, value: https://plunk.WLDOMAIN }
            - { name: WIKI_URI, value: https://plunk.WLDOMAIN }
            - { name: MAIL_FROM_SUBDOMAIN, value: bounce }
            # Where a sign-in is CONFIRMED: the outpost endpoint Traefik's
            # forward-auth asks, in-cluster. Never the public host.
            - { name: PLUNK_SSO_VERIFY_URL, value: "http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik" }
            # nginx's default_server is the API, so the plain Service reaches it.
            - { name: PLUNK_INTERNAL_API, value: "http://plunk.plunk.svc.cluster.local" }
            - { name: PLUNK_SSO_PROJECTS, value: /app/plunk-sso/config/senders.json }
          volumeMounts:
            - { name: senders, mountPath: /app/plunk-sso/config, readOnly: true }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { cpu: 500m, memory: 384Mi }
      volumes:
        - name: senders
          configMap: { name: plunk-senders }
---
apiVersion: v1
kind: Service
metadata:
  name: plunk-sso
  labels:
    app.kubernetes.io/name: plunk-sso
spec:
  selector:
    app.kubernetes.io/name: plunk-sso
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# Projects as code + the SES gate (apps/plunk-sso/lib/reconcile.mjs). A fresh pod
# every run, so it always reads the current Secret (no Reloader needed). Its
# stdout is one summary line — no keys (only plunk-bootstrap.sh asks for those).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: plunk-reconcile
  annotations:
    alerts/owner: WLOPSEMAIL
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels: { app.kubernetes.io/name: plunk-reconcile }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          imagePullSecrets:
            - name: harbor-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 65533
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: reconcile
              image: WLREGISTRY/WLAPPS/plunk-sso:0.17.0-6707e4b@sha256:0f60973bceec244e2165124e1a8a2399448ed8fc6702b7155a8a5b0758eca2a5
              command: ["node", "/app/plunk-sso/bin/reconcile.mjs"]
              envFrom:
                - secretRef: { name: plunk-app }
                # Every receiving sender's hand-over token (GENERATED
                # inbound.generated.yaml); the reconcile refuses BY NAME when a
                # declared one is missing, so optional here costs nothing silent.
                - secretRef: { name: plunk-inbound, optional: true }
              # The same env as the Deployment above (YAML anchors do not cross documents).
              env:
                - { name: NODE_ENV, value: production }
                # What Plunk's entrypoint derives for its own processes; plunk-sso
                # imports Plunk's modules, which read them (cookie domain, origins).
                - { name: API_URI, value: https://plunk-api.WLDOMAIN }
                - { name: DASHBOARD_URI, value: https://plunk.WLDOMAIN }
                - { name: LANDING_URI, value: https://plunk.WLDOMAIN }
                - { name: WIKI_URI, value: https://plunk.WLDOMAIN }
                - { name: MAIL_FROM_SUBDOMAIN, value: bounce }
                # Where a sign-in is CONFIRMED: the outpost endpoint Traefik's
                # forward-auth asks, in-cluster. Never the public host.
                - { name: PLUNK_SSO_VERIFY_URL, value: "http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik" }
                # nginx's default_server is the API, so the plain Service reaches it.
                - { name: PLUNK_INTERNAL_API, value: "http://plunk.plunk.svc.cluster.local" }
                - { name: PLUNK_SSO_PROJECTS, value: /app/plunk-sso/config/senders.json }
              volumeMounts:
                - { name: senders, mountPath: /app/plunk-sso/config, readOnly: true }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
              resources:
                requests: { cpu: 20m, memory: 96Mi }
                limits: { cpu: 500m, memory: 384Mi }
          volumes:
            - name: senders
              configMap: { name: plunk-senders }
---
# The read-only directory token (view_user + view_group). Per key, so an empty slot is
# SecretSyncedError; authentik-plunk-sso-token-reconcile fills it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plunk-sso-directory
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: plunk-sso-directory, creationPolicy: Owner }
  data:
    - secretKey: token
      remoteRef: { key: platform/authentik/plunk-sso-api-token, property: token }
