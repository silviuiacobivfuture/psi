# Plunk's runtime secrets, synced from OpenBao by ESO. Values live ONLY in
# OpenBao (seeded by infrastructure/hetzner/scripts/seed-secrets.sh); these
# manifests hold the MAPPING. Contract: gitops/services/APP-SECRETS.md (plunk).
#
# Every property is a per-key `data[]` entry (no bare dataFrom.extract): an
# absent property makes the ExternalSecret SecretSyncedError — loud — instead of
# a Secret that boots Plunk with a blank DATABASE_URL.
#
# THE SES SLOT (the owner's key has been in it since 2026-11-03; the decision, stated):
#   secret/platform/ses/admin {access_key_id, secret_access_key, region} — the
#   owner's ONE AWS credential (SES + the SNS topic + the receiving bucket; IAM
#   policy: infrastructure/hetzner/environments/ses/iam-policy.json). A PLATFORM
#   path: OpenTofu (environments/ses) reads the same credential. Seeded as an
#   EMPTY slot (seed-secrets.sh seed_plunk; the same "empty slot" precedent as
#   OPENFGA_STORE_ID and the Convex admin_key). Both fields are DECLARED here, so
#   a path without them is still SecretSyncedError. But Plunk 0.17.0 refuses to
#   START with an empty AWS_SES_* (apps/api app/constants.ts validateEnv throws),
#   and a crash-looping Plunk is not "inert". So an empty slot renders the NAMED
#   sentinel `ses-not-configured` — never a random string, never a real-looking
#   key — and PLUNK_SES_CONFIGURED=false. That flag is what keeps sending OFF:
#   the plunk-reconcile CronJob holds every project disabled (Plunk's own 403
#   PROJECT_DISABLED on every send), and doctor.sh WARNs, naming the command that
#   fills the slot. Filling it flips the flag, Reloader restarts Plunk with the
#   real key, and the next reconcile lifts the gate. Nothing is ever sent with
#   the sentinel: AWS rejects it (InvalidClientTokenId) even if the gate were gone.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plunk-app
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: plunk-app
    creationPolicy: Owner
    template:
      # With a template present ESO emits ONLY these keys; the passwords exist in
      # the pods solely inside the DSNs.
      data:
        # Signs every dashboard session (and the sessions plunk-sso mints).
        # Rotating it signs everybody out — harmless, so it may rotate.
        JWT_SECRET: "{{ .jwt_secret }}"
        # plunk-db-rw is the CNPG read/write Service. No PgBouncer here, so the
        # direct URL (Prisma migrations) is the same DSN. bao_gen passwords are
        # [A-Za-z0-9] — URL-safe without encoding.
        DATABASE_URL: "postgresql://{{ .db_username }}:{{ .db_password }}@plunk-db-rw.plunk.svc.cluster.local:5432/plunk"
        DIRECT_DATABASE_URL: "postgresql://{{ .db_username }}:{{ .db_password }}@plunk-db-rw.plunk.svc.cluster.local:5432/plunk"
        # No trailing slash: Plunk appends "?family=0" itself (database/redis.ts).
        REDIS_URL: "redis://:{{ .redis_password }}@plunk-redis.plunk.svc.cluster.local:6379"
        AWS_SES_ACCESS_KEY_ID: '{{ .ses_access_key_id | default "ses-not-configured" }}'
        AWS_SES_SECRET_ACCESS_KEY: '{{ .ses_secret_access_key | default "ses-not-configured" }}'
        # An empty slot falls back to the estate's SES_REGION (the identity): the
        # token WLSESREGION is filled by the piece's replacements (../kustomization.yaml).
        AWS_SES_REGION: '{{ .ses_region | default "WLSESREGION" }}'
        PLUNK_SES_CONFIGURED: '{{ if and .ses_access_key_id .ses_secret_access_key }}true{{ else }}false{{ end }}'
  data:
    - secretKey: jwt_secret
      remoteRef: { key: apps/plunk/app, property: jwt_secret }
    - secretKey: db_username
      remoteRef: { key: apps/plunk/db, property: username }
    - secretKey: db_password
      remoteRef: { key: apps/plunk/db, property: password }
    - secretKey: redis_password
      remoteRef: { key: apps/plunk/redis, property: password }
    - secretKey: ses_access_key_id
      remoteRef: { key: platform/ses/admin, property: access_key_id }
    - secretKey: ses_secret_access_key
      remoteRef: { key: platform/ses/admin, property: secret_access_key }
    - secretKey: ses_region
      remoteRef: { key: platform/ses/admin, property: region }
---
# The Postgres application role. CNPG CONSUMES this (bootstrap.initdb.secret), so
# OpenBao is the credential's source of truth and a rebuild restores a database
# whose role password still matches (same reasoning as plane-db-app).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plunk-db-app
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: plunk-db-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef: { key: apps/plunk/db, property: username }
    - secretKey: password
      remoteRef: { key: apps/plunk/db, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plunk-redis
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: plunk-redis, creationPolicy: Owner }
  data:
    - secretKey: redis-password
      remoteRef: { key: apps/plunk/redis, property: password }
---
# barman's WAL archive + the pg_dump uploader: the SHARED platform object-storage
# credential, the platform bucket — the same as plane-backup-s3.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plunk-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: plunk-backup-s3, creationPolicy: Owner }
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
---
# plunk-sso is OUR image on Harbor (private). Same composed pull secret as every
# service; attached by the Deployment/CronJob themselves (imagePullSecrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: harbor-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"WLREGISTRY":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: platform/harbor/pull, property: username }
    - secretKey: password
      remoteRef: { key: platform/harbor/pull, property: password }
