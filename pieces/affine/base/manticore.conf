# Manticore's whole configuration (manticore.yaml runs searchd with it). HTTP only, on 9308,
# the port AFFiNE's indexer calls: no MySQL protocol, no replication port. Telemetry off.
# threads bounds the worker pool (and Buddy's, which takes the same number) instead of one per
# core of whichever node the pod lands on.
searchd {
    listen = 9308:http
    log = /var/log/manticore/searchd.log
    pid_file = /var/run/manticore/searchd.pid
    data_dir = /var/lib/manticore
    threads = 4
    telemetry = 0
}
