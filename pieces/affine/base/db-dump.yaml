# The 6-hourly logical dump of affine-db — the copy that restores without the
# operator (layer 2 of cnpg-cluster.yaml's durability note). Same recipe as
# pieces/db-backup/plane-db-dump.yaml, kept HERE rather than in the
# db-backup app: that app syncs into other namespaces, and a CronJob there
# naming a namespace this app has not created yet would fail its whole sync on
# the first rollout. Restore: the newest db-dumps/affine/affine-<UTC>.sql.gz, gunzipped into
# psql against an empty affine-db (the restore-plunk-db.sh recipe).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: affine-db-dump
  annotations:
    alerts/owner: WLOPSEMAIL
spec:
  # :25 — offset from every other dump (plane :10, nextcloud :05, plunk :20, …).
  schedule: "25 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 43200
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels: { app: affine-db-dump }
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            fsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          volumes:
            - name: work
              emptyDir: {}
          initContainers:
            - name: dump
              image: WLREGISTRY/mirror/docker.io/library/postgres:17-alpine@sha256:e4cb93687b062cd25a0e8f672d85a7708235009d70d31f8a7698d9370092a9c4
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities: { drop: ["ALL"] }
                seccompProfile: { type: RuntimeDefault }
              env:
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: affine-db-app, key: password } }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: "1", memory: 512Mi }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  pg_dump -h affine-db-rw -p 5432 -U affine -d affine | gzip -c > /work/affine.sql.gz
                  sz=$(wc -c < /work/affine.sql.gz); [ "$sz" -gt 1000 ] || { echo "FATAL: affine dump too small ($sz bytes) — connection/auth failed" >&2; exit 1; }
              volumeMounts:
                - { name: work, mountPath: /work }
          containers:
            - name: upload
              image: WLREGISTRY/mirror/docker.io/amazon/aws-cli:2.17.0@sha256:7b7edf789765c22d75e61ad6f307c06950e15357b79ea1749104641ce3a11fec
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities: { drop: ["ALL"] }
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: affine-backup-s3, key: AWS_ACCESS_KEY_ID } }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: affine-backup-s3, key: AWS_SECRET_ACCESS_KEY } }
                - { name: AWS_REGION, value: WLREGION }
                - { name: AWS_ENDPOINT_URL, value: WLENDPOINT }
                - { name: AWS_S3_ADDRESSING_STYLE, value: path }
                - { name: BUCKET, value: WLBUCKET-tfstate-dev }
                - { name: PREFIX, value: db-dumps/affine }
                - { name: HOME, value: /work }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 250m, memory: 256Mi }
              volumeMounts:
                - { name: work, mountPath: /work }
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  test -s /work/affine.sql.gz || { echo "FATAL: dump missing/empty" >&2; exit 1; }
                  export AWS_REQUEST_CHECKSUM_CALCULATION=when_required
                  export AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
                  KEY="${PREFIX}/affine-${TS}.sql.gz"
                  aws s3 cp /work/affine.sql.gz "s3://${BUCKET}/${KEY}" --endpoint-url "$AWS_ENDPOINT_URL"
                  echo "DB dump uploaded: s3://${BUCKET}/${KEY}"
                  KEEP=20
                  aws s3 ls "s3://${BUCKET}/${PREFIX}/" --endpoint-url "$AWS_ENDPOINT_URL" \
                    | awk '{print $4}' | grep -E '^affine-.*\.sql\.gz$' | sort -r | tail -n +$((KEEP + 1)) \
                    | while read -r f; do aws s3 rm "s3://${BUCKET}/${PREFIX}/${f}" --endpoint-url "$AWS_ENDPOINT_URL"; done || true
