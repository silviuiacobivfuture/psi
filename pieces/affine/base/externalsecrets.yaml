# AFFiNE's runtime secrets, synced from OpenBao by ESO. Values live ONLY in OpenBao (seeded by
# infrastructure/hetzner/scripts/seed-secrets.sh, seed_affine); these manifests hold the
# MAPPING. Contract: gitops/services/APP-SECRETS.md (affine).
#
# Every property is a per-key `data[]` entry (no bare dataFrom.extract): an absent property
# makes the ExternalSecret SecretSyncedError — loud — instead of a Secret that boots AFFiNE
# with a blank key. The pods' assert-secrets init container names any key still empty.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-app
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: affine-app
    creationPolicy: Owner
    template:
      # With a template present ESO emits ONLY these keys.
      data:
        # affine-db-rw is the CNPG read/write Service. seed passwords are [A-Za-z0-9] —
        # URL-safe without encoding.
        DATABASE_URL: "postgresql://{{ .db_username }}:{{ .db_password }}@affine-db-rw.affine.svc.cluster.local:5432/affine"
        REDIS_SERVER_PASSWORD: "{{ .redis_password }}"
        # Signs every session and encrypts what AFFiNE stores encrypted. An EC P-256 key
        # (PEM), made on the host by seed_affine. Rotating it signs everybody out.
        AFFINE_PRIVATE_KEY: "{{ .private_key }}"
        # The `affine-oidc` client in the estate's Authentik: the SAME OpenBao path the
        # directory reads (authentik-affine-oidc), so the two ends cannot drift.
        OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        # The estate's object storage credential (the shared platform one, as Novu's and
        # ReportPortal's buckets): AFFiNE's own bucket, <BUCKET_PREFIX>-affine-<env>.
        S3_ACCESS_KEY_ID: "{{ .s3_access_key_id }}"
        S3_SECRET_ACCESS_KEY: "{{ .s3_secret_access_key }}"
  data:
    - secretKey: db_username
      remoteRef: { key: apps/affine/db, property: username }
    - secretKey: db_password
      remoteRef: { key: apps/affine/db, property: password }
    - secretKey: redis_password
      remoteRef: { key: apps/affine/redis, property: password }
    - secretKey: private_key
      remoteRef: { key: apps/affine/app, property: private_key }
    - secretKey: oidc_client_id
      remoteRef: { key: platform/authentik/affine-oidc, property: client_id }
    - secretKey: oidc_client_secret
      remoteRef: { key: platform/authentik/affine-oidc, property: client_secret }
    - secretKey: s3_access_key_id
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: s3_secret_access_key
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
---
# The instance's FIRST account (first-admin.yaml): the estate operator's address and a
# password nobody is given. It exists so the setup page that hands the instance to whoever
# opens it first never does; the operator signs in through Authentik and lands on this
# account (AFFiNE matches an Authentik sign-in to an account by its e-mail). Break-glass
# only: the password is read from OpenBao by a person, never shown anywhere else.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-first-admin
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: affine-first-admin, creationPolicy: Owner }
  data:
    - secretKey: ADMIN_PASSWORD
      remoteRef: { key: apps/affine/app, property: admin_password }
---
# The Postgres application role. CNPG CONSUMES this (bootstrap.initdb.secret), so OpenBao is
# the credential's source of truth and a rebuild restores a database whose role password
# still matches (same reasoning as plunk-db-app).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-db-app
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: affine-db-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef: { key: apps/affine/db, property: username }
    - secretKey: password
      remoteRef: { key: apps/affine/db, property: password }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-redis
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: affine-redis, creationPolicy: Owner }
  data:
    - secretKey: redis-password
      remoteRef: { key: apps/affine/redis, property: password }
---
# barman's WAL archive + the pg_dump uploader: the SHARED platform object-storage
# credential, the platform bucket — the same as plunk-backup-s3.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: affine-backup-s3, creationPolicy: Owner }
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
