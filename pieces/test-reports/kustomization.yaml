# SEB piece `test-reports`: every CI run's business-rule outcome, kept and served.
# Delivered in the SEB bundle, rendered at build time (tools/bundle/build.mjs).
# The service's Python (base/app/) is shipped byte-for-byte as it runs: kustomize hashes it
# into the ConfigMap name, so any edit there restarts the pod — make such an edit its own
# deliberate change, never part of a migration step.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: test-reports
resources:
  - base
# Whitelabel: hosts are written `<prefix>.WLDOMAIN` and the owner address `ops@WLDOMAIN`;
# the values come from the estate identity through the `whitelabel` component
# (SEB's components/whitelabel, generated by the bundle builder from the estate identity);
# the alert annotation's key from ../../components/alert-owner.
components:
  # Argo's prune/delete guard on the PVCs and CNPG Clusters rendered here (the data).
  - ../../components/prune-guard
  - ../../components/whitelabel
  # The estate's own layer for this piece (empty in SEB; tools/bundle/build.mjs --estate-components).
  - ../../components/estate/test-reports
replacements:
  - path: whitelabel-replacements.yaml
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.BASE_DOMAIN }
    targets:
      - select: { kind: Ingress }
        fieldPaths: [spec.rules.*.host, spec.tls.*.hosts.*]
        options: { delimiter: ".", index: 1 }
      - select: { kind: Deployment, name: test-reports }
        fieldPaths: ["spec.template.spec.containers.[name=test-reports].env.[name=PUBLIC_URL].value"]
        options: { delimiter: ".", index: 1 }
  - source: { kind: ConfigMap, name: whitelabel, fieldPath: data.OPS_EMAIL }
    targets:
      - select: { annotationSelector: alerts/owner }
        fieldPaths: [metadata.annotations.alerts/owner]
# No image tag to bump: the service is stdlib Python on a PINNED upstream image,
# so there is no build, no registry push and no CI hand-off. A code change is a
# change to the files in base/app/, which kustomize rehashes into a new ConfigMap
# name and Argo rolls out. That is the entire deploy path.
#
# No per-overlay host patch either: the base Ingress is already dev-specific
# (tests.WLDOMAIN), matching the convention the other single-env services
# here follow. When prod is built out, the host moves to a patch in each overlay.
  # The hub link carries the Ingress's own host (already resolved above), so a path stays intact.
  - source: { kind: Ingress, name: test-reports, fieldPath: spec.rules.0.host }
    targets:
      - select: { kind: Ingress, name: test-reports }
        fieldPaths: ["metadata.annotations.[gethomepage.dev/href]"]
        options: { delimiter: "/", index: 2 }
transformers:
  - ../../components/alert-owner
