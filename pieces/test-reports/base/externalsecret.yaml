# The ingest bearer, synced from OpenBao into the k8s Secret the Deployment reads
# as env. The value lives ONLY in OpenBao; this manifest holds the mapping.
#
# WHY A PLATFORM PATH, NOT apps/test-reports/env: the token is a SHARED credential
# between two planes — CI presents it, this service verifies it — exactly like
# `platform/talk/webhook`, which the talk-webhook translator and every CI notify
# step share. Seeded by `seed_generated` in
# infrastructure/hetzner/scripts/seed-secrets.sh; the `github-ci` OpenBao policy
# (openbao-bootstrap.sh) grants CI read on this one path and nothing more.
#
# HARD-REQUIRED KEY, declared explicitly under `data[]` rather than left to
# `dataFrom.extract`: a per-key `remoteRef.property` that is ABSENT in OpenBao makes
# this ExternalSecret report SecretSyncedError (loud, visible in
# `kubectl get externalsecret -A`), whereas `extract` would silently sync an empty
# Secret and the service would start rejecting every report with 401 while looking
# perfectly healthy. See gitops/services/APP-SECRETS.md.
#
# The OpenBao field is `token`; it is remapped to the env name the app reads,
# INGEST_TOKEN, so the Deployment needs no per-key indirection of its own.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: test-reports-ingest
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: test-reports-ingest
    creationPolicy: Owner
  data:
    - secretKey: INGEST_TOKEN
      remoteRef:
        key: platform/test-reports/ingest
        property: token
