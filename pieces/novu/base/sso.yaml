# novu-sso — our Authentik sign-in for the Novu dashboard at novu.<apex>
# (apps/novu-sso; read its CLAUDE.md before changing anything here). Runs OUR
# image: Novu's own api image (the pin in api.yaml) plus /usr/src/app/novu-sso,
# which imports Novu's DAL and JwtService. It needs exactly two of Novu's
# secrets — the MongoDB URL and the JWT secret the api verifies sessions with —
# taken key by key, never the whole novu-app Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: novu-sso
  labels:
    app.kubernetes.io/name: novu-sso
  annotations:
    # REQUIRED: JWT_SECRET and MONGO_URL are env, read once at start.
    reloader.stakater.com/auto: "true"
    alerts/owner: WLOPSEMAIL
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: novu-sso
  template:
    metadata:
      labels:
        app.kubernetes.io/name: novu-sso
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: assert-secrets
          image: WLREGISTRY/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
          env:
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: novu-app, key: JWT_SECRET } }
            - name: MONGO_URL
              valueFrom: { secretKeyRef: { name: novu-app, key: MONGO_URL } }
            - name: AUTHENTIK_API_TOKEN
              valueFrom: { secretKeyRef: { name: novu-sso-directory, key: token } }
          command:
            - sh
            - -c
            - '[ -n "${JWT_SECRET:-}" ] || { echo "MISSING REQUIRED SECRET: JWT_SECRET" >&2; exit 1; }; [ -n "${MONGO_URL:-}" ] || { echo "MISSING REQUIRED SECRET: MONGO_URL" >&2; exit 1; }; [ -n "${AUTHENTIK_API_TOKEN:-}" ] || { echo "MISSING REQUIRED SECRET: AUTHENTIK_API_TOKEN" >&2; exit 1; }; echo secrets-ok'
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
            readOnlyRootFilesystem: true
      containers:
        - name: novu-sso
          image: WLREGISTRY/WLAPPS/novu-sso:3.19.0-47841ea@sha256:7c082ad5bec2eed2ccc711d70ffcc4bce8d1684d0b0b9ff67376cfb525399e20
          env:
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: novu-app, key: JWT_SECRET } }
            - name: MONGO_URL
              valueFrom: { secretKeyRef: { name: novu-app, key: MONGO_URL } }
            # Each sign-in reads the person's groups from the directory (lib/directory.mjs).
            - name: AUTHENTIK_API_TOKEN
              valueFrom: { secretKeyRef: { name: novu-sso-directory, key: token } }
            - { name: AUTHENTIK_API_URL, value: "http://authentik-server.authentik.svc.cluster.local:80" }
            - { name: NODE_ENV, value: production }
            - { name: HOME, value: /tmp }
            - { name: MONGO_MIN_POOL_SIZE, value: "1" }
            - { name: MONGO_MAX_POOL_SIZE, value: "5" }
            - { name: DASHBOARD_URI, value: https://novu.WLDOMAIN }
            # Where a sign-in is CONFIRMED: the outpost endpoint Traefik's
            # forward-auth asks, in-cluster. Never the public host.
            - { name: NOVU_SSO_VERIFY_URL, value: "http://authentik-server.authentik.svc.cluster.local:80/outpost.goauthentik.io/auth/traefik" }
            # Sign-out: Authentik's default invalidation flow; ending the
            # Authentik session ends this host's outpost session too (measured;
            # the outpost's own sign_out paths do not — apps/novu-sso server.mjs).
            - { name: NOVU_SSO_SIGNOUT_URL, value: "https://auth.WLDOMAIN/flows/-/default/invalidation/" }
            # The dashboard novu-sso serves, guard added (dashboard.yaml).
            - { name: NOVU_SSO_UPSTREAM, value: "http://novu-dashboard-public.novu.svc.cluster.local:4000" }
            # The estate's organisation and the bootstrap's password account, from the identity
            # (MAIL_SENDER_NAME, OPS_EMAIL; ../kustomization.yaml): mapping.json names no estate.
            - { name: NOVU_SSO_ORGANIZATION, value: WLSENDERNAME }
            - { name: NOVU_SSO_SERVICE_ACCOUNT, value: WLOPSEMAIL }
          # Polaris's data plane, for the accounts an estate declares in its mapping (tenants):
          # who belongs to which, asked of the hub's person lookup and OpenFGA's read port under
          # the pinned model (apps/novu-sso/lib/polaris.mjs). OPTIONAL: an estate that declares no
          # account reads none of it, and novu-sso refuses to start, naming the key, when one is
          # declared and a setting is missing (lib/config.mjs).
          envFrom:
            - secretRef: { name: novu-sso-polaris, optional: true }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: novu-sso
  labels:
    app.kubernetes.io/name: novu-sso
spec:
  selector:
    app.kubernetes.io/name: novu-sso
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# The read-only directory token (view_user + view_group). Per key, so an empty slot is
# SecretSyncedError; authentik-novu-sso-token-reconcile fills it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: novu-sso-directory
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: novu-sso-directory, creationPolicy: Owner }
  data:
    - secretKey: token
      remoteRef: { key: platform/authentik/novu-sso-api-token, property: token }
---
# What novu-sso reads of Polaris for an estate's accounts (apps/novu-sso/lib/polaris.mjs): the
# SAME six values the directory's estate tile policy reads (pieces/platform-secrets/
# authentik-estate-tiles.yaml), from the same paths — one pin, one store, one lookup bearer, moved
# by the estate's pin procedure for both readers. Per key, so a missing one is SecretSyncedError
# by name; mounted OPTIONAL (an estate with no account needs none of it); doctor.sh's "Novu
# tenants" row fails while an estate declares accounts and this Secret is not synced.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: novu-sso-polaris
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target: { name: novu-sso-polaris, creationPolicy: Owner }
  data:
    - secretKey: OPENFGA_URL
      remoteRef: { key: apps/authentik-tiles/autorizare, property: OPENFGA_URL }
    - secretKey: OPENFGA_STORE_ID
      remoteRef: { key: apps/authentik-tiles/autorizare, property: OPENFGA_STORE_ID }
    - secretKey: OPENFGA_MODEL_ID
      remoteRef: { key: apps/authentik-tiles/autorizare, property: OPENFGA_MODEL_ID }
    - secretKey: OPENFGA_TOKEN
      remoteRef: { key: apps/openfga/env, property: OPENFGA_AUTHN_PRESHARED_KEYS }
    - secretKey: HUB_PERSON_LOOKUP_URL
      remoteRef: { key: apps/authentik-tiles/autorizare, property: HUB_PERSON_LOOKUP_URL }
    - secretKey: HUB_PERSON_LOOKUP_TOKEN
      remoteRef: { key: apps/autorizare/hub, property: HUB_PERSON_LOOKUP_TOKEN }
