# MongoDB for Novu — every organization, environment, API key (encrypted with
# STORE_ENCRYPTION_KEY), subscriber, workflow, message and execution record.
#
# Image = the one Novu's own self-hosting compose pins for v3.19.0
# (docker/community/docker-compose.yml: `mongo:8.0.17`). Single node, no replica
# set — the same topology the official compose runs; Novu needs no transactions.
#
# BACKUPS (lifecycle HARD RULE): a 6-hourly `mongodump --archive --gzip` to
# s3://<bucket-prefix>-tfstate-<env>/db-dumps/novu/ (pieces/db-backup/novu-db-dump.yaml),
# restored by infrastructure/hetzner/scripts/restore-novu-db.sh, freshness checked
# by doctor.sh. Velero additionally snapshots the PVC.
#
# STORAGE: local-path, like plane-db and nextcloud-db: free, and a 5Gi dataset
# does not justify a billed Hetzner volume. The cost is node pinning — the PV
# lives on whichever node first scheduled the pod. That is why the dump exists.
#
# NON-ROOT: the official image's entrypoint only uses gosu when started as root;
# started as uid 999 (`mongodb` in the image) with fsGroup 999 it runs mongod
# directly, and the one-time MONGO_INITDB_ROOT_* user creation still works
# because /data/db is group-writable via fsGroup.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: novu-mongodb
  labels:
    app.kubernetes.io/name: novu-mongodb
  annotations:
    # The root credential is injected as env (MONGO_INITDB_ROOT_*). It is applied
    # only on an EMPTY data dir, so a restart after rotation changes nothing inside
    # the database — the annotation is still required by policy and harmless.
    reloader.stakater.com/auto: "true"
    alerts/owner: WLOPSEMAIL
spec:
  serviceName: novu-mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: novu-mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: novu-mongodb
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: assert-secrets
          image: WLREGISTRY/mirror/docker.io/library/busybox:1.37@sha256:7a3ebe5bfd1a4a19797d20b0c0bb39d44393e9a03fd852c0865b0f540d868df0
          envFrom:
            - secretRef: { name: novu-mongodb }
          command:
            - sh
            - -c
            # Literal per-key asserts — kubelet collapses `$$`, so an eval loop
            # would test the key NAME (as every assert-secrets initContainer here does).
            - '[ -n "${MONGO_INITDB_ROOT_USERNAME:-}" ] || { echo "MISSING REQUIRED SECRET: MONGO_INITDB_ROOT_USERNAME" >&2; exit 1; }; [ -n "${MONGO_INITDB_ROOT_PASSWORD:-}" ] || { echo "MISSING REQUIRED SECRET: MONGO_INITDB_ROOT_PASSWORD" >&2; exit 1; }; echo secrets-ok'
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
            readOnlyRootFilesystem: true
      containers:
        - name: mongodb
          image: WLREGISTRY/mirror/docker.io/library/mongo:8.0.17@sha256:f76c917358b2c4ca1272dd160c82a762408e4e35c8174bf0aede36e7423dbf74
          # WiredTiger's cache defaults to 50% of (RAM - 1GB) of the NODE, not of
          # the container limit — on a 32 GB node that is ~15 GB and the pod is
          # OOM-killed under load. Pinned to fit inside the 1Gi limit.
          args: ["--wiredTigerCacheSizeGB", "0.25", "--bind_ip_all"]
          envFrom:
            - secretRef: { name: novu-mongodb }
          env:
            - { name: HOME, value: /tmp }
          ports:
            - { name: mongodb, containerPort: 27017 }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          # tcp for liveness: mongosh is a ~100 MB node process, too heavy to
          # spawn every 15s just to prove the port answers.
          livenessProbe:
            tcpSocket: { port: mongodb }
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'mongosh --quiet --norc -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand(\"ping\").ok" | grep -q 1'
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data/db }
            - { name: configdb, mountPath: /data/configdb }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: configdb
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: novu-mongodb
  labels:
    app.kubernetes.io/name: novu-mongodb
spec:
  selector:
    app.kubernetes.io/name: novu-mongodb
  ports:
    - { name: mongodb, port: 27017, targetPort: mongodb }
