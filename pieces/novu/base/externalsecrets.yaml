# Novu's secrets — every one declared PER KEY (`data[]`, never a bare
# `dataFrom.extract`), so a property missing in OpenBao turns the ExternalSecret
# `SecretSyncedError` instead of syncing a partial Secret (fail-loud HARD RULE,
# gitops/services/APP-SECRETS.md). Values are seeded generate-if-missing by
# infrastructure/hetzner/scripts/seed-secrets.sh (`-- apps/novu --`).
#
# OpenBao paths:
#   secret/apps/novu/app      jwt_secret, store_encryption_key, novu_secret_key
#   secret/apps/novu/mongodb  username, password   (the MongoDB root user)
#   secret/apps/novu/redis    password
#   secret/platform/object-storage/dev  access_key_id, secret_access_key (SHARED)
#
# The passwords come from seed-secrets.sh's `bao_gen`, alphabet [A-Za-z0-9] —
# URL-SAFE, which is what lets MONGO_URL embed the password without
# percent-encoding. Do not widen that alphabet without encoding the DSN below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: novu-app
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: novu-app
    creationPolicy: Owner
    template:
      # With a template present ESO emits ONLY these keys — the fetched data[]
      # names are inputs. Consumed via envFrom by api, worker and ws.
      data:
        # Signs every dashboard session JWT and (in ws) authenticates every
        # socket. api and ws must hold the SAME value — one property, two readers.
        JWT_SECRET: "{{ .jwt_secret }}"
        # AES key for every provider credential Novu stores (integrations, the
        # environment API keys). Novu requires EXACTLY 32 characters
        # (docker/community/.env.example: "Must be exactly 32 characters";
        # libs/application-generic/src/encryption/cipher.ts uses it as an
        # aes-256 key). ROTATING IT orphans every stored credential and every API
        # key — seed-secrets.sh --rotate deliberately does not touch it.
        STORE_ENCRYPTION_KEY: "{{ .store_encryption_key }}"
        NOVU_SECRET_KEY: "{{ .novu_secret_key }}"
        MONGO_URL: "mongodb://{{ .mongo_username }}:{{ .mongo_password }}@novu-mongodb.novu.svc.cluster.local:27017/novu-db?authSource=admin"
        REDIS_PASSWORD: "{{ .redis_password }}"
        # Attachments / uploaded assets. The SHARED platform object-storage
        # credential; the bucket (<bucket-prefix>-novu-<env>, tofu module novu_storage) is
        # this app's own, per the one-bucket-per-app convention.
        AWS_ACCESS_KEY_ID: "{{ .s3_access_key_id }}"
        AWS_SECRET_ACCESS_KEY: "{{ .s3_secret_access_key }}"
  data:
    - secretKey: jwt_secret
      remoteRef: { key: apps/novu/app, property: jwt_secret }
    - secretKey: store_encryption_key
      remoteRef: { key: apps/novu/app, property: store_encryption_key }
    - secretKey: novu_secret_key
      remoteRef: { key: apps/novu/app, property: novu_secret_key }
    - secretKey: mongo_username
      remoteRef: { key: apps/novu/mongodb, property: username }
    - secretKey: mongo_password
      remoteRef: { key: apps/novu/mongodb, property: password }
    - secretKey: redis_password
      remoteRef: { key: apps/novu/redis, property: password }
    - secretKey: s3_access_key_id
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: s3_secret_access_key
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
---
# The MongoDB root user. Read by the database itself (MONGO_INITDB_ROOT_*, applied
# only when /data/db is EMPTY — a later rotation of this path does NOT change the
# user inside an existing database) and by the mongodump CronJob
# (pieces/db-backup/novu-db-dump.yaml). Source of truth is OpenBao so a
# rebuilt cluster restoring a dump still authenticates with the same credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: novu-mongodb
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: novu-mongodb
    creationPolicy: Owner
    template:
      data:
        MONGO_INITDB_ROOT_USERNAME: "{{ .username }}"
        MONGO_INITDB_ROOT_PASSWORD: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef: { key: apps/novu/mongodb, property: username }
    - secretKey: password
      remoteRef: { key: apps/novu/mongodb, property: password }
---
# Redis `requirepass`. The SAME property feeds REDIS_PASSWORD in novu-app above,
# so the server and its three clients cannot drift.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: novu-redis
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: novu-redis
    creationPolicy: Owner
  data:
    - secretKey: redis-password
      remoteRef: { key: apps/novu/redis, property: password }
---
# S3 credential for the mongodump CronJob's upload — the same shared platform
# credential every other db-dump uses, as its own Secret so the dump job never
# mounts Novu's application secrets.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: novu-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: novu-backup-s3
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: platform/object-storage/dev, property: access_key_id }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: platform/object-storage/dev, property: secret_access_key }
---
# novu-sso is OUR image on Harbor (private; apps/novu-sso). Same composed pull
# secret as every service; attached by the Deployment itself (imagePullSecrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-pull
spec:
  refreshInterval: 1h
  secretStoreRef: { name: openbao, kind: ClusterSecretStore }
  target:
    name: harbor-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"WLREGISTRY":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: { key: platform/harbor/pull, property: username }
    - secretKey: password
      remoteRef: { key: platform/harbor/pull, property: password }
