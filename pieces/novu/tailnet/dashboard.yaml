# The FIRST dashboard — https://novu.<tailnet>, the break-glass page that works when Authentik does
# not (../base/ingress-tailnet.yaml). It calls the tailnet api host (novu-api.<tailnet>), so it is
# of use only where a hosted Tailscale tailnet serves both doors: taken only when the estate's
# TAILNET_DOMAIN is a hosted tailnet's (*.ts.net, ../identity-components.json). An estate with no
# hosted tailnet (no mesh at all, or Headscale alone) has no door to it — the bundle builder leaves the
# Tailscale-class Ingresses out there — and renders the piece without this page; its dashboards are
# novu-dashboard-public (novu.<apex>) and, on Headscale, novu-dashboard-net (novu.<mesh>).
# Hardening, image pin and the writable root filesystem: see ../base/dashboard.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: novu-dashboard
  labels: { app.kubernetes.io/name: novu-dashboard }
  annotations:
    alerts/owner: WLOPSEMAIL
    # No Secret is injected here at all, so the require-reloader-annotation
    # precondition does not match; declared "false" so the opt-out is in git.
    reloader.stakater.com/auto: "false"
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: novu-dashboard }
  template:
    metadata:
      labels: { app.kubernetes.io/name: novu-dashboard }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: dashboard
          image: WLREGISTRY/mirror/ghcr.io/novuhq/novu/dashboard:3.19.0@sha256:f9d793ed355fb5c96c012c6f8736f55732d4f4617743f71dc26bced160d4957d
          env:
            - { name: VITE_API_HOSTNAME, value: "https://novu-api.WLTAILNET" }
            - { name: VITE_WEBSOCKET_HOSTNAME, value: "https://novu-ws.WLDOMAIN" }
          ports:
            - { name: http, containerPort: 4000 }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 48Mi }
            limits: { cpu: 200m, memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: novu-dashboard
  labels: { app.kubernetes.io/name: novu-dashboard }
spec:
  selector: { app.kubernetes.io/name: novu-dashboard }
  ports:
    - { name: http, port: 4000, targetPort: http }
