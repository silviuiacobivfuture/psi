apiVersion: apps/v1
kind: Deployment
metadata:
  name: reference
  labels: { app: reference }
spec:
  replicas: 1
  selector:
    matchLabels: { app: reference }
  template:
    metadata:
      labels: { app: reference }
    spec:
      # traefik/whoami is a static Go binary that defaults to root but runs fine as
      # any UID; k3s allows binding :80 unprivileged (ip_unprivileged_port_start=0),
      # verified live. runAsNonRoot satisfies require-run-as-non-root (Enforce).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: reference
          # REGISTRY_HOST is replaced by the estate's registry (kustomization.yaml, whitelabel).
          image: REGISTRY_HOST/mirror/docker.io/traefik/whoami:v1.10.4@sha256:02d8fe035f170f91cbb5e458a57f4cefab747436f8244a0eb2d66785fe5e565f
          # disallow-privileged: block setuid-style privilege gain.
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 20
