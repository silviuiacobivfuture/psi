# SEB piece `kyverno` — Kyverno, the Kubernetes-native policy engine (admission control +
# background audit): its controllers and its (large) CRDs. Stateless; the estate's ClusterPolicies
# are a separate Application (`kyverno-policies`), not part of this piece.
#
# SAFETY: the chart's default config.resourceFilters exclude kube-system, kube-public,
# kube-node-lease, Nodes and Kyverno's own resources from the webhook, so the admission webhook
# can NOT brick the control plane on a fresh install. CRDs install by default (crds.install).
#
# A HELM piece (contract seb/tools/bundle/helm-piece.mjs): this file is the Argo CD Application
# TEMPLATE; the chart comes from its upstream repository at the pinned version; values.yaml beside
# it carries the chart values (no estate value in them).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  # Early sync-wave: the Kyverno controllers + CRDs must exist before the ClusterPolicies
  # (Application `kyverno-policies`, wave 0) that depend on those CRDs can reconcile on a fresh
  # cluster.
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: default
  ignoreDifferences:
    # Kyverno re-injects conversion-webhook caBundle + reconciles its own CRD schema/labels.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions: ['.spec.conversion.webhook.clientConfig.caBundle', '.spec.versions[]?.schema', '.metadata.labels', '.metadata.annotations']
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: 3.8.1
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Kyverno CRDs are large → must be server-side applied (client-side apply
      # blows the metadata.annotations size limit).
      - ServerSideApply=true
