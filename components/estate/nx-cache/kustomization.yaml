apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# The ESTATE's additions to the nx-cache piece. SEB adds nothing: this is the default.
# An estate supplies its own directory of the same name to the bundle builder
# (tools/bundle/build.mjs --estate-components <dir>, one sub-directory per piece), which
# replaces this one in the build workdir. What belongs there: the image tag its CI built, e.g.
#   images:
#     - name: WLREGISTRY/WLAPPS/nx-cache-svc
#       newTag: "<tag>"
resources: []
