apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# The ESTATE's additions to the test-reports piece. SEB adds nothing: this is the default.
# An estate supplies its own directory of the same name to the bundle builder
# (tools/bundle/build.mjs --estate-components <dir>, one sub-directory per piece), which
# replaces this one in the build workdir (e.g. to keep its own wording of the app's files
# with a configMapGenerator `behavior: merge` on test-reports-app, so its hash does not move).
resources: []
