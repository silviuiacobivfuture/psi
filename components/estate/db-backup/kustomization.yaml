apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# The ESTATE's additions to the db-backup piece. SEB adds nothing: this is the default.
# An estate supplies its own directory of the same name to the bundle builder
# (tools/bundle/build.mjs --estate-components <dir>, one sub-directory per piece), which
# replaces this one in the build workdir. What belongs there: the dump CronJobs of the estate's
# own databases, same shape as ../../../pieces/db-backup/plane-db-dump.yaml (annotation
# `alerts/owner: OPS_EMAIL`, env AWS_REGION OBJECT_STORAGE_REGION, AWS_ENDPOINT_URL
# OBJECT_STORAGE_ENDPOINT, BUCKET BUCKET_PREFIX-tfstate-<env>: the piece fills them), e.g.
#   resources:
#     - my-app-db-dump.yaml
resources: []
