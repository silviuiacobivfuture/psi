# Scratch values for kustomization.yaml: each patch segment that carries the domain. Never rendered.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-label-source
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  SEGMENT: "source\n  path: /metadata/labels/platform.WLDOMAIN"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-label-managed-by
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  SEGMENT: "managed-by\n  path: /metadata/labels/platform.WLDOMAIN"
